/* ─── Real materials: tokens lifted verbatim from real-l1.html ──────────── */
:root{
  color-scheme: light dark;
  --background: light-dark(rgb(255 255 255), rgb(22 22 24));
  --surface: light-dark(rgb(250 250 251), rgb(28 28 31));
  --foreground: light-dark(rgb(24 26 29), rgb(250 250 252));
  --muted: light-dark(rgb(24 26 29 / 56%), rgb(250 250 252 / 56%));
  --faint: light-dark(rgb(24 26 29 / 38%), rgb(250 250 252 / 38%));
  --card: light-dark(rgb(255 255 255), rgb(32 32 36));
  --border: light-dark(rgb(24 26 29 / 11%), rgb(255 255 255 / 13%));
  --border-strong: light-dark(rgb(24 26 29 / 20%), rgb(255 255 255 / 24%));
  --accent: light-dark(rgb(51 126 255), rgb(131 180 255));
  --ok: light-dark(rgb(0 133 61), rgb(74 200 124));
  --font-sans: -apple-system, system-ui, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px; --wrap: 1160px;
  --hairline: 1px;
  /* One z scale; nothing invents its own number. */
  --z-sticky: 40; --z-pill: 50; --z-skip: 99;
  /* One motion vocabulary, shared by whichever variant actually uses it. */
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-inout: cubic-bezier(0.65, 0, 0.35, 1);
}
@media only screen and (min-resolution: 192dpi){ :root{ --hairline: .5px } }

html{scroll-behavior:smooth}

:focus-visible{outline:2px solid var(--foreground);outline-offset:2px;border-radius:5px}
[id]{scroll-margin-top:76px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 28px}

            display:inline-flex;align-items:center;min-height:44px}

   font-weight:600;text-wrap:balance}
h2{font-size:23px;line-height:1.25;letter-spacing:-.025em;font-weight:600;text-wrap:balance}
.dek{color:var(--muted);font-size:16.5px;max-width:62ch;margin-top:14px;text-wrap:pretty}

         color:var(--faint);margin-bottom:10px}

/* Controls — the design system's own motion: 150ms colour, scale(.96) press.
   Every variant, including "None", keeps exactly this and nothing more. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
     min-height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--border);
     background:var(--card);color:var(--foreground);font:inherit;font-size:13.5px;

     transition-property:background-color,border-color,color,transform;
     transition-duration:150ms;transition-timing-function:ease-out}
.btn::after{content:"";position:absolute;inset:-4px}
.btn:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){ .btn:hover{border-color:var(--border-strong)} }
.btn.pri{background:var(--foreground);color:var(--background);border-color:var(--foreground)}
.btn[data-copied]{color:var(--ok)}
.btn.pri[data-copied]{background:var(--ok);border-color:var(--ok);color:#fff}

              font:16px var(--font-sans);padding:9px 11px;outline:none}

           -ms-overflow-style:none;padding-bottom:2px;position:relative}

.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 11px;
      border-radius:999px;border:1px solid var(--border);background:var(--background);
      color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;position:relative;flex:none;
      transition-property:background-color,border-color,color,transform;
      transition-duration:150ms;transition-timing-function:ease-out}
.chip::after{content:"";position:absolute;inset:-5px}
.chip:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){ .chip:hover{color:var(--foreground);border-color:var(--border-strong)} }
.chip[aria-pressed="true"]{background:var(--foreground);color:var(--background);border-color:var(--foreground)}
.chip small{font:11px/1 var(--font-mono);font-variant-numeric:tabular-nums;opacity:.6}

      font-variant-numeric:tabular-nums;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.meta b{font-weight:500;color:var(--muted)}
.hv{color:var(--ok)}

/* ══════════════════════════════════════════════════════════════════════
   Motion layer — the ONLY thing that changes between the four directions.
   Layout, tokens and structure above this comment are identical in all
   four; nothing below touches layout properties.
   ══════════════════════════════════════════════════════════════════════ */

/* ── 1 · None — the design system's baseline and nothing else ─────────── */
/* No extra rule block: [data-motion="none"] gets only .btn/.chip's 150ms
   colour transitions and :active scale(.96), already declared above. */

/* ── 2 · Reveal — arrival on scroll ─────────────────────────────────────
   IntersectionObserver adds .in; transform+opacity only, ease-out, <200ms,
   ~40ms stagger, once per element (see script). Reduced motion: content is
   simply visible, `.in` is applied on paint, no observer runs. */
[data-motion="reveal"] [data-reveal]{
  opacity:0;
  transform:translateY(10px);
  transition-property:opacity,transform;
  transition-duration:180ms;
  transition-timing-function:var(--ease-out);
}
[data-motion="reveal"] [data-reveal].in{opacity:1;transform:translateY(0)}
@media (prefers-reduced-motion: reduce){
  [data-motion="reveal"] [data-reveal]{opacity:1;transform:none;transition:none}
}

/* ── 3 · Physical — response to a cursor and a thumb ────────────────────
   Press/hover only; nothing plays on its own. */
[data-motion="physical"] .card{
  transition-property:transform;
  transition-duration:150ms;
  transition-timing-function:var(--ease-out);
}
[data-motion="physical"] .card::before{
  /* A shadow that fades in on hover, never a box-shadow that animates
     directly — opacity is compositor-friendly, box-shadow spread is not. */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:0 14px 28px -12px rgb(0 0 0 / .28);opacity:0;
  transition-property:opacity;transition-duration:150ms;transition-timing-function:var(--ease-out);
}
@media (hover:hover) and (pointer:fine){
  [data-motion="physical"] .card:hover{transform:translateY(-3px)}
  [data-motion="physical"] .card:hover::before{opacity:1}
}
[data-motion="physical"] .card:active{transform:translateY(-1px) scale(.99)}

/* The shared-element filter pill: a decorative highlight that slides to
   whichever chip was just toggled, FLIP-animated (transform only). */
[data-motion="physical"] .pill-ghost{
  position:absolute;top:0;left:0;height:34px;border-radius:999px;
  background:var(--foreground);pointer-events:none;
  /* No z-index needed: it is appended after the chips it sits under, and an
     absolutely-positioned element with no z-index still stacks above its
     static/relative siblings in DOM order — adding one would be an invented
     number outside the :root scale for no effect. */
  opacity:0;will-change:transform;
  /* will-change here: the pill is created fresh per click and animates
     immediately, so pre-promoting avoids a dropped first frame (observed
     on the FLIP invert->play handoff in Safari-class engines). */
}
[data-motion="physical"] .pill-ghost.play{
  transition-property:transform,opacity;transition-duration:260ms;transition-timing-function:var(--ease-out);
}

/* Copy button: label swap (baseline) plus an icon that morphs to a check,
   scale+opacity only, never a width change. */
[data-motion="physical"] .copy-ic{position:relative;width:13px;height:13px;flex:none}
[data-motion="physical"] .copy-ic svg{position:absolute;inset:0;transition-property:opacity,transform;
  transition-duration:150ms;transition-timing-function:var(--ease-out)}
[data-motion="physical"] .copy-ic .i-copy{opacity:1;transform:scale(1)}
[data-motion="physical"] .copy-ic .i-check{opacity:0;transform:scale(.5)}
[data-motion="physical"] [data-copied] .copy-ic .i-copy{opacity:0;transform:scale(.5)}
[data-motion="physical"] [data-copied] .copy-ic .i-check{opacity:1;transform:scale(1)}
@media (prefers-reduced-motion: reduce){
  [data-motion="physical"] .card,[data-motion="physical"] .card::before{transition:none}
  [data-motion="physical"] .card:hover{transform:none}
  [data-motion="physical"] .card:hover::before{opacity:0}
  [data-motion="physical"] .pill-ghost{display:none}
  [data-motion="physical"] .copy-ic svg{transition:none}
}

/* ── 4 · Cinematic — what happens between states ────────────────────────
   The grid crossfade+reflow and the per-card shared-element morph are
   driven by the native View Transition API (see script); this block only
   sets the transition's own timing and disables it under reduced motion. */
[data-motion="cinematic"] .card{ view-transition-name: none; }
@media (prefers-reduced-motion: no-preference){
  ::view-transition-group(*){ animation-duration:180ms; animation-timing-function:var(--ease-out) }
  ::view-transition-old(*){ animation-duration:120ms; animation-timing-function:ease-in }
  ::view-transition-new(*){ animation-duration:180ms; animation-timing-function:var(--ease-out) }
}
@media (prefers-reduced-motion: reduce){
  /* Belt and suspenders: even if a VT fires, its default cross-fade is
     opacity-only and near-instant, but we skip it entirely in script too. */
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){ animation:none !important }
}
[data-motion="cinematic"] .chipstrip{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ [data-motion="cinematic"] .chipstrip{scroll-behavior:auto} }
</style>

exture. 85mm for detail. 50mm for natural perspective. 35mm for environmental shots. Controlled dolly and crane movements. Realistic depth of field. Natural focus transitions. Soft motion blur. Subtle lens imperfections. No artificial camera shake. MATERIAL DIRECTION Every surface must visibly behave like physical paper. Visible paper fibers. Natural folds. Tiny imperfections. Soft cardboard edges. Realistic contact shadows. Believable paper thickness. Natural material deformation. LIGHTING Soft morning daylight. Large window as the primary source. Natural bounce light. Gentle shadows. Subtle warm highlights. No artificial neon effects. No excessive visual effects. CONTINUITY The same paper city throughout the entire sequence. Buildings maintain identical shapes and positions. Roads remain connected. Paper materials remain consistent. No random transformations. No flickering. No duplicated structures. No sudden environmental changes. DIRECTOR’S NOTE Treat this as a miniature feature film, not a visual-effects demonstration. The camera should discover the world gradually. Start intimate. Reveal scale. Return to detail. Finish wide. The audience should feel that they are watching a real handcrafted world photographed with a cinema camera. Photorealistic 4K • tactile materials • feature-film cinematography • sophisticated lighting • realistic miniature photography • cinematic depth • precise camera movement • seamless visual continuity.", "models": ["GPT Image", "Seedance"], "uses": [], "styles": ["Cinematic", "Photorealistic"], "techs": ["Camera movement / shot language", "Transition / morph / match cut"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2088865943921528832/img/ACj33PYyBD5RI7qH.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2088865943921528832/img/ACj33PYyBD5RI7qH.jpg?name=small"], "n": 1, "dur": 30, "handle": "@ChillaiKalan__", "likes": 407, "saves": 409, "hv": true, "score": 95.3}, {"id": "2008 ate is giving a bonus to whoever—\" Instant snap zoom to Stanley. His head lifts. He takes off his glasses. Dead serious. STANLEY: \"I'm listening.\" MICHAEL (waving him off): \"—anyway. Moving on. Next topic. Prompt engineering.\" Snap zoom back to Stanley. He immediately puts his glasses back on, lowers his head, and returns to the crossword as if nothing happened. Cut to Jim, who slowly turns his head and looks directly into the camera lens with a flat, knowing expression. Hold for two seconds. STYLE: single-camera sitcom shot like a documentary crew is present, natural performances, no laugh track, muted office color palette, slightly soft consumer-camera look, characters occasionally glancing at the lens.", "models": [], "uses": [], "styles": [], "techs": ["Camera movement / shot language", "Lip sync / dialogue"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2084387230844346368/img/3q3PrcBYVZsGJ3lW.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2084387230844346368/img/3q3PrcBYVZsGJ3lW.jpg?name=small"], "n": 1, "dur": 15, "handle": "@Arminn_Ai", "likes": 446, "saves": 383, "hv": true, "score": 93.6}, {"id": "2085640281941307648", "slug": "montage-multi-shot-candid-observational-foot-2085640281941307648", "title": "Seven-shot handheld observational montage", "prompt": "Montage, multi-shot candid observational footage. Do not use a single camera angle or continuous take. Handheld documentary style with the feeling of accidental real-life capture. Slightly imperfect framing, subtle handheld shake, tiny reframing adjustments, gentle exposure breathing, and autofocus that settles half a beat late. Realistic skin texture, soft indoor natural light, film grain, shallow depth of field. Relaxed breathing, natural blinking, restrained and authentic performance. Total of 7 shots. The woman from @ Image 1 is wearing a matching cotton pajama set consisting of a scoop-neck sleeveless top and loose shorts made from the same fabric and design. Barefoot, she lies on her stomach across a lived-in, slightly messy bed in her bedroom, browsing a mobile shopping page on a black smartphone. A house cat jumps onto the bed seeking attention, and she affectionately plays with it. Moments later, a friend calls. She answers, chats, and eventually bursts into laughter. The doorbell rings, so she ends the call and gets up to collect her dinner. Shot 1 (0–2s): She is already moving. One thumb scrolls through a shopping page while she frowns slightly, thinking. She quietly mutters in Korean: \"아, 뭐 살랬더라…\" (\"Ah... what was I going to buy again?\"). Lips synchronize naturally. Her bare feet gently sway behind her. A low handheld camera glides along the edge of the mattress, with soft bedding partially obscuring the foreground. Shot 2 (2–4s): The house cat jumps onto the bed, compressing the blanket as it walks toward her forearm and lets out a single meow. The camera gives a slight jolt from the impact, then quickly reframes from the phone to an over-the-shoulder view that includes her face, hands, phone, and cat. Shot 3 (4–6s): She turns warmly toward the cat, stroking it once from its forehead to its shoulders. In a gentle, affectionate tone she says: \"우리 애기 왔어?\" (\"Did my baby come?\"). Lip sync is clear and natural. The camera pushes in briefly through the cat's softly blurred foreground toward her face and hand. Shot 4 (6–8s): A friend's ringtone sounds. She glances down, confirms the caller, swipes to answer, and brings the phone to her ear. The camera moves in a loose semicircle from a slightly tilted overhead angle, capturing the entire answering motion. Shot 5 (8–11s): Her friend begins talking. She responds first with confusion, then disbelief: \"어, 왜? 진짜 거짓말.\" (\"Huh? Why? No way, you're kidding.\"). Immediately afterward she naturally bursts into laughter. The cat kneads the blanket beside her. A close handheld side angle keeps both her phone and profile within the same focal plane. Shot 6 (11–13s): A clear doorbell interrupts the laughter. Both she and the cat turn toward the bedroom door. She braces one hand on the mattress to get up. The camera reacts a fraction too late, briefly turning toward the door before naturally correcting back to her rising movement. Shot 7 (13–15s): Still on the phone, she hurriedly says: \"어, 나 밥 왔다. 끊어.\" (\"My food's here. I'll hang up.\"). She ends the call with her thumb, gets off the bed, and walks toward the door while the cat follows across the blankets. The camera slides low beneath her elbow and tilts upward as she stands in one continuous motion. Sound: No music. Only raw production sound: bedding rustling, quiet breathing, finger taps on the phone, the soft impact of the cat jumping onto the bed, one natural meow, faint purring, a single short incoming ringtone, call connection tone, the friend's voice through the phone, the woman's four Korean lines with accurate lip sync, a genuine brief laugh, one clear doorbell, the tap ending the call, and soft cat footsteps. No subtitles, no on-screen text, no logo, no watermark. Never render a reference sheet or duplicate the subject.", "models": ["Seedance"], "uses": ["Food & beverage"], "styles": ["Photorealistic"], "techs": ["Camera movement / shot language", "Lip sync / dialogue", "Multi-shot / storyboard"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2085640247682224128/img/Wj08brZzXojtfWtv.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2085640247682224128/img/Wj08brZzXojtfWtv.jpg?name=small"], "n": 1, "dur": 15, "handle": "@oggii_0", "likes": 297, "saves": 232, "hv": true, "score": 93.6}, {"id": "2047862141894681076", "slug": "a-realistic-young-woman-sitting-casually-in--2047862141894681076", "title": "Bedroom phone recording, late afternoon light", "prompt": "A realistic young woman sitting casually in a softly lit bedroom during late afternoon. She is holding her phone very close to her face rief accidental face cropping, and imperfect framing throughout. The camera itself is never visible. LOOK: Warm analog tape texture with gentle film grain, softened sharpness, subtle halation where sunlight cuts between buildings, faint salt-air haze, realistic skin tones, low contrast, tiny exposure shifts, natural motion blur. Authentic everyday footage, not a polished commercial. STYLE: A quiet Mediterranean morning coffee-run vlog. Unhurried, warm, spontaneous. She talks to the camera in short sentences with comfortable pauses, reacts to the street around her, laughs easily. CHARACTER: ELENA — a Mediterranean woman in her mid-20s. Dark wavy hair in a loose bun, olive skin, minimal makeup, small gold hoops, oversized white linen shirt, denim shorts, leather sandals, canvas tote on one shoulder. SETTING: A sun-washed coastal old town just after sunrise. Narrow limestone alleys, pastel shutters, bougainvillea spilling over walls, glimpses of the sea between buildings, distant church bells and scooters, almost no people. A sleepy stray cat on a warm step. SCENES: The vlog opens in selfie mode as Elena steps out of the doorway into the bright alley, squinting. \"Morning.\" She walks, sunlight strobing between buildings across her face. \"Okay it's already hot. Of course it is.\" She reaches a tiny corner kiosk and orders an iced coffee, camera still handheld, framing half-wrong. She sets the camera on the counter ledge for a wide shot while she waits, drumming her fingers. A stray cat appears at her feet and stares up. She crouches down to it. \"Hi. You again.\" The cat rubs against her leg. She laughs. \"I have a bodyguard now.\" She picks the camera back up, coffee in the other hand, and walks toward the water, the cat trotting behind for a few steps. She sits on the low seawall, sea behind her, and takes the first sip. \"Worth it. Every time.\" She looks off at the water for a moment, hair moving in the breeze, then back to the lens. \"Okay. Work now.\" A small wave. \"See you later.\"", "models": ["Seedance"], "uses": ["Advertising", "Beauty", "Food & beverage", "UGC"], "styles": ["Photorealistic", "Retro / vintage"], "techs": ["Camera movement / shot language"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2087155707795607552/img/GvPt7yiUAlXPgSXk.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2087155707795607552/img/GvPt7yiUAlXPgSXk.jpg?name=small"], "n": 1, "dur": 15, "handle": "@PhedEU", "likes": 133, "saves": 160, "hv": false, "score": 83.9}, {"id": "2089932434351734933", "slug": "use-the-uploaded-reference-image-as-the-exac-2089932434351734933", "title": "Locked product and identity, outfit swapped", "prompt": "Use the uploaded reference image as the exact character and product reference. Preserve the woman’s facial identity, hairstyle, eye color, makeup, skin tone, body proportions, jewelry, and overall appearance consistently throughout the entire video. Change her outfit to a fitted sleeveless PINK top with clean WHITE shorts and keep the outfit identical in every shot. Use the uploaded sunglasses, earbuds, orange retail packaging, and carrying cases as LOCKED product references. Preserve their exact shapes, colors, materials, proportions, buttons, lenses, hinges, charging case, textures, and every visible product detail. Do not redesign, replace, or invent any product elements. Create an ultra-realistic UGC luxury lifestyle review filmed inside a modern luxury bedroom during warm golden hour. The woman is the clear visual focus, with authentic creator energy and natural expressions. Use warm sunlight coming through the bedroom windows, soft realistic shadows, natural skin texture, shallow depth of field, subtle handheld smartphone movement, realistic autofocus behavior, natural motion blur, and premium commercial-quality cinematography. Include a realistic cat naturally interacting with her only where specified, without distracting from the products. 0–5 s /* ── helpers ─────────────────────────────────────────────────────────── */
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const n = v => v == null ? "—" : v.toLocaleString("en-US");
const AXES = { models:"Model", uses:"Task", styles:"Style" };

const asList = (r, key) => Array.isArray(r[key]) ? r[key] : (r[key] == null ? [] : [r[key]]);
function counts(key){
  const m = new Map();
  DATA.forEach(r => asList(r, key).forEach(v => m.set(v, (m.get(v)||0)+1)));
  return [...m].sort((a,b) => b[1]-a[1]);
}
function excerpt(r, len){
  const s = r.prompt.replace(/\s+/g," ").trim();
  return s.length > len ? s.slice(0, len).replace(/\s\S*$/,"") + "…" : s;
}

/* Filter state — shared by every direction; only the motion around it
   changes. */
const state = { q:"", active:{models:[],uses:[],styles:[]}, lastChip:null };
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

function matches(r){
  for (const k in state.active){
    const on = state.active[k];
    if (on.length && !on.some(v => asList(r, k).includes(v))) return false;
  }
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = (r.title+" "+r.prompt+" "+r.models.join(" ")+" "+r.uses.join(" ")+" "+
                 r.styles.join(" ")+" "+(r.handle||"")).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
const results = () => DATA.filter(matches);

function emptyState(){
  return `<div class="empty">
    <b>No prompt matches that yet</b>
    <p>The library has ${DATA.length} prompts. Clear the filters to see all of them, or search for a model name like Seedance.</p>
    <button class="btn pri" data-clear type="button">Clear filters</button>
  </div>`;
}

/* One representative frame per tile, never a repeat. */
function repFrames(key){
  const used = new Set(), out = new Map();
  const tiles = counts(key).map(([v,c]) => ({
    v, c, srcs: DATA.filter(r => asList(r, key).includes(v) && r.img).map(r => r.img)
  })).sort((a,b) => a.srcs.length - b.srcs.length);
  tiles.forEach(t => {
    const pick = t.srcs.find(s => !used.has(s));
    if (pick){ used.add(pick); out.set(t.v, pick); }
  });
  return out;
}

/* ── shared chrome, identical across all four directions ───────────────
   `reveal` gates whether a section carries data-reveal + a stagger index;
   only the "reveal" variant ever passes true. */
function nav(){
  return `<nav class="nav"><div class="wrap">
    <span class="brand">Prompt Library</span>
    <span class="navlinks">
      <a href="#tasks">Tasks</a><a href="#models">Models</a>
      <a href="#styles">Styles</a><a href="#creators">Creators</a>
    </span>
  </div></nav>`;
}

function chipRow(reveal){
  let i = 0;
  return Object.keys(AXES).map(key => `
    <div class="frow"><b>${AXES[key]}</b><div class="chipstrip" data-axis="${key}">${
      counts(key).slice(0, 8).map(([v,c]) => {
        const idx = i++;
        const rv = reveal ? ` data-reveal data-ri="${idx % 8}"` : "";
        return `<button class="chip" type="button" data-facet="${key}" data-value="${esc(v)}"
          aria-pressed="${state.active[key].includes(v)}"${rv}>${esc(v)} <small>${c}</small></button>`;
      }).join("")
    }</div></div>`).join("");
}

/* Card kind badge, matching the vocabulary used across the other L1 directions. */
function kindBadge(r){
  if (r.kind === "video") return r.dur ? `${r.dur}s` : "video";
  if (r.kind === "image") return r.n > 1 ? `${r.n} frames` : "image";
  return "no media";
}

const revealed = new Set(); // ids that have already played their entrance once

function copyBtn(r, extraIconMarkup){
  return `<button class="btn pri" type="button" data-copy="${r.id}">
    ${extraIconMarkup || ""}<span class="copy-label">Copy prompt</span></button>`;
}

function cardsGrid(motion){
  const rows = results();
  if (!rows.length) return emptyState();
  const isPhysical = motion === "physical";
  const isReveal = motion === "reveal";
  const icon = `<span class="copy-ic" aria-hidden="true">
      <svg class="i-copy" viewBox="0 0 16 16" fill="none"><rect x="5" y="5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="2" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.4"/></svg>
      <svg class="i-check" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3.2L13 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>`;
  return `<div class="grid" id="rgrid">${rows.map((r,i) => {
    const seen = revealed.has(r.id);
    const rv = isReveal ? ` data-reveal data-ri="${i % 8}"${seen ? " class=\"in\"" : ""}` : "";
    if (isReveal && !seen) revealed.add(r.id);
    return `<article class="card"${rv} data-id="${r.id}">
      <span class="th">${r.img
        ? `<img src="${esc(r.img)}" alt="Result from ${esc(r.title)}" loading="lazy"
             referrerpolicy="no-referrer" width="280" height="175">`
        : `<span class="noimg">${esc(r.prompt)}</span>`}
        <span class="badge">${esc(kindBadge(r))}</span></span>
      <span class="body">
        <h3>${esc(r.title)}</h3>
        <p class="ptext">${esc(r.prompt)}</p>
        <span class="cardchips">${[...r.models,...r.uses,...r.styles].slice(0,3).map(v=>`<span>${esc(v)}</span>`).join("") || "<span>untagged</span>"}</span>
        <span class="meta cardmeta">${esc(r.handle||"unattributed")}<span><b>${n(r.likes)}</b> likes</span></span>
        <span class="cardact">${copyBtn(r, isPhysical ? icon : "")}<a class="btn" href="#">Read →</a></span>
      </span>
    </article>`;
  }).join("")}</div>`;
}

function band(id, heading, key, reveal){
  const frames = repFrames(key);
  const items = counts(key).filter(([v]) => frames.has(v));
  return `<section class="sec" id="${id}"><div class="wrap">
    <div class="sec-h"><h2>${heading}</h2></div>
    <div class="tiles">${items.map(([v,c],i) => `
      <a class="tile" href="#" data-facet="${key}" data-value="${esc(v)}"${reveal?` data-reveal data-ri="${i%8}"`:""}>
        <span class="th"><img src="${esc(frames.get(v))}" alt="A prompt result from ${esc(v)}"
          loading="lazy" referrerpolicy="no-referrer" width="320" height="200"></span>
        <span class="tb"><h3>${esc(v)}</h3><p>${c} prompts</p></span>
      </a>`).join("")}</div>
  </div></section>`;
}

function catBand(reveal){
  const frames = repFrames("kind");
  const label = { image:"Images", video:"Videos" };
  const items = [["image", DATA.filter(r => r.kind === "image").length],
                 ["video", DATA.filter(r => r.kind === "video").length]];
  return `<section class="sec" id="category"><div class="wrap">
    <div class="sec-h"><h2>Browse by category</h2></div>
    <div class="cat">${items.map(([k,c],i) => `
      <a class="tile" href="#" data-facet="kind" data-value="${k}"${reveal?` data-reveal data-ri="${i%8}"`:""}>
        <span class="th">${frames.get(k) ? `<img src="${esc(frames.get(k))}"
          alt="A prompt result from ${label[k]}" loading="lazy" referrerpolicy="no-referrer"
          width="560" height="350">` : ""}</span>
        <span class="tb"><h3>${label[k]}</h3><p>${c} prompts</p></span>
      </a>`).join("")}</div>
  </div></section>`;
}

function ctaBand(){
  return `<section class="cta"><div class="wrap">
    <h2>Take a prompt and start</h2>
    <p>Free to copy, every one credited to the person who wrote it.</p>
    <button class="btn pri" type="button" style="min-height:44px;padding:0 20px">Generate in bo</button>
  </div></section>`;
}

function creators(reveal){
  const m = new Map();
  DATA.forEach(r => { if (r.handle) m.set(r.handle, (m.get(r.handle)||0)+1); });
  const top = [...m].sort((a,b) => b[1]-a[1]).slice(0,8);
  return `<section class="sec" id="creators"><div class="wrap">
    <div class="sec-h"><h2>Creators</h2></div>
    <div class="people">${top.map(([h,c],i) => `
      <a class="person" href="https://x.com/${esc(h.replace("@",""))}" rel="noopener nofollow" target="_blank"${reveal?` data-reveal data-ri="${i%8}"`:""}>
        <span class="av">${AVATARS[h.replace("@","")]
          ? `<img src="${esc(AVATARS[h.replace("@","")])}" alt="" loading="lazy"
               referrerpolicy="no-referrer" width="34" height="34" onerror="this.remove()">` : ""}</span>
        <b>${esc(h)}</b><span>${c} prompts</span>
      </a>`).join("")}</div>
  </div></section>`;
}

const FOOT_COLS = [
  ["By model", ["Nano Banana Pro","Higgsfield Soul","GPT Image 2","Nano Banana 2",
                "Nano Banana","GPT Image","Kling","Seedance","Veo","Sora","Wan"]],
  ["By task", ["Fashion","Beauty","Advertising","Food & beverage","Automotive",
               "Web & motion","UGC","Product marketing"]],
  ["By style", ["Photorealistic","Cinematic","Luxury","Anime / illustrated",
                "Retro / vintage","Sci-fi / cyberpunk","Surreal / fantasy"]],
  ["By subject", ["Person / portrait","Architecture / interior","Product","Food / drink","Vehicle"]],
  ["Browse", ["Image prompts","Video prompts","All prompts","All models","All creators"]],
];
function foot(){
  const cols = FOOT_COLS.map(([t,items]) => `<div><h3>${esc(t)}</h3><ul>${
    items.map(l => `<li><a href="#">${esc(l)}${t==="Browse"?"":" prompts"}</a></li>`).join("")
  }</ul></div>`).join("");
  return `<footer class="foot"><div class="wrap">
    <div class="footnav">${cols}</div>
    <div class="footlegal"><span>Prompt Library</span>
      <span>Prompts remain the property of their authors. Every page credits the source.</span></div>
  </div></footer>`;
}

/* ── the one shared layout, rendered by all four ────────────────────────
   `motion` selects nothing about structure — only whether data-reveal
   markers are emitted, and it sets data-motion on the root for the CSS
   layer above and the script below to key off. */
function page(motion){
  const reveal = motion === "reveal";
  return `<div data-motion="${motion}">${nav()}<main id="main">
    <section class="wrap" style="padding-top:46px;padding-bottom:8px">
      <p class="eyebrow">The prompt library</p>
      <h1>AI prompts, word for word</h1>
      <p class="dek">${DATA.length} prompts from X creators, stored exactly as published and credited to whoever wrote them.</p>
      <div class="search" style="margin-top:26px">
        <input id="q" type="search" placeholder="Search prompts, models, styles, creators…" aria-label="Search prompts" value="${esc(state.q)}">
      </div>
      <div style="margin-top:14px;position:relative">${chipRow(reveal)}</div>
    </section>
    <section class="sec" id="results" style="padding-top:30px">
      <div class="wrap">
        <div class="sec-h"><h2>Results</h2><span class="meta" data-count></span></div>
        <div data-results>${cardsGrid(motion)}</div>
      </div>
    </section>
    ${catBand(reveal)}
    ${band("tasks","Browse by task","uses",reveal)}
    ${band("models","Browse by model","models",reveal)}
    ${band("styles","Browse by style","styles",reveal)}
    ${creators(reveal)}
    ${ctaBand()}
  </main>${foot()}</div>`;
}

const variants = [ () => page("none"), () => page("reveal"), () => page("physical"), () => page("cinematic") ];

/* ── behaviour, delegated on #stage so it survives every re-mount ──────── */
const stage = document.getElementById('stage');
const rootEl = () => stage.querySelector('[data-motion]');
const currentMotion = () => { const r = rootEl(); return r ? r.dataset.motion : "none"; };

function countLabel(){
  const total = DATA.length, shown = results().length;
  return shown === total ? `${total} total` : `${shown} of ${total}`;
}
function put(sel, html){ const el = stage.querySelector(sel); if (el) el.innerHTML = html; }

function paintResults(){
  put('[data-results]', cardsGrid(currentMotion()));
  put('[data-count]', countLabel());
  if (currentMotion() === "reveal") observeReveals();
}

/* Cinematic wraps a state change in a View Transition when supported and
   allowed; every other direction (and reduced motion, and unsupported
   browsers) just calls it straight — filtering must stay near-instant and
   interruptible regardless, so the wrapped path is a strict CSS-only
   crossfade capped at 180ms, never a blocking sequence. */
function applyFilterChange(fn){
  const doc = document;
  if (currentMotion() === "cinematic" && !reduceMotion() && doc.startViewTransition){
    doc.startViewTransition(fn);
  } else {
    fn();
  }
}

stage.addEventListener('click', e => {
  const copy = e.target.closest('[data-copy]');
  if (copy){
    const r = DATA.find(x => x.id === copy.getAttribute('data-copy'));
    const label = copy.querySelector('.copy-label');
    const done = () => {
      if (label) label.textContent = 'Copied';
      copy.setAttribute('data-copied','');
      setTimeout(() => { if (label) label.textContent = 'Copy prompt'; copy.removeAttribute('data-copied'); }, 1500);
    };
    if (navigator.clipboard) navigator.clipboard.writeText(r.prompt).then(done, done); else done();
    return;
  }
  const facet = e.target.closest('[data-facet]');
  if (facet){
    e.preventDefault();
    const k = facet.getAttribute('data-facet'), v = facet.getAttribute('data-value');
    if (!(k in state.active)) return; // "kind" band tiles link out; no local filter axis for them here
    const on = state.active[k];
    const i = on.indexOf(v);
    if (i < 0) on.push(v); else on.splice(i,1);

    if (currentMotion() === "physical") flipPill(facet);

    applyFilterChange(() => {
      stage.querySelectorAll(`.chip[data-facet="${k}"][data-value="${CSS.escape(v)}"]`)
        .forEach(c => c.setAttribute('aria-pressed', String(i < 0)));
      paintResults();
    });

    if (currentMotion() === "cinematic"){
      const strip = facet.closest('.chipstrip');
      if (strip) facet.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', inline: 'center', block: 'nearest' });
    }
    return;
  }
  if (e.target.closest('[data-clear]')){
    applyFilterChange(() => {
      state.q = ""; Object.keys(state.active).forEach(k => state.active[k] = []);
      stage.querySelectorAll('.chip[data-facet]').forEach(c => c.setAttribute('aria-pressed','false'));
      const q = stage.querySelector('#q'); if (q) q.value = "";
      paintResults();
    });
    return;
  }
});

let tm;
stage.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  clearTimeout(tm);
  tm = setTimeout(() => {
    state.q = e.target.value.trim();
    applyFilterChange(paintResults);
  }, 300);
});

/* ── Reveal: IntersectionObserver, once per element, transform+opacity only ── */
let io = null;
function teardownIO(){ if (io){ io.disconnect(); io = null; } }
function observeReveals(){
  teardownIO();
  if (reduceMotion()){
    stage.querySelectorAll('[data-reveal]').forEach(el => el.classList.add('in'));
    return;
  }
  io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const el = entry.target;
      const ri = +(el.getAttribute('data-ri') || 0);
      el.style.transitionDelay = (ri * 40) + 'ms';
      // Force layout read before adding the class isn't needed here — the
      // element starts with the resting (opacity:0) styles already applied
      // via CSS, so this is a plain state flip, not a FLIP invert.
      el.classList.add('in');
      io.unobserve(el);
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
  stage.querySelectorAll('[data-reveal]:not(.in)').forEach(el => io.observe(el));
}

/* ── Physical: FLIP the shared filter pill to whichever chip was toggled ── */
let pillEl = null;
function flipPill(chipEl){
  if (reduceMotion()) return;
  const strip = chipEl.closest('.chipstrip');
  if (!strip) return;
  if (!pillEl || pillEl.parentElement !== strip){
    pillEl?.remove();
    pillEl = document.createElement('span');
    pillEl.className = 'pill-ghost';
    strip.appendChild(pillEl);
  }
  const stripRect = strip.getBoundingClientRect();
  const from = pillEl.dataset.painted === '1'
    ? { x: pillEl.offsetLeft, w: pillEl.offsetWidth }
    : { x: chipEl.offsetLeft, w: chipEl.offsetWidth };
  const to = { x: chipEl.offsetLeft, w: chipEl.offsetWidth };
  pillEl.style.transition = 'none';
  pillEl.style.opacity = '0.14';
  pillEl.style.width = to.w + 'px';
  pillEl.style.transform = `translateX(${from.x}px)`;
  pillEl.dataset.painted = '1';
  // eslint-disable-next-line no-unused-expressions
  pillEl.offsetHeight; // force reflow so the "from" transform paints first
  requestAnimationFrame(() => {
    pillEl.classList.add('play');
    pillEl.style.transform = `translateX(${to.x}px)`;
  });
  clearTimeout(pillEl._fade);
  pillEl._fade = setTimeout(() => { if (pillEl) pillEl.style.opacity = '0'; }, 900);
}

/* ── mount / picker wiring ───────────────────────────────────────────────
   One deviation, already agreed project-wide: rAF never fires while the
   document is hidden, so a page opened in a background tab stays blank. */
function mount(i) {
  stage.innerHTML = '';
  teardownIO();
  revealed.clear();
  pillEl = null;
  const paint = () => {
    stage.innerHTML = variants[i]();
    put('[data-count]', countLabel());
    if (currentMotion() === "reveal") observeReveals();
  };
  if (document.hidden) setTimeout(paint, 0);
  else requestAnimationFrame(paint);
}
</script>

<script>
/* ─── Picker wiring · verbatim from PICKER.md ──────────────────────────── */
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
