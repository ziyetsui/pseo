<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt library L1 — five directions</title>

<style>
/* ─── Real materials: tokens lifted verbatim from the wireframe ─────────── */
:root{
  color-scheme: light dark;
  --background: light-dark(rgb(255 255 255), rgb(22 22 24));
  --surface: light-dark(rgb(250 250 251), rgb(28 28 31));
  --foreground: light-dark(rgb(24 26 29), rgb(250 250 252));
  --muted: light-dark(rgb(24 26 29 / 56%), rgb(250 250 252 / 56%));
  --faint: light-dark(rgb(24 26 29 / 38%), rgb(250 250 252 / 38%));
  --card: light-dark(rgb(255 255 255), rgb(32 32 36));
  --border: light-dark(rgb(24 26 29 / 11%), rgb(255 255 255 / 13%));
  --border-strong: light-dark(rgb(24 26 29 / 20%), rgb(255 255 255 / 24%));
  --accent: light-dark(rgb(51 126 255), rgb(131 180 255));
  --ok: light-dark(rgb(0 133 61), rgb(74 200 124));
  /* Was two hardcoded rgb(0 0 0/.1) literals plus a prefers-color-scheme
     override that only ever touched `img`, not the lookalike outline on the
     no-image placeholder below — so the placeholder stayed a black hairline
     on a dark surface. One token, picked up by light-dark() itself (no media
     query needed), used by both. */
  --img-outline: light-dark(rgb(0 0 0 / .1), rgb(255 255 255 / .1));
  /* Was a hardcoded #fff on the "Copied" fill. --ok's dark-mode value is
     lifted bright enough to work as 11px caption text on the canvas (see the
     linear-dark theme block's contrast table) — which makes it too light for
     white text on top of it: 2.13:1 against this file's own pre-theme dark
     --ok, 2.22:1 against the theme's brighter #4cc38a. Moving lightness, not
     hue: dark mode gets near-black text on the fill (9.0–9.3:1) instead of
     white; light mode's much darker --ok keeps white (4.75:1, unchanged). */
  --ok-fg: light-dark(#fff, #08090a);
  /* Inter Variable, because the tone this round is chasing is not reachable
     without it: the Linear survey measures weights 510 and 590, and a system
     stack snaps those to 500/600 — its own note says that "changes the tone".
     Loaded from a CDN with the platform stack behind it and font-synthesis
     off, so a failed load shows up as an obvious regression rather than a
     faked bold. This is a PROTOTYPE dependency: frontend/AGENTS.md §7.6 has
     not ruled on a web font for production. */
  --font-sans: "InterVariable", -apple-system, system-ui, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  /* The one addition: a system serif, no web font, for the display register. */
  --font-serif: ui-serif, Georgia, "Times New Roman", serif;
  --r: 12px; --wrap: 1160px;
  /* Retina hairline for the lines that separate rather than elevate. */
  --hairline: 1px;
  /* One z scale; nothing invents its own number. */
  --z-sticky: 40; --z-rail: 50; --z-skip: 99;
}
@media only screen and (min-resolution: 192dpi){ :root{ --hairline: .5px } }

/* ─── Measured from the Linear survey (specs/images/linear-design-token-
   reference.md, 29 routes). Not invented, and not a full design system. ─── */
@font-face{
  font-family:"InterVariable";
  font-style:normal;
  font-weight:100 900;
  font-display:swap;
  src:url("https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/files/inter-latin-wght-normal.woff2") format("woff2");
}
:root{
  /* Variable weights. 510 and 590 are the point; 400 stays the text weight. */
  --w-text:400; --w-medium:510; --w-semi:590;
  /* Container ladder: 1436 = 1344 homepage frame + 46px gutters either side. */
  --w-wide:1436px; --w-page:1024px; --w-prose:624px;
  /* Motion. Four durations, three easings — nothing else. */
  --t-quick:100ms; --t-regular:250ms; --t-out:150ms;
  --e-out:cubic-bezier(.25,.46,.45,.94);
  --e-emphatic:cubic-bezier(.23,1,.32,1);
  --e-structural:cubic-bezier(.455,.03,.515,.955);
  /* Light-mode elevation ladder. Dark collapses to a ring (theme block). */
  --sh-tiny:0 1px 1px #00000017;
  --sh-low:0 1px 4px -1px #00000017;
  --sh-med:0 3px 12px #00000017;
  --sh-high:0 7px 24px #0000000f;
}
/* cv01 opens the digits, ss03 the alternate letterforms — both are what
   aiforui.dev enables on its own Inter. */
body{font-feature-settings:"cv01","ss03";font-synthesis:none}

/* The H1 tier ladder: size is a function of the page's rank in the site, not
   of its content. This hub is a flagship page, so 64px / 510 / 1.0 / −0.022em.
   Tracking is a uniform −0.022em at every step of the real ladder. */
.tier-flagship{font-size:clamp(38px,5vw,64px);font-weight:var(--w-medium);
  line-height:1;letter-spacing:-.022em;text-wrap:balance}
.tier-index{font-size:clamp(32px,3.6vw,48px);font-weight:var(--w-medium);
  line-height:1;letter-spacing:-.022em;text-wrap:balance}
.tier-ref{font-size:clamp(28px,2.8vw,40px);font-weight:var(--w-medium);
  line-height:1.1;letter-spacing:-.022em;text-wrap:balance}

/* The header is 72px + a 1px hairline and its background is fully
   transparent — the translucency is entirely backdrop-filter. */
.taste .nav{background:transparent;backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.taste .nav .wrap{min-height:72px;max-width:var(--w-wide)}
.taste .wrap{max-width:var(--w-wide)}
.taste .prose{max-width:var(--w-prose)}
.taste .eyebrow{font:var(--w-semi) 11px/1.5 var(--font-mono);letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint)}


*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
body{margin:0;background:var(--background);color:var(--foreground);
     font-family:var(--font-sans);font-size:15px;line-height:1.6;
     -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
     font-synthesis:none;overflow-x:hidden}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p,figure{margin:0}
button,a,input,select,textarea{touch-action:manipulation}
:focus-visible{outline:2px solid var(--foreground);outline-offset:2px;border-radius:5px}
[id]{scroll-margin-top:76px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 28px}
.skip{position:absolute;left:-9999px;background:var(--foreground);color:var(--background);
      padding:10px 14px;z-index:var(--z-skip);border-radius:8px}
.skip:focus{left:12px;top:12px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* Every image carries the same inset hairline; never a tinted neutral. */
img{outline:1px solid var(--img-outline);outline-offset:-1px}

/* ─── Shared chrome ─────────────────────────────────────────────────────── */
.nav{border-bottom:var(--hairline) solid var(--border);background:var(--background);
     position:sticky;top:0;z-index:var(--z-sticky)}
.nav .wrap{display:flex;align-items:center;gap:22px;min-height:58px;flex-wrap:wrap}
.brand{font-weight:600;letter-spacing:-.02em;font-size:16px;margin-right:auto}
.navlinks{display:flex;gap:20px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.navlinks a{transition-property:color;transition-duration:150ms;transition-timing-function:ease-out;
            display:inline-flex;align-items:center;min-height:44px}
@media (hover:hover) and (pointer:fine){ .navlinks a:hover{color:var(--foreground)} }

h1{font-size:clamp(30px,4.6vw,46px);line-height:1.08;letter-spacing:-.035em;
   font-weight:600;text-wrap:balance}
h2{font-size:23px;line-height:1.25;letter-spacing:-.025em;font-weight:600;text-wrap:balance}
.dek{color:var(--muted);font-size:16.5px;max-width:62ch;margin-top:14px;text-wrap:pretty}
.sec{padding:52px 0;border-top:var(--hairline) solid var(--border)}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.sec-h a{margin-left:auto;font-size:13px;color:var(--muted);
         display:inline-flex;align-items:center;min-height:44px}
@media (hover:hover) and (pointer:fine){ .sec-h a:hover{color:var(--foreground)} }
.eyebrow{font:600 11px/1.5 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;
         color:var(--faint);margin-bottom:10px}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
     min-height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--border);
     background:var(--card);color:var(--foreground);font:inherit;font-size:13.5px;
     cursor:pointer;position:relative;
     transition-property:background-color,border-color,color;
     transition-duration:150ms;transition-timing-function:ease-out}
/* Small controls keep a 44px hit area without growing visually. */
.btn::after{content:"";position:absolute;inset:-4px}
.btn:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){ .btn:hover{border-color:var(--border-strong)} }
.btn.pri{background:var(--foreground);color:var(--background);border-color:var(--foreground)}
.btn[data-copied]{color:var(--ok)}
.btn.pri[data-copied]{background:var(--ok);border-color:var(--ok);color:var(--ok-fg)}

.search{display:flex;gap:8px;align-items:center;border:1px solid var(--border);
        border-radius:14px;padding:7px;background:var(--card);max-width:620px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--foreground);
              font:16px var(--font-sans);padding:9px 11px;outline:none}
@media (min-width:768px){ .search input{font-size:15px} }
.search input::placeholder{color:var(--faint)}

.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 11px;
      border-radius:999px;border:1px solid var(--border);background:var(--card);
      color:var(--muted);font:inherit;font-size:13px;cursor:pointer;position:relative;
      transition-property:background-color,border-color,color;
      transition-duration:150ms;transition-timing-function:ease-out}
.chip::after{content:"";position:absolute;inset:-5px}
.chip:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){ .chip:hover{color:var(--foreground);border-color:var(--border-strong)} }
.chip[aria-pressed="true"]{background:var(--foreground);color:var(--background);border-color:var(--foreground)}
.chip small{font:11px/1 var(--font-mono);font-variant-numeric:tabular-nums;opacity:.6}

.meta{font:11.5px/1.6 var(--font-mono);color:var(--faint);
      font-variant-numeric:tabular-nums;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.meta b{font-weight:500;color:var(--muted)}
.hv{color:var(--ok)}
.badge{position:absolute;left:8px;bottom:8px;background:rgb(0 0 0 / .72);color:#fff;
       font:500 10px/1 var(--font-mono);letter-spacing:.05em;padding:5px 7px;border-radius:6px;
       backdrop-filter:blur(6px);pointer-events:none}
.kbd{font:10px/1 var(--font-mono);border:1px solid var(--border);border-radius:4px;
     padding:3px 4px;color:var(--faint)}

/* Empty state — sized like the filled state so nothing jumps. */
.empty{border:1px dashed var(--border-strong);border-radius:var(--r);padding:44px 28px;
       text-align:center;min-height:220px;display:flex;flex-direction:column;
       align-items:center;justify-content:center;gap:10px}
.empty b{font-size:16px;font-weight:600}
.empty p{color:var(--muted);font-size:14px;max-width:44ch;text-wrap:pretty}

/* Variant 1 is a whole page in its own document, so it owns the viewport. */
.baseline{display:block;width:100%;height:100dvh;border:0}

/* Images / Videos — the first fork, two tiles at half a row each. Flex, not a
   fixed 2-col grid: with exactly two items this never shows a hole, but it
   uses the same mechanism as .tiles below so the technique is one thing, not
   two, across the page. */
.cat{display:flex;flex-wrap:wrap;gap:16px}
.cat .tile{flex:1 1 320px}
.cta{padding:60px 0 66px;border-top:var(--hairline) solid var(--border);text-align:center}
.cta h2{font-size:clamp(26px,3.4vw,34px);letter-spacing:-.03em}
.cta p{color:var(--muted);margin:10px auto 20px;max-width:46ch;text-wrap:pretty}

/* Shared browse bands + creators (the crawl surface, identical in all five).
   A fixed 4-col grid leaves a hole whenever a band's item count isn't a
   multiple of the column count (6 tasks, 6 styles → a lone row of 2 with two
   empty cells) — real categories, not filler, so the count can't be padded
   away. Flex-wrap with flex-grow instead: each tile has the same basis, so
   rows still read as a grid at any width, but flex-grow distributes the
   leftover space among whatever tiles land in the final row — including a
   row of one — so the row always fills edge to edge. No column count is
   fixed anywhere, so this holds at every breakpoint without extra media
   queries. */
.tiles{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.tiles .tile{flex:1 1 250px}
.tile{border:1px solid var(--border);border-radius:var(--r);background:var(--card);
      overflow:hidden;display:flex;flex-direction:column;
      transition-property:border-color;transition-duration:150ms;transition-timing-function:ease-out}
@media (hover:hover) and (pointer:fine){ .tile:hover{border-color:var(--border-strong)} }
.tile .th{flex:none;display:block;width:100%;aspect-ratio:16/10;background:var(--surface);overflow:hidden}
.tile .th img{width:100%;height:100%;object-fit:cover;display:block}
/* Inner radius = outer − padding, so the corner gap stays even. */
.tile .tb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px}
.tile h3{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.tile p{font:11.5px/1.5 var(--font-mono);color:var(--faint);font-variant-numeric:tabular-nums}
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.person{border:1px solid var(--border);border-radius:var(--r);background:var(--card);
        padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;
        transition-property:border-color;transition-duration:150ms;transition-timing-function:ease-out}
@media (hover:hover) and (pointer:fine){ .person:hover{border-color:var(--border-strong)} }
.person .av{width:34px;height:34px;border-radius:50%;background:var(--surface);overflow:hidden;flex:none}
.person .av img{width:100%;height:100%;object-fit:cover;display:block;outline:none}
.person b{font-size:14.5px;font-weight:600}
.person span{font:11px/1.5 var(--font-mono);color:var(--faint);font-variant-numeric:tabular-nums}

footer.foot{border-top:var(--hairline) solid var(--border);padding:34px 0 26px;margin-top:8px}
.footnav{display:grid;gap:26px 20px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
         margin-bottom:28px}
.footnav h3{font:600 10.5px/1.5 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;
            color:var(--faint);margin:0 0 9px}
.footnav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.footnav a{color:var(--muted);font-size:13px;display:flex;align-items:center;min-height:40px;
           transition-property:color;transition-duration:150ms;transition-timing-function:ease-out}
@media (hover:hover) and (pointer:fine){ .footnav a:hover{color:var(--foreground);text-decoration:underline;
  text-decoration-thickness:from-font;text-underline-offset:2px} }
.footlegal{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;
           padding-top:16px;border-top:var(--hairline) solid var(--border);
           font:11.5px/1.6 var(--font-mono);color:var(--faint)}

/* The nav wraps to two rows on a phone, so a bar pinned at 58px would sit on
   top of it. Below the wrap point nothing is sticky but the bars themselves. */
@media (max-width:700px){ .nav{position:static} }
/* .tiles and .cat reflow on their own via flex-basis; only .people (which
   stayed a fixed grid — every band it renders is a multiple of 4) still
   needs explicit column steps. */
@media (max-width:900px){ .people{grid-template-columns:repeat(2,1fr)} }
@media (max-width:560px){ .people{grid-template-columns:1fr} }

/* ══ V4 · Method — the editorial exception ══════════════════════════════
   Linear's /method is the one page that leaves the system: serif, 128px,
   weight 400, line-height 1.0, tracking NORMAL (the only page that opts out
   of negative tracking), centred, on a 410px measure. The lesson the survey
   draws is not "add a serif" — it is that the system reserves one face and
   one page for the argument about beliefs rather than features, and spends
   nothing else on it. So: this variant argues why the library exists, and
   the library itself arrives underneath the argument, in the plain system. */
.vme .argument{padding-block:112px 96px;text-align:center}
.vme .argument h1{font-family:var(--font-serif);font-size:clamp(46px,9vw,128px);
  font-weight:400;line-height:1;letter-spacing:normal;text-wrap:balance;
  max-width:14ch;margin:0 auto}
.vme .argument .body{max-width:410px;margin:38px auto 0;text-align:left}
.vme .argument .body p{font-size:17px;line-height:1.6;letter-spacing:normal;
  color:var(--muted);text-wrap:pretty}
.vme .argument .body p + p{margin-top:1.6em}
.vme .argument .body em{font-family:var(--font-serif);font-style:italic;
  color:var(--foreground)}
.vme .argument .sig{margin:38px auto 0;max-width:410px;text-align:left;
  font:11.5px/1.6 var(--font-mono);color:var(--faint)}
.vme .after{border-top:1px solid var(--border)}
.vme .lede{padding-block:56px 26px}
.vme .rows{border-top:1px solid var(--border)}
.vme .row{display:grid;grid-template-columns:52px minmax(0,1fr) 132px;gap:20px;
  align-items:center;padding:14px 0;min-height:74px;
  border-bottom:1px solid var(--border)}
.vme .row .th{width:52px;height:52px;border-radius:4px;overflow:hidden;background:var(--surface)}
.vme .row .th img{width:100%;height:100%;object-fit:cover;display:block}
.vme .row h3{font-size:15.5px;font-weight:var(--w-medium);line-height:1.3;
  letter-spacing:-.011em}
.vme .row .meta{margin-top:3px}
.vme .row .act{justify-self:end}
@media (max-width:700px){
  .vme .argument{padding-block:64px 56px}
  .vme .row{grid-template-columns:44px minmax(0,1fr);gap:14px}
  .vme .row .act{grid-column:2;justify-self:start}
}


/* ══ The library, five poster densities ═══════════════════════════════
   Every direction here is the same card — picture on top, name under it
   — and what varies is how much room it gets. The previous Poster ran a
   23,508px page at two up; each of these is smaller, and the question is
   how far density can go before the name stops being readable.

   Shared card shell. Inner radius = outer − padding; depth is a hairline,
   not a pasted-on shadow. */
.cardgrid .c{border:1px solid var(--border);border-radius:12px;background:var(--card);
  overflow:hidden;display:flex;flex-direction:column;min-width:0;
  transition-property:border-color;transition-duration:150ms;transition-timing-function:ease-out}
@media (hover:hover) and (pointer:fine){ .cardgrid .c:hover{border-color:var(--border-strong)} }
.cardgrid .shot{background:var(--surface);overflow:hidden;flex:none;width:100%}
.cardgrid .shot img{width:100%;height:100%;object-fit:cover;display:block}
.cardgrid h3{letter-spacing:-.012em;text-wrap:balance}
.cardgrid .cred{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:auto;
  font:11px/1.6 var(--font-mono);color:var(--faint);font-variant-numeric:tabular-nums}
/* A record with no picture never gets a grey rectangle standing in for one. */
.cardgrid .noshot{background:repeating-linear-gradient(-45deg,transparent 0 9px,
  light-dark(rgb(24 26 29/3.5%),rgb(255 255 255/4%)) 9px 18px);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;
  font:10px/1.55 var(--font-mono);color:var(--faint);width:100%;flex:none}

/* ── 1 · Three — three up, the same 4:5 portrait, one third smaller ───
   The nearest thing to the previous Poster: same proportion, same serif
   caption, one more per row. */
.ix-three .cardgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.ix-three .shot,.ix-three .noshot{aspect-ratio:4/5}
.ix-three .body{padding:14px 15px 15px;display:flex;flex-direction:column;gap:7px;flex:1}
.ix-three h3{font-family:var(--font-serif);font-weight:400;font-size:18px;line-height:1.22}
@media (max-width:900px){ .ix-three .cardgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .ix-three .cardgrid{grid-template-columns:minmax(0,1fr)} }

/* ── 2 · Square — four up on a 1:1 crop ──────────────────────────────
   A square crops every result the same way, so the grid reads as one
   object instead of a ragged wall. The title drops to 15px, which is
   the floor this set is testing. */
.ix-square .cardgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.ix-square .shot,.ix-square .noshot{aspect-ratio:1/1}
.ix-square .body{padding:12px 13px 13px;display:flex;flex-direction:column;gap:6px;flex:1}
.ix-square h3{font-size:15px;font-weight:var(--w-semibold);line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:1000px){ .ix-square .cardgrid{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:760px){ .ix-square .cardgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* ── 3 · Landscape — four up on 16:10 ────────────────────────────────
   The shortest card of the five: a landscape crop is barely half the
   height of a portrait one, so this fits the most rows per screen while
   still being a card with a readable name under it. */
.ix-landscape .cardgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.ix-landscape .shot,.ix-landscape .noshot{aspect-ratio:16/10}
.ix-landscape .body{padding:12px 13px 13px;display:flex;flex-direction:column;gap:6px;flex:1}
.ix-landscape h3{font-size:15px;font-weight:var(--w-semibold);line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:1000px){ .ix-landscape .cardgrid{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:700px){ .ix-landscape .cardgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* ── 4 · Masonry — three up, nothing cropped ─────────────────────────

<style id="linear-dark-theme">
/* ─────────────────────────────────────────────────────────────────────────
   Linear-derived dark theme for the prototype pickers.

   Values come from the token snapshot at
   `specs/images/linear-design-tokens.css` (Linear public-site CSS, snapshot
   2026-09-03), not from memory. This is a COLOUR re-theme only: type and
   geometry stay on the project's own system, because `frontend/AGENTS.md` §7.6
   has not ruled on a web font and Linear's faces (Inter Variable, Berkeley
   Mono, Tiempos Headline) are not licensed here. Weights stay 400/600.

   The four pickers were written at different times and use three different
   token vocabularies (`--background`/`--bg`, `--foreground`/`--fg`,
   `--muted`/`--muted-fg`, `--faint`/`--faint-fg`, `--font-sans`/`--sans`).
   Every unambiguous alias is set, so one block themes all four — see the
   note on `--muted` below for the one token deliberately skipped.

   Contrast, measured against the canvas ladder (WCAG 2, sRGB):

     token                 #08090a  #0f1011  #141516  #191a1b
     --foreground #f7f8f8    18.73    17.90    17.18    16.38
     --muted-fg   #d0d6e0    13.64    13.04    12.52    11.93
     --faint      #8a8f98     6.13     5.86     5.63     5.36
     --accent     #7170ff     5.18     4.96     4.76     4.53
     --ok         #4cc38a     9.00     8.60     8.25     7.87
     white on brand fill #5e6ad2 …………………………………………………… 4.70

   Three deliberate departures from Linear's own dark tokens, each because a
   token Linear uses decoratively is used here as text:

   1. `--faint` takes Linear's TERTIARY ink `#8a8f98`, not its quaternary
      `#62666d`. Quaternary measures 3.45:1 — below the 4.5:1 floor — and this
      project spends `--faint` on 11px mono captions, which is text.
   2. `--accent` takes `#7170ff`, NOT the `#5252f5` that `frontend/CLAUDE.md`
      mandates. That mandate is a LIGHT-mode repair: `#7070ff` fails AA on all
      four light surfaces (3.30–3.85) and `#5252f5` fixes it. Inverted, the
      rule inverts too — `#5252f5` measures 3.69:1 on `#08090a` and would be
      the unreadable one. Same intent, opposite value.
   3. `--ok` lifts Linear's `#27a644` to `#4cc38a`. Per the `color` skill,
      brand colours carried into dark at full saturation vibrate; lightness
      goes up and chroma comes down. It also buys 6.29:1 → 9.00:1 at 11px.
   ───────────────────────────────────────────────────────────────────────── */

:root[data-theme="linear-dark"] {
  color-scheme: dark;

  /* Canvas ladder — level-0 is the page, level-1 insets, level-2 cards.
     Dark mode keeps the layering hierarchy; it is not inverted light mode. */
  --background: #08090a;  --bg: #08090a;
  --surface:    #0f1011;
  --card:       #141516;

  /* Ink */
  --foreground: #f7f8f8;  --fg: #f7f8f8;
  /* --muted is deliberately NOT set. It is ink in L1/L4 but a translucent
     SURFACE wash in L2/L3 (`color-mix(in srgb, var(--fg) 8%, transparent)`,
     used only for avatar and media placeholders). Forcing one ink value here
     painted light-grey boxes onto a near-black canvas in L3. Every file's own
     definition self-corrects once --fg/--foreground flip and color-scheme is
     dark, so the token is left alone on purpose. --muted-fg is unambiguous
     ink and is set. */
  --muted-fg: #d0d6e0;
  --faint:      #8a8f98;  --faint-fg: #8a8f98;

  /* Lines. Linear's dark borders are solid, not alpha-white — a translucent
     white hairline glows on near-black instead of receding. */
  --border:        #23252a;
  --border-strong: #34343a;

  /* Interaction. Indigo carries interaction semantics only: focus, links,
     ::selection, and the single primary action per view. */
  --accent:    #7170ff;
  --accent-bg: #1b1c33;

  /* The inverted button: Linear's own --color-button-invert-bg. */
  --primary:    #e5e5e6;
  --primary-fg: #08090a;

  /* Status */
  --ok:   #4cc38a;
  --cand: #f0bf00;

  /* L4's placeholder highlight, on Linear's orange */
  --var-bg: #2a1a12;
  --var-fg: #fc9a6e;
}

/* The prototypes gate their dark-mode image outline on `prefers-color-scheme`,
   which does not fire when the theme is forced by attribute. A tinted outline
   picks up the surface behind it and reads as grime, so it must be pure white. */
:root[data-theme="linear-dark"] img { outline-color: rgb(255 255 255 / .1); }

/* Selection carries the brand quietly and stays legible. */
:root[data-theme="linear-dark"] ::selection {
  background: color-mix(in oklab, #5e6ad2, black 10%);
  color: #fff;
}

/* Depth: on dark, a stacked shadow is invisible, so every elevation collapses
   to a single low-opacity white ring. */
:root[data-theme="linear-dark"] [data-elevated] {
  box-shadow: 0 0 0 1px rgb(255 255 255 / .09);
}
</style>

exture. 85mm for detail. 50mm for natural perspective. 35mm for environmental shots. Controlled dolly and crane movements. Realistic depth of field. Natural focus transitions. Soft motion blur. Subtle lens imperfections. No artificial camera shake. MATERIAL DIRECTION Every surface must visibly behave like physical paper. Visible paper fibers. Natural folds. Tiny imperfections. Soft cardboard edges. Realistic contact shadows. Believable paper thickness. Natural material deformation. LIGHTING Soft morning daylight. Large window as the primary source. Natural bounce light. Gentle shadows. Subtle warm highlights. No artificial neon effects. No excessive visual effects. CONTINUITY The same paper city throughout the entire sequence. Buildings maintain identical shapes and positions. Roads remain connected. Paper materials remain consistent. No random transformations. No flickering. No duplicated structures. No sudden environmental changes. DIRECTOR’S NOTE Treat this as a miniature feature film, not a visual-effects demonstration. The camera should discover the world gradually. Start intimate. Reveal scale. Return to detail. Finish wide. The audience should feel that they are watching a real handcrafted world photographed with a cinema camera. Photorealistic 4K • tactile materials • feature-film cinematography • sophisticated lighting • realistic miniature photography • cinematic depth • precise camera movement • seamless visual continuity.", "models": ["GPT Image", "Seedance"], "uses": [], "styles": ["Cinematic", "Photorealistic"], "techs": ["Camera movement / shot language", "Transition / morph / match cut"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2088865943921528832/img/ACj33PYyBD5RI7qH.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2088865943921528832/img/ACj33PYyBD5RI7qH.jpg?name=small"], "n": 1, "dur": 30, "handle": "@ChillaiKalan__", "likes": 407, "saves": 409, "hv": true, "score": 95.3}, {"id": "2008 e same fabric and design. Barefoot, she lies on her stomach across a lived-in, slightly messy bed in her bedroom, browsing a mobile shopping page on a black smartphone. A house cat jumps onto the bed seeking attention, and she affectionately plays with it. Moments later, a friend calls. She answers, chats, and eventually bursts into laughter. The doorbell rings, so she ends the call and gets up to collect her dinner. Shot 1 (0–2s): She is already moving. One thumb scrolls through a shopping page while she frowns slightly, thinking. She quietly mutters in Korean: \"아, 뭐 살랬더라…\" (\"Ah... what was I going to buy again?\"). Lips synchronize naturally. Her bare feet gently sway behind her. A low handheld camera glides along the edge of the mattress, with soft bedding partially obscuring the foreground. Shot 2 (2–4s): The house cat jumps onto the bed, compressing the blanket as it walks toward her forearm and lets out a single meow. The camera gives a slight jolt from the impact, then quickly reframes from the phone to an over-the-shoulder view that includes her face, hands, phone, and cat. Shot 3 (4–6s): She turns warmly toward the cat, stroking it once from its forehead to its shoulders. In a gentle, affectionate tone she says: \"우리 애기 왔어?\" (\"Did my baby come?\"). Lip sync is clear and natural. The camera pushes in briefly through the cat's softly blurred foreground toward her face and hand. Shot 4 (6–8s): A friend's ringtone sounds. She glances down, confirms the caller, swipes to answer, and brings the phone to her ear. The camera moves in a loose semicircle from a slightly tilted overhead angle, capturing the entire answering motion. Shot 5 (8–11s): Her friend begins talking. She responds first with confusion, then disbelief: \"어, 왜? 진짜 거짓말.\" (\"Huh? Why? No way, you're kidding.\"). Immediately afterward she naturally bursts into laughter. The cat kneads the blanket beside her. A close handheld side angle keeps both her phone and profile within the same focal plane. Shot 6 (11–13s): A clear doorbell interrupts the laughter. Both she and the cat turn toward the bedroom door. She braces one hand on the mattress to get up. The camera reacts a fraction too late, briefly turning toward the door before naturally correcting back to her rising movement. Shot 7 (13–15s): Still on the phone, she hurriedly says: \"어, 나 밥 왔다. 끊어.\" (\"My food's here. I'll hang up.\"). She ends the call with her thumb, gets off the bed, and walks toward the door while the cat follows across the blankets. The camera slides low beneath her elbow and tilts upward as she stands in one continuous motion. Sound: No music. Only raw production sound: bedding rustling, quiet breathing, finger taps on the phone, the soft impact of the cat jumping onto the bed, one natural meow, faint purring, a single short incoming ringtone, call connection tone, the friend's voice through the phone, the woman's four Korean lines with accurate lip sync, a genuine brief laugh, one clear doorbell, the tap ending the call, and soft cat footsteps. No subtitles, no on-screen text, no logo, no watermark. Never render a reference sheet or duplicate the subject.", "models": ["Seedance"], "uses": ["Food & beverage"], "styles": ["Photorealistic"], "techs": ["Camera movement / shot language", "Lip sync / dialogue", "Multi-shot / storyboard"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2085640247682224128/img/Wj08brZzXojtfWtv.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2085640247682224128/img/Wj08brZzXojtfWtv.jpg?name=small"], "n": 1, "dur": 15, "handle": "@oggii_0", "likes": 297, "saves": 232, "hv": true, "score": 93.6}, {"id": "2047862141894681076", "slug": "a-realistic-young-woman-sitting-casually-in--2047862141894681076", "title": "Bedroom phone recording, late afternoon light", "prompt": "A realistic young woman sitting casually in a softly lit bedroom during late afternoon. She is holding her phone very close to her face rief accidental face cropping, and imperfect framing throughout. The camera itself is never visible. LOOK: Warm analog tape texture with gentle film grain, softened sharpness, subtle halation where sunlight cuts between buildings, faint salt-air haze, realistic skin tones, low contrast, tiny exposure shifts, natural motion blur. Authentic everyday footage, not a polished commercial. STYLE: A quiet Mediterranean morning coffee-run vlog. Unhurried, warm, spontaneous. She talks to the camera in short sentences with comfortable pauses, reacts to the street around her, laughs easily. CHARACTER: ELENA — a Mediterranean woman in her mid-20s. Dark wavy hair in a loose bun, olive skin, minimal makeup, small gold hoops, oversized white linen shirt, denim shorts, leather sandals, canvas tote on one shoulder. SETTING: A sun-washed coastal old town just after sunrise. Narrow limestone alleys, pastel shutters, bougainvillea spilling over walls, glimpses of the sea between buildings, distant church bells and scooters, almost no people. A sleepy stray cat on a warm step. SCENES: The vlog opens in selfie mode as Elena steps out of the doorway into the bright alley, squinting. \"Morning.\" She walks, sunlight strobing between buildings across her face. \"Okay it's already hot. Of course it is.\" She reaches a tiny corner kiosk and orders an iced coffee, camera still handheld, framing half-wrong. She sets the camera on the counter ledge for a wide shot while she waits, drumming her fingers. A stray cat appears at her feet and stares up. She crouches down to it. \"Hi. You again.\" The cat rubs against her leg. She laughs. \"I have a bodyguard now.\" She picks the camera back up, coffee in the other hand, and walks toward the water, the cat trotting behind for a few steps. She sits on the low seawall, sea behind her, and takes the first sip. \"Worth it. Every time.\" She looks off at the water for a moment, hair moving in the breeze, then back to the lens. \"Okay. Work now.\" A small wave. \"See you later.\"", "models": ["Seedance"], "uses": ["Advertising", "Beauty", "Food & beverage", "UGC"], "styles": ["Photorealistic", "Retro / vintage"], "techs": ["Camera movement / shot language"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2087155707795607552/img/GvPt7yiUAlXPgSXk.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2087155707795607552/img/GvPt7yiUAlXPgSXk.jpg?name=small"], "n": 1, "dur": 15, "handle": "@PhedEU", "likes": 133, "saves": 160, "hv": false, "score": 83.9}, {"id": "2089932434351734933", "slug": "use-the-uploaded-reference-image-as-the-exac-2089932434351734933", "title": "Locked product and identity, outfit swapped", "prompt": "Use the uploaded reference image as the exact character and product reference. Preserve the woman’s facial identity, hairstyle, eye color, makeup, skin tone, body proportions, jewelry, and overall appearance consistently throughout the entire video. Change her outfit to a fitted sleeveless PINK top with clean WHITE shorts and keep the outfit identical in every shot. Use the uploaded sunglasses, earbuds, orange retail packaging, and carrying cases as LOCKED product references. Preserve their exact shapes, colors, materials, proportions, buttons, lenses, hinges, charging case, textures, and every visible product detail. Do not redesign, replace, or invent any product elements. Create an ultra-realistic UGC luxury lifestyle review filmed inside a modern luxury bedroom during warm golden hour. The woman is the clear visual focus, with authentic creator energy and natural expressions. Use warm sunlight coming through the bedroom windows, soft realistic shadows, natural skin texture, shallow depth of field, subtle handheld smartphone movement, realistic autofocus behavior, natural motion blur, and premium commercial-quality cinematography. Include a realistic cat naturally interacting with her only where specified, without distracting from the products. 0–5 s mation. She is in the center, body still moving, upper body rising and shifting, singing with strong lip-sync. All five men move subtly with her, never static. The men never fully obscure her body.\n13-15s: Dynamic medium shot. The five diverse male dancers lift her into the air in a powerful deep backbend. Her body is fully extended and arched, head thrown back, still singing with clear lip-sync. While holding her they gently rock her up and down in time with the beat. The camera starts from a clear side view of her arched body and smoothly transitions to a frontal view of her face. At the end they lower her smoothly onto her feet; she lands and immediately continues singing as the five men stay low on the floor around her. The men never fully obscure her.\nHigh fashion dance energy, sweaty skin, sharp timing, continuous fluid motion of the woman, priority on accurate lip-sync in every frame.\nRules: no hand morphing, no body distortions, clean stable anatomy, fingers and hands remain consistent and natural throughout the entire video.\n\n#AIvideo #AIMusicVideo #AIFilmmaking</pre>\n  <div class=\"cardmeta\">\n    <span><a href=\"https://x.com/Kiber_Alla\" rel=\"noopener nofollow\">@Kiber_Alla</a></span>\n    <span class=\"wf-data\">562 likes</span><span class=\"wf-data\">671 saves</span>\n  </div>\n  <div class=\"cardact\"><button class=\"copy\" data-copy=\"2078814921756754352\" type=\"button\">Copy prompt</button><a class=\"src wf-data\" href=\"https://x.com/Kiber_Alla/status/2078814921756754352\" rel=\"noopener nofollow\">View on X ↗</a><span class=\"fb\" data-fb=\"2078814921756754352\" role=\"status\"></span></div>\n</article>\n<article class=\"card\" data-id=\"2083168602363150527\" data-ct=\"video\"\n  data-models=\"Seedance|Higgsfield Soul\" data-use_cases=\"Food &amp; beverage\"\n  data-techniques=\"Camera movement|Multi-shot / storyboard|Lip sync / dialogue\" data-styles=\"Photorealistic\"\n  data-date=\"2026-07-31\" data-vs=\"96.1\" data-hv=\"1\"\n  data-q= m at night. ACTIVE REFERENCES @ image1 — the hotel suite. Curved cove ceiling with warm LED coving, deep red carpet, cream walls, two black organic sculptures above a light wood headboard, white bedding with red pillows, twin bedside lamps, pale sofa, oval coffee table, sheer curtains, dark door. @ image2 — the subject. Young woman, shoulder-length wavy blonde hair with curtain bangs and highlights, light freckles, thin gold necklace, silver ring, dark brown off-the-shoulder knit with white diamond-stripe pattern. 100% matches the reference. CAMERA OWNERSHIP LOCK Only two positions exist. HELD: arm extended, camera 0.4-0.7m from her face, visible arm tension, tilt and step-bounce. PROPPED: camera on a surface she placed it on, crooked and fixed, with her moving in and out of frame. No operator shots, no tracking, nothing she could not have filmed alone. FORMAT Eight shots, 30s, seven HARD CUTS, no fades. Real-time. 0-4s SHOT 1 — PROPPED, morning room. 84° diagonal field of view, camera on the sideboard 3m from the bed at 1.1m, static and tilted. The suite matches @ image1: cove light on, curtains half open, cool daylight across the red carpet. @ image2 visible at 0.0s, sitting up on the bed edge x66 y58. No empty frame. She rubs her face and croaks at the running camera: &quot;It&#x27;s seven. In New York. Why am I awake.&quot; Stands, walks out screen-right. HARD CUT. 4-7s SHOT 2 — HELD, window light. 84°, arm&#x27;s length 0.5m, above eye line. She is x50 y42 at the sheer curtain screen-left, cool daylight on the near side of her face, cove warmth behind. She pulls the curtain, squints at the street below, then into the lens: &quot;Okay. It&#x27;s actually happening.&quot; Arm wobble throughout. HARD CUT. 7-11s SHOT 3 — PROPPED, coffee. 47°, camera on the oval coffee table 0.8m away, low, looking up past a cup. She sits into frame at x55 y45, pours, tastes, pulls a face at the running camera: &quot;Hotel coffee. We&#x27;ll fix that outside.&quot; Steam bends in the light. HARD CUT. 11-15s SHOT 4 — HELD, mirror. 47°, camera at chest height reflected in the suite mirror. She is x45 y50 in the reflection, camera visible in her hand, working through her hair with the other. Bed and sculptures behind. At 13s: &quot;This is as good as it gets. Let&#x27;s go.&quot; HARD CUT. 15-18s SHOT 5 — HELD, leaving. 107° wide rectilinear, camera held low at waist height, turned forward. She crosses the red carpet to the door at x55, lens swinging with her stride. She opens it and corridor light floods the frame. Off-frame, breathy: &quot;Downtown first.&quot; HARD CUT. 18-22s SHOT 6 — PROPPED, street. 47°, camera on a stoop rail 3m away, static, crooked. A New York block behind her — brownstone steps, fire escapes, yellow cabs, steam from a vent. She walks in from screen-left at 18.5s, stands at x60 y50, spreads her arms: &quot;Look at this street.&quot; Then walks to the lens and takes it at 21.5s. Passers-by cross the foreground. HARD CUT. 22-26s SHOT 7 — PROPPED, diner. 84° wide, camera on the counter behind a plate, 0.7m from her, looking up. She is x55 y38, sits into frame, takes a bite, eyes widen, mouth full: &quot;Okay, that&#x27;s the one.&quot; Laughs, keeps eating. HARD CUT. 26-30s SHOT 8 — HELD, night, back in the room. 84°, arm&#x27;s length 0.5m, held above her. She lies back across the white bedding at x50 y55, hair spread, in the brown knit again. Bedside lamps and cove light are the only sources, windows black with city glow. Into the lens: &quot;Twenty thousand steps. Everything hurts.&quot; Softer: &quot;Same time tomorrow.&quot; Wave, the frame tilts as she lowers the camera. 30.0s black. SPEECH Only the quoted lines are spoken, at the timings given, all in her voice. Lips still at all other times. No voiceover, no second speaker, no offscreen voices. Delivery is casual, unrehearsed, mid-breath, sometimes trailing off. Volume rises over street noise in Shot 6, near-whisper in Shot 8. CONTINUITY The suite matches @ image1 in both interior sequences — same carpet, sculptures, headboard, sofa, lamps. Hair, necklace and ring identical throughout. PHYSICS Loose knit slides on the shoulder with every arm movement. Wavy hair lags a frame behind head turns. Bedding creases under her weight. Step energy visible in every HELD frame. LIGHTING Shots 1-4: cool daylight from the curtains screen-left as key, warm cove LED as fill, red carpet bouncing warmth into the shadows. Shot 5: corridor light through the doorway. Shots 6-7: hard street daylight, warm diner practicals. Shot 8: lamps and cove light only. AUDIO Diegetic only, from the same camera — room tone, footsteps, door, traffic, sirens, steam vents, diner clatter, wind. Ambience ducks under her lines. No music. LOCKS Photoreal live action, 4K detail, fine grain, warm consumer-camera colour, mild rolling shutter and auto-exposure hunting. She is the only person who speaks; background figures anonymous and unfocused. No subtitles.</pre>\n  <div class=\"cardmeta\">\n    <span><a href=\"https://x.com/higgsfield_ai\" rel=\"noopener nofollow\">@higgsfield_ai</a></span>\n    <span class=\"wf-data\">589 likes</span><span class=\"wf-data\">457 saves</span>\n  </div>\n  <div class=\"cardact\"><button class=\"copy\" data-copy=\"2083168602363150527\" type=\"button\">Copy prompt</button><a class=\"src wf-data\" href=\"https://x.com/higgsfield_ai/status/2083168602363150527\" rel=\"noopener nofollow\">View on X ↗</a><span class=\"fb\" data-fb=\"2083168602363150527\" role=\"status\"></span></div>\n</article>\n<article class=\"card\" data-id=\"2029632175482507599\" data-ct=\"image\"\n  data-models=\"Nano Banana\" data-use_cases=\"Beauty\"\n  data-techniques=\"Camera movement\" data-styles=\"Photorealistic\"\n  data-date=\"2026-03-05\" data-vs=\"95.6\" data-hv=\"1\"\n  data-q=\"&quot;subject&quot;: { &quot;identity&quot;: { &quot;biometric_reference&quot;: &quot;sydney sweene… {\n  &quot;subject&quot;: {\n    &quot;identity&quot;: {\n      &quot;biometric_re 5943921528832/img/ACj33PYyBD5RI7qH.jpg?name=small\" alt=\"Video from the original post\" loading=\"lazy\" referrerpolicy=\"no-referrer\"><span class=\"mb\">Video · 30s</span></div>\n  <h3><a href=\"/prompts/2088866007918268515\">30-SECOND CINEMATIC SHORT Create a 30-second cinematic sequence…</a></h3>\n  <div class=\"cardchips\"><span class=\"chip\" data-axis=\"model\" data-value=\"Seedance\">Seedance</span><span class=\"chip\" data-axis=\"model\" data-value=\"GPT Image\">GPT Image</span><span class=\"chip wf-data\" data-axis=\"technique\" data-value=\"Camera movement\">Camera movement</span><span class=\"chip wf-data\" data-axis=\"technique\" data-value=\"Transition / morph\">Transition / morph</span><span class=\"chip wf-data\" data-axis=\"style\" data-value=\"Cinematic\">Cinematic</span><span class=\"chip wf-data\" data-axis=\"style\" data-value=\"Photorealistic\">Photorealistic</span></div>\n  <pre class=\"ptext\" tabindex=\"0\" aria-label=\"Prompt, verbatim\">30-SECOND CINEMATIC SHORT\nCreate a 30-second cinematic sequence with the visual discipline of a major feature film. The world is entirely made from paper, cardboard, ink, and delicate handcrafted materials.\n00:00–00:05 — THE FIRST FOLD\nBegin with an extreme macro shot of a blank sheet of textured paper.\nA single fold slowly forms across its surface.\nLens: 100mm macro\nCamera: Completely static\nSoft daylight moves across the paper as the fold continues.\nCut precisely as the paper reaches its final shape.\n00:05–00:11 — THE CITY EMERGES\nTransition into a 50mm shot.\nThe folded paper begins forming miniature streets and architectural structures.\nBuildings rise naturally from the surface through carefully constructed paper folds.\nThe camera slowly tracks sideways.\nTiny windows catch the light.\nNothing feels computer-generated; every surface should have believable paper fibers, folds, shadows, and imperfections.\n00:11–00:17 — THE REVEAL\nMove into a 35mm shot.\nThe camera pulls backward.\nThe small dom transformations.\nNo flickering.\nNo duplicated structures.\nNo sudden environmental changes.\nDIRECTOR’S NOTE\nTreat this as a miniature feature film, not a visual-effects demonstration.\nThe camera should discover the world gradually.\nStart intimate.\nReveal scale.\nReturn to detail.\nFinish wide.\nThe audience should feel that they are watching a real handcrafted world photographed with a cinema camera.\nPhotorealistic 4K • tactile materials • feature-film cinematography • sophisticated lighting • realistic miniature photography • cinematic depth • precise camera movement • seamless visual continuity.</pre>\n  <div class=\"cardmeta\">\n    <span><a href=\"https://x.com/ChillaiKalan__\" rel=\"noopener nofollow\">@ChillaiKalan__</a></span>\n    <span class=\"wf-data\">407 likes</span><span class=\"wf-data\">409 saves</span>\n  </div>\n  <div class=\"cardact\"><button class=\"copy\" data-copy=\"2088866007918268515\" type=\"button\">Copy prompt</button><a class=\"src wf-data\" href=\"https://x.com/ChillaiKalan__/status/2088866007918268515\" rel=\"noopener nofollow\">View on X ↗</a><span class=\"fb\" data-fb=\"2088866007918268515\" role=\"status\"></span></div>\n</article>\n<article class=\"card\" data-id=\"2008952931484098637\" data-ct=\"image\"\n  data-models=\"Nano Banana\" data-use_cases=\"Food &amp; beverage\"\n  data-techniques=\"Camera movement\" data-styles=\"Photorealistic|Retro / vintage\"\n  data-date=\"2026-01-07\" data-vs=\"93.8\" data-hv=\"1\"\n  data-q=\"concept: a hyper-realistic 3d isometric view of a [insert locati… concept: a hyper-realistic 3d isometric view of a [insert location] scene on a circular base.\nsubject (visuals): a full-body, realistic human [insert description].\n* texture rule: the subject must have &quot;living human skin&quot; texture (subsurface scattering, pores, natural imperfections).\n* important: he is not a toy/doll. he looks like a real person inserted into the scene.\n* pose: [insert pose, e.g., arminn_ai 200895293148 const AVATARS = {"PrometheanAIX": "https://pbs.twimg.com/profile_images/2043694345749196800/vsv-cxdT_400x400.jpg", "higgsfield_ai": "https://pbs.twimg.com/profile_images/1906739239183630336/907a7JTU_400x400.jpg", "KeorUnreal": "https://pbs.twimg.com/profile_images/2038274199379443712/HGEFaPvT_400x400.jpg", "ManuAGI01": "https://pbs.twimg.com/profile_images/1792389743503929344/5NAkgng7_400x400.jpg", "CHAO2U_AI": "https://pbs.twimg.com/profile_images/2018484655750840320/6ZfNMPHb_400x400.jpg", "IqrasaifiAI": "https://pbs.twimg.com/profile_images/2070883209731248128/BZnJwoPG_400x400.jpg", "ChillaiKalan__": "https://pbs.twimg.com/profile_images/2042898125573197824/Em0FFxRw_400x400.jpg", "ZaraIrahh": "https://pbs.twimg.com/profile_images/1997170504713883651/mr6aPbte_400x400.jpg", "Naiknelofar788": "https://pbs.twimg.com/profile_images/2014919869259735040/MbBiQ58q_400x400.jpg", "PinodiArt": "https://pbs.twimg.com/profile_images/2017948625058287616/AUHPq1dP_400x400.jpg", "Arminn_Ai": "https://pbs.twimg.com/profile_images/1934377885055246336/TPOvBcnQ_400x400.jpg", "AIwithSarah_": "https://pbs.twimg.com/profile_images/2016454047679832064/qf_DsgPV_400x400.jpg"};

/* ── helpers ─────────────────────────────────────────────────────────── */
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const n = v => v == null ? "—" : v.toLocaleString("en-US");
const AXES = { models:"Model", uses:"Task", styles:"Style", techs:"Technique" };

const asList = (r, key) => Array.isArray(r[key]) ? r[key] : (r[key] == null ? [] : [r[key]]);
function counts(key){
  const m = new Map();
  DATA.forEach(r => asList(r, key).forEach(v => m.set(v, (m.get(v)||0)+1)));
  return [...m].sort((a,b) => b[1]-a[1]);
}

/* Filter state is shared across variants on purpose: flipping between
   directions keeps your query, so you compare the same result set. */
const state = { q:"", active:{models:[],uses:[],styles:[],techs:[],kind:[]} };

function matches(r){
  for (const k in state.active){
    const on = state.active[k];
    if (on.length && !on.some(v => asList(r, k).includes(v))) return false;
  }
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = (r.title+" "+r.prompt+" "+r.models.join(" ")+" "+r.uses.join(" ")+" "+
                 r.styles.join(" ")+" "+r.techs.join(" ")+" "+(r.handle||"")).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
const results = () => DATA.filter(matches);
const anyFilter = () => state.q || Object.values(state.active).some(a => a.length);

function emptyState(){
  return `<div class="empty">
    <b>No prompt matches that yet</b>
    <p>The library has ${DATA.length} prompts. Clear the filters to see all of them, or search for a model name like Seedance.</p>
    <button class="btn pri" data-clear type="button">Clear filters</button>
  </div>`;
}

/* ── shared chrome ───────────────────────────────────────────────────── */
function nav(){
  return `<nav class="nav"><div class="wrap">
    <span class="brand">Prompt Library</span>
    <span class="navlinks">
      <a href="#tasks">Tasks</a><a href="#models">Models</a>
      <a href="#styles">Styles</a><a href="#creators">Creators</a>
    </span>
  </div></nav>`;
}

/* The facet row, identical wherever it appears; only the container changes. */
function chipRow(perAxis){
  return Object.keys(AXES).flatMap(key =>
    counts(key).slice(0, perAxis).map(([v,c]) =>
      `<button class="chip" type="button" data-facet="${key}" data-value="${esc(v)}"
        aria-pressed="${state.active[key].includes(v)}">${esc(v)} <small>${c}</small></button>`)).join("");
}

/* One representative frame per tile, no picture used twice — a repeat would
   imply two different sets share a result. */
function repFrames(key){
  const used = new Set(), out = new Map();
  const tiles = counts(key).map(([v,c]) => ({
    v, c, srcs: DATA.filter(r => asList(r, key).includes(v) && r.img).map(r => r.img)
  })).sort((a,b) => a.srcs.length - b.srcs.length);
  tiles.forEach(t => {
    const pick = t.srcs.find(s => !used.has(s));
    if (pick){ used.add(pick); out.set(t.v, pick); }
  });
  return out;
}

function band(id, heading, key){
  const frames = repFrames(key);
  const items = counts(key).filter(([v]) => frames.has(v));
  return `<section class="sec" id="${id}"><div class="wrap">
    <div class="sec-h"><h2>${heading}</h2></div>
    <div class="tiles">${items.map(([v,c]) => `
      <a class="tile" href="#" data-facet="${key}" data-value="${esc(v)}">
        <span class="th"><img src="${esc(frames.get(v))}" alt="A prompt result from ${esc(v)}"
          loading="lazy" referrerpolicy="no-referrer" width="320" height="200"></span>
        <span class="tb"><h3>${esc(v)}</h3><p>${c} prompts</p></span>
      </a>`).join("")}</div>
  </div></section>`;
}

/* Images / Videos and the closing call to action are settled parts of this
   page. A direction may re-present the results; it does not get to delete
   sections the product already decided on. */
function catBand(){
  const frames = repFrames("kind");
  const label = { image:"Images", video:"Videos" };
  const items = [["image", DATA.filter(r => r.kind === "image").length],
                 ["video", DATA.filter(r => r.kind === "video").length]];
  return `<section class="sec" id="category"><div class="wrap">
    <div class="sec-h"><h2>Browse by category</h2></div>
    <div class="cat">${items.map(([k,c]) => `
      <a class="tile" href="#" data-facet="kind" data-value="${k}">
        <span class="th">${frames.get(k) ? `<img src="${esc(frames.get(k))}"
          alt="A prompt result from ${label[k]}" loading="lazy" referrerpolicy="no-referrer"
          width="560" height="350">` : ""}</span>
        <span class="tb"><h3>${label[k]}</h3><p>${c} prompts</p></span>
      </a>`).join("")}</div>
  </div></section>`;
}
function ctaBand(){
  return `<section class="cta"><div class="wrap">
    <h2>Take a prompt and start</h2>
    <p>Free to copy, every one credited to the person who wrote it.</p>
    <button class="btn pri" type="button" style="min-height:44px;padding:0 20px">Generate in bo</button>
  </div></section>`;
}

function creators(){
  const m = new Map();
  DATA.forEach(r => { if (r.handle) m.set(r.handle, (m.get(r.handle)||0)+1); });
  const top = [...m].sort((a,b) => b[1]-a[1]).slice(0,8);
  return `<section class="sec" id="creators"><div class="wrap">
    <div class="sec-h"><h2>Creators</h2></div>
    <div class="people">${top.map(([h,c]) => `
      <a class="person" href="https://x.com/${esc(h.replace("@",""))}" rel="noopener nofollow" target="_blank">
        <span class="av">${AVATARS[h.replace("@","")]
          ? `<img src="${esc(AVATARS[h.replace("@","")])}" alt="" loading="lazy"
               referrerpolicy="no-referrer" width="34" height="34" onerror="this.remove()">` : ""}</span>
        <b>${esc(h)}</b><span>${c} prompts</span>
      </a>`).join("")}</div>
  </div></section>`;
}

/* The footer is the crawl surface. It is identical in all five directions and

const FOOT_COLS = [

];
function foot(){

/* Every direction closes with the same crawl surface. */
function tail(){

/* ══ V4 · Method — the editorial exception ════════════════════════════ */
/* ══ The library, five poster densities ═══════════════════════════════
   The argument above is shared code, so it is byte-identical in every
   variant by construction. Every card here is the same idea — picture
   on top, name under it — and only the density and the crop change. */

const cShot = r => r.img
  ? `<span class="shot"><img src="${esc(r.img)}" alt="Result from ${esc(r.title)}"
       loading="lazy" referrerpolicy="no-referrer"></span>`
  : `<span class="noshot">no picture<br>on the source post</span>`;
const cCred = r => `<p class="cred">${esc(r.handle||"unattributed")}
    <span>${n(r.likes)} likes</span>
    <button class="btn" type="button" data-copy="${r.id}">Copy</button></p>`;

/* One card, one shape. `first` is only ever set by Lead. */
const card = (r, first) => `
  <article class="c${first ? " first" : ""}">${cShot(r)}
    <div class="body"><h3>${esc(r.title)}</h3>${cCred(r)}</div>
  </article>`;

function grid(firstIsLead){
  const rows = results();
  if (!rows.length) return emptyState();
  return `<div class="cardgrid">${
    rows.map((r,i) => card(r, firstIsLead && i === 0)).join("")}</div>`;
}

/* Four of the five differ only in the stylesheet — same markup, same
   card, different grid and crop — so they share one renderer. Lead is
   the only one that changes the markup, by marking the first card. */
const plain = () => grid(false);
const INDEXES = { three: plain, square: plain, landscape: plain,
                  masonry: plain, lead: () => grid(true) };

/* The shell. Every variant calls this with the same arguments except the
   index key, so the first screen cannot differ between them. */
function methodShell(ix){
  return `<div class="vme taste ix-${ix}" data-ix="${ix}">${nav()}<main id="main">
    <section class="wrap argument">
      <h1>Somebody already wrote this</h1>
      <div class="body">
        <p>Every prompt in this library was published in the open by the person who
          wrote it, and then mostly lost — buried under a feed that is optimised for
          the next thing rather than the useful thing.</p>
        <p>So the whole of the work here is <em>not editing</em>. No paraphrase, no
          house style, no distillation into a template. The text you copy is the text
          they posted, down to the render settings at the end that look like noise and
          are not.</p>
        <p>What we add is the index, the attribution, and a link back. That is the
          entire product.</p>
      </div>
      <p class="sig">${DATA.length} prompts · every one credited · every one links to its source</p>
    </section>
    <div class="after">
      <section class="wrap lede">

        <div class="search" style="margin-top:24px">
          <input id="q" type="search" placeholder="Search prompts, models, styles, creators…"
            aria-label="Search prompts" value="${esc(state.q)}">
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">${chipRow(4)}</div>
      </section>
      <section class="wrap" id="results"><h2 class="vh">All prompts</h2>

    </div>
  </main>${foot()}</div>`;
}
const vThree     = () => methodShell("three");
const vSquare    = () => methodShell("square");
const vLandscape = () => methodShell("landscape");
const vMasonry   = () => methodShell("masonry");
const vLead      = () => methodShell("lead");

/* ── behaviour, delegated once so the picker wiring stays verbatim ───── */
const variants = [vThree, vSquare, vLandscape, vMasonry, vLead];
const stage = document.getElementById('stage');

const kind = () => (stage.firstElementChild ? stage.firstElementChild.className : "");
function put(sel, html){ const el = stage.querySelector(sel); if (el) el.innerHTML = html; }

function redraw(){
  const ix = stage.firstElementChild && stage.firstElementChild.dataset.ix;
  if (ix && INDEXES[ix]) put('[data-results]', INDEXES[ix]());
}
stage.addEventListener('click', e => {
  const copy = e.target.closest('[data-copy]');
  if (copy){
    const r = DATA.find(x => x.id === copy.getAttribute('data-copy'));
    const label = copy.getAttribute('data-label') || copy.textContent;
    copy.setAttribute('data-label', label);
    const done = () => {
      copy.textContent = 'Copied';
      copy.setAttribute('data-copied','');
      setTimeout(() => { copy.textContent = label; copy.removeAttribute('data-copied'); }, 1500);

  if (facet){

    const i = on.indexOf(v);
    if (i < 0) on.push(v); else on.splice(i,1);

    return;
  }
  if (e.target.closest('[data-clear]')){
    state.q = "";
    Object.keys(state.active).forEach(k => state.active[k] = []);
    stage.querySelectorAll('.chip[data-facet]').forEach(c => c.setAttribute('aria-pressed','false'));
    const q = stage.querySelector('#q'); if (q) q.value = "";
    redraw();
    return;
  }
  const rail = e.target.closest('[data-rail]');
  if (rail){
    const box = stage.querySelector('[data-rail-box]');
    if (box){
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      box.scrollBy({ left: +rail.getAttribute('data-rail') * Math.round(box.clientWidth * 0.8),
                     behavior: reduce ? 'auto' : 'smooth' });
    }
    return;
  }
});

let tm;
stage.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  clearTimeout(tm);
  tm = setTimeout(() => { state.q = e.target.value.trim(); redraw(); }, 300);
});
</script>

<script>
/* ─── Picker wiring · verbatim from PICKER.md ──────────────────────────── */
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  const paint = () => { stage.innerHTML = variants[i](); };
  if (document.hidden) setTimeout(paint, 0);
  else requestAnimationFrame(paint);
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>

<script>
/* ─── Linear dark theme · toggle + iframe reach-in ──────────────────────── */
const THEME_CSS = document.getElementById('linear-dark-theme').textContent;
const themeBtn = document.getElementById('theme-toggle');
const root = document.documentElement;

function applyTheme(on){
  if (on) root.setAttribute('data-theme', 'linear-dark');
  else root.removeAttribute('data-theme');
  themeBtn.setAttribute('aria-pressed', String(on));
  themeToIframes(on);
}

function setTheme(on, { persist = true } = {}){
  applyTheme(on);
  if (persist){
    const url = new URL(location);
    if (on) url.searchParams.set('theme', 'linear-dark');
    else url.searchParams.delete('theme');
    history.replaceState(null, '', url);
  }
}

/* The baseline (v1) is a real page rendered in its own document via
   <iframe srcdoc>; a parent stylesheet does not reach across that boundary.
   Same-origin srcdoc iframes are reachable from the parent, so set the
   attribute and copy the theme's CSS text into the iframe's own <head>. */
function themeIframe(iframe, on){
  const doc = iframe.contentDocument;
  if (!doc || !doc.documentElement) return;
  if (on) doc.documentElement.setAttribute('data-theme', 'linear-dark');
  else doc.documentElement.removeAttribute('data-theme');
  if (on && !doc.getElementById('linear-dark-theme')){
    const style = doc.createElement('style');
    style.id = 'linear-dark-theme';
    style.textContent = THEME_CSS;
    (doc.head || doc.documentElement).appendChild(style);
  }
}

function themeToIframes(on){
  stage.querySelectorAll('iframe').forEach(iframe => {
    const ready = () => themeIframe(iframe, on);
    const doc = iframe.contentDocument;
    // Right after an <iframe srcdoc> is inserted, contentDocument is
    // momentarily the interim about:blank document — already
    // readyState "complete" with an empty body — before the srcdoc content
    // itself has been parsed. Require real content, not just "complete", or
    // this fires once on the blank interim doc and then never again because
    // its real 'load' event was never listened for.
    if (doc && doc.readyState === 'complete' && doc.body && doc.body.firstChild) ready();
    else iframe.addEventListener('load', ready, { once: true });
  });
}

/* mount() stays verbatim (it just repaints #stage's innerHTML), so pick up
   every variant switch — including a fresh baseline iframe — by observing
   #stage itself rather than patching the picker's own code. */
new MutationObserver(() => themeToIframes(root.hasAttribute('data-theme')))
  .observe(stage, { childList: true });

themeBtn.addEventListener('click', () => setTheme(!root.hasAttribute('data-theme')));

setTheme(new URLSearchParams(location.search).get('theme') === 'linear-dark', { persist: false });
</script>
