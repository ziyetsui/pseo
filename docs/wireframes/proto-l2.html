<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image prompts (L2) — four directions</title>

<style>
/* ─── Real materials · :root lifted verbatim from real-l2.html ─────────────
   Nothing here is invented. The additions live in the next block and are
   labelled, so the line between "what the page already had" and "what this
   exploration added" stays legible. */
:root{
  color-scheme:light dark;
  --bg:light-dark(rgb(255 255 255), rgb(24 24 24));
  --fg:light-dark(rgb(26 28 31), rgb(255 255 255));
  --muted-fg:light-dark(rgb(26 28 31 / 50%), rgb(255 255 255 / 50%));
  --faint-fg:light-dark(rgb(26 28 31 / 34%), rgb(255 255 255 / 34%));
  --border:light-dark(rgb(26 28 31 / 9%), rgb(255 255 255 / 9%));
  --card:color-mix(in oklab, var(--fg) 4%, transparent);
  --muted:color-mix(in srgb, var(--fg) 8%, transparent);
  --border-strong:light-dark(rgb(26 28 31 / 20%), rgb(255 255 255 / 20%));
  --primary:var(--fg); --primary-fg:light-dark(rgb(255 255 255), rgb(13 13 13));
  --ok:light-dark(rgb(0 138 76), rgb(96 204 146));
  --cand:light-dark(rgb(158 106 12), rgb(224 176 96));
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}

/* ─── Additions to the real token set ──────────────────────────────────────
   Five, and each says why it is here.
   1. --surface: the linear-dark block sets it; the light side needs a value
      or the dark theme introduces a token light mode does not have.
   2. --img-outline / --ok-fg: the real page hard-codes both, and the
      hard-coded values are wrong once the theme is forced by attribute
      rather than by prefers-color-scheme.
   3. --z-*: one z scale, so nothing invents a stacking number.
   4. --p-*: the part washes for Anatomy. They are the one place saturated
      colour enters this file, and they only ever paint BEHIND prompt text —
      see the Linear rule in TASTE-FOUNDATION.md. Text colour stays --fg, so
      annotating a prompt cannot lower its contrast.
   5. --muted-fg / --faint-fg are OVERRIDDEN in light mode, and this is the
      one place this file departs from the shipped tokens. Measured on the
      rendered page: the shipped `rgb(26 28 31 / 50%)` reads 3.30:1 on white
      and `/ 34%` reads 2.13:1, and this project spends both on 10.5–14px
      text — captions, tag pills, footer sitemap links, chip labels. Both are
      below the 4.5:1 floor. The replacements are not invented: they are
      Linear's own LIGHT ink ladder from the survey — secondary `#3c4149`
      (10.27:1) and tertiary `#6f6e77` (5.03:1) — the exact counterparts of
      the `#d0d6e0` / `#8a8f98` the dark theme block already uses. Lightness
      only; no saturation was added. The dark branch is set to the same pair
      the theme block uses, so a forced theme and a system dark preference
      render identically. The shipped :root above is left verbatim so the
      difference stays legible. */
:root{
  --muted-fg:light-dark(#3c4149, #d0d6e0);
  --faint-fg:light-dark(#6f6e77, #8a8f98);
  --surface:light-dark(rgb(250 250 251), rgb(28 28 31));
  --img-outline:light-dark(rgb(0 0 0 / .1), rgb(255 255 255 / .1));
  --ok-fg:light-dark(#fff, #08090a);
  --z-bar:20; --z-pop:30; --z-nav:40; --z-skip:100;
  --p-light:light-dark(color-mix(in oklab,#f0bf00 34%,transparent), color-mix(in oklab,#f0bf00 26%,transparent));
  --p-cam:light-dark(color-mix(in oklab,#4ea7fc 30%,transparent), color-mix(in oklab,#4ea7fc 26%,transparent));
  --p-qual:light-dark(color-mix(in oklab,#00b8cc 28%,transparent), color-mix(in oklab,#00b8cc 26%,transparent));
  --p-neg:light-dark(color-mix(in oklab,#eb5757 26%,transparent), color-mix(in oklab,#eb5757 26%,transparent));
  --p-par:light-dark(color-mix(in oklab,#5e6ad2 26%,transparent), color-mix(in oklab,#7170ff 30%,transparent));
  --p-ph:light-dark(color-mix(in oklab,#fc7840 30%,transparent), color-mix(in oklab,#fc7840 28%,transparent));
}

/* ─── Measured from the Linear survey (specs/images/linear-design-token-
   reference.md, 29 routes). Copied from l1-taste.src.html, not retyped. Not
   invented, and not a full design system. ─────────────────────────────── */
@font-face{
  font-family:"InterVariable";
  font-style:normal;
  font-weight:100 900;
  font-display:swap;
  src:url("https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/files/inter-latin-wght-normal.woff2") format("woff2");
}
:root{
  /* The one token from the real page this file overrides: the sans stack gets
     Inter Variable in front of it. The survey is explicit that 510/590 are the
     point and that a system stack snapping them to 500/600 changes the tone,
     which is the whole reason the web font is here. The platform stack stays
     behind it, so a failed load degrades rather than breaks. PROTOTYPE
     dependency: frontend/AGENTS.md §7.6 has not ruled on a production face. */
  --sans:"InterVariable",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  /* Variable weights. 510 and 590 are the point; 400 stays the text weight. */
  --w-text:400; --w-medium:510; --w-semi:590;
  /* Container ladder: 1436 = 1344 homepage frame + 46px gutters either side. */
  --w-wide:1436px; --w-page:1024px; --w-prose:624px;
  /* Motion. Four durations, three easings — nothing else. */
  --t-quick:100ms; --t-regular:250ms; --t-out:150ms;
  --e-out:cubic-bezier(.25,.46,.45,.94);
  --e-emphatic:cubic-bezier(.23,1,.32,1);
  --e-structural:cubic-bezier(.455,.03,.515,.955);
  /* Light-mode elevation ladder. Dark collapses to a ring (theme block). */
  --sh-tiny:0 1px 1px #00000017;
  --sh-low:0 1px 4px -1px #00000017;
  --sh-med:0 3px 12px #00000017;
  --sh-high:0 7px 24px #0000000f;
  /* Retina hairline for the lines that separate rather than elevate. */
  --hairline:1px;
}
@media only screen and (min-resolution:192dpi){ :root{ --hairline:.5px } }

/* cv01 opens the digits, ss03 the alternate letterforms — both are what
   aiforui.dev enables on its own Inter. Declared on the base body rule below
   rather than here: the `font:` SHORTHAND in that rule resets
   font-feature-settings to normal, and it comes later in the cascade, so a
   declaration at this point is silently thrown away. Verified by reading
   back the computed value. */

/* The H1 tier ladder: size is a function of the page's rank in the site, not
   of its content. L2 is an index page, so 48px / 510 / 1.0 / −0.022em.
   At 1360 the clamp resolves to 48px and the tracking to −1.056px. */
.tier-flagship{font-size:clamp(38px,5vw,64px);font-weight:var(--w-medium);
  line-height:1;letter-spacing:-.022em;text-wrap:balance}
.tier-index{font-size:clamp(32px,3.6vw,48px);font-weight:var(--w-medium);
  line-height:1;letter-spacing:-.022em;text-wrap:balance}
.tier-ref{font-size:clamp(28px,2.8vw,40px);font-weight:var(--w-medium);
  line-height:1.1;letter-spacing:-.022em;text-wrap:balance}

/* The header is 72px + a 1px hairline and its background is fully
   transparent — the translucency is entirely backdrop-filter. */
.taste .nav{background:transparent;backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:var(--z-nav)}
.taste .nav .wrap{min-height:72px}
.taste .wrap{max-width:var(--w-wide)}
.taste .prose{max-width:var(--w-prose)}

/* ─── Base ──────────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} }
body{margin:0;background:var(--bg);color:var(--fg);
  font:var(--w-text) 15px/1.6 var(--sans);
  font-feature-settings:"cv01","ss03";
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-synthesis:none;overflow-x:hidden}
a{color:inherit;text-decoration:none}
@media (hover:hover) and (pointer:fine){
  a:hover{text-decoration:underline;text-decoration-thickness:.5px;text-underline-offset:2px}
}
button{font:inherit;color:inherit;cursor:pointer}
button,a,input,select,textarea,summary{touch-action:manipulation}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:5px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1{font-size:clamp(32px,3.6vw,48px);font-weight:var(--w-medium);
  line-height:1;letter-spacing:-.022em}
h2{font-size:24px;line-height:1.33;letter-spacing:-.012em;font-weight:var(--w-semi)}
h3{font-size:17px;line-height:1.4;letter-spacing:-.012em;font-weight:var(--w-semi)}
h4{font-size:15px;line-height:1.4;letter-spacing:-.011em;font-weight:var(--w-medium)}
p{margin:0}
ul{margin:0}
[id]{scroll-margin-top:88px}
img{outline:1px solid var(--img-outline);outline-offset:-1px}
.skip{position:absolute;left:-9999px;background:var(--fg);color:var(--primary-fg);
  padding:12px 16px;border-radius:8px;z-index:var(--z-skip)}
.skip:focus{left:12px;top:12px}

/* Variant 1 owns the viewport: it is a whole document of its own. */
.baseline{display:block;width:100%;height:100dvh;border:0}

/* The one gutter rule. Never set a `padding` SHORTHAND on anything that is
   also a .wrap — that resets the inline axis to 0 and flushes content to the
   viewport edge. This has bitten the project twice. */
.wrap{max-width:var(--w-wide);margin:0 auto;padding:0 28px}

/* ─── Shared chrome ─────────────────────────────────────────────────────── */
.nav .wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.brand{font-weight:var(--w-semi);letter-spacing:-.02em;font-size:16px;margin-right:auto;
  display:inline-flex;align-items:center;gap:9px;min-height:44px}
.brand i{width:8px;height:8px;border-radius:2px;background:var(--fg);font-style:normal}
.navlinks{display:flex;gap:18px;font-size:13.5px;color:var(--muted-fg);flex-wrap:wrap}
.navlinks a{display:inline-flex;align-items:center;min-height:44px;
  transition-property:color;transition-duration:var(--t-out);transition-timing-function:var(--e-out)}
@media (hover:hover) and (pointer:fine){ .navlinks a:hover{color:var(--fg)} }
.navlinks a[aria-current="page"]{color:var(--fg);font-weight:var(--w-medium)}

.crumbs{font:12px/1.5 var(--mono);color:var(--faint-fg);display:flex;gap:8px;
  flex-wrap:wrap;align-items:center;padding-top:8px}
.crumbs a{display:inline-flex;align-items:center;min-height:44px}

.hero{padding-top:64px;padding-bottom:36px}
.lede{margin-top:18px;color:var(--muted-fg);font-size:17px;line-height:1.6;
  max-width:var(--w-prose);text-wrap:pretty}
.searchbar{margin-top:26px;display:flex;gap:8px;border:1px solid var(--border);
  border-radius:12px;padding:7px;max-width:620px;background:var(--bg)}
.searchbar input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);
  font:16px var(--sans);padding:9px 11px;outline:none;min-height:44px}
@media (min-width:768px){ .searchbar input{font-size:15px} }
.searchbar input::placeholder{color:var(--faint-fg)}
.count{font:12px/1.5 var(--mono);color:var(--faint-fg);font-variant-numeric:tabular-nums}
.eyebrow{font:var(--w-semi) 11px/1.5 var(--mono);letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint-fg)}

.sec{padding-top:52px;padding-bottom:52px;border-top:var(--hairline) solid var(--border)}
.sec:first-of-type{border-top:0}
.sec-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.sec-head .end{margin-left:auto}

.btn{border:1px solid var(--border);background:transparent;border-radius:8px;
  padding:0 14px;font-size:13.5px;white-space:nowrap;display:inline-flex;align-items:center;
  justify-content:center;gap:6px;min-height:40px;position:relative;
  transition-property:background-color,border-color,color;
  transition-duration:var(--t-out);transition-timing-function:var(--e-out)}
.btn:active{transform:scale(.96)}
/* 40px of ink + 2px of reach on each side = 44. .btn.sm re-declares its own
   larger reach below and wins on specificity. */
.btn::after{content:"";position:absolute;inset:-2px}
@media (hover:hover) and (pointer:fine){
  .btn:hover{background:var(--card);border-color:var(--border-strong);text-decoration:none}
}
.btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.btn.sm{padding:0 11px;font-size:12.5px;border-radius:6px;min-height:34px}
/* 34px of ink + 5px of invisible reach = 44px. Rows using .sm keep a 12px gap
   so two neighbouring reaches stay 2px apart and never overlap. */
.btn.sm::after{content:"";position:absolute;inset:-5px}
.btn.ghost{border-color:transparent;color:var(--muted-fg)}
.btn[data-copied]{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.btn.primary[data-copied]{background:var(--ok);border-color:var(--ok);color:var(--ok-fg)}

.chips{display:flex;gap:12px;flex-wrap:wrap}
.chip{border:1px solid var(--border);border-radius:999px;padding:0 12px;min-height:34px;
  background:transparent;color:var(--muted-fg);font:inherit;font-size:13px;
  display:inline-flex;gap:7px;align-items:center;position:relative;
  transition-property:background-color,border-color,color;
  transition-duration:var(--t-out);transition-timing-function:var(--e-out)}
.chip::after{content:"";position:absolute;inset:-5px}
.chip:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){
  .chip:hover{color:var(--fg);border-color:var(--border-strong)}
}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.chip small{font:11px/1 var(--mono);opacity:.65;font-variant-numeric:tabular-nums}

.facets{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.facets h3{font:var(--w-semi) 11px/1.5 var(--mono);letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint-fg);margin-bottom:10px}

.media{background:var(--muted);position:relative;overflow:hidden;display:grid;place-items:center}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media .mb{position:absolute;left:8px;bottom:8px;background:rgb(0 0 0/.66);color:#fff;
  font:var(--w-medium) 10px/1 var(--mono);letter-spacing:.05em;padding:5px 7px;border-radius:5px;
  font-variant-numeric:tabular-nums;backdrop-filter:blur(6px)}
.nomedia{font:10.5px/1.5 var(--mono);color:var(--muted-fg);letter-spacing:.06em;
  padding:14px;text-align:center;outline:1px solid var(--img-outline);outline-offset:-1px}

.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags .tag{font:10.5px/1.5 var(--mono);border:1px solid var(--border);border-radius:5px;
  padding:2px 7px;color:var(--muted-fg)}
.meta{display:flex;gap:2px 14px;flex-wrap:wrap;align-items:center;font:11.5px/1.6 var(--mono);
  color:var(--muted-fg);font-variant-numeric:tabular-nums}
.meta b{color:var(--fg);font-weight:var(--w-medium)}
.meta .hv{color:var(--ok)}
.meta a{display:inline-flex;align-items:center;min-height:34px;position:relative}
.meta a::after{content:"";position:absolute;inset:-5px}
.av{width:20px;height:20px;border-radius:50%;object-fit:cover;background:var(--muted);
  outline:none;flex:none;margin-right:6px;vertical-align:-5px}

pre.prompt{margin:0;font:12.5px/1.7 var(--mono);color:var(--muted-fg);white-space:pre-wrap;
  word-break:break-word;overflow-wrap:anywhere}
.ph{background:color-mix(in srgb,var(--cand) 26%,transparent);color:var(--fg);
  border-radius:3px;padding:0 3px}

.empty{border:1px dashed var(--border-strong);border-radius:12px;padding:48px 28px;
  text-align:center;min-height:260px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px}
.empty b{font-size:18px;font-weight:var(--w-semi);letter-spacing:-.012em}
.empty p{color:var(--muted-fg);font-size:14px;max-width:48ch;text-wrap:pretty}

/* Result titles are whole-heading links. The heading's own line box is
   17–21px here, so each one carries 13px of invisible reach above and below,
   cancelled by an equal negative margin so nothing moves. Their neighbours in
   every direction are figures, <pre>, <dl> and plain spans — no other hit
   area to overlap. */
.v2 .cap h3 a, .v3 .det a, .v4 .dc h3 a{
  display:inline-block;padding-block:13px;margin-block:-13px}

/* Entry points into the model pages. Both the name and the trailing link go
   to L3 — the page already settled that, and every direction keeps it. */
.entry{display:grid;gap:0;list-style:none;padding:0}
.entry li{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  border-top:var(--hairline) solid var(--border);padding:6px 0}
.entry li:last-child{border-bottom:var(--hairline) solid var(--border)}
.entry .nm{display:flex;align-items:baseline;min-height:44px;font-size:17px;
  font-weight:var(--w-medium);letter-spacing:-.012em;flex:1;min-width:0;gap:12px;
  padding-top:10px}
.entry .nm span{font:11px/1 var(--mono);color:var(--faint-fg);font-variant-numeric:tabular-nums;
  font-weight:var(--w-text)}
.entry .ch{font:11.5px/1.6 var(--mono);color:var(--muted-fg);flex-basis:100%;
  font-variant-numeric:tabular-nums;margin:-6px 0 6px}
.entry .go{display:inline-flex;align-items:center;min-height:44px;padding:0 2px;
  font:12px/1 var(--mono);color:var(--muted-fg);white-space:nowrap}

.linkcols{display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.linkcols h3{font:var(--w-semi) 11px/1.5 var(--mono);letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint-fg);margin-bottom:6px}
.linkcols ul{list-style:none;margin:0;padding:0}
.linkcols a{display:flex;align-items:center;min-height:44px;font-size:13.5px;color:var(--muted-fg);
  gap:8px}
.linkcols a b{color:var(--fg);font-weight:var(--w-text)}

/* The footer is the crawl surface: identical in all three directions, link
   for link with the shipped page (33 links). The sitemap rows sit at 40px
   rather than 44 — a deliberate, stated exception. */
footer.foot{padding-top:40px;padding-bottom:28px;border-top:var(--hairline) solid var(--border);
  color:var(--faint-fg);font:11.5px/1.6 var(--mono)}
.footnav{display:grid;gap:24px 20px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  margin-bottom:26px}
.footnav h3{font:var(--w-semi) 10.5px/1.5 var(--mono);letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint-fg);margin:0 0 6px}
.footnav ul{list-style:none;margin:0;padding:0}
.footnav a{color:var(--muted-fg);font:13px/1.4 var(--sans);display:flex;align-items:center;min-height:40px}
.footlegal{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;
  padding-top:18px;border-top:var(--hairline) solid var(--border)}

@media (max-width:640px){
  /* The header wraps to two rows at 375 (111px). Sticky, that is 14% of the
     viewport gone for the whole scroll, so below 640 it scrolls away. */
  .taste .nav{position:static}
  .wrap{padding-left:18px;padding-right:18px}
  .hero{padding-top:40px;padding-bottom:28px}
  .sec{padding-top:36px;padding-bottom:36px}
  .navlinks{gap:14px;font-size:13px}
}


/* One addition beyond the taste block, used by exactly one direction.
   BRIEF.md names the system serif as a legitimate display pairing; a
   Specimen card prints its determination line in italic serif because that
   is what a herbarium or accession label does, and nothing else on the page
   is set in it. No new colour, no web font. */
:root{
  --serif:ui-serif,Georgia,"Times New Roman",serif;
  /* One measured repair, light mode only. The shipped `--ok` is
     `rgb(0 138 76)`, and this page spends it on 11.5px text — the "Popular"
     flag in a meta row and the "Copied" state of a copy button. Measured on
     the rendered page it reads 4.43:1 on white, under the 4.5 floor, and the
     baseline iframe shows the same number. `#008449` is the same hue and the
     same channel ratio 4% darker: 4.78:1 on --bg and 4.58:1 on --surface.
     Lightness only; no saturation added. The dark branch is left to the theme
     block, whose `#4cc38a` already measures 7.9–9.0:1 on the canvas ladder. */
  --ok:light-dark(#008449, #4cc38a);
}

/* ══ V2 · Postcard ════════════════════════════════════════════════════════
   Axis: THE CARD HAS A BACK. One card, two faces, and the flip is the whole
   interaction. The front is the result at postcard scale — picture edge to
   edge, a caption strip, nothing else. The back is the postal division: the
   entire prompt typed on ruled stock on the message half, and a stamp, a
   postmark and the address lines (author, reach, tags) on the other.

   Both faces are always in the DOM, so the full prompt text is on the page
   whether or not anyone flips — the crawl surface does not depend on an
   interaction. The hidden face takes `inert`, so it is out of the tab order
   and off the a11y tree without leaving the document. */
.v2 .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));
  gap:26px;margin-top:22px}
.v2 .pc{--pc-h:400px;position:relative;height:var(--pc-h);perspective:1600px}
.v2 .flip{position:absolute;inset:0;transform-style:preserve-3d;
  transition-property:transform;transition-duration:520ms;
  transition-timing-function:var(--e-emphatic)}
.v2 .pc[data-face="back"] .flip{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){ .v2 .flip{transition-duration:0s} }
.v2 .face{position:absolute;inset:0;border:1px solid var(--border);border-radius:12px;
  background:var(--bg);overflow:hidden;box-shadow:var(--sh-low);
  backface-visibility:hidden;-webkit-backface-visibility:hidden}
.v2 .face.back{transform:rotateY(180deg)}

.v2 .front{display:flex;flex-direction:column}
.v2 .front .media{flex:1;min-height:0}
.v2 .front .nomedia{max-width:74%}
.v2 .cap{display:flex;align-items:center;gap:12px;padding:8px 15px 10px;
  border-top:1px solid var(--border);background:var(--bg)}
/* The truncation lives on the <a>, not on the <h3>: overflow:hidden on the
   heading clips the link's padding box, and that padding box IS the 44px hit
   area, so the title silently loses its reach. */
.v2 .cap h3{flex:1;min-width:0;font-size:15px;font-weight:var(--w-medium);line-height:1.35;
  letter-spacing:-.011em}
.v2 .cap h3 a{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* The postal division: message left, address right, one hairline between.
   The explicit row matters: a grid row defaults to auto, so a 3,990-character
   prompt sizes the row to its own height and pushes the address block out of
   the card — which `overflow:hidden` then hides without a trace. */
.v2 .back{display:grid;grid-template-columns:minmax(0,1fr) 1px 236px;
  grid-template-rows:minmax(0,1fr)}
.v2 .rule{background:var(--border)}
.v2 .msg{display:flex;flex-direction:column;gap:8px;min-width:0;padding:15px 17px}
.v2 .msg .hd{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;
  font:10.5px/1.5 var(--mono);letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint-fg);font-variant-numeric:tabular-nums}
/* Ruled stock. The rule pitch and the line box are both 21px, and the
   gradient scrolls with the text (background-attachment:local) so the words
   never drift off their lines. */
.v2 .msg pre{margin:0;flex:1;min-height:0;overflow:auto;
  font:12.5px/21px var(--mono);color:var(--fg);white-space:pre-wrap;
  overflow-wrap:anywhere;word-break:break-word;
  background-image:linear-gradient(to bottom,transparent 0 20px,
    color-mix(in srgb,var(--fg) 9%,transparent) 20px 21px);
  background-size:100% 21px;background-attachment:local}

.v2 .addr{display:flex;flex-direction:column;gap:11px;min-width:0;padding:15px 17px}
.v2 .frank{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
/* Stamp and postmark are drawn from real fields — the stamp's denomination is
   the like count, the postmark carries the model that produced the picture. */
.v2 .stamp{flex:none;width:56px;height:68px;padding:5px 4px;border-radius:3px;
  border:1px solid var(--border-strong);outline:1px dashed var(--border);outline-offset:3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  text-align:center;transform:rotate(-2.2deg);
  font:var(--w-semi) 9px/1.25 var(--mono);letter-spacing:.05em;color:var(--faint-fg)}
.v2 .stamp b{font:var(--w-semi) 15px/1 var(--mono);color:var(--fg);
  font-variant-numeric:tabular-nums}
.v2 .postmark{flex:none;width:76px;height:76px;border-radius:50%;padding:9px;
  border:1.5px solid var(--border-strong);outline:1px solid var(--border);outline-offset:-6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  text-align:center;transform:rotate(-7deg);overflow:hidden;
  font:var(--w-semi) 9px/1.2 var(--mono);letter-spacing:.03em;color:var(--faint-fg)}
.v2 .postmark b{font:var(--w-semi) 9.5px/1.2 var(--mono);color:var(--muted-fg);
  letter-spacing:.01em}
.v2 .lines{display:flex;flex-direction:column;margin-top:auto}
.v2 .lines .ln{display:flex;align-items:center;gap:7px;min-height:34px;
  border-bottom:1px solid var(--border);font:11.5px/1.5 var(--mono);color:var(--muted-fg);
  font-variant-numeric:tabular-nums;overflow:hidden}

@media (max-width:900px){
  .v2 .cards{grid-template-columns:1fr}
  .v2 .pc{--pc-h:560px}
  .v2 .back{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 1px auto}
  .v2 .lines{margin-top:6px}
}
@media (max-width:560px){ .v2 .pc{--pc-h:640px} }

/* ══ V3 · Specimen ════════════════════════════════════════════════════════
   Axis: THE CARD IS A MOUNT AND A PRINTED LABEL. Not a tile with a caption:
   an accession card. The picture is mounted with air around it and held by
   drawn corner mounts; underneath, the same six-line label is printed on
   every card in the same order, so two cards can be read against each other
   without reading their prose. The prompt itself is the catalogue
   description, folded into a <details> that works with no JavaScript. */
.v3 .cabinet{display:grid;grid-template-columns:repeat(auto-fill,minmax(274px,1fr));
  gap:22px;margin-top:22px}
.v3 .sp{display:flex;flex-direction:column;gap:13px;padding:16px;
  border:1px solid var(--border);border-radius:10px;background:var(--bg);
  box-shadow:var(--sh-tiny)}
/* Nested radius would go negative against a 16px mount padding, so the mount
   takes the smallest radius on the observed Linear ladder instead. */
/* isolation:isolate so the two corner mounts can sit above the picture with
   a depth of 1 inside the mount, not a layer in the page's z scale. Without
   it ::before paints under .media (both are positioned, DOM order decides)
   and only the bottom-right corner shows — which looked like a rendering
   glitch rather than a pair. */
.v3 .mount{position:relative;isolation:isolate;padding:13px;border-radius:5px;
  background:var(--card)}
.v3 .mount .media{aspect-ratio:4/5;border-radius:2px}
.v3 .mount::before,.v3 .mount::after{content:"";position:absolute;z-index:1;
  width:17px;height:17px;
  /* A corner mount is paper laid over the picture, so it takes the card's own
     paper colour with a hairline edge. An ink-coloured triangle disappeared
     into every dark photograph in the set — measured on the gym shot. */
  background:linear-gradient(135deg,var(--bg) 0 46%,
    color-mix(in srgb,var(--fg) 26%,transparent) 46% 50%,transparent 50%)}
.v3 .mount::before{left:13px;top:13px}
.v3 .mount::after{right:13px;bottom:13px;transform:rotate(180deg)}
.v3 .det{font:italic var(--w-medium) 17px/1.32 var(--serif);letter-spacing:0}
.v3 .label{display:grid;grid-template-columns:72px minmax(0,1fr);gap:6px 10px;margin:0;
  padding-top:12px;border-top:1px solid var(--border)}
.v3 .label dt{font:var(--w-semi) 10px/1.7 var(--mono);letter-spacing:.085em;
  text-transform:uppercase;color:var(--faint-fg)}
.v3 .label dd{margin:0;font:11.5px/1.7 var(--mono);color:var(--muted-fg);
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
/* 34px of ink + 5px of reach = 44; the 12px row gap keeps two reaches 2px apart. */
.v3 .mlinks{display:flex;flex-wrap:wrap;gap:12px}
.v3 .ml{display:inline-flex;align-items:center;min-height:34px;padding:0 8px;
  position:relative;border:1px solid var(--border);border-radius:5px;
  font:10.5px/1.5 var(--mono);color:var(--muted-fg);
  transition-property:border-color,color;transition-duration:var(--t-out);
  transition-timing-function:var(--e-out)}
.v3 .ml::after{content:"";position:absolute;inset:-5px}
@media (hover:hover) and (pointer:fine){
  .v3 .ml:hover{color:var(--fg);border-color:var(--border-strong)} }
.v3 .sp details{border-top:1px solid var(--border);margin-top:auto}
.v3 .sp summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
  min-height:44px;font:var(--w-semi) 10px/1.6 var(--mono);letter-spacing:.085em;
  text-transform:uppercase;color:var(--faint-fg)}
.v3 .sp summary::-webkit-details-marker{display:none}
.v3 .sp summary::after{content:"+";margin-left:auto;font:13px/1 var(--mono);
  color:var(--muted-fg)}
.v3 .sp details[open] summary::after{content:"\2212"}
.v3 .sp details pre{margin:2px 0 12px;max-height:280px;overflow:auto;color:var(--fg)}
.v3 .acts{display:flex;gap:12px;flex-wrap:wrap;padding-top:2px}
.v3 .legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:4px 22px;margin:-8px 0 20px;font:11.5px/1.7 var(--mono);color:var(--faint-fg)}
.v3 .legend b{color:var(--muted-fg);font-weight:var(--w-text)}

/* ══ V4 · Deck ════════════════════════════════════════════════════════════
   Axis: HOW MANY CARDS AT ONCE. Every other direction answers "show me
   everything"; this one answers "let me actually look at one". The card is
   large enough to read the prompt without a second surface, and the rest of
   the result set is physically behind it — you can see the stack, and you
   step through it with the buttons or the arrow keys.

   All of the cards are rendered, so the page still carries every prompt; the
   ones behind the top card are moved and faded with transform and opacity
   only. The deck makes its own stacking context with `isolation:isolate`, so
   --dz is a depth inside the deck and never a global layer. */
/* The stack needs somewhere to go. A card at depth o is offset right by
   (o × --dk-dx) and pulled in by its own scale (o × half the scale step ×
   width); with a 4% step the inset beat the offset and the stack showed only
   as a hairline above the card. A 2.8% step plus reserved room on the right
   puts it where a deck actually reads. */
.v4 .deckwrap{margin-top:22px;padding-top:18px;padding-right:56px;max-width:1060px}
/* The stack's horizontal offset has to scale with the deck, or the back of
   the stack pushes past the container: a card at depth o sits (o × --dk-dx)
   to the right but is inset (o × 2% × width) by its own scale, so any fixed
   offset overflows once the deck gets narrow. min(18px, 1.5vw) stays inside
   at every width from 375 up. Measured: 59px of overflow at 375 before. */
.v4 .deck{--dk-h:520px;--dk-dx:min(22px,1.8vw);--dk-dy:-12px;
  position:relative;height:var(--dk-h);isolation:isolate;perspective:1600px}
.v4 .dc{position:absolute;inset:0;z-index:var(--dz,0);
  display:grid;grid-template-columns:minmax(0,45%) minmax(0,55%);
  grid-template-rows:minmax(0,1fr);
  border:1px solid var(--border);border-radius:14px;background:var(--bg);
  box-shadow:var(--sh-med);overflow:hidden;opacity:0;pointer-events:none;
  transform:translate3d(calc(var(--o,4) * var(--dk-dx)),calc(var(--o,4) * var(--dk-dy)),0)
            scale(calc(1 - var(--o,4) * .028));
  transition-property:transform,opacity;transition-duration:var(--t-regular);
  transition-timing-function:var(--e-emphatic)}
.v4 .dc[data-vis]{opacity:1}
.v4 .dc[data-top]{pointer-events:auto}
/* The cards behind are dimmed by a flat scrim rather than a filter: a blur or
   brightness filter on a 520px card costs a full-size offscreen pass. */
.v4 .dc::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:var(--bg);opacity:.62;pointer-events:none;
  transition-property:opacity;transition-duration:var(--t-regular);
  transition-timing-function:var(--e-emphatic)}
.v4 .dc[data-top]::after{opacity:0}
@media (prefers-reduced-motion:reduce){
  .v4 .dc,.v4 .dc::after{transition-duration:0s} }
.v4 .dc .media{height:100%}
.v4 .dc .side{display:flex;flex-direction:column;gap:11px;min-width:0;min-height:0;
  padding:22px 24px}
.v4 .dc h3{font-size:20px;line-height:1.28;letter-spacing:-.014em;
  font-weight:var(--w-medium)}
.v4 .dc pre.prompt{flex:1;min-height:0;overflow:auto;color:var(--fg);
  background:var(--surface);border-radius:8px;padding:13px 14px}
.v4 .dcacts{display:flex;gap:12px;flex-wrap:wrap}
.v4 .dknav{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px}
.v4 .dkpos{font:12px/1 var(--mono);color:var(--muted-fg);font-variant-numeric:tabular-nums;
  min-width:82px}
.v4 .dkhint{font:11.5px/1.6 var(--mono);color:var(--faint-fg)}
.v4 .btn[disabled]{opacity:.45;cursor:default}
@media (max-width:900px){
  .v4 .deckwrap{padding-right:24px}
  /* One column at 375 means the prompt panel is the only thing that can give,
     so the card grows and the picture gives back 20px rather than the words. */
  .v4 .deck{--dk-h:720px}
  .v4 .dc{grid-template-columns:1fr;grid-template-rows:190px minmax(0,1fr)}
  .v4 .dc .side{padding:16px 18px}
  .v4 .dc h3{font-size:18px}
  .v4 .dkhint{flex-basis:100%}
}
</style>

<style id="linear-dark-theme">
/* ─────────────────────────────────────────────────────────────────────────
   Linear-derived dark theme for the prototype pickers.

   Values come from the token snapshot at
   `specs/images/linear-design-tokens.css` (Linear public-site CSS, snapshot
   2026-09-03), not from memory. This is a COLOUR re-theme only: type and
   geometry stay on the project's own system, because `frontend/AGENTS.md` §7.6
   has not ruled on a web font and Linear's faces (Inter Variable, Berkeley
   Mono, Tiempos Headline) are not licensed here. Weights stay 400/600.

   The four pickers were written at different times and use three different
   token vocabularies (`--background`/`--bg`, `--foreground`/`--fg`,
   `--muted`/`--muted-fg`, `--faint`/`--faint-fg`, `--font-sans`/`--sans`).
   Every alias is set, so one block themes all four.

   Contrast, measured against the canvas ladder (WCAG 2, sRGB):

     token                 #08090a  #0f1011  #141516  #191a1b
     --foreground #f7f8f8    18.73    17.90    17.18    16.38
     --muted-fg   #d0d6e0    13.64    13.04    12.52    11.93
     --faint      #8a8f98     6.13     5.86     5.63     5.36
     --accent     #7170ff     5.18     4.96     4.76     4.53
     --ok         #4cc38a     9.00     8.60     8.25     7.87
     white on brand fill #5e6ad2 …………………………………………………… 4.70

   Three deliberate departures from Linear's own dark tokens, each because a
   token Linear uses decoratively is used here as text:

   1. `--faint` takes Linear's TERTIARY ink `#8a8f98`, not its quaternary
      `#62666d`. Quaternary measures 3.45:1 — below the 4.5:1 floor — and this
      project spends `--faint` on 11px mono captions, which is text.
   2. `--accent` takes `#7170ff`, NOT the `#5252f5` that `frontend/CLAUDE.md`
      mandates. That mandate is a LIGHT-mode repair: `#7070ff` fails AA on all
      four light surfaces (3.30–3.85) and `#5252f5` fixes it. Inverted, the
      rule inverts too — `#5252f5` measures 3.69:1 on `#08090a` and would be
      the unreadable one. Same intent, opposite value.
   3. `--ok` lifts Linear's `#27a644` to `#4cc38a`. Per the `color` skill,
      brand colours carried into dark at full saturation vibrate; lightness
      goes up and chroma comes down. It also buys 6.29:1 → 9.00:1 at 11px.
   ───────────────────────────────────────────────────────────────────────── */

:root[data-theme="linear-dark"] {
  color-scheme: dark;

  /* Canvas ladder — level-0 is the page, level-1 insets, level-2 cards.
     Dark mode keeps the layering hierarchy; it is not inverted light mode. */
  --background: #08090a;  --bg: #08090a;
  --surface:    #0f1011;
  --card:       #141516;

  /* Ink */
  --foreground: #f7f8f8;  --fg: #f7f8f8;
  /* --muted is deliberately NOT set. It is ink in L1/L4 but a translucent
     SURFACE wash in L2/L3 (`color-mix(in srgb, var(--fg) 8%, transparent)`,
     used only for avatar and media placeholders). Forcing one ink value here
     painted light-grey boxes onto a near-black canvas in L3. Every file's own
     definition self-corrects once --fg/--foreground flip and color-scheme is
     dark, so the token is left alone on purpose. --muted-fg is unambiguous
     ink and is set. */
  --muted-fg: #d0d6e0;
  --faint:      #8a8f98;  --faint-fg: #8a8f98;

  /* Lines. Linear's dark borders are solid, not alpha-white — a translucent
     white hairline glows on near-black instead of receding. */
  --border:        #23252a;
  --border-strong: #34343a;

  /* Interaction. Indigo carries interaction semantics only: focus, links,
     ::selection, and the single primary action per view. */
  --accent:    #7170ff;
  --accent-bg: #1b1c33;

  /* The inverted button: Linear's own --color-button-invert-bg. */
  --primary:    #e5e5e6;
  --primary-fg: #08090a;

  /* Status */
  --ok:   #4cc38a;
  --cand: #f0bf00;

  /* L4's placeholder highlight, on Linear's orange */
  --var-bg: #2a1a12;
  --var-fg: #fc9a6e;

  /* L1's Spotlight band sits below the page ladder on Linear's marketing black */
  --bbd:    #010102;
  --bmu:    rgb(247 248 248 / .68);
  --bfaint: rgb(247 248 248 / .46);
}

/* The prototypes gate their dark-mode image outline on `prefers-color-scheme`,
   which does not fire when the theme is forced by attribute. A tinted outline
   picks up the surface behind it and reads as grime, so it must be pure white. */
:root[data-theme="linear-dark"] img { outline-color: rgb(255 255 255 / .1); }

/* Selection carries the brand quietly and stays legible. */
:root[data-theme="linear-dark"] ::selection {
  background: color-mix(in oklab, #5e6ad2, black 10%);
  color: #fff;
}

/* Depth: on dark, a stacked shadow is invisible, so every elevation collapses
   to a single low-opacity white ring. */
:root[data-theme="linear-dark"] [data-elevated] {
  box-shadow: 0 0 0 1px rgb(255 255 255 / .09);
}

/* This file's own two additions to the block, both measured before use.
   1. --img-outline and --ok-fg are light-dark() tokens; light-dark() follows
      the used color-scheme, which the rule above already sets to dark, so
      they self-correct and are NOT restated here.
   2. The part washes: on #141516 the light-mode mixes read as chalk, so the
      dark side of each light-dark() pair is the one that applies. Text over
      every wash stays --fg #f7f8f8; measured 13.9–16.5:1 across the six. */
</style>

reckles, thin gold necklace, silver ring, dark brown off-the-shoulder knit with white diamond-stripe pattern. 100% matches the reference. CAMERA OWNERSHIP LOCK Only two positions exist. HELD: arm extended, camera 0.4-0.7m from her face, visible arm tension, tilt and step-bounce. PROPPED: camera on a surface she placed it on, crooked and fixed, with her moving in and out of frame. No operator shots, no tracking, nothing she could not have filmed alone. FORMAT Eight shots, 30s, seven HARD CUTS, no fades. Real-time. 0-4s SHOT 1 — PROPPED, morning room. 84° diagonal field of view, camera on the sideboard 3m from the bed at 1.1m, static and tilted. The suite matches @ image1: cove light on, curtains half open, cool daylight across the red carpet. @ image2 visible at 0.0s, sitting up on the bed edge x66 y58. No empty frame. She rubs her face and croaks at the running camera: \"It's seven. In New York. Why am I awake.\" Stands, walks out screen-right. HARD CUT. 4-7s SHOT 2 — HELD, window light. 84°, arm's length 0.5m, above eye line. She is x50 y42 at the sheer curtain screen-left, cool daylight on the near side of her face, cove warmth behind. She pulls the curtain, squints at the street below, then into the lens: \"Okay. It's actually happening.\" Arm wobble throughout. HARD CUT. 7-11s SHOT 3 — PROPPED, coffee. 47°, camera on the oval coffee table 0.8m away, low, looking up past a cup. She sits into frame at x55 y45, pours, tastes, pulls a face at the running camera: \"Hotel coffee. We'll fix that outside.\" Steam bends in the light. HARD CUT. 11-15s SHOT 4 — HELD, mirror. 47°, camera at chest height reflected in the suite mirror. She is x45 y50 in the reflection, camera visible in her hand, working through her hair with the other. Bed and sculptures behind. At 13s: \"This is as good as it gets. Let's go.\" HARD CUT. 15-18s SHOT 5 — HELD, leaving. 107° wide rectilinear, camera held low at waist height, turned forward. She crosses the red carpet to the door at x55, lens swinging with her stride. She opens it and corridor light floods the frame. Off-frame, breathy: \"Downtown first.\" HARD CUT. 18-22s SHOT 6 — PROPPED, street. 47°, camera on a stoop rail 3m away, static, crooked. A New York block behind her — brownstone steps, fire escapes, yellow cabs, steam from a vent. She walks in from screen-left at 18.5s, stands at x60 y50, spreads her arms: \"Look at this street.\" Then walks to the lens and takes it at 21.5s. Passers-by cross the foreground. HARD CUT. 22-26s SHOT 7 — PROPPED, diner. 84° wide, camera on the counter behind a plate, 0.7m from her, looking up. She is x55 y38, sits into frame, takes a bite, eyes widen, mouth full: \"Okay, that's the one.\" Laughs, keeps eating. HARD CUT. 26-30s SHOT 8 — HELD, night, back in the room. 84°, arm's length 0.5m, held above her. She lies back across the white bedding at x50 y55, hair spread, in the brown knit again. Bedside lamps and cove light are the only sources, windows black with city glow. Into the lens: \"Twenty thousand steps. Everything hurts.\" Softer: \"Same time tomorrow.\" Wave, the frame tilts as she lowers the camera. 30.0s black. SPEECH Only the quoted lines are spoken, at the timings given, all in her voice. Lips still at all other times. No voiceover, no second speaker, no offscreen voices. Delivery is casual, unrehearsed, mid-breath, sometimes trailing off. Volume rises over street noise in Shot 6, near-whisper in Shot 8. CONTINUITY The suite matches @ image1 in both interior sequences — same carpet, sculptures, headboard, sofa, lamps. Hair, necklace and ring identical throughout. PHYSICS Loose knit slides on the shoulder with every arm movement. Wavy hair lags a frame behind head turns. Bedding creases under her weight. Step energy visible in every HELD frame. LIGHTING Shots 1-4: cool daylight from the curtains screen-left as key, warm cove LED as fill, red carpet bouncing warmth into the shadows. Shot 5: corridor light through the doorway. Shots 6-7: hard street daylight, warm diner practicals. Shot 8: lamps and cove light only. AUDIO Diegetic only, from the same camera — room tone, footsteps, door, traffic, sirens, steam vents, diner clatter, wind. Ambience ducks under her lines. No music. LOCKS Photoreal live action, 4K detail, fine grain, warm consumer-camera colour, mild rolling shutter and auto-exposure hunting. She is the only person who speaks; background figures anonymous and unfocused. No subtitles.", "models": ["Higgsfield Soul", "Seedance"], "uses": ["Food & beverage"], "styles": ["Photorealistic"], "techs": ["Camera movement / shot language", "Lip sync / dialogue", "Multi-shot / storyboard"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2083165874983424000/img/L7v_JTJr0f72f2Z_.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2083165874983424000/img/L7v_JTJr0f72f2Z_.jpg?name=small"], "n": 1, "dur": 29, "handle": "@higgsfield_ai", "likes": 589, "saves": 457, "hv": true, "score": 96.1}, {"id": "2029632175482507599", "slug": "subject-identity-biometric-reference-sydney--2029632175482507599", "title": "Forensic-detail beauty portrait, hooded eyes", "prompt": "{ \"subject\": { \"identity\": { \"biometric_reference\": \"Sydney Sweeney\", \"facial_forensics\": { \"structure\": \"Soft-edged heart-shaped facial morphology, high malar bones with specific 120-degree zygomatic arch projection, refined orthognathic profile.\", \"eyes\": \"Large, almond-shaped hooded eyes, deep set; iris pattern features complex radial fibers in cerulean blue (#96B9D0) with a distinct dark grey limbal ring; natural eyelashes with varied lengths.\", \"dentition\": \"Natural dental alignment, slight prominence of the maxillary central incisors, translucent incisal edges, anatomical gum contouring without artificial whitening.\", \"skin_physics\": \"Fitzpatrick Scale Type II (#F7E2D3); visible dermal pores, subtle telangiectasia, natural freckle distribution across the nasal bridge and malar  major feature film. The world is entirely made from paper, cardboard, ink, and delicate handcrafted materials. 00:00–00:05 — THE FIRST FOLD Begin with an extreme macro shot of a blank sheet of textured paper. A single fold slowly forms across its surface. Lens: 100mm macro Camera: Completely static Soft daylight moves across the paper as the fold continues. Cut precisely as the paper reaches its final shape. 00:05–00:11 — THE CITY EMERGES Transition into a 50mm shot. The folded paper begins forming miniature streets and architectural structures. Buildings rise naturally from the surface through carefully constructed paper folds. The camera slowly tracks sideways. Tiny windows catch the light. Nothing feels computer-generated; every surface should have believable paper fibers, folds, shadows, and imperfections. 00:11–00:17 — THE REVEAL Move into a 35mm shot. The camera pulls backward. The small arrangement is revealed as an enormous handcrafted paper city stretching across a large table. Roads connect different districts. Bridges cross miniature rivers. Paper trees move gently from an unseen breeze. 00:17–00:23 — MORNING Transition into a slow overhead crane shot. Warm sunlight gradually spreads across the paper city. Shadows from the buildings become longer and more defined. Tiny paper windows begin reflecting the sunlight. The camera continues rising, revealing the geometric relationship between the streets and buildings. 00:23–00:27 — THE DETAIL Cut to an 85mm close-up. Focus on a tiny paper clock mounted on one building. The clock moves forward by one minute. Rack focus from the clock to the miniature skyline behind it. 00:27–00:30 — FINAL IMAGE Return to an extreme wide shot. The entire paper city sits beneath a large studio window. The morning light completely fills the miniature world. Camera slowly pulls backward until the city becomes a small object within the larger room. Fade to black. CINEMATOGRAPHY Large-format feature-film aesthetic. 100mm macro for texture. 85mm for detail. 50mm for natural perspective. 35mm for environmental shots. Controlled dolly and crane movements. Realistic depth of field. Natural focus transitions. Soft motion blur. Subtle lens imperfections. No artificial camera shake. MATERIAL DIRECTION Every surface must visibly behave like physical paper. Visible paper fibers. Natural folds. Tiny imperfections. Soft cardboard edges. Realistic contact shadows. Believable paper thickness. Natural material deformation. LIGHTING Soft morning daylight. Large window as the primary source. Natural bounce light. Gentle shadows. Subtle warm highlights. No artificial neon effects. No excessive visual effects. CONTINUITY The same paper city throughout the entire sequence. Buildings maintain identical shapes and positions. Roads remain connected. Paper materials remain consistent. No random transformations. No flickering. No duplicated structures. No sudden environmental changes. DIRECTOR’S NOTE Treat this as a miniature feature film, not a visual-effects demonstration. The camera should discover the world gradually. Start intimate. Reveal scale. Return to detail. Finish wide. The audience should feel that they are watching a real handcrafted world photographed with a cinema camera. Photorealistic 4K • tactile materials • feature-film cinematography • sophisticated lighting • realistic miniature photography • cinematic depth • precise camera movement • seamless visual continuity.", "models": ["GPT Image", "Seedance"], "uses": [], "styles": ["Cinematic", "Photorealistic"], "techs": ["Camera movement / shot language", "Transition / morph / match cut"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2088865943921528832/img/ACj33PYyBD5RI7qH.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2088865943921528832/img/ACj33PYyBD5RI7qH.jpg?name=small"], "n": 1, "dur": 30, "handle": "@ChillaiKalan__", "likes": 407, "saves": 409, "hv": true, "score": 95.3}, {"id": "20089 y desaturated editorial tones. STYLE: modern FIFA World Cup campaign aesthetic, Nike/Adidas football editorial, cinematic athlete portrait, ultra-clean sports branding, realistic football photography. TEXTURES: realistic jersey fabric, soft paper grain, stadium-inspired haze, glossy lighting reflections, subtle vintage print texture. OUTPUT: 4:5 vertical composition, ultra-realistic sports campaign poster, minimalist luxury football aesthetic, clean beige/off-white background, no clutter.", "models": ["GPT Image", "GPT Image 2"], "uses": ["Advertising", "Fashion", "Web & motion design"], "styles": ["Cinematic", "Luxury", "Photorealistic", "Retro / vintage"], "techs": ["Camera movement / shot language"], "subjects": ["Person / portrait"], "kind": "image", "img": "https://pbs.twimg.com/media/HJdQdAobUAA0Naq.jpg?name=small", "imgs": ["https://pbs.twimg.com/media/HJdQdAobUAA0Naq.jpg?name=small"], "n": 1, "dur": null, "handle": "@AIwithSarah_", "likes": 385, "saves": 314, "hv": true, "score": 93.6}, {"id": "2084387316286595436", "slug": "the-office-us-mockumentary-style-2084387316286595436", "title": "The Office mockumentary, conference room", "prompt": "The Office (US) mockumentary style. Dunder Mifflin conference room, mid-afternoon, harsh fluorescent lighting, cheap office chairs, whiteboard at the front. Handheld documentary camera, slightly unsteady, with sudden reframes and quick zooms toward whoever is reacting. Michael Scott stands at the whiteboard, overly excited, marker in hand, badly drawn diagram behind him. The staff sit around the table looking exhausted. Stanley Hudson sits at the far end, glasses on, head down over a folded crossword puzzle, completely disengaged. DIALOGUE: MICHAEL (loud, proud): \"Okay everybody, listen up. Large language models. L-L-Ms. This is the future of the paper industry.\" Beat. Nobody reacts. Camera pushes in slowly on Stanley — he does not look up, does not blink, keeps filling in his crossword. MICHAEL: \"Which is why corporate is giving a bonus to whoever—\" Instant snap zoom to Stanley. His head lifts. He takes off his glasses. Dead serious. STANLEY: \"I'm listening.\" MICHAEL (waving him off): \"—anyway. Moving on. Next topic. Prompt engineering.\" Snap zoom back to Stanley. He immediately puts his glasses back on, lowers his head, and returns to the crossword as if nothing happened. Cut to Jim, who slowly turns his head and looks directly into the camera lens with a flat, knowing expression. Hold for two seconds. STYLE: single-camera sitcom shot like a documentary crew is present, natural performances, no laugh track, muted office color palette, slightly soft consumer-camera look, characters occasionally glancing at the lens.", "models": [], "uses": [], "styles": [], "techs": ["Camera movement / shot language", "Lip sync / dialogue"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2084387230844346368/img/3q3PrcBYVZsGJ3lW.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2084387230844346368/img/3q3PrcBYVZsGJ3lW.jpg?name=small"], "n": 1, "dur": 15, "handle": "@Arminn_Ai", "likes": 446, "saves": 383, "hv": true, "score": 93.6}, {"id": "2085640281941307648", "slug": "montage-multi-shot-candid-observational-foot-2085640281941307648", "title": "Seven-shot handheld observational montage", "prompt": "Montage, multi-shot candid observational footage. Do not use a single camera angle or continuous take. Handheld documentary style with the feeling of accidental real-life capture. Slightly imperfect framing, subtle handheld shake, tiny reframing adjustments, gentle exposure breathing, and autofocus that settles half a beat late. Realistic skin texture, soft indoor natural light, film grain, shallow depth of field. Relaxed breathing, natural blinking, restrained and authentic performance. Total of 7 shots. The woman from @ Image 1 is wearing a matching cotton pajama set consisting of a scoop-neck sleeveless top and loose shorts made from the same fabric and design. Barefoot, she lies on her stomach across a lived-in, slightly messy bed in her bedroom, browsing a mobile shopping page on a black smartphone. A house cat jumps onto the bed seeking attention, and she affectionately plays with it. Moments later, a friend calls. She answers, chats, and eventually bursts into laughter. The doorbell rings, so she ends the call and gets up to collect her dinner. Shot 1 (0–2s): She is already moving. One thumb scrolls through a shopping page while she frowns slightly, thinking. She quietly mutters in Korean: \"아, 뭐 살랬더라…\" (\"Ah... what was I going to buy again?\"). Lips synchronize naturally. Her bare feet gently sway behind her. A low handheld camera glides along the edge of the mattress, with soft bedding partially obscuring the foreground. Shot 2 (2–4s): The house cat jumps onto the bed, compressing the blanket as it walks toward her forearm and lets out a single meow. The camera gives a slight jolt from the impact, then quickly reframes from the phone to an over-the-shoulder view that includes her face, hands, phone, and cat. Shot 3 (4–6s): She turns warmly toward the cat, stroking it once from its forehead to its shoulders. In a gentle, affectionate tone she says: \"우리 애기 왔어?\" (\"Did my baby come?\"). Lip sync is clear and natural. The camera pushes in briefly through the cat's softly blurred foreground toward her face and hand. Shot 4 (6–8s): A friend's ringtone sounds. She glances down, confirms the caller, swipes to answer, and brings the phone to her ear. The camera moves in a loose semicircle from a slightly tilted overhead angle, capturing the entire answering motion. Shot 5 (8–11s): Her friend begins talking. She responds first with confusion, then disbelief: \"어, 왜? 진짜 거짓말.\" (\"Huh? Why? No way, you're kidding.\"). Immediately afterward she naturally bursts into laughter. The cat kneads the blanket beside her. A close handheld side angle keeps both her phone and profile within the same focal plane. Shot 6 (11–13s): A clear doorbell interrupts the laughter. Both she and the cat turn toward the bedroom door. She braces one hand on the mattress to get up. The camera reacts a fraction too late, briefly turning toward the door before naturally correcting back to her rising movement. Shot 7 (13–15s): Still on the phone, she hurriedly says: \"어, 나 밥 왔다. 끊어.\" (\"My food's here. I'll hang up.\"). She ends the call with her thumb, gets off the bed, and walks toward the door while the cat follows across the blankets. The camera slides low beneath her elbow and tilts upward as she stands in one continuous motion. Sound: No music. Only raw production sound: bedding rustling, quiet breathing, finger taps on the phone, the soft impact of the cat jumping onto the bed, one natural meow, faint purring, a single short incoming ringtone, call connection tone, the friend's voice through the phone, the woman's four Korean lines with accurate lip sync, a genuine brief laugh, one clear doorbell, the tap ending the call, and soft cat footsteps. No subtitles, no on-screen text, no logo, no watermark. Never render a reference sheet or duplicate the subject.", "models": ["Seedance"], "uses": ["Food & beverage"], "styles": ["Photorealistic"], "techs": ["Camera movement / shot language", "Lip sync / dialogue", "Multi-shot / storyboard"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2085640247682224128/img/Wj08brZzXojtfWtv.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2085640247682224128/img/Wj08brZzXojtfWtv.jpg?name=small"], "n": 1, "dur": 15, "handle": "@oggii_0", "likes": 297, "saves": 232, "hv": true, "score": 93.6}, {"id": "2047862141894681076", "slug": "a-realistic-young-woman-sitting-casually-in--2047862141894681076", "title": "Bedroom phone recording, late afternoon light", "prompt": "A realistic young woman sitting casually in a softly lit bedroom during late afternoon. She is holding her phone very close to her face a orean bedroom evening vlog, 10 seconds", "prompt": "Ultra-realistic cinematic vertical video, 10 seconds. A beautiful young Korean woman spends a peaceful evening in her cozy bedroom, wearing the same oversized cream-white T-shirt. Soft warm lamp light mixes with cool moonlight coming through the window, creating a calm late-night atmosphere. The video is filmed entirely as natural handheld smartphone selfies, like a personal vlog. Shot 1 (0–2s): Close front selfie. She looks out the window for a moment, then turns toward the camera with a gentle smile and softly tucks a strand of hair behind her ear. Shot 2 (2–4s): Slightly high-angle selfie. She sits on the bed hugging a fluffy pillow, tilts her head playfully, then smiles with a natural blink while the phone gently shakes. Shot 3 (4–6s): Mirror selfie. She slowly walks toward a full-length mirror, briefly looks at her reflection, then smiles at the phone with relaxed confidence. Warm fairy lights softly glow in the background. Shot 4 (6–8s): Side-profile selfie near the bedside table. She picks up a small photo frame, smiles nostalgically, then looks back into the camera with a subtle laugh. Her hair sways naturally as she moves. Shot 5 (8–10s): Front close-up selfie. She leans comfortably against the headboard, gives a tiny finger-heart toward the camera, then finishes with a warm smile while the camera slowly pulls away, revealing the cozy bedroom ambiance. Style: Ultra-photorealistic, realistic Korean beauty, authentic smartphone handheld movement, natural blinking, subtle breathing, lifelike hair simulation, soft warm lamp lighting with gentle moonlight, cinematic shallow depth of field, premium film color grading, 24 fps, 8K, intimate cozy Korean bedroom aesthetic.", "models": ["Seedance"], "uses": ["Beauty"], "styles": ["Cinematic", "Luxury", "Photorealistic"], "techs": ["Camera movement / shot language", "Multi-shot / storyboard"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_vide a-z0-9一-鿿]/.test(p)) p = before;\n    p = p.split(/[.。;!?！？]|\\s[-—]\\s/)[0].replace(/^[\\s,;:\"']+|[\\s,;:\"']+$/g, \"\");\n    if (p.length < 12 || TAGS_ONLY.test(p)) return taxonomy || \"Untitled prompt\";\n    if (p.length > CAP) p = p.slice(0, CAP).replace(/\\s+\\S*$/, \"\").replace(/[\\s,;:]+$/, \"\") + \"…\";\n    return p.charAt(0).toUpperCase() + p.slice(1);\n  }\n\n  /** The record id, from the L1 card attribute or the detail link's slug. */\n  function idOf(card) {\n    if (card.dataset && card.dataset.id) return card.dataset.id;\n    var a = card.querySelector('a[href*=\"/prompts/\"]');\n    var m = a && /(\\d{10,})(?:[^\\d]|$)/.exec(a.getAttribute(\"href\") || \"\");\n    return m ? m[1] : null;\n  }\n\n  function taxonomyOf(card) {\n    var out = [];\n    card.querySelectorAll(\".cardchips .chip, .tags .tag, .c-tags .c-tag\").forEach(function (c) {\n      var t = (c.textContent || \"\").trim();\n      if (t && out.indexOf(t) < 0) out.push(t);\n    });\n    return out.slice(0, 3).join(\" \\u00b7 \");\n  }\n\n  function retitle(root) {\n    (root || document).querySelectorAll(\"article.card, article.b-cell\").forEach(function (card) {\n      if (card.hasAttribute(\"data-titled\")) return;\n      var h = card.querySelector(\"h3\");\n      if (!h) return;\n      card.setAttribute(\"data-titled\", \"\");\n\n      var pre = card.querySelector(\"pre.ptext, pre.prompt\");\n      var src = pre ? pre.textContent : h.textContent;\n      var id = idOf(card);\n      var next = (id && WRITTEN[id]) || promptTitle(src, taxonomyOf(card));\n\n      var link = h.querySelector(\"a\");\n      if (link) link.textContent = next; else h.textContent = next;\n      // The prompt's own opening stays reachable on hover and to find-in-page.\n      h.setAttribute(\"title\", (src || \"\").replace(/\\s+/g, \" \").trim().slice(0, 300));\n      card.setAttribute(\"data-title-source\", id && WRITTEN[id] ? \"written\" : \"derived\");\n    });\n  }\n\n  retitle(document);\n\n  /* Cards are cloned into the grids after first paint, so the observer has to\n     stay — but rewriting a title is itself a mutation, so it must not observe\n     its own work: `data-titled` makes retitle a no-op on a card it already\n     handled, and the observer disconnects for the duration of the pass. */\n  if (window.MutationObserver) {\n    var mo = new MutationObserver(function () {\n      mo.disconnect();\n      try { retitle(document); } finally {\n        mo.observe(document.body, { childList: true, subtree: true });\n      }\n    });\n    mo.observe(document.body, { childList: true, subtree: true });\n  }\n})();\n\n<\/script>\n</body>\n</html>\n";
const AVATARS = {"PrometheanAIX": "https://pbs.twimg.com/profile_images/2043694345749196800/vsv-cxdT_400x400.jpg", "higgsfield_ai": "https://pbs.twimg.com/profile_images/1906739239183630336/907a7JTU_400x400.jpg", "KeorUnreal": "https://pbs.twimg.com/profile_images/2038274199379443712/HGEFaPvT_400x400.jpg", "ManuAGI01": "https://pbs.twimg.com/profile_images/1792389743503929344/5NAkgng7_400x400.jpg", "CHAO2U_AI": "https://pbs.twimg.com/profile_images/2018484655750840320/6ZfNMPHb_400x400.jpg", "IqrasaifiAI": "https://pbs.twimg.com/profile_images/2070883209731248128/BZnJwoPG_400x400.jpg", "ChillaiKalan__": "https://pbs.twimg.com/profile_images/2042898125573197824/Em0FFxRw_400x400.jpg", "ZaraIrahh": "https://pbs.twimg.com/profile_images/1997170504713883651/mr6aPbte_400x400.jpg", "Naiknelofar788": "https://pbs.twimg.com/profile_images/2014919869259735040/MbBiQ58q_400x400.jpg", "PinodiArt": "https://pbs.twimg.com/profile_images/2017948625058287616/AUHPq1dP_400x400.jpg", "Arminn_Ai": "https://pbs.twimg.com/profile_images/1934377885055246336/TPOvBcnQ_400x400.jpg", "AIwithSarah_": "https://pbs.twimg.com/profile_images/2016454047679832064/qf_DsgPV_400x400.jpg"};

/* L2 is the image gallery, so the corpus is every record that is not a video.
   That keeps the one record with no media at all, the 11 raw-JSON prompts,
   the 4 with [BRACKET] placeholders, the one with no model and the six with
   no use case — the records that break layouts stay in. */
const DATA = ALL.filter(r => r.kind !== "video");

/* ── helpers ─────────────────────────────────────────────────────────── */
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const compact = new Intl.NumberFormat("en-US", { notation:"compact", maximumFractionDigits:1 });
const n = v => v == null ? "—" : compact.format(v);
const num = v => v == null ? "—" : v.toLocaleString("en-US");
const PH = /\[[A-Z][A-Z \-_\/]{2,}\]/g;
/* Placeholders are marked after escaping, so the mark is the only markup that
   ever gets into prompt text. */
const promptHTML = s => esc(s).replace(PH, m => `<mark class="ph">${m}</mark>`);
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const asList = (r,k) => Array.isArray(r[k]) ? r[k] : (r[k] == null ? [] : [r[k]]);
const median = a => { if (!a.length) return null; const s=[...a].sort((x,y)=>x-y);
  const m=s.length>>1; return s.length%2 ? s[m] : Math.round((s[m-1]+s[m])/2); };
const isJSON = r => /^\s*[{\[]/.test(r.prompt);

const AXES = [["uses","Use case"],["styles","Style"],["subjects","Subject"]];

function counts(key, rows){
  const m = new Map();
  (rows || DATA).forEach(r => asList(r,key).forEach(v => m.set(v,(m.get(v)||0)+1)));
  return [...m].sort((a,b) => b[1]-a[1] || String(a[0]).localeCompare(b[0]));
}
const topOf = (key, rows) => { const c = counts(key, rows); return c.length ? c[0] : null; };

/* ── derived facts, all of them read straight off the record ───────────── */
const words = r => r.prompt.trim().split(/\s+/).length;
const phCount = r => (r.prompt.match(PH) || []).length;
/* "Extent" on a Specimen label, and the caption on a Postcard's message
   side. Nothing here is a judgement — it is the length and the format the
   stored text actually has. */
const extent = r => `${num(r.prompt.length)} characters · ${num(words(r))} words · ${
  isJSON(r) ? "JSON" : "prose"}${phCount(r) ? ` · ${phCount(r)} placeholder${
  phCount(r) > 1 ? "s" : ""}` : ""}`;

/* Filter state is shared across the directions on purpose: switching keeps
   your query, so you are always comparing the same result set. `di` is the
   Deck's position, reset whenever the surviving set changes. */
const state = { q:"", active:{uses:[],styles:[],subjects:[]}, di:0 };

function matches(r){
  for (const k in state.active){
    const on = state.active[k];
    if (on.length && !on.some(v => asList(r,k).includes(v))) return false;
  }
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = (r.title+" "+r.prompt+" "+r.models.join(" ")+" "+r.uses.join(" ")+" "+
                 r.styles.join(" ")+" "+r.subjects.join(" ")+" "+(r.handle||"")).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
const results = () => DATA.filter(matches).sort((a,b) => (b.score ?? -1) - (a.score ?? -1));
const anyFilter = () => state.q || Object.values(state.active).some(a => a.length);

function emptyState(){

}
const countLine = res => `${res.length} of ${DATA.length} image prompts${anyFilter() ? " match" : ""}`;
function avatar(h){

function metaRow(r){

}

/* Model entry points. The name and the trailing link both open the model

    </li>`;

}

/* ══ V2 · Postcard ═══════════════════════════════════════════════════════
   Axis: THE CARD HAS A BACK — the flip is the interaction.

   A postcard is the one everyday card that is genuinely two-sided, and the
   two things this page has to show are exactly two: the picture, and the

   full card size with nothing on it, and the back is the postal division —

function pcCard(r){
