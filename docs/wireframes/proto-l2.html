/* ══ V3 · Specimen ═══════════════════════════════════════════════════════
   Axis: THE CARD IS A MOUNT AND A PRINTED LABEL.

   A museum accession card does two things a tile does not: it gives the
   object air, and it prints the same fields in the same order on every card
   in the drawer, so the cards can be read against each other without reading
   their prose. Every line of the label is a field the record actually
   carries; a record missing one prints what is missing rather than dropping
   the line, because a blank line on a label is information. */
function spCard(r){
  return `<article class="sp">
    <div class="mount">${shot(r, 274, 342)}</div>
    <h3 class="det"><a href="/prompts/${esc(r.slug || r.id)}">${esc(r.title)}</a></h3>
    <dl class="label">
      <dt>Accession</dt><dd>IMG-${esc(r.id)}</dd>
      <dt>Model</dt><dd>${r.models.length
        ? `<span class="mlinks">${r.models.map(m =>
            `<a class="ml" href="/prompts/models/${slug(m)}">${esc(m)}</a>`).join("")}</span>`
        : "no model named on the source post"}</dd>
      <dt>Technique</dt><dd>${r.techs.length ? esc(r.techs.join(" · ")) : "none recorded"}</dd>
      <dt>Subject</dt><dd>${r.subjects.length ? esc(r.subjects.join(" · ")) : "not determined"}${
        r.uses.length ? ` · for ${esc(r.uses.join(", ").toLowerCase())}` : ""}</dd>
      <dt>Extent</dt><dd>${esc(extent(r))}${r.n > 1 ? ` · ${r.n} frames` : ""}</dd>
      <dt>Collected</dt><dd>${esc(r.handle || "unattributed")} · ${n(r.likes)} likes ·
        ${n(r.saves)} saves</dd>
    </dl>
    <details>
      <summary>Description</summary>
      <pre class="prompt">${promptHTML(r.prompt)}</pre>
    </details>
    <div class="acts">${copyBtn(r, "sm primary")}
      <a class="btn sm" href="/prompts/${esc(r.slug || r.id)}">Full record →</a></div>
  </article>`;
}
function v3Results(){
  const res = results();
  if (!res.length) return emptyState();
  return `<div class="cabinet">${res.map(spCard).join("")}</div>`;
}
function v3(){
  return `<div class="v3 taste">${chrome()}<main id="main"><div class="wrap">
    <header class="hero">
      <p class="eyebrow">Image gallery</p>
      <h1 class="tier-index">Image prompts</h1>
      <p class="lede">Catalogued rather than listed. Every card mounts its picture and
        prints the same six-line label underneath, so two prompts can be compared by
        looking rather than by reading.</p>
      ${searchForm()}
    </header>
    <section class="sec"><h2>Narrow the drawer</h2>${facetGroups()}</section>
    <section class="sec">
      <div class="sec-head"><h2>Editor's pick</h2>
        <span class="count end" data-count>${countLine(results())}</span></div>
      <div class="legend">
        <span><b>Accession</b> — the id of the post it was collected from</span>
        <span><b>Extent</b> — length and format of the stored text</span>
        <span><b>Collected</b> — the author, and the reach of the original post</span>
      </div>
      <div data-results>${v3Results()}</div>
    </section>
    <section class="sec"><h2>Browse by model</h2>${modelEntries(true)}</section>
    <section class="sec"><h2>Browse by tag</h2>${tagLinkCols()}</section>
  </div></main>${foot()}</div>`;
}

/* ══ V4 · Deck ═══════════════════════════════════════════════════════════
   Axis: HOW MANY CARDS AT ONCE.

   The other directions answer "show me the set". This one answers "let me
   actually look at one" — a single card at reading size, with the rest of
   the set stacked visibly behind it and a step through them. It is the only
   direction where the prompt is legible without a second surface, and the
   only one where you cannot scan. Both of those are the point. */
function dkCard(r){
  return `<article class="dc">
    ${shot(r, 480, 520)}
    <div class="side">
      <h3><a href="/prompts/${esc(r.slug || r.id)}">${esc(r.title)}</a></h3>
      ${metaRow(r)}
      ${tagRow(r)}
      <pre class="prompt">${promptHTML(r.prompt)}</pre>
      <div class="dcacts">${copyBtn(r, "primary")}
        <a class="btn" href="/prompts/${esc(r.slug || r.id)}">Full prompt →</a>${
        r.models.length ? `<a class="btn ghost"
          href="/prompts/models/${slug(r.models[0])}">All ${esc(r.models[0])} prompts →</a>` : ""}
      </div>
    </div>
  </article>`;
}
function v4Results(){
  const res = results();
  if (!res.length) return emptyState();
  if (state.di >= res.length) state.di = 0;
  return `<div class="deckwrap">
    <div class="deck" data-deck tabindex="0" role="group"
      aria-label="Image prompt deck. Press the left and right arrow keys to step through it.">
      ${res.map(dkCard).join("")}
    </div>
    <div class="dknav">
      <button class="btn" type="button" data-step="-1">← Previous</button>
      <button class="btn" type="button" data-step="1">Next →</button>
      <p class="dkpos" data-dkpos aria-live="polite">${state.di + 1} of ${res.length}</p>
      <p class="dkhint">The stack behind the card is the rest of the set.</p>
    </div>
  </div>`;
}
function v4(){
  return `<div class="v4 taste">${chrome()}<main id="main"><div class="wrap">
    <header class="hero">
      <p class="eyebrow">Image gallery</p>
      <h1 class="tier-index">Image prompts</h1>
      <p class="lede">One card at a time, big enough to read the prompt off it. The rest of
        the set is stacked behind — step through with the buttons or the arrow keys.</p>
      ${searchForm()}
    </header>
    <section class="sec"><h2>Narrow the deck</h2>${facetGroups()}</section>
    <section class="sec">
      <div class="sec-head"><h2>Editor's pick</h2>
        <span class="count end" data-count>${countLine(results())}</span></div>
      <div data-results>${v4Results()}</div>
    </section>
    <section class="sec"><h2>Browse by model</h2>${modelEntries(true)}</section>
    <section class="sec"><h2>Browse by tag</h2>${tagLinkCols()}</section>
  </div></main>${foot()}</div>`;
}

/* ── behaviour, delegated once so the picker wiring stays verbatim ─────── */
const variants = [v1, v2, v3, v4];
const stage = document.getElementById('stage');

/* classList.item(0), NOT className: these roots carry two classes, so
   className is a space-joined string and an equality test against "v4"
   silently fails — which leaves redraw() a no-op that passes every
   structural check while filtering is quietly dead. */
function kindOf(){
  const root = stage.firstElementChild;
  return root ? (root.classList.item(0) || "") : "";
}

/* The Deck's geometry is applied, not authored: --o is the card's depth
   below the top card and --dz its order inside the deck's own stacking
   context. Only transform and opacity change. */
function deckLayout(){
  const deck = stage.querySelector('[data-deck]');
  if (!deck) return;
  const cards = [...deck.children];
  if (!cards.length) return;
  if (state.di >= cards.length) state.di = 0;
  cards.forEach((el, i) => {
    const o = i - state.di;
    const d = o < 0 ? -3 : Math.min(o, 4);
    el.style.setProperty('--o', String(d));
    el.style.setProperty('--dz', String(o >= 0 ? 30 - Math.min(o, 4) : 0));
    el.toggleAttribute('data-vis', o >= 0 && o <= 3);
    el.toggleAttribute('data-top', o === 0);
    /* Off-top cards stay in the document — the prompts are the crawl surface
       — but leave the tab order and the a11y tree. */
    el.toggleAttribute('inert', o !== 0);
  });
  const pos = stage.querySelector('[data-dkpos]');
  /* Write the readout only when it actually changes. Replacing a text node is
     a childList mutation, and the observer below re-enters deckLayout on every
     childList mutation — an unconditional write is an infinite microtask loop
     that hangs the tab with no error to show for it. */
  const line = `${state.di + 1} of ${cards.length}`;
  if (pos && pos.textContent !== line) pos.textContent = line;
  const prev = stage.querySelector('[data-step="-1"]');
  const next = stage.querySelector('[data-step="1"]');
  if (prev) prev.disabled = state.di === 0;
  if (next) next.disabled = state.di >= cards.length - 1;
}
function deckStep(delta){
  const deck = stage.querySelector('[data-deck]');
  if (!deck) return;
  const cnt = deck.children.length;
  state.di = Math.min(Math.max(state.di + delta, 0), cnt - 1);
  deckLayout();
}

function redraw(){
  const k = kindOf();
  state.di = 0;
  const box = stage.querySelector('[data-results]');
  if (box) box.innerHTML = k === "v2" ? v2Results() : k === "v3" ? v3Results() : v4Results();
  const res = results();
  stage.querySelectorAll('[data-count]').forEach(el => el.textContent = countLine(res));
  if (k === "v4") deckLayout();
}

/* mount() is picker wiring and stays verbatim, so the Deck's first layout is
   driven off the same #stage mutations the theme harness watches. */
if (window.MutationObserver){
  new MutationObserver(() => { if (stage.querySelector('[data-deck]')) deckLayout(); })
    .observe(stage, { childList:true, subtree:true });
}

stage.addEventListener('click', e => {
  const copy = e.target.closest('[data-copy]');
  if (copy){
    const r = DATA.find(x => x.id === copy.getAttribute('data-copy'));
    const label = copy.getAttribute('data-label') || copy.textContent.trim();
    copy.setAttribute('data-label', label);
    const done = () => {
      copy.textContent = 'Copied';
      copy.setAttribute('data-copied','');
      setTimeout(() => { copy.textContent = label; copy.removeAttribute('data-copied'); }, 1500);
    };
    if (navigator.clipboard) navigator.clipboard.writeText(r.prompt).then(done, done); else done();
    return;
  }
  const fl = e.target.closest('button[data-flip]');
  if (fl){
    const card = fl.closest('.pc');
    const to = fl.getAttribute('data-flip');
    const show = card.querySelector('.face.' + to);
    const hide = card.querySelector('.face.' + (to === 'back' ? 'front' : 'back'));
    card.setAttribute('data-face', to);
    hide.setAttribute('inert','');
    show.removeAttribute('inert');
    const back = show.querySelector('button[data-flip]');
    if (back) back.focus({ preventScroll:true });
    return;
  }
  const step = e.target.closest('button[data-step]');
  if (step){ deckStep(Number(step.getAttribute('data-step'))); return; }
  const facet = e.target.closest('button[data-facet]');
  if (facet){
    const k = facet.getAttribute('data-facet'), v = facet.getAttribute('data-value');
    const on = state.active[k], i = on.indexOf(v);
    if (i < 0) on.push(v); else on.splice(i,1);
    stage.querySelectorAll(`.chip[data-facet="${k}"][data-value="${CSS.escape(v)}"]`)
      .forEach(c => c.setAttribute('aria-pressed', String(i < 0)));
    redraw();
    return;
  }
  if (e.target.closest('[data-clear]')){
    state.q = "";
    Object.keys(state.active).forEach(k => state.active[k] = []);
    stage.querySelectorAll('.chip[data-facet]').forEach(c => c.setAttribute('aria-pressed','false'));
    const q = stage.querySelector('#q'); if (q) q.value = "";
    redraw();
    return;
  }
  /* Nothing in a single-file prototype can navigate; the hrefs stay real so
     the link graph is inspectable, but the click is stopped here. */
  const a = e.target.closest('a[href^="/"], a[href="#"]');
  if (a) e.preventDefault();
});

/* The picker owns ArrowLeft/ArrowRight at document level. The Deck needs the
   same two keys, so it claims them only while focus is inside the deck and
   stops the event there rather than editing the picker's wiring. */
stage.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  /* .deckwrap, not [data-deck]: the step buttons sit beside the stack, and
     the arrow keys must belong to the deck while focus is on them too. */
  if (!e.target.closest || !e.target.closest('.deckwrap')) return;
  e.preventDefault();
  e.stopPropagation();
  deckStep(e.key === 'ArrowRight' ? 1 : -1);
});

let tm;
stage.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  clearTimeout(tm);
  tm = setTimeout(() => { state.q = e.target.value.trim(); redraw(); }, 300);
});
stage.addEventListener('submit', e => {
  e.preventDefault();
  const q = stage.querySelector('#q');
  clearTimeout(tm);
  state.q = q ? q.value.trim() : "";
  redraw();
});
</script>

<script>
/* ─── Picker wiring · verbatim from PICKER.md ──────────────────────────── */
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  const paint = () => { stage.innerHTML = variants[i](); };
  if (document.hidden) setTimeout(paint, 0);
  else requestAnimationFrame(paint);
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>

<script>
/* ─── Theme harness · owns only the toggle + iframe re-theming. Never
   touches the picker's own markup, styles or wiring above. ────────────── */
(function () {
  var THEME_ATTR = 'data-theme';
  var THEME_VALUE = 'linear-dark';
  var toggle = document.getElementById('theme-toggle');
  var stageEl = document.getElementById('stage');
  var cssText = null;

  function getThemeCSS() {
    if (cssText === null) {
      var block = document.getElementById('linear-dark-theme');
      cssText = block ? block.textContent : '';
    }
    return cssText;
  }

  function isDark() {
    return document.documentElement.getAttribute(THEME_ATTR) === THEME_VALUE;
  }

  function themeIframeDoc(doc, dark) {
    try {
      if (dark) {
        doc.documentElement.setAttribute(THEME_ATTR, THEME_VALUE);
        if (!doc.getElementById('linear-dark-theme')) {
          var style = doc.createElement('style');
          style.id = 'linear-dark-theme';
          style.textContent = getThemeCSS();
          (doc.head || doc.documentElement).appendChild(style);
        }
      } else {
        doc.documentElement.removeAttribute(THEME_ATTR);
      }
    } catch (err) {
      /* not same-origin, or the document went away mid-swap; nothing to do */
    }
  }

  function themeIframe(iframe, dark) {
    try {
      var doc = iframe.contentDocument;
      // Apply immediately when already loaded, but ALSO always attach a
      // 'load' listener: a freshly-inserted srcdoc iframe can report its
      // interstitial about:blank document as readyState 'complete' before
      // the real srcdoc content finishes navigating in, and that navigation
      // swaps in a brand-new, untouched contentDocument. Re-applying on
      // 'load' is what actually lands on the document the reader sees; the
      // immediate apply is a harmless no-op in that case.
      if (doc && doc.readyState === 'complete') themeIframeDoc(doc, dark);
      iframe.addEventListener('load', function onLoad() {
        iframe.removeEventListener('load', onLoad);
        themeIframeDoc(iframe.contentDocument, dark);
      });
    } catch (err) {
      /* cross-origin access denied; stay defensive */
    }
  }

  function themeAllIframes() {
    if (!stageEl) return;
    var dark = isDark();
    var iframes = stageEl.querySelectorAll('iframe');
    for (var i = 0; i < iframes.length; i++) themeIframe(iframes[i], dark);
  }

  function applyTheme(dark) {
    if (dark) document.documentElement.setAttribute(THEME_ATTR, THEME_VALUE);
    else document.documentElement.removeAttribute(THEME_ATTR);
    if (toggle) toggle.setAttribute('aria-pressed', dark ? 'true' : 'false');
    themeAllIframes();
  }

  applyTheme(new URLSearchParams(location.search).get('theme') === THEME_VALUE);

  if (toggle) {
    toggle.addEventListener('click', function () {
      var next = !isDark();
      applyTheme(next);
      var url = new URL(location);
      if (next) url.searchParams.set('theme', THEME_VALUE);
      else url.searchParams.delete('theme');
      history.replaceState(null, '', url);
    });
  }

  if (stageEl && window.MutationObserver) {
    new MutationObserver(themeAllIframes).observe(stageEl, { childList: true, subtree: true });
  }
})();
</script>
