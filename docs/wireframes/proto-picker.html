<style>/* ─── app/credit.css, verbatim ─── */
/* The credit line under the first screen's argument. Everything above it is untouched: each
   direction renders the shipped block and passes only this as a child. Scoped to .cr-*. */
@font-face{
  /* The one new face in this set, for the Signature direction only. Instrument Serif, SIL OFL —
     but this repository keeps no font licence record (frontend/AGENTS.md §7), so adopting that
     direction means registering the licence and self-hosting the file rather than a CDN. */
  font-family:"Instrument Serif";
  font-style:italic;font-weight:400;font-display:swap;
  src:url("https://cdn.jsdelivr.net/npm/@fontsource/instrument-serif@5/files/instrument-serif-latin-400-italic.woff2") format("woff2");
}
.prototype-magnetic .cr{--cr-ease:cubic-bezier(.32,.72,0,1)}
.prototype-magnetic .cr-label{font:var(--w-semi) 11px/1.5 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
@keyframes cr-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes cr-wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes cr-pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes cr-amp{from{opacity:0;transform:rotate(-9deg) scale(.9)}to{opacity:1;transform:none}}
@keyframes cr-deal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── Colophon ──────────────────────────────────────────────────────────── */
.prototype-magnetic .cr-colophon{max-width:410px;margin:34px auto 0;text-align:left}
.prototype-magnetic .cr-rule{display:block;width:56px;height:1px;background:var(--border-strong);transform-origin:left center;
  animation:cr-wipe 380ms var(--cr-ease) both}
.prototype-magnetic .cr-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;margin-top:15px}
.prototype-magnetic .cr-name{animation:cr-rise 420ms var(--cr-ease) both;animation-delay:calc(140ms + var(--i) * 70ms)}
.prototype-magnetic .cr-name a{position:relative;font:20px/1.4 var(--font-serif);letter-spacing:-.01em;color:var(--foreground)}
/* The hit area is a pseudo-element: 20px of text plus 12px either side clears 44px without
   changing the line box, and 4px of horizontal bleed cannot reach the neighbouring name. */
.prototype-magnetic .cr-name a::before{content:"";position:absolute;inset:-12px -4px}
.prototype-magnetic .cr-name a::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1px;background:currentColor;
  transform:scaleX(0);transform-origin:left center;transition:transform 220ms var(--cr-ease)}
.prototype-magnetic .cr-amp{margin-left:10px;font:italic 18px/1 var(--font-serif);color:var(--faint)}

/* ── Signature ─────────────────────────────────────────────────────────── */
/* 42px, not 52: at 1440x1000 the taller setting put the names under the fold, and a credit
   that has to be scrolled to is not on the first screen. */
.prototype-magnetic .cr-signature{max-width:640px;margin:30px auto 0;text-align:center}
.prototype-magnetic .cr-label-centred{margin-bottom:12px}
.prototype-magnetic .cr-sig{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:0 20px;
  font-family:"Instrument Serif",var(--font-serif);font-style:italic;font-weight:400;
  font-size:clamp(30px,4.4vw,42px);line-height:1.06;letter-spacing:-.012em;text-wrap:balance}
/* 32px tall at 375 where the clamp bottoms out; the extension carries it to 44 there and leaves
   the 55px desktop size alone. */
.prototype-magnetic .cr-sig-name::before{content:"";position:absolute;inset:-7px -6px}
.prototype-magnetic .cr-sig-name{position:relative;display:inline-block;color:var(--foreground);
  animation:cr-rise 520ms var(--cr-ease) both;animation-delay:calc(160ms + var(--i) * 90ms)}
.prototype-magnetic .cr-sig-amp{display:inline-block;font-size:.72em;color:var(--faint);

.prototype-magnetic .cr-stroke{position:absolute;left:0;right:0;bottom:.02em;height:2px;border-radius:2px;background:currentColor;

/* ── Plaque ────────────────────────────────────────────────────────────── */
.prototype-magnetic .cr-plaque{max-width:410px;margin:34px auto 0;text-align:left}

/* ── Kinetic ───────────────────────────────────────────────────────────── */

  animation-delay:calc(120ms + var(--i) * 26ms)}

  animation:cr-deal 460ms var(--cr-ease) both;animation-delay:calc(120ms + var(--i) * 26ms)}

/* ── Interaction ───────────────────────────────────────────────────────── */
@media (hover:hover) and (pointer:fine){
  .prototype-magnetic .cr-name a:hover::after,

  .prototype-magnetic .cr-kin-name:hover .cr-stroke{transform:scaleX(1)}

ate café moment. The sequence emphasizes speed, scale, and immersive transition from cosmic to human scale. Subject / Character: Final subject is @img1 — a young woman sitting in an open-air café named “LUMOS”, wearing denim shorts and a white shirt, casually eating a hamburger with a drink beside her. Action Timeline (TOTAL: 15s): 0–4s (Space → Earth Approach): Wide cinematic shot of Earth in deep space. Camera accelerates forward smoothly. Earth rapidly grows in frame. Subtle light streaks, atmospheric glow becomes visible. Motion builds gradually but feels grand. 4–8s (Atmospheric Entry → Fast Descent): Camera pierces atmosphere with intense glow and motion blur. Clouds rush past. Continents and terrain sweep underneath at high speed. Strong sense of acceleration. 8–11s (City Dive → Street Flow): Camera locks onto a city and dives sharply. Skyscrapers rise fast. Transition into street-level movement — fluid glide through streets, passing buildings, corners, and urban elements with dynamic motion. 11–12s (Café Target Lock): Camera spots outdoor café with large “LUMOS” sign. Rapid but smooth deceleration begins. Focus tightens. 12–15s (Final Scene – Character): Camera settles into a medium shot of @img1. She sits casually, eating a hamburger, drink on table. Natural motion (taking a bite, relaxed posture). Warm, calm contrast to previous high-speed sequence. Camera: One continuous shot, no cuts. Extreme speed ramping: slow → ultra-fast → controlled slowdown. Wide lens in space → natural cinematic lens at final shot. Smooth stabilization with slight handheld realism at the end. Audio: Cinematic rise from deep space ambience → intense whooshing during descent → city ambience → soft café sounds (light chatter, ambient noise). Style: Cinematic color grading: cool tones in space/descent → gradually warmer tones at street/café. High contrast, subtle film grain, volumetric lighting, atmospheric particles, ultra-detailed, 8K, photorealistic.","language":"en","styles":[{"sl  Medium close-up. She drops lower, body still in constant motion, hair swinging, singing intensely with clear mouth movements, sharp head turns, eyes locked on camera. Male dancers stay close, their hands lightly touching her as they move together. 8-12s: Medium shot with slow camera drift. Exactly five male dancers of completely different appearances, all wearing black tank tops and black wide pants, surround her tightly on the floor in a dense, intertwined formation. She is in the center, body still moving, upper body rising and shifting, singing with strong lip-sync. All five men move subtly with her, never static. The men never fully obscure her body. 13-15s: Dynamic medium shot. The five diverse male dancers lift her into the air in a powerful deep backbend. Her body is fully extended and arched, head thrown back, still singing with clear lip-sync. While holding her they gently rock her up and down in time with the beat. The camera starts from a clear side view of her arched body and smoothly transitions to a frontal view of her face. At the end they lower her smoothly onto her feet; she lands and immediately continues singing as the five men stay low on the floor around her. The men never fully obscure her. High fashion dance energy, sweaty skin, sharp timing, continuous fluid motion of the woman, priority on accurate lip-sync in every frame. Rules: no hand morphing, no body distortions, clean stable anatomy, fingers and hands remain consistent and natural throughout the entire video. #AIvideo #AIMusicVideo #AIFilmmaking","language":"en","styles":[{"slug":"cinematic","label":"Cinematic"}],"href":"http://127.0.0.1:3000/zh-CN/prompts/a-cinematic-15-second-music-video-shot-in-a--2078814921756754352","uses":[{"slug":"fashion","label":"Fashion"}],"models":[{"slug":"seedance","label":"Seedance"}]},{"id":"2083168602363150527","title":"A day in New York, filmed by the subject","handle":"@higgsfield_ai","kind":"video","img":"https://pbs.twimg.com/amplify_video_thumb/2083165874983424000/img/L7v_JTJr0f72f2Z_.jpg?name=small","likes":589,"saves":457,"publishedAt":"2026-07-31","sourceUrl":"https://x.com/higgsfield_ai/status/2083168602363150527","prompt":"SCENE A day in New York shot entirely by the subject herself: waking in her hotel suite, coffee, getting ready, out into the city, back to the room at night. ACTIVE REFERENCES @ image1 — the hotel suite. Curved cove ceiling with warm LED coving, deep red carpet, cream walls, two black organic sculptures above a light wood headboard, white bedding with red pillows, twin bedside lamps, pale sofa, oval coffee table, sheer curtains, dark door. @ image2 — the subject. Young woman, shoulder-length wavy blonde hair with curtain bangs and highlights, light freckles, thin gold necklace, silver ring, dark brown off-the-shoulder knit with white diamond-stripe pattern. 100% matches the reference. CAMERA OWNERSHIP LOCK Only two positions exist. HELD: arm extended, camera 0.4-0.7m from her face, visible arm tension, tilt and step-bounce. PROPPED: camera on a surface she placed it on, crooked and fixed, with her moving in and out of frame. No operator shots, no tracking, nothing she could not have filmed alone. FORMAT Eight shots, 30s, seven HARD CUTS, no fades. Real-time. 0-4s SHOT 1 — PROPPED, morning room. 84° diagonal field of view, camera on the sideboard 3m from the bed at 1.1m, static and tilted. The suite matches @ image1: cove light on, curtains half open, cool daylight across the red carpet. @ image2 visible at 0.0s, sitting up on the bed edge x66 y58. No empty frame. She rubs her face and croaks at the running camera: \"It's seven. In New York. Why am I awake.\" Stands, walks out screen-right. HARD CUT. 4-7s SHOT 2 — HELD, window light. 84°, arm's length 0.5m, above eye line. She is x50 y42 at the sheer curtain screen-left, cool daylight on the near side of her face, cove warmth behind. She pulls the curtain, squints at the street below, then into the lens: \"Okay. It's actually happening oiceover, no second speaker, no offscreen voices. Delivery is casual, unrehearsed, mid-breath, sometimes trailing off. Volume rises over street noise in Shot 6, near-whisper in Shot 8. CONTINUITY The suite matches @ image1 in both interior sequences — same carpet, sculptures, headboard, sofa, lamps. Hair, necklace and ring identical throughout. PHYSICS Loose knit slides on the shoulder with every arm movement. Wavy hair lags a frame behind head turns. Bedding creases under her weight. Step energy visible in every HELD frame. LIGHTING Shots 1-4: cool daylight from the curtains screen-left as key, warm cove LED as fill, red carpet bouncing warmth into the shadows. Shot 5: corridor light through the doorway. Shots 6-7: hard street daylight, warm diner practicals. Shot 8: lamps and cove light only. AUDIO Diegetic only, from the same camera — room tone, footsteps, door, traffic, sirens, steam vents, diner clatter, wind. Ambience ducks under her lines. No music. LOCKS Photoreal live action, 4K detail, fine grain, warm consumer-camera colour, mild rolling shutter and auto-exposure hunting. She is the only person who speaks; background figures anonymous and unfocused. No subtitles.","language":"en","styles":[{"slug":"photorealistic","label":"Photorealistic"}],"href":"http://127.0.0.1:3000/zh-CN/prompts/scene-a-day-in-new-york-shot-entirely-by-the-2083168602363150527","uses":[{"slug":"food-beverage","label":"Food & beverage"}],"models":[{"slug":"higgsfield-soul","label":"Higgsfield Soul"},{"slug":"seedance","label":"Seedance"}]},{"id":"2029632175482507599","title":"Forensic-detail beauty portrait, hooded eyes","handle":"@PinodiArt","kind":"image","img":"https://pbs.twimg.com/media/HCqzkiOXEAE3uDT.jpg?name=small","likes":2434,"saves":1151,"publishedAt":"2026-03-05","sourceUrl":"https://x.com/PinodiArt/status/2029632175482507599","prompt":"{ \"subject\": { \"identity\": { \"biometric_reference\": \"Sydney Sweeney\", \"facial_forensics\": { \"structure\": \"Soft-edged heart-sha eads across the paper city. Shadows from the buildings become longer and more defined. Tiny paper windows begin reflecting the sunlight. The camera continues rising, revealing the geometric relationship between the streets and buildings. 00:23–00:27 — THE DETAIL Cut to an 85mm close-up. Focus on a tiny paper clock mounted on one building. The clock moves forward by one minute. Rack focus from the clock to the miniature skyline behind it. 00:27–00:30 — FINAL IMAGE Return to an extreme wide shot. The entire paper city sits beneath a large studio window. The morning light completely fills the miniature world. Camera slowly pulls backward until the city becomes a small object within the larger room. Fade to black. CINEMATOGRAPHY Large-format feature-film aesthetic. 100mm macro for texture. 85mm for detail. 50mm for natural perspective. 35mm for environmental shots. Controlled dolly and crane movements. Realistic depth of field. Natural focus transitions. Soft motion blur. Subtle lens imperfections. No artificial camera shake. MATERIAL DIRECTION Every surface must visibly behave like physical paper. Visible paper fibers. Natural folds. Tiny imperfections. Soft cardboard edges. Realistic contact shadows. Believable paper thickness. Natural material deformation. LIGHTING Soft morning daylight. Large window as the primary source. Natural bounce light. Gentle shadows. Subtle warm highlights. No artificial neon effects. No excessive visual effects. CONTINUITY The same paper city throughout the entire sequence. Buildings maintain identical shapes and positions. Roads remain connected. Paper materials remain consistent. No random transformations. No flickering. No duplicated structures. No sudden environmental changes. DIRECTOR’S NOTE Treat this as a miniature feature film, not a visual-effects demonstration. The camera should discover the world gradually. Start intimate. Reveal scale. Return to detail. Finish wide. The audience should feel that they are watching a real handcra ify_video_thumb/2085640247682224128/img/Wj08brZzXojtfWtv.jpg?name=small","likes":297,"saves":232,"publishedAt":"2026-08-07","sourceUrl":"https://x.com/oggii_0/status/2085640281941307648","prompt":"Montage, multi-shot candid observational footage. Do not use a single camera angle or continuous take. Handheld documentary style with the feeling of accidental real-life capture. Slightly imperfect framing, subtle handheld shake, tiny reframing adjustments, gentle exposure breathing, and autofocus that settles half a beat late. Realistic skin texture, soft indoor natural light, film grain, shallow depth of field. Relaxed breathing, natural blinking, restrained and authentic performance. Total of 7 shots. The woman from @ Image 1 is wearing a matching cotton pajama set consisting of a scoop-neck sleeveless top and loose shorts made from the same fabric and design. Barefoot, she lies on her stomach across a lived-in, slightly messy bed in her bedroom, browsing a mobile shopping page on a black smartphone. A house cat jumps onto the bed seeking attention, and she affectionately plays with it. Moments later, a friend calls. She answers, chats, and eventually bursts into laughter. The doorbell rings, so she ends the call and gets up to collect her dinner. Shot 1 (0–2s): She is already moving. One thumb scrolls through a shopping page while she frowns slightly, thinking. She quietly mutters in Korean: \"아, 뭐 살랬더라…\" (\"Ah... what was I going to buy again?\"). Lips synchronize naturally. Her bare feet gently sway behind her. A low handheld camera glides along the edge of the mattress, with soft bedding partially obscuring the foreground. Shot 2 (2–4s): The house cat jumps onto the bed, compressing the blanket as it walks toward her forearm and lets out a single meow. The camera gives a slight jolt from the impact, then quickly reframes from the phone to an over-the-shoulder view that includes her face, hands, phone, and cat. Shot 3 (4–6s): She turns warmly toward the cat, stroking it once from its forehead to its shoulders. In a gentle, affectionate tone she says: \"우리 애기 왔어?\" (\"Did my baby come?\"). Lip sync is clear and natural. The camera pushes in briefly through the cat's softly blurred foreground toward her face and hand. Shot 4 (6–8s): A friend's ringtone sounds. She glances down, confirms the caller, swipes to answer, and brings the phone to her ear. The camera moves in a loose semicircle from a slightly tilted overhead angle, capturing the entire answering motion. Shot 5 (8–11s): Her friend begins talking. She responds first with confusion, then disbelief: \"어, 왜? 진짜 거짓말.\" (\"Huh? Why? No way, you're kidding.\"). Immediately afterward she naturally bursts into laughter. The cat kneads the blanket beside her. A close handheld side angle keeps both her phone and profile within the same focal plane. Shot 6 (11–13s): A clear doorbell interrupts the laughter. Both she and the cat turn toward the bedroom door. She braces one hand on the mattress to get up. The camera reacts a fraction too late, briefly turning toward the door before naturally correcting back to her rising movement. Shot 7 (13–15s): Still on the phone, she hurriedly says: \"어, 나 밥 왔다. 끊어.\" (\"My food's here. I'll hang up.\"). She ends the call with her thumb, gets off the bed, and walks toward the door while the cat follows across the blankets. The camera slides low beneath her elbow and tilts upward as she stands in one continuous motion. Sound: No music. Only raw production sound: bedding rustling, quiet breathing, finger taps on the phone, the soft impact of the cat jumping onto the bed, one natural meow, faint purring, a single short incoming ringtone, call connection tone, the friend's voice through the phone, the woman's four Korean lines with accurate lip sync, a genuine brief laugh, one clear doorbell, the tap ending the call, and soft cat footsteps. No subtitles, no on-screen text, no logo, no watermark. Never render a reference sheet or duplicate the subject.","language":"en","styles":[{"slug":"photorealistic","label":"Photorealistic"}],"href":"http://127.0.0.1:3000/zh-CN/prompts/montage-multi-shot-candid-observational-foot-2085640281941307648","uses":[],"models":[{"slug":"seedance","label":"Seedance"}]},{"id":"2047862141894681076","title":"Bedroom phone recording, late afternoon light","handle":"@ChillaiKalan__","kind":"image","img":"https://pbs.twimg.com/media/HGt3trjbwAA7Bkt.jpg?name=small","likes":316,"saves":293,"publishedAt":"2026-04-25","sourceUrl":"https://x.com/ChillaiKalan__/status/2047862141894681076","prompt":"A realistic young woman sitting casually in a softly lit bedroom during late afternoon. She is holding her phone very close to her face as if recording a private video or voice note. Framing is tight and slightly imperfect. Expression: thoughtful, slightly shy, natural. Minimal makeup, natural skin texture, relaxed clothing. Lighting: warm natural light fading from a window, soft shadows. Environment: simple bedroom, calm and lived-in. Style: ultra-realistic, looks like a real phone recording, slightly grainy, not cinematic.","language":"en","styles":[{"slug":"photorealistic","label":"Photorealistic"}],"href":"http://127.0.0.1:3000/zh-CN/prompts/a-realistic-young-woman-sitting-casually-in--2047862141894681076","uses":[{"slug":"beauty","label":"Beauty"}],"models":[{"slug":"gpt-image","label":"GPT Image"},{"slug":"seedance","label":"Seedance"}]},{"id":"2063871161998745877","title":"Premium product campaign poster, 4:5","handle":"@AIwithSarah_","kind":"image","img":"https://pbs.twimg.com/media/HKRX36vbsAAskMp.jpg?name=small","likes":267,"saves":269,"publishedAt":"2026-06-08","sourceUrl":"https://x.com/AIwithSarah_/status/2063871161998745877","prompt":"Create a photorealistic premium product campaign poster in a 4:5 vertical aspect ratio. Product: [PRODUCT NAME] Brand style: [BRAND / PREMIUM / LUXURY / TECH / BEAUTY / FOOD / DRINK] Main subject: A confident model holding or presenting the product close t /* ══════════════════════════════════════════════════════════════════════

const taskHref = task => '?s=3&task=' + encodeURIComponent(task.slug);

    const prompts = DATA.prompts.filter(p => p.uses.some(r => r.slug === task.slug));
    const models = new Map();
    prompts.forEach(p => p.models.forEach(r => models.set(r.slug, {...r, count: (models.get(r.slug)?.count || 0) + 1})));
    return {task, prompts, images: prompts.filter(p => p.kind === 'image').length, videos: prompts.filter(p => p.kind === 'video').length,
      models: [...models.values()].sort(byCount), shots: prompts.filter(p => p.img)};
  }).filter(r => r.prompts.length).sort((a, b) => byCount(a.task, b.task));
}
function modelColumns(){
  const models = new Map();
  for (const p of DATA.prompts) for (const r of p.models) models.set(r.slug, {...r, count: (models.get(r.slug)?.count || 0) + 1});
  return [...models.values()].sort(byCount);
}

function hubBand(axis, id, heading, hrefFor){

        }).join('') + '</tr>').join('') + '</tbody></table></div>'
      + '<p class="matrix-legend">Fewer <span aria-hidden="true">▁ ▂ ▃ ▅</span> More <span>Prompts may appear in more than one model or style.</span></p>'
      + '<section class="matrix-results"><div class="section-heading"><h2>' + esc(label) + ' <small>' + selected.length + '</small></h2>'
      + ((L3.mxModel || L3.mxStyle) ? '<button data-mx="reset">Clear selection</button>' : '') + '</div>'
      + '<div class="result-grid">' + selected.map(promptCard).join('') + '</div></section>';
  });
}
function taskLanes(){
  return taskShell('Start with the result. Follow each model through a column of images, videos and the prompts behind them.', rows => {
    const models = terms(rows, 'models');
    const groups = [...models, ...(rows.some(p => !p.models.length)
      ? [{slug: 'none', label: 'No model named', count: rows.filter(p => !p.models.length).length}] : [])];
    return '<nav class="model-tabs" aria-label="Model lanes"><button data-lane="" aria-pressed="' + (!L3.lane) + '">All models</button>'
      + groups.map(m => '<button data-lane="' + esc(m.slug) + '" aria-pressed="' + (L3.lane === m.slug) + '">' + esc(m.label)
        + '<small>' + m.count + '</small></button>').join('') + '</nav>'
      + '<p class="lane-hint">Follow a model down its column. Prompts naming several models appear in each.</p>'
      + '<div class="lanes" role="region" aria-label="Prompt lanes by model" tabindex="0">'
      + groups.filter(m => !L3.lane || m.slug === L3.lane).map((m, i) => '<section class="lane">'
        + '<div class="lane-head"><span class="proto-overline">' + String(i + 1).padStart(2, '0') + '</span><h2>' + esc(m.label) + '</h2><b>' + m.count + '</b></div>'
        + rows.filter(p => m.slug === 'none' ? !p.models.length : p.models.some(r => r.slug === m.slug)).map(promptCard).join('')
        + '</section>').join('') + '</div>';
  });
}
function taskIndex(){
  return taskShell('A reading desk for this task. Scan the index, open a result, and read the complete prompt without losing your place.', rows => {
    const shown = rows.filter(p => !L3.ixModel || p.models.some(r => r.slug === L3.ixModel));
    const selected = shown.find(p => p.id === L3.sel) || shown[0];
    return '<div class="index-layout"><section class="index-directory" aria-label="Prompt index">'
      + '<label class="index-model">Model<select data-l3="ixmodel"><option value=""' + (L3.ixModel ? '' : ' selected') + '>All models · ' + rows.length + '</option>'
      + terms(rows, 'models').map(m => '<option value="' + esc(m.slug) + '"' + (L3.ixModel === m.slug ? ' selected' : '') + '>'
        + esc(m.label) + ' · ' + m.count + '</option>').join('') + '</select></label>'
      + '<div class="index-list">' + shown.map((p, i) => '<button class="index-row" data-index="' + p.id + '" aria-pressed="'
        + (selected && p.id === selected.id) + '"><span class="index-number">' + String(i + 1).padStart(2, '0') + '</span>'
        + '<span><b>' + esc(p.title) + '</b><small>' + esc(p.handle) + ' · ' + esc(p.kind) + '</small></span>'
        + '<span aria-hidden="true">↗</span></button>').join('') + '</div></section>'
      + '<section class="index-reader" id="reader" aria-label="Selected prompt">' + (selected ? promptDetail(selected) : '') + '</section></div>';
  });
}

/* ══════════════════════════════════════════════════════════════════════
   Surface 4 · The first screen's credit line
   Handles supplied by the user; nothing here is inferred. A credit carrying a guessed handle is
   worse than no credit at all.
   ══════════════════════════════════════════════════════════════════════ */
const CREDITS = [
  {name: 'Vincent Wu', handle: '@VincentWu11', href: 'https://x.com/VincentWu11'},
  {name: 'Steve Li', handle: '@st3v3li', href: 'https://x.com/st3v3li'},
];
const LINK = ' target="_blank" rel="nofollow noopener noreferrer"';
/* The shipped first screen, copied verbatim out of Hub.tsx. Every direction renders THIS and
   appends only the credit, so "nothing else changes" is structural rather than promised. */
const argument = credit => shell('<section class="wrap argument"><h1>Somebody already wrote this</h1><div class="body">'
  + '<p>Every prompt in this library was published in the open by the person who wrote it, and then mostly lost — buried under a feed that is optimised for the next thing rather than the useful thing.</p>'
  + '<p>So the whole of the work here is <em>not editing</em>. No paraphrase, no house style, no distillation into a template. The text you copy is the text they posted, down to the render settings at the end that look like noise and are not.</p>'
  + '<p>What we add is the index, the attribution, and a link back. That is the entire product.</p>'
  + '</div>' + (credit || '') + '</section><div class="after">' + categoryBand() + '</div>');

const crCurrent = () => argument('');
const crColophon = () => argument('<div class="cr cr-colophon"><span class="cr-rule" aria-hidden="true"></span>'
  + '<p class="cr-line"><span class="cr-label">Credit to</span>'
  + CREDITS.map((p, i) => '<span class="cr-name" style="--i:' + i + '"><a href="' + p.href + '"' + LINK + '>' + esc(p.name) + '</a>'
    + (i === 0 ? '<span class="cr-amp" aria-hidden="true">&amp;</span>' : '') + '</span>').join('') + '</p></div>');
const crSignature = () => argument('<div class="cr cr-signature"><p class="cr-label cr-label-centred">Credit to</p><p class="cr-sig">'
  + '<a class="cr-sig-name" href="' + CREDITS[0].href + '"' + LINK + ' style="--i:0">' + esc(CREDITS[0].name) + '<span class="cr-stroke" aria-hidden="true"></span></a>'
  + '<span class="cr-sig-amp" aria-hidden="true">&amp;</span>'
  + '<a class="cr-sig-name" href="' + CREDITS[1].href + '"' + LINK + ' style="--i:1">' + esc(CREDITS[1].name) + '<span class="cr-stroke" aria-hidden="true"></span></a>'
  + '</p></div>');
const crPlaque = () => argument('<div class="cr cr-plaque"><p class="cr-label">Credit to</p><div class="cr-card">'
  + CREDITS.map((p, i) => '<a class="cr-row" href="' + p.href + '"' + LINK + ' style="--i:' + i + '">'
    + '<span class="cr-row-name">' + esc(p.name) + '</span><span class="cr-row-handle">' + esc(p.handle) + '</span>'
    + '<span class="cr-row-go" aria-hidden="true">↗</span></a>').join('') + '</div></div>');
/* The glyph spans are aria-hidden and the real name sits beside them, so the effect never costs
   the text. A plain space inside an inline-block would collapse, hence the non-breaking one. */
const glyphs = (word, offset) => [...word].map((glyph, i) =>
  '<span class="cr-glyph" style="--i:' + (offset + i) + '">' + esc(glyph === ' ' ? '\u00A0' : glyph) + '</span>').join('');
function crKinetic(){
  let offset = 0;
  return argument('<div class="cr cr-kinetic"><p class="cr-label">Credit to</p><p class="cr-kin">'
    + CREDITS.map((p, index) => {
      const start = offset; offset += p.name.length + 3;
      return '<span class="cr-kin-part"><a class="cr-kin-name" href="' + p.href + '"' + LINK + '>'
        + '<span class="vh">' + esc(p.name) + '</span><span aria-hidden="true">' + glyphs(p.name, start) + '</span>'
        + '<span class="cr-stroke" aria-hidden="true"></span></a>'
        + (index === 0 ? '<span class="cr-kin-amp" aria-hidden="true" style="--i:' + (start + p.name.length) + '">&amp;</span>' : '') + '</span>';
    }).join('') + '</p></div>');
}

/* ══════════════════════════════════════════════════════════════════════
   Harness
   ══════════════════════════════════════════════════════════════════════ */
const SURFACES = [
  {id: 'first', names: ['Current', 'Board', 'Quilt', 'Statement', 'Split'], render: [fsCurrent, fsBoard, fsQuilt, fsStatement, fsSplit]},
  {id: 'band', names: ['Current', 'Plate', 'Ledger', 'Field', 'Directory'], render: [bxCurrent, bxPlate, bxLedger, bxField, bxDirectory]},
  {id: 'task', names: ['Current', 'Matrix', 'Lanes', 'Index'], render: [taskCurrent, taskMatrix, taskLanes, taskIndex]},
  /* The only surface with an entrance to re-trigger, so the only one whose pill carries a replay. */
  {id: 'credit', names: ['Current', 'Colophon', 'Signature', 'Plaque', 'Kinetic'], replay: true,
    render: [crCurrent, crColophon, crSignature, crPlaque, crKinetic]},
];
const params = new URLSearchParams(location.search);
let surface = Math.min(Math.max(parseInt(params.get('s'), 10) || 1, 1), SURFACES.length) - 1;
const chosen = [0, 0, 0, 0];
{
  const v = parseInt(params.get('v'), 10);
  if (v >= 1 && v <= SURFACES[surface].names.length) chosen[surface] = v - 1;
}
L3.task = params.get('task') || [...DATA.tasks].sort((a, b) => b.count - a.count)[0].slug;
L3.model = params.get('model') || '';

const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const surfaceNav = document.querySelector('.proto-surface');
const surfaceHighlight = surfaceNav.querySelector('.proto-surface-highlight');
const surfaceItems = [...surfaceNav.querySelectorAll('.proto-surface-item')];
let items = [];

/* The picker's buttons are written from JS because the three surfaces do not have the same number
   of directions; the markup it produces is PICKER.md's, button for button. */
function paintPicker(){
  const config = SURFACES[surface];
  picker.innerHTML = '';
  picker.append(surfaceHighlightSpare());
  items = config.names.map((name, i) => {
    const button = document.createElement('button');
    button.className = 'proto-picker-item';
    button.textContent = name;
    button.addEventListener('click', () => setVariant(i));
    picker.append(button);
    return button;
  });
  /* PICKER.md renders the replay control only where there is an entrance to re-trigger. */
  if (config.replay) {
    const divider = document.createElement('span');
    divider.className = 'proto-picker-divider';
    divider.setAttribute('aria-hidden', 'true');
    const button = document.createElement('button');
    button.className = 'proto-picker-item proto-picker-replay';
    button.setAttribute('aria-label', 'Replay animation (R)');
    button.textContent = '↻';
    button.addEventListener('click', paintStage);
    picker.append(divider, button);
  }
}
function paintStage(){
  const config = SURFACES[surface], render = config.render[chosen[surface]];
  if (!config.replay) { stage.innerHTML = render(); return; }
  /* Clear first, render next frame, so the entrance runs again on every mount and on replay. */
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = render(); });
}
function surfaceHighlightSpare(){ return highlight; }
function moveHighlight(){
  const el = items[chosen[surface]];
  if (!el) return;
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = 'translateX(' + el.offsetLeft + 'px)';
}
function moveSurfaceHighlight(){
  const el = surfaceItems[surface];
  surfaceHighlight.style.width = el.offsetWidth + 'px';
  surfaceHighlight.style.transform = 'translateX(' + el.offsetLeft + 'px)';
}
function writeUrl(){
  const url = new URL(location);
  url.searchParams.set('s', surface + 1);
  url.searchParams.set('v', chosen[surface] + 1);
  if (surface === 2) {
    url.searchParams.set('task', L3.task);
    if (L3.model) url.searchParams.set('model', L3.model); else url.searchParams.delete('model');
  } else { url.searchParams.delete('task'); url.searchParams.delete('model'); }
  history.replaceState(null, '', url);
}
function mount(){
  paintStage();
  items.forEach((el, i) => {
    el.toggleAttribute('data-active', i === chosen[surface]);
    if (i === chosen[surface]) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current');
  });
  surfaceItems.forEach((el, i) => {
    el.toggleAttribute('data-active', i === surface);
    if (i === surface) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current');
  });
  moveHighlight();
  moveSurfaceHighlight();
  writeUrl();
}
function setVariant(i){
  if (i < 0 || i >= SURFACES[surface].names.length) return;
  chosen[surface] = i;
  mount();
}
function setSurface(i){
  if (i < 0 || i >= SURFACES.length || i === surface) return;
  surface = i;
  paintPicker();
  mount();
  /* Surfaces are different pages; a variant swap inside one keeps your place, a surface swap does not. */
  scrollTo({top: 0, behavior: 'instant'});
}
surfaceItems.forEach((el, i) => el.addEventListener('click', () => setSurface(i)));
window.addEventListener('resize', () => { moveHighlight(); moveSurfaceHighlight(); });
document.addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= SURFACES[surface].names.length) setVariant(num - 1);
  else if (e.key === 'ArrowRight') setVariant((chosen[surface] + 1) % SURFACES[surface].names.length);
  else if (e.key === 'ArrowLeft') setVariant((chosen[surface] - 1 + SURFACES[surface].names.length) % SURFACES[surface].names.length);
  else if (e.key === ']') setSurface((surface + 1) % SURFACES.length);
  else if (e.key === '[') setSurface((surface - 1 + SURFACES.length) % SURFACES.length);
  else if ((e.key === 'r' || e.key === 'R') && SURFACES[surface].replay) paintStage();
});

/* ── the task surface's own state, delegated once ─────────────────────── */
function redrawResults(){
  const region = stage.querySelector('[data-results]');
  if (!region) return mount();
  const rows = taskFiltered(), all = taskAll();
  const body = {1: taskMatrix, 2: taskLanes, 3: taskIndex}[chosen[2]];
  /* Re-render the results region only: a full remount would take the search field's focus away on
     every keystroke. */
  const next = document.createElement('div');
  next.innerHTML = body();
  const fresh = next.querySelector('[data-results]');
  region.innerHTML = fresh ? fresh.innerHTML : '';
  const count = stage.querySelector('.result-count');
  if (count) count.textContent = rows.length + ' / ' + all.length + ' prompts';
  stage.querySelectorAll('[data-kind]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.kind === L3.kind)));
}
document.addEventListener('input', e => {
  if (e.target.dataset?.l3 === 'q') { L3.q = e.target.value; redrawResults(); }
});
document.addEventListener('change', e => {
  const key = e.target.dataset?.l3;
  if (key === 'task') { L3.task = e.target.value; L3.q = ''; L3.kind = 'all'; L3.model = ''; L3.mxModel = ''; L3.mxStyle = ''; L3.lane = ''; L3.ixModel = ''; L3.sel = ''; mount(); }
  else if (key === 'ixmodel') { L3.ixModel = e.target.value; L3.sel = ''; redrawResults(); }
});
document.addEventListener('click', e => {
  const target = e.target.closest?.('[data-kind],[data-mx],[data-lane],[data-index],[data-peek],[data-l3]');
  if (!target || !stage.contains(target)) return;
  const key = target.dataset;
  if (key.kind !== undefined) { L3.kind = key.kind; redrawResults(); }
  else if (key.mx === 'reset') { L3.mxModel = ''; L3.mxStyle = ''; redrawResults(); }
  else if (key.mx === 'model') { L3.mxModel = key.slug; L3.mxStyle = ''; redrawResults(); }
  else if (key.mx === 'style') { L3.mxStyle = key.slug; L3.mxModel = ''; redrawResults(); }
  else if (key.mx === 'cell') { L3.mxModel = key.slug; L3.mxStyle = key.slug2; redrawResults(); }
  else if (key.lane !== undefined) { L3.lane = key.lane; redrawResults(); }
  else if (key.index) { L3.sel = key.index; redrawResults(); if (innerWidth < 800) stage.querySelector('#reader')?.scrollIntoView({block: 'start'}); }
  else if (key.peek) {
    const prompt = DATA.prompts.find(p => p.id === key.peek);
    const dialog = stage.querySelector('[data-l3="dialog"]');
    stage.querySelector('[data-dialog-body]').innerHTML = promptDetail(prompt);
    dialog.showModal();
  }
  else if (key.l3 === 'close') stage.querySelector('[data-l3="dialog"]').close();
  else if (key.l3 === 'chip') { L3.model = ''; mount(); }
  else if (key.l3 === 'clear') { L3.q = ''; L3.kind = 'all'; L3.model = ''; mount(); }
});
/* Clicking the backdrop closes the preview; Escape and the focus trap are the element's own. */
document.addEventListener('click', e => {
  if (e.target.matches?.('dialog.task-dialog')) e.target.close();
});
/* In-file links (?s=…) switch surface without a reload; everything else leaves for the real site. */
document.addEventListener('click', e => {
  const link = e.target.closest?.('a[href^="?s="]');
  if (!link || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  const next = new URLSearchParams(link.getAttribute('href').slice(1));
  const task = next.get('task');
  if (task) { L3.task = task; L3.q = ''; L3.kind = 'all'; L3.mxModel = ''; L3.mxStyle = ''; L3.lane = ''; L3.ixModel = ''; L3.sel = ''; }
  L3.model = next.get('model') || '';
  setSurface(Math.min(Math.max(parseInt(next.get('s'), 10) || 1, 1), SURFACES.length) - 1);
});

paintPicker();
mount();
requestAnimationFrame(() => requestAnimationFrame(() => {
  picker.setAttribute('data-ready', '');
  surfaceNav.setAttribute('data-ready', '');
}));

/* The board's hover layer: one tip, driven by the cells' own data-tip, on hover and on keyboard
   focus. It lives inside the scoped wrapper — every rule in these stylesheets is written under
   .prototype-magnetic, and on <body> it would lose its own pointer-events:none. */
const tip = document.createElement('span');
tip.className = 'fs-tip';
tip.hidden = true;
const showTip = el => {
  const box = el.getBoundingClientRect();
  const host = stage.querySelector('.prototype-magnetic');
  if (!host) return;
  host.append(tip);
  tip.textContent = el.dataset.tip;
  tip.style.left = box.left + 'px';
  tip.style.top = box.top + 'px';
  tip.hidden = false;
};
for (const type of ['mouseover', 'focusin']) document.addEventListener(type, e => {
  const cell = e.target.closest?.('.fs-cell[data-tip]');
  if (cell) showTip(cell); else tip.hidden = true;
});
for (const type of ['mouseout', 'focusout']) document.addEventListener(type, () => { tip.hidden = true; });
document.addEventListener('scroll', () => { tip.hidden = true; }, {passive: true});
</script>
