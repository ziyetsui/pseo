<meta charset="utf-8">
<title>Prompt library — full wireframe (EN)</title>
<style>
:root{color-scheme:light dark;
  --sh-bg:light-dark(rgb(255 255 255),rgb(22 22 24));
  --sh-fg:light-dark(rgb(24 26 29),rgb(250 250 252));
  --sh-muted:light-dark(rgb(24 26 29/55%),rgb(250 250 252/55%));
  --sh-border:light-dark(rgb(24 26 29/14%),rgb(255 255 255/18%));
  --sh-card:light-dark(rgb(255 255 255/92%),rgb(32 32 36/92%));}
body{margin:0;background:var(--sh-bg);color:var(--sh-fg);
  font:13px/1.5 -apple-system,system-ui,"PingFang SC",sans-serif}
.frame{position:fixed;inset:0;width:100%;height:100%;border:0;visibility:hidden;background:var(--sh-bg)}
.frame.on{visibility:visible}
.lvl{position:fixed;left:14px;bottom:14px;z-index:999;display:flex;gap:3px;align-items:center;
  padding:5px;border:1px solid var(--sh-border);border-radius:999px;background:var(--sh-card);
  backdrop-filter:blur(10px);box-shadow:0 4px 18px rgb(0 0 0/12%)}
.lvl button{border:0;background:transparent;color:var(--sh-muted);font:inherit;font-size:12px;
  padding:4px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.lvl button:hover{color:var(--sh-fg)}
.lvl button[aria-current="true"]{background:var(--sh-fg);color:var(--sh-bg)}
.lvl .sep{width:1px;height:14px;background:var(--sh-border)}
</style>
<nav class="lvl" aria-label="Level">
  <button data-r="l1">L1 Hub</button><span class="sep"></span>
  <button data-r="l2">L2 Images</button><span class="sep"></span>
  <button data-r="l2v">L2 Videos</button><span class="sep"></span>
  <button data-r="l3">L3 Model</button><span class="sep"></span>
  <button data-r="l4">L4 Prompt</button>
</nav>
<script>
const PAGES={"l1": "<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Prompt library — hub (Quotations)</title>\n\n<style>\n/* ─── Real materials: tokens lifted from the wireframe ──────────────────\n   Two alphas are deliberately NOT verbatim — see the contrast note on\n   --muted / --faint below. Everything else is the shipped token block. */\n:root{\n  color-scheme: light dark;\n  --background: light-dark(rgb(255 255 255), rgb(22 22 24));\n  --surface: light-dark(rgb(250 250 251), rgb(28 28 31));\n  --foreground: light-dark(rgb(24 26 29), rgb(250 250 252));\n  /* DIVERGENCE from the shared token block, and the only one.\n     The shipped alphas are --muted 56% and --faint 38%. Composited on white\n     those measure 4.02:1 and 2.38:1 — both are spent on real text here\n     (16.5px deks, 13px footer links, 11px mono captions), so both are below\n     the 4.5:1 floor this round is verified against, and --faint is badly\n     below it. Lifted to 70% / 62% => 6.55:1 and 4.88:1, measured. Lightness\n     only: same hue, same ink, no saturation added, dark branch lifted to\n     match. The dark THEME sets --faint outright (#8a8f98, 6.13:1) and\n     deliberately leaves --muted alone, so this only governs light mode and\n     un-themed dark. Cost, stated: the light ink ladder tightens from\n     18.7 / 4.0 / 2.4 to 18.7 / 6.6 / 4.9 — three steps that used to be far\n     apart now sit closer together, and the faintest caption reads heavier\n     than the shipped page's. That is the price of the floor. */\n  --muted: light-dark(rgb(24 26 29 / 70%), rgb(250 250 252 / 70%));\n  --faint: light-dark(rgb(24 26 29 / 62%), rgb(250 250 252 / 62%));\n  --card: light-dark(rgb(255 255 255), rgb(32 32 36));\n  --border: light-dark(rgb(24 26 29 / 11%), rgb(255 255 255 / 13%));\n  --border-strong: light-dark(rgb(24 26 29 / 20%), rgb(255 255 255 / 24%));\n  --accent: light-dark(rgb(51 126 255), rgb(131 180 255));\n  --ok: light-dark(rgb(0 133 61), rgb(74 200 124));\n  /* One token for the inset image hairline, picked up by light-dark() itself,\n     so the no-image placeholder gets the same treatment as a real <img>. */\n  --img-outline: light-dark(rgb(0 0 0 / .1), rgb(255 255 255 / .1));\n  /* --ok is lifted bright enough in dark to work as 11px caption text, which\n     makes it too light to carry white text on top of it. Near-black on the\n     fill in dark (9.0:1), white in light (4.75:1). */\n  --ok-fg: light-dark(#fff, #08090a);\n  /* Inter Variable, because the tone this round is chasing is not reachable\n     without it: the Linear survey measures weights 510 and 590, and a system\n     stack snaps those to 500/600 — its own note says that \"changes the tone\".\n     Loaded from a CDN with the platform stack behind it and font-synthesis\n     off, so a failed load shows up as an obvious regression rather than a\n     faked bold. This is a PROTOTYPE dependency: frontend/AGENTS.md §7.6 has\n     not ruled on a web font for production. */\n  --font-sans: \"InterVariable\", -apple-system, system-ui, \"Segoe UI\", \"PingFang SC\", \"Hiragino Sans GB\", sans-serif;\n  --font-mono: ui-monospace, SFMono-Regular, \"SF Mono\", Menlo, Consolas, monospace;\n  /* The one addition: a system serif, no web font, for the display register. */\n  --font-serif: ui-serif, Georgia, \"Times New Roman\", serif;\n  --r: 12px; --wrap: 1160px;\n  /* Retina hairline for the lines that separate rather than elevate. */\n  --hairline: 1px;\n  /* One z scale; nothing invents its own number. */\n  --z-cell: 1; --z-sticky: 40; --z-skip: 99;\n}\n@media only screen and (min-resolution: 192dpi){ :root{ --hairline: .5px } }\n\n/* ─── Measured from the Linear survey (specs/images/linear-design-token-\n   reference.md, 29 routes). Not invented, and not a full design system. ─── */\n@font-face{\n  font-family:\"InterVariable\";\n  font-style:normal;\n  font-weight:100 900;\n  font-display:swap;\n  src:url(\"https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/files/inter-latin-wght-normal.woff2\") format(\"woff2\");\n}\n:root{\n  /* Variable weights. 510 and 590 are the point; 400 stays the text weight. */\n  --w-text:400; --w-medium:510; --w-semi:590;\n  /* Container ladder: 1436 = 1344 homepage frame + 46px gutters either side. */\n  --w-wide:1436px; --w-page:1024px; --w-prose:624px;\n  /* Motion. Four durations, three easings — nothing else. */\n  --t-quick:100ms; --t-regular:250ms; --t-out:150ms;\n  --e-out:cubic-bezier(.25,.46,.45,.94);\n  --e-emphatic:cubic-bezier(.23,1,.32,1);\n  --e-structural:cubic-bezier(.455,.03,.515,.955);\n  /* Light-mode elevation ladder. Dark collapses to a ring (theme block). */\n  --sh-tiny:0 1px 1px #00000017;\n  --sh-low:0 1px 4px -1px #00000017;\n  --sh-med:0 3px 12px #00000017;\n  --sh-high:0 7px 24px #0000000f;\n}\n/* cv01 opens the digits, ss03 the alternate letterforms — both are what\n   aiforui.dev enables on its own Inter. */\nbody{font-feature-settings:\"cv01\",\"ss03\";font-synthesis:none}\n\n/* The H1 tier ladder: size is a function of the page's rank in the site, not\n   of its content. Chapters and Frame present as flagship pages (64); Stream\n   and Matrix present as index pages (48), which is the tier Linear's own\n   /changelog and /customers sit on. Tracking is a uniform −0.022em. */\n.tier-flagship{font-size:clamp(38px,5vw,64px);font-weight:var(--w-medium);\n  line-height:1;letter-spacing:-.022em;text-wrap:balance}\n.tier-index{font-size:clamp(32px,3.6vw,48px);font-weight:var(--w-medium);\n  line-height:1;letter-spacing:-.022em;text-wrap:balance}\n.tier-ref{font-size:clamp(28px,2.8vw,40px);font-weight:var(--w-medium);\n  line-height:1.1;letter-spacing:-.022em;text-wrap:balance}\n\n/* The header is 72px + a 1px hairline and its background is fully\n   transparent — the translucency is entirely backdrop-filter. */\n.taste .nav{background:transparent;backdrop-filter:blur(20px);\n  -webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}\n.taste .nav .wrap{min-height:72px;max-width:var(--w-wide)}\n.taste .wrap{max-width:var(--w-wide)}\n.taste .prose{max-width:var(--w-prose)}\n.taste .eyebrow{font:var(--w-semi) 11px/1.5 var(--font-mono);letter-spacing:.09em;\n  text-transform:uppercase;color:var(--faint)}\n\n\n*,*::before,*::after{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\n@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }\nbody{margin:0;background:var(--background);color:var(--foreground);\n     font-family:var(--font-sans);font-size:15px;line-height:1.6;\n     -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;\n     font-synthesis:none;overflow-x:hidden}\na{color:inherit;text-decoration:none}\nh1,h2,h3,h4,p,figure{margin:0}\nbutton,a,input,select,textarea{touch-action:manipulation}\n:focus-visible{outline:2px solid var(--foreground);outline-offset:2px;border-radius:5px}\n[id]{scroll-margin-top:88px}\n.wrap{max-width:var(--wrap);margin:0 auto;padding:0 28px}\n.skip{position:absolute;left:-9999px;background:var(--foreground);color:var(--background);\n      padding:10px 14px;z-index:var(--z-skip);border-radius:8px}\n.skip:focus{left:12px;top:12px}\n.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}\n\n/* Every image carries the same inset hairline; never a tinted neutral. */\nimg{outline:1px solid var(--img-outline);outline-offset:-1px}\n\n/* ─── Shared chrome ─────────────────────────────────────────────────────── */\n.nav{border-bottom:var(--hairline) solid var(--border);background:var(--background);\n     position:sticky;top:0;z-index:var(--z-sticky)}\n.nav .wrap{display:flex;align-items:center;gap:22px;min-height:58px;flex-wrap:wrap}\n.brand{font-weight:var(--w-semi);letter-spacing:-.02em;font-size:16px;margin-right:auto}\n.navlinks{display:flex;gap:20px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}\n.navlinks a{transition-property:color;transition-duration:var(--t-out);transition-timing-function:var(--e-out);\n            display:inline-flex;align-items:center;min-height:44px}\n@media (hover:hover) and (pointer:fine){ .navlinks a:hover{color:var(--foreground)} }\n\nh1{font-size:clamp(30px,4.6vw,46px);line-height:1.08;letter-spacing:-.035em;\n   font-weight:var(--w-semi);text-wrap:balance}\nh2{font-size:23px;line-height:1.25;letter-spacing:-.025em;font-weight:var(--w-semi);text-wrap:balance}\n.dek{color:var(--muted);font-size:16.5px;max-width:62ch;margin-top:14px;text-wrap:pretty}\n.sec{padding-block:52px;border-top:var(--hairline) solid var(--border)}\n.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;flex-wrap:wrap}\n.eyebrow{font:var(--w-semi) 11px/1.5 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;\n         color:var(--faint);margin-bottom:10px}\n\n/* Controls */\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;\n     min-height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--border);\n     background:var(--card);color:var(--foreground);font:inherit;font-size:13.5px;\n     cursor:pointer;position:relative;\n     transition-property:background-color,border-color,color;\n     transition-duration:var(--t-out);transition-timing-function:var(--e-out)}\n/* Small controls keep a 44px hit area without growing visually. */\n.btn::after{content:\"\";position:absolute;inset:-4px}\n.btn:active{transform:scale(.96)}\n@media (hover:hover) and (pointer:fine){ .btn:hover{border-color:var(--border-strong)} }\n.btn.pri{background:var(--foreground);color:var(--background);border-color:var(--foreground)}\n.btn[data-copied]{color:var(--ok)}\n.btn.pri[data-copied]{background:var(--ok);border-color:var(--ok);color:var(--ok-fg)}\n\n.search{display:flex;gap:8px;align-items:center;border:1px solid var(--border);\n        border-radius:14px;padding:7px;background:var(--card);max-width:620px}\n.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--foreground);\n              font:16px var(--font-sans);padding:9px 11px;outline:none}\n@media (min-width:768px){ .search input{font-size:15px} }\n.search input::placeholder{color:var(--faint)}\n\n.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 11px;\n      border-radius:999px;border:1px solid var(--border);background:var(--card);\n      color:var(--muted);font:inherit;font-size:13px;cursor:pointer;position:relative;\n      transition-property:background-color,border-color,color;\n      transition-duration:var(--t-out);transition-timing-function:var(--e-out)}\n.chip::after{content:\"\";position:absolute;inset:-5px}\n.chip:active{transform:scale(.96)}\n@media (hover:hover) and (pointer:fine){ .chip:hover{color:var(--foreground);border-color:var(--border-strong)} }\n.chip[aria-pressed=\"true\"]{background:var(--foreground);color:var(--background);border-color:var(--foreground)}\n.chip small{font:11px/1 var(--font-mono);font-variant-numeric:tabular-nums;opacity:.75}\n\n.meta{font:11.5px/1.6 var(--font-mono);color:var(--faint);\n      font-variant-numeric:tabular-nums;display:flex;gap:10px;flex-wrap:wrap;align-items:center}\n.meta b{font-weight:var(--w-medium);color:var(--muted)}\n.kbd{font:10px/1 var(--font-mono);border:1px solid var(--border);border-radius:4px;\n     padding:3px 4px;color:var(--faint)}\n\n/* Empty state — sized like the filled state so nothing jumps. */\n.empty{border:1px dashed var(--border-strong);border-radius:var(--r);padding:44px 28px;\n       text-align:center;min-height:220px;display:flex;flex-direction:column;\n       align-items:center;justify-content:center;gap:10px}\n.empty b{font-size:16px;font-weight:var(--w-semi)}\n.empty p{color:var(--muted);font-size:14px;max-width:44ch;text-wrap:pretty}\n\n/* Images / Videos — the first fork, two tiles at half a row each. Flex, not a\n   fixed 2-col grid: with exactly two items this never shows a hole, but it\n   uses the same mechanism as .tiles below so the technique is one thing, not\n   two, across the page. */\n.cat{display:flex;flex-wrap:wrap;gap:16px}\n.cat .tile{flex:1 1 320px}\n.cta{padding-block:60px 66px;border-top:var(--hairline) solid var(--border);text-align:center}\n.cta h2{font-size:clamp(26px,3.4vw,34px);letter-spacing:-.03em}\n.cta p{color:var(--muted);margin:10px auto 20px;max-width:46ch;text-wrap:pretty}\n\n/* Shared browse bands + creators (the crawl surface, identical in all five).\n   A fixed 4-col grid leaves a hole whenever a band's item count isn't a\n   multiple of the column count (7 tasks, 6 styles → a lone short row) — real\n   categories, not filler, so the count can't be padded away. Flex-wrap with\n   flex-grow instead: each tile has the same basis, so rows still read as a\n   grid at any width, but flex-grow distributes the leftover space among\n   whatever tiles land in the final row — including a row of one — so the row\n   always fills edge to edge. No column count is fixed anywhere, so this holds\n   at every breakpoint without extra media queries. */\n.tiles{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}\n.tiles .tile{flex:1 1 250px}\n.tile{border:1px solid var(--border);border-radius:var(--r);background:var(--card);\n      overflow:hidden;display:flex;flex-direction:column;\n      transition-property:border-color;transition-duration:var(--t-out);transition-timing-function:var(--e-out)}\n@media (hover:hover) and (pointer:fine){ .tile:hover{border-color:var(--border-strong)} }\n.tile .th{flex:none;display:block;width:100%;aspect-ratio:16/10;background:var(--surface);overflow:hidden}\n.tile .th img{width:100%;height:100%;object-fit:cover;display:block}\n/* Inner radius = outer − padding, so the corner gap stays even. */\n.tile .tb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px}\n.tile h3{font-size:15px;font-weight:var(--w-semi);letter-spacing:-.01em;line-height:1.3}\n.tile p{font:11.5px/1.5 var(--font-mono);color:var(--faint);font-variant-numeric:tabular-nums}\n.people{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}\n.person{border:1px solid var(--border);border-radius:var(--r);background:var(--card);\n        padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;\n        transition-property:border-color;transition-duration:var(--t-out);transition-timing-function:var(--e-out)}\n@media (hover:hover) and (pointer:fine){ .person:hover{border-color:var(--border-strong)} }\n.person .av{width:34px;height:34px;border-radius:50%;background:var(--surface);overflow:hidden;flex:none}\n.person .av img{width:100%;height:100%;object-fit:cover;display:block;outline:none}\n.person b{font-size:14.5px;font-weight:var(--w-semi)}\n.person span{font:11px/1.5 var(--font-mono);color:var(--faint);font-variant-numeric:tabular-nums}\n\nfooter.foot{border-top:var(--hairline) solid var(--border);padding-block:34px 26px;margin-top:8px}\n.footnav{display:grid;gap:26px 20px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));\n         margin-bottom:28px}\n.footnav h3{font:var(--w-semi) 10.5px/1.5 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;\n            color:var(--faint);margin:0 0 9px}\n.footnav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}\n.footnav a{color:var(--muted);font-size:13px;display:flex;align-items:center;min-height:40px;\n           transition-property:color;transition-duration:var(--t-out);transition-timing-function:var(--e-out)}\n@media (hover:hover) and (pointer:fine){ .footnav a:hover{color:var(--foreground);text-decoration:underline;\n  text-decoration-thickness:from-font;text-underline-offset:2px} }\n.footlegal{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;\n           padding-top:16px;border-top:var(--hairline) solid var(--border);\n           font:11.5px/1.6 var(--font-mono);color:var(--faint)}\n\n/* The nav wraps to two rows on a phone, so a bar pinned at 58px would sit on\n   top of it. Below the wrap point nothing is sticky but the bars themselves. */\n@media (max-width:700px){ .nav{position:static} }\n/* .tiles and .cat reflow on their own via flex-basis; only .people (which\n   stayed a fixed grid — every band it renders is a multiple of 4) still\n   needs explicit column steps. */\n@media (max-width:900px){ .people{grid-template-columns:repeat(2,1fr)} }\n@media (max-width:560px){ .people{grid-template-columns:1fr} }\n\n\n/* ══ SCREEN ONE · frozen, shared by all five ═══════════════════════════\n   Linear's /method is the one page that leaves the system: serif, 128px,\n   weight 400, line-height 1.0, tracking NORMAL (the only page on the whole\n   surveyed site that opts out of negative tracking), centred, on a 410px\n   measure — far below the 624px prose token. The lesson the survey draws\n   is not \"add a serif\": it is that the system reserves one face and one\n   page for the argument about beliefs rather than features, and spends\n   nothing else on it.\n\n   This block is lifted verbatim from proto-l1-system.html's V2 and is\n   IDENTICAL for every variant in this file. Every variant root carries\n   `.vme`, so there is exactly one copy of these rules and no way for a\n   direction to drift the argument. The exploration begins at `.vme .after`. */\n.vme .argument{padding-block:112px 96px;text-align:center}\n.vme .argument h1{font-family:var(--font-serif);font-size:clamp(46px,9vw,128px);\n  font-weight:400;line-height:1;letter-spacing:normal;text-wrap:balance;\n  max-width:14ch;margin:0 auto}\n.vme .argument .body{max-width:410px;margin:38px auto 0;text-align:left}\n.vme .argument .body p{font-size:17px;line-height:1.6;letter-spacing:normal;\n  color:var(--muted);text-wrap:pretty}\n.vme .argument .body p + p{margin-top:1.6em}\n.vme .argument .body em{font-family:var(--font-serif);font-style:italic;\n  color:var(--foreground)}\n.vme .argument .sig{margin:38px auto 0;max-width:410px;text-align:left;\n  font:11.5px/1.6 var(--font-mono);color:var(--faint)}\n@media (max-width:700px){ .vme .argument{padding-block:64px 56px} }\n\n/* ══ SCREEN TWO · the shared scaffold every direction inherits ═════════\n   The hairline that ends the manifesto, the lede that introduces the\n   library, the search field and the facet row. The search input and the\n   chips live OUTSIDE [data-results] on purpose: a debounced keystroke that\n   rebuilt the element under the caret would drop focus mid-word. */\n.vme .after{border-top:1px solid var(--border)}\n.vme .lede{padding-block:56px 26px}\n.vme .lede .formnote{color:var(--muted);font-size:15.5px;margin-top:12px;\n  max-width:56ch;text-wrap:pretty}\n.vme .count{margin-bottom:0;padding-block:18px 4px}\n/* Placeholders are the record's, not ours — marked, never rewritten. */\n.vme mark{background:color-mix(in srgb, var(--foreground) 10%, transparent);\n  color:var(--foreground);padding:.05em .28em;border-radius:3px;font-style:normal}\n/* The one figure fallback, shared: 1 of the 35 records has no media at all\n   and 4 more carry frames that may fail to load. A tinted grey box would\n   read as a broken image, so the slot says what it is, in the caption face,\n   and takes the same inset hairline every real <img> gets. */\n.vme .noimg{display:flex;align-items:center;justify-content:center;text-align:center;\n  width:100%;height:100%;border-radius:inherit;\n  background:var(--surface);color:var(--faint);font:10.5px/1.4 var(--font-mono);\n  padding:8px;outline:1px solid var(--img-outline);outline-offset:-1px}\n\n/* ══ V1 · Index — the compact rank list, refined ════════════════════════\n   The honest control: the row list the page ships today, with the type\n   sizes and the row rhythm taken up to where they should have been. The\n   axis is SCAN RATE — how many titles fit in a screen — and it is the only\n   direction that optimises for it. Everything the other four add, they add\n   by spending vertical space this one keeps. */\n.m-index .rows{border-top:1px solid var(--border)}\n.m-index .row{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:22px;\n  align-items:center;padding-block:16px;min-height:84px;\n  border-bottom:1px solid var(--border)}\n.m-index .row .th{display:block;width:60px;height:60px;border-radius:5px;\n  overflow:hidden;background:var(--surface)}\n.m-index .row .th img{width:100%;height:100%;object-fit:cover;display:block}\n.m-index .row h3{font-size:16.5px;font-weight:var(--w-medium);line-height:1.35;\n  letter-spacing:-.012em;text-wrap:pretty}\n.m-index .row .meta{margin-top:5px}\n.m-index .row .act{justify-self:end}\n@media (max-width:700px){\n  .m-index .row{grid-template-columns:52px minmax(0,1fr);gap:14px;padding-block:14px}\n  .m-index .row .th{width:52px;height:52px}\n  .m-index .row .act{grid-column:2;justify-self:start;margin-top:10px}\n}\n\n/* ══ V2 · Plates — one record per full-width band ═══════════════════════\n   The axis is EVIDENCE FIRST at plate scale. A prompt is a set of\n   instructions whose only proof is the picture, and a 52px thumbnail is\n   too small to be proof of anything. So: three or four records per screen,\n   the result printed large, the instruction set beside it at reading size,\n   and the extra frames of a multi-frame record shown as a strip rather\n   than hidden behind a count. */\n.m-plates .plates{border-top:1px solid var(--border)}\n.m-plates .plate{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);\n  gap:44px;align-items:start;padding-block:46px;border-bottom:1px solid var(--border)}\n.m-plates .sheet{border-radius:8px;overflow:hidden;background:var(--surface);\n  aspect-ratio:4/3;max-height:420px}\n.m-plates .sheet img{width:100%;height:100%;object-fit:cover;display:block}\n\n.m-plates .strip{display:flex;gap:6px;margin-top:8px}\n.m-plates .strip span{flex:1 1 0;aspect-ratio:1;border-radius:4px;overflow:hidden;\n  background:var(--surface);max-width:78px}\n.m-plates .strip img{width:100%;height:100%;object-fit:cover;display:block}\n.m-plates .body h3{font-size:clamp(21px,2.1vw,28px);font-weight:var(--w-medium);\n  line-height:1.16;letter-spacing:-.02em;text-wrap:balance}\n.m-plates .body .txt{margin-top:16px;font-size:15px;line-height:1.68;\n  color:var(--muted);max-width:58ch;text-wrap:pretty;overflow-wrap:anywhere;\n  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:8;overflow:hidden}\n.m-plates [data-open] .txt{-webkit-line-clamp:none;display:block;overflow:visible}\n.m-plates .body .meta{margin-top:18px}\n.m-plates .body .acts{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}\n@media (max-width:860px){\n  .m-plates .plate{grid-template-columns:1fr;gap:22px;padding-block:34px}\n  .m-plates .sheet{max-height:320px}\n}\n\n/* ══ V3 · Quotations — the prompt text as the object ════════════════════\n   The axis is REGISTER: the second screen stays in the voice of the first\n   instead of switching to a product listing. The manifesto's own claim is\n   that the whole of the work is NOT editing, so the library sets each\n   record the way a book sets a quotation — the words at reading size in\n   the serif, the attribution under them, and the picture demoted to a\n   small keyed print in the margin. The picture is the evidence; the words\n   are the object.\n   The 11 raw-JSON prompts are not prose and must not be dressed as prose:\n   they keep the mono face inside the same slot. Setting `{\"style\":…}` in\n   Georgia italic would be a lie about what the record is. */\n.m-quotes .quotes{border-top:1px solid var(--border);\n  max-width:794px;margin-inline:auto}\n.m-quotes .count{max-width:794px;margin-inline:auto}\n.m-quotes .q{display:grid;grid-template-columns:132px minmax(0,1fr);gap:38px;\n  align-items:start;padding-block:50px;border-bottom:1px solid var(--border)}\n.m-quotes .print .fig{display:block;width:132px;aspect-ratio:1;border-radius:4px;\n  overflow:hidden;background:var(--surface)}\n.m-quotes .print .fig img{width:100%;height:100%;object-fit:cover;display:block}\n.m-quotes .print .key{margin-top:9px;font:11px/1.55 var(--font-mono);color:var(--faint);\n  font-variant-numeric:tabular-nums;letter-spacing:.04em}\n.m-quotes blockquote{margin:0;max-width:var(--w-prose);font-family:var(--font-serif);\n  font-size:clamp(18px,1.55vw,21px);line-height:1.58;letter-spacing:normal;\n  color:var(--foreground);text-wrap:pretty}\n.m-quotes blockquote.raw{font-family:var(--font-mono);font-size:13px;line-height:1.75;\n  color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;max-width:74ch}\n/* Prompts run 303–4,989 characters and a 4,989-character quotation at 21px\n   is a wall, so a long record shows an excerpt until you open it. NOT with\n   -webkit-line-clamp: clamping cuts the closing quotation mark off with the\n   overflow and leaves every long quote unclosed. Two strings — an excerpt\n   that punctuates itself, and the whole thing — swapped by the disclosure.\n   Neither is a rewrite; both are the author's words. */\n.m-quotes .qs{display:block}\n.m-quotes .qf{display:none}\n.m-quotes [data-open] .qs{display:none}\n.m-quotes [data-open] .qf{display:block}\n.m-quotes .q footer{margin-top:22px;max-width:var(--w-prose)}\n.m-quotes .q footer h3{font-family:var(--font-serif);font-size:17px;font-weight:400;\n  line-height:1.35;letter-spacing:normal;color:var(--muted)}\n.m-quotes .q footer .meta{margin-top:8px}\n.m-quotes .q footer .acts{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}\n@media (max-width:760px){\n  .m-quotes .q{grid-template-columns:1fr;gap:20px;padding-block:36px}\n  .m-quotes .print .fig{width:104px}\n}\n\n/* ══ V4 · Catalogue — the catalogue raisonné ════════════════════════════\n   The axis is the FIXED ACCESSION NUMBER. Every other direction renumbers\n   itself when you filter; a catalogue does not. № 014 is № 014 whatever\n   else is on screen, so the gaps a filter leaves in the sequence are\n   themselves the readout — you can see how much of the library you have\n   excluded without reading a count. Serif titles, a standfirst taken from\n   the prompt's own opening clause (never a written summary), thumbnails\n   parked in one consistent margin column, and leading set well above the\n   list's. Slower than V1 by design; the unit is an entry, not a row. */\n.m-cat .entries{border-top:1px solid var(--border)}\n.m-cat .ent{display:grid;grid-template-columns:66px 108px minmax(0,1fr) auto;\n  gap:26px;align-items:start;padding-block:28px;\n  border-bottom:1px solid var(--border)}\n.m-cat .num{font:var(--w-medium) 12px/2.1 var(--font-mono);color:var(--faint);\n  letter-spacing:.09em;font-variant-numeric:tabular-nums;white-space:nowrap}\n.m-cat .fig{display:block;width:108px;aspect-ratio:4/3;border-radius:4px;\n  overflow:hidden;background:var(--surface)}\n.m-cat .fig img{width:100%;height:100%;object-fit:cover;display:block}\n.m-cat h3{font-family:var(--font-serif);font-size:21px;font-weight:400;\n  line-height:1.28;letter-spacing:normal;text-wrap:balance}\n.m-cat .stand{margin-top:10px;font-size:15px;line-height:1.72;color:var(--muted);\n  max-width:62ch;text-wrap:pretty;overflow-wrap:anywhere}\n.m-cat .ent .meta{margin-top:12px}\n.m-cat .act{justify-self:end}\n@media (max-width:860px){\n  .m-cat .ent{grid-template-columns:56px 84px minmax(0,1fr);gap:16px;padding-block:22px}\n  .m-cat .fig{width:84px}\n  .m-cat .act{grid-column:3;justify-self:start;margin-top:12px}\n}\n@media (max-width:520px){\n  .m-cat .ent{grid-template-columns:52px minmax(0,1fr)}\n  .m-cat .fig{grid-column:2;width:84px;order:2;margin-top:12px}\n  .m-cat .act{grid-column:2}\n}\n\n/* ══ V5 · Continuous — no units at all ══════════════════════════════════\n   The axis is DISSOLVING THE UNIT. The complaint that started this round\n   was that small cards are hard to read; the most extreme answer is to\n   stop drawing cards, rows, plates or entries and set the entire library\n   as one justified serif paragraph in which every title is a link. What\n   you read is a sentence, not a grid. Selecting a title does not navigate\n   — the entry opens in place and splits the paragraph around it, the way\n   a note expands into the page it belongs to.\n   Leading is doing the tap-target work. A <button> is inline-block, so its\n   box takes the paragraph's own line-height rather than the font's content\n   height: measured 50.4px tall at the 21px/2.4 ceiling and 45.6px at the\n   19px floor, both over the 44px floor, and both exactly equal to the line\n   spacing — so adjacent rows touch and never overlap. An ::after extension\n   was written first, measured, and removed: it made every target 73px tall\n   and every pair of adjacent lines overlap by 22px. */\n.m-run .runbox{padding-block:10px 56px}\n.m-run .run{font-family:var(--font-serif);font-size:clamp(19px,1.6vw,21px);\n  line-height:2.4;letter-spacing:normal;text-align:justify;hyphens:auto;\n  color:var(--faint);text-wrap:normal}\n.m-run .item{position:relative}\n.m-run .t{position:relative;border:0;background:none;padding:0;margin:0;font:inherit;\n  color:var(--foreground);cursor:pointer;text-align:left}\n/* The separator is generated INSIDE the button, after a non-breaking space,\n   for one reason: as a separate element it could wrap to the next line and\n   open it with a stranded \"·\". It is glued to the title it follows and can\n   never lead a line. The underline sits on an inner span so it stops at the\n   title and does not run under the separator.\n   Titles keep wrapping internally on purpose: justification needs break\n   opportunities, and welding whole titles together instead produced two or\n   three per line and rivers of white a hand's width across. */\n.m-run .u{border-bottom:1px solid var(--border-strong);\n  transition-property:border-color;transition-duration:var(--t-out);\n  transition-timing-function:var(--e-out)}\n.m-run .t::after{content:\"\\00a0·\";color:var(--faint)}\n.m-run .run > .item:last-child .t::after{content:\"\"}\n@media (hover:hover) and (pointer:fine){\n  .m-run .t:hover .u{border-bottom-color:var(--foreground)}\n}\n.m-run .t:active{transform:scale(.98)}\n.m-run .exp{display:none}\n.m-run .item[data-open]{display:block;margin-block:30px;padding-block:26px;\n  border-block:1px solid var(--border);text-align:left}\n.m-run .item[data-open] .t::after{content:\"\"}\n.m-run .item[data-open] .u{border-bottom-color:var(--foreground)}\n.m-run .item[data-open] .exp{display:grid;grid-template-columns:220px minmax(0,1fr);\n  gap:28px;align-items:start;margin-top:18px;font-family:var(--font-sans);\n  font-size:15px;line-height:1.68;color:var(--muted)}\n.m-run .exp .fig{display:block;border-radius:6px;overflow:hidden;\n  background:var(--surface);aspect-ratio:1}\n.m-run .exp .fig img{width:100%;height:100%;object-fit:cover;display:block}\n.m-run .exp .txt{display:block;max-width:60ch;text-wrap:pretty;overflow-wrap:anywhere}\n.m-run .exp .meta{margin-top:14px}\n.m-run .exp .acts{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}\n@media (max-width:760px){\n  .m-run .item[data-open] .exp{grid-template-columns:1fr;gap:16px}\n  .m-run .exp .fig{max-width:220px}\n}\n</style>\n\n\n\n<style id=\"linear-dark-theme\">\n/* ─────────────────────────────────────────────────────────────────────────\n   Linear-derived dark theme for the prototype pickers.\n\n   Values come from the token snapshot at\n   `specs/images/linear-design-tokens.css` (Linear public-site CSS, snapshot\n   2026-09-03), not from memory. This is a COLOUR re-theme only: type and\n   geometry stay on the project's own system, because `frontend/AGENTS.md` §7.6\n   has not ruled on a web font and Linear's faces (Inter Variable, Berkeley\n   Mono, Tiempos Headline) are not licensed here. Weights stay 400/600.\n\n   The four pickers were written at different times and use three different\n   token vocabularies (`--background`/`--bg`, `--foreground`/`--fg`,\n   `--muted`/`--muted-fg`, `--faint`/`--faint-fg`, `--font-sans`/`--sans`).\n   Every unambiguous alias is set, so one block themes all four — see the\n   note on `--muted` below for the one token deliberately skipped.\n\n   Contrast, measured against the canvas ladder (WCAG 2, sRGB):\n\n     token                 #08090a  #0f1011  #141516  #191a1b\n     --foreground #f7f8f8    18.73    17.90    17.18    16.38\n     --muted-fg   #d0d6e0    13.64    13.04    12.52    11.93\n     --faint      #8a8f98     6.13     5.86     5.63     5.36\n     --accent     #7170ff     5.18     4.96     4.76     4.53\n     --ok         #4cc38a     9.00     8.60     8.25     7.87\n     white on brand fill #5e6ad2 …………………………………………………… 4.70\n\n   Three deliberate departures from Linear's own dark tokens, each because a\n   token Linear uses decoratively is used here as text:\n\n   1. `--faint` takes Linear's TERTIARY ink `#8a8f98`, not its quaternary\n      `#62666d`. Quaternary measures 3.45:1 — below the 4.5:1 floor — and this\n      project spends `--faint` on 11px mono captions, which is text.\n   2. `--accent` takes `#7170ff`, NOT the `#5252f5` that `frontend/CLAUDE.md`\n      mandates. That mandate is a LIGHT-mode repair: `#7070ff` fails AA on all\n      four light surfaces (3.30–3.85) and `#5252f5` fixes it. Inverted, the\n      rule inverts too — `#5252f5` measures 3.69:1 on `#08090a` and would be\n      the unreadable one. Same intent, opposite value.\n   3. `--ok` lifts Linear's `#27a644` to `#4cc38a`. Per the `color` skill,\n      brand colours carried into dark at full saturation vibrate; lightness\n      goes up and chroma comes down. It also buys 6.29:1 → 9.00:1 at 11px.\n   ───────────────────────────────────────────────────────────────────────── */\n\n:root[data-theme=\"linear-dark\"] {\n  color-scheme: dark;\n\n  /* Canvas ladder — level-0 is the page, level-1 insets, level-2 cards.\n     Dark mode keeps the layering hierarchy; it is not inverted light mode. */\n  --background: #08090a;  --bg: #08090a;\n  --surface:    #0f1011;\n  --card:       #141516;\n\n  /* Ink */\n  --foreground: #f7f8f8;  --fg: #f7f8f8;\n  /* --muted is deliberately NOT set. It is ink in L1/L4 but a translucent\n     SURFACE wash in L2/L3 (`color-mix(in srgb, var(--fg) 8%, transparent)`,\n     used only for avatar and media placeholders). Forcing one ink value here\n     painted light-grey boxes onto a near-black canvas in L3. Every file's own\n     definition self-corrects once --fg/--foreground flip and color-scheme is\n     dark, so the token is left alone on purpose. --muted-fg is unambiguous\n     ink and is set. */\n  --muted-fg: #d0d6e0;\n  --faint:      #8a8f98;  --faint-fg: #8a8f98;\n\n  /* Lines. Linear's dark borders are solid, not alpha-white — a translucent\n     white hairline glows on near-black instead of receding. */\n  --border:        #23252a;\n  --border-strong: #34343a;\n\n  /* Interaction. Indigo carries interaction semantics only: focus, links,\n     ::selection, and the single primary action per view. */\n  --accent:    #7170ff;\n  --accent-bg: #1b1c33;\n\n  /* The inverted button: Linear's own --color-button-invert-bg. */\n  --primary:    #e5e5e6;\n  --primary-fg: #08090a;\n\n  /* Status */\n  --ok:   #4cc38a;\n  --cand: #f0bf00;\n\n  /* L4's placeholder highlight, on Linear's orange */\n  --var-bg: #2a1a12;\n  --var-fg: #fc9a6e;\n}\n\n/* The prototypes gate their dark-mode image outline on `prefers-color-scheme`,\n   which does not fire when the theme is forced by attribute. A tinted outline\n   picks up the surface behind it and reads as grime, so it must be pure white. */\n:root[data-theme=\"linear-dark\"] img { outline-color: rgb(255 255 255 / .1); }\n\n/* Selection carries the brand quietly and stays legible. */\n:root[data-theme=\"linear-dark\"] ::selection {\n  background: color-mix(in oklab, #5e6ad2, black 10%);\n  color: #fff;\n}\n\n/* Depth: on dark, a stacked shadow is invisible, so every elevation collapses\n   to a single low-opacity white ring. */\n:root[data-theme=\"linear-dark\"] [data-elevated] {\n  box-shadow: 0 0 0 1px rgb(255 255 255 / .09);\n}\n</style>\n\n\n<style>\n/* ─── Theme toggle · harness chrome, not design ─────────────────────────── */\n.theme-toggle{\n  position:fixed;bottom:24px;right:24px;z-index:2147483647;\n  display:flex;align-items:center;gap:6px;height:28px;padding:0 12px;\n  border:0;border-radius:999px;background:rgba(10,10,10,0.82);\n  -webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);\n  box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset,0 8px 24px rgba(0,0,0,0.24),0 2px 6px rgba(0,0,0,0.12);\n  font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif;\n  font-size:13px;line-height:1;color:rgba(255,255,255,0.7);\n  cursor:pointer;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;\n  transition:color 150ms ease-out}\n.theme-toggle:hover{color:rgba(255,255,255,0.95)}\n.theme-toggle:active{transform:scale(0.97)}\n.theme-toggle:focus-visible{outline:2px solid rgba(255,255,255,0.4);outline-offset:2px}\n.theme-toggle[aria-pressed=\"true\"]{color:#fff}\n/* Below ~700px the picker's five items span edge to edge (PICKER.md gives it\n   no responsive width of its own), so a fixed bottom-right corner is no\n   longer clear of it — measured overlap at 375px, the toggle sat on top of\n   the rightmost items. The nav also drops its own sticky position at\n   this width (see .nav rule above), leaving the top-right corner open. */\n@media (max-width:700px){\n  .theme-toggle{ bottom:auto; top:14px; right:14px; }\n}\n</style>\n\n<a class=\"skip\" href=\"#main\">Skip to content</a>\n<div id=\"stage\"></div>\n\n\n\n<script>\nconst DATA = [{\"id\": \"2073529429838696592\", \"slug\": \"concept-scroll-read-this-brief-script-the-sc-2073529429838696592\", \"title\": \"Scroll-scripted site build, shot by shot\", \"prompt\": \"concept + scroll: \\\"read this brief, script the scroll - what the visitor feels at second 3, 15, 40. scaffold the site with GSAP ScrollTrigger + Lenis.\\\" motion assets: \\\"generate the hero sting and one b-roll clip per section from the story. 3–5s, high-res.\\\" pol
