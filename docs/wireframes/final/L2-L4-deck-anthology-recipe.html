 \"title\": \"Convenience-store student, mint polo\", \"prompt\": \"Japanese girl with long straight black hair and soft wispy bangs, wearing a mint green polo shirt and a blue plaid skirt, standing casually in front of a convenience store refrigerator filled with colorful drinks. Holding an open book in one hand, relaxed posture, soft natural expression, everyday student vibe. Bright fluorescent store lighting, realistic reflections on the refrigerator doors, visible drink labels, convenience store interior, candid moment during a normal day. Captured with a smartphone camera, handheld iPhone photo, slight softness, natural colors, authentic mobile HDR processing, realistic skin texture, casual social media snapshot, unedited phone-camera look, ordinary convenience store atmosphere, slightly imperfect framing, no professional posing, no studio lighting, no cinematic color grading, photorealistic, high-quality mobile photography, everyday lifestyle aesthetic, spontaneous and natural.\", \"models\": [\"GPT Image 2\"], \"uses\": [\"Food & beverage\"], \"styles\": [\"Cinematic\", \"Photorealistic\"], \"techs\": [\"Camera movement / shot language\"], \"subjects\": [\"Architecture / interior\", \"Person / portrait\"], \"kind\": \"image\", \"img\": \"https://pbs.twimg.com/media/HLTxa8GWAAAPS-S.jpg?name=small\", \"imgs\": [\"https://pbs.twimg.com/media/HLTxa8GWAAAPS-S.jpg?name=small\"], \"n\": 1, \"dur\": null, \"handle\": \"@saniaspeaks_\", \"likes\": 278, \"saves\": 156, \"hv\": true, \"score\": 0}];\nconst AVATARS = {\"PrometheanAIX\": \"https://pbs.twimg.com/profile_images/2043694345749196800/vsv-cxdT_400x400.jpg\", \"higgsfield_ai\": \"https://pbs.twimg.com/profile_images/1906739239183630336/907a7JTU_400x400.jpg\", \"KeorUnreal\": \"https://pbs.twimg.com/profile_images/2038274199379443712/HGEFaPvT_400x400.jpg\", \"ManuAGI01\": \"https://pbs.twimg.com/profile_images/1792389743503929344/5NAkgng7_400x400.jpg\", \"CHAO2U_AI\": \"https://pbs.twimg.com/profile_images/2018484655750840320/6ZfNMPHb_400x400.jpg\", \"IqrasaifiAI\": \"https://pbs.twimg.com/profile_images/2070883209731248128/BZnJwoPG_400x400.jpg\", \"ChillaiKalan__\": \"https://pbs.twimg.com/profile_images/2042898125573197824/Em0FFxRw_400x400.jpg\", \"ZaraIrahh\": \"https://pbs.twimg.com/profile_images/1997170504713883651/mr6aPbte_400x400.jpg\", \"Naiknelofar788\": \"https://pbs.twimg.com/profile_images/2014919869259735040/MbBiQ58q_400x400.jpg\", \"PinodiArt\": \"https://pbs.twimg.com/profile_images/2017948625058287616/AUHPq1dP_400x400.jpg\", \"Arminn_Ai\": \"https://pbs.twimg.com/profile_images/1934377885055246336/TPOvBcnQ_400x400.jpg\", \"AIwithSarah_\": \"https://pbs.twimg.com/profile_images/2016454047679832064/qf_DsgPV_400x400.jpg\"};\n\n/* ── helpers ─────────────────────────────────────────────────────────── */\nconst esc = s => String(s == null ? \"\" : s)\n  .replace(/&/g,\"&amp;\").replace(/</g,\"&lt;\").replace(/>/g,\"&gt;\").replace(/\"/g,\"&quot;\");\nconst n = v => v == null ? \"—\" : v.toLocaleString(\"en-US\");\nconst AXES = { models:\"Model\", uses:\"Task\", styles:\"Style\", techs:\"Technique\" };\n\n/* The matrix has to be able to select \"the records this axis does not\n   describe\" — 3 records name no model, 9 name no task. That is a real cell\n   on the plate and the most interesting one, so it needs a filter value.\n   A sentinel string keeps matches() one function instead of two. Asserted\n   against the data at load: no model, task, style or technique is __none__. */\nconst NONE = \"__none__\";\n\nconst asList = (r, key) => Array.isArray(r[key]) ? r[key] : (r[key] == null ? [] : [r[key]]);\nconsole.assert(!DATA.some(r => [\"models\",\"uses\",\"styles\",\"techs\"].some(k => asList(r,k).includes(NONE))),\n  \"sentinel collides with a real taxonomy value\");\nfunction counts(key){\n  const m = new Map();\n  DATA.forEach(r => asList(r, key).forEach(v => m.set(v, (m.get(v)||0)+1)));\n  return [...m].sort((a,b) => b[1]-a[1]);\n}\nconst noneCount = key => DATA.filter(r => !asList(r, key).length).length;\n/* One excerpt rule for every direction: the prompt's own first words, never a\n   written summary. Raw-JSON prompts get excerpted the same way as prose. */\nfunction excerpt(r, len){\n  const s = r.prompt.replace(/\\s+/g,\" \").trim();\n  return s.length > len ? s.slice(0, len).replace(/\\s\\S*$/,\"\") + \"…\" : s;\n}\n/* Placeholders are marked structurally, on the ALREADY-ESCAPED string —\n   neither brackets nor capitals are touched by escaping, so the offsets hold. */\nconst markPlaceholders = html => html.replace(/\\[[A-Z][A-Z \\-_\\/]{2,}\\]/g, m => `<mark>${m}</mark>`);\n\n/* Filter state is shared across variants on purpose: flipping between\n   directions keeps your query, so you compare the same result set. */\nconst state = { q:\"\", active:{models:[],uses:[],styles:[],techs:[],kind:[]}, sel:0 };\n\nfunction matches(r){\n  for (const k in state.active){\n    const on = state.active[k];\n    if (!on.length) continue;\n    const has = on.some(v => v === NONE ? asList(r, k).length === 0 : asList(r, k).includes(v));\n    if (!has) return false;\n  }\n  if (state.q){\n    const q = state.q.toLowerCase();\n    const hay = (r.title+\" \"+r.prompt+\" \"+r.models.join(\" \")+\" \"+r.uses.join(\" \")+\" \"+\n                 r.styles.join(\" \")+\" \"+r.techs.join(\" \")+\" \"+(r.handle||\"\")).toLowerCase();\n    if (!hay.includes(q)) return false;\n  }\n  return true;\n}\nconst results = () => DATA.filter(matches);\nconst activeRec = () => { const r = results(); return r.length ? r[Math.min(state.sel, r.length-1)] : null; };\n\nfunction emptyState(){\n  return `<div class=\"empty\">\n    <b>No prompt matches that yet</b>\n    <p>The library has ${DATA.length} prompts. Clear the filters to see all of them, or search for a model name like Seedance.</p>\n    <button class=\"btn pri\" data-clear type=\"button\">Clear filters</button>\n  </div>`;\n}\n\n/* ── shared chrome ───────────────────────────────────────────────────── */\nfunction nav(){\n  return `<nav class=\"nav\"><div class=\"wrap\">\n    <span class=\"brand\">Prompt Library</span>\n    <span class=\"navlinks\">\n      <a href=\"#tasks\">Tasks</a><a href=\"#models\">Models</a>\n      <a href=\"#styles\">Styles</a><a href=\"#creators\">Creators</a>\n    </span>\n  </div></nav>`;\n}\n\n/* The facet row, identical wherever it appears; only the container changes. */\nfunction chipRow(perAxis){\n  return Object.keys(AXES).flatMap(key =>\n    counts(key).slice(0, perAxis).map(([v,c]) =>\n      `<button class=\"chip\" type=\"button\" data-facet=\"${key}\" data-value=\"${esc(v)}\"\n        aria-pressed=\"${state.active[key].includes(v)}\">${esc(v)} <small>${c}</small></button>`)).join(\"\");\n}\n\n/* One representative frame per tile, no picture used twice — a repeat would\n   imply two different sets share a result. */\nfunction repFrames(key){\n  const used = new Set(), out = new Map();\n  const tiles = counts(key).map(([v,c]) => ({\n    v, c, srcs: DATA.filter(r => asList(r, key).includes(v) && r.img).map(r => r.img)\n  })).sort((a,b) => a.srcs.length - b.srcs.length);\n  tiles.forEach(t => {\n    const pick = t.srcs.find(s => !used.has(s));\n    if (pick){ used.add(pick); out.set(t.v, pick); }\n  });\n  return out;\n}\n\nfunction band(id, heading, key){\n  const frames = repFrames(key);\n  const items = counts(key).filter(([v]) => frames.has(v));\n  return `<section class=\"sec\" id=\"${id}\"><div class=\"wrap\">\n    <div class=\"sec-h\"><h2>${heading}</h2></div>\n    <div class=\"tiles\">${items.map(([v,c]) => `\n      <a class=\"tile\" href=\"#\" data-facet=\"${key}\" data-value=\"${esc(v)}\">\n        <span class=\"th\"><img src=\"${esc(frames.get(v))}\" alt=\"A prompt result from ${esc(v)}\"\n          loading=\"lazy\" referrerpolicy=\"no-referrer\" width=\"320\" height=\"200\"></span>\n        <span class=\"tb\"><h3>${esc(v)}</h3><p>${c} prompts</p></span>\n      </a>`).join(\"\")}</div>\n  </div></section>`;\n}\n\n/* Images / Videos and the closing call to action are settled parts of this\n   page. A direction may re-present the results; it does not get to delete\n   sections the product already decided on. */\nfunction catBand(){\n  const frames = repFrames(\"kind\");\n  const label = { image:\"Images\", video:\"Videos\" };\n  const items = [[\"image\", DATA.filter(r => r.kind === \"image\").length],\n                 [\"video\", DATA.filter(r => r.kind === \"video\").length]];\n  return `<section class=\"sec\" id=\"category\"><div class=\"wrap\">\n    <div class=\"sec-h\"><h2>Browse by category</h2></div>\n    <div class=\"cat\">${items.map(([k,c]) => `\n      <a class=\"tile\" href=\"#\" data-facet=\"kind\" data-value=\"${k}\">\n        <span class=\"th\">${frames.get(k) ? `<img src=\"${esc(frames.get(k))}\"\n          alt=\"A prompt result from ${label[k]}\" loading=\"lazy\" referrerpolicy=\"no-referrer\"\n          width=\"560\" height=\"350\">` : \"\"}</span>\n        <span class=\"tb\"><h3>${label[k]}</h3><p>${c} prompts</p></span>\n      </a>`).join(\"\")}</div>\n  </div></section>`;\n}\nfunction ctaBand(){\n  return `<section class=\"cta\"><div class=\"wrap\">\n    <h2>Take a prompt and start</h2>\n    <p>Free to copy, every one credited to the person who wrote it.</p>\n    <button class=\"btn pri\" type=\"button\" style=\"min-height:44px;padding:0 20px\">Generate in bo</button>\n  </div></section>`;\n}\n\nfunction creators(){\n  const m = new Map();\n  DATA.forEach(r => { if (r.handle) m.set(r.handle, (m.get(r.handle)||0)+1); });\n  const top = [...m].sort((a,b) => b[1]-a[1]).slice(0,8);\n  return `<section class=\"sec\" id=\"creators\"><div class=\"wrap\">\n    <div class=\"sec-h\"><h2>Creators</h2></div>\n    <div class=\"people\">${top.map(([h,c]) => `\n      <a class=\"person\" href=\"https://x.com/${esc(h.replace(\"@\",\"\"))}\" rel=\"noopener nofollow\" target=\"_blank\">\n        <span class=\"av\">${AVATARS[h.replace(\"@\",\"\")]\n          ? `<img src=\"${esc(AVATARS[h.replace(\"@\",\"\")])}\" alt=\"\" loading=\"lazy\"\n               referrerpolicy=\"no-referrer\" width=\"34\" height=\"34\" onerror=\"this.remove()\">` : \"\"}</span>\n        <b>${esc(h)}</b><span>${c} prompts</span>\n      </a>`).join(\"\")}</div>\n  </div></section>`;\n}\n\n/* The footer is the crawl surface. It is identical in all five directions and\n   nothing in the exploration is allowed to shrink it. */\nconst FOOT_COLS = [\n  [\"By model\", [\"Nano Banana Pro\",\"Higgsfield Soul\",\"GPT Image 2\",\"Nano Banana 2\",\n                \"Nano Banana\",\"GPT Image\",\"Kling\",\"Seedance\",\"Veo\",\"Sora\",\"Wan\"]],\n  [\"By task\", [\"Fashion\",\"Beauty\",\"Advertising\",\"Food & beverage\",\"Automotive\",\n               \"Web & motion\",\"UGC\",\"Product marketing\"]],\n  [\"By style\", [\"Photorealistic\",\"Cinematic\",\"Luxury\",\"Anime / illustrated\",\n                \"Retro / vintage\",\"Sci-fi / cyberpunk\",\"Surreal / fantasy\"]],\n  [\"By subject\", [\"Person / portrait\",\"Architecture / interior\",\"Product\",\"Food / drink\",\"Vehicle\"]],\n  [\"Browse\", [\"Image prompts\",\"Video prompts\",\"All prompts\",\"All models\",\"All creators\"]],\n];\nfunction foot(){\n  const cols = FOOT_COLS.map(([t,items]) => `<div><h3>${esc(t)}</h3><ul>${\n    items.map(l => `<li><a href=\"#\">${esc(l)}${t===\"Browse\"?\"\":\" prompts\"}</a></li>`).join(\"\")\n  }</ul></div>`).join(\"\");\n  return `<footer class=\"foot\"><div class=\"wrap\">\n    <div class=\"footnav\">${cols}</div>\n    <div class=\"footlegal\"><span>Prompt Library</span>\n      <span>Prompts remain the property of their authors. Every page credits the source.</span></div>\n  </div></footer>`;\n}\n\n/* Every direction closes with the same crawl surface. */\nfunction tail(){\n  return `${catBand()}\n    ${band(\"tasks\",\"Browse by task\",\"uses\")}\n    ${band(\"models\",\"Browse by model\",\"models\")}\n    ${band(\"styles\",\"Browse by style\",\"styles\")}\n    ${creators()}\n    ${ctaBand()}`;\n}\n\n\n/* ══════════════════════════════════════════════════════════════════════\n   SCREEN ONE — frozen. One string, shared by all five directions, so the\n   argument cannot drift between variants: there is no second copy to edit.\n   Everything from the <nav> through <p class=\"sig\"> is byte-identical in\n   every variant and the verification asserts it.\n   ══════════════════════════════════════════════════════════════════════ */\nconst ARGUMENT = `<section class=\"wrap argument\">\n      <h1>Somebody already wrote this</h1>\n      <div class=\"body\">\n        <p>Every prompt in this library was published in the open by the person who\n          wrote it, and then mostly lost — buried under a feed that is optimised for\n          the next thing rather than the useful thing.</p>\n        <p>So the whole of the work here is <em>not editing</em>. No paraphrase, no\n          house style, no distillation into a template. The text you copy is the text\n          they posted, down to the render settings at the end that look like noise and\n          are not.</p>\n        <p>What we add is the index, the attribution, and a link back. That is the\n          entire product.</p>\n      </div>\n      <p class=\"sig\">${DATA.length} prompts · every one credited · every one links to its source</p>\n    </section>`;\n\n/* The lede is shared too. The only thing that varies between the five is\n   `note` — one line naming the form — and the block under [data-results].\n   Holding the heading constant is the point of the round: the comparison is\n   about what the second movement IS, not about how it is introduced. */\nfunction page(mode, note, body){\n  return `<div class=\"vme m-${mode} taste\" data-mode=\"${mode}\">${nav()}<main id=\"main\">\n    ${ARGUMENT}\n    <div class=\"after\">\n      <section class=\"wrap lede\">\n        <p class=\"eyebrow\" style=\"margin-bottom:14px\">The library</p>\n        <h2 class=\"tier-ref\">Everything, in the order it gets copied</h2>\n        <p class=\"formnote\">${note}</p>\n        <div class=\"search\" style=\"margin-top:24px\">\n          <input id=\"q\" type=\"search\" placeholder=\"Search prompts, models, styles, creators…\"\n            aria-label=\"Search prompts\" value=\"${esc(state.q)}\">\n        </div>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:16px\">${chipRow(4)}</div>\n      </section>\n      <section class=\"wrap\" id=\"results\"><h2 class=\"vh\">All prompts</h2>\n        <div data-results>${body()}</div></section>\n      ${tail()}\n    </div>\n  </main>${foot()}</div>`;\n}\n\n/* ── shared record parts ─────────────────────────────────────────────── */\nconst countLine = () =>\n  `<p class=\"meta count\"><b>${results().length}</b> of ${DATA.length} prompts shown</p>`;\n\n/* One media rule for every direction. 1 of the 35 records has no media and\n   several point at frames that can fail; the slot says so rather than\n   leaving a grey square that reads as a broken image. */\nfunction fig(r, w, h, alt){\n  return r.img\n    ? `<img src=\"${esc(r.img)}\" alt=\"${esc(alt || \"\")}\" loading=\"lazy\"\n         referrerpolicy=\"no-referrer\" width=\"${w}\" height=\"${h}\">`\n    : `<span class=\"noimg\">no image<br>on the source post</span>`;\n}\nconst shot = r => `A result of the prompt “${r.title}”`;\n\n/* Metadata is real or it is absent — 3 records name no model, 9 no task,\n   some carry no like count. Nothing here is invented to fill a slot. */\nfunction metaBits(r){\n  const b = [`<span>${esc(r.handle || \"unattributed\")}</span>`,\n             `<span>${esc(r.models[0] || \"no model named\")}</span>`];\n  if (r.kind === \"video\" && r.dur) b.push(`<span>${r.dur}s video</span>`);\n  else if (r.n > 1) b.push(`<span>${r.n} frames</span>`);\n  if (r.likes != null) b.push(`<span><b>${n(r.likes)}</b> likes</span>`);\n  b.push(`<span>${n(r.prompt.length)} chars</span>`);\n  return b.join(\"\");\n}\n/* 11 of the 35 prompts are raw JSON. They are not prose and must not be set\n   as prose — a serif italic `{\"style\": …}` would be a lie about the record. */\nconst isRaw = r => /^[[{]/.test(r.prompt.trim());\n/* The standfirst is the prompt's OWN opening clause, cut at a sentence\n   boundary where there is one. Never a written summary. */\nfunction standfirst(r){\n  const s = r.prompt.replace(/\\s+/g, \" \").trim();\n  const m = s.match(/^.{40,190}?[.!?](\\s|$)/);\n  return m ? m[0].trim() : excerpt(r, 160);\n}\nconst copyBtn = (r, cls) =>\n  `<button class=\"btn${cls ? \" \" + cls : \"\"}\" type=\"button\" data-copy=\"${r.id}\">Copy prompt</button>`;\n\n/* ══ V1 · Index — the compact rank list, refined ══════════════════════ */\nfunction mIndex(){\n  const rows = results();\n  if (!rows.length) return emptyState();\n  return `${countLine()}<div class=\"rows\">${rows.map(r => `\n    <div class=\"row\" data-rec>\n      <span class=\"th\">${fig(r, 60, 60, \"\")}</span>\n      <span>\n        <h3>${esc(r.title)}</h3>\n        <span class=\"meta\">${metaBits(r)}</span>\n      </span>\n      <span class=\"act\">${copyBtn(r)}</span>\n    </div>`).join(\"\")}</div>`;\n}\n\n/* ══ V2 · Plates — one record per full-width band ═════════════════════ */\nfunction mPlates(){\n  const rows = results();\n  if (!rows.length) return emptyState();\n  return `${countLine()}<div class=\"plates\">${rows.map(r => `\n    <article class=\"plate\" data-rec data-entry>\n      <div>\n        <div class=\"sheet\">${fig(r, 760, 570, shot(r))}</div>\n        ${r.imgs && r.imgs.length > 1 ? `<div class=\"strip\">${r.imgs.slice(1, 5).map(s =>\n          `<span><img src=\"${esc(s)}\" alt=\"\" loading=\"lazy\" referrerpolicy=\"no-referrer\"\n             width=\"78\" height=\"78\"></span>`).join(\"\")}</div>` : \"\"}\n      </div>\n      <div class=\"body\">\n        <h3>${esc(r.title)}</h3>\n        <p class=\"txt\">${markPlaceholders(esc(r.prompt))}</p>\n        <p class=\"meta\">${metaBits(r)}</p>\n        <div class=\"acts\">${copyBtn(r, \"pri\")}${r.prompt.length > 520\n          ? `<button class=\"btn\" type=\"button\" data-expand aria-expanded=\"false\"\n               data-label-open=\"Show less\">Read it all</button>` : \"\"}</div>\n      </div>\n    </article>`).join(\"\")}</div>`;\n}\n\n/* ══ V3 · Quotations — the prompt text as the object ══════════════════ */\nfunction mQuotes(){\n  const rows = results();\n  if (!rows.length) return emptyState();\n  return `${countLine()}<div class=\"quotes\">${rows.map(r => {\n    const raw = isRaw(r);\n    const long = r.prompt.length > 380;\n    /* No whitespace may leak into a .raw blockquote: it renders pre-wrap. */\n    const q = t => raw ? t : \"&ldquo;\" + t + \"&rdquo;\";\n    const full = markPlaceholders(esc(r.prompt.trim()));\n    const shown = `<span class=\"qs\">${q(long ? markPlaceholders(esc(excerpt(r, 340))) : full)}</span>`\n      + (long ? `<span class=\"qf\">${q(full)}</span>` : \"\");\n    const caption = [r.models[0] || \"no model named\",\n                     r.kind === \"video\" && r.dur ? `${r.dur}s` : (r.n > 1 ? `${r.n} frames` : null)]\n                    .filter(Boolean).join(\" · \");\n    return `\n    <article class=\"q\" data-rec data-entry>\n      <figure class=\"print\">\n        <span class=\"fig\">${fig(r, 264, 264, shot(r))}</span>\n        <figcaption class=\"key\">${esc(caption)}</figcaption>\n      </figure>\n      <div>\n        <blockquote${raw ? ' class=\"raw\"' : \"\"}>${shown}</blockquote>\n        <footer>\n          <h3>${esc(r.title)}</h3>\n          <p class=\"meta\"><span>${esc(r.handle || \"unattributed\")}</span>\n            ${r.likes != null ? `<span><b>${n(r.likes)}</b> likes on the source post</span>` : \"\"}\n            <span>${n(r.prompt.length)} chars</span></p>\n          <div class=\"acts\">${copyBtn(r, \"pri\")}${long\n            ? `<button class=\"btn\" type=\"button\" data-expand aria-expanded=\"false\"\n                 data-label-open=\"Show less\">Read it all</button>` : \"\"}</div>\n        </footer>\n      </div>\n    </article>`; }).join(\"\")}</div>`;\n}\n\n/* ══ V4 · Catalogue — fixed accession numbers ═════════════════════════\n   Numbered once, from the library's own order, and never renumbered. The\n   gaps a filter leaves in the sequence are the readout. */\nconst CATNO = new Map(DATA.map((r, i) => [r.id, String(i + 1).padStart(3, \"0\")]));\nfunction mCat(){\n  const rows = results();\n  if (!rows.length) return emptyState();\n  return `${countLine()}<div class=\"entries\">${rows.map(r => `\n    <article class=\"ent\" data-rec>\n      <span class=\"num\">№&nbsp;${CATNO.get(r.id)}</span>\n      <span class=\"fig\">${fig(r, 216, 162, shot(r))}</span>\n      <div>\n        <h3>${esc(r.title)}</h3>\n        <p class=\"stand\">${markPlaceholders(esc(standfirst(r)))}</p>\n        <p class=\"meta\">${metaBits(r)}</p>\n      </div>\n      <span class=\"act\">${copyBtn(r)}</span>\n    </article>`).join(\"\")}</div>`;\n}\n\n/* ══ V5 · Continuous — the library as one paragraph ═══════════════════ */\nfunction mRun(){\n  const rows = results();\n  if (!rows.length) return emptyState();\n  return `${countLine()}<div class=\"runbox\"><p class=\"run\">${rows.map(r => `<span\n      class=\"item\" data-rec data-entry><button class=\"t\" type=\"button\" data-expand\n      aria-expanded=\"false\"><span class=\"u\">${esc(r.title)}</span></button><span class=\"exp\">\n      <span class=\"fig\">${fig(r, 440, 440, shot(r))}</span>\n      <span><span class=\"txt\">${markPlaceholders(esc(excerpt(r, 900)))}</span>\n        <span class=\"meta\">${metaBits(r)}</span>\n        <span class=\"acts\">${copyBtn(r, \"pri\")}</span></span>\n    </span></span>`).join(\" \")}</p></div>`;\n}\n\n/* ── the five directions ─────────────────────────────────────────────── */\nconst vIndex = () => page(\"index\",\n  \"The list as it stands today: one row per prompt, the picture at thumbnail size, the title carrying the scan.\", mIndex);\nconst vPlates = () => page(\"plates\",\n  \"One prompt per band, the result printed large and the instructions set beside it. Three or four to a screen.\", mPlates);\nconst vQuotes = () => page(\"quotes\",\n  \"Each prompt set as a quotation at reading size, the way the argument above is set. The picture becomes a keyed print in the margin.\", mQuotes);\nconst vCat = () => page(\"cat\",\n  \"A numbered catalogue. Every prompt keeps its accession number whatever you filter to, so the gaps in the sequence show you what you excluded.\", mCat);\nconst vRun = () => page(\"run\",\n  \"No rows, no cards, no plates. The whole library as one paragraph of titles; the one you pick opens in place and splits the text around it.\", mRun);\n\n/* ── behaviour, delegated once so the picker wiring stays verbatim ───── */\nconst variants = [vIndex, vPlates, vQuotes, vCat, vRun];\nconst stage = document.getElementById('stage');\n\n/* Dispatch on data-mode, NOT on a class name.\n   The bug this replaces: `kind()` read `className` and compared it to \"vch\",\n   which never matched because every root carries two classes — redraw()\n   became a silent no-op and filtering was dead while passing every\n   structural check. The ported fix was classList.item(0). That fix is not\n   available in THIS file: all five roots deliberately share `.vme` as their\n   first class, because that is what makes screen one impossible to drift.\n   So the mode is an explicit attribute and there is nothing to guess. */\nconst mode = () => (stage.firstElementChild ? stage.firstElementChild.dataset.mode : \"\");\nconst MODES = { index: mIndex, plates: mPlates, quotes: mQuotes, cat: mCat, run: mRun };\n\nfunction redraw(){\n  const fn = MODES[mode()];\n  const el = stage.querySelector('[data-results]');\n  if (fn && el) el.innerHTML = fn();\n}\n\nstage.addEventListener('click', e => {\n  const copy = e.target.closest('[data-copy]');\n  if (copy){\n    const r = DATA.find(x => x.id === copy.getAttribute('data-copy'));\n    const label = copy.getAttribute('data-label') || copy.textContent.trim();\n    copy.setAttribute('data-label', label);\n    const done = () => {\n      copy.textContent = 'Copied';\n      copy.setAttribute('data-copied','');\n      setTimeout(() => { copy.textContent = label; copy.removeAttribute('data-copied'); }, 1500);\n    };\n    if (navigator.clipboard) navigator.clipboard.writeText(r.prompt).then(done, done); else done();\n    return;\n  }\n  /* One disclosure for four different forms: the container is marked with\n     [data-entry] rather than a class, so Plates' <article>, Quotations'\n     <article> and Continuous' inline <span> all open the same way. The\n     label only swaps when the control has a second label to swap to —\n     Continuous' control is the title itself and must keep its text. */\n  const expand = e.target.closest('[data-expand]');\n  if (expand){\n    const entry = expand.closest('[data-entry]');\n    if (!entry) return;\n    const open = !entry.hasAttribute('data-open');\n    entry.toggleAttribute('data-open', open);\n    expand.setAttribute('aria-expanded', String(open));\n    const alt = expand.getAttribute('data-label-open');\n    if (alt){\n      const closed = expand.getAttribute('data-label-closed') || expand.textContent.trim();\n      expand.setAttribute('data-label-closed', closed);\n      expand.textContent = open ? alt : closed;\n    }\n    return;\n  }\n  const facet = e.target.closest('[data-facet]');\n  if (facet){\n    e.preventDefault();\n    const k = facet.getAttribute('data-facet'), v = facet.getAttribute('data-value');\n    const on = state.active[k];\n    const i = on.indexOf(v);\n    if (i < 0) on.push(v); else on.splice(i,1);\n    stage.querySelectorAll(`.chip[data-facet=\"${k}\"][data-value=\"${CSS.escape(v)}\"]`)\n      .forEach(c => c.setAttribute('aria-pressed', String(i < 0)));\n    redraw();\n    return;\n  }\n  if (e.target.closest('[data-clear]')){\n    state.q = \"\";\n    Object.keys(state.active).forEach(k => state.active[k] = []);\n    stage.querySelectorAll('.chip[data-facet]').forEach(c => c.setAttribute('aria-pressed','false'));\n    const q = stage.querySelector('#q'); if (q) q.value = \"\";\n    redraw();\n    return;\n  }\n});\n\nlet tm;\nstage.addEventListener('input', e => {\n  if (e.target.id !== 'q') return;\n  clearTimeout(tm);\n  tm = setTimeout(() => { state.q = e.target.value.trim(); redraw(); }, 300);\n});\n<\/script>\n\n<script>\n/* The picker is gone: this page IS the chosen variant.\n   proto-l1-method.html variant 3 — \"Quotations\" — promoted 2026-09-04. */\nconst paint = () => { stage.innerHTML = variants[2](); };\nif (document.hidden) setTimeout(paint, 0); else requestAnimationFrame(paint);\n<\/script>\n\n\n", "l2": "<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Image prompts — gallery (Deck)</title>\n\n<style>\n/* ─── Real materials · :root lifted verbatim from real-l2.html ─────────────\n   Nothing here is invented. The additions live in the next block and are\n   labelled, so the line between \"what the page already had\" and \"what this\n   exploration added\" stays legible. */\n:root{\n  color-scheme:light dark;\n  --bg:light-dark(rgb(255 255 255), rgb(24 24 24));\n  --fg:light-dark(rgb(26 28 31), rgb(255 255 255));\n  --muted-fg:light-dark(rgb(26 28 31 / 50%), rgb(255 255 255 / 50%));\n  --faint-fg:light-dark(rgb(26 28 31 / 34%), rgb(255 255 255 / 34%));\n  --border:light-dark(rgb(26 28 31 / 9%), rgb(255 255 255 / 9%));\n  --card:color-mix(in oklab, var(--fg) 4%, transparent);\n  --muted:color-mix(in srgb, var(--fg) 8%, transparent);\n  --border-strong:light-dark(rgb(26 28 31 / 20%), rgb(255 255 255 / 20%));\n  --primary:var(--fg); --primary-fg:light-dark(rgb(255 255 255), rgb(13 13 13));\n  --ok:light-dark(rgb(0 138 76), rgb(96 204 146));\n  --cand:light-dark(rgb(158 106 12), rgb(224 176 96));\n  --sans:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;\n  --mono:ui-monospace,SFMono-Regular,\"SF Mono\",Menlo,Consolas,monospace;\n}\n\n/* ─── Additions to the real token set ──────────────────────────────────────\n   Five, and each says why it is here.\n   1. --surface: the linear-dark block sets it; the light side needs a value\n      or the dark theme introduces a token light mode does not have.\n   2. --img-outline / --ok-fg: the real page hard-codes both, and the\n      hard-coded values are wrong once the theme is forced by attribute\n      rather than by prefers-color-scheme.\n   3. --z-*: one z scale, so nothing invents a stacking number.\n   4. --p-*: the part washes for Anatomy. They are the one place saturated\n      colour enters this file, and they only ever paint BEHIND prompt text —\n      see the Linear rule in TASTE-FOUNDATION.md. Text colour stays --fg, so\n      annotating a prompt cannot lower its contrast.\n   5. --muted-fg / --faint-fg are OVERRIDDEN in light mode, and this is the\n      one place this file departs from the shipped tokens. Measured on the\n      rendered page: the shipped `rgb(26 28 31 / 50%)` reads 3.30:1 on white\n      and `/ 34%` reads 2.13:1, and this project spends both on 10.5–14px\n      text — captions, tag pills, footer sitemap links, chip labels. Both are\n      below the 4.5:1 floor. The replacements are not invented: they are\n      Linear's own LIGHT ink ladder from the survey — secondary `#3c4149`\n      (10.27:1) and tertiary `#6f6e77` (5.03:1) — the exact counterparts of\n      the `#d0d6e0` / `#8a8f98` the dark theme block already uses. Lightness\n      only; no saturation was added. The dark branch is set to the same pair\n      the theme block uses, so a forced theme and a system dark preference\n      render identically. The shipped :root above is left verbatim so the\n      difference stays legible. */\n:root{\n  --muted-fg:light-dark(#3c4149, #d0d6e0);\n  --faint-fg:light-dark(#6f6e77, #8a8f98);\n  --surface:light-dark(rgb(250 250 251), rgb(28 28 31));\n  --img-outline:light-dark(rgb(0 0 0 / .1), rgb(255 255 255 / .1));\n  --ok-fg:light-dark(#fff, #08090a);\n  --z-bar:20; --z-pop:30; --z-nav:40; --z-skip:100;\n  --p-light:light-dark(color-mix(in oklab,#f0bf00 34%,transparent), color-mix(in oklab,#f0bf00 26%,transparent));\n  --p-cam:light-dark(color-mix(in oklab,#4ea7fc 30%,transparent), color-mix(in oklab,#4ea7fc 26%,transparent));\n  --p-qual:light-dark(color-mix(in oklab,#00b8cc 28%,transparent), color-mix(in oklab,#00b8cc 26%,transparent));\n  --p-neg:light-dark(color-mix(in oklab,#eb5757 26%,transparent), color-mix(in oklab,#eb5757 26%,transparent));\n  --p-par:light-dark(color-mix(in oklab,#5e6ad2 26%,transparent), color-mix(in oklab,#7170ff 30%,transparent));\n  --p-ph:light-dark(color-mix(in oklab,#fc7840 30%,transparent), color-mix(in oklab,#fc7840 28%,transparent));\n}\n\n/* ─── Measured from the Linear survey (specs/images/linear-design-token-\n   reference.md, 29 routes). Copied from l1-taste.src.html, not retyped. Not\n   invented, and not a full design system. ─────────────────────────────── */\n@font-face{\n  font-family:\"InterVariable\";\n  font-style:normal;\n  font-weight:100 900;\n  font-display:swap;\n  src:url(\"https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/files/inter-latin-wght-normal.woff2\") format(\"woff2\");\n}\n:root{\n  /* The one token from the real page this file overrides: the sans stack gets\n     Inter Variable in front of it. The survey is explicit that 510/590 are the\n     point and that a system stack snapping them to 500/600 changes the tone,\n     which is the whole reason the web font is here. The platform stack stays\n     behind it, so a failed load degrades rather than breaks. PROTOTYPE\n     dependency: frontend/AGENTS.md §7.6 has not ruled on a production face. */\n  --sans:\"InterVariable\",-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;\n  /* Variable weights. 510 and 590 are the point; 400 stays the text weight. */\n  --w-text:400; --w-medium:510; --w-semi:590;\n  /* Container ladder: 1436 = 1344 homepage frame + 46px gutters either side. */\n  --w-wide:1436px; --w-page:1024px; --w-prose:624px;\n  /* Motion. Four durations, three easings — nothing else. */\n  --t-quick:100ms; --t-regular:250ms; --t-out:150ms;\n  --e-out:cubic-bezier(.25,.46,.45,.94);\n  --e-emphatic:cubic-bezier(.23,1,.32,1);\n  --e-structural:cubic-bezier(.455,.03,.515,.955);\n  /* Light-mode elevation ladder. Dark collapses to a ring (theme block). */\n  --sh-tiny:0 1px 1px #00000017;\n  --sh-low:0 1px 4px -1px #00000017;\n  --sh-med:0 3px 12px #00000017;\n  --sh-high:0 7px 24px #0000000f;\n  /* Retina hairline for the lines that separate rather than elevate. */\n  --hairline:1px;\n}\n@media only screen and (min-resolution:192dpi){ :root{ --hairline:.5px } }\n\n/* cv01 opens the digits, ss03 the alternate letterforms — both are what\n   aiforui.dev enables on its own Inter. Declared on the base body rule below\n   rather than here: the `font:` SHORTHAND in that rule resets\n   font-feature-settings to normal, and it comes later in the cascade, so a\n   declaration at this point is silently thrown away. Verified by reading\n   back the computed value. */\n\n/* The H1 tier ladder: size is a function of the page's rank in the site, not\n   of its content. L2 is an index page, so 48px / 510 / 1.0 / −0.022em.\n   At 1360 the clamp resolves to 48px and the tracking to −1.056px. */\n.tier-flagship{font-size:clamp(38px,5vw,64px);font-weight:var(--w-medium);\n  line-height:1;letter-spacing:-.022em;text-wrap:balance}\n.tier-index{font-size:clamp(32px,3.6vw,48px);font-weight:var(--w-medium);\n  line-height:1;letter-spacing:-.022em;text-wrap:balance}\n.tier-ref{font-size:clamp(28px,2.8vw,40px);font-weight:var(--w-medium);\n  line-height:1.1;letter-spacing:-.022em;text-wrap:balance}\n\n/* The header is 72px + a 1px hairline and its background is fully\n   transparent — the translucency is entirely backdrop-filter. */\n.taste .nav{background:transparent;backdrop-filter:blur(20px);\n  -webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);\n  position:sticky;top:0;z-index:var(--z-nav)}\n.taste .nav .wrap{min-height:72px}\n.taste .wrap{max-width:var(--w-wide)}\n.taste .prose{max-width:var(--w-prose)}\n\n/* ─── Base ──────────────────────────────────────────────────────────────── */\n*,*::before,*::after{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%;scroll-behavior:smooth}\n@media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} }\nbody{margin:0;background:var(--bg);color:var(--fg);\n  font:var(--w-text) 15px/1.6 var(--sans);\n  font-feature-settings:\"cv01\",\"ss03\";\n  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;\n  font-synthesis:none;overflow-x:hidden}\na{color:inherit;text-decoration:none}\n@media (hover:hover) and (pointer:fine){\n  a:hover{text-decoration:underline;text-decoration-thickness:.5px;text-underline-offset:2px}\n}\nbutton{font:inherit;color:inherit;cursor:pointer}\nbutton,a,input,select,textarea,summary{touch-action:manipulation}\n:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:5px}\nh1,h2,h3,h4{margin:0;text-wrap:balance}\nh1{font-size:clamp(32px,3.6vw,48px);font-weight:var(--w-medium);\n  line-height:1;letter-spacing:-.022em}\nh2{font-size:24px;line-height:1.33;letter-spacing:-.012em;font-weight:var(--w-semi)}\nh3{font-size:17px;line-height:1.4;letter-spacing:-.012em;font-weight:var(--w-semi)}\nh4{font-size:15px;line-height:1.4;letter-spacing:-.011em;font-weight:var(--w-medium)}\np{margin:0}\nul{margin:0}\n[id]{scroll-margin-top:88px}\nimg{outline:1px solid var(--img-outline);outline-offset:-1px}\n.skip{position:absolute;left:-9999px;background:var(--fg);color:var(--primary-fg);\n  padding:12px 16px;border-radius:8px;z-index:var(--z-skip)}\n.skip:focus{left:12px;top:12px}\n\n/* Variant 1 owns the viewport: it is a whole document of its own. */\n.baseline{display:block;width:100%;height:100dvh;border:0}\n\n/* The one gutter rule. Never set a `padding` SHORTHAND on anything that is\n   also a .wrap — that resets the inline axis to 0 and flushes content to the\n   viewport edge. This has bitten the project twice. */\n.wrap{max-width:var(--w-wide);margin:0 auto;padding:0 28px}\n\n/* ─── Shared chrome ─────────────────────────────────────────────────────── */\n.nav .wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}\n.brand{font-weight:var(--w-semi);letter-spacing:-.02em;font-size:16px;margin-right:auto;\n  display:inline-flex;align-items:center;gap:9px;min-height:44px}\n.brand i{width:8px;height:8px;border-radius:2px;background:var(--fg);font-style:normal}\n.navlinks{display:flex;gap:18px;font-size:13.5px;color:var(--muted-fg);flex-wrap:wrap}\n.navlinks a{display:inline-flex;align-items:center;min-height:44px;\n  transition-property:color;transition-duration:var(--t-out);transition-timing-function:var(--e-out)}\n@media (hover:hover) and (pointer:fine){ .navlinks a:hover{color:var(--fg)} }\n.navlinks a[aria-current=\"page\"]{color:var(--fg);font-weight:var(--w-medium)}\n\n.crumbs{font:12px/1.5 var(--mono);color:var(--faint-fg);display:flex;gap:8px;\n  flex-wrap:wrap;align-items:center;padding-top:8px}\n.crumbs a{display:inline-flex;align-items:center;min-height:44px}\n\n.hero{padding-top:64px;padding-bottom:36px}\n.lede{margin-top:18px;color:var(--muted-fg);font-size:17px;line-height:1.6;\n  max-width:var(--w-prose);text-wrap:pretty}\n.searchbar{margin-top:26px;display:flex;gap:8px;border:1px solid var(--border);\n  border-radius:12px;padding:7px;max-width:620px;background:var(--bg)}\n.searchbar input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);\n  font:16px var(--sans);padding:9px 11px;outline:none;min-height:44px}\n@media (min-width:768px){ .searchbar input{font-size:15px} }\n.searchbar input::placeholder{color:var(--faint-fg)}\n.count{font:12px/1.5 var(--mono);color:var(--faint-fg);font-variant-numeric:tabular-nums}\n.eyebrow{font:var(--w-semi) 11px/1.5 var(--mono);letter-spacing:.09em;\n  text-transform:uppercase;color:var(--faint-fg)}\n\n.sec{padding-top:52px;padding-bottom:52px;border-top:var(--hairline) solid var(--border)}\n.sec:first-of-type{border-top:0}\n.sec-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:20px}\n.sec-head .end{margin-left:auto}\n\n.btn{border:1px solid var(--border);background:transparent;border-radius:8px;\n  padding:0 14px;font-size:13.5px;white-space:nowrap;display:inline-flex;align-items:center;\n  justify-content:center;gap:6px;min-height:40px;position:relative;\n  transition-property:background-color,border-color,color;\n  transition-duration:var(--t-out);transition-timing-function:var(--e-out)}\n.btn:active{transform:scale(.96)}\n/* 40px of ink + 2px of reach on each side = 44. .btn.sm re-declares its own\n   larger reach below and wins on specificity. */\n.btn::after{content:\"\";position:absolute;inset:-2px}\n@media (hover:hover) and (pointer:fine){\n  .btn:hover{background:var(--card);border-color:var(--border-strong);text-decoration:none}\n}\n.btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}\n.btn.sm{padding:0 11px;font-size:12.5px;border-radius:6px;min-height:34px}\n/* 34px of ink + 5px of invisible reach = 44px. Rows using .sm keep a 12px gap\n   so two neighbouring reaches stay 2px apart and never overlap. */\n.btn.sm::after{content:\"\";position:absolute;inset:-5px}\n.btn.ghost{border-color:transparent;color:var(--muted-fg)}\n.btn[data-copied]{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}\n.btn.primary[data-copied]{background:var(--ok);border-color:var(--ok);color:var(--ok-fg)}\n\n.chips{display:flex;gap:12px;flex-wrap:wrap}\n.chip{border:1px solid var(--border);border-radius:999px;padding:0 12px;min-height:34px;\n  background:transparent;color:var(--muted-fg);font:inherit;font-size:13px;\n  display:inline-flex;gap:7px;align-items:center;position:relative;\n  transition-property:background-color,border-color,color;\n  transition-duration:var(--t-out);transition-timing-function:var(--e-out)}\n.chip::after{content:\"\";position:absolute;inset:-5px}\n.chip:active{transform:scale(.96)}\n@media (hover:hover) and (pointer:fine){\n  .chip:hover{color:var(--fg);border-color:var(--border-strong)}\n}\n.chip[aria-pressed=\"true\"]{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}\n.chip small{font:11px/1 var(--mono);opacity:.65;font-variant-numeric:tabular-nums}\n\n.facets{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}\n.facets h3{font:var(--w-semi) 11px/1.5 var(--mono);letter-spacing:.09em;\n  text-transform:uppercase;color:var(--faint-fg);margin-bottom:10px}\n\n.media{background:var(--muted);position:relative;overflow:hidden;display:grid;place-items:center}\n.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}\n.media .mb{position:absolute;left:8px;bottom:8px;background:rgb(0 0 0/.66);color:#fff;\n  font:var(--w-medium) 10px/1 var(--mono);letter-spacing:.05em;padding:5px 7px;border-radius:5px;\n  font-variant-numeric:tabular-nums;backdrop-filter:blur(6px)}\n.nomedia{font:10.5px/1.5 var(--mono);color:var(--muted-fg);letter-spacing:.06em;\n  padding:14px;text-align:center;outline:1px solid var(--img-outline);outline-offset:-1px}\n\n.tags{display:flex;gap:6px;flex-wrap:wrap}\n.tags .tag{font:10.5px/1.5 var(--mono);border:1px solid var(--border);border-radius:5px;\n  padding:2px 7px;color:var(--muted-fg)}\n.meta{display:flex;gap:2px 14px;flex-wrap:wrap;align-items:center;font:11.5px/1.6 var(--mono);\n  color:var(--muted-fg);font-variant-numeric:tabular-nums}\n.meta b{color:var(--fg);font-weight:var(--w-medium)}\n.meta .hv{color:var(--ok)}\n.meta a{display:inline-flex;align-items:center;min-height:34px;position:relative}\n.meta a::after{content:\"\";position:absolute;inset:-5px}\n.av{width:20px;height:20px;border-radius:50%;object-fit:cover;background:var(--muted);\n  outline:none;flex:none;margin-right:6px;vertical-align:-5px}\n\npre.prompt{margin:0;font:12.5px/1.7 var(--mono);color:var(--muted-fg);white-space:pre-wrap;\n  word-break:break-word;overflow-wrap:anywhere}\n.ph{background:color-mix(in srgb,var(--cand) 26%,transparent);color:var(--fg);\n  border-radius:3px;padding:0 3px}\n\n.empty{border:1px dashed var(--border-strong);border-radius:12px;padding:48px 28px;\n  text-align:center;min-height:260px;display:flex;flex-direction:column;align-items:center;\n  justify-content:center;gap:12px}\n.empty b{font-size:18px;font-weight:var(--w-semi);letter-spacing:-.012em}\n.empty p{color:var(--muted-fg);font-size:14px;max-width:48ch;text-wrap:pretty}\n\n/* Result titles are whole-heading links. The heading's own line box is\n   17–21px here, so each one carries 13px of invisible reach above and below,\n   cancelled by an equal negative margin so nothing moves. Their neighbours in\n   every direction are figures, <pre>, <dl> and plain spans — no other hit\n   area to overlap. */\n.v2 .cap h3 a, .v3 .det a, .v4 .dc h3 a{\n  display:inline-block;padding-block:13px;margin-block:-13px}\n\n/* Entry points into the model pages. Both the name and the trailing link go\n   to L3 — the page already settled that, and every direction keeps it. */\n.entry{display:grid;gap:0;list-style:none;padding:0}\n.entry li{display:flex;align-items:center;gap:14px;flex-wrap:wrap;\n  border-top:var(--hairline) solid var(--border);padding:6px 0}\n.entry li:last-child{border-bottom:var(--hairline) solid var(--border)}\n.entry .nm{display:flex;align-items:baseline;min-height:44px;font-size:17px;\n  font-weight:var(--w-medium);letter-spacing:-.012em;flex:1;min-width:0;gap:12px;\n  padding-top:10px}\n.entry .nm span{font:11px/1 var(--mono);color:var(--faint-fg);font-variant-numeric:tabular-nums;\n  font-weight:var(--w-text)}\n.entry .ch{font:11.5px/1.6 var(--mono);color:var(--muted-fg);flex-basis:100%;\n  font-variant-numeric:tabular-nums;margin:-6px 0 6px}\n.entry .go{display:inline-flex;align-items:center;min-height:44px;padding:0 2px;\n  font:12px/1 var(--mono);color:var(--muted-fg);white-space:nowrap}\n\n.linkcols{display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}\n.linkcols h3{font:var(--w-semi) 11px/1.5 var(--mono);letter-spacing:.09em;\n  text-transform:uppercase;color:var(--faint-fg);margin-bottom:6px}\n.linkcols ul{list-style:none;margin:0;padding:0}\n.linkcols a{display:flex;align-items:center;min-height:44px;font-size:13.5px;color:var(--muted-fg);\n  gap:8px}\n.linkcols a b{color:var(--fg);font-weight:var(--w-text)}\n\n/* The footer is the crawl surface: identical in all three directions, link\n   for link with the shipped page (33 links). The sitemap rows sit at 40px\n   rather than 44 — a deliberate, stated exception. */\nfooter.foot{padding-top:40px;padding-bottom:28px;border-top:var(--hairline) solid var(--border);\n  color:var(--faint-fg);font:11.5px/1.6 var(--mono)}\n.footnav{display:grid;gap:24px 20px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));\n  margin-bottom:26px}\n.footnav h3{font:var(--w-semi) 10.5px/1.5 var(--mono);letter-spacing:.09em;\n  text-transform:uppercase;color:var(--faint-fg);margin:0 0 6px}\n.footnav ul{list-style:none;margin:0;padding:0}\n.footnav a{color:var(--muted-fg);font:13px/1.4 var(--sans);display:flex;align-items:center;min-height:40px}\n.footlegal{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;\n  padding-top:18px;border-top:var(--hairline) solid var(--border)}\n\n@media (max-width:640px){\n  /* The header wraps to two rows at 375 (111px). Sticky, that is 14% of the\n     viewport gone for the whole scroll, so below 640 it scrolls away. */\n  .taste .nav{position:static}\n  .wrap{padding-left:18px;padding-right:18px}\n  .hero{padding-top:40px;padding-bottom:28px}\n  .sec{padding-top:36px;padding-bottom:36px}\n  .navlinks{gap:14px;font-size:13px}\n}\n\n\n/* One addition beyond the taste block, used by exactly one direction.\n   BRIEF.md names the system serif as a legitimate display pairing; a\n   Specimen card prints its determination line in italic serif because that\n   is what a herbarium or accession label does, and nothing else on the page\n   is set in it. No new colour, no web font. */\n:root{\n  --serif:ui-serif,Georgia,\"Times New Roman\",serif;\n  /* One measured repair, light mode only. The shipped `--ok` is\n     `rgb(0 138 76)`, and this page spends it on 11.5px text — the \"Popular\"\n     flag in a meta row and the \"Copied\" state of a copy button. Measured on\n     the rendered page it reads 4.43:1 on white, under the 4.5 floor, and the\n     baseline iframe shows the same number. `#008449` is the same hue and the\n     same channel ratio 4% darker: 4.78:1 on --bg and 4.58:1 on --surface.\n     Lightness only; no saturation added. The dark branch is left to the theme\n     block, whose `#4cc38a` already measures 7.9–9.0:1 on the canvas ladder. */\n  --ok:light-dark(#008449, #4cc38a);\n}\n\n/* ══ V2 · Postcard ════════════════════════════════════════════════════════\n   Axis: THE CARD HAS A BACK. One card, two faces, and the flip is the whole\n   interaction. The front is the result at postcard scale — picture edge to\n   edge, a caption strip, nothing else. The back is the postal division: the\n   entire prompt typed on ruled stock on the message half, and a stamp, a\n   postmark and the address lines (author, reach, tags) on the other.\n\n   Both faces are always in the DOM, so the full prompt text is on the page\n   whether or not anyone flips — the crawl surface does not depend on an\n   interaction. The hidden face takes `inert`, so it is out of the tab order\n   and off the a11y tree without leaving the document. */\n.v2 .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));\n  gap:26px;margin-top:22px}\n.v2 .pc{--pc-h:400px;position:relative;height:var(--pc-h);perspective:1600px}\n.v2 .flip{position:absolute;inset:0;transform-style:preserve-3d;\n  transition-property:transform;transition-duration:520ms;\n  transition-timing-function:var(--e-emphatic)}\n.v2 .pc[data-face=\"back\"] .flip{transform:rotateY(180deg)}\n@media (prefers-reduced-motion:reduce){ .v2 .flip{transition-duration:0s} }\n.v2 .face{position:absolute;inset:0;border:1px solid var(--border);border-radius:12px;\n  background:var(--bg);overflow:hidden;box-shadow:var(--sh-low);\n  backface-visibility:hidden;-webkit-backface-visibility:hidden}\n.v2 .face.back{transform:rotateY(180deg)}\n\n.v2 .front{display:flex;flex-direction:column}\n.v2 .front .media{flex:1;min-height:0}\n.v2 .front .nomedia{max-width:74%}\n.v2 .cap{display:flex;align-items:center;gap:12px;padding:8px 15px 10px;\n  border-top:1px solid var(--border);background:var(--bg)}\n/* The truncation lives on the <a>, not on the <h3>: overflow:hidden on the\n   heading clips the link's padding box, and that padding box IS the 44px hit\n   area, so the title silently loses its reach. */\n.v2 .cap h3{flex:1;min-width:0;font-size:15px;font-weight:var(--w-medium);line-height:1.35;\n  letter-spacing:-.011em}\n.v2 .cap h3 a{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n\n/* The postal division: message left, address right, one hairline between.\n   The explicit row matters: a grid row defaults to auto, so a 3,990-character\n   prompt sizes the row to its own height and pushes the address block out of\n   the card — which `overflow:hidden` then hides without a trace. */\n.v2 .back{display:grid;grid-template-columns:minmax(0,1fr) 1px 236px;\n  grid-template-rows:minmax(0,1fr)}\n.v2 .rule{background:var(--border)}\n.v2 .msg{display:flex;flex-direction:column;gap:8px;min-width:0;padding:15px 17px}\n.v2 .msg .hd{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;\n  font:10.5px/1.5 var(--mono);letter-spacing:.07em;text-transform:uppercase;\n  color:var(--faint-fg);font-variant-numeric:tabular-nums}\n/* Ruled stock. The rule pitch and the line box are both 21px, and the\n   gradient scrolls with the text (background-attachment:local) so the words\n   never drift off their lines. */\n.v2 .msg pre{margin:0;flex:1;min-height:0;overflow:auto;\n  font:12.5px/21px var(--mono);color:var(--fg);white-space:pre-wrap;\n  overflow-wrap:anywhere;word-break:break-word;\n  background-image:linear-gradient(to bottom,transparent 0 20px,\n    color-mix(in srgb,var(--fg) 9%,transparent) 20px 21px);\n  background-size:100% 21px;background-attachment:local}\n\n.v2 .addr{display:flex;flex-direction:column;gap:11px;min-width:0;padding:15px 17px}\n.v2 .frank{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}\n/* Stamp and postmark are drawn from real fields — the stamp's denomination is\n   the like count, the postmark carries the model that produced the picture. */\n.v2 .stamp{flex:none;width:56px;height:68px;padding:5px 4px;border-radius:3px;\n  border:1px solid var(--border-strong);outline:1px dashed var(--border);outline-offset:3px;\n  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;\n  text-align:center;transform:rotate(-2.2deg);\n  font:var(--w-semi) 9px/1.25 var(--mono);letter-spacing:.05em;color:var(--faint-fg)}\n.v2 .stamp b{font:var(--w-semi) 15px/1 var(--mono);color:var(--fg);\n  font-variant-numeric:tabular-nums}\n.v2 .postmark{flex:none;width:76px;height:76px;border-radius:50%;padding:9px;\n  border:1.5px solid var(--border-strong);outline:1px solid var(--border);outline-offset:-6px;\n  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;\n  text-align:center;transform:rotate(-7deg);overflow:hidden;\n  font:var(--w-semi) 9px/1.2 var(--mono);letter-spacing:.03em;color:var(--faint-fg)}\n.v2 .postmark b{font:var(--w-semi) 9.5px/1.2 var(--mono);color:var(--muted-fg);\n  letter-spacing:.01em}\n.v2 .lines{display:flex;flex-direction:column;margin-top:auto}\n.v2 .lines .ln{display:flex;align-items:center;gap:7px;min-height:34px;\n  border-bottom:1px solid var(--border);font:11.5px/1.5 var(--mono);color:var(--muted-fg);\n  font-variant-numeric:tabular-nums;overflow:hidden}\n.v2 .lines .ln span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.v2 .acts{display:flex;gap:12px;flex-wrap:wrap;padding-top:2px}\n\n@media (max-width:900px){\n  .v2 .cards{grid-template-columns:1fr}\n  .v2 .pc{--pc-h:560px}\n  .v2 .back{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 1px auto}\n  .v2 .lines{margin-top:6px}\n}\n@media (max-width:560px){ .v2 .pc{--pc-h:640px} }\n\n/* ══ V3 · Specimen ════════════════════════════════════════════════════════\n   Axis: THE CARD IS A MOUNT AND A PRINTED LABEL. Not a tile with a caption:\n   an accession card. The picture is mounted with air around it and held by\n   drawn corner mounts; underneath, the same six-line label is printed on\n   every card in the same order, so two cards can be read against each other\n   without reading their prose. The prompt itself is the catalogue\n   description, folded into a <details> that works with no JavaScript. */\n.v3 .cabinet{display:grid;grid-template-columns:repeat(auto-fill,minmax(274px,1fr));\n  gap:22px;margin-top:22px}\n.v3 .sp{display:flex;flex-direction:column;gap:13px;padding:16px;\n  border:1px solid var(--border);border-radius:10px;background:var(--bg);\n  box-shadow:var(--sh-tiny)}\n/* Nested radius would go negative against a 16px mount padding, so the mount\n   takes the smallest radius on the observed Linear ladder instead. */\n/* isolation:isolate so the two corner mounts can sit above the picture with\n   a depth of 1 inside the mount, not a layer in the page's z scale. Without\n   it ::before paints under .media (both are positioned, DOM order decides)\n   and only the bottom-right corner shows — which looked like a rendering\n   glitch rather than a pair. */\n.v3 .mount{position:relative;isolation:isolate;padding:13px;border-radius:5px;\n  background:var(--card)}\n.v3 .mount .media{aspect-ratio:4/5;border-radius:2px}\n.v3 .mount::before,.v3 .mount::after{content:\"\";position:absolute;z-index:1;\n  width:17px;height:17px;\n  /* A corner mount is paper laid over the picture, so it takes the card's own\n     paper colour with a hairline edge. An ink-coloured triangle disappeared\n     into every dark photograph in the set — measured on the gym shot. */\n  background:linear-gradient(135deg,var(--bg) 0 46%,\n    color-mix(in srgb,var(--fg) 26%,transparent) 46% 50%,transparent 50%)}\n.v3 .mount::before{left:13px;top:13px}\n.v3 .mount::after{right:13px;bottom:13px;transform:rotate(180deg)}\n.v3 .det{font:italic var(--w-medium) 17px/1.32 var(--serif);letter-spacing:0}\n.v3 .label{display:grid;grid-template-columns:72px minmax(0,1fr);gap:6px 10px;margin:0;\n  padding-top:12px;border-top:1px solid var(--border)}\n.v3 .label dt{font:var(--w-semi) 10px/1.7 var(--mono);letter-spacing:.085em;\n  text-transform:uppercase;color:var(--faint-fg)}\n.v3 .label dd{margin:0;font:11.5px/1.7 var(--mono);color:var(--muted-fg);\n  font-variant-numeric:tabular-nums;overflow-wrap:anywhere}\n/* 34px of ink + 5px of reach = 44; the 12px row gap keeps two reaches 2px apart. */\n.v3 .mlinks{display:flex;flex-wrap:wrap;gap:12px}\n.v3 .ml{display:inline-flex;align-items:center;min-height:34px;padding:0 8px;\n  position:relative;border:1px solid var(--border);border-radius:5px;\n  font:10.5px/1.5 var(--mono);color:var(--muted-fg);\n  transition-property:border-color,color;transition-duration:var(--t-out);\n  transition-timing-function:var(--e-out)}\n.v3 .ml::after{content:\"\";position:absolute;inset:-5px}\n@media (hover:hover) and (pointer:fine){\n  .v3 .ml:hover{color:var(--fg);border-color:var(--border-strong)} }\n.v3 .sp details{border-top:1px solid var(--border);margin-top:auto}\n.v3 .sp summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;\n  min-height:44px;font:var(--w-semi) 10px/1.6 var(--mono);letter-spacing:.085em;\n  text-transform:uppercase;color:var(--faint-fg)}\n.v3 .sp summary::-webkit-details-marker{display:none}\n.v3 .sp summary::after{content:\"+\";margin-left:auto;font:13px/1 var(--mono);\n  color:var(--muted-fg)}\n.v3 .sp details[open] summary::after{content:\"\\2212\"}\n.v3 .sp details pre{margin:2px 0 12px;max-height:280px;overflow:auto;color:var(--fg)}\n.v3 .acts{display:flex;gap:12px;flex-wrap:wrap;padding-top:2px}\n.v3 .legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));\n  gap:4px 22px;margin:-8px 0 20px;font:11.5px/1.7 var(--mono);color:var(--faint-fg)}\n.v3 .legend b{color:var(--muted-fg);font-weight:var(--w-text)}\n\n/* ══ V4 · Deck ════════════════════════════════════════════════════════════\n   Axis: HOW MANY CARDS AT ONCE. Every other direction answers \"show me\n   everything\"; this one answers \"let me actually look at one\". The card is\n   large enough to read the prompt without a second surface, and the rest of\n   the result set is physically behind it — you can see the stack, and you\n   step through it with the buttons or the arrow keys.\n\n   All of the cards are rendered, so the page still carries every prompt; the\n   ones behind the top card are moved and faded with transform and opacity\n   only. The deck makes its own stacking context with `isolation:isolate`, so\n   --dz is a depth inside the deck and never a global layer. */\n/* The stack needs somewhere to go. A card at depth o is offset right by\n   (o × --dk-dx) and pulled in by its own scale (o × half the scale step ×\n   width); with a 4% step the inset beat the offset and the stack showed only\n   as a hairline above the card. A 2.8% step plus reserved room on the right\n   puts it where a deck actually reads. */\n.v4 .deckwrap{margin-top:22px;padding-top:18px;padding-right:56px;max-width:1060px}\n/* The stack's horizontal offset has to scale with the deck, or the back of\n   the stack pushes past the container: a card at depth o sits (o × --dk-dx)\n   to the right but is inset (o × 2% × width) by its own scale, so any fixed\n   offset overflows once the deck gets narrow. min(18px, 1.5vw) stays inside\n   at every width from 375 up. Measured: 59px of overflow at 375 before. */\n.v4 .deck{--dk-h:520px;--dk-dx:min(22px,1.8vw);--dk-dy:-12px;\n  position:relative;height:var(--dk-h);isolation:isolate;perspective:1600px}\n.v4 .dc{position:absolute;inset:0;z-index:var(--dz,0);\n  display:grid;grid-template-columns:minmax(0,45%) minmax(0,55%);\n  grid-template-rows:minmax(0,1fr);\n  border:1px solid var(--border);border-radius:14px;background:var(--bg);\n  box-shadow:var(--sh-med);overflow:hidden;opacity:0;pointer-events:none;\n  transform:translate3d(calc(var(--o,4) * var(--dk-dx)),calc(var(--o,4) * var(--dk-dy)),0)\n            scale(calc(1 - var(--o,4) * .028));\n  transition-property:transform,opacity;transition-duration:var(--t-regular);\n  transition-timing-function:var(--e-emphatic)}\n.v4 .dc[data-vis]{opacity:1}\n.v4 .dc[data-top]{pointer-events:auto}\n/* The cards behind are dimmed by a flat scrim rather than a filter: a blur or\n   brightness filter on a 520px card costs a full-size offscreen pass. */\n.v4 .dc::after{content:\"\";position:absolute;inset:0;border-radius:inherit;\n  background:var(--bg);opacity:.62;pointer-events:none;\n  transition-property:opacity;transition-duration:var(--t-regular);\n  transition-timing-function:var(--e-emphatic)}\n.v4 .dc[data-top]::after{opacity:0}\n@media (prefers-reduced-motion:reduce){\n  .v4 .dc,.v4 .dc::after{transition-duration:0s} }\n.v4 .dc .media{height:100%}\n.v4 .dc .side{display:flex;flex-direction:column;gap:11px;min-width:0;min-height:0;\n  padding:22px 24px}\n.v4 .dc h3{font-size:20px;line-height:1.28;letter-spacing:-.014em;\n  font-weight:var(--w-medium)}\n.v4 .dc pre.prompt{flex:1;min-height:0;overflow:auto;color:var(--fg);\n  background:var(--surface);border-radius:8px;padding:13px 14px}\n.v4 .dcacts{display:flex;gap:12px;flex-wrap:wrap}\n.v4 .dknav{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px}\n.v4 .dkpos{font:12px/1 var(--mono);color:var(--muted-fg);font-variant-numeric:tabular-nums;\n  min-width:82px}\n.v4 .dkhint{font:11.5px/1.6 var(--mono);color:var(--faint-fg)}\n.v4 .btn[disabled]{opacity:.45;cursor:default}\n@media (max-width:900px){\n  .v4 .deckwrap{padding-right:24px}\n  /* One column at 375 means the prompt panel is the only thing that can give,\n     so the card grows and the picture gives back 20px rather than the words. */\n  .v4 .deck{--dk-h:720px}\n  .v4 .dc{grid-template-columns:1fr;grid-template-rows:190px minmax(0,1fr)}\n  .v4 .dc .side{padding:16px 18px}\n  .v4 .dc h3{font-size:18px}\n  .v4 .dkhint{flex-basis:100%}\n}\n</style>\n\n\n\n<style id=\"linear-dark-theme\">\n/* ─────────────────────────────────────────────────────────────────────────\n   Linear-derived dark theme for the prototype pickers.\n\n   Values come from the token snapshot at\n   `specs/images/linear-design-tokens.css` (Linear public-site CSS, snapshot\n   2026-09-03), not from memory. This is a COLOUR re-theme only: type and\n   geometry stay on the project's own system, because `frontend/AGENTS.md` §7.6\n   has not ruled on a web font and Linear's faces (Inter Variable, Berkeley\n   Mono, Tiempos Headline) are not licensed here. Weights stay 400/600.\n\n   The four pickers were written at different times and use three different\n   token vocabularies (`--background`/`--bg`, `--foreground`/`--fg`,\n   `--muted`/`--muted-fg`, `--faint`/`--faint-fg`, `--font-sans`/`--sans`).\n   Every alias is set, so one block themes all four.\n\n   Contrast, measured against the canvas ladder (WCAG 2, sRGB):\n\n     token                 #08090a  #0f1011  #141516  #191a1b\n     --foreground #f7f8f8    18.73    17.90    17.18    16.38\n     --muted-fg   #d0d6e0    13.64    13.04    12.52    11.93\n     --faint      #8a8f98     6.13     5.86     5.63     5.36\n     --accent     #7170ff     5.18     4.96     4.76     4.53\n     --ok         #4cc38a     9.00     8.60     8.25     7.87\n     white on brand fill #5e6ad2 …………………………………………………… 4.70\n\n   Three deliberate departures from Linear's own dark tokens, each because a\n   token Linear uses decoratively is used here as text:\n\n   1. `--faint` takes Linear's TERTIARY ink `#8a8f98`, not its quaternary\n      `#62666d`. Quaternary measures 3.45:1 — below the 4.5:1 floor — and this\n      project spends `--faint` on 11px mono captions, which is text.\n   2. `--accent` takes `#7170ff`, NOT the `#5252f5` that `frontend/CLAUDE.md`\n      mandates. That mandate is a LIGHT-mode repair: `#7070ff` fails AA on all\n      four light surfaces (3.30–3.85) and `#5252f5` fixes it. Inverted, the\n      rule inverts too — `#5252f5` measures 3.69:1 on `#08090a` and would be\n      the unreadable one. Same intent, opposite value.\n   3. `--ok` lifts Linear's `#27a644` to `#4cc38a`. Per the `color` skill,\n      brand colours carried into dark at full saturation vibrate; lightness\n      goes up and chroma comes down. It also buys 6.29:1 → 9.00:1 at 11px.\n   ───────────────────────────────────────────────────────────────────────── */\n\n:root[data-theme=\"linear-dark\"] {\n  color-scheme: dark;\n\n  /* Canvas ladder — level-0 is the page, level-1 insets, level-2 cards.\n     Dark mode keeps the layering hierarchy; it is not inverted light mode. */\n  --background: #08090a;  --bg: #08090a;\n  --surface:    #0f1011;\n  --card:       #141516;\n\n  /* Ink */\n  --foreground: #f7f8f8;  --fg: #f7f8f8;\n  /* --muted is deliberately NOT set. It is ink in L1/L4 but a translucent\n     SURFACE wash in L2/L3 (`color-mix(in srgb, var(--fg) 8%, transparent)`,\n     used only for avatar and media placeholders). Forcing one ink value here\n     painted light-grey boxes onto a near-black canvas in L3. Every file's own\n     definition self-corrects once --fg/--foreground flip and color-scheme is\n     dark, so the token is left alone on purpose. --muted-fg is unambiguous\n     ink and is set. */\n  --muted-fg: #d0d6e0;\n  --faint:      #8a8f98;  --faint-fg: #8a8f98;\n\n  /* Lines. Linear's dark borders are solid, not alpha-white — a translucent\n     white hairline glows on near-black instead of receding. */\n  --border:        #23252a;\n  --border-strong: #34343a;\n\n  /* Interaction. Indigo carries interaction semantics only: focus, links,\n     ::selection, and the single primary action per view. */\n  --accent:    #7170ff;\n  --accent-bg: #1b1c33;\n\n  /* The inverted button: Linear's own --color-button-invert-bg. */\n  --primary:    #e5e5e6;\n  --primary-fg: #08090a;\n\n  /* Status */\n  --ok:   #4cc38a;\n  --cand: #f0bf00;\n\n  /* L4's placeholder highlight, on Linear's orange */\n  --var-bg: #2a1a12;\n  --var-fg: #fc9a6e;\n\n  /* L1's Spotlight band sits below the page ladder on Linear's marketing black */\n  --bbd:    #010102;\n  --bmu:    rgb(247 248 248 / .68);\n  --bfaint: rgb(247 248 248 / .46);\n}\n\n/* The prototypes gate their dark-mode image outline on `prefers-color-scheme`,\n   which does not fire when the theme is forced by attribute. A tinted outline\n   picks up the surface behind it and reads as grime, so it must be pure white. */\n:root[data-theme=\"linear-dark\"] img { outline-color: rgb(255 255 255 / .1); }\n\n/* Selection carries the brand quietly and stays legible. */\n:root[data-theme=\"linear-dark\"] ::selection {\n  background: color-mix(in oklab, #5e6ad2, black 10%);\n  color: #fff;\n}\n\n/* Depth: on dark, a stacked shadow is invisible, so every elevation collapses\n   to a single low-opacity white ring. */\n:root[data-theme=\"linear-dark\"] [data-elevated] {\n  box-shadow: 0 0 0 1px rgb(255 255 255 / .09);\n}\n\n/* This file's own two additions to the block, both measured before use.\n   1. --img-outline and --ok-fg are light-dark() tokens; light-dark() follows\n      the used color-scheme, which the rule above already sets to dark, so\n      they self-correct and are NOT restated here.\n   2. The part washes: on #141516 the light-mode mixes read as chalk, so the\n      dark side of each light-dark() pair is the one that applies. Text over\n      every wash stays --fg #f7f8f8; measured 13.9–16.5:1 across the six. */\n</style>\n\n<style>\n/* ─── Theme toggle · harness chrome, not design. Mirrors the picker's own\n   dark-glass idiom so it reads as the same control family, but sits clear\n   of it at the opposite corner. Never touches .proto-picker rules. ─────── */\n.theme-toggle {\n  position: fixed;\n  bottom: 24px;\n  right: 24px;\n  z-index: 2147483647;\n  display: flex;\n  align-items: center;\n  gap: 7px;\n  height: 28px;\n  padding: 0 12px;\n  border: 0;\n  border-radius: 999px;\n  background: rgba(10, 10, 10, 0.82);\n  -webkit-backdrop-filter: blur(12px) saturate(1.4);\n  backdrop-filter: blur(12px) saturate(1.4);\n  box-shadow:\n    0 0 0 1px rgba(255, 255, 255, 0.08) inset,\n    0 8px 24px rgba(0, 0, 0, 0.24),\n    0 2px 6px rgba(0, 0, 0, 0.12);\n  font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n  font-size: 13px;\n  line-height: 1;\n  -webkit-font-smoothing: antialiased;\n  color: rgba(255, 255, 255, 0.55);\n  cursor: pointer;\n  user-select: none;\n  -webkit-user-select: none;\n  touch-action: manipulation;\n  transition: color 150ms ease-out;\n}\n\n.theme-toggle::after {\n  content: \"\";\n  position: absolute;\n  inset: -8px;\n}\n\n@media (hover: hover) and (pointer: fine) {\n  .theme-toggle:hover { color: rgba(255, 255, 255, 0.85); }\n}\n\n.theme-toggle:active { transform: scale(0.96); }\n\n.theme-toggle:focus-visible {\n  outline: 2px solid rgba(255, 255, 255, 0.4);\n  outline-offset: 2px;\n}\n\n.theme-toggle[aria-pressed=\"true\"] { color: #fff; }\n\n.theme-toggle-dot {\n  width: 7px;\n  height: 7px;\n  border-radius: 50%;\n  background: currentColor;\n  opacity: .6;\n}\n\n.theme-toggle[aria-pressed=\"true\"] .theme-toggle-dot { opacity: 1; }\n\n@med
