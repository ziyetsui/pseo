ofile_images/2038274199379443712/HGEFaPvT_400x400.jpg\", \"ManuAGI01\": \"https://pbs.twimg.com/profile_images/1792389743503929344/5NAkgng7_400x400.jpg\", \"CHAO2U_AI\": \"https://pbs.twimg.com/profile_images/2018484655750840320/6ZfNMPHb_400x400.jpg\", \"IqrasaifiAI\": \"https://pbs.twimg.com/profile_images/2070883209731248128/BZnJwoPG_400x400.jpg\", \"ChillaiKalan__\": \"https://pbs.twimg.com/profile_images/2042898125573197824/Em0FFxRw_400x400.jpg\", \"ZaraIrahh\": \"https://pbs.twimg.com/profile_images/1997170504713883651/mr6aPbte_400x400.jpg\", \"Naiknelofar788\": \"https://pbs.twimg.com/profile_images/2014919869259735040/MbBiQ58q_400x400.jpg\", \"PinodiArt\": \"https://pbs.twimg.com/profile_images/2017948625058287616/AUHPq1dP_400x400.jpg\", \"Arminn_Ai\": \"https://pbs.twimg.com/profile_images/1934377885055246336/TPOvBcnQ_400x400.jpg\", \"AIwithSarah_\": \"https://pbs.twimg.com/profile_images/2016454047679832064/qf_DsgPV_400x400.jpg\"};\n\n/* L2 is the image gallery, so the corpus is every record that is not a video.\n   That keeps the one record with no media at all, the 11 raw-JSON prompts,\n   the 4 with [BRACKET] placeholders, the one with no model and the six with\n   no use case — the records that break layouts stay in. */\nconst DATA = ALL.filter(r => r.kind === \"video\");\n\n/* ── helpers ─────────────────────────────────────────────────────────── */\nconst esc = s => String(s == null ? \"\" : s)\n  .replace(/&/g,\"&amp;\").replace(/</g,\"&lt;\").replace(/>/g,\"&gt;\").replace(/\"/g,\"&quot;\");\nconst compact = new Intl.NumberFormat(\"en-US\", { notation:\"compact\", maximumFractionDigits:1 });\nconst n = v => v == null ? \"—\" : compact.format(v);\nconst num = v => v == null ? \"—\" : v.toLocaleString(\"en-US\");\nconst PH = /\\[[A-Z][A-Z \\-_\\/]{2,}\\]/g;\n/* Placeholders are marked after escaping, so the mark is the only markup that\n   ever gets into prompt text. */\nconst promptHTML = s => esc(s).replace(PH, m => `<mark class=\"ph\">${m}</mark>`);\nconst slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,\"-\").replace(/^-|-$/g,\"\");\nconst asList = (r,k) => Array.isArray(r[k]) ? r[k] : (r[k] == null ? [] : [r[k]]);\nconst median = a => { if (!a.length) return null; const s=[...a].sort((x,y)=>x-y);\n  const m=s.length>>1; return s.length%2 ? s[m] : Math.round((s[m-1]+s[m])/2); };\nconst isJSON = r => /^\\s*[{\\[]/.test(r.prompt);\n\nconst AXES = [[\"uses\",\"Use case\"],[\"styles\",\"Style\"],[\"subjects\",\"Subject\"]];\n\nfunction counts(key, rows){\n  const m = new Map();\n  (rows || DATA).forEach(r => asList(r,key).forEach(v => m.set(v,(m.get(v)||0)+1)));\n  return [...m].sort((a,b) => b[1]-a[1] || String(a[0]).localeCompare(b[0]));\n}\nconst topOf = (key, rows) => { const c = counts(key, rows); return c.length ? c[0] : null; };\n\n/* ── derived facts, all of them read straight off the record ───────────── */\nconst words = r => r.prompt.trim().split(/\\s+/).length;\nconst phCount = r => (r.prompt.match(PH) || []).length;\n/* \"Extent\" on a Specimen label, and the caption on a Postcard's message\n   side. Nothing here is a judgement — it is the length and the format the\n   stored text actually has. */\nconst extent = r => `${num(r.prompt.length)} characters · ${num(words(r))} words · ${\n  isJSON(r) ? \"JSON\" : \"prose\"}${phCount(r) ? ` · ${phCount(r)} placeholder${\n  phCount(r) > 1 ? \"s\" : \"\"}` : \"\"}`;\n\n/* Filter state is shared across the directions on purpose: switching keeps\n   your query, so you are always comparing the same result set. `di` is the\n   Deck's position, reset whenever the surviving set changes. */\nconst state = { q:\"\", active:{uses:[],styles:[],subjects:[]}, di:0 };\n\nfunction matches(r){\n  for (const k in state.active){\n    const on = state.active[k];\n    if (on.length && !on.some(v => asList(r,k).includes(v))) return false;\n  }\n  if (state.q){\n    const q = state.q.toLowerCase();\n    const hay = (r.title+\" \"+r.prompt+\" \"+r.models.join(\" \")+\" \"+r.uses.join(\" \")+\" \"+\n                 r.styles.join(\" \")+\" \"+r.subjects.join(\" \")+\" \"+(r.handle||\"\")).toLowerCase();\n    if (!hay.includes(q)) return false;\n  }\n  return true;\n}\nconst results = () => DATA.filter(matches).sort((a,b) => (b.score ?? -1) - (a.score ?? -1));\nconst anyFilter = () => state.q || Object.values(state.active).some(a => a.length);\n\nfunction emptyState(){\n  return `<div class=\"empty\">\n    <b>No image prompt matches that</b>\n    <p>This gallery holds ${DATA.length} image prompts. Clear the filters to see all of\n       them, or search for a model name like Nano Banana.</p>\n    <button class=\"btn primary\" data-clear type=\"button\">Clear filters</button>\n  </div>`;\n}\nconst countLine = res => `${res.length} of ${DATA.length} image prompts${anyFilter() ? \" match\" : \"\"}`;\nfunction avatar(h){\n  const k = (h||\"\").replace(\"@\",\"\");\n  return AVATARS[k]\n    ? `<img class=\"av\" src=\"${esc(AVATARS[k])}\" alt=\"\" loading=\"lazy\" referrerpolicy=\"no-referrer\"\n         width=\"20\" height=\"20\" onerror=\"this.remove()\">` : \"\";\n}\nfunction metaRow(r){\n  return `<div class=\"meta\">\n    <span>${avatar(r.handle)}${esc(r.handle || \"unattributed\")}</span>\n    <span><b>${n(r.likes)}</b> likes</span>\n    <span><b>${n(r.saves)}</b> saves</span>\n    ${r.hv ? `<span class=\"hv\">Popular</span>` : \"\"}\n    <a href=\"https://x.com/${esc((r.handle||\"i\").replace(\"@\",\"\"))}/status/${esc(r.id)}\"\n       rel=\"nofollow noopener\" target=\"_blank\">View on X ↗</a>\n  </div>`;\n}\nfunction tagRow(r){\n  const t = [...r.models, ...r.styles, ...r.subjects, ...r.uses].slice(0,5);\n  return `<div class=\"tags\">${t.map(v => `<span class=\"tag\">${esc(v)}</span>`).join(\"\")\n    || `<span class=\"tag\">untagged</span>`}</div>`;\n}\nfunction shot(r, w, h){\n  if (!r.img) return `<div class=\"media\"><span class=\"nomedia\">NO IMAGE ON THE SOURCE POST</span></div>`;\n  return `<div class=\"media\"><img src=\"${esc(r.img)}\" alt=\"Result from the source post\"\n    loading=\"lazy\" referrerpolicy=\"no-referrer\" width=\"${w}\" height=\"${h}\">\n    ${r.n > 1 ? `<span class=\"mb\">PHOTO · ×${r.n}</span>` : \"\"}</div>`;\n}\nfunction copyBtn(r, cls){\n  return `<button class=\"btn ${cls}\" type=\"button\" data-copy=\"${esc(r.id)}\">Copy prompt</button>`;\n}\n\n/* ── shared chrome ───────────────────────────────────────────────────── */\nfunction chrome(){\n  return `<nav class=\"nav\" aria-label=\"Primary\"><div class=\"wrap\">\n    <a class=\"brand\" href=\"/prompts\"><i></i>Prompt Library</a>\n    <div class=\"navlinks\"><a href=\"/prompts\">Home</a>\n      <a href=\"/prompts/image\" aria-current=\"page\">Images</a>\n      <a href=\"/prompts/video\">Videos</a><a href=\"/prompts/models\">Models</a></div>\n  </div></nav>\n  <div class=\"wrap\"><div class=\"crumbs\"><a href=\"/prompts\">Prompt Library</a>\n    <span>/</span><span>Image</span></div></div>`;\n}\nfunction searchForm(){\n  return `<form class=\"searchbar\" role=\"search\">\n      <input id=\"q\" type=\"search\" placeholder=\"Search image prompts…\"\n             aria-label=\"Search image prompts\" value=\"${esc(state.q)}\">\n      <button class=\"btn primary\" type=\"submit\">Search</button>\n    </form>\n    <p class=\"count\" style=\"margin-top:12px\" data-count>${countLine(results())}</p>`;\n}\n/* The three tag axes the shipped page facets on. Present in every direction,\n   same markup, same handler. */\nfunction facetGroups(){\n  return `<div class=\"facets\">${AXES.map(([k,label]) => `<div>\n    <h3>${label}</h3>\n    <div class=\"chips\">${counts(k).map(([v,c]) =>\n      `<button class=\"chip\" type=\"button\" data-facet=\"${k}\" data-value=\"${esc(v)}\"\n        aria-pressed=\"${state.active[k].includes(v)}\">${esc(v)} <small>${c}</small></button>`\n    ).join(\"\")}</div></div>`).join(\"\")}</div>`;\n}\n\n/* Model entry points. The name and the trailing link both open the model\n   page — that is settled, and every direction keeps both. The real page\n   prints \"See all 136 →\" for the three models it has a catalogue count for;\n   this prototype has counts for its own 24 records only, so the link carries\n   no invented catalogue number. */\nfunction modelEntries(withCharacter){\n  return `<ul class=\"entry\">${counts(\"models\").map(([v,c]) => {\n    const rows = DATA.filter(r => r.models.includes(v));\n    const j = rows.filter(isJSON).length;\n    const st = topOf(\"styles\", rows);\n    return `<li>\n      <a class=\"nm\" href=\"/prompts/models/${slug(v)}\">${esc(v)} <span>${c} here</span></a>\n      <a class=\"go\" href=\"/prompts/models/${slug(v)}\">All ${esc(v)} prompts →</a>\n      ${withCharacter ? `<span class=\"ch\">median ${num(median(rows.map(r=>r.prompt.length)))} characters ·\n        ${j} of ${c} written as JSON${st ? ` · mostly ${esc(st[0]).toLowerCase()}` : \"\"}</span>` : \"\"}\n    </li>`;\n  }).join(\"\")}</ul>`;\n}\nfunction tagLinkCols(){\n  return `<div class=\"linkcols\">${AXES\n    .map(([k,label]) => `<div><h3>${label}</h3><ul>${counts(k).map(([v,c]) =>\n      `<li><a href=\"#\">${esc(v)} prompts <b class=\"count\">${c}</b></a></li>`\n    ).join(\"\")}</ul></div>`).join(\"\")}</div>`;\n}\n\n/* The footer is the crawl surface. Identical in all four directions, link for\n   link with the shipped page (33 links); nothing in this exploration shrinks it. */\nconst FOOT_COLS = [\n  [\"By model\", [[\"Nano Banana Pro prompts\",\"/prompts/models/nano-banana-pro\"],\n    [\"Higgsfield Soul prompts\",\"/prompts/models/higgsfield-soul\"],\n    [\"GPT Image 2 prompts\",\"/prompts/models/gpt-image-2\"],\n    [\"Nano Banana 2 prompts\",\"/prompts/models/nano-banana-2\"],\n    [\"Nano Banana prompts\",\"/prompts/models/nano-banana\"],\n    [\"GPT Image prompts\",\"/prompts/models/gpt-image\"],\n    [\"Kling prompts\",\"/prompts/models/kling\"],\n    [\"Seedance prompts\",\"/prompts/models/seedance\"]]],\n  [\"By use case\", [[\"Fashion prompts\",\"#\"],[\"Beauty prompts\",\"#\"],[\"Advertising prompts\",\"#\"],\n    [\"Food & beverage prompts\",\"#\"],[\"Automotive prompts\",\"#\"],[\"Web & motion prompts\",\"#\"],\n    [\"UGC prompts\",\"#\"],[\"Product marketing prompts\",\"#\"]]],\n  [\"By style\", [[\"Photorealistic prompts\",\"#\"],[\"Cinematic prompts\",\"#\"],[\"Luxury prompts\",\"#\"],\n    [\"Anime / illustrated prompts\",\"#\"],[\"Retro / vintage prompts\",\"#\"],\n    [\"Sci-fi / cyberpunk prompts\",\"#\"],[\"Surreal / fantasy prompts\",\"#\"]]],\n  [\"By subject\", [[\"Person / portrait prompts\",\"#\"],[\"Architecture / interior prompts\",\"#\"],\n    [\"Product prompts\",\"#\"],[\"Food / drink prompts\",\"#\"],[\"Vehicle prompts\",\"#\"]]],\n  [\"Browse\", [[\"Image prompts\",\"/prompts/image\"],[\"Video prompts\",\"/prompts/video\"],\n    [\"All prompts\",\"/prompts\"],[\"All models\",\"/prompts/models\"],[\"All creators\",\"/prompts/creators\"]]],\n];\nfunction foot(){\n  return `<footer class=\"foot\"><div class=\"wrap\">\n    <div class=\"footnav\">${FOOT_COLS.map(([t,items]) => `<div><h3>${esc(t)}</h3><ul>${\n      items.map(([l,href]) => `<li><a href=\"${esc(href)}\">${esc(l)}</a></li>`).join(\"\")\n    }</ul></div>`).join(\"\")}</div>\n    <div class=\"footlegal\"><span>Prompt Library</span>\n      <span>Prompts remain the property of their authors. Every page credits the source.</span></div>\n  </div></footer>`;\n}\n\n\n/* ══ V2 · Postcard ═══════════════════════════════════════════════════════\n   Axis: THE CARD HAS A BACK — the flip is the interaction.\n\n   A postcard is the one everyday card that is genuinely two-sided, and the\n   two things this page has to show are exactly two: the picture, and the\n   words. Neither is a preview of the other. So the front is the result at\n   full card size with nothing on it, and the back is the postal division —\n   the whole prompt typed on the message half, the stamp, postmark and\n   address lines on the other. Both faces are in the DOM at all times. */\nfunction pcCard(r){\n  const tags = [...r.styles, ...r.subjects, ...r.uses];\n  const mark = r.models[0] || \"no model named\";\n  return `<article class=\"pc\" data-face=\"front\">\n    <div class=\"flip\">\n      <div class=\"face front\">\n        ${shot(r, 680, 340)}\n        <div class=\"cap\">\n          <h3><a href=\"/prompts/${esc(r.slug || r.id)}\">${esc(r.title)}</a></h3>\n          <button class=\"btn sm\" type=\"button\" data-flip=\"back\">Read the prompt</button>\n        </div>\n      </div>\n      <div class=\"face back\" inert>\n        <div class=\"msg\">\n          <p class=\"hd\"><span>${esc(extent(r))}</span></p>\n          <pre>${promptHTML(r.prompt)}</pre>\n        </div>\n        <div class=\"rule\" aria-hidden=\"true\"></div>\n        <div class=\"addr\">\n          <div class=\"frank\">\n            <span class=\"postmark\"><b>${esc(mark)}</b>${\n              r.n > 1 ? `${r.n} FRAMES` : \"POSTED ON X\"}</span>\n            <span class=\"stamp\"><b>${n(r.likes)}</b>LIKES</span>\n          </div>\n          <div class=\"lines\">\n            <span class=\"ln\">${avatar(r.handle)}<span>${esc(r.handle || \"unattributed\")}</span></span>\n            <span class=\"ln\"><span>${n(r.saves)} saves${r.hv ? \" · popular\" : \"\"}</span></span>\n            <span class=\"ln\"><span>${tags.length ? esc(tags.slice(0,3).join(\" · \")) : \"untagged\"}</span></span>\n          </div>\n          <div class=\"acts\">\n            ${copyBtn(r, \"sm primary\")}\n            <button class=\"btn sm\" type=\"button\" data-flip=\"front\">Show the picture</button>\n          </div>\n        </div>\n      </div>\n    </div>\n  </article>`;\n}\nfunction v2Results(){\n  const res = results();\n  if (!res.length) return emptyState();\n  return `<div class=\"cards\">${res.map(pcCard).join(\"\")}</div>`;\n}\nfunction v2(){\n  return `<div class=\"v2 taste\">${chrome()}<main id=\"main\"><div class=\"wrap\">\n    <header class=\"hero\">\n      <p class=\"eyebrow\">Image gallery</p>\n      <h1 class=\"tier-index\">Video prompts</h1>\n      <p class=\"lede\">Every prompt here is a postcard. The picture it produced is on the\n        front; the words that produced it are typed on the back, in full. Turn one over.</p>\n      ${searchForm()}\n    </header>\n    <section class=\"sec\"><h2>Narrow the gallery</h2>${facetGroups()}</section>\n    <section class=\"sec\">\n      <div class=\"sec-head\"><h2>Editor's pick</h2>\n        <span class=\"count end\" data-count>${countLine(results())}</span></div>\n      <div data-results>${v2Results()}</div>\n    </section>\n    <section class=\"sec\"><h2>Browse by model</h2>${modelEntries(true)}</section>\n    <section class=\"sec\"><h2>Browse by tag</h2>${tagLinkCols()}</section>\n  </div></main>${foot()}</div>`;\n}\n\n/* ══ V3 · Specimen ═══════════════════════════════════════════════════════\n   Axis: THE CARD IS A MOUNT AND A PRINTED LABEL.\n\n   A museum accession card does two things a tile does not: it gives the\n   object air, and it prints the same fields in the same order on every card\n   in the drawer, so the cards can be read against each other without reading\n   their prose. Every line of the label is a field the record actually\n   carries; a record missing one prints what is missing rather than dropping\n   the line, because a blank line on a label is information. */\nfunction spCard(r){\n  return `<article class=\"sp\">\n    <div class=\"mount\">${shot(r, 274, 342)}</div>\n    <h3 class=\"det\"><a href=\"/prompts/${esc(r.slug || r.id)}\">${esc(r.title)}</a></h3>\n    <dl class=\"label\">\n      <dt>Accession</dt><dd>IMG-${esc(r.id)}</dd>\n      <dt>Model</dt><dd>${r.models.length\n        ? `<span class=\"mlinks\">${r.models.map(m =>\n            `<a class=\"ml\" href=\"/prompts/models/${slug(m)}\">${esc(m)}</a>`).join(\"\")}</span>`\n        : \"no model named on the source post\"}</dd>\n      <dt>Technique</dt><dd>${r.techs.length ? esc(r.techs.join(\" · \")) : \"none recorded\"}</dd>\n      <dt>Subject</dt><dd>${r.subjects.length ? esc(r.subjects.join(\" · \")) : \"not determined\"}${\n        r.uses.length ? ` · for ${esc(r.uses.join(\", \").toLowerCase())}` : \"\"}</dd>\n      <dt>Extent</dt><dd>${esc(extent(r))}${r.n > 1 ? ` · ${r.n} frames` : \"\"}</dd>\n      <dt>Collected</dt><dd>${esc(r.handle || \"unattributed\")} · ${n(r.likes)} likes ·\n        ${n(r.saves)} saves</dd>\n    </dl>\n    <details>\n      <summary>Description</summary>\n      <pre class=\"prompt\">${promptHTML(r.prompt)}</pre>\n    </details>\n    <div class=\"acts\">${copyBtn(r, \"sm primary\")}\n      <a class=\"btn sm\" href=\"/prompts/${esc(r.slug || r.id)}\">Full record →</a></div>\n  </article>`;\n}\nfunction v3Results(){\n  const res = results();\n  if (!res.length) return emptyState();\n  return `<div class=\"cabinet\">${res.map(spCard).join(\"\")}</div>`;\n}\nfunction v3(){\n  return `<div class=\"v3 taste\">${chrome()}<main id=\"main\"><div class=\"wrap\">\n    <header class=\"hero\">\n      <p class=\"eyebrow\">Image gallery</p>\n      <h1 class=\"tier-index\">Video prompts</h1>\n      <p class=\"lede\">Catalogued rather than listed. Every card mounts its picture and\n        prints the same six-line label underneath, so two prompts can be compared by\n        looking rather than by reading.</p>\n      ${searchForm()}\n    </header>\n    <section class=\"sec\"><h2>Narrow the drawer</h2>${facetGroups()}</section>\n    <section class=\"sec\">\n      <div class=\"sec-head\"><h2>Editor's pick</h2>\n        <span class=\"count end\" data-count>${countLine(results())}</span></div>\n      <div class=\"legend\">\n        <span><b>Accession</b> — the id of the post it was collected from</span>\n        <span><b>Extent</b> — length and format of the stored text</span>\n        <span><b>Collected</b> — the author, and the reach of the original post</span>\n      </div>\n      <div data-results>${v3Results()}</div>\n    </section>\n    <section class=\"sec\"><h2>Browse by model</h2>${modelEntries(true)}</section>\n    <section class=\"sec\"><h2>Browse by tag</h2>${tagLinkCols()}</section>\n  </div></main>${foot()}</div>`;\n}\n\n/* ══ V4 · Deck ═══════════════════════════════════════════════════════════\n   Axis: HOW MANY CARDS AT ONCE.\n\n   The other directions answer \"show me the set\". This one answers \"let me\n   actually look at one\" — a single card at reading size, with the rest of\n   the set stacked visibly behind it and a step through them. It is the only\n   direction where the prompt is legible without a second surface, and the\n   only one where you cannot scan. Both of those are the point. */\nfunction dkCard(r){\n  return `<article class=\"dc\">\n    ${shot(r, 480, 520)}\n    <div class=\"side\">\n      <h3><a href=\"/prompts/${esc(r.slug || r.id)}\">${esc(r.title)}</a></h3>\n      ${metaRow(r)}\n      ${tagRow(r)}\n      <pre class=\"prompt\">${promptHTML(r.prompt)}</pre>\n      <div class=\"dcacts\">${copyBtn(r, \"primary\")}\n        <a class=\"btn\" href=\"/prompts/${esc(r.slug || r.id)}\">Full prompt →</a>${\n        r.models.length ? `<a class=\"btn ghost\"\n          href=\"/prompts/models/${slug(r.models[0])}\">All ${esc(r.models[0])} prompts →</a>` : \"\"}\n      </div>\n    </div>\n  </article>`;\n}\nfunction v4Results(){\n  const res = results();\n  if (!res.length) return emptyState();\n  if (state.di >= res.length) state.di = 0;\n  return `<div class=\"deckwrap\">\n    <div class=\"deck\" data-deck tabindex=\"0\" role=\"group\"\n      aria-label=\"Image prompt deck. Press the left and right arrow keys to step through it.\">\n      ${res.map(dkCard).join(\"\")}\n    </div>\n    <div class=\"dknav\">\n      <button class=\"btn\" type=\"button\" data-step=\"-1\">← Previous</button>\n      <button class=\"btn\" type=\"button\" data-step=\"1\">Next →</button>\n      <p class=\"dkpos\" data-dkpos aria-live=\"polite\">${state.di + 1} of ${res.length}</p>\n      <p class=\"dkhint\">The stack beh olor:var(--muted-fg);white-space:nowrap}\n.pill.cand{color:var(--cand);border-color:color-mix(in srgb,var(--cand) 35%,transparent)}\n.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}\n\n/* Facets. Chips sit 32px tall; ::after lifts the hit area to 44px and the 12px\n   gap is exactly the halo width on each side, so no two targets overlap. */\n.axes{display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(232px,1fr))}\n.axes .ax .axh{display:flex;gap:10px;align-items:baseline;margin-bottom:12px}\n.axes .ax .axh .n{font:500 11px/1 var(--mono);color:var(--faint-fg);font-variant-numeric:tabular-nums}\n.chips{display:flex;gap:12px;flex-wrap:wrap}\n.chip{border:1px solid var(--border);border-radius:999px;padding:7px 12px;background:transparent;\n  color:var(--muted-fg);font-size:12.5px;display:inline-flex;gap:6px;align-items:center;\n  position:relative;\n  transition-property:background-color,border-color,color;\n  transition-duration:150ms;transition-timing-function:ease-out}\n.chip::after{content:\"\";position:absolute;inset:-6px}\n.chip:active{transform:scale(.96)}\n@media (hover:hover) and (pointer:fine){\n  .chip:hover{color:var(--fg);border-color:var(--border-strong)} }\n.chip[aria-pressed=\"true\"]{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}\n.chip small{font:10.5px var(--mono);opacity:.7;font-variant-numeric:tabular-nums}\n\n.empty{border:1px dashed var(--border-strong);border-radius:var(--r);padding:40px 26px;\n  min-height:300px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;\n  gap:12px;background:repeating-linear-gradient(-45deg,transparent 0 10px,\n    color-mix(in srgb,var(--fg) 3%,transparent) 10px 20px)}\n.empty h3{font-size:19px;letter-spacing:-.01em}\n.empty p{color:var(--muted-fg);font-size:13.5px;max-width:56ch;text-wrap:pretty}\n\n.shot{aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--muted);position:relative;\n  display:grid;place-items:center}\n.shot img{width:100%;height:100%;object-fit:cover;display:block}\n.shot .mb{position:absolute;left:7px;bottom:7px;background:rgb(0 0 0 / .55);color:#fff;\n  font:500 9.5px/1 var(--mono);letter-spacing:.05em;padding:4px 7px;border-radius:5px}\n\n.mono{font:12px/1.7 var(--mono);white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word}\n.varmark{background:color-mix(in srgb,var(--cand) 22%,transparent);color:var(--cand);\n  border-radius:4px;padding:0 3px}\n\n.creators{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}\n.creator{border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;\n  flex-direction:column;gap:8px;align-items:flex-start;\n  transition-property:border-color,background-color;transition-duration:150ms;transition-timing-function:ease-out}\n@media (hover:hover) and (pointer:fine){ .creator:hover{border-color:var(--border-strong)} }\n.creator .av{width:34px;height:34px;border-radius:50%;background:var(--muted);flex:none;\n  display:block;overflow:hidden}\n.creator .av img{width:100%;height:100%;object-fit:cover;display:block;outline:none}\n.creator b{font-size:14.5px;font-weight:600}\n.creator span{font:11px/1.5 var(--mono);color:var(--faint-fg);font-variant-numeric:tabular-nums}\n\n.about{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}\n.mock{border:1px solid var(--border);border-radius:var(--r);background:var(--card);overflow:hidden}\n.mock .bar{height:34px;border-bottom:var(--hairline) solid var(--border);display:flex;gap:6px;\n  align-items:center;padding:0 13px}\n.mock .bar i{width:7px;height:7px;border-radius:50%;background:var(--muted-fg);opacity:.5;font-style:normal}\n.mock .bd{padding:16px;display:grid;gap:10px}\n.mock .bd p{font-size:13.5px;color:var(--muted-fg);text-wrap:pretty}\n.mock .bd h3{font:500 10.5px/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase;\n  color:var(--faint-fg)}\n\n/* The composer. Same parts as the shipped box; each variant places it differently. */\n.genbox{border:1px solid var(--border);border-radius:18px;background:var(--card);padding:14px}\n.genbox textarea{width:100%;border:1px solid var(--border);border-radius:12px;background:var(--bg);\n  color:var(--fg);font:16px/1.55 var(--sans);padding:10px 12px;outline:none;resize:vertical;min-height:76px}\n@media (min-width:768px){ .genbox textarea{font-size:13.5px} }\n.genbox textarea:focus-visible{border-color:var(--border-strong)}\n.genbox textarea::placeholder{color:var(--faint-fg)}\n.genrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}\n.genrow .sp{flex:1}\n.genmodel{font:11px/1 var(--mono);color:var(--muted-fg);border:1px solid var(--border);\n  border-radius:999px;padding:7px 10px}\n.genhint{font:11px/1.5 var(--mono);color:var(--faint-fg);font-variant-numeric:tabular-nums}\n\nfooter.foot{padding:30px 28px 22px;border-top:var(--hairline) solid var(--border);\n  color:var(--faint-fg);font:11.5px/1.6 var(--mono)}\n.footnav{display:grid;gap:26px 20px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));margin-bottom:28px}\n.footnav h3{font:500 10.5px/1.5 var(--mono);letter-spacing:.07em;text-transform:uppercase;\n  color:var(--faint-fg);margin:0 0 9px}\n.footnav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}\n/* Sitemap rows sit at 40px, the concession the craft bar allows for a footer of\n   this size; anything taller pushes the fifth column off a phone screen. */\n.footnav a{color:var(--muted-fg);font:13px/1.5 var(--sans);display:flex;align-items:center;min-height:40px;\n  transition-property:color;transition-duration:150ms;transition-timing-function:ease-out}\n@media (hover:hover) and (pointer:fine){\n  .footnav a:hover{color:var(--fg);text-decoration:underline;text-underline-offset:2px} }\n.footlegal{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;\n  padding-top:16px;border-top:var(--hairline) solid var(--border)}\n\n@media (max-width:640px){\n  .v2 .hero,.v3 .hero,.v4 .hero{padding-left:18px;padding-right:18px}\n  section.sec{padding-left:18px;padding-right:18px}\n  .navlinks{display:none}\n}\n\n/* Variant 1 is the shipped page, in its own document. */\n.baseline{display:block;width:100%;height:100dvh;border:0}\n\n/* ══ V2 · Contact sheet — the results are the argument ════════════════════ */\n.v2 .hero{padding:56px 28px 40px;display:grid;gap:26px;\n  grid-template-columns:minmax(0,1fr) minmax(300px,420px);align-items:end}\n.v2 .hero .stage-note{margin-top:10px}\n.sheet{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(196px,1fr))}\n.tile{border:1px solid var(--border);border-radius:var(--r);padding:9px;display:flex;\n  flex-direction:column;gap:9px;background:var(--bg);min-width:0;\n  transition-property:border-color;transition-duration:150ms;transition-timing-function:ease-out}\n@media (hover:hover) and (pointer:fine){ .tile:hover{border-color:var(--border-strong)} }\n.tile .shot{border-radius:calc(var(--r) - 9px)}\n.tile .info{display:flex;flex-direction:column;gap:7px;min-width:0}\n.tile h3{font-size:13.5px;line-height:1.32;display:-webkit-box;-webkit-line-clamp:2;\n  -webkit-box-orient:vertical;overflow:hidden}\n.tile .micro{font:10.5px/1.5 var(--mono);color:var(--faint-fg);font-variant-numeric:tabular-nums;\n  display:flex;gap:8px;flex-wrap:wrap}\n.tile .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}\n.tile .full{display:none}\n.tile[data-open]{grid-column:1 / -1;display:grid;grid-template-columns:280px minmax(0,1fr);\n  gap:18px;padding:14px;border-color:var(--border-strong)}\n.tile[data-open] .shot{aspect-ratio:4/5}\n.tile[data-open] h3{-webkit-line-clamp:unset;font-size:17px;letter-spacing:-.01em}\n.tile[data-open] .full{display:block;border:1px solid var(--border);border-radius:10px;\n  background:var(--card);padding:12px 13px;max-height:340px;overflow:auto}\n@media (max-width:700px){\n  .tile[data-open]{grid-template-columns:minmax(0,1fr)}\n  .v2 .hero{grid-template-columns:minmax(0,1fr);align-items:stretch;padding-top:40px}\n}\n\n/* ══ V3 · Spec sheet — the model as a data set ════════════════════════════ */\n.v3 .hero{padding:56px 28px 40px;display:grid;gap:30px;\n  grid-template-columns:minmax(0,1fr) minmax(300px,460px);align-items:end}\n/* The display size is set against the full measure; in a half-width column it\n   would break the model name across two lines. */\n.v3 .hero h1{font-size:clamp(32px,4.4vw,50px)}\n.profile{border:1px solid var(--border);border-radius:var(--r);overflow:hidden}\n.profile .prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:9px 14px;\n  border-bottom:var(--hairline) solid var(--border);font:12.5px/1.55 var(--mono);\n  font-variant-numeric:tabular-nums}\n.profile .prow:last-child{border-bottom:0}\n@media (max-width:560px){\n  .profile .prow{grid-template-columns:minmax(0,1fr);gap:2px}\n  .profile .prow dd{text-align:left}\n}\n.profile .prow dt{color:var(--faint-fg);min-width:0;overflow-wrap:break-word}\n.profile .prow dd{margin:0;text-align:right;color:var(--fg)}\n.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r)}\ntable.spec{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}\ntable.spec th,table.spec td{text-align:left;padding:10px 12px;vertical-align:top;\n  border-bottom:var(--hairline) solid var(--border)}\ntable.spec thead th{position:sticky;top:0;background:var(--bg);z-index:var(--z-sticky);\n  padding:0;border-bottom:1px solid var(--border-strong)}\ntable.spec thead th .sortbtn{width:100%;display:flex;align-items:center;gap:6px;min-height:44px;\n  padding:0 12px;background:transparent;border:0;font:500 10.5px/1 var(--mono);letter-spacing:.07em;\n  text-transform:uppercase;color:var(--faint-fg);cursor:pointer;\n  transition-property:color;transition-duration:150ms;transition-timing-function:ease-out}\n@media (hover:hover) and (pointer:fine){ table.spec .sortbtn:hover{color:var(--fg)} }\ntable.spec .sortbtn:active{transform:scale(.96)}\ntable.spec th[aria-sort] .sortbtn{color:var(--fg)}\ntable.spec th.plain{padding:0 12px;font:500 10.5px/44px var(--mono);letter-spacing:.07em;\n  text-transform:uppercase;color:var(--faint-fg)}\ntable.spec .ttl{font-weight:500;display:block;max-width:38ch}\ntable.spec .num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px;white-space:nowrap}\ntable.spec td.act{white-space:nowrap}\ntable.spec td.act .btn{margin-right:10px}\ntable.spec tr.detail td{background:var(--card);padding:14px 12px}\ntable.spec tr.detail .mono{max-height:360px;overflow:auto;display:block}\n.v3 .genstrip{margin-top:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;\n  border:1px dashed var(--border-strong);border-radius:var(--r);padding:14px 16px;\n  font:12px/1.6 var(--mono);color:var(--muted-fg)}\n.v3 .genstrip .sp{flex:1}\n@media (max-width:860px){ .v3 .hero{grid-template-columns:minmax(0,1fr);padding-top:40px} }\n/* On a phone the table keeps only the four columns you act on: what it is, how\n   long it is, and the two buttons. Everything else is a sort key, not a\n   decision, and the row number is decoration. */\n@media (max-width:760px){\n  table.spec .c-use,table.spec .c-style,table.spec .c-likes,\n  table.spec .c-idx,table.spec .c-shape,table.spec .c-who{display:none}\n  table.spec{min-width:0}\n  table.spec .ttl{max-width:20ch}\n  table.spec th,table.spec td{padding:10px 8px}\n  table.spec td.act{white-space:normal;display:flex;flex-direction:column;gap:8px;align-items:stretch}\n  table.spec td.act .btn{margin-right:0}\n}\n\n/* ══ V4 · Anthology — nothing truncated ══════════════════════════════════ */\n.v4 .hero{padding:56px 28px 40px}\n.v4 .hero h1{font-family:var(--serif);font-weight:400;letter-spacing:-.02em}\n.toc{margin-top:26px;border-top:1px solid var(--border-strong);border-bottom:1px solid var(--border-strong)}\n.toc ol{list-style:none;margin:0;padding:0;columns:2;column-gap:34px}\n.toc li{break-inside:avoid}\n.toc a{display:flex;gap:10px;align-items:baseline;min-height:40px;padding:2px 0;\n  border-bottom:var(--hairline) solid var(--border);font-size:13.5px;\n  transition-property:color;transition-duration:150ms;transition-timing-function:ease-out}\n.toc a .i{font:11px/1 var(--mono);color:var(--faint-fg);font-variant-numeric:tabular-nums;flex:none;width:20px}\n.toc a .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted-fg)}\n.toc a .l{font:11px/1 var(--mono);color:var(--faint-fg);font-variant-numeric:tabular-nums;flex:none}\n@media (hover:hover) and (pointer:fine){ .toc a:hover .t{color:var(--fg)} }\n@media (max-width:700px){ .toc ol{columns:1} }\n.anth{max-width:74ch}\n.grp{margin-top:44px}\n.grp > h3{font:500 11px/1.5 var(--mono);letter-spacing:.09em;text-transform:uppercase;\n  color:var(--faint-fg);padding-bottom:10px;border-bottom:1px solid var(--border-strong)}\n.entry{padding:34px 0;border-bottom:var(--hairline) solid var(--border);\n  display:grid;grid-template-columns:34px minmax(0,1fr);gap:20px}\n.entry .idx{font:400 22px/1 var(--serif);color:var(--faint-fg);font-variant-numeric:tabular-nums;padding-top:2px}\n.entry h4{margin-bottom:8px;font-family:var(--serif);font-weight:600;font-size:19px;\n  letter-spacing:-.01em;line-height:1.25}\n.entry .who{display:flex;gap:9px;align-items:center;font:11.5px/1.5 var(--mono);color:var(--faint-fg);\n  flex-wrap:wrap;font-variant-numeric:tabular-nums}\n.entry .who .av{width:22px;height:22px;border-radius:50%;background:var(--muted);overflow:hidden;\n  flex:none;display:block}\n.entry .who .av img{width:100%;height:100%;object-fit:cover;display:block;outline:none}\n.entry .plate{margin:16px 0;border-radius:10px;overflow:hidden;background:var(--muted);\n  width:190px;aspect-ratio:4/5;float:right;margin-left:22px;margin-top:4px}\n.entry .plate img{width:100%;height:100%;object-fit:cover;display:block}\n.entry .body{border-left:2px solid var(--border-strong);padding:2px 0 2px 16px;margin-top:16px;\n  color:var(--muted-fg)}\n.entry .acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;clear:both}\n.entry .tagline{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}\n@media (max-width:640px){\n  .entry{grid-template-columns:minmax(0,1fr);gap:8px}\n  .entry .idx{font-size:16px}\n  .entry .plate{float:none;margin:16px 0 0;width:100%;max-width:220px}\n}\n\n@media (prefers-reduced-motion: reduce){\n  html{scroll-behavior:auto}\n  *,*::before,*::after{transition-duration:1ms !important;animation-duration:1ms !important;\n    animation-iteration-count:1 !important;scroll-behavior:auto !important}\n}\n</style>\n\n<style id=\"linear-dark-theme\">\n/* ─────────────────────────────────────────────────────────────────────────\n   Linear-derived dark theme for the prototype pickers.\n\n   Values come from the token snapshot at\n   `specs/images/linear-design-tokens.css` (Linear public-site CSS, snapshot\n   2026-09-03), not from memory. This is a COLOUR re-theme only: type and\n   geometry stay on the project's own system, because `frontend/AGENTS.md` §7.6\n   has not ruled on a web font and Linear's faces (Inter Variable, Berkeley\n   Mono, Tiempos Headline) are not licensed here. Weights stay 400/600.\n\n   The four pickers were written at different times and use three different\n   token vocabularies (`--background`/`--bg`, `--foreground`/`--fg`,\n   `--muted`/`--muted-fg`, `--faint`/`--faint-fg`, `--font-sans`/`--sans`).\n   Every unambiguous alias is set, so one block themes all four — see the\n   note on `--muted` below for the one token deliberately skipped.\n\n   Contrast, measured against the canvas ladder (WCAG 2, sRGB):\n\n     token                 #08090a  #0f1011  #141516  #191a1b\n     --foreground #f7f8f8    18.73    17.90    17.18    16.38\n     --muted-fg   #d0d6e0    13.64    13.04    12.52    11.93\n     --faint      #8a8f98     6.13     5.86     5.63     5.36\n     --accent     #7170ff     5.18     4.96     4.76     4.53\n     --ok         #4cc38a     9.00     8.60     8.25     7.87\n     white on brand fill #5e6ad2 …………………………………………………… 4.70\n\n   Three deliberate departures from Linear's own dark tokens, each because a\n   token Linear uses decoratively is used here as text:\n\n   1. `--faint` takes Linear's TERTIARY ink `#8a8f98`, not its quaternary\n      `#62666d`. Quaternary measures 3.45:1 — below the 4.5:1 floor — and this\n      project spends `--faint` on 11px mono captions, which is text.\n   2. `--accent` takes `#7170ff`, NOT the `#5252f5` that `frontend/CLAUDE.md`\n      mandates. That mandate is a LIGHT-mode repair: `#7070ff` fails AA on all\n      four light surfaces (3.30–3.85) and `#5252f5` fixes it. Inverted, the\n      rule inverts too — `#5252f5` measures 3.69:1 on `#08090a` and would be\n      the unreadable one. Same intent, opposite value.\n   3. `--ok` lifts Linear's `#27a644` to `#4cc38a`. Per the `color` skill,\n      brand colours carried into dark at full saturation vibrate; lightness\n      goes up and chroma comes down. It also buys 6.29:1 → 9.00:1 at 11px.\n   ───────────────────────────────────────────────────────────────────────── */\n\n:root[data-theme=\"linear-dark\"] {\n  color-scheme: dark;\n\n  /* Canvas ladder — level-0 is the page, level-1 insets, level-2 cards.\n     Dark mode keeps the layering hierarchy; it is not inverted light mode. */\n  --background: #08090a;  --bg: #08090a;\n  --surface:    #0f1011;\n  --card:       #141516;\n\n  /* Ink */\n  --foreground: #f7f8f8;  --fg: #f7f8f8;\n  /* --muted is deliberately NOT set. It is ink in L1/L4 but a translucent\n     SURFACE wash in L2/L3 (`color-mix(in srgb, var(--fg) 8%, transparent)`,\n     used only for avatar and media placeholders). Forcing one ink value here\n     painted light-grey boxes onto a near-black canvas in L3. Every file's own\n     definition self-corrects once --fg/--foreground flip and color-scheme is\n     dark, so the token is left alone on purpose. --muted-fg is unambiguous\n     ink and is set. */\n  --muted-fg: #d0d6e0;\n  --faint:      #8a8f98;  --faint-fg: #8a8f98;\n\n  /* Lines. Linear's dark borders are solid, not alpha-white — a translucent\n     white hairline glows on near-black instead of receding. */\n  --border:        #23252a;\n  --border-strong: #34343a;\n\n  /* Interaction. Indigo carries interaction semantics only: focus, links,\n     ::selection, and the single primary action per view. */\n  --accent:    #7170ff;\n  --accent-bg: #1b1c33;\n\n  /* The inverted button: Linear's own --color-button-invert-bg. */\n  --primary:    #e5e5e6;\n  --primary-fg: #08090a;\n\n  /* Status */\n  --ok:   #4cc38a;\n  --cand: #f0bf00;\n\n  /* L4's placeholder highlight, on Linear's orange */\n  --var-bg: #2a1a12;\n  --var-fg: #fc9a6e;\n\n  /* L1's Spotlight band sits below the page ladder on Linear's marketing black */\n  --bbd:    #010102;\n  --bmu:    rgb(247 248 248 / .68);\n  --bfaint: rgb(247 248 248 / .46);\n}\n\n/* The prototypes gate their dark-mode image outline on `prefers-color-scheme`,\n   which does not fire when the theme is forced by attribute. A tinted outline\n   picks up the surface behind it and reads as grime, so it must be pure white. */\n:root[data-theme=\"linear-dark\"] img { outline-color: rgb(255 255 255 / .1); }\n\n/* Selection carries the brand quietly and stays legible. */\n:root[data-theme=\"linear-dark\"] ::selection {\n  background: color-mix(in oklab, #5e6ad2, black 10%);\n  color: #fff;\n}\n\n/* Depth: on dark, a stacked shadow is invisible, so every elevation collapses\n   to a single low-opacity white ring. */\n:root[data-theme=\"linear-dark\"] [data-elevated] {\n  box-shadow: 0 0 0 1px rgb(255 255 255 / .09);\n}\n\n/* This page's own `.btn[data-copied]` hardcodes white text on `var(--ok)`\n   fill instead of routing through a foreground token. In light mode --ok is\n   a dark green (white text is correct, ~5.6:1) but in this dark theme --ok\n   is lifted to a light, legible-as-text green (#4cc38a) — white-on-white-ish\n   would read at ~2.2:1. Route it through --primary-fg instead of adding a\n   second override: --primary-fg already flips white→near-black across this\n   exact light/dark boundary, in step with --ok's own fill flipping\n   dark→light, so it lands correct in both themes without a new token. */\n:root[data-theme=\"linear-dark\"] .btn[data-copied] { color: var(--primary-fg); }\n</style>\n\n<style id=\"theme-toggle-style\">\n/* ─── Theme toggle · harness chrome, not design. Same dark-glass idiom as\n   the picker (rgba(10,10,10,.82) fill, blur+saturate backdrop, 13px system\n   font, 28px pill) but parked at the opposite corner so it never competes\n   with variant switching. Does not touch .proto-picker*. ────────────────── */\n.theme-toggle {\n  position: fixed;\n  bottom: 24px;\n  right: 24px;\n  z-index: 2147483647;\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  height: 28px;\n  padding: 0 12px;\n  border: 0;\n  border-radius: 999px;\n  background: rgba(10, 10, 10, 0.82);\n  -webkit-backdrop-filter: blur(12px) saturate(1.4);\n  backdrop-filter: blur(12px) saturate(1.4);\n  box-shadow:\n    0 0 0 1px rgba(255, 255, 255, 0.08) inset,\n    0 8px 24px rgba(0, 0, 0, 0.24),\n    0 2px 6px rgba(0, 0, 0, 0.12);\n  color: rgba(255, 255, 255, 0.55);\n  font: 13px/1 -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n  -webkit-font-smoothing: antialiased;\n  cursor: pointer;\n  touch-action: manipulation;\n  user-select: none;\n  -webkit-user-select: none;\n  transition: color 150ms ease-out;\n}\n\n.theme-toggle-dot {\n  width: 6px;\n  height: 6px;\n  border-radius: 50%;\n  background: currentColor;\n  opacity: .55;\n}\n\n@media (hover: hover) and (pointer: fine) {\n  .theme-toggle:hover { color: rgba(255, 255, 255, 0.85); }\n}\n\n.theme-toggle:active { transform: scale(0.97); }\n\n.theme-toggle:focus-visible {\n  outline: 2px solid rgba(255, 255, 255, 0.4);\n  outline-offset: 2px;\n}\n\n.theme-toggle[aria-pressed=\"true\"] { color: #fff; }\n.theme-toggle[aria-pressed=\"true\"] .theme-toggle-dot { opacity: 1; }\n\n@media (prefers-reduced-motion: reduce) {\n  .theme-toggle { transition: none; }\n}\n</style>\n\n\n\n<a class=\"skip\" href=\"#main\">Skip to content</a>\n<div id=\"stage\"></div>\n\n\n\n<script>\nconst DATA = [{\"id\": \"2073529429838696592\", \"slug\": \"concept-scroll-read-this-brief-script-the-sc-2073529429838696592\", \"title\": \"Scroll-scripted site build, shot by shot\", \"prompt\": \"concept + scroll: \\\"read this brief, script the scroll - what the visitor feels at second 3, 15, 40. scaffold the site with GSAP ScrollTrigger + Lenis.\\\" motion assets: \\\"generate the hero sting and one b-roll clip per section from the story. 3–5s, high-res.\\\" polish pass: \\\"bake in film grain, particles, vignette, glass cards, color tints, scroll pacing. no config.\\\" QA: \\\"check load speed, mobile breakpoints, and whether the scroll actually lands. rewrite whatever doesn't.\\\" WHAT THIS REPLACES: → web studio build: $6,000-$35,000+ → motion artist: $800-2,000/project → front-end dev: $2,000-10,000/project → weeks of handoffs: gone Fable 5 + Higgsfield: a subscription + a few dollars of credits. one session. SETUP IN 10 MINUTES: - install Claude Code - add the Higgsfield MCP + authenticate - drop your brief + references - let it scaffold, generate, and animate in one pass - preview, send fixes in plain English, ship the pipeline was the moat. it just became a prompt. Follow me, comment \\\"WEB\\\" and I'll send you the full step-by-step Playbook. full breakdown in the article 👇\", \"models\": [], \"uses\": [\"Web & motion design\"], \"styles\": [\"Cinematic\"], \"techs\": [], \"subjects\": [], \"kind\": \"video\", \"img\": \"https://pbs.twimg.com/amplify_video_thumb/2073529353984479232/img/zW1OLkU6lbHMkqFA.jpg?name=small\", \"imgs\": [\"https://pbs.twimg.com/amplify_video_thumb/2073529353984479232/img/zW1OLkU6lbHMkqFA.jpg?name=small\"], \"n\": 1, \"dur\": 14, \"ha es\": [\"Fashion\"], \"styles\": [\"Cinematic\"], \"techs\": [\"Camera movement / shot language\", \"Lip sync / dialogue\"], \"subjects\": [], \"kind\": \"video\", \"img\": \"https://pbs.twimg.com/amplify_video_thumb/2078813993645273089/img/4nQRj3B5LpuYV0XW.jpg?name=small\", \"imgs\": [\"https://pbs.twimg.com/amplify_video_thumb/2078813993645273089/img/4nQRj3B5LpuYV0XW.jpg?name=small\"], \"n\": 1, \"dur\": 15, \"handle\": \"@Kiber_Alla\", \"likes\": 562, \"saves\": 671, \"hv\": true, \"score\": 96.3}, {\"id\": \"2083168602363150527\", \"slug\": \"scene-a-day-in-new-york-shot-entirely-by-the-2083168602363150527\", \"title\": \"A day in New York, filmed by the subject\", \"prompt\": \"SCENE A day in New York shot entirely by the subject herself: waking in her hotel suite, coffee, getting ready, out into the city, back to the room at night. ACTIVE REFERENCES @ image1 — the hotel suite. Curved cove ceiling with warm LED coving, deep red carpet, cream walls, two black organic sculptures above a light wood headboard, white bedding with red pillows, twin bedside lamps, pale sofa, oval coffee table, sheer curtains, dark door. @ image2 — the subject. Young woman, shoulder-length wavy blonde hair with curtain bangs and highlights, light freckles, thin gold necklace, silver ring, dark brown off-the-shoulder knit with white diamond-stripe pattern. 100% matches the reference. CAMERA OWNERSHIP LOCK Only two positions exist. HELD: arm extended, camera 0.4-0.7m from her face, visible arm tension, tilt and step-bounce. PROPPED: camera on a surface she placed it on, crooked and fixed, with her moving in and out of frame. No operator shots, no tracking, nothing she could not have filmed alone. FORMAT Eight shots, 30s, seven HARD CUTS, no fades. Real-time. 0-4s SHOT 1 — PROPPED, morning room. 84° diagonal field of view, camera on the sideboard 3m from the bed at 1.1m, static and tilted. The suite matches @ image1: cove light on, curtains half open, cool daylight across the red carpet. n ? \"data-open\" : \"\"}>\n    ${shot(r)}\n    <div class=\"info\">\n      <h3>${esc(r.title)}</h3>\n      <p class=\"micro\"><span>${esc(r.handle || \"unattributed\")}</span>\n        <span>${n(r.prompt.length)} chars</span><span>${shapeOf(r)}</span>\n        ${vars.length ? `<span style=\"color:var(--cand)\">${vars.length} [BRACKET]</span>` : \"\"}</p>\n      ${isOpen ? `<div class=\"full\"><p class=\"mono\">${promptHtml(r)}</p></div>\n        <p class=\"micro\"><span>${esc((r.uses || []).join(\", \") || \"no use case tagged\")}</span>\n          <span>${esc((r.styles || []).join(\", \") || \"no style tagged\")}</span></p>` : \"\"}\n      <div class=\"acts\">\n        <button class=\"btn sm\" type=\"button\" data-toggle=\"${esc(r.id)}\" aria-expanded=\"${isOpen}\">\n          ${isOpen ? \"Close\" : \"Read\"}</button>\n        ${copyBtn(r)}\n        ${isOpen ? `<button class=\"btn sm\" type=\"button\" data-stage=\"${esc(r.id)}\">Stage</button>\n          <a class=\"btn ghost sm\" href=\"#\">Full prompt &rarr;</a>\n          <a class=\"btn ghost sm\" href=\"#\" rel=\"nofollow noopener\">View on X &#8599;</a>` : \"\"}\n      </div>\n    </div>\n  </article>`;\n}\nfunction v2(){\n  const rows = filtered();\n  return `<div class=\"v2\">${nav()}<div class=\"page\">${crumbs()}<main id=\"main\">\n    <section class=\"hero\">\n      <div>\n        <p class=\"eyebrow\" style=\"margin-bottom:14px\">Model</p>\n        <h1>${esc(MODEL)} prompts</h1>\n        <p class=\"lede count\">14 prompts in this sample name this model, and every one of them\n          published the picture it made. That is what the page leads with.</p>\n      </div>\n      ${tray()}\n    </section>\n    <section class=\"sec\">\n      <div class=\"sec-head\"><h2>All prompts</h2>\n        <span class=\"end\" data-count>${rows.length === RECS.length\n          ? `${RECS.length} results` : `${rows.length} of ${RECS.length}`}</span></div>\n      <div style=\"margin-bottom:26px\">${facetBlock()}</div>\n      ${rows.length ? `<div class=\"sheet\">${rows.map(tile).join(\"\")}</div>` : emptyState()}\n    </section>\n    ${creatorsSection()}\n    ${aboutSection()}\n  </main>${foot()}</div></div>`;\n}\n\n/* ══ V3 · Spec sheet ══════════════════════════════════════════════════════\n   Axis: the model as a data set. No pictures above the fold, a profile built\n   from the records themselves, and one sortable table you can compare down.\n   The composer box is gone — this page is for judging, not for writing. */\nlet sortKey = \"likes\", sortDir = -1;\nconst SORTS = {\n  title: r => r.title.toLowerCase(),\n  shape: r => shapeOf(r),\n  len:   r => r.prompt.length,\n  use:   r => (r.uses || []).join(\", \").toLowerCase(),\n  style: r => (r.styles || []).join(\", \").toLowerCase(),\n  who:   r => (r.handle || \"~\").toLowerCase(),\n  likes: r => r.likes || 0,\n};\nfunction sorted(rows){\n  const get = SORTS[sortKey] || SORTS.likes;\n  return [...rows].sort((a, b) => {\n    const x = get(a), y = get(b);\n    if (x < y) return -1 * sortDir;\n    if (x > y) return 1 * sortDir;\n    return 0;\n  });\n}\nfunction profile(){\n  const lens = RECS.map(r => r.prompt.length).sort((a, b) => a - b);\n  const mid = lens.length % 2 ? lens[(lens.length - 1) / 2]\n    : Math.round((lens[lens.length / 2 - 1] + lens[lens.length / 2]) / 2);\n  const j = RECS.filter(isJson).length;\n  const v = RECS.filter(r => varsOf(r).length).length;\n  const withImg = RECS.filter(r => r.img).length;\n  const noUse = RECS.filter(r => !(r.uses || []).length).length;\n  const topStyle = axisValues(\"style\")[0];\n  const rows = [\n    [\"Prompts naming this model\", \"14 of 35\"],\n    [\"Written as raw JSON\", `${j} of 14`],\n    [\"Shortest / median / longest\", `${n(lens[0])} / ${n(mid)} / ${n(lens[lens.length - 1])} chars`],\n    [\"Carrying [BRACKET] placeholders\", `${v} of 14`],\n    [\"Published with a picture\", `${withImg} of 14`],\n    [\"No use case tagged\", `${noUse} of 14`],\n    [\"Most common style\", topStyle ? `${topStyle[0]} (${topStyle[2]})` : \"—\"],\n    [\"Distinct creators\", String(creatorsOf().length)],\n  ];\n  return `<dl class=\"profile\">${rows.map(([k, v2]) =>\n    `<div class=\"prow\"><dt>${esc(k)}</dt><dd>${esc(v2)}</dd></div>`).join(\"\")}</dl>`;\n}\nfunction specHead(key, label, cls){\n  const on = sortKey === key;\n  return `<th scope=\"col\" class=\"${cls || \"\"}\" ${on ? `aria-sort=\"${sortDir === 1 ? \"ascending\" : \"descending\"}\"` : \"\"}>\n    <button class=\"sortbtn\" type=\"button\" data-sort=\"${esc(key)}\">${esc(label)}\n      <span aria-hidden=\"true\">${on ? (sortDir === 1 ? \"↑\" : \"↓\") : \"·\"}</span></button></th>`;\n}\nfunction specRow(r, i){\n  const isOpen = open.has(r.id), vars = varsOf(r);\n  return `<tr class=\"rec\">\n    <td class=\"num c-idx\">${String(i + 1).padStart(2, \"0\")}</td>\n    <td><a class=\"ttl\" href=\"#\">${esc(r.title)}</a>\n      ${vars.length ? `<span class=\"pill cand\" style=\"margin-top:6px\">${vars.length} [BRACKET]</span>` : \"\"}</td>\n    <td class=\"num c-shape\">${shapeOf(r)}</td>\n    <td class=\"num\">${n(r.prompt.length)}</td>\n    <td class=\"c-use\">${esc((r.uses || []).join(\", \") || \"—\")}</td>\n    <td class=\"c-style\">${esc((r.styles || []).join(\", \") || \"—\")}</td>\n    <td class=\"num c-who\">${esc(r.handle || \"unattributed\")}</td>\n    <td class=\"num c-likes\">${n(r.likes)}</td>\n    <td class=\"act\"><button class=\"btn sm\" type=\"button\" data-toggle=\"${esc(r.id)}\"\n        aria-expanded=\"${isOpen}\">${isOpen ? \"Hide text\" : \"Show text\"}</button>${copyBtn(r, \"sm\")}</td>\n  </tr>${isOpen ? `<tr class=\"detail\"><td colspan=\"9\">\n    <p class=\"mono\">${promptHtml(r)}</p>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center\">\n      <div style=\"width:104px;flex:none\">${shot(r)}</div>\n      <a class=\"btn sm\" href=\"#\">Full prompt &rarr;</a>\n      <a class=\"btn sm\" href=\"#\" rel=\"nofollow noopener\">View on X &#8599;</a>\n      <a class=\"btn primary sm\" href=\"#\">Generate in bo &rarr;</a></div></td></tr>` : \"\"}`;\n}\nfunction v3(){\n  const rows = sorted(filtered());\n  return `<div class=\"v3\">${nav()}<div class=\"page\">${crumbs()}<main id=\"main\">\n    <section class=\"hero\">\n      <div>\n        <p class=\"eyebrow\" style=\"margin-bottom:14px\">Model</p>\n        <h1>${esc(MODEL)} prompts</h1>\n        <p class=\"lede count\">14 prompts in this sample name this model. Before you read one, here is\n          what the fourteen are made of.</p>\n      </div>\n      <div>${profile()}</div>\n    </section>\n    <section class=\"sec\">\n      <div class=\"sec-head\"><h2>All prompts</h2>\n        <span class=\"end\" data-count>${rows.length === RECS.length\n          ? `${RECS.length} rows` : `${rows.length} of ${RECS.length}`}</span></div>\n      <p class=\"subline\">Sort any column, then open the text of the row you want. On a narrow\n        screen the sort keys drop away and the table keeps what you act on: the prompt, its\n        length, and the two buttons.</p>\n      <div style=\"margin-bottom:26px\">${facetBlock()}</div>\n      ${rows.length ? `<div class=\"tablewrap\"><table class=\"spec\">\n        <caption class=\"vh\">${esc(MODEL)} prompts, sortable</caption>\n        <thead><tr>\n          <th scope=\"col\" class=\"plain c-idx\">#</th>\n          ${specHead(\"title\", \"Prompt\")}\n          ${specHead(\"shape\", \"Shape\", \"c-shape\")}\n          ${specHead(\"len\", \"Chars\")}\n          ${specHead(\"use\", \"Use case\", \"c-use\")}\n          ${specHead(\"style\", \"Style\", \"c-style\")}\n          ${specHead(\"who\", \"Creator\", \"c-who\")}\n          ${specHead(\"likes\", \"Likes\", \"c-likes\")}\n          <th scope=\"col\" class=\"plain\">Take it</th>\n        </tr></thead>\n        <tbody>${rows.map(specRow).join(\"\")}</tbody></table></div>` : emptyState()}\n      <div class=\"genstrip\"><span>There is no composer on this page. Generation happens in bo;\n        this page is for deciding which of the fourteen is worth taking there.</span>\n        <span class=\"sp\"></span><a class=\"btn primary\" href=\"#\">Generate in bo &rarr;</a></div>\n    </section>\n    ${creatorsSection()}\n    ${aboutSection()}\n  </main>${foot()}</div></div>`;\n}\n\n/* ══ V4 · Anthology ═══════════════════════════════════════════════════════\n   Axis: nothing truncated. One reading column, all fourteen printed in full,\n   grouped by the shape of the text, with an index because it is long. */\nfunction entry(r, i){\n  const vars = varsOf(r), h = (r.handle || \"\").replace(\"@\", \"\");\n  return `<article class=\"entry\" id=\"e-${esc(r.id)}\">\n    <div class=\"idx\">${String(i + 1).padStart(2, \"0\")}</div>\n    <div>\n      <h4>${esc(r.title)}</h4>\n      <p class=\"who\"><span class=\"av\">${avatarImg(h, 22)}</span>\n        <span>${esc(r.handle || \"unattributed\")}</span><span>&middot;</span>\n        <span>${n(r.prompt.length)} characters</span><span>&middot;</span>\n        <span>${n(r.likes)} likes</span>${r.hv ? `<span class=\"pill ok\">Popular</span>` : \"\"}</p>\n      ${r.img ? `<figure class=\"plate\"><img src=\"${esc(r.img)}\" alt=\"Result posted with ${esc(r.title)}\"\n        loading=\"lazy\" referrerpolicy=\"no-referrer\" width=\"380\" height=\"475\"></figure>`\n        : `<figure class=\"plate\" aria-hidden=\"true\"></figure>`}\n      <div class=\"tagline\">${[...(r.uses || []), ...(r.styles || []), ...(r.subjects || [])]\n        .map(t => `<span class=\"pill\">${esc(t)}</span>`).join(\"\")\n        || `<span class=\"pill\">untagged</span>`}\n        ${vars.length ? `<span class=\"pill cand\">${vars.length} [BRACKET]</span>` : \"\"}</div>\n      <div class=\"body\"><p class=\"mono\">${promptHtml(r)}</p></div>\n      <div class=\"acts\">${copyBtn(r, \"primary\")}\n        <button class=\"btn\" type=\"button\" data-stage=\"${esc(r.id)}\">Send to the scratchpad</button>\n        <a class=\"btn ghost\" href=\"#\">Full prompt &rarr;</a>\n        <a class=\"btn ghost\" href=\"#\" rel=\"nofollow noopener\">View on X &#8599;</a>\n        <a class=\"btn ghost\" href=\"#toc\">Back to the index &uarr;</a></div>\n    </div>\n  </article>`;\n}\nfunction v4(){\n  const rows = filtered();\n  const groups = [\n    [\"Prose prompts\", rows.filter(r => !isJson(r))],\n    [\"Structured JSON prompts\", rows.filter(isJson)],\n  ].filter(g => g[1].length);\n  let k = 0;\n  const r = staged ? byId(staged) : null;\n  return `<div class=\"v4\">${nav()}<div class=\"page\">${crumbs()}<main id=\"main\">\n    <section class=\"hero\">\n      <p class=\"eyebrow\" style=\"margin-bottom:14px\">Model</p>\n      <h1>${esc(MODEL)} prompts</h1>\n      <p class=\"lede count\">All 14, printed whole. The shortest is 303 characters and the longest is\n        3,990; nothing here is cut to fit a card.</p>\n      <nav class=\"toc\" id=\"toc\" aria-label=\"Index of prompts\">\n        <ol>${rows.map((rec, i) => `<li><a href=\"#e-${esc(rec.id)}\">\n          <span class=\"i\">${String(i + 1).padStart(2, \"0\")}</span>\n          <span class=\"t\">${esc(rec.title)}</span>\n          <span class=\"l\">${n(rec.prompt.length)}</span></a></li>`).join(\"\")\n          || `<li><a href=\"#main\"><span class=\"i\">—</span>\n              <span class=\"t\">Nothing matches the filters below</span><span class=\"l\">0</span></a></li>`}</ol>\n      </nav>\n    </section>\n    <section class=\"sec\">\n      <div class=\"sec-head\"><h2>All prompts</h2>\n        <span class=\"end\" data-count>${rows.length === RECS.length\n          ? `${RECS.length} in full` : `${rows.length} of ${RECS.length}`}</span></div>\n      <div style=\"margin-bottom:26px\">${facetBlock()}</div>\n      <div class=\"anth\">${rows.length ? groups.map(([label, list]) =>\n        `<section class=\"grp\"><h3>${esc(label)} · ${list.length}</h3>\n          ${list.map(rec => entry(rec, k++)).join(\"\")}</section>`).join(\"\") : emptyState()}</div>\n    </section>\n    <section class=\"sec\">\n      <div class=\"sec-head\"><h2>Write your own</h2></div>\n      <p class=\"subline\">The box comes last on purpose. It is a scratchpad for after you have read\n        something worth changing, not a promise that this page can run it.</p>\n      <div class=\"genbox\" style=\"max-width:680px\">\n        <label class=\"vh\" for=\"gen4\">Your prompt</label>\n        <textarea id=\"gen4\" rows=\"5\" data-composer\n          placeholder=\"Send any prompt above to the scratchpad, then edit it here.\">${esc(composer)}</textarea>\n        <div class=\"genrow\"><span class=\"genmodel\">${esc(MODEL)}</span>\n          <span class=\"sp\"></span>\n          <button class=\"btn sm\" type=\"button\" data-copycomposer>Copy scratchpad</button>\n          <a class=\"btn primary\" href=\"#\">Generate in bo &rarr;</a></div>\n        <p class=\"genhint\">${r\n          ? `Loaded from ${esc(r.handle || \"an unattributed post\")} · ${n(r.prompt.length)} characters`\n          : \"Empty. Generation happens in bo; this page hands you the words.\"}</p>\n      </div>\n    </section>\n    ${creatorsSection()}\n    ${aboutSection()}\n  </main>${foot()}</div></div>`;\n}\n\n/* ─── Behaviour · delegated on #stage so the picker wiring stays verbatim ── */\nconst variants = [v2, v3, v4];\nconst stage = document.getElementById('stage');\nlet refocus = null;          /* css selector to restore focus to after a redraw */\n\n/* mount() paints inside a rAF, so the focus restore has to be queued behind it.\n   Without this, every chip toggle drops a keyboard user back to the top of the\n   document — the redraw is the whole page. */\nfunction redraw(){\n  mount(current);\n  const key = refocus; refocus = null;\n  if (!key) return;\n  const apply = () => { const el = stage.querySelector(key); if (el) el.focus(); };\n  if (document.hidden) setTimeout(apply, 0); else requestAnimationFrame(apply);\n}\n\nstage.addEventListener('click', e => {\n  const chip = e.target.closest('.chip[data-facet]');\n  if (chip){\n    const key = chip.getAttribute('data-facet'), val = chip.getAttribute('data-value');\n    sel[key].has(val) ? sel[key].delete(val) : sel[key].add(val);\n    refocus = `.chip[data-fk=\"${CSS.escape(key + \"|\" + val)}\"]`;\n    redraw();\n    return;\n  }\n  const clear = e.target.closest('[data-clear]');\n  if (clear){ AXES.forEach(a => sel[a[0]].clear()); redraw(); return; }\n\n  const copy = e.target.closest('[data-copy]');\n  if (copy){\n    const r = byId(copy.getAttribute('data-copy'));\n    confirmCopy(copy, r ? r.prompt : \"\");\n    return;\n  }\n  const copyc = e.target.closest('[data-copycomposer]');\n  if (copyc){ confirmCopy(copyc, composer); return; }\n\n  const tog = e.target.closest('[data-toggle]');\n  if (tog){\n    const id = tog.getAttribute('data-toggle');\n    open.has(id) ? open.delete(id) : open.add(id);\n    refocus = `[data-toggle=\"${CSS.escape(id)}\"]`;\n    redraw();\n    return;\n  }\n  const st = e.target.closest('[data-stage]');\n  if (st){\n    const r = byId(st.getAttribute('data-stage'));\n    if (r){ staged = r.id; composer = r.prompt; }\n    refocus = '[data-composer]';\n    redraw();\n    return;\n  }\n  const sort = e.target.closest('[data-sort]');\n  if (sort){\n    const key = sort.getAttribute('data-sort');\n    if (sortKey === key) sortDir = -sortDir;\n    else { sortKey = key; sortDir = (key === \"likes\" || key === \"len\") ? -1 : 1; }\n    refocus = `[data-sort=\"${CSS.escape(key)}\"]`;\n    redraw();\n  }\n});\n\nstage.addEventListener('input', e => {\n  if (!e.target.matches('[data-composer]')) return;\n  composer = e.target.value; staged = null;\n  /* Update the hint in place. A redraw here would eat the caret on every keypress. */\n  const hint = e.target.closest('.genbox')?.querySelector('.genhint');\n  if (hint) hint.textContent = composer.length\n    ? n(composer.length) + ' characters in the box'\n    : 'Empty. Generation happens in bo; this page hands you the words.';\n});\n\nfunction confirmCopy(btn, text){\n  const label = btn.getAttribute('data-label') || btn.textContent.trim();\n  btn.setAttribute('data-label', label);\n  const done = () => {\n    btn.textContent = 'Copied';\n    btn.setAttribute('data-copied', '');\n    setTimeout(() => { btn.textContent = label; btn.removeAttribute('data-copied'); }, 1500);\n  };\n  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, done); else done();\n}\n<\/script>\n\n<script>\n/* The picker is gone: this page IS the chosen variant.\n   proto-l3.html variant 4 — \"Anthology\" — promoted 2026-09-04. */\nconst paint = () => { stage.innerHTML = variants[2](); };\nif (document.hidden) setTimeout(paint, 0); else requestAnimationFrame(paint);\n<\/script>\n\n\n", "l4": "<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Prompt detail (Recipe)</title>\n\n<style>\n/* ─── Real materials: L4's own tokens, verbatim ─────────────────────────── */\n:root{\n  color-scheme: light dark;\n  --background: light-dark(rgb(255 255 255), rgb(22 22 24));\n  --surface: light-dark(rgb(250 250 251), rgb(28 28 31));\n  --foreground: light-dark(rgb(24 26 29), rgb(250 250 252));\n  --muted: light-dark(rgb(24 26 29 / 56%), rgb(250 250 252 / 56%));\n  --faint: light-dark(rgb(24 26 29 / 38%), rgb(250 250 252 / 38%));\n  --card: light-dark(rgb(255 255 255), rgb(32 32 36));\n  --border: light-dark(rgb(24 26 29 / 11%), rgb(255 255 255 / 13%));\n  --border-strong: light-dark(rgb(24 26 29 / 20%), rgb(255 255 255 / 24%));\n  --accent: light-dark(rgb(51 126 255), rgb(131 180 255));\n  --accent-bg: light-dark(rgb(233 240 255), rgb(20 36 62));\n  --var-bg: light-dark(rgb(255 238 218), rgb(70 44 16));\n  --var-fg: light-dark(rgb(160 74 2), rgb(255 180 108));\n  --ok: light-dark(rgb(0 133 61), rgb(74 200 124));\n  --font-sans: -apple-system, system-ui, \"Segoe UI\", \"PingFang SC\", \"Hiragino Sans GB\", sans-serif;\n  --font-mono: ui-monospace, SFMono-Regular, \"SF Mono\", Menlo, Consolas, monospace;\n  --r: 12px; --wrap: 780px;\n  --hairline: 1px;\n  /* one scale, used everywhere: in-flow raise < page nav < scrim < docked bar */\n  --z-raise: 1; --z-sticky: 40; --z-scrim: 50; --z-bar: 60; --z-skip: 70;\n}\n@media only screen and (min-resolution: 192dpi){ :root{ --hairline: .5px } }\n\n*,*::before,*::after{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\n@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }\nbody{margin:0;background:var(--background);color:var(--foreground);\n     font-family:var(--font-sans);font-size:15px;line-height:1.6;\n     -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;\n     font-synthesis:none;overflow-x:hidden}\na{color:inherit;text-decoration:none}\nh1,h2,h3,h4,p,figure,fieldset{margin:0}\nfieldset{border:0;padding:0;min-inline-size:0}\nbutton,a,input,select,textarea{touch-action:manipulation}\ninput,select,textarea{font-size:16px}\n:focus-visible{outline:2px solid var(--foreground);outline-offset:2px;border-radius:5px}\n[id]{scroll-margin-top:76px}\n.wrap{max-width:var(--wrap);margin:0 auto;padding:0 26px}\n.wide{max-width:1120px}\n.skip{position:absolute;left:-9999px;background:var(--foreground);color:var(--background);\n      padding:10px 14px;z-index:var(--z-skip);border-radius:8px}\n.skip:focus{left:12px;top:12px}\n.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}\nimg{outline:1px solid rgb(0 0 0 / .1);outline-offset:-1px}\n@media (prefers-color-scheme: dark){ img{outline-color:rgb(255 255 255 / .1)} }\n\n/* ─── Shared chrome ─────────────────────────────────────────────────────── */\n.nav{border-bottom:var(--hairline) solid var(--border);background:var(--background);\n     position:sticky;top:0;z-index:var(--z-sticky)}\n.nav .inner{max-width:1120px;margin:0 auto;padding:0 26px;display:flex;align-items:center;\n            gap:22px;min-height:56px;flex-wrap:wrap}\n.brand{font-weight:600;lett block themes all four — see the\n   note on `--muted` below for the one token deliberately skipped.\n\n   Contrast, measured against the canvas ladder (WCAG 2, sRGB):\n\n     token                 #08090a  #0f1011  #141516  #191a1b\n     --foreground #f7f8f8    18.73    17.90    17.18    16.38\n     --muted-fg   #d0d6e0    13.64    13.04    12.52    11.93\n     --faint      #8a8f98     6.13     5.86     5.63     5.36\n     --accent     #7170ff     5.18     4.96     4.76     4.53\n     --ok         #4cc38a     9.00     8.60     8.25     7.87\n     white on brand fill #5e6ad2 …………………………………………………… 4.70\n\n   Three deliberate departures from Linear's own dark tokens, each because a\n   token Linear uses decoratively is used here as text:\n\n   1. `--faint` takes Linear's TERTIARY ink `#8a8f98`, not its quaternary\n      `#62666d`. Quaternary measures 3.45:1 — below the 4.5:1 floor — and this\n      project spends `--faint` on 11px mono captions, which is text.\n   2. `--accent` takes `#7170ff`, NOT the `#5252f5` that `frontend/CLAUDE.md`\n      mandates. That mandate is a LIGHT-mode repair: `#7070ff` fails AA on all\n      four light surfaces (3.30–3.85) and `#5252f5` fixes it. Inverted, the\n      rule inverts too — `#5252f5` measures 3.69:1 on `#08090a` and would be\n      the unreadable one. Same intent, opposite value.\n   3. `--ok` lifts Linear's `#27a644` to `#4cc38a`. Per the `color` skill,\n      brand colours carried into dark at full saturation vibrate; lightness\n      goes up and chroma comes down. It also buys 6.29:1 → 9.00:1 at 11px.\n   ───────────────────────────────────────────────────────────────────────── */\n\n:root[data-theme=\"linear-dark\"] {\n  color-scheme: dark;\n\n  /* Canvas ladder — level-0 is the page, level-1 insets, level-2 cards.\n     Dark mode keeps the layering hierarchy; it is not inverted light mode. */\n  --background: #08090a;  --bg: #08090a;\n  --surface:    #0f1011;\n  --card:       #141516;\n\n  /* Ink */\n  --foreground: #f7f8f8;  --fg: #f7f8f8;\n  /* --muted is deliberately NOT set. It is ink in L1/L4 but a translucent\n     SURFACE wash in L2/L3 (`color-mix(in srgb, var(--fg) 8%, transparent)`,\n     used only for avatar and media placeholders). Forcing one ink value here\n     painted light-grey boxes onto a near-black canvas in L3. Every file's own\n     definition self-corrects once --fg/--foreground flip and color-scheme is\n     dark, so the token is left alone on purpose. --muted-fg is unambiguous\n     ink and is set. */\n  --muted-fg: #d0d6e0;\n  --faint:      #8a8f98;  --faint-fg: #8a8f98;\n\n  /* Lines. Linear's dark borders are solid, not alpha-white — a translucent\n     white hairline glows on near-black instead of receding. */\n  --border:        #23252a;\n  --border-strong: #34343a;\n\n  /* Interaction. Indigo carries interaction semantics only: focus, links,\n     ::selection, and the single primary action per view. */\n  --accent:    #7170ff;\n  --accent-bg: #1b1c33;\n\n  /* The inverted button: Linear's own --color-button-invert-bg. */\n  --primary:    #e5e5e6;\n  --primary-fg: #08090a;\n\n  /* Status */\n  --ok:   #4cc38a;\n  --cand: #f0bf00;\n\n  /* L4's placeholder highlight, on Linear's orange */\n  --var-bg: #2a1a12;\n  --var-fg: #fc9a6e;\n\n  /* L1's Spotlight band sits below the page ladder on Linear's marketing black */\n  --bbd:    #010102;\n  --bmu:    rgb(247 248 248 / .68);\n  --bfaint: rgb(247 248 248 / .46);\n}\n\n/* The prototypes gate their dark-mode image outline on `prefers-color-scheme`,\n   which does not fire when the theme is forced by attribute. A tinted outline\n   picks up the surface behind it and reads as grime, so it must be pure white. */\n:root[data-theme=\"linear-dark\"] img { outline-color: rgb(255 255 255 / .1); }\n\n/* Selection carries the brand quietly and stays legible. */\n:root[data-theme=\"linear-dark\"] ::selection {\n  background: color-mix(in oklab, #5e6ad2, black 10%);\n  color: #fff;\n}\n\n/* Depth: on dark, a stacked shadow is invisible, so every elevation collapses\n   to a single low-opacity white ring. */\n:root[data-theme=\"linear-dark\"] [data-elevated] {\n  box-shadow: 0 0 0 1px rgb(255 255 255 / .09);\n}\n</style>\n\n<style id=\"theme-toggle-style\">\n/* ─── Theme toggle · harness chrome, not design. Matches the picker's own\n   dark-glass idiom but parked clear of it, bottom-right. Not part of the\n   picker markup/CSS/JS: its own button, its own styles, its own script. ─── */\n.theme-toggle{\n  position: fixed;\n  bottom: 24px;\n  right: 24px;\n  z-index: 2147483647;\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  height: 28px;\n  padding: 0 14px;\n  border: 0;\n  border-radius: 999px;\n  background: rgba(10, 10, 10, 0.82);\n  -webkit-backdrop-filter: blur(12px) saturate(1.4);\n  backdrop-filter: blur(12px) saturate(1.4);\n  box-shadow:\n    0 0 0 1px rgba(255, 255, 255, 0.08) inset,\n    0 8px 24px rgba(0, 0, 0, 0.24),\n    0 2px 6px rgba(0, 0, 0, 0.12);\n  font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n  font-size: 13px;\n  line-height: 1;\n  color: rgba(255, 255, 255, 0.68);\n  cursor: pointer;\n  user-select: none;\n  -webkit-user-select: none;\n  -webkit-font-smoothing: antialiased;\n  transition-property: color;\n  transition-duration: 150ms;\n  transition-timing-function: ease-out;\n}\n.theme-toggle::after{ content:\"\"; position:absolute; inset:-8px; }\n.theme-toggle:active{ transform: scale(.96); }\n@media (hover:hover) and (pointer:fine){ .theme-toggle:hover{ color: rgba(255, 255, 255, 0.92); } }\n.theme-toggle:focus-visible{ outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }\n.theme-toggle[aria-pressed=\"true\"]{ color: #fff; }\n.theme-toggle .dot{\n  width: 6px; height: 6px; border-radius: 50%; flex: none;\n  background: rgba(255, 255, 255, 0.4);\n}\n.theme-toggle[aria-pressed=\"true\"] .dot{ background: #7170ff; }\n@media (prefers-reduced-motion: reduce){ .theme-toggle{ transition-duration: 1ms; } }\n\n/* V5 docks a fixed action bar at the true bottom of the window — exactly\n   where this toggle also lives. Move the toggle, not the design, mirroring\n   the picker's own body:has() treatment for the same variant so both pieces\n   of harness chrome clear the dock without touching its markup or CSS. */\nbody:has(#stage .v5) .theme-toggle { bottom: 76px; }\nbody:has(#stage .v5 .dock[data-open]) .theme-toggle { bottom: auto; top: 24px; }\n/* Under ~620px the picker's own centered top:24 band (353px wide) reaches\n   close enough to both edges that a right-docked toggle at the same band\n   collides with it. The picker has right of way; the toggle stands down\n   for the moment the sheet is open at that width, same as its label\n   already stands down piece by piece at these breakpoints. */\n@media (max-width: 700px) {\n  body:has(#stage .v5 .dock[data-open]) .theme-toggle { display: none; }\n}\n</style>\n\n<a class=\"skip\" href=\"#main\">Skip to content</a>\n<div id=\"stage\"></div>\n\n\n\n<script>\nconst DATA = [{\"id\": \"2073529429838696592\", \"slug\": \"concept-scroll-read-this-brief-script-the-sc-2073529429838696592\", \"title\": \"Scroll-scripted site build, shot by shot\", \"prompt\": \"concept + scroll: \\\"read this brief, script the scroll - what the visitor feels at second 3, 15, 40. scaffold the site with GSAP ScrollTrigger + Lenis.\\\" motion assets: \\\"generate the hero sting and one b-roll clip per section from the story. 3–5s, high-res.\\\" polish pass: \\\"bake in film grain, particles, vignette, glass cards, color tints, scroll pacing. no config.\\\" QA: \\\"check load speed, mobile breakpoints, and whether the scroll actually lands. rewrite whatever doesn't.\\\" WHAT THIS REPLACES: → web studio build: $6,000-$35,000+ → motion artist: $800-2,000/project → front-end dev: $2,000-10,000/project → weeks of handoffs: gone Fable 5 + Higgsfield: a subscription + a few dollars of credits. one session. SETUP IN 10 MINUTES: - install Claude Code - add th const frames={};let pendingTop=null;
function frameFor(r){
  if(frames[r]) return frames[r];
  const f=document.createElement('iframe');
  f.className='frame'; f.title=r.toUpperCase()+' page';
  f.srcdoc=PAGES[r];
  document.body.appendChild(f);
  frames[r]=f; return f;
}
function routeFromHash(){
  const m=location.hash.match(/^#\/(l[1-4]v?)$/);
  return m?m[1]:'l1';
}
let currentRoute=null;
function show(r){
  if(r===currentRoute && frames[r]) return;   // hashchange can echo our own call
  currentRoute=r;
  const f=frameFor(r);
  for(const k in frames) frames[k].classList.toggle('on',k===r);
  document.querySelectorAll('.lvl button').forEach(b=>
    b.setAttribute('aria-current', b.dataset.r===r ? 'true':'false'));
  if(pendingTop===r){
    pendingTop=null;
    const send=()=>f.contentWindow&&f.contentWindow.postMessage({wfscrolltop:1},'*');
    send(); f.addEventListener('load',send,{once:true});
  }
}
function nav(r){
  pendingTop=r;
  /* Switch FIRST, then try to record it in the URL.
     The previous order delegated switching entirely to `hashchange`, which
     never fires where the document is served from a `data:` URL (Claude's
     preview pane, some sandboxed embeds, srcdoc previews): the assignment is
     silently ignored, so the level buttons did nothing at all. Showing first
     makes the router work everywhere; the hash is a bonus that keeps the level
     shareable and reloadable wherever URLs are real. */
  show(r);
  try { if(location.hash!=='#/'+r) location.hash='#/'+r; } catch(e){}
}
window.addEventListener('message',e=>{
  if(e.data&&e.data.wfnav) nav(e.data.wfnav);
});
window.addEventListener('hashchange',()=>show(routeFromHash()));
document.querySelectorAll('.lvl button').forEach(b=>
  b.addEventListener('click',()=>nav(b.dataset.r)));
show(routeFromHash());
</script>
