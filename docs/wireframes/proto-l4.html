<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt detail (L4) — four directions</title>

<style>
/* ─── Real materials: L4's own tokens, verbatim ─────────────────────────── */
:root{
  color-scheme: light dark;
  --background: light-dark(rgb(255 255 255), rgb(22 22 24));
  --surface: light-dark(rgb(250 250 251), rgb(28 28 31));
  --foreground: light-dark(rgb(24 26 29), rgb(250 250 252));
  --muted: light-dark(rgb(24 26 29 / 56%), rgb(250 250 252 / 56%));
  --faint: light-dark(rgb(24 26 29 / 38%), rgb(250 250 252 / 38%));
  --card: light-dark(rgb(255 255 255), rgb(32 32 36));
  --border: light-dark(rgb(24 26 29 / 11%), rgb(255 255 255 / 13%));
  --border-strong: light-dark(rgb(24 26 29 / 20%), rgb(255 255 255 / 24%));
  --accent: light-dark(rgb(51 126 255), rgb(131 180 255));
  --accent-bg: light-dark(rgb(233 240 255), rgb(20 36 62));
  --var-bg: light-dark(rgb(255 238 218), rgb(70 44 16));
  --var-fg: light-dark(rgb(160 74 2), rgb(255 180 108));
  --ok: light-dark(rgb(0 133 61), rgb(74 200 124));
  --font-sans: -apple-system, system-ui, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px; --wrap: 780px;
  --hairline: 1px;
  /* one scale, used everywhere: in-flow raise < page nav < scrim < docked bar */
  --z-raise: 1; --z-sticky: 40; --z-scrim: 50; --z-bar: 60; --z-skip: 70;
}
@media only screen and (min-resolution: 192dpi){ :root{ --hairline: .5px } }

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
body{margin:0;background:var(--background);color:var(--foreground);
     font-family:var(--font-sans);font-size:15px;line-height:1.6;
     -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
     font-synthesis:none;overflow-x:hidden}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p,figure,fieldset{margin:0}
fieldset{border:0;padding:0;min-inline-size:0}
button,a,input,select,textarea{touch-action:manipulation}
input,select,textarea{font-size:16px}
:focus-visible{outline:2px solid var(--foreground);outline-offset:2px;border-radius:5px}
[id]{scroll-margin-top:76px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 26px}
.wide{max-width:1120px}
.skip{position:absolute;left:-9999px;background:var(--foreground);color:var(--background);
      padding:10px 14px;z-index:var(--z-skip);border-radius:8px}
.skip:focus{left:12px;top:12px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
img{outline:1px solid rgb(0 0 0 / .1);outline-offset:-1px}
@media (prefers-color-scheme: dark){ img{outline-color:rgb(255 255 255 / .1)} }

/* ─── Shared chrome ─────────────────────────────────────────────────────── */
.nav{border-bottom:var(--hairline) solid var(--border);background:var(--background);
     position:sticky;top:0;z-index:var(--z-sticky)}
.nav .inner{max-width:1120px;margin:0 auto;padding:0 26px;display:flex;align-items:center;
            gap:22px;min-height:56px;flex-wrap:wrap}
.brand{font-weight:600;letter-spacing:-.02em;font-size:15.5px;margin-right:auto}
.navlinks{display:flex;gap:20px;font-size:13.5px;color:var(--muted)}
.navlinks a{display:inline-flex;align-items:center;min-height:44px;
            transition-property:color;transition-duration:150ms;transition-timing-function:ease-out}
@media (hover:hover) and (pointer:fine){ .navlinks a:hover{color:var(--foreground)} }
.crumb{font:12px/1.5 var(--font-mono);color:var(--faint);display:flex;gap:7px;flex-wrap:wrap;
       align-items:center;padding:6px 0 0}
.crumb a{display:inline-flex;align-items:center;min-height:44px}
@media (hover:hover) and (pointer:fine){ .crumb a:hover{color:var(--foreground)} }

h1{font-size:clamp(26px,3.6vw,38px);line-height:1.14;letter-spacing:-.03em;font-weight:600;
   text-wrap:balance}
h2{font-size:20px;line-height:1.28;letter-spacing:-.02em;font-weight:600;text-wrap:balance}
.dek{color:var(--muted);font-size:16px;max-width:62ch;margin-top:12px;text-wrap:pretty}
.eyebrow{font:600 10.5px/1.5 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;
         color:var(--faint)}
.sec{padding:44px 0;border-top:var(--hairline) solid var(--border)}
.byline{margin-top:16px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.byline .av{width:26px;height:26px;border-radius:50%;background:var(--surface);flex:none;overflow:hidden}
.byline .av img{width:100%;height:100%;object-fit:cover;display:block;outline:none}
.byline b{font-weight:600;color:var(--foreground)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;
     padding:0 15px;border-radius:9px;border:1px solid var(--border);background:var(--card);
     color:var(--foreground);font:inherit;font-size:13.5px;cursor:pointer;position:relative;
     transition-property:background-color,border-color,color,opacity;
     transition-duration:150ms;transition-timing-function:ease-out}
.btn::after{content:"";position:absolute;inset:-3px}
.btn:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){ .btn:hover{border-color:var(--border-strong)} }
.btn.pri{background:var(--foreground);color:var(--background);border-color:var(--foreground)}
.btn.pri[data-copied]{background:var(--ok);border-color:var(--ok);color:var(--background)}
.btn:disabled{opacity:.42;cursor:default}
.btn:disabled:active{transform:none}

.var{background:var(--var-bg);color:var(--var-fg);border-radius:4px;padding:1px 5px;
     font-family:var(--font-mono);font-size:.92em;
     -webkit-box-decoration-break:clone;box-decoration-break:clone}
.pill{display:inline-flex;align-items:center;gap:5px;font:500 10.5px/1 var(--font-mono);
      letter-spacing:.05em;padding:5px 9px;border-radius:999px;border:1px solid var(--border);
      color:var(--muted)}
.metrics{display:flex;gap:14px;flex-wrap:wrap;font:11.5px/1.6 var(--font-mono);color:var(--faint);
         font-variant-numeric:tabular-nums;align-items:center}
.metrics b{font-weight:500;color:var(--muted)}
.ok{color:var(--ok)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;
    border-bottom:var(--hairline) solid var(--border);font-size:13.5px}
.kv span{color:var(--muted)}
.kv b{font-weight:500;font-variant-numeric:tabular-nums}

/* Variable picker — a real form; the legend names it, the chips are radios. */
.varset{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);padding:14px}
.varset legend{font:600 10.5px/1.5 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;
               color:var(--faint);padding:0 0 9px}
.varopts{display:flex;gap:10px;flex-wrap:wrap}
.varopt{position:relative}
/* 34px chip + 5px of invisible reach on each side = a 44px target. The 10px gap
   means neighbouring targets meet exactly and never overlap. */
.varopt input{position:absolute;inset:-5px;opacity:0;cursor:pointer;margin:0}
.varopt span{display:inline-flex;align-items:center;min-height:34px;padding:0 11px;border-radius:999px;
             border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:13px;
             transition-property:background-color,border-color,color;
             transition-duration:150ms;transition-timing-function:ease-out}
.varopt input:checked + span{background:var(--foreground);color:var(--background);border-color:var(--foreground)}
.varopt input:focus-visible + span{outline:2px solid var(--foreground);outline-offset:2px}
@media (hover:hover) and (pointer:fine){
  .varopt input:not(:checked):hover + span{color:var(--foreground);border-color:var(--border-strong)} }
.novar{font:11.5px/1.6 var(--font-mono);color:var(--faint)}

/* Media */
.shots{display:grid;gap:8px}
.ph{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--surface);
    position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.p45{aspect-ratio:4/5}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.strip .ph{aspect-ratio:1/1}
/* Empty state, sized like the filled one: headline, explanation, action. */
.nomedia{border:1px dashed var(--border-strong);border-radius:var(--r);padding:26px 24px;
         display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
         text-align:center;min-height:230px;
         background:repeating-linear-gradient(-45deg,transparent 0 9px,
           light-dark(rgb(24 26 29/3.5%),rgb(255 255 255/4%)) 9px 18px)}
.nomedia b{font-size:15px;font-weight:600;text-wrap:balance}
.nomedia p{color:var(--muted);font-size:13.5px;max-width:42ch;text-wrap:pretty}
.nomedia .btn{margin-top:4px;background:var(--card)}
.nomedia.flat{min-height:150px}

/* The prompt surface */
.payload{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--card)}
.payload-bar{display:flex;gap:10px;align-items:center;padding:9px 12px;background:var(--surface);
             border-bottom:var(--hairline) solid var(--border);flex-wrap:wrap}
.payload-bar .how{font:11.5px/1.5 var(--font-mono);color:var(--faint);margin-right:auto}
.payload-body{padding:16px 18px;font:12.5px/1.7 var(--font-mono);white-space:pre-wrap;
              overflow-wrap:break-word}

/* Record picker — page chrome, not the variant picker. */
.recbar{border-bottom:var(--hairline) solid var(--border);background:var(--surface)}
.recbar .inner{max-width:1120px;margin:0 auto;padding:9px 26px;display:flex;gap:10px;
               align-items:center;flex-wrap:wrap}
.recbar label{font:600 10.5px/1 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;
              color:var(--faint)}
.recbar select{min-height:36px;border:1px solid var(--border);border-radius:8px;background:var(--card);
               color:var(--foreground);font:16px var(--font-sans);padding:0 9px;max-width:min(52vw,320px)}
@media (min-width:768px){ .recbar select{font-size:13px} }
.recbar .note{font:11px/1.5 var(--font-mono);color:var(--faint);margin-left:auto}

footer.foot{border-top:var(--hairline) solid var(--border);padding:32px 0 24px;margin-top:8px}
.footnav{display:grid;gap:24px 20px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
         margin-bottom:26px}
.footnav h3{font:600 10.5px/1.5 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;
            color:var(--faint);margin:0 0 6px}
.footnav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
/* Sitemap rows sit at 40px, as the contract allows: five columns of them is the
   crawl surface, and 44px each would add ~40px of dead height per column. */
.footnav a{color:var(--muted);font-size:13px;display:flex;align-items:center;min-height:40px;
           transition-property:color;transition-duration:150ms;transition-timing-function:ease-out}
@media (hover:hover) and (pointer:fine){ .footnav a:hover{color:var(--foreground);
  text-decoration:underline;text-decoration-thickness:from-font;text-underline-offset:2px} }
.footlegal{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;padding-top:14px;
           border-top:var(--hairline) solid var(--border);font:11.5px/1.6 var(--font-mono);color:var(--faint)}

/* Variant 1 is the shipped page in its own document. */
.baseline{display:block;width:100%;height:100dvh;border:0}

/* ══ V2 · Split — the prompt is pinned, the page is reference ══════════ */
.v2 .cols{display:grid;grid-template-columns:minmax(0,1fr) 384px;column-gap:34px;row-gap:26px;
          align-items:start;padding:26px 0 52px}
.v2 .head{grid-column:1;grid-row:1}
.v2 .media{grid-column:1;grid-row:2;min-width:0}
.v2 .rest{grid-column:1;grid-row:3;display:flex;flex-direction:column;gap:26px;min-width:0}
.v2 .panel{grid-column:2;grid-row:1 / 4;position:sticky;top:70px;
           display:flex;flex-direction:column;gap:12px}
.v2 .panel .payload-body{max-height:min(46vh,420px);overflow:auto}
.v2 .panel .payload-body::-webkit-scrollbar{width:8px}
.v2 .panel .payload-body::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
.v2 .panelhead{display:flex;align-items:baseline;gap:8px}
.v2 .panelhead .n{font:11.5px/1 var(--font-mono);color:var(--faint);margin-left:auto;
                  font-variant-numeric:tabular-nums}
.v2 .acts{display:flex;gap:8px}
.v2 .acts .btn{flex:1;white-space:nowrap}
.v2 .steps{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.v2 .step b{display:block;font:600 10.5px/1.5 var(--font-mono);letter-spacing:.09em;color:var(--faint)}
.v2 .step p{color:var(--muted);font-size:13.5px;margin-top:4px;text-wrap:pretty}
@media (max-width:980px){
  /* one column: head, media, prompt, then the reference material */
  .v2 .cols{grid-template-columns:1fr}
  .v2 .head,.v2 .media,.v2 .panel,.v2 .rest{grid-column:1;grid-row:auto}
  .v2 .panel{position:static}
  .v2 .steps{grid-template-columns:1fr}
}

/* ══ V3 · Recipe — the page is a numbered procedure ═══════════════════ */
.v3 .step{display:grid;grid-template-columns:58px minmax(0,1fr);gap:20px;
          padding:34px 0;border-top:var(--hairline) solid var(--border)}
.v3 .step:first-of-type{border-top:0}
.v3 .num{font:500 26px/1 var(--font-mono);color:var(--faint);font-variant-numeric:tabular-nums;
         letter-spacing:-.02em;padding-top:2px}
.v3 .step h2{margin-bottom:6px}
.v3 .step .lede{color:var(--muted);font-size:14.5px;margin-bottom:16px;max-width:58ch;text-wrap:pretty}
.v3 .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.v3 .runrow{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:16px}
.v3 .runrow div{border:1px solid var(--border);border-radius:10px;padding:12px 13px}
.v3 .runrow b{display:block;font-size:13.5px;font-weight:600}
.v3 .runrow p{color:var(--muted);font-size:13px;margin-top:3px;text-wrap:pretty}
@media (max-width:700px){
  .v3 .step{grid-template-columns:1fr;gap:10px;padding:28px 0}
  .v3 .num{font-size:20px}
  .v3 .runrow{grid-template-columns:1fr}
}

/* ══ V4 · Playground — the prompt is a draft, not a block ═════════════ */
.v4 main .wrap{max-width:860px}
.v4 .head{padding:22px 0 20px}
.v4 .metaline{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.v4 .refs{margin:22px 0 26px}
.v4 .refrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.v4 .refrow[data-n="1"]{grid-template-columns:minmax(0,320px)}
.v4 .refrow[data-n="2"]{grid-template-columns:repeat(2,minmax(0,260px))}
.v4 .refrow[data-n="3"]{grid-template-columns:repeat(3,minmax(0,220px))}
.v4 .refrow .ph{aspect-ratio:1/1}
.v4 .refcap{margin-top:8px}
.v4 .editor{border:1px solid var(--border-strong);border-radius:var(--r);background:var(--card)}
.v4 .etoolbar{position:sticky;top:56px;z-index:var(--z-raise);display:flex;gap:10px;align-items:center;
              flex-wrap:wrap;padding:9px 12px;background:var(--surface);
              border-bottom:var(--hairline) solid var(--border);
              border-radius:11px 11px 0 0}
.v4 .etoolbar .state{font:600 10.5px/1 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;
                     color:var(--faint)}
.v4 .etoolbar .count{font:11.5px/1.5 var(--font-mono);color:var(--muted);margin-right:auto;
                     font-variant-numeric:tabular-nums}
.v4 .vwrap{padding:14px 14px 0}
.v4 .vwrap .varset{background:transparent;border-style:dashed}
.v4 .pbody{padding:16px 18px 20px;font:13px/1.78 var(--font-mono);white-space:pre-wrap;
           overflow-wrap:break-word;min-height:180px;outline:none;caret-color:var(--foreground)}
.v4 .editor:focus-within{border-color:var(--foreground)}
.v4 .pbody .var{border-bottom:1.5px dashed var(--var-fg);border-radius:4px 4px 0 0;padding:1px 4px}
.v4 .prov{padding:12px 14px;border-top:var(--hairline) solid var(--border);background:var(--surface);
          border-radius:0 0 11px 11px;font:11.5px/1.6 var(--font-mono);color:var(--faint)}
.v4 .prov summary{cursor:pointer;color:var(--muted);min-height:24px;display:flex;align-items:center;
                  position:relative}
.v4 .prov summary::after{content:"";position:absolute;inset:-10px}
.v4 .orig{margin-top:10px;padding:12px;border:1px solid var(--border);border-radius:9px;
          background:var(--card);white-space:pre-wrap;overflow-wrap:break-word;
          max-height:280px;overflow:auto;color:var(--muted);font:12px/1.7 var(--font-mono)}
.v4 .below{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 34px;
           padding:34px 0 46px;border-top:var(--hairline) solid var(--border);margin-top:34px}
@media (max-width:700px){
  .v4 .etoolbar{position:static}
  .v4 .refrow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .v4 .below{grid-template-columns:1fr}
}

/* ══ V5 · Sheet — the prompt is docked chrome, not a block on the page ══ */
.v5{--sheeth:min(62dvh,520px);padding-bottom:78px}
.v5 .leadgrid{display:grid;grid-template-columns:380px minmax(0,1fr);gap:34px;align-items:start;
              padding:22px 0 34px}
.v5 .prose{max-width:65ch}
.v5 .leadsec{display:block;margin-top:28px;padding-top:24px;
             border-top:var(--hairline) solid var(--border)}
.v5 .prose p{color:var(--muted);font-size:15px;margin-top:10px;text-wrap:pretty}
.v5 .relrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.v5 .relrow a.pill{min-height:36px;padding:0 12px;font-size:12px;position:relative}
.v5 .relrow a.pill::after{content:"";position:absolute;inset:-4px}
@media (hover:hover) and (pointer:fine){ .v5 .relrow a.pill:hover{border-color:var(--border-strong);
  color:var(--foreground)} }
.v5 .scrim{position:fixed;inset:0;z-index:var(--z-scrim);background:rgb(0 0 0 / .34);
           opacity:0;pointer-events:none;
           transition-property:opacity;transition-duration:200ms;transition-timing-function:ease-out}
.v5 .scrim[data-open]{opacity:1;pointer-events:auto}
.v5 .dock{position:fixed;left:0;right:0;bottom:0;z-index:var(--z-bar);background:var(--card);
          border-top:1px solid var(--border-strong);
          box-shadow:0 -10px 30px light-dark(rgb(0 0 0 / .07), rgb(0 0 0 / .34));
          transform:translateY(var(--sheeth));
          transition-property:transform;transition-duration:260ms;
          transition-timing-function:cubic-bezier(.32,.72,0,1)}
.v5 .dock[data-open]{transform:translateY(0)}
@media (prefers-reduced-motion: reduce){
  .v5 .dock,.v5 .scrim{transition-duration:1ms}
}
.v5 .dockbar{max-width:1120px;margin:0 auto;padding:10px 26px;display:flex;gap:12px;align-items:center;
             min-height:60px}
.v5 .dockmeta{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.v5 .dockmeta .t{font:600 10.5px/1.4 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;
                 color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap;
                 overflow:hidden;text-overflow:ellipsis}
.v5 .dockmeta .p{font:12px/1.5 var(--font-mono);color:var(--muted);white-space:nowrap;
                 overflow:hidden;text-overflow:ellipsis}
.v5 .dockacts{display:flex;gap:8px;flex:none}
.v5 .sheetpanel{height:var(--sheeth);overflow:auto;overscroll-behavior:contain;
                border-top:var(--hairline) solid var(--border);background:var(--surface)}
.v5 .sheetinner{max-width:1120px;margin:0 auto;padding:18px 26px 34px;display:grid;
                grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
.v5 .sheethead{grid-column:1 / -1;display:flex;align-items:center;gap:12px}
.v5 .sheethead .n{margin-left:auto;font:11.5px/1 var(--font-mono);color:var(--faint);
                  font-variant-numeric:tabular-nums}
.v5 .sheetpanel .payload-body{max-height:none}
@media (max-width:860px){
  .v5 .leadgrid{grid-template-columns:1fr;gap:22px}
  .v5 .sheetinner{grid-template-columns:1fr;gap:16px}
  .v5 .dockmeta .p{display:none}
}
@media (max-width:560px){
  .v5 .dockmeta .t .lbl{display:none}
  .v5 .sheethead{flex-wrap:wrap}
  .v5 .sheethead .n{order:3;flex-basis:100%;margin-left:0}
}
</style>

<style>
/* ─── Picker · harness chrome, copied verbatim from PICKER.md ──────────── */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,

<style id="linear-dark-theme">
/* ─────────────────────────────────────────────────────────────────────────
   Linear-derived dark theme for the prototype pickers.

   Values come from the token snapshot at
   `specs/images/linear-design-tokens.css` (Linear public-site CSS, snapshot
   2026-09-03), not from memory. This is a COLOUR re-theme only: type and
   geometry stay on the project's own system, because `frontend/AGENTS.md` §7.6
   has not ruled on a web font and Linear's faces (Inter Variable, Berkeley
   Mono, Tiempos Headline) are not licensed here. Weights stay 400/600.

   The four pickers were written at different times and use three different
   token vocabularies (`--background`/`--bg`, `--foreground`/`--fg`,
   `--muted`/`--muted-fg`, `--faint`/`--faint-fg`, `--font-sans`/`--sans`).
   Every unambiguous alias is set, so one block themes all four — see the
   note on `--muted` below for the one token deliberately skipped.

   Contrast, measured against the canvas ladder (WCAG 2, sRGB):

     token                 #08090a  #0f1011  #141516  #191a1b
     --foreground #f7f8f8    18.73    17.90    17.18    16.38
     --muted-fg   #d0d6e0    13.64    13.04    12.52    11.93
     --faint      #8a8f98     6.13     5.86     5.63     5.36
     --accent     #7170ff     5.18     4.96     4.76     4.53
     --ok         #4cc38a     9.00     8.60     8.25     7.87
     white on brand fill #5e6ad2 …………………………………………………… 4.70

   Three deliberate departures from Linear's own dark tokens, each because a
   token Linear uses decoratively is used here as text:

   1. `--faint` takes Linear's TERTIARY ink `#8a8f98`, not its quaternary
      `#62666d`. Quaternary measures 3.45:1 — below the 4.5:1 floor — and this
      project spends `--faint` on 11px mono captions, which is text.
   2. `--accent` takes `#7170ff`, NOT the `#5252f5` that `frontend/CLAUDE.md`
      mandates. That mandate is a LIGHT-mode repair: `#7070ff` fails AA on all
      four light surfaces (3.30–3.85) and `#5252f5` fixes it. Inverted, the
      rule inverts too — `#5252f5` measures 3.69:1 on `#08090a` and would be
      the unreadable one. Same intent, opposite value.
   3. `--ok` lifts Linear's `#27a644` to `#4cc38a`. Per the `color` skill,
      brand colours carried into dark at full saturation vibrate; lightness
      goes up and chroma comes down. It also buys 6.29:1 → 9.00:1 at 11px.
   ───────────────────────────────────────────────────────────────────────── */

:root[data-theme="linear-dark"] {
  color-scheme: dark;

  /* Canvas ladder — level-0 is the page, level-1 insets, level-2 cards.
     Dark mode keeps the layering hierarchy; it is not inverted light mode. */
  --background: #08090a;  --bg: #08090a;
  --surface:    #0f1011;
  --card:       #141516;

  /* Ink */
  --foreground: #f7f8f8;  --fg: #f7f8f8;
  /* --muted is deliberately NOT set. It is ink in L1/L4 but a translucent
     SURFACE wash in L2/L3 (`color-mix(in srgb, var(--fg) 8%, transparent)`,
     used only for avatar and media placeholders). Forcing one ink value here
     painted light-grey boxes onto a near-black canvas in L3. Every file's own
     definition self-corrects once --fg/--foreground flip and color-scheme is
     dark, so the token is left alone on purpose. --muted-fg is unambiguous
     ink and is set. */
  --muted-fg: #d0d6e0;
  --faint:      #8a8f98;  --faint-fg: #8a8f98;

  /* Lines. Linear's dark borders are solid, not alpha-white — a translucent
     white hairline glows on near-black instead of receding. */
  --border:        #23252a;
  --border-strong: #34343a;

  /* Interaction. Indigo carries interaction semantics only: focus, links,
     ::selection, and the single primary action per view. */
  --accent:    #7170ff;
  --accent-bg: #1b1c33;

  /* The inverted button: Linear's own --color-button-invert-bg. */
  --primary:    #e5e5e6;
  --primary-fg: #08090a;

  /* Status */
  --ok:   #4cc38a;
  --cand: #f0bf00;

  /* L4's placeholder highlight, on Linear's orange */
  --var-bg: #2a1a12;
  --var-fg: #fc9a6e;

  /* L1's Spotlight band sits below the page ladder on Linear's marketing black */
  --bbd:    #010102;
  --bmu:    rgb(247 248 248 / .68);
  --bfaint: rgb(247 248 248 / .46);
}

/* The prototypes gate their dark-mode image outline on `prefers-color-scheme`,
   which does not fire when the theme is forced by attribute. A tinted outline
   picks up the surface behind it and reads as grime, so it must be pure white. */
:root[data-theme="linear-dark"] img { outline-color: rgb(255 255 255 / .1); }

/* Selection carries the brand quietly and stays legible. */
:root[data-theme="linear-dark"] ::selection {
  background: color-mix(in oklab, #5e6ad2, black 10%);
  color: #fff;
}

/* Depth: on dark, a stacked shadow is invisible, so every elevation collapses
   to a single low-opacity white ring. */
:root[data-theme="linear-dark"] [data-elevated] {
  box-shadow: 0 0 0 1px rgb(255 255 255 / .09);
}
</style>

d. Her body is fully extended and arched, head thrown back, still singing with clear lip-sync. While holding her they gently rock her up and down in time with the beat. The camera starts from a clear side view of her arched body and smoothly transitions to a frontal view of her face. At the end they lower her smoothly onto her feet; she lands and immediately continues singing as the five men stay low on the floor around her. The men never fully obscure her. High fashion dance energy, sweaty skin, sharp timing, continuous fluid motion of the woman, priority on accurate lip-sync in every frame. Rules: no hand morphing, no body distortions, clean stable anatomy, fingers and hands remain consistent and natural throughout the entire video. #AIvideo #AIMusicVideo #AIFilmmaking", "models": ["Seedance"], "uses": ["Fashion"], "styles": ["Cinematic"], "techs": ["Camera movement / shot language", "Lip sync / dialogue"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2078813993645273089/img/4nQRj3B5LpuYV0XW.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2078813993645273089/img/4nQRj3B5LpuYV0XW.jpg?name=small"], "n": 1, "dur": 15, "handle": "@Kiber_Alla", "likes": 562, "saves": 671, "hv": true, "score": 96.3}, {"id": "2083168602363150527", "slug": "scene-a-day-in-new-york-shot-entirely-by-the-2083168602363150527", "title": "A day in New York, filmed by the subject", "prompt": "SCENE A day in New York shot entirely by the subject herself: waking in her hotel suite, coffee, getting ready, out into the city, back to the room at night. ACTIVE REFERENCES @ image1 — the hotel suite. Curved cove ceiling with warm LED coving, deep red carpet, cream walls, two black organic sculptures above a light wood headboard, white bedding with red pillows, twin bedside lamps, pale sofa, oval coffee table, sheer curtains, dark door. @ image2 — the subject. Young woman, shoulder-length wavy blonde hair with curtain bangs and highlights, light ylight, warm diner practicals. Shot 8: lamps and cove light only. AUDIO Diegetic only, from the same camera — room tone, footsteps, door, traffic, sirens, steam vents, diner clatter, wind. Ambience ducks under her lines. No music. LOCKS Photoreal live action, 4K detail, fine grain, warm consumer-camera colour, mild rolling shutter and auto-exposure hunting. She is the only person who speaks; background figures anonymous and unfocused. No subtitles.", "models": ["Higgsfield Soul", "Seedance"], "uses": ["Food & beverage"], "styles": ["Photorealistic"], "techs": ["Camera movement / shot language", "Lip sync / dialogue", "Multi-shot / storyboard"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2083165874983424000/img/L7v_JTJr0f72f2Z_.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2083165874983424000/img/L7v_JTJr0f72f2Z_.jpg?name=small"], "n": 1, "dur": 29, "handle": "@higgsfield_ai", "likes": 589, "saves": 457, "hv": true, "score": 96.1}, {"id": "2029632175482507599", "slug": "subject-identity-biometric-reference-sydney--2029632175482507599", "title": "Forensic-detail beauty portrait, hooded eyes", "prompt": "{ \"subject\": { \"identity\": { \"biometric_reference\": \"Sydney Sweeney\", \"facial_forensics\": { \"structure\": \"Soft-edged heart-shaped facial morphology, high malar bones with specific 120-degree zygomatic arch projection, refined orthognathic profile.\", \"eyes\": \"Large, almond-shaped hooded eyes, deep set; iris pattern features complex radial fibers in cerulean blue (#96B9D0) with a distinct dark grey limbal ring; natural eyelashes with varied lengths.\", \"dentition\": \"Natural dental alignment, slight prominence of the maxillary central incisors, translucent incisal edges, anatomical gum contouring without artificial whitening.\", \"skin_physics\": \"Fitzpatrick Scale Type II (#F7E2D3); visible dermal pores, subtle telangiectasia, natural freckle distribution across the nasal bridge and malar \"Scattered billiard balls including the black 8-ball, red 15-ball, and yellow 9-ball; a polished wooden cue stick lying horizontally across the foreground; a triangular rack mounted on the dark wood wall in the background.\" } ], \"reflection_integrity_rules\": \"All reflective surfaces (billiard balls, wooden rails, polished cue) must accurately reflect the surrounding environment and the subject's silhouette without distortion. Surface physics must account for the absorption coefficient of the green felt.\" }, \"lighting\": { \"setup\": \"Single-point high-intensity key light mimicking a camera flash from the front-left; hard shadows with minimal fill; high specular highlights on skin oils and billiard balls.\", \"color_temperature\": \"5500K (Daylight Balanced).\" }, \"camera\": { \"technical_specs\": \"9:16 aspect ratio, 50mm prime lens, f/2.8 aperture for shallow depth of field, ISO 100, 8K resolution, photorealistic rendering engine.\", \"perspective\": \"Low-angle medium shot focusing on the subject's entire form.\" }, \"negative_constraints\": [ \"no logos\", \"no text\", \"no symbols\", \"no beautify smoothing\", \"no airbrushed skin\", \"no extra limbs\", \"no distorted fingers\", \"no overlapping textures\", \"no smile\", \"no artificial teeth whitening\", \"no makeup artifacts\" ] }", "models": ["Nano Banana", "Nano Banana Pro"], "uses": ["Beauty"], "styles": ["Photorealistic"], "techs": ["Camera movement / shot language"], "subjects": [], "kind": "image", "img": "https://pbs.twimg.com/media/HCqzkiOXEAE3uDT.jpg?name=small", "imgs": ["https://pbs.twimg.com/media/HCqzkiOXEAE3uDT.jpg?name=small"], "n": 1, "dur": null, "handle": "@PinodiArt", "likes": 2434, "saves": 1151, "hv": true, "score": 95.6}, {"id": "2088866007918268515", "slug": "30-second-cinematic-short-create-a-30-second-2088866007918268515", "title": "Paper world, 30-second cinematic short", "prompt": "30-SECOND CINEMATIC SHORT Create a 30-second cinematic sequence with the visual discipline of a major feature film. The world is entirely made from paper, cardboard, ink, and delicate handcrafted materials. 00:00–00:05 — THE FIRST FOLD Begin with an extreme macro shot of a blank sheet of textured paper. A single fold slowly forms across its surface. Lens: 100mm macro Camera: Completely static Soft daylight moves across the paper as the fold continues. Cut precisely as the paper reaches its final shape. 00:05–00:11 — THE CITY EMERGES Transition into a 50mm shot. The folded paper begins forming miniature streets and architectural structures. Buildings rise naturally from the surface through carefully constructed paper folds. The camera slowly tracks sideways. Tiny windows catch the light. Nothing feels computer-generated; every surface should have believable paper fibers, folds, shadows, and imperfections. 00:11–00:17 — THE REVEAL Move into a 35mm shot. The camera pulls backward. The small arrangement is revealed as an enormous handcrafted paper city stretching across a large table. Roads connect different districts. Bridges cross miniature rivers. Paper trees move gently from an unseen breeze. 00:17–00:23 — MORNING Transition into a slow overhead crane shot. Warm sunlight gradually spreads across the paper city. Shadows from the buildings become longer and more defined. Tiny paper windows begin reflecting the sunlight. The camera continues rising, revealing the geometric relationship between the streets and buildings. 00:23–00:27 — THE DETAIL Cut to an 85mm close-up. Focus on a tiny paper clock mounted on one building. The clock moves forward by one minute. Rack focus from the clock to the miniature skyline behind it. 00:27–00:30 — FINAL IMAGE Return to an extreme wide shot. The entire paper city sits beneath a large studio window. The morning light completely fills the miniature world. Camera slowly pulls backward until the city becomes a small object within the larger room. Fade to black. CINEMATOGRAPHY Large-format feature-film aesthetic. 100mm macro for texture. 85mm for detail. 50mm for natural perspective. 35mm for environmental shots. Controlled dolly and crane movements. Realistic depth of field. Natural focus transitions. Soft motion blur. Subtle lens imperfections. No artificial camera shake. MATERIAL DIRECTION Every surface must visibly behave like physical paper. Visible paper fibers. Natural folds. Tiny imperfections. Soft cardboard edges. Realistic contact shadows. Believable paper thickness. Natural material deformation. LIGHTING Soft morning daylight. Large window as the primary source. Natural bounce light. Gentle shadows. Subtle warm highlights. No artificial neon effects. No excessive visual effects. CONTINUITY The same paper city throughout the entire sequence. Buildings maintain identical shapes and positions. Roads remain connected. Paper materials remain consistent. No random transformations. No flickering. No duplicated structures. No sudden environmental changes. DIRECTOR’S NOTE Treat this as a miniature feature film, not a visual-effects demonstration. The camera should discover the world gradually. Start intimate. Reveal scale. Return to detail. Finish wide. The audience should feel that they are watching a real handcrafted world photographed with a cinema camera. Photorealistic 4K • tactile materials • feature-film cinematography • sophisticated lighting • realistic miniature photography • cinematic depth • precise camera movement • seamless visual continuity.", "models": ["GPT Image", "Seedance"], "uses": [], "styles": ["Cinematic", "Photorealistic"], "techs": ["Camera movement / shot language", "Transition / morph / match cut"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2088865943921528832/img/ACj33PYyBD5RI7qH.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2088865943921528832/img/ACj33PYyBD5RI7qH.jpg?name=small"], "n": 1, "dur": 30, "handle": "@ChillaiKalan__", "likes": 407, "saves": 409, "hv": true, "score": 95.3}, {"id": "2008952931484098637", "slug": "concept-2008952931484098637", "title": "Isometric diorama of [LOCATION] on a round base", "prompt": "Concept: A hyper-realistic 3D isometric view of a [INSERT LOCATION] scene on a circular base. Subject (Visuals): A full-body, realistic human [INSERT DESCRIPTION]. * Texture Rule: The subject must have \"Living Human Skin\" texture (subsurface scattering, pores, natural imperfections). * Important: He is NOT a toy/doll. He looks like a real person inserted into the scene. * Pose: [INSERT POSE, e.g., Sitting naturally]. Composition & Scale (Crucial): * Camera: Isometric wide shot (Full view). ensure the entire circular base, the subject, and all props are visible within the frame. * Proportions: PERFECT RELATIVE SCALE. The props (e.g., scooter, table etc.) must be the correct size relative to the human. Do not make the human giant or the props tiny. Environment: A realistic section of a [INSERT WALL/BUILDING] behind the subject. * Material: Real weathered textures (brick, cement, wood), not painted model textures. Props: * [INSERT PROP 1, e.g., Vintage Vespa] (Real metal and chrome texture). * [INSERT PROP 2, e.g., Pizza and Wine] (Real food texture). * *Note:* Ensure all props are present and grounded on the base. Technical Specs: Unreal Engine 5 render style, 8k resolution, global illumination, raytracing, sharp focus on the entire scene (deep depth of field), solid neutral grey background. Negative Prompt: Toy, plastic, doll, action figure, clay, resin, shallow depth of field (blur), close-up, cropped, distorted proportions, giant head, cartoonish, missing limbs, unfinished.", "models": ["Nano Banana", "Nano Banana Pro"], "uses": ["Food & beverage"], "styles": ["Photorealistic", "Retro / vintage"], "techs": ["Camera movement / shot language"], "subjects": ["Food / drink", "Person / portrait"], "kind": "image", "img": "https://pbs.twimg.com/media/G-E77p2WIAAbR1j.jpg?name=small", "imgs": ["https://pbs.twimg.com/media/G-E77p2WIAAbR1j.jpg?name=small"], "n": 1, "dur": null, "handle": "@Arminn_Ai", "likes": 299, "saves": 564, "hv": true, "score": 93.8}, {"id": "2060203818785370400", "slug": "design-a-hyper-realistic-fifa-2026-football--2060203818785370400", "title": "FIFA 2026 player poster in team colours", "prompt": "Design a hyper-realistic FIFA 2026 football poster inspired by premium sports editorial photography and minimalist World Cup branding. Create a centered composition of a football player sitting confidently on a geometric block inside a clean studio-style environment. The player faces forward with elbows resting on knees and hands clasped naturally, giving a calm, focused, determined expression toward the camera. TEAM CUSTOMIZATION: Automatically adapt the entire design to Portugal colors, flag accents, and national football identity. Use official-inspired jersey colors, sock stripes, typography accents, and subtle national design motifs throughout the poster. PLAYER DETAILS: - Jersey Number: 7 - Team Name: Portugal - Player Name: Sarah - Official-inspired modern football kit with realistic fabric texture - Matching socks, boots, captain armband if needed - Natural athletic body proportions - Ultra-realistic skin texture and facial detail LAYOUT & COMPOSITION: - Large oversized transparent player number placed behind the player vertically - Matching number integrated beneath the seat/platform - Minimal geometric graphic lines and thin UI-inspired football design elements around composition - Small national flag accents on sides - FIFA World Cup 2026 badge/logo placement in upper corner - Balanced negative space with ultra-clean layout COLOR DIRECTION: Use the exact national team palette throughout: - Brazil → yellow, green, blue - Argentina → sky blue, white, silver - Portugal → deep red, green - France → navy blue, white, red - Japan → blue, white - Morocco → red, green etc. LIGHTING: Soft cinematic studio lighting, subtle rim light, realistic shadows, premium sports-poster contrast, slight ate is giving a bonus to whoever—\" Instant snap zoom to Stanley. His head lifts. He takes off his glasses. Dead serious. STANLEY: \"I'm listening.\" MICHAEL (waving him off): \"—anyway. Moving on. Next topic. Prompt engineering.\" Snap zoom back to Stanley. He immediately puts his glasses back on, lowers his head, and returns to the crossword as if nothing happened. Cut to Jim, who slowly turns his head and looks directly into the camera lens with a flat, knowing expression. Hold for two seconds. STYLE: single-camera sitcom shot like a documentary crew is present, natural performances, no laugh track, muted office color palette, slightly soft consumer-camera look, characters occasionally glancing at the lens.", "models": [], "uses": [], "styles": [], "techs": ["Camera movement / shot language", "Lip sync / dialogue"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2084387230844346368/img/3q3PrcBYVZsGJ3lW.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2084387230844346368/img/3q3PrcBYVZsGJ3lW.jpg?name=small"], "n": 1, "dur": 15, "handle": "@Arminn_Ai", "likes": 446, "saves": 383, "hv": true, "score": 93.6}, {"id": "2085640281941307648", "slug": "montage-multi-shot-candid-observational-foot-2085640281941307648", "title": "Seven-shot handheld observational montage", "prompt": "Montage, multi-shot candid observational footage. Do not use a single camera angle or continuous take. Handheld documentary style with the feeling of accidental real-life capture. Slightly imperfect framing, subtle handheld shake, tiny reframing adjustments, gentle exposure breathing, and autofocus that settles half a beat late. Realistic skin texture, soft indoor natural light, film grain, shallow depth of field. Relaxed breathing, natural blinking, restrained and authentic performance. Total of 7 shots. The woman from @ Image 1 is wearing a matching cotton pajama set consisting of a scoop-neck sleeveless top and loose shorts made from the same fabric and design. Barefoot, she lies on her stomach across a lived-in, slightly messy bed in her bedroom, browsing a mobile shopping page on a black smartphone. A house cat jumps onto the bed seeking attention, and she affectionately plays with it. Moments later, a friend calls. She answers, chats, and eventually bursts into laughter. The doorbell rings, so she ends the call and gets up to collect her dinner. Shot 1 (0–2s): She is already moving. One thumb scrolls through a shopping page while she frowns slightly, thinking. She quietly mutters in Korean: \"아, 뭐 살랬더라…\" (\"Ah... what was I going to buy again?\"). Lips synchronize naturally. Her bare feet gently sway behind her. A low handheld camera glides along the edge of the mattress, with soft bedding partially obscuring the foreground. Shot 2 (2–4s): The house cat jumps onto the bed, compressing the blanket as it walks toward her forearm and lets out a single meow. The camera gives a slight jolt from the impact, then quickly reframes from the phone to an over-the-shoulder view that includes her face, hands, phone, and cat. Shot 3 (4–6s): She turns warmly toward the cat, stroking it once from its forehead to its shoulders. In a gentle, affectionate tone she says: \"우리 애기 왔어?\" (\"Did my baby come?\"). Lip sync is clear and natural. The camera pushes in briefly through the cat's softly blurred foreground toward her face and hand. Shot 4 (6–8s): A friend's ringtone sounds. She glances down, confirms the caller, swipes to answer, and brings the phone to her ear. The camera moves in a loose semicircle from a slightly tilted overhead angle, capturing the entire answering motion. Shot 5 (8–11s): Her friend begins talking. She responds first with confusion, then disbelief: \"어, 왜? 진짜 거짓말.\" (\"Huh? Why? No way, you're kidding.\"). Immediately afterward she naturally bursts into laughter. The cat kneads the blanket beside her. A close handheld side angle keeps both her phone and profile within the same focal plan ve. \"See you later.\"", "models": ["Seedance"], "uses": ["Advertising", "Beauty", "Food & beverage", "UGC"], "styles": ["Photorealistic", "Retro / vintage"], "techs": ["Camera movement / shot language"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2087155707795607552/img/GvPt7yiUAlXPgSXk.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2087155707795607552/img/GvPt7yiUAlXPgSXk.jpg?name=small"], "n": 1, "dur": 15, "handle": "@PhedEU", "likes": 133, "saves": 160, "hv": false, "score": 83.9}, {"id": "2089932434351734933", "slug": "use-the-uploaded-reference-image-as-the-exac-2089932434351734933", "title": "Locked product and identity, outfit swapped", "prompt": "Use the uploaded reference image as the exact character and product reference. Preserve the woman’s facial identity, hairstyle, eye color, makeup, skin tone, body proportions, jewelry, and overall appearance consistently throughout the entire video. Change her outfit to a fitted sleeveless PINK top with clean WHITE shorts and keep the outfit identical in every shot. Use the uploaded sunglasses, earbuds, orange retail packaging, and carrying cases as LOCKED product references. Preserve their exact shapes, colors, materials, proportions, buttons, lenses, hinges, charging case, textures, and every visible product detail. Do not redesign, replace, or invent any product elements. Create an ultra-realistic UGC luxury lifestyle review filmed inside a modern luxury bedroom during warm golden hour. The woman is the clear visual focus, with authentic creator energy and natural expressions. Use warm sunlight coming through the bedroom windows, soft realistic shadows, natural skin texture, shallow depth of field, subtle handheld smartphone movement, realistic autofocus behavior, natural motion blur, and premium commercial-quality cinematography. Include a realistic cat naturally interacting with her only where specified, without distracting from the products. 0–5 s /* ══ V4 · Playground — the prompt is a draft you edit ═════════════════

   typing over their words is a different thing and the label says which. */
let typed = false;
function v4State(draft, r){
  if (typed) return "Edited";
  return draft === r.prompt ? "Verbatim" : "Filled";

function v4CountLabel(draft, r){
  const d = draft.length - r.prompt.length;
  if (draft === r.prompt) return `${n(draft.length)} chars · the author's text`;
  if (!typed) return `${n(draft.length)} chars · placeholders filled, nothing else changed`;
  if (d === 0) return `${n(draft.length)} chars · edited, same length`;
  return `${n(draft.length)} chars · ${d > 0 ? "+" : "−"}${n(Math.abs(d))} from the author's text`;
}

/* ── behaviour, delegated once so the picker wiring stays verbatim ───── */
const variants = [v1, v2, v3, v4, v5];
const stage = document.getElementById('stage');

/* What Copy puts on the clipboard: the draft if the variant has an editor,
   otherwise the prompt with whatever placeholder values are set. */
function currentText(){
  const ed = stage.querySelector('[data-editable]');
  return ed ? norm(ed.innerText) : resolved(rec());
}

function updateDraft(){
  const ed = stage.querySelector('[data-editable]');
  if (!ed) return;
  const r = rec(), draft = norm(ed.innerText), changed = draft !== r.prompt;
  const c = stage.querySelector('[data-count]');
  if (c) c.textContent = v4CountLabel(draft, r);
  const s = stage.querySelector('[data-editstate]');
  if (s) s.textContent = v4State(draft, r);
  const b = stage.querySelector('[data-restore]');
  if (b) b.disabled = !changed;
}

function redrawPrompt(){
  const r = rec();
  stage.querySelectorAll('[data-prompt]').forEach(el => { el.innerHTML = promptHtml(r); });
  const head = stage.querySelector('.v2 .panelhead .n');
  if (head){
    const vars = varsOf(r), set = vars.filter(v => chosen[v]).length;
    head.textContent = `${n(r.prompt.length)} chars${vars.length ? ` · ${set}/${vars.length} set` : ""}`;
  }
  const prev = stage.querySelector('[data-preview]');
  if (prev) prev.textContent = resolved(r).slice(0, 160) + '…';
  const dc = stage.querySelector('.v5 .dockmeta .t');
  if (dc){
    const vars = varsOf(r), set = vars.filter(v => chosen[v]).length;
    dc.innerHTML = `<span class="lbl">Prompt · </span><span data-dockcount>${
      n(r.prompt.length)}</span> chars${vars.length ? ` · ${set}/${vars.length} set` : ""}`;
  }
}

/* The editor is never wholesale re-rendered while it has a value: that would
   throw away free-typed text and the caret with it. A chip retargets only its
   own spans, found by the token they were minted from. */
function applyVarToEditor(varName, value){
  const ed = stage.querySelector('[data-editable]');
  if (!ed) return;
  ed.querySelectorAll('.var').forEach(sp => {
    if (unesc(sp.getAttribute('data-v') || '') === varName) sp.textContent = value;
  });
  updateDraft();
}

function setSheet(open){
  const dock = stage.querySelector('.v5 .dock');
  if (!dock) return;
  const panel = dock.querySelector('.sheetpanel');
  const scrim = stage.querySelector('.v5 .scrim');
  const togs = [...stage.querySelectorAll('[data-sheettoggle]')];
  dock.toggleAttribute('data-open', open);
  scrim.toggleAttribute('data-open', open);
  panel.toggleAttribute('inert', !open);
  togs.forEach(t => {
    t.setAttribute('aria-expanded', String(open));
    if (t.closest('.dockbar')) t.textContent = open ? 'Hide prompt' : 'Show prompt';
  });
  if (open) panel.querySelector('[data-sheetclose]').focus();
  else (togs.find(t => t.closest('.dockbar')) || togs[0]).focus();
}

stage.addEventListener('click', e => {
  const copy = e.target.closest('[data-copy]');
  if (copy){
    const label = copy.getAttribute('data-label') || copy.textContent;
    copy.setAttribute('data-label', label);
    const done = () => {
      copy.textContent = 'Copied';
      copy.setAttribute('data-copied','');
      setTimeout(() => { copy.textContent = label; copy.removeAttribute('data-copied'); }, 1500);
    };
    if (navigator.clipboard) navigator.clipboard.writeText(currentText()).then(done, done); else done();
    return;
  }
  if (e.target.closest('[data-restore]')){
    chosen = {};
    const wrap = stage.querySelector('[data-editorwrap]');
    if (wrap) wrap.innerHTML = v4Editor();
    return;
  }
  if (e.target.closest('[data-sheettoggle]')){
    const dock = stage.querySelector('.v5 .dock');
    setSheet(!(dock && dock.hasAttribute('data-open')));
    return;
  }
  if (e.target.closest('[data-sheetclose]') || e.target.closest('[data-scrim]')){
    setSheet(false);
  }
});

stage.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const dock = stage.querySelector('.v5 .dock');
  if (dock && dock.hasAttribute('data-open')) setSheet(false);
});

stage.addEventListener('change', e => {
  if (e.target.id === 'rec'){
    caseId = e.target.value; chosen = {};
    mount(current);
    return;
  }
  if (e.target.matches('.varopt input')){
    const name = e.target.getAttribute('data-varname');
    chosen[name] = e.target.value;
    if (stage.querySelector('[data-editable]')) applyVarToEditor(name, e.target.value);
    else redrawPrompt();
  }
});

stage.addEventListener('input', e => {
  if (!e.target.closest('[data-editable]')) return;
  typed = true;
  updateDraft();
});

/* Rich paste into the editor would drop foreign markup into a plain-text
   record; force it down to text. */
stage.addEventListener('paste', e => {
  if (!(e.target.closest && e.target.closest('[data-editable]'))) return;
  e.preventDefault();
  const t = (e.clipboardData || window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, t);
});
</script>

<script>
/* ─── Picker wiring · from PICKER.md. One addition: rAF never fires while the
   document is hidden, so a page opened in a background tab would stay blank
   until it got focus; the timeout keeps that case rendering. ───────────── */
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  const paint = () => { stage.innerHTML = variants[i](); };
  if (document.hidden) setTimeout(paint, 0);
  else requestAnimationFrame(paint);
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>

<script id="theme-toggle-script">
/* ─── Theme toggle wiring · owns its own state, touches nothing in the
   picker's markup, styles or JS. Reaches into the baseline iframe (same-
   origin, srcdoc) via a MutationObserver on #stage, since a parent
   stylesheet cannot cross into an iframe document on its own. ─────────── */
(function () {
  var THEME_PARAM = 'theme';
  var THEME_VALUE = 'linear-dark';
  var html = document.documentElement;
  var toggle = document.getElementById('theme-toggle');
  var themeStyleEl = document.getElementById('linear-dark-theme');
  var themeStyleText = themeStyleEl ? themeStyleEl.textContent : '';

  function isDark() { return html.dataset.theme === THEME_VALUE; }

  /* Label stays put — aria-pressed carries the state to assistive tech, and
     the filled dot carries it visually. */
  function reflectToggle() {
    if (!toggle) return;
    toggle.setAttribute('aria-pressed', isDark() ? 'true' : 'false');
  }

  /* Applies (or removes) the theme on one already-loaded iframe document. */
  function themeIframeDoc(iframe) {
    try {
      var doc = iframe.contentDocument;
      if (!doc || !doc.documentElement) return;
      if (isDark()) {
        doc.documentElement.dataset.theme = THEME_VALUE;
        if (!doc.getElementById('linear-dark-theme')) {
          var style = doc.createElement('style');
          style.id = 'linear-dark-theme';
          style.textContent = themeStyleText;
          (doc.head || doc.documentElement).appendChild(style);
        }
      } else {
        delete doc.documentElement.dataset.theme;
      }
    } catch (e) { /* cross-origin or torn-down document; nothing to do */ }
  }

  /* Applies now if the document already looks loaded, and always also waits
     for `load`: right after a srcdoc iframe is inserted, contentDocument can
     still be the transient about:blank placeholder, which reports its own
     readyState as "complete" before the real srcdoc navigation has even
     started — trusting that reading alone themes a document the iframe is
     about to discard. Attaching `load` unconditionally catches that case;
     calling themeIframeDoc twice on the eventual real document is harmless,
     since it only sets an attribute and guards its own style injection. */
  function applyToIframe(iframe) {
    try {
      if (iframe.contentDocument && iframe.contentDocument.readyState === 'complete') {
        themeIframeDoc(iframe);
      }
    } catch (e) { /* cross-origin; nothing to do */ }
    try {
      iframe.addEventListener('load', function () { themeIframeDoc(iframe); }, { once: true });
    } catch (e) { /* cross-origin; nothing to do */ }
  }

  /* Re-scans every iframe currently inside #stage. Called on every #stage
     mutation (the baseline repaints via stage.innerHTML = '' then a fresh
     iframe) and directly from the toggle so an already-mounted baseline
     updates immediately without waiting for a remount. */
  function themeAllIframes() {
    var stageEl = document.getElementById('stage');
    if (!stageEl) return;
    var iframes = stageEl.querySelectorAll('iframe');
    for (var i = 0; i < iframes.length; i++) applyToIframe(iframes[i]);
  }

  function setTheme(dark) {
    if (dark) html.dataset.theme = THEME_VALUE;
    else delete html.dataset.theme;
    reflectToggle();
    var url = new URL(location);
    if (dark) url.searchParams.set(THEME_PARAM, THEME_VALUE);
    else url.searchParams.delete(THEME_PARAM);
    history.replaceState(null, '', url);
    themeAllIframes();
  }

  /* Initial state from ?theme=linear-dark, alongside the picker's own ?v=. */
  if (new URLSearchParams(location.search).get(THEME_PARAM) === THEME_VALUE) {
    html.dataset.theme = THEME_VALUE;
  }
  reflectToggle();

  if (toggle) toggle.addEventListener('click', function () { setTheme(!isDark()); });

  var stageEl = document.getElementById('stage');
  if (stageEl) {
    var mo = new MutationObserver(function () { themeAllIframes(); });
    mo.observe(stageEl, { childList: true, subtree: true });
  }

  themeAllIframes();
})();
</script>
