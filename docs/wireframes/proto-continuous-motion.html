<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt library L1 Continuous — five motion theses</title>

<style>
/* ─── Real materials: tokens lifted from the wireframe ──────────────────
   Two alphas are deliberately NOT verbatim — see the contrast note on
   --muted / --faint below. Everything else is the shipped token block. */
:root{
  color-scheme: light dark;
  --background: light-dark(rgb(255 255 255), rgb(22 22 24));
  --surface: light-dark(rgb(250 250 251), rgb(28 28 31));
  --foreground: light-dark(rgb(24 26 29), rgb(250 250 252));
  /* DIVERGENCE from the shared token block, and the only one.
     The shipped alphas are --muted 56% and --faint 38%. Composited on white
     those measure 4.02:1 and 2.38:1 — both are spent on real text here
     (16.5px deks, 13px footer links, 11px mono captions), so both are below
     the 4.5:1 floor this round is verified against, and --faint is badly
     below it. Lifted to 70% / 62% => 6.55:1 and 4.88:1, measured. Lightness
     only: same hue, same ink, no saturation added, dark branch lifted to
     match. The dark THEME sets --faint outright (#8a8f98, 6.13:1) and
     deliberately leaves --muted alone, so this only governs light mode and
     un-themed dark. Cost, stated: the light ink ladder tightens from
     18.7 / 4.0 / 2.4 to 18.7 / 6.6 / 4.9 — three steps that used to be far
     apart now sit closer together, and the faintest caption reads heavier
     than the shipped page's. That is the price of the floor. */
  --muted: light-dark(rgb(24 26 29 / 70%), rgb(250 250 252 / 70%));
  --faint: light-dark(rgb(24 26 29 / 62%), rgb(250 250 252 / 62%));
  --card: light-dark(rgb(255 255 255), rgb(32 32 36));
  --border: light-dark(rgb(24 26 29 / 11%), rgb(255 255 255 / 13%));
  --border-strong: light-dark(rgb(24 26 29 / 20%), rgb(255 255 255 / 24%));
  --accent: light-dark(rgb(51 126 255), rgb(131 180 255));
  --ok: light-dark(rgb(0 133 61), rgb(74 200 124));
  /* One token for the inset image hairline, picked up by light-dark() itself,
     so the no-image placeholder gets the same treatment as a real <img>. */
  --img-outline: light-dark(rgb(0 0 0 / .1), rgb(255 255 255 / .1));
  /* --ok is lifted bright enough in dark to work as 11px caption text, which
     makes it too light to carry white text on top of it. Near-black on the
     fill in dark (9.0:1), white in light (4.75:1). */
  --ok-fg: light-dark(#fff, #08090a);
  /* Inter Variable, because the tone this round is chasing is not reachable
     without it: the Linear survey measures weights 510 and 590, and a system
     stack snaps those to 500/600 — its own note says that "changes the tone".
     Loaded from a CDN with the platform stack behind it and font-synthesis
     off, so a failed load shows up as an obvious regression rather than a
     faked bold. This is a PROTOTYPE dependency: frontend/AGENTS.md §7.6 has
     not ruled on a web font for production. */
  --font-sans: "InterVariable", -apple-system, system-ui, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  /* The one addition: a system serif, no web font, for the display register. */
  --font-serif: ui-serif, Georgia, "Times New Roman", serif;
  --r: 12px; --wrap: 1160px;
  /* Retina hairline for the lines that separate rather than elevate. */
  --hairline: 1px;
  /* One z scale; nothing invents its own number. */
  --z-cell: 1; --z-sticky: 40; --z-skip: 99;
}
@media only screen and (min-resolution: 192dpi){ :root{ --hairline: .5px } }

/* ─── Measured from the Linear survey (specs/images/linear-design-token-
   reference.md, 29 routes). Not invented, and not a full design system. ─── */
@font-face{
  font-family:"InterVariable";
  font-style:normal;
  font-weight:100 900;
  font-display:swap;
  src:url("https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/files/inter-latin-wght-normal.woff2") format("woff2");
}
:root{
  /* Variable weights. 510 and 590 are the point; 400 stays the text weight. */
  --w-text:400; --w-medium:510; --w-semi:590;
  /* Container ladder: 1436 = 1344 homepage frame + 46px gutters either side. */
  --w-wide:1436px; --w-page:1024px; --w-prose:624px;
  /* Motion. Four durations, three easings — nothing else. */
  --t-quick:100ms; --t-regular:250ms; --t-out:150ms;
  --e-out:cubic-bezier(.25,.46,.45,.94);
  --e-emphatic:cubic-bezier(.23,1,.32,1);
  --e-structural:cubic-bezier(.455,.03,.515,.955);
  /* Light-mode elevation ladder. Dark collapses to a ring (theme block). */
  --sh-tiny:0 1px 1px #00000017;
  --sh-low:0 1px 4px -1px #00000017;
  --sh-med:0 3px 12px #00000017;
  --sh-high:0 7px 24px #0000000f;
}
/* cv01 opens the digits, ss03 the alternate letterforms — both are what
   aiforui.dev enables on its own Inter. */
body{font-feature-settings:"cv01","ss03";font-synthesis:none}

/* The H1 tier ladder: size is a function of the page's rank in the site, not
   of its content. Chapters and Frame present as flagship pages (64); Stream
   and Matrix present as index pages (48), which is the tier Linear's own
   /changelog and /customers sit on. Tracking is a uniform −0.022em. */
.tier-flagship{font-size:clamp(38px,5vw,64px);font-weight:var(--w-medium);
  line-height:1;letter-spacing:-.022em;text-wrap:balance}
.tier-index{font-size:clamp(32px,3.6vw,48px);font-weight:var(--w-medium);
  line-height:1;letter-spacing:-.022em;text-wrap:balance}
.tier-ref{font-size:clamp(28px,2.8vw,40px);font-weight:var(--w-medium);
  line-height:1.1;letter-spacing:-.022em;text-wrap:balance}

/* The header is 72px + a 1px hairline and its background is fully
   transparent — the translucency is entirely backdrop-filter. */
.taste .nav{background:transparent;backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.taste .nav .wrap{min-height:72px;max-width:var(--w-wide)}
.taste .wrap{max-width:var(--w-wide)}
.taste .prose{max-width:var(--w-prose)}
.taste .eyebrow{font:var(--w-semi) 11px/1.5 var(--font-mono);letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint)}


*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
body{margin:0;background:var(--background);color:var(--foreground);
     font-family:var(--font-sans);font-size:15px;line-height:1.6;
     -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
     font-synthesis:none;overflow-x:hidden}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p,figure{margin:0}
button,a,input,select,textarea{touch-action:manipulation}
:focus-visible{outline:2px solid var(--foreground);outline-offset:2px;border-radius:5px}
[id]{scroll-margin-top:88px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 28px}
.skip{position:absolute;left:-9999px;background:var(--foreground);color:var(--background);
      padding:10px 14px;z-index:var(--z-skip);border-radius:8px}
.skip:focus{left:12px;top:12px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* Every image carries the same inset hairline; never a tinted neutral. */
img{outline:1px solid var(--img-outline);outline-offset:-1px}

/* ─── Shared chrome ─────────────────────────────────────────────────────── */
.nav{border-bottom:var(--hairline) solid var(--border);background:var(--background);
     position:sticky;top:0;z-index:var(--z-sticky)}
.nav .wrap{display:flex;align-items:center;gap:22px;min-height:58px;flex-wrap:wrap}
.brand{font-weight:var(--w-semi);letter-spacing:-.02em;font-size:16px;margin-right:auto}
.navlinks{display:flex;gap:20px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.navlinks a{transition-property:color;transition-duration:var(--t-out);transition-timing-function:var(--e-out);
            display:inline-flex;align-items:center;min-height:44px}
@media (hover:hover) and (pointer:fine){ .navlinks a:hover{color:var(--foreground)} }

h1{font-size:clamp(30px,4.6vw,46px);line-height:1.08;letter-spacing:-.035em;
   font-weight:var(--w-semi);text-wrap:balance}
h2{font-size:23px;line-height:1.25;letter-spacing:-.025em;font-weight:var(--w-semi);text-wrap:balance}
.dek{color:var(--muted);font-size:16.5px;max-width:62ch;margin-top:14px;text-wrap:pretty}
.sec{padding-block:52px;border-top:var(--hairline) solid var(--border)}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.eyebrow{font:var(--w-semi) 11px/1.5 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;
         color:var(--faint);margin-bottom:10px}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
     min-height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--border);
     background:var(--card);color:var(--foreground);font:inherit;font-size:13.5px;
     cursor:pointer;position:relative;
     transition-property:background-color,border-color,color;
     transition-duration:var(--t-out);transition-timing-function:var(--e-out)}
/* Small controls keep a 44px hit area without growing visually. */
.btn::after{content:"";position:absolute;inset:-4px}
.btn:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){ .btn:hover{border-color:var(--border-strong)} }
.btn.pri{background:var(--foreground);color:var(--background);border-color:var(--foreground)}
.btn[data-copied]{color:var(--ok)}
.btn.pri[data-copied]{background:var(--ok);border-color:var(--ok);color:var(--ok-fg)}

.search{display:flex;gap:8px;align-items:center;border:1px solid var(--border);
        border-radius:14px;padding:7px;background:var(--card);max-width:620px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--foreground);
              font:16px var(--font-sans);padding:9px 11px;outline:none}
@media (min-width:768px){ .search input{font-size:15px} }
.search input::placeholder{color:var(--faint)}

.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 11px;
      border-radius:999px;border:1px solid var(--border);background:var(--card);
      color:var(--muted);font:inherit;font-size:13px;cursor:pointer;position:relative;
      transition-property:background-color,border-color,color;
      transition-duration:var(--t-out);transition-timing-function:var(--e-out)}
.chip::after{content:"";position:absolute;inset:-5px}
.chip:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){ .chip:hover{color:var(--foreground);border-color:var(--border-strong)} }
.chip[aria-pressed="true"]{background:var(--foreground);color:var(--background);border-color:var(--foreground)}
.chip small{font:11px/1 var(--font-mono);font-variant-numeric:tabular-nums;opacity:.75}

.meta{font:11.5px/1.6 var(--font-mono);color:var(--faint);
      font-variant-numeric:tabular-nums;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.meta b{font-weight:var(--w-medium);color:var(--muted)}
.kbd{font:10px/1 var(--font-mono);border:1px solid var(--border);border-radius:4px;
     padding:3px 4px;color:var(--faint)}

/* Empty state — sized like the filled state so nothing jumps. */
.empty{border:1px dashed var(--border-strong);border-radius:var(--r);padding:44px 28px;
       text-align:center;min-height:220px;display:flex;flex-direction:column;
       align-items:center;justify-content:center;gap:10px}
.empty b{font-size:16px;font-weight:var(--w-semi)}
.empty p{color:var(--muted);font-size:14px;max-width:44ch;text-wrap:pretty}

/* Images / Videos — the first fork, two tiles at half a row each. Flex, not a
   fixed 2-col grid: with exactly two items this never shows a hole, but it
   uses the same mechanism as .tiles below so the technique is one thing, not
   two, across the page. */
.cat{display:flex;flex-wrap:wrap;gap:16px}
.cat .tile{flex:1 1 320px}
.cta{padding-block:60px 66px;border-top:var(--hairline) solid var(--border);text-align:center}
.cta h2{font-size:clamp(26px,3.4vw,34px);letter-spacing:-.03em}
.cta p{color:var(--muted);margin:10px auto 20px;max-width:46ch;text-wrap:pretty}

/* Shared browse bands + creators (the crawl surface, identical in all five).
   A fixed 4-col grid leaves a hole whenever a band's item count isn't a
   multiple of the column count (7 tasks, 6 styles → a lone short row) — real
   categories, not filler, so the count can't be padded away. Flex-wrap with
   flex-grow instead: each tile has the same basis, so rows still read as a
   grid at any width, but flex-grow distributes the leftover space among
   whatever tiles land in the final row — including a row of one — so the row
   always fills edge to edge. No column count is fixed anywhere, so this holds
   at every breakpoint without extra media queries. */
.tiles{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.tiles .tile{flex:1 1 250px}
.tile{border:1px solid var(--border);border-radius:var(--r);background:var(--card);
      overflow:hidden;display:flex;flex-direction:column;
      transition-property:border-color;transition-duration:var(--t-out);transition-timing-function:var(--e-out)}
@media (hover:hover) and (pointer:fine){ .tile:hover{border-color:var(--border-strong)} }
.tile .th{flex:none;display:block;width:100%;aspect-ratio:16/10;background:var(--surface);overflow:hidden}
.tile .th img{width:100%;height:100%;object-fit:cover;display:block}
/* Inner radius = outer − padding, so the corner gap stays even. */
.tile .tb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px}
.tile h3{font-size:15px;font-weight:var(--w-semi);letter-spacing:-.01em;line-height:1.3}
.tile p{font:11.5px/1.5 var(--font-mono);color:var(--faint);font-variant-numeric:tabular-nums}
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.person{border:1px solid var(--border);border-radius:var(--r);background:var(--card);
        padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;
        transition-property:border-color;transition-duration:var(--t-out);transition-timing-function:var(--e-out)}
@media (hover:hover) and (pointer:fine){ .person:hover{border-color:var(--border-strong)} }
.person .av{width:34px;height:34px;border-radius:50%;background:var(--surface);overflow:hidden;flex:none}
.person .av img{width:100%;height:100%;object-fit:cover;display:block;outline:none}
.person b{font-size:14.5px;font-weight:var(--w-semi)}
.person span{font:11px/1.5 var(--font-mono);color:var(--faint);font-variant-numeric:tabular-nums}

footer.foot{border-top:var(--hairline) solid var(--border);padding-block:34px 26px;margin-top:8px}
.footnav{display:grid;gap:26px 20px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
         margin-bottom:28px}
.footnav h3{font:var(--w-semi) 10.5px/1.5 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;
            color:var(--faint);margin:0 0 9px}
.footnav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.footnav a{color:var(--muted);font-size:13px;display:flex;align-items:center;min-height:40px;
           transition-property:color;transition-duration:var(--t-out);transition-timing-function:var(--e-out)}
@media (hover:hover) and (pointer:fine){ .footnav a:hover{color:var(--foreground);text-decoration:underline;
  text-decoration-thickness:from-font;text-underline-offset:2px} }
.footlegal{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;
           padding-top:16px;border-top:var(--hairline) solid var(--border);
           font:11.5px/1.6 var(--font-mono);color:var(--faint)}

/* The nav wraps to two rows on a phone, so a bar pinned at 58px would sit on
   top of it. Below the wrap point nothing is sticky but the bars themselves. */
@media (max-width:700px){ .nav{position:static} }
/* .tiles and .cat reflow on their own via flex-basis; only .people (which
   stayed a fixed grid — every band it renders is a multiple of 4) still
   needs explicit column steps. */
@media (max-width:900px){ .people{grid-template-columns:repeat(2,1fr)} }
@media (max-width:560px){ .people{grid-template-columns:1fr} }


/* ══ SCREEN ONE · frozen, shared by all five ═══════════════════════════
   Linear's /method is the one page that leaves the system: serif, 128px,
   weight 400, line-height 1.0, tracking NORMAL (the only page on the whole
   surveyed site that opts out of negative tracking), centred, on a 410px
   measure — far below the 624px prose token. The lesson the survey draws
   is not "add a serif": it is that the system reserves one face and one
   page for the argument about beliefs rather than features, and spends
   nothing else on it.

   This block is lifted verbatim from proto-l1-system.html's V2 and is
   IDENTICAL for every variant in this file. Every variant root carries
   `.vme`, so there is exactly one copy of these rules and no way for a
   direction to drift the argument. The exploration begins at `.vme .after`. */
.vme .argument{padding-block:112px 96px;text-align:center}
.vme .argument h1{font-family:var(--font-serif);font-size:clamp(46px,9vw,128px);
  font-weight:400;line-height:1;letter-spacing:normal;text-wrap:balance;
  max-width:14ch;margin:0 auto}
.vme .argument .body{max-width:410px;margin:38px auto 0;text-align:left}
.vme .argument .body p{font-size:17px;line-height:1.6;letter-spacing:normal;
  color:var(--muted);text-wrap:pretty}
.vme .argument .body p + p{margin-top:1.6em}
.vme .argument .body em{font-family:var(--font-serif);font-style:italic;
  color:var(--foreground)}
.vme .argument .sig{margin:38px auto 0;max-width:410px;text-align:left;
  font:11.5px/1.6 var(--font-mono);color:var(--faint)}
@media (max-width:700px){ .vme .argument{padding-block:64px 56px} }

/* ══ SCREEN TWO · the shared scaffold every direction inherits ═════════
   The hairline that ends the manifesto, the lede that introduces the
   library, the search field and the facet row. The search input and the
   chips live OUTSIDE [data-results] on purpose: a debounced keystroke that
   rebuilt the element under the caret would drop focus mid-word. */
.vme .after{border-top:1px solid var(--border)}
.vme .lede{padding-block:56px 26px}
.vme .lede .formnote{color:var(--muted);font-size:15.5px;margin-top:12px;
  max-width:56ch;text-wrap:pretty}
.vme .count{margin-bottom:0;padding-block:18px 4px}
/* Placeholders are the record's, not ours — marked, never rewritten. */
.vme mark{background:color-mix(in srgb, var(--foreground) 10%, transparent);
  color:var(--foreground);padding:.05em .28em;border-radius:3px;font-style:normal}
/* The one figure fallback, shared: 1 of the 35 records has no media at all
   and 4 more carry frames that may fail to load. A tinted grey box would
   read as a broken image, so the slot says what it is, in the caption face,
   and takes the same inset hairline every real <img> gets. */
.vme .noimg{display:flex;align-items:center;justify-content:center;text-align:center;
  width:100%;height:100%;border-radius:inherit;
  background:var(--surface);color:var(--faint);font:10.5px/1.4 var(--font-mono);
  padding:8px;outline:1px solid var(--img-outline);outline-offset:-1px}

/* ══ V5 · Continuous — no units at all ══════════════════════════════════
   The axis is DISSOLVING THE UNIT. The complaint that started this round
   was that small cards are hard to read; the most extreme answer is to
   stop drawing cards, rows, plates or entries and set the entire library
   as one justified serif paragraph in which every title is a link. What
   you read is a sentence, not a grid. Selecting a title does not navigate
   — the entry opens in place and splits the paragraph around it, the way
   a note expands into the page it belongs to.
   Leading is doing the tap-target work. A <button> is inline-block, so its
   box takes the paragraph's own line-height rather than the font's content
   height: measured 50.4px tall at the 21px/2.4 ceiling and 45.6px at the
   19px floor, both over the 44px floor, and both exactly equal to the line
   spacing — so adjacent rows touch and never overlap. An ::after extension
   was written first, measured, and removed: it made every target 73px tall
   and every pair of adjacent lines overlap by 22px. */
.m-run .runbox{padding-block:10px 56px}
.m-run .run{font-family:var(--font-serif);font-size:clamp(19px,1.6vw,21px);
  line-height:2.4;letter-spacing:normal;text-align:justify;hyphens:auto;
  color:var(--faint);text-wrap:normal}
.m-run .item{position:relative}
.m-run .t{position:relative;border:0;background:none;padding:0;margin:0;font:inherit;
  color:var(--foreground);cursor:pointer;text-align:left}
/* The separator is generated INSIDE the button, after a non-breaking space,
   for one reason: as a separate element it could wrap to the next line and
   open it with a stranded "·". It is glued to the title it follows and can
   never lead a line. The underline sits on an inner span so it stops at the
   title and does not run under the separator.
   Titles keep wrapping internally on purpose: justification needs break
   opportunities, and welding whole titles together instead produced two or
   three per line and rivers of white a hand's width across. */
.m-run .u{border-bottom:1px solid var(--border-strong);
  transition-property:border-color;transition-duration:var(--t-out);
  transition-timing-function:var(--e-out)}
.m-run .t::after{content:"\00a0·";color:var(--faint)}
.m-run .run > .item:last-child .t::after{content:""}
@media (hover:hover) and (pointer:fine){
  .m-run .t:hover .u{border-bottom-color:var(--foreground)}
}
.m-run .t:active{transform:scale(.98)}
.m-run .exp{display:none}
.m-run .item[data-open]{display:block;margin-block:30px;padding-block:26px;
  border-block:1px solid var(--border);text-align:left}
.m-run .item[data-open] .t::after{content:""}
.m-run .item[data-open] .u{border-bottom-color:var(--foreground)}
.m-run .item[data-open] .exp{display:grid;grid-template-columns:220px minmax(0,1fr);
  gap:28px;align-items:start;margin-top:18px;font-family:var(--font-sans);
  font-size:15px;line-height:1.68;color:var(--muted)}
.m-run .exp .fig{display:block;border-radius:6px;overflow:hidden;
  background:var(--surface);aspect-ratio:1}
.m-run .exp .fig img{width:100%;height:100%;object-fit:cover;display:block}
.m-run .exp .txt{display:block;max-width:60ch;text-wrap:pretty;overflow-wrap:anywhere}
.m-run .exp .meta{margin-top:14px}
.m-run .exp .acts{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:760px){
  .m-run .item[data-open] .exp{grid-template-columns:1fr;gap:16px}
  .m-run .exp .fig{max-width:220px}
}

/* ══ MOTION · five theses over ONE screen ═══════════════════════════════
   Everything above this line is the Continuous screen exactly as it is
   built in proto-l1-method.html. Nothing below changes markup, type,
   measure, colour or layout — every rule is scoped to a [data-motion]
   value on the root, so the five variants differ only in what moves.

   Values are the file's own motion tokens, never invented:
     --t-quick 100ms  --t-out 150ms  --t-regular 250ms
     --e-out        cubic-bezier(.25,.46,.45,.94)   general / hover
     --e-emphatic   cubic-bezier(.23,1,.32,1)       entrances
     --e-structural cubic-bezier(.455,.03,.515,.955) on-screen A→B moves

   Enter/exit is asymmetric everywhere: enter --t-regular, exit --t-out
   (40% faster — the user has already decided to close).
   ══════════════════════════════════════════════════════════════════════ */

/* ── V1 · None ─────────────────────────────────────────────────────────
   Deliberately empty. The control is the .m-run block above, untouched:
   the hover border-colour on .u (--t-out / --e-out) and
   .t:active{transform:scale(.98)}. Per `find-animation-opportunities`,
   this may simply be the right answer, so it has to be in the picker as
   a real option rather than as a strawman. */

/* ── V2 · Typeset — the arrival, once ──────────────────────────────────
   Purpose: delight, at the rare/first-time tier — the paragraph sets
   itself the first time it scrolls into view, directly after a manifesto
   that argues the library is a set of found texts. It never runs again:
   filtering re-renders the paragraph and does NOT re-arm (the observer is
   armed on mount only, see armTypeset()).
   Per-item transition-delay is written by JS and capped, so the tail is
   bounded no matter how many records match. */
.m-run[data-motion="typeset"] .run[data-typeset] .t{
  opacity:0;transform:translateY(6px);
  transition-property:opacity,transform;
  transition-duration:var(--t-regular);
  transition-timing-function:var(--e-emphatic)}
.m-run[data-motion="typeset"] .run[data-typeset][data-set] .t{opacity:1;transform:none}

/* ── V3 · Fold — the entry unfolds from its own baseline ───────────────
   Purpose: spatial consistency + preventing a jarring change. Opening an
   entry is a real layout change: measured, one entry adds 569px and moves
   28 of the 35 titles. Solved with FLIP, not with height/grid-rows —
   the reflow happens once, synchronously, and every displaced element is
   then carried from its old position to its new one on `transform` alone.
   The panel itself reveals with clip-path from its top edge, which is the
   title's baseline, so the panel visibly comes from its trigger.
   clip-path and transform are both compositor properties; nothing here
   animates height, width, margin or top. */
.m-run[data-motion="fold"] .exp{
  clip-path:inset(0 0 100% 0);opacity:0;
  transition-property:clip-path,opacity,display;
  transition-duration:var(--t-out);
  transition-timing-function:var(--e-emphatic);
  transition-behavior:allow-discrete}
.m-run[data-motion="fold"] .item[data-open] .exp{
  clip-path:inset(0 0 0 0);opacity:1;transition-duration:var(--t-regular)}
@starting-style{
  .m-run[data-motion="fold"] .item[data-open] .exp{clip-path:inset(0 0 100% 0);opacity:0}
}
/* The opened entry's two hairlines would otherwise pop in at full strength
   around a panel that is still folded shut. They fade over the same beat. */
.m-run[data-motion="fold"] .item[data-open]{
  transition-property:border-color;transition-duration:var(--t-regular);
  transition-timing-function:var(--e-out)}
.m-run[data-motion="fold"] .item[data-open][data-folding]{border-block-color:transparent}
/* The FLIP inverse itself. The obvious pick is --e-structural (ease-in-out,
   the rule for elements already on screen moving A→B) and it was wrong here,
   visibly: the panel's clip reveal on --e-emphatic is ~95% done at 110ms
   while an ease-in-out displacement has barely started, so for a third of
   the beat the trailing titles are drawn straight through the open panel.
   Screenshot: c4/m-3-fold-mid-BEFORE.png. The panel and the text it pushes
   are one motion, not two, and paired motion shares its curve — so the FLIP
   takes --e-emphatic too. The gap grows by 569px while the panel is only
   387px tall, so with a shared curve the displaced text stays below the
   revealed edge at every frame instead of crossing it.
   Duration is set per-direction in JS: 250ms open / 150ms close. */
.m-run[data-motion="fold"] [data-flip]{
  transition-property:transform;transition-timing-function:var(--e-emphatic)}

/* ── V4 · Reading — attention moves, the page does not ─────────────────
   Purpose: state indication. The thesis is that the structural change can
   stay instant if the INK carries the state: the opened entry keeps full
   ink and every other title recedes. Nothing translates, nothing scales.
   .62 is not a taste number — it is --faint's own alpha, which measures
   4.88:1 on white, so a dimmed title stays AA-legible at 21px. Dimming
   further would read better and fail contrast. */
.m-run[data-motion="readingline"] .item{
  transition-property:opacity;transition-duration:var(--t-out);
  transition-timing-function:var(--e-out)}
.m-run[data-motion="readingline"] .run:has(.item[data-open]) .item:not([data-open]){
  opacity:.62;transition-duration:var(--t-regular)}
.m-run[data-motion="readingline"] .exp{
  opacity:0;transition-property:opacity,display;transition-duration:var(--t-out);
  transition-timing-function:var(--e-out);transition-behavior:allow-discrete}
.m-run[data-motion="readingline"] .item[data-open] .exp{
  opacity:1;transition-duration:var(--t-regular)}
@starting-style{
  .m-run[data-motion="readingline"] .item[data-open] .exp{opacity:0}
}

/* ── V5 · Settle — the only thing that animates is the filter re-set ───
   Purpose: preventing a jarring change, at the HARD tier. Filtering is the
   high-frequency event here and the paragraph re-flows completely on every
   facet click, so the gate is not "is the reflow jarring" (it is) but "can
   anything survive that frequency". The answer that survives adds zero
   latency: the new paragraph is in the DOM on the same frame as before,
   and only fades the last 3px into place. Pure @starting-style — no JS, no
   timers, nothing to interrupt, and a second facet click simply retargets
   the running transition. --t-out, not --t-regular: it has to read as
   instant or it fails the frequency gate. */
.m-run[data-motion="settle"] [data-results] > *{
  opacity:1;transform:none;
  transition-property:opacity,transform;
  transition-duration:var(--t-out);
  transition-timing-function:var(--e-out)}
@starting-style{
  .m-run[data-motion="settle"] [data-results] > *{opacity:0;transform:translateY(3px)}
}

/* ── Reduced motion · every variant collapses to V1 ────────────────────
   Not "gentler" — identical to None. The JS paths (typeset arming, the
   FLIP) check matchMedia live and bail, so this block is the second belt,
   covering the CSS-only variants and any state left mid-flight. */

  .m-run[data-motion] .run:has(.item[data-open]) .item:not([data-open]){

  .m-run[data-motion] .item[data-open],

    border-block-color:var(--border);transition:none}
  .m-run[data-motion] [data-results] > *{opacity:1;transform:none;transition:none}
  .m-run[data-motion] [data-flip]{transform:none;transition:none}
}

<style id="linear-dark-theme">
/* ─────────────────────────────────────────────────────────────────────────
   Linear-derived dark theme for the prototype pickers.

   Values come from the token snapshot at
   `specs/images/linear-design-tokens.css` (Linear public-site CSS, snapshot
   2026-09-03), not from memory. This is a COLOUR re-theme only: type and
   geometry stay on the project's own system, because `frontend/AGENTS.md` §7.6
   has not ruled on a web font and Linear's faces (Inter Variable, Berkeley
   Mono, Tiempos Headline) are not licensed here. Weights stay 400/600.

   The four pickers were written at different times and use three different
   token vocabularies (`--background`/`--bg`, `--foreground`/`--fg`,
   `--muted`/`--muted-fg`, `--faint`/`--faint-fg`, `--font-sans`/`--sans`).
   Every unambiguous alias is set, so one block themes all four — see the
   note on `--muted` below for the one token deliberately skipped.

   Contrast, measured against the canvas ladder (WCAG 2, sRGB):

     token                 #08090a  #0f1011  #141516  #191a1b
     --foreground #f7f8f8    18.73    17.90    17.18    16.38
     --muted-fg   #d0d6e0    13.64    13.04    12.52    11.93
     --faint      #8a8f98     6.13     5.86     5.63     5.36
     --accent     #7170ff     5.18     4.96     4.76     4.53
     --ok         #4cc38a     9.00     8.60     8.25     7.87
     white on brand fill #5e6ad2 …………………………………………………… 4.70

   Three deliberate departures from Linear's own dark tokens, each because a
   token Linear uses decoratively is used here as text:

   1. `--faint` takes Linear's TERTIARY ink `#8a8f98`, not its quaternary
      `#62666d`. Quaternary measures 3.45:1 — below the 4.5:1 floor — and this
      project spends `--faint` on 11px mono captions, which is text.
   2. `--accent` takes `#7170ff`, NOT the `#5252f5` that `frontend/CLAUDE.md`
      mandates. That mandate is a LIGHT-mode repair: `#7070ff` fails AA on all
      four light surfaces (3.30–3.85) and `#5252f5` fixes it. Inverted, the
      rule inverts too — `#5252f5` measures 3.69:1 on `#08090a` and would be
      the unreadable one. Same intent, opposite value.
   3. `--ok` lifts Linear's `#27a644` to `#4cc38a`. Per the `color` skill,
      brand colours carried into dark at full saturation vibrate; lightness
      goes up and chroma comes down. It also buys 6.29:1 → 9.00:1 at 11px.
   ───────────────────────────────────────────────────────────────────────── */

:root[data-theme="linear-dark"] {
  color-scheme: dark;

  /* Canvas ladder — level-0 is the page, level-1 insets, level-2 cards.
     Dark mode keeps the layering hierarchy; it is not inverted light mode. */
  --background: #08090a;  --bg: #08090a;
  --surface:    #0f1011;
  --card:       #141516;

  /* Ink */
  --foreground: #f7f8f8;  --fg: #f7f8f8;
  /* --muted is deliberately NOT set. It is ink in L1/L4 but a translucent
     SURFACE wash in L2/L3 (`color-mix(in srgb, var(--fg) 8%, transparent)`,
     used only for avatar and media placeholders). Forcing one ink value here
     painted light-grey boxes onto a near-black canvas in L3. Every file's own
     definition self-corrects once --fg/--foreground flip and color-scheme is
     dark, so the token is left alone on purpose. --muted-fg is unambiguous
     ink and is set. */
  --muted-fg: #d0d6e0;
  --faint:      #8a8f98;  --faint-fg: #8a8f98;

  /* Lines. Linear's dark borders are solid, not alpha-white — a translucent
     white hairline glows on near-black instead of receding. */
  --border:        #23252a;
  --border-strong: #34343a;

  /* Interaction. Indigo carries interaction semantics only: focus, links,
     ::selection, and the single primary action per view. */
  --accent:    #7170ff;
  --accent-bg: #1b1c33;

  /* The inverted button: Linear's own --color-button-invert-bg. */
  --primary:    #e5e5e6;
  --primary-fg: #08090a;

  /* Status */
  --ok:   #4cc38a;
  --cand: #f0bf00;

  /* L4's placeholder highlight, on Linear's orange */
  --var-bg: #2a1a12;
  --var-fg: #fc9a6e;
}

/* The prototypes gate their dark-mode image outline on `prefers-color-scheme`,
   which does not fire when the theme is forced by attribute. A tinted outline
   picks up the surface behind it and reads as grime, so it must be pure white. */
:root[data-theme="linear-dark"] img { outline-color: rgb(255 255 255 / .1); }

/* Selection carries the brand quietly and stays legible. */
:root[data-theme="linear-dark"] ::selection {
  background: color-mix(in oklab, #5e6ad2, black 10%);
  color: #fff;
}

/* Depth: on dark, a stacked shadow is invisible, so every elevation collapses
   to a single low-opacity white ring. */
:root[data-theme="linear-dark"] [data-elevated] {
  box-shadow: 0 0 0 1px rgb(255 255 255 / .09);
}
</style>

ate is giving a bonus to whoever—\" Instant snap zoom to Stanley. His head lifts. He takes off his glasses. Dead serious. STANLEY: \"I'm listening.\" MICHAEL (waving him off): \"—anyway. Moving on. Next topic. Prompt engineering.\" Snap zoom back to Stanley. He immediately puts his glasses back on, lowers his head, and returns to the crossword as if nothing happened. Cut to Jim, who slowly turns his head and looks directly into the camera lens with a flat, knowing expression. Hold for two seconds. STYLE: single-camera sitcom shot like a documentary crew is present, natural performances, no laugh track, muted office color palette, slightly soft consumer-camera look, characters occasionally glancing at the lens.", "models": [], "uses": [], "styles": [], "techs": ["Camera movement / shot language", "Lip sync / dialogue"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2084387230844346368/img/3q3PrcBYVZsGJ3lW.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2084387230844346368/img/3q3PrcBYVZsGJ3lW.jpg?name=small"], "n": 1, "dur": 15, "handle": "@Arminn_Ai", "likes": 446, "saves": 383, "hv": true, "score": 93.6}, {"id": "2085640281941307648", "slug": "montage-multi-shot-candid-observational-foot-2085640281941307648", "title": "Seven-shot handheld observational montage", "prompt": "Montage, multi-shot candid observational footage. Do not use a single camera angle or continuous take. Handheld documentary style with the feeling of accidental real-life capture. Slightly imperfect framing, subtle handheld shake, tiny reframing adjustments, gentle exposure breathing, and autofocus that settles half a beat late. Realistic skin texture, soft indoor natural light, film grain, shallow depth of field. Relaxed breathing, natural blinking, restrained and authentic performance. Total of 7 shots. The woman from @ Image 1 is wearing a matching cotton pajama set consisting of a scoop-neck sleeveless top and loose shorts made from the same fabric and design. Barefoot, she lies on her stomach across a lived-in, slightly messy bed in her bedroom, browsing a mobile shopping page on a black smartphone. A house cat jumps onto the bed seeking attention, and she affectionately plays with it. Moments later, a friend calls. She answers, chats, and eventually bursts into laughter. The doorbell rings, so she ends the call and gets up to collect her dinner. Shot 1 (0–2s): She is already moving. One thumb scrolls through a shopping page while she frowns slightly, thinking. She quietly mutters in Korean: \"아, 뭐 살랬더라…\" (\"Ah... what was I going to buy again?\"). Lips synchronize naturally. Her bare feet gently sway behind her. A low handheld camera glides along the edge of the mattress, with soft bedding partially obscuring the foreground. Shot 2 (2–4s): The house cat jumps onto the bed, compressing the blanket as it walks toward her forearm and lets out a single meow. The camera gives a slight jolt from the impact, then quickly reframes from the phone to an over-the-shoulder view that includes her face, hands, phone, and cat. Shot 3 (4–6s): She turns warmly toward the cat, stroking it once from its forehead to its shoulders. In a gentle, affectionate tone she says: \"우리 애기 왔어?\" (\"Did my baby come?\"). Lip sync is clear and natural. The camera pushes in briefly through the cat's softly blurred foreground toward her face and hand. Shot 4 (6–8s): A friend's ringtone sounds. She glances down, confirms the caller, swipes to answer, and brings the phone to her ear. The camera moves in a loose semicircle from a slightly tilted overhead angle, capturing the entire answering motion. Shot 5 (8–11s): Her friend begins talking. She responds first with confusion, then disbelief: \"어, 왜? 진짜 거짓말.\" (\"Huh? Why? No way, you're kidding.\"). Immediately afterward she naturally bursts into laughter. The cat kneads the blanket beside her. A close handheld side angle keeps both her phone and profile within the same focal plane. Shot 6 (11–13s): A clear doorbell interrupts the laughter. Both she and the cat turn toward the bedroom door. She braces one hand on the mattress to get up. The camera reacts a fraction too late, briefly turning toward the door before naturally correcting back to her rising movement. Shot 7 (13–15s): Still on the phone, she hurriedly says: \"어, 나 밥 왔다. 끊어.\" (\"My food's here. I'll hang up.\"). She ends the call with her thumb, gets off the bed, and walks toward the door while the cat follows across the blankets. The camera slides low beneath her elbow and tilts upward as she stands in one continuous motion. Sound: No music. Only raw production sound: bedding rustling, quiet breathing, finger taps on the phone, the soft impact of the cat jumping onto the bed, one natural meow, faint purring, a single short incoming ringtone, call connection tone, the friend's voice through the phone, the woman's four Korean lines with accurate lip sync, a genuine brief laugh, one clear doorbell, the tap ending the call, and soft cat footsteps. No subtitles, no on-screen text, no logo, no watermark. Never render a reference sheet or duplicate the subject.", "models": ["Seedance"], "uses": ["Food & beverage"], "styles": ["Photorealistic"], "techs": ["Camera movement / shot language", "Lip sync / dialogue", "Multi-shot / storyboard"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2085640247682224128/img/Wj08brZzXojtfWtv.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2085640247682224128/img/Wj08brZzXojtfWtv.jpg?name=small"], "n": 1, "dur": 15, "handle": "@oggii_0", "likes": 297, "saves": 232, "hv": true, "score": 93.6}, {"id": "2047862141894681076", "slug": "a-realistic-young-woman-sitting-casually-in--2047862141894681076", "title": "Bedroom phone recording, late afternoon light", "prompt": "A realistic young woman sitting casually in a softly lit bedroom during late afternoon. She is holding her phone very close to her face rief accidental face cropping, and imperfect framing throughout. The camera itself is never visible. LOOK: Warm analog tape texture with gentle film grain, softened sharpness, subtle halation where sunlight cuts between buildings, faint salt-air haze, realistic skin tones, low contrast, tiny exposure shifts, natural motion blur. Authentic everyday footage, not a polished commercial. STYLE: A quiet Mediterranean morning coffee-run vlog. Unhurried, warm, spontaneous. She talks to the camera in short sentences with comfortable pauses, reacts to the street around her, laughs easily. CHARACTER: ELENA — a Mediterranean woman in her mid-20s. Dark wavy hair in a loose bun, olive skin, minimal makeup, small gold hoops, oversized white linen shirt, denim shorts, leather sandals, canvas tote on one shoulder. SETTING: A sun-washed coastal old town just after sunrise. Narrow limestone alleys, pastel shutters, bougainvillea spilling over walls, glimpses of the sea between buildings, distant church bells and scooters, almost no people. A sleepy stray cat on a warm step. SCENES: The vlog opens in selfie mode as Elena steps out of the doorway into the bright alley, squinting. \"Morning.\" She walks, sunlight strobing between buildings across her face. \"Okay it's already hot. Of course it is.\" She reaches a tiny corner kiosk and orders an iced coffee, camera still handheld, framing half-wrong. She sets the camera on the counter ledge for a wide shot while she waits, drumming her fingers. A stray cat appears at her feet and stares up. She crouches down to it. \"Hi. You again.\" The cat rubs against her leg. She laughs. \"I have a bodyguard now.\" She picks the camera back up, coffee in the other hand, and walks toward the water, the cat trotting behind for a few steps. She sits on the low seawall, sea behind her, and takes the first sip. \"Worth it. Every time.\" She looks off at the water for a moment, hair moving in the breeze, then back to the lens. \"Okay. Work now.\" A small wa /* ── helpers ─────────────────────────────────────────────────────────── */
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const n = v => v == null ? "—" : v.toLocaleString("en-US");
const AXES = { models:"Model", uses:"Task", styles:"Style", techs:"Technique" };

/* The matrix has to be able to select "the records this axis does not
   describe" — 3 records name no model, 9 name no task. That is a real cell
   on the plate and the most interesting one, so it needs a filter value.
   A sentinel string keeps matches() one function instead of two. Asserted
   against the data at load: no model, task, style or technique is __none__. */
const NONE = "__none__";

const asList = (r, key) => Array.isArray(r[key]) ? r[key] : (r[key] == null ? [] : [r[key]]);
console.assert(!DATA.some(r => ["models","uses","styles","techs"].some(k => asList(r,k).includes(NONE))),
  "sentinel collides with a real taxonomy value");
function counts(key){
  const m = new Map();
  DATA.forEach(r => asList(r, key).forEach(v => m.set(v, (m.get(v)||0)+1)));
  return [...m].sort((a,b) => b[1]-a[1]);
}
const noneCount = key => DATA.filter(r => !asList(r, key).length).length;
/* One excerpt rule for every direction: the prompt's own first words, never a
   written summary. Raw-JSON prompts get excerpted the same way as prose. */
function excerpt(r, len){
  const s = r.prompt.replace(/\s+/g," ").trim();
  return s.length > len ? s.slice(0, len).replace(/\s\S*$/,"") + "…" : s;
}
/* Placeholders are marked structurally, on the ALREADY-ESCAPED string —
   neither brackets nor capitals are touched by escaping, so the offsets hold. */
const markPlaceholders = html => html.replace(/\[[A-Z][A-Z \-_\/]{2,}\]/g, m => `<mark>${m}</mark>`);

/* Filter state is shared across variants on purpose: flipping between
   directions keeps your query, so you compare the same result set. */
const state = { q:"", active:{models:[],uses:[],styles:[],techs:[],kind:[]}, sel:0 };

function matches(r){
  for (const k in state.active){
    const on = state.active[k];
    if (!on.length) continue;
    const has = on.some(v => v === NONE ? asList(r, k).length === 0 : asList(r, k).includes(v));
    if (!has) return false;
  }
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = (r.title+" "+r.prompt+" "+r.models.join(" ")+" "+r.uses.join(" ")+" "+
                 r.styles.join(" ")+" "+r.techs.join(" ")+" "+(r.handle||"")).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
const results = () => DATA.filter(matches);
const activeRec = () => { const r = results(); return r.length ? r[Math.min(state.sel, r.length-1)] : null; };

function emptyState(){
  return `<div class="empty">

/* The facet row, identical wherever it appears; only the container changes. */
function chipRow(perAxis){
  return Object.keys(AXES).flatMap(key =>
    counts(key).slice(0, perAxis).map(([v,c]) =>
      `<button class="chip" type="button" data-facet="${key}" data-value="${esc(v)}"
        aria-pressed="${state.active[key].includes(v)}">${esc(v)} <small>${c}</small></button>`)).join("");
}

/* One representative frame per tile, no picture used twice — a repeat would
   imply two different sets share a result. */
function repFrames(key){
  const used = new Set(), out = new Map();
  const tiles = counts(key).map(([v,c]) => ({
    v, c, srcs: DATA.filter(r => asList(r, key).includes(v) && r.img).map(r => r.img)
  })).sort((a,b) => a.srcs.length - b.srcs.length);
  tiles.forEach(t => {
    const pick = t.srcs.find(s => !used.has(s));
    if (pick){ used.add(pick); out.set(t.v, pick); }
  });
  return out;
}

function band(id, heading, key){
  const frames = repFrames(key);
  const items = counts(key).filter(([v]) => frames.has(v));
  return `<section class="sec" id="${id}"><div class="wrap">
    <div class="sec-h"><h2>${heading}</h2></div>
    <div class="tiles">${items.map(([v,c]) => `
      <a class="tile" href="#" data-facet="${key}" data-value="${esc(v)}">
        <span class="th"><img src="${esc(frames.get(v))}" alt="A prompt result from ${esc(v)}"
          loading="lazy" referrerpolicy="no-referrer" width="320" height="200"></span>
        <span class="tb"><h3>${esc(v)}</h3><p>${c} prompts</p></span>
      </a>`).join("")}</div>
  </div></section>`;
}

/* Images / Videos and the closing call to action are settled parts of this

        <span class="tb"><h3>${label[k]}</h3><p>${c} prompts</p></span>

   SCREEN ONE — frozen. One string, shared by all five directions, so the
   argument cannot drift between variants: there is no second copy to edit.
   Everything from the <nav> through <p class="sig"> is byte-identical in
   every variant and the verification asserts it.
   ══════════════════════════════════════════════════════════════════════ */
const ARGUMENT = `<section class="wrap argument">
      <h1>Somebody already wrote this</h1>
      <div class="body">
        <p>Every prompt in this library was published in the open by the person who
          wrote it, and then mostly lost — buried under a feed that is optimised for
          the next thing rather than the useful thing.</p>
        <p>So the whole of the work here is <em>not editing</em>. No paraphrase, no
          house style, no distillation into a template. The text you copy is the text
          they posted, down to the render settings at the end that look like noise and
          are not.</p>
        <p>What we add is the index, the attribution, and a link back. That is the
          entire product.</p>
      </div>
      <p class="sig">${DATA.length} prompts · every one credited · every one links to its source</p>
    </section>`;

/* The lede is shared too. The only thing that varies between the five is
   `note` — one line naming the form — and the block under [data-results].
   Holding the heading constant is the point of the round: the comparison is
   about what the second movement IS, not about how it is introduced. */
function page(mode, note, body, motion){
  return `<div class="vme m-${mode} taste" data-mode="${mode}" data-motion="${motion}">${nav()}<main id="main">
    ${ARGUMENT}
    <div class="after">
      <section class="wrap lede">
        <p class="eyebrow" style="margin-bottom:14px">The library</p>
        <h2 class="tier-ref">Everything, in the order it gets copied</h2>
        <p class="formnote">${note}</p>
        <div class="search" style="margin-top:24px">
          <input id="q" type="search" placeholder="Search prompts, models, styles, creators…"
            aria-label="Search prompts" value="${esc(state.q)}">
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">${chipRow(4)}</div>
      </section>
      <section class="wrap" id="results"><h2 class="vh">All prompts</h2>
        <div data-results>${body()}</div></section>
      ${tail()}
    </div>
  </main>${foot()}</div>`;
}

/* ── shared record parts ─────────────────────────────────────────────── */
const countLine = () =>
  `<p class="meta count"><b>${results().length}</b> of ${DATA.length} prompts shown</p>`;

/* One media rule for every direction. 1 of the 35 records has no media and
   several point at frames that can fail; the slot says so rather than
   leaving a grey square that reads as a broken image. */
function fig(r, w, h, alt){
  return r.img
    ? `<img src="${esc(r.img)}" alt="${esc(alt || "")}" loading="lazy"
         referrerpolicy="no-referrer" width="${w}" height="${h}">`
    : `<span class="noimg">no image<br>on the source post</span>`;
}
const shot = r => `A result of the prompt “${r.title}”`;

/* Metadata is real or it is absent — 3 records name no model, 9 no task,
   some carry no like count. Nothing here is invented to fill a slot. */
function metaBits(r){
  const b = [`<span>${esc(r.handle || "unattributed")}</span>`,
             `<span>${esc(r.models[0] || "no model named")}</span>`];
  if (r.kind === "video" && r.dur) b.push(`<span>${r.dur}s video</span>`);
  else if (r.n > 1) b.push(`<span>${r.n} frames</span>`);
  if (r.likes != null) b.push(`<span><b>${n(r.likes)}</b> likes</span>`);
  b.push(`<span>${n(r.prompt.length)} chars</span>`);
  return b.join("");
}
/* 11 of the 35 prompts are raw JSON. They are not prose and must not be set
   as prose — a serif italic `{"style": …}` would be a lie about the record. */
const isRaw = r => /^[[{]/.test(r.prompt.trim());
/* The standfirst is the prompt's OWN opening clause, cut at a sentence
   boundary where there is one. Never a written summary. */
function standfirst(r){
  const s = r.prompt.replace(/\s+/g, " ").trim();
  const m = s.match(/^.{40,190}?[.!?](\s|$)/);
  return m ? m[0].trim() : excerpt(r, 160);
}
const copyBtn = (r, cls) =>
  `<button class="btn${cls ? " " + cls : ""}" type="button" data-copy="${r.id}">Copy prompt</button>`;

/* ══ V5 · Continuous — the library as one paragraph ═══════════════════ */
function mRun(){
  const rows = results();
  if (!rows.length) return emptyState();
  return `${countLine()}<div class="runbox"><p class="run">${rows.map(r => `<span
      class="item" data-rec data-entry><button class="t" type="button" data-expand
      aria-expanded="false"><span class="u">${esc(r.title)}</span></button><span class="exp">
      <span class="fig">${fig(r, 440, 440, shot(r))}</span>
      <span><span class="txt">${markPlaceholders(esc(excerpt(r, 900)))}</span>
        <span class="meta">${metaBits(r)}</span>
        <span class="acts">${copyBtn(r, "pri")}</span></span>
    </span></span>`).join(" ")}</p></div>`;
}

/* ── the five motion theses ──────────────────────────────────────────────
   ONE screen, five stories about what motion is for. The note, the heading,
   the markup, the type and the layout are byte-identical in all five — the
   only difference that reaches the DOM is data-motion on the root, which is
   asserted by the verification. */
const NOTE = "No rows, no cards, no plates. The whole library as one paragraph of titles; the one you pick opens in place and splits the text around it.";
const vNone    = () => page("run", NOTE, mRun, "none");
const vTypeset = () => page("run", NOTE, mRun, "typeset");
const vFold    = () => page("run", NOTE, mRun, "fold");
const vReading = () => page("run", NOTE, mRun, "readingline");
const vSettle  = () => page("run", NOTE, mRun, "settle");

/* ── behaviour, delegated once so the picker wiring stays verbatim ───── */
const variants = [vNone, vTypeset, vFold, vReading, vSettle];
const stage = document.getElementById('stage');

/* Dispatch on data-mode, NOT on a class name.
   The bug this replaces: `kind()` read `className` and compared it to a
   single token, which never matched because every root carries three
   classes — redraw() became a silent no-op and filtering was dead while
   passing every structural check. In THIS file the trap is sharper still:
   all five roots are the same screen and share `.vme .m-run .taste`, so a
   class-based dispatcher could not tell them apart at all. The mode is an
   explicit attribute; the motion thesis is a second, separate attribute;
   neither is ever inferred. */
const mode = () => (stage.firstElementChild ? stage.firstElementChild.dataset.mode : "");
const motion = () => (stage.firstElementChild ? stage.firstElementChild.dataset.motion : "");
const MODES = { run: mRun };

function redraw(){
  const fn = MODES[mode()];
  const el = stage.querySelector('[data-results]');
  if (fn && el) el.innerHTML = fn();
}

/* Live, not a load-time snapshot: the OS setting can change while the page
   is open, and a picker whose whole point is motion must answer honestly
   the moment it does. */
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const reduce = () => RM.matches;

/* ── V2 · Typeset ───────────────────────────────────────────────────────
   Armed ON MOUNT ONLY. redraw() rewrites the innerHTML of [data-results],
   a descendant, and the MutationObserver below watches #stage's own
   children without subtree — so filtering can never re-trigger the
   arrival. That is the whole rule the frequency gate imposes here.
   Nothing runs until the paragraph is actually on screen (it sits below a
   full-height manifesto), which is also the off-screen-work rule.
   The delay is capped at index 20: 35 records today, but a filter or a
   bigger library must not lengthen the tail. 20 x 24ms + 250ms = 730ms
   for the whole paragraph; each individual title moves for 250ms. */
const TYPESET_STEP = 24, TYPESET_CAP = 20;
let typesetIO = null, typesetT = 0, typesetSafety = 0;

function disarmTypeset(){
  if (typesetIO){ typesetIO.disconnect(); typesetIO = null; }
  clearTimeout(typesetT); clearTimeout(typesetSafety);
}

function armTypeset(){
  disarmTypeset();
  const root = stage.firstElementChild;
  if (!root || root.dataset.motion !== 'typeset' || reduce()) return;
  const run = root.querySelector('.run');
  if (!run) return;
  const ts = [...run.querySelectorAll('.t')];
  run.setAttribute('data-typeset', '');
  ts.forEach((t, i) => { t.style.transitionDelay = Math.min(i, TYPESET_CAP) * TYPESET_STEP + 'ms'; });

  /* Clean up completely afterwards: the typeset rules out-specify
     .t:active{transform:scale(.98)}, so leaving them attached would kill
     press feedback for the rest of the session. */
  const settle = () => {
    run.removeAttribute('data-typeset'); run.removeAttribute('data-set');
    ts.forEach(t => { t.style.transitionDelay = ''; });
  };
  const go = () => {
    run.setAttribute('data-set', '');
    typesetT = setTimeout(settle, TYPESET_CAP * TYPESET_STEP + 250 + 80);
  };

  typesetIO = new IntersectionObserver(entries => {
    if (!entries.some(e => e.isIntersecting)) return;
    typesetIO.disconnect(); typesetIO = null;
    go();
  }, { threshold: 0.01 });
  typesetIO.observe(run);

  /* Text must never be left invisible because an observer did not fire.
     This reveals, it does not animate: if we got here the paragraph was
     never on screen and there is nothing to play. */
  typesetSafety = setTimeout(() => { if (run.isConnected && !run.hasAttribute('data-set')) { disarmTypeset(); settle(); } }, 5000);
}

/* Keeps mount() verbatim. childList WITHOUT subtree is load-bearing: it
   fires for a variant swap and stays silent for a filter redraw. */
new MutationObserver(armTypeset).observe(stage, { childList: true });

/* ── V3 · Fold ──────────────────────────────────────────────────────────
   FLIP. Read every position that can move, let the browser reflow once,
   read again, then put each element back where it was with a transform and
   release it. Only `transform` is animated, and only on elements that
   actually moved (measured: 28 of 35 titles plus the bands below).
   .t is the transform target rather than .item because .item is a
   non-replaced INLINE box and transform does not apply to it; .t is the
   <button>, already inline-block, and it is exactly the thing that moves. */
function flipTargets(root){
  return [
    ...root.querySelectorAll('.m-run .t'),
    ...root.querySelectorAll('.after > section, .after > .cta'),
    root.querySelector('footer.foot'),
  ].filter(Boolean);
}

function foldToggle(entry, open, expand){
  const root = stage.firstElementChild;
  const els = flipTargets(root);
  const first = els.map(el => el.getBoundingClientRect().top);

  entry.toggleAttribute('data-open', open);
  expand.setAttribute('aria-expanded', String(open));
  if (open) entry.setAttribute('data-folding', '');

  const last = els.map(el => el.getBoundingClientRect().top);   /* one forced reflow */
  const dur = open ? 250 : 150;                                  /* --t-regular / --t-out */
  const moved = [];
  els.forEach((el, i) => {
    const dy = first[i] - last[i];
    if (Math.abs(dy) < 0.5) return;
    el.style.transition = 'none';
    el.style.transform = `translateY(${dy}px)`;
    el.setAttribute('data-flip', '');
    moved.push(el);
  });
  if (!moved.length){ entry.removeAttribute('data-folding'); return; }

  void root.offsetHeight;   /* flush the inverted state as one layout, then release */
  moved.forEach(el => { el.style.transition = ''; el.style.transitionDuration = dur + 'ms'; el.style.transform = ''; });
  entry.removeAttribute('data-folding');

  /* Cleanup sweeps every [data-flip] in the tree, not just this run's list:
     a second click mid-flight produces a different set of movers, and an
     element that moved only in the first run would otherwise keep the
     attribute (and its transition) for the rest of the session. */
  clearTimeout(foldT);
  foldT = setTimeout(() => root.querySelectorAll('[data-flip]').forEach(el => {
    el.removeAttribute('data-flip'); el.style.transitionDuration = ''; el.style.transform = '';
  }), dur + 80);
}
let foldT = 0;

stage.addEventListener('click', e => {
  const copy = e.target.closest('[data-copy]');
  if (copy){
    const r = DATA.find(x => x.id === copy.getAttribute('data-copy'));
    const label = copy.getAttribute('data-label') || copy.textContent.trim();
    copy.setAttribute('data-label', label);
    const done = () => {
      copy.textContent = 'Copied';
      copy.setAttribute('data-copied','');
      setTimeout(() => { copy.textContent = label; copy.removeAttribute('data-copied'); }, 1500);
    };
    if (navigator.clipboard) navigator.clipboard.writeText(r.prompt).then(done, done); else done();
    return;
  }
  /* One disclosure, five motion answers. The container is marked with
     [data-entry] and the control is the title itself, so the control's
     label is never swapped — there is nothing to swap it to. */
  const expand = e.target.closest('[data-expand]');
  if (expand){
    const entry = expand.closest('[data-entry]');
    if (!entry) return;
    const open = !entry.hasAttribute('data-open');
    if (motion() === 'fold' && !reduce()){
      foldToggle(entry, open, expand);
    } else {
      entry.toggleAttribute('data-open', open);
      expand.setAttribute('aria-expanded', String(open));
    }
    return;
  }
  const facet = e.target.closest('[data-facet]');
  if (facet){
    e.preventDefault();
    const k = facet.getAttribute('data-facet'), v = facet.getAttribute('data-value');
    const on = state.active[k];
    const i = on.indexOf(v);
    if (i < 0) on.push(v); else on.splice(i,1);
    stage.querySelectorAll(`.chip[data-facet="${k}"][data-value="${CSS.escape(v)}"]`)
      .forEach(c => c.setAttribute('aria-pressed', String(i < 0)));
    redraw();
    return;
  }
  if (e.target.closest('[data-clear]')){
    state.q = "";
    Object.keys(state.active).forEach(k => state.active[k] = []);
    stage.querySelectorAll('.chip[data-facet]').forEach(c => c.setAttribute('aria-pressed','false'));
    const q = stage.querySelector('#q'); if (q) q.value = "";
    redraw();
    return;
  }
});

let tm;
stage.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  clearTimeout(tm);
  tm = setTimeout(() => { state.q = e.target.value.trim(); redraw(); }, 300);
});
</script>

<script>
/* ─── Picker wiring · verbatim from PICKER.md ──────────────────────────── */
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  const paint = () => { stage.innerHTML = variants[i](); };
  if (document.hidden) setTimeout(paint, 0);
  else requestAnimationFrame(paint);
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>

<script>
/* ─── Linear dark theme · toggle ────────────────────────────────────────
   The sibling pickers also carry an iframe reach-in, because their variant 1
   is the shipped page inside <iframe srcdoc> and a parent stylesheet does not
   cross that boundary. This picker has NO shipped baseline — all five
   directions are designed pages in this document — so there is no iframe to
   reach into and that code is not carried here. If a baseline is ever added,
   the reach-in has to come with it. */
const themeBtn = document.getElementById('theme-toggle');
const root = document.documentElement;

function setTheme(on, { persist = true } = {}){
  if (on) root.setAttribute('data-theme', 'linear-dark');
  else root.removeAttribute('data-theme');
  themeBtn.setAttribute('aria-pressed', String(on));
  if (persist){
    const url = new URL(location);
    if (on) url.searchParams.set('theme', 'linear-dark');
    else url.searchParams.delete('theme');
    history.replaceState(null, '', url);
  }
}

themeBtn.addEventListener('click', () => setTheme(!root.hasAttribute('data-theme')));
setTheme(new URLSearchParams(location.search).get('theme') === 'linear-dark', { persist: false });
</script>
