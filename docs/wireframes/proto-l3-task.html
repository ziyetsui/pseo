<!doctype html>
<html lang="en" data-theme="linear-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task page (L3) — five ways to show one task</title>
<style>

/* ─── Real materials: tokens lifted verbatim from the wireframe ─────────── */
:root{
  color-scheme: light dark;
  --background: light-dark(rgb(255 255 255), rgb(22 22 24));
  --surface: light-dark(rgb(250 250 251), rgb(28 28 31));
  --foreground: light-dark(rgb(24 26 29), rgb(250 250 252));
  /* DEPARTURE, light mode only, documented per THEME-BRIEF ("moving lightness
     only — never by adding saturation"). The wireframe ships --muted at 56%
     and --faint at 38%; measured on white those composite to rgb(126,127,128)
     = 4.08:1 and rgb(167,168,169) = 2.36:1, and this file spends --faint on
     11px mono captions, which is text. Alpha is raised until both clear the
     4.5:1 floor with the hierarchy intact (measured after the change: muted
     8.6:1, faint 4.8:1). Hue is untouched, and the dark values are unchanged
     because they already pass (see the theme block's contrast table). */
  --muted: light-dark(rgb(24 26 29 / 76%), rgb(250 250 252 / 56%));
  --faint: light-dark(rgb(24 26 29 / 65%), rgb(250 250 252 / 38%));
  --card: light-dark(rgb(255 255 255), rgb(32 32 36));
  --border: light-dark(rgb(24 26 29 / 11%), rgb(255 255 255 / 13%));
  --border-strong: light-dark(rgb(24 26 29 / 20%), rgb(255 255 255 / 24%));
  --accent: light-dark(rgb(51 126 255), rgb(131 180 255));
  --ok: light-dark(rgb(0 133 61), rgb(74 200 124));
  /* Was two hardcoded rgb(0 0 0/.1) literals plus a prefers-color-scheme
     override that only ever touched `img`, not the lookalike outline on the
     no-image placeholder below — so the placeholder stayed a black hairline
     on a dark surface. One token, picked up by light-dark() itself (no media
     query needed), used by both. */
  --img-outline: light-dark(rgb(0 0 0 / .1), rgb(255 255 255 / .1));
  /* Was a hardcoded #fff on the "Copied" fill. --ok's dark-mode value is
     lifted bright enough to work as 11px caption text on the canvas (see the
     linear-dark theme block's contrast table) — which makes it too light for
     white text on top of it: 2.13:1 against this file's own pre-theme dark
     --ok, 2.22:1 against the theme's brighter #4cc38a. Moving lightness, not
     hue: dark mode gets near-black text on the fill (9.0–9.3:1) instead of
     white; light mode's much darker --ok keeps white (4.75:1, unchanged). */
  --ok-fg: light-dark(#fff, #08090a);
  /* Inter Variable, because the tone this round is chasing is not reachable
     without it: the Linear survey measures weights 510 and 590, and a system
     stack snaps those to 500/600 — its own note says that "changes the tone".
     Loaded from a CDN with the platform stack behind it and font-synthesis
     off, so a failed load shows up as an obvious regression rather than a
     faked bold. This is a PROTOTYPE dependency: frontend/AGENTS.md §7.6 has
     not ruled on a web font for production. */
  --font-sans: "InterVariable", -apple-system, system-ui, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  /* The one addition: a system serif, no web font, for the display register. */
  --font-serif: ui-serif, Georgia, "Times New Roman", serif;
  --r: 12px; --wrap: 1160px;
  /* Retina hairline for the lines that separate rather than elevate. */
  --hairline: 1px;
  /* One z scale; nothing invents its own number. */
  --z-sticky: 40; --z-rail: 50; --z-skip: 99;
}
@media only screen and (min-resolution: 192dpi){ :root{ --hairline: .5px } }

/* ─── Measured from the Linear survey (specs/images/linear-design-token-
   reference.md, 29 routes). Not invented, and not a full design system. ─── */
@font-face{
  font-family:"InterVariable";
  font-style:normal;
  font-weight:100 900;
  font-display:swap;
  src:url("https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/files/inter-latin-wght-normal.woff2") format("woff2");
}
:root{
  /* Variable weights. 510 and 590 are the point; 400 stays the text weight. */
  --w-text:400; --w-medium:510; --w-semi:590;
  /* Container ladder: 1436 = 1344 homepage frame + 46px gutters either side. */
  --w-wide:1436px; --w-page:1024px; --w-prose:624px;
  /* Motion. Four durations, three easings — nothing else. */
  --t-quick:100ms; --t-regular:250ms; --t-out:150ms;
  --e-out:cubic-bezier(.25,.46,.45,.94);
  --e-emphatic:cubic-bezier(.23,1,.32,1);
  --e-structural:cubic-bezier(.455,.03,.515,.955);
  /* Light-mode elevation ladder. Dark collapses to a ring (theme block). */
  --sh-tiny:0 1px 1px #00000017;
  --sh-low:0 1px 4px -1px #00000017;
  --sh-med:0 3px 12px #00000017;
  --sh-high:0 7px 24px #0000000f;
}
/* cv01 opens the digits, ss03 the alternate letterforms — both are what
   aiforui.dev enables on its own Inter. */
body{font-feature-settings:"cv01","ss03";font-synthesis:none}

/* The H1 tier ladder: size is a function of the page's rank in the site, not
   of its content. This hub is a flagship page, so 64px / 510 / 1.0 / −0.022em.
   Tracking is a uniform −0.022em at every step of the real ladder. */
.tier-flagship{font-size:clamp(38px,5vw,64px);font-weight:var(--w-medium);
  line-height:1;letter-spacing:-.022em;text-wrap:balance}
.tier-index{font-size:clamp(32px,3.6vw,48px);font-weight:var(--w-medium);
  line-height:1;letter-spacing:-.022em;text-wrap:balance}
.tier-ref{font-size:clamp(28px,2.8vw,40px);font-weight:var(--w-medium);
  line-height:1.1;letter-spacing:-.022em;text-wrap:balance}

/* The header is 72px + a 1px hairline and its background is fully
   transparent — the translucency is entirely backdrop-filter. */
.taste .nav{background:transparent;backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.taste .nav .wrap{min-height:72px;max-width:var(--w-wide)}
.taste .wrap{max-width:var(--w-wide)}
.taste .prose{max-width:var(--w-prose)}
.taste .eyebrow{font:var(--w-semi) 11px/1.5 var(--font-mono);letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint)}


*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
body{margin:0;background:var(--background);color:var(--foreground);
     font-family:var(--font-sans);font-size:15px;line-height:1.6;
     -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
     font-synthesis:none;overflow-x:hidden}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p,figure{margin:0}
button,a,input,select,textarea{touch-action:manipulation}
:focus-visible{outline:2px solid var(--foreground);outline-offset:2px;border-radius:5px}
[id]{scroll-margin-top:76px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 28px}
.skip{position:absolute;left:-9999px;background:var(--foreground);color:var(--background);
      padding:10px 14px;z-index:var(--z-skip);border-radius:8px}
.skip:focus{left:12px;top:12px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* Every image carries the same inset hairline; never a tinted neutral. */
img{outline:1px solid var(--img-outline);outline-offset:-1px}

/* ─── Shared chrome ─────────────────────────────────────────────────────── */
.nav{border-bottom:var(--hairline) solid var(--border);background:var(--background);
     position:sticky;top:0;z-index:var(--z-sticky)}
.nav .wrap{display:flex;align-items:center;gap:22px;min-height:58px;flex-wrap:wrap}
.brand{font-weight:600;letter-spacing:-.02em;font-size:16px;margin-right:auto}
.navlinks{display:flex;gap:20px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.navlinks a{transition-property:color;transition-duration:150ms;transition-timing-function:ease-out;
            display:inline-flex;align-items:center;min-height:44px}
@media (hover:hover) and (pointer:fine){ .navlinks a:hover{color:var(--foreground)} }

h1{font-size:clamp(30px,4.6vw,46px);line-height:1.08;letter-spacing:-.035em;
   font-weight:600;text-wrap:balance}
h2{font-size:23px;line-height:1.25;letter-spacing:-.025em;font-weight:600;text-wrap:balance}
.dek{color:var(--muted);font-size:16.5px;max-width:62ch;margin-top:14px;text-wrap:pretty}
.sec{padding:52px 0;border-top:var(--hairline) solid var(--border)}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.sec-h a{margin-left:auto;font-size:13px;color:var(--muted);
         display:inline-flex;align-items:center;min-height:44px}
@media (hover:hover) and (pointer:fine){ .sec-h a:hover{color:var(--foreground)} }
.eyebrow{font:600 11px/1.5 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;
         color:var(--faint);margin-bottom:10px}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
     min-height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--border);
     background:var(--card);color:var(--foreground);font:inherit;font-size:13.5px;
     cursor:pointer;position:relative;
     transition-property:background-color,border-color,color;
     transition-duration:150ms;transition-timing-function:ease-out}
/* Small controls keep a 44px hit area without growing visually. */
.btn::after{content:"";position:absolute;inset:-4px}
.btn:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){ .btn:hover{border-color:var(--border-strong)} }
.btn.pri{background:var(--foreground);color:var(--background);border-color:var(--foreground)}
/* The copy confirmation used to turn green. On Linear the only saturated
   colour on a page belongs to the quoted customer; the analogue here is that
   it belongs to the prompt results. So the confirmation inverts instead of
   colouring — the same state change, spent on weight rather than hue. */
.btn[data-copied]{background:var(--foreground);color:var(--background);border-color:var(--foreground)}
.btn.pri[data-copied]{background:var(--foreground);color:var(--background);border-color:var(--foreground)}

.search{display:flex;gap:8px;align-items:center;border:1px solid var(--border);
        border-radius:14px;padding:7px;background:var(--card);max-width:620px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--foreground);
              font:16px var(--font-sans);padding:9px 11px;outline:none}
@media (min-width:768px){ .search input{font-size:15px} }
.search input::placeholder{color:var(--faint)}

.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 11px;
      border-radius:999px;border:1px solid var(--border);background:var(--card);
      color:var(--muted);font:inherit;font-size:13px;cursor:pointer;position:relative;
      transition-property:background-color,border-color,color;
      transition-duration:150ms;transition-timing-function:ease-out}
.chip::after{content:"";position:absolute;inset:-5px}
.chip:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){ .chip:hover{color:var(--foreground);border-color:var(--border-strong)} }
.chip[aria-pressed="true"]{background:var(--foreground);color:var(--background);border-color:var(--foreground)}
/* No opacity here: it multiplies onto --muted and drops 11px text to 3.4:1. */
.chip small{font:11px/1 var(--font-mono);font-variant-numeric:tabular-nums}

.meta{font:11.5px/1.6 var(--font-mono);color:var(--faint);
      font-variant-numeric:tabular-nums;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.meta b{font-weight:500;color:var(--muted)}
/* "popular" is a fact about a record, not an alarm; it keeps the caption ink. */
.hv{color:var(--faint);letter-spacing:.04em}
.badge{position:absolute;left:8px;bottom:8px;background:rgb(0 0 0 / .72);color:#fff;
       font:500 10px/1 var(--font-mono);letter-spacing:.05em;padding:5px 7px;border-radius:6px;
       backdrop-filter:blur(6px);pointer-events:none}
.kbd{font:10px/1 var(--font-mono);border:1px solid var(--border);border-radius:4px;
     padding:3px 4px;color:var(--faint)}

/* Empty state — sized like the filled state so nothing jumps. */
.empty{border:1px dashed var(--border-strong);border-radius:var(--r);padding:44px 28px;
       text-align:center;min-height:220px;display:flex;flex-direction:column;
       align-items:center;justify-content:center;gap:10px}
.empty b{font-size:16px;font-weight:600}
.empty p{color:var(--muted);font-size:14px;max-width:44ch;text-wrap:pretty}


/* Images / Videos — the first fork, two tiles at half a row each. Flex, not a
   fixed 2-col grid: with exactly two items this never shows a hole, but it
   uses the same mechanism as .tiles below so the technique is one thing, not
   two, across the page. */
.cat{display:flex;flex-wrap:wrap;gap:16px}
.cat .tile{flex:1 1 320px}
.cta{padding:60px 0 66px;border-top:var(--hairline) solid var(--border);text-align:center}
.cta h2{font-size:clamp(26px,3.4vw,34px);letter-spacing:-.03em}
.cta p{color:var(--muted);margin:10px auto 20px;max-width:46ch;text-wrap:pretty}

/* Shared browse bands + creators (the crawl surface, identical in all five).
   A fixed 4-col grid leaves a hole whenever a band's item count isn't a
   multiple of the column count (6 tasks, 6 styles → a lone row of 2 with two
   empty cells) — real categories, not filler, so the count can't be padded
   away. Flex-wrap with flex-grow instead: each tile has the same basis, so
   rows still read as a grid at any width, but flex-grow distributes the
   leftover space among whatever tiles land in the final row — including a
   row of one — so the row always fills edge to edge. No column count is
   fixed anywhere, so this holds at every breakpoint without extra media
   queries. */
.tiles{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.tiles .tile{flex:1 1 250px}
.tile{border:1px solid var(--border);border-radius:var(--r);background:var(--card);
      overflow:hidden;display:flex;flex-direction:column;
      transition-property:border-color;transition-duration:150ms;transition-timing-function:ease-out}
@media (hover:hover) and (pointer:fine){ .tile:hover{border-color:var(--border-strong)} }
.tile .th{flex:none;display:block;width:100%;aspect-ratio:16/10;background:var(--surface);overflow:hidden}
.tile .th img{width:100%;height:100%;object-fit:cover;display:block}
/* Inner radius = outer − padding, so the corner gap stays even. */
.tile .tb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px}
.tile h3{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.tile p{font:11.5px/1.5 var(--font-mono);color:var(--faint);font-variant-numeric:tabular-nums}
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.person{border:1px solid var(--border);border-radius:var(--r);background:var(--card);
        padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;
        transition-property:border-color;transition-duration:150ms;transition-timing-function:ease-out}
@media (hover:hover) and (pointer:fine){ .person:hover{border-color:var(--border-strong)} }
.person .av{width:34px;height:34px;border-radius:50%;background:var(--surface);overflow:hidden;flex:none}
.person .av img{width:100%;height:100%;object-fit:cover;display:block;outline:none}
.person b{font-size:14.5px;font-weight:600}
.person span{font:11px/1.5 var(--font-mono);color:var(--faint);font-variant-numeric:tabular-nums}

footer.foot{border-top:var(--hairline) solid var(--border);padding:34px 0 26px;margin-top:8px}
.footnav{display:grid;gap:26px 20px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
         margin-bottom:28px}
.footnav h3{font:600 10.5px/1.5 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;
            color:var(--faint);margin:0 0 9px}
.footnav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.footnav a{color:var(--muted);font-size:13px;display:flex;align-items:center;min-height:40px;
           transition-property:color;transition-duration:150ms;transition-timing-function:ease-out}
@media (hover:hover) and (pointer:fine){ .footnav a:hover{color:var(--foreground);text-decoration:underline;
  text-decoration-thickness:from-font;text-underline-offset:2px} }
.footlegal{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;
           padding-top:16px;border-top:var(--hairline) solid var(--border);
           font:11.5px/1.6 var(--font-mono);color:var(--faint)}

/* The nav wraps to two rows on a phone, so a bar pinned at 58px would sit on
   top of it. Below the wrap point nothing is sticky but the bars themselves. */
@media (max-width:700px){ .nav{position:static} }
/* .tiles and .cat reflow on their own via flex-basis; only .people (which
   stayed a fixed grid — every band it renders is a multiple of 4) still
   needs explicit column steps. */
@media (max-width:900px){ .people{grid-template-columns:repeat(2,1fr)} }
@media (max-width:560px){ .people{grid-template-columns:1fr} }


/* ═══════════════════════════════════════════════════════════════════════
   L3 · the page "Browse by task → Beauty" lands on.

   Held constant across all five, so the comparison lands on the axis and
   not on the chrome: the taste foundation above, the same control bar (task
   siblings + facets), the same result set, the same crawl tail, the same
   footer. What diverges is HOW one task's prompts are put on the page —
   which is the thing the run is deciding.

   Variant 1 is the current production page (components/Directory.tsx),
   reproduced unchanged, so the other four are measured against something
   real rather than against a memory of it.

   Per frontend/AGENTS.md §7: no Copy buttons anywhere, the per-record CTA
   is "Generate image" / "Generate video" / "Generate" by the record's own
   kind and never a guess, and prose vs structured JSON is distinguished
   rather than flattened.
   ═══════════════════════════════════════════════════════════════════════ */

/* ─── The control bar every variant carries ─────────────────────────────
   It sits directly under the 72px taste header (72 + 1px hairline = 73).
   Below 700px the header stops being sticky (foundation rule) so the bar
   takes the top itself. Row one is the task's siblings — on an L3 page the
   neighbouring tasks are navigation, not a filter — row two the facets
   inside this task. */
.ctrl{position:sticky;top:73px;z-index:var(--z-sticky);background:var(--background);
      border-block:var(--hairline) solid var(--border)}
.ctrl .bar{display:flex;flex-direction:column;gap:9px;padding-block:11px}
.ctrl .row{display:flex;gap:10px;align-items:center;min-width:0}
.ctrl .lbl{font:var(--w-semi) 10.5px/1.6 var(--font-mono);letter-spacing:.15em;
           text-transform:uppercase;color:var(--faint);flex:none}
.scroller{display:flex;gap:10px;overflow-x:auto;padding-block:2px;scrollbar-width:none;
          -webkit-overflow-scrolling:touch}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{flex:none}
/* The task chips are navigation, so the current one is marked with
   aria-current, not aria-pressed — a filter you can release and a page you
   are on are different things and must not look identical. */
.chip[aria-current="page"]{background:var(--foreground);color:var(--background);
                           border-color:var(--foreground)}
@media (max-width:620px){ .ctrl .lbl{display:none} }

/* Shared: the count line under every variant's title, and the tail's own
   heading rank. Tabular so the number does not shift as filters change. */
.tally{font:11.5px/1.6 var(--font-mono);color:var(--faint);
       font-variant-numeric:tabular-nums;letter-spacing:.04em}

/* ══ V1 · Directory — the current page, unchanged ════════════════════════
   components/Directory.tsx as it ships today: an eyebrow, a tier-index H1,
   and one tile per prompt carrying the title and "1 prompt". No media, no
   author, no prompt text, no argument for why these thirteen belong on one
   page. Reproduced here rather than described, because the gap is the
   argument for doing anything at all. */
.vdr .sec{border-top:0}
.vdr .tiles{margin-top:32px}
.vdr .tile .tb{padding:14px}
.vdr .tile h2{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.vdr .tile p{font:11.5px/1.5 var(--font-mono);color:var(--faint);
             font-variant-numeric:tabular-nums;margin-top:3px}

/* ══ V2 · Contact sheet — every frame at once ════════════════════════════
   The photographer's proof sheet. Density is the axis: the whole task is
   visible in one screen as a tight numbered grid, and the caption is
   deferred to a legend underneath rather than carried by each frame. You
   choose with your eyes first and read second — which is how someone picks
   a beauty prompt.
   H1: serif 400, 46px at 1360 / 30px at 375, line-height 1.05, −.016em. */
.vcs .wrap{max-width:var(--w-wide)}
.vcs .roll{padding-block:54px 26px;display:flex;flex-direction:column;gap:14px}
.vcs .rolltag{font:var(--w-semi) 10.5px/1.6 var(--font-mono);letter-spacing:.17em;
              text-transform:uppercase;color:var(--faint);font-variant-numeric:tabular-nums;
              display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.vcs .rolltag i{font-style:normal;color:var(--border-strong)}
.vcs h1{font-family:var(--font-serif);font-weight:400;
        font-size:clamp(30px,3.6vw,46px);line-height:1.05;letter-spacing:-.016em;
        text-wrap:balance;max-width:20ch}
.vcs .dek{max-width:60ch;margin-top:0}
/* 6 across at the wide container, dropping by content rather than by device
   width. The gap is 6px on purpose: a proof sheet is butted, not spaced. */
.vcs .sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:6px;
            padding-block:30px 8px;border-top:var(--hairline) solid var(--border)}
.vcs .frame{position:relative;display:block;aspect-ratio:1;background:var(--surface);
            overflow:hidden;isolation:isolate;
            transition-property:opacity;transition-duration:150ms;
            transition-timing-function:var(--e-out)}
.vcs .frame img{width:100%;height:100%;object-fit:cover;display:block}
/* A record with no picture is not a hole: the title takes the frame, set in
   the serif, so the grid keeps its rhythm and the record keeps its rank. */
.vcs .frame .noimg{display:flex;height:100%;padding:16px;align-items:flex-end;
                   font-family:var(--font-serif);font-size:17px;line-height:1.24;
                   letter-spacing:-.012em;color:var(--muted);
                   outline:1px solid var(--img-outline);outline-offset:-1px}
/* The grease-pencil frame number, bottom-left, the way a proof sheet marks
   its exposures. Never the only route to the record — the legend row below
   carries the same link as text. */
.vcs .fno{position:absolute;left:0;bottom:0;z-index:1;
          font:var(--w-semi) 10px/1 var(--font-mono);letter-spacing:.08em;
          font-variant-numeric:tabular-nums;color:#fff;
          background:rgb(0 0 0 / .66);backdrop-filter:blur(6px);
          padding:5px 6px;pointer-events:none}
.vcs .fkind{position:absolute;right:0;bottom:0;z-index:1;
            font:10px/1 var(--font-mono);letter-spacing:.06em;color:#fff;
            background:rgb(0 0 0 / .66);backdrop-filter:blur(6px);

/* Cross-highlight is embellishment only: it dims the other frames while one

/* ══ V3 · Formulary — the task as a set of formulas ══════════════════════
   The pharmacopoeia, not the picture book. A beauty prompt is a
   specification — an identity lock, a lighting rig, a lens — so this
   direction sets each record the way a formulary sets a preparation:
   composition first as a definition list, then the preparation itself
   verbatim in mono. The picture drops to a 76px swatch, which is what a
   swatch is for: confirming the formula, not selling it.
   H1: sans 510 on the tier-ref step, 40px at 1360 / 28px at 375. */
.vfm .wrap{max-width:var(--w-page)}
.vfm .preface{padding-block:56px 30px;display:flex;flex-direction:column;gap:13px}
.vfm .preface .dek{margin-top:0;font-size:16px}
.vfm .entries{border-top:var(--hairline) solid var(--border)}
.vfm .entry{display:grid;grid-template-columns:76px minmax(0,1fr);gap:0 26px;
            padding-block:30px;border-bottom:var(--hairline) solid var(--border)}
.vfm .swatch{display:flex;flex-direction:column;gap:8px}
.vfm .swatch .sq{width:76px;aspect-ratio:1;background:var(--surface);overflow:hidden;display:block}
.vfm .swatch .sq img{width:100%;height:100%;object-fit:cover;display:block}
.vfm .swatch .eno{font:var(--w-semi) 10.5px/1.6 var(--font-mono);letter-spacing:.14em;
                  color:var(--faint);font-variant-numeric:tabular-nums}
.vfm .body{min-width:0;display:flex;flex-direction:column;gap:12px}
.vfm .entry h3{font-size:17px;font-weight:var(--w-semi);letter-spacing:-.014em;
               line-height:1.3;text-wrap:balance}
/* The composition. auto/1fr rather than a fixed label column: "Technique"
   and "Model" differ by 40px and a fixed column would strand one of them. */
.vfm dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;
        font:11.5px/1.65 var(--font-mono);font-variant-numeric:tabular-nums}
.vfm dt{color:var(--faint);letter-spacing:.11em;text-transform:uppercase;white-space:nowrap}
.vfm dd{margin:0;color:var(--muted);overflow-wrap:anywhere}
/* Prose and structured JSON are different objects and are labelled as such
   (§7). The register changes with them: prose keeps the reading measure,
   JSON keeps its own line breaks. */
.vfm .reg{font:var(--w-semi) 10px/1 var(--font-mono);letter-spacing:.13em;
          text-transform:uppercase;color:var(--faint);
          border:1px solid var(--border);border-radius:5px;padding:5px 7px;
          display:inline-flex;align-self:flex-start}
.vfm .prep{font:12.5px/1.66 var(--font-mono);color:var(--foreground);
           border-left:2px solid var(--border-strong);padding-left:14px;
           overflow-wrap:anywhere;max-width:78ch;
           display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.vfm .prep.json{white-space:pre-wrap}
.vfm .foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media (max-width:620px){
  .vfm .entry{grid-template-columns:minmax(0,1fr);gap:16px}
  .vfm .swatch{flex-direction:row;align-items:center;gap:12px}
  .vfm .preface{padding-block:36px 22px}
}

/* ══ V4 · Findings — the manifesto, but measured ═════════════════════════
   Descended from L1's Manifesto and diverging from it on the one thing that
   matters: L1's claims were editorial opinions, fixed in the source. These
   are counted from the result set at render time, so a filter rewrites the
   argument as well as the evidence, and a claim can never be more confident
   than the data underneath it. Each finding is followed by one specimen
   drawn from the set it describes; the remainder closes as one paragraph.
   H1: serif 400, 96px at 1360 / 40px at 375, line-height 1, tracking normal. */
.vfd .wrap{max-width:var(--w-page)}
.vfd .arg{max-width:410px;margin-inline:auto}
.vfd .open{padding-block:92px 42px;text-align:center}
.vfd h1{font-family:var(--font-serif);font-weight:400;
        font-size:clamp(40px,7.6vw,96px);line-height:1;letter-spacing:normal;
        text-wrap:balance;max-width:15ch;margin-inline:auto}
.vfd .open .lede{font-size:17px;line-height:1.6;letter-spacing:normal;color:var(--muted);
                 margin:28px auto 0;text-wrap:pretty}
.vfd .finding{border-top:var(--hairline) solid var(--border);padding-block:54px}
/* The number carries the claim, so it is set at reading size in the serif
   rather than shrunk into a caption. */
.vfd .finding h2{font-family:var(--font-serif);font-weight:400;font-size:26px;line-height:1.24;
                 letter-spacing:normal;text-align:center;text-wrap:balance;
                 max-width:22ch;margin-inline:auto}
.vfd .finding .arg p{font-size:17px;line-height:1.6;letter-spacing:normal;margin-top:16px;
                     text-wrap:pretty;color:var(--muted)}
.vfd .spec{max-width:648px;margin:36px auto 0}
.vfd .spec .sno{font:var(--w-semi) 10.5px/1.6 var(--font-mono);letter-spacing:.17em;
                text-transform:uppercase;color:var(--faint);font-variant-numeric:tabular-nums;
                padding-bottom:8px;margin-bottom:14px;
                border-bottom:var(--hairline) solid var(--border-strong);
                display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.vfd .spec figure img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover}
.vfd .spec h3{font-family:var(--font-serif);font-weight:400;font-size:21px;line-height:1.22;
              letter-spacing:-.012em;text-wrap:balance;margin-top:16px}
.vfd .spec .verbatim{font:12.5px/1.62 var(--font-mono);white-space:pre-wrap;
                     overflow-wrap:anywhere;color:var(--foreground);margin-top:14px;
                     border-left:2px solid var(--foreground);padding-left:14px;
                     display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.vfd .spec .cred{font:11px/1.7 var(--font-mono);color:var(--faint);letter-spacing:.06em;
                 text-transform:uppercase;font-variant-numeric:tabular-nums;margin-top:12px;

.vfd .spec .rr{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.vfd .allof{max-width:648px;margin:24px auto 0;font-family:var(--font-serif);font-size:19px;
            line-height:2.05;letter-spacing:-.006em;text-align:justify;hyphens:auto;
            color:var(--muted);overflow-wrap:break-word}
/* Thirty underlines in one paragraph at --border-strong read as a rule under
   the whole block; the hairline keeps the affordance without hover. */
.vfd .allof a{color:var(--foreground);border-bottom:var(--hairline) solid var(--border);
              transition-property:border-color;transition-duration:150ms;

}

/* ══ V5 · Lookbook — one look per band ═══════════════════════════════════
   The fashion book. Where L1's Plate mounts the work uncropped inside a
   frame and captions it like a museum, this crops to a tall editorial ratio
   and lets the picture bleed to the viewport edge, with the caption in the
   opposite column. Text stays off the image entirely — a scrim over a
   photograph you do not control is a contrast bug waiting for the one
   record whose corner is white.
   H1: serif 400, 68px at 1360 / 34px at 375, line-height 1.02, −.018em. */
/* The book page, not the wide frame: at the 1436px container a 7fr picture
   is 778px across, which at 4:5 is 973px tall — taller than the viewport it
   has to be judged in. The 1024px step puts one look at 538×672 instead. */
.vlb .wrap{max-width:var(--w-page)}
.vlb .titlecard{padding-block:96px 40px;display:flex;flex-direction:column;gap:18px}
.vlb h1{font-family:var(--font-serif);font-weight:400;
        font-size:clamp(34px,5.4vw,68px);line-height:1.02;letter-spacing:-.018em;
        text-wrap:balance;max-width:16ch}
.vlb .titlecard .dek{margin-top:0;max-width:52ch}
/* The band bleeds one edge. `grid-template-columns` carries the bleed rather
   than a negative margin, so nothing can push the document past 100vw — the
   foundation already sets overflow-x:hidden and a bleed that relies on it is
   a bug hidden by a workaround. */
.vlb .looks{border-top:var(--hairline) solid var(--border)}
.vlb .look{display:grid;gap:0 46px;align-items:center;
           padding-block:70px;border-bottom:var(--hairline) solid var(--border);
           grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.vlb .look .shot{min-width:0}
.vlb .look .shot img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover}
/* A record with no picture keeps the band: the prompt takes the space the
   photograph would have had, set large in the serif. */
.vlb .look .noshot{aspect-ratio:4/5;display:flex;align-items:center;
                   padding:34px;background:var(--surface);
                   outline:1px solid var(--img-outline);outline-offset:-1px}
.vlb .look .noshot p{font-family:var(--font-serif);font-weight:400;
                     font-size:clamp(18px,2vw,26px);line-height:1.34;letter-spacing:-.014em;
                     color:var(--muted);max-width:30ch;
                     display:-webkit-box;-webkit-line-clamp:10;-webkit-box-orient:vertical;
                     overflow:hidden}
/* Alternating side. DOM order stays picture → caption in both; only the
   painted column flips, so what a screen reader announces never changes. */
.vlb .look.flip{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.vlb .look.flip .shot{order:2}
.vlb .look.flip .cap{order:1}
.vlb .cap{display:flex;flex-direction:column;gap:14px;min-width:0;max-width:44ch}
.vlb .cap .lno{font:var(--w-semi) 10.5px/1.6 var(--font-mono);letter-spacing:.17em;
               text-transform:uppercase;color:var(--faint);font-variant-numeric:tabular-nums;
               padding-bottom:9px;border-bottom:var(--hairline) solid var(--border-strong);
               display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.vlb .cap h3{font-family:var(--font-serif);font-weight:400;font-size:clamp(21px,2.3vw,28px);
             line-height:1.2;letter-spacing:-.014em;text-wrap:balance}
.vlb .cap .line{font-size:14.5px;line-height:1.6;color:var(--muted);text-wrap:pretty;
                display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.vlb .cap dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;
             font:11px/1.7 var(--font-mono);font-variant-numeric:tabular-nums}
.vlb .cap dt{color:var(--faint);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.vlb .cap dd{margin:0;color:var(--muted);overflow-wrap:anywhere}
.vlb .cap .rr{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
@media (max-width:860px){
  .vlb .look,.vlb .look.flip{grid-template-columns:minmax(0,1fr);gap:24px;padding-block:44px}
  .vlb .look.flip .shot{order:0}
  .vlb .look.flip .cap{order:0}
  .vlb .cap{max-width:none}
  .vlb .titlecard{padding-block:56px 28px}
}

<style id="linear-dark-theme">
/* ─────────────────────────────────────────────────────────────────────────
   Linear-derived dark theme for the prototype pickers.

   Values come from the token snapshot at
   `specs/images/linear-design-tokens.css` (Linear public-site CSS, snapshot
   2026-09-03), not from memory. This is a COLOUR re-theme only: type and
   geometry stay on the project's own system, because `frontend/AGENTS.md` §7.6
   has not ruled on a web font and Linear's faces (Inter Variable, Berkeley
   Mono, Tiempos Headline) are not licensed here. Weights stay 400/600.

   The four pickers were written at different times and use three different
   token vocabularies (`--background`/`--bg`, `--foreground`/`--fg`,
   `--muted`/`--muted-fg`, `--faint`/`--faint-fg`, `--font-sans`/`--sans`).
   Every unambiguous alias is set, so one block themes all four — see the
   note on `--muted` below for the one token deliberately skipped.

   Contrast, measured against the canvas ladder (WCAG 2, sRGB):

     token                 #08090a  #0f1011  #141516  #191a1b
     --foreground #f7f8f8    18.73    17.90    17.18    16.38
     --muted-fg   #d0d6e0    13.64    13.04    12.52    11.93
     --faint      #8a8f98     6.13     5.86     5.63     5.36
     --accent     #7170ff     5.18     4.96     4.76     4.53
     --ok         #4cc38a     9.00     8.60     8.25     7.87
     white on brand fill #5e6ad2 …………………………………………………… 4.70

   Three deliberate departures from Linear's own dark tokens, each because a
   token Linear uses decoratively is used here as text:

   1. `--faint` takes Linear's TERTIARY ink `#8a8f98`, not its quaternary
      `#62666d`. Quaternary measures 3.45:1 — below the 4.5:1 floor — and this
      project spends `--faint` on 11px mono captions, which is text.
   2. `--accent` takes `#7170ff`, NOT the `#5252f5` that `frontend/CLAUDE.md`
      mandates. That mandate is a LIGHT-mode repair: `#7070ff` fails AA on all
      four light surfaces (3.30–3.85) and `#5252f5` fixes it. Inverted, the
      rule inverts too — `#5252f5` measures 3.69:1 on `#08090a` and would be
      the unreadable one. Same intent, opposite value.
   3. `--ok` lifts Linear's `#27a644` to `#4cc38a`. Per the `color` skill,
      brand colours carried into dark at full saturation vibrate; lightness
      goes up and chroma comes down. It also buys 6.29:1 → 9.00:1 at 11px.
   ───────────────────────────────────────────────────────────────────────── */

:root[data-theme="linear-dark"] {
  color-scheme: dark;

  /* Canvas ladder — level-0 is the page, level-1 insets, level-2 cards.
     Dark mode keeps the layering hierarchy; it is not inverted light mode. */
  --background: #08090a;  --bg: #08090a;
  --surface:    #0f1011;
  --card:       #141516;

  /* Ink */
  --foreground: #f7f8f8;  --fg: #f7f8f8;
  /* --muted is deliberately NOT set. It is ink in L1/L4 but a translucent
     SURFACE wash in L2/L3 (`color-mix(in srgb, var(--fg) 8%, transparent)`,
     used only for avatar and media placeholders). Forcing one ink value here
     painted light-grey boxes onto a near-black canvas in L3. Every file's own
     definition self-corrects once --fg/--foreground flip and color-scheme is
     dark, so the token is left alone on purpose. --muted-fg is unambiguous
     ink and is set. */
  --muted-fg: #d0d6e0;
  --faint:      #8a8f98;  --faint-fg: #8a8f98;

  /* Lines. Linear's dark borders are solid, not alpha-white — a translucent
     white hairline glows on near-black instead of receding. */
  --border:        #23252a;
  --border-strong: #34343a;

  /* Interaction. Indigo carries interaction semantics only: focus, links,
     ::selection, and the single primary action per view. */
  --accent:    #7170ff;
  --accent-bg: #1b1c33;

  /* The inverted button: Linear's own --color-button-invert-bg. */
  --primary:    #e5e5e6;
  --primary-fg: #08090a;

  /* Status */
  --ok:   #4cc38a;
  --cand: #f0bf00;

  /* L4's placeholder highlight, on Linear's orange */
  --var-bg: #2a1a12;
  --var-fg: #fc9a6e;
}

/* The prototypes gate their dark-mode image outline on `prefers-color-scheme`,
   which does not fire when the theme is forced by attribute. A tinted outline
   picks up the surface behind it and reads as grime, so it must be pure white. */
:root[data-theme="linear-dark"] img { outline-color: rgb(255 255 255 / .1); }

/* Selection carries the brand quietly and stays legible. */
:root[data-theme="linear-dark"] ::selection {
  background: color-mix(in oklab, #5e6ad2, black 10%);
  color: #fff;
}

/* Depth: on dark, a stacked shadow is invisible, so every elevation collapses
   to a single low-opacity white ring. */
:root[data-theme="linear-dark"] [data-elevated] {
  box-shadow: 0 0 0 1px rgb(255 255 255 / .09);
}
</style>

exture. 85mm for detail. 50mm for natural perspective. 35mm for environmental shots. Controlled dolly and crane movements. Realistic depth of field. Natural focus transitions. Soft motion blur. Subtle lens imperfections. No artificial camera shake. MATERIAL DIRECTION Every surface must visibly behave like physical paper. Visible paper fibers. Natural folds. Tiny imperfections. Soft cardboard edges. Realistic contact shadows. Believable paper thickness. Natural material deformation. LIGHTING Soft morning daylight. Large window as the primary source. Natural bounce light. Gentle shadows. Subtle warm highlights. No artificial neon effects. No excessive visual effects. CONTINUITY The same paper city throughout the entire sequence. Buildings maintain identical shapes and positions. Roads remain connected. Paper materials remain consistent. No random transformations. No flickering. No duplicated structures. No sudden environmental changes. DIRECTOR’S NOTE Treat this as a miniature feature film, not a visual-effects demonstration. The camera should discover the world gradually. Start intimate. Reveal scale. Return to detail. Finish wide. The audience should feel that they are watching a real handcrafted world photographed with a cinema camera. Photorealistic 4K • tactile materials • feature-film cinematography • sophisticated lighting • realistic miniature photography • cinematic depth • precise camera movement • seamless visual continuity.", "models": ["GPT Image", "Seedance"], "uses": [], "styles": ["Cinematic", "Photorealistic"], "techs": ["Camera movement / shot language", "Transition / morph / match cut"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2088865943921528832/img/ACj33PYyBD5RI7qH.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2088865943921528832/img/ACj33PYyBD5RI7qH.jpg?name=small"], "n": 1, "dur": 30, "handle": "@ChillaiKalan__", "likes": 407, "saves": 409, "hv": true, "score": 95.3}, {"id": "2008 ate is giving a bonus to whoever—\" Instant snap zoom to Stanley. His head lifts. He takes off his glasses. Dead serious. STANLEY: \"I'm listening.\" MICHAEL (waving him off): \"—anyway. Moving on. Next topic. Prompt engineering.\" Snap zoom back to Stanley. He immediately puts his glasses back on, lowers his head, and returns to the crossword as if nothing happened. Cut to Jim, who slowly turns his head and looks directly into the camera lens with a flat, knowing expression. Hold for two seconds. STYLE: single-camera sitcom shot like a documentary crew is present, natural performances, no laugh track, muted office color palette, slightly soft consumer-camera look, characters occasionally glancing at the lens.", "models": [], "uses": [], "styles": [], "techs": ["Camera movement / shot language", "Lip sync / dialogue"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2084387230844346368/img/3q3PrcBYVZsGJ3lW.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2084387230844346368/img/3q3PrcBYVZsGJ3lW.jpg?name=small"], "n": 1, "dur": 15, "handle": "@Arminn_Ai", "likes": 446, "saves": 383, "hv": true, "score": 93.6}, {"id": "2085640281941307648", "slug": "montage-multi-shot-candid-observational-foot-2085640281941307648", "title": "Seven-shot handheld observational montage", "prompt": "Montage, multi-shot candid observational footage. Do not use a single camera angle or continuous take. Handheld documentary style with the feeling of accidental real-life capture. Slightly imperfect framing, subtle handheld shake, tiny reframing adjustments, gentle exposure breathing, and autofocus that settles half a beat late. Realistic skin texture, soft indoor natural light, film grain, shallow depth of field. Relaxed breathing, natural blinking, restrained and authentic performance. Total of 7 shots. The woman from @ Image 1 is wearing a matching cotton pajama set consisting of a scoop-neck sleeveless top and loose shorts made from the same fabric and design. Barefoot, she lies on her stomach across a lived-in, slightly messy bed in her bedroom, browsing a mobile shopping page on a black smartphone. A house cat jumps onto the bed seeking attention, and she affectionately plays with it. Moments later, a friend calls. She answers, chats, and eventually bursts into laughter. The doorbell rings, so she ends the call and gets up to collect her dinner. Shot 1 (0–2s): She is already moving. One thumb scrolls through a shopping page while she frowns slightly, thinking. She quietly mutters in Korean: \"아, 뭐 살랬더라…\" (\"Ah... what was I going to buy again?\"). Lips synchronize naturally. Her bare feet gently sway behind her. A low handheld camera glides along the edge of the mattress, with soft bedding partially obscuring the foreground. Shot 2 (2–4s): The house cat jumps onto the bed, compressing the blanket as it walks toward her forearm and lets out a single meow. The camera gives a slight jolt from the impact, then quickly reframes from the phone to an over-the-shoulder view that includes her face, hands, phone, and cat. Shot 3 (4–6s): She turns warmly toward the cat, stroking it once from its forehead to its shoulders. In a gentle, affectionate tone she says: \"우리 애기 왔어?\" (\"Did my baby come?\"). Lip sync is clear and natural. The camera pushes in briefly through the cat's softly blurred foreground toward her face and hand. Shot 4 (6–8s): A friend's ringtone sounds. She glances down, confirms the caller, swipes to answer, and brings the phone to her ear. The camera moves in a loose semicircle from a slightly tilted overhead angle, capturing the entire answering motion. Shot 5 (8–11s): Her friend begins talking. She responds first with confusion, then disbelief: \"어, 왜? 진짜 거짓말.\" (\"Huh? Why? No way, you're kidding.\"). Immediately afterward she naturally bursts into laughter. The cat kneads the blanket beside her. A close handheld side angle keeps both her phone and profile within the same focal plane. Shot 6 (11–13s): A clear doorbell interrupts the laughter. Both she and the cat turn toward the bedroom door. She braces one hand on the mattress to get up. The camera reacts a fraction too late, briefly turning toward the door before naturally correcting back to her rising movement. Shot 7 (13–15s): Still on the phone, she hurriedly says: \"어, 나 밥 왔다. 끊어.\" (\"My food's here. I'll hang up.\"). She ends the call with her thumb, gets off the bed, and walks toward the door while the cat follows across the blankets. The camera slides low beneath her elbow and tilts upward as she stands in one continuous motion. Sound: No music. Only raw production sound: bedding rustling, quiet breathing, finger taps on the phone, the soft impact of the cat jumping onto the bed, one natural meow, faint purring, a single short incoming ringtone, call connection tone, the friend's voice through the phone, the woman's four Korean lines with accurate lip sync, a genuine brief laugh, one clear doorbell, the tap ending the call, and soft cat footsteps. No subtitles, no on-screen text, no logo, no watermark. Never render a reference sheet or duplicate the subject.", "models": ["Seedance"], "uses": ["Food & beverage"], "styles": ["Photorealistic"], "techs": ["Camera movement / shot language", "Lip sync / dialogue", "Multi-shot / storyboard"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2085640247682224128/img/Wj08brZzXojtfWtv.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2085640247682224128/img/Wj08brZzXojtfWtv.jpg?name=small"], "n": 1, "dur": 15, "handle": "@oggii_0", "likes": 297, "saves": 232, "hv": true, "score": 93.6}, {"id": "2047862141894681076", "slug": "a-realistic-young-woman-sitting-casually-in--2047862141894681076", "title": "Bedroom phone recording, late afternoon light", "prompt": "A realistic young woman sitting casually in a softly lit bedroom during late afternoon. She is holding her phone very close to her face rief accidental face cropping, and imperfect framing throughout. The camera itself is never visible. LOOK: Warm analog tape texture with gentle film grain, softened sharpness, subtle halation where sunlight cuts between buildings, faint salt-air haze, realistic skin tones, low contrast, tiny exposure shifts, natural motion blur. Authentic everyday footage, not a polished commercial. STYLE: A quiet Mediterranean morning coffee-run vlog. Unhurried, warm, spontaneous. She talks to the camera in short sentences with comfortable pauses, reacts to the street around her, laughs easily. CHARACTER: ELENA — a Mediterranean woman in her mid-20s. Dark wavy hair in a loose bun, olive skin, minimal makeup, small gold hoops, oversized white linen shirt, denim shorts, leather sandals, canvas tote on one shoulder. SETTING: A sun-washed coastal old town just after sunrise. Narrow limestone alleys, pastel shutters, bougainvillea spilling over walls, glimpses of the sea between buildings, distant church bells and scooters, almost no people. A sleepy stray cat on a warm step. SCENES: The vlog opens in selfie mode as Elena steps out of the doorway into the bright alley, squinting. \"Morning.\" She walks, sunlight strobing between buildings across her face. \"Okay it's already hot. Of course it is.\" She reaches a tiny corner kiosk and orders an iced coffee, camera still handheld, framing half-wrong. She sets the camera on the counter ledge for a wide shot while she waits, drumming her fingers. A stray cat appears at her feet and stares up. She crouches down to it. \"Hi. You again.\" The cat rubs against her leg. She laughs. \"I have a bodyguard now.\" She picks the camera back up, coffee in the other hand, and walks toward the water, the cat trotting behind for a few steps. She sits on the low seawall, sea behind her, and takes the first sip. \"Worth it. Every time.\" She looks off at the water for a moment, hair moving in the breeze, then back to the lens. \"Okay. Work now.\" A small wave. \"See you later.\"", "models": ["Seedance"], "uses": ["Advertising", "Beauty", "Food & beverage", "UGC"], "styles": ["Photorealistic", "Retro / vintage"], "techs": ["Camera movement / shot language"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2087155707795607552/img/GvPt7yiUAlXPgSXk.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2087155707795607552/img/GvPt7yiUAlXPgSXk.jpg?name=small"], "n": 1, "dur": 15, "handle": "@PhedEU", "likes": 133, "saves": 160, "hv": false, "score": 83.9}, {"id": "2089932434351734933", "slug": "use-the-uploaded-reference-image-as-the-exac-2089932434351734933", "title": "Locked product and identity, outfit swapped", "prompt": "Use the uploaded reference image as the exact character and product reference. Preserve the woman’s facial identity, hairstyle, eye color, makeup, skin tone, body proportions, jewelry, and overall appearance consistently throughout the entire video. Change her outfit to a fitted sleeveless PINK top with clean WHITE shorts and keep the outfit identical in every shot. Use the uploaded sunglasses, earbuds, orange retail packaging, and carrying cases as LOCKED product references. Preserve their exact shapes, colors, materials, proportions, buttons, lenses, hinges, charging case, textures, and every visible product detail. Do not redesign, replace, or invent any product elements. Create an ultra-realistic UGC luxury lifestyle review filmed inside a modern luxury bedroom during warm golden hour. The woman is the clear visual focus, with authentic creator energy and natural expressions. Use warm sunlight coming through the bedroom windows, soft realistic shadows, natural skin texture, shallow depth of field, subtle handheld smartphone movement, realistic autofocus behavior, natural motion blur, and premium commercial-quality cinematography. Include a realistic cat naturally interacting with her only where specified, without distracting from the products. 0–5 s /* ══ V4 · Findings ════════════════════════════════════════════════════ */
/* Every claim is counted from the current result set, so a filter rewrites
   the argument and not just the evidence, and no headline can outrun its
   data. A finding whose pool is empty is dropped rather than softened. */
function vfdSpecimen(r, i, note){
  if (!r) return "";
  return `<div class="spec">
    <p class="sno"><span>Specimen ${pad2(i)}</span><span>${esc(credit(r))}</span></p>
    ${r.img ? `<figure><img src="${esc(r.img)}" alt="Result from ${esc(r.title)}" loading="lazy"
        referrerpolicy="no-referrer" width="800" height="500"></figure>` : ""}
    <h3>${esc(r.title)}</h3>
    <p class="verbatim">${esc(verbatim(r, 460))}</p>
    <p class="cred"><span>${esc(medium(r))}</span><span>${n(r.likes)} likes</span>
      <span>${isRaw(r) ? "Structured JSON" : "Prose"}</span></p>
    <p class="cred" style="text-transform:none;letter-spacing:normal">${esc(note)}</p>
    <span class="rr"><a class="btn" href="${esc(href(r))}">Read it →</a>
      <a class="btn pri" href="${esc(href(r))}">${esc(cta(r))}</a></span>
  </div>`;
}
function vfdArgument(){
  const rows = results();
  if (!rows.length) return `<section class="finding"><div class="wrap">${emptyState()}</div></section>`;
  const total = rows.length;
  const used = new Set();
  const take = pool => { const r = pool.find(x => !used.has(x.id)); if (r) used.add(r.id); return r || pool[0]; };

  const has = (key, v) => rows.filter(r => asList(r, key).includes(v));
  /* Every headline is a sentence built around a number that is counted, not
     typed — so each one has to survive a count of 1 and a count equal to the
     whole set. A one-record task produced "All one are signed." before these
     three branches existed, which is the argument for testing a direction on
     its worst set rather than its best one. The bodies stay task-neutral:
     they are editorial prose, they are not counted, and prose that is true of
     Beauty and false of Automotive would be the page lying quietly. */
  const many = (c, one, some, all) => c === 1 ? one : (c === total ? all(c) : some(c));
  /* "All two of them move" is grammatical and still reads as a machine wrote
     it. English has a word for two. */
  const allOf = c => c === 2 ? "Both" : `All ${spell(c)}`;
  const candidates = [
    { pool: has("subjects","Person / portrait"),
      head: c => many(c, `The one there is, is a portrait.`,
                      c => `${Spell(c)} of the ${spell(total)} are portraits.`,
                      c => `${allOf(c)} of them are portraits.`),
      body: `A face the model has to hold still — the same bones, the same freckles, from one render to the next.`,
      note: `Counted by the subject each author tagged, not by what the picture looks like.` },
    { pool: rows.filter(isRaw),
      head: c => many(c, `One of them is not a sentence at all.`,
                      c => `${Spell(c)} are not sentences at all.`,
                      c => `Not one of them is a sentence.`),
      body: `They are JSON — nested objects naming the lens, the lighting, the skin, the wardrobe. Set as prose they would read as gibberish, so this library never sets them as prose.`,
      note: `Detected from the text itself: the prompt opens with a brace or carries quoted keys.` },
    { pool: has("techs","Camera movement / shot language"),
      head: c => many(c, `It specifies the camera before it specifies the subject.`,
                      c => `${Spell(c)} specify the camera before they specify the subject.`,
                      c => `Every one specifies the camera before it specifies the subject.`),
      body: `Focal length, angle, the quality of the light at a named hour. The result is downstream of the optics, and these prompts say so in that order.`,
      note: `Counted by technique tag.` },
    { pool: rows.filter(r => r.kind === "video"),
      head: c => many(c, `One of them moves.`,
                      c => `${Spell(c)} of them move.`,
                      c => `${allOf(c)} of them move.`),
      body: `A video prompt reads as a shot list rather than a description — a sequence someone has to be able to follow.`,
      note: `Counted by media kind, which is recorded per prompt and never inferred.` },
    { pool: rows.filter(r => r.handle),
      head: c => many(c, `The one there is, is signed.`,
                      c => `${Spell(c)} of them are signed.`,
                      c => `${allOf(c)} are signed.`),
      body: `Every prompt on this page names the person who published it and links back to the post it came from. None of it was written here.`,
      note: `The author is part of the record, not decoration on it.` },
  ].filter(c => c.pool.length);

  const findings = candidates.map((c,i) => `<section class="finding"><div class="wrap">
      <h2>${esc(c.head(c.pool.length))}</h2>
      <div class="arg"><p>${esc(c.body)}</p></div>
      ${vfdSpecimen(take(c.pool), i+1, c.note)}
    </div></section>`).join("");

  const rest = rows.filter(r => !used.has(r.id));
  return findings + `<section class="finding"><div class="wrap">
    <h2>And the rest of them.</h2>
    <div class="arg"><p>${rest.length
      ? `The other ${spell(rest.length)} ${esc(state.task.toLowerCase())} ${rest.length === 1 ? "prompt" : "prompts"} in this set, in the order the library holds them.`
      : `Every prompt in this set is already shown above as a specimen.`}</p></div>
    ${rest.length ? `<p class="allof">${rest.map(r =>
      `<a href="${esc(href(r))}" title="${esc(credit(r))}">${esc(r.title)}</a>`
    ).join('<span class="sep" aria-hidden="true">·</span>')}</p>` : ""}
  </div></section>`;
}
function vfd(){
  return `<div class="taste vfd" data-v="vfd">${nav()}<main id="main">
    <section class="wrap open">
      <h1>${esc(state.task)} prompts are specifications.</h1>
      <div class="arg"><p class="lede">Not wishes. Everything below is counted from the
        ${taskRows().length} prompts this task holds right now — change the filters and the
        argument is recounted with them.</p></div>
    </section>

}

function vlb(){

/* ── behaviour, delegated once so the picker wiring stays verbatim ───── */
const variants = [vdr, vcs, vfm, vfd, vlb];
const stage = document.getElementById('stage');
const kind = () => (stage.firstElementChild ? stage.firstElementChild.getAttribute('data-v') : "");
function put(sel, html){ const el = stage.querySelector(sel); if (el) el.innerHTML = html; }

const RESULTS = { vdr:vdrItems, vcs:vcsSheet, vfm:vfmEntries, vfd:vfdArgument, vlb:vlbLooks };

function redraw(){
  const fn = RESULTS[kind()];
  if (fn) put('[data-results]', fn());
}
/* A task change is a route change: the whole page is rebuilt, because the
   title, the counts, the findings and the tail all belong to the new task. */
function rebuild(){ mount(current); }

stage.addEventListener('click', e => {
  const task = e.target.closest('[data-task]');
  if (task){
    e.preventDefault();
    const v = task.getAttribute('data-task');
    if (v !== state.task){
      state.task = v;
      Object.keys(state.active).forEach(k => state.active[k] = []);
      rebuild();
    }
    return;
  }
  const facet = e.target.closest('[data-facet]');
  if (facet){
    e.preventDefault();
    const k = facet.getAttribute('data-facet'), v = facet.getAttribute('data-value');
    const on = state.active[k];
    const i = on.indexOf(v);
    if (i === -1) on.push(v); else on.splice(i, 1);
    stage.querySelectorAll(`.chip[data-facet="${k}"][data-value="${CSS.escape(v)}"]`)
      .forEach(el => el.setAttribute('aria-pressed', String(i === -1)));
    redraw();
    return;
  }
  if (e.target.closest('[data-clear]')){
    Object.keys(state.active).forEach(k => state.active[k] = []);
    rebuild();
  }
});

/* Contact sheet cross-highlight. Embellishment only — every frame and every
   legend row is already a link to the same record, so nothing here is
   reachable by pointer alone. focusin/focusout carry the keyboard. */
function lightUp(i){
  const sheet = stage.querySelector('[data-sheet]');
  const legend = stage.querySelector('[data-legend]');
  if (!sheet) return;
  if (i == null) sheet.removeAttribute('data-lit'); else sheet.setAttribute('data-lit','');
  [sheet, legend].forEach(root => root && root.querySelectorAll('[data-i]').forEach(el => {
    el.toggleAttribute('data-lit', i != null && el.getAttribute('data-i') === i);
  }));
}
['mouseover','focusin'].forEach(ev => stage.addEventListener(ev, e => {
  const el = e.target.closest && e.target.closest('[data-i]');
  if (el) lightUp(el.getAttribute('data-i'));
}));
['mouseout','focusout'].forEach(ev => stage.addEventListener(ev, e => {
  if (e.target.closest && e.target.closest('[data-i]')) lightUp(null);
}));

/* ── picker wiring, from PICKER.md ───────────────────────────────────── */
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));

</script>
</body>
</html>
