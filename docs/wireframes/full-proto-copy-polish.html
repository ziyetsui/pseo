<meta charset="utf-8">
<title>Prompt library — full wireframe (EN)</title>
<style>
:root{color-scheme:light dark;
  --sh-bg:light-dark(rgb(255 255 255),rgb(22 22 24));
  --sh-fg:light-dark(rgb(24 26 29),rgb(250 250 252));
  --sh-muted:light-dark(rgb(24 26 29/55%),rgb(250 250 252/55%));
  --sh-border:light-dark(rgb(24 26 29/14%),rgb(255 255 255/18%));
  --sh-card:light-dark(rgb(255 255 255/92%),rgb(32 32 36/92%));}
body{margin:0;background:var(--sh-bg);color:var(--sh-fg);
  font:13px/1.5 -apple-system,system-ui,"PingFang SC",sans-serif}
.frame{position:fixed;inset:0;width:100%;height:100%;border:0;visibility:hidden;background:var(--sh-bg)}
.frame.on{visibility:visible}
.lvl{position:fixed;left:14px;bottom:14px;z-index:999;display:flex;gap:3px;align-items:center;
  padding:5px;border:1px solid var(--sh-border);border-radius:999px;background:var(--sh-card);
  backdrop-filter:blur(10px);box-shadow:0 4px 18px rgb(0 0 0/12%)}
.lvl button{border:0;background:transparent;color:var(--sh-muted);font:inherit;font-size:12px;
  padding:4px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.lvl button:hover{color:var(--sh-fg)}
.lvl button[aria-current="true"]{background:var(--sh-fg);color:var(--sh-bg)}
.lvl .sep{width:1px;height:14px;background:var(--sh-border)}
</style>
<nav class="lvl" aria-label="Level">
  <button data-r="l1">L1 Hub</button><span class="sep"></span>
  <button data-r="l2">L2 Images</button><span class="sep"></span>
  <button data-r="l2v">L2 Videos</button><span class="sep"></span>
  <button data-r="l3">L3 Model</button><span class="sep"></span>
  <button data-r="l4">L4 Prompt</button>
</nav>
<script>
const PAGES={"l1": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Prompt Library</title>\n<style>\n:root{\n  color-scheme: light dark;\n  --background: light-dark(rgb(255 255 255), rgb(22 22 24));\n  --surface: light-dark(rgb(250 250 251), rgb(28 28 31));\n  --foreground: light-dark(rgb(24 26 29), rgb(250 250 252));\n  --muted: light-dark(rgb(24 26 29 / 56%), rgb(250 250 252 / 56%));\n  --faint: light-dark(rgb(24 26 29 / 38%), rgb(250 250 252 / 38%));\n  --card: light-dark(rgb(255 255 255), rgb(32 32 36));\n  --border: light-dark(rgb(24 26 29 / 11%), rgb(255 255 255 / 13%));\n  --border-strong: light-dark(rgb(24 26 29 / 20%), rgb(255 255 255 / 24%));\n  --accent: light-dark(rgb(51 126 255), rgb(131 180 255));\n  --ok: light-dark(rgb(0 133 61), rgb(74 200 124));\n  --font-sans: -apple-system, system-ui, \"Segoe UI\", \"PingFang SC\", \"Hiragino Sans GB\", sans-serif;\n  --font-mono: ui-monospace, SFMono-Regular, \"SF Mono\", Menlo, Consolas, monospace;\n  --r: 12px; --wrap: 1160px;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0}\nhtml{-webkit-text-size-adjust:100%}\nbody{background:var(--background);color:var(--foreground);font-family:var(--font-sans);\n     font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}\na{color:inherit;text-decoration:none}\nh1,h2,h3,h4,p{margin:0}\n.wrap{max-width:var(--wrap);margin:0 auto;padding:0 28px}\ncode{font-family:var(--font-mono)}\n:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}\n.skip{position:absolute;left:-9999px;background:var(--accent);color:#fff;padding:9px 14px;z-index:99}\n.skip:focus{left:10px;top:10px}\n.hide{display:none !important}\n\n.nav{border-bottom:1px solid var(--border);background:var(--background);position:sticky;top:0;z-index:40}\n.nav .wrap{display:flex;align-items:center;gap:22px;min-height:58px;flex-wrap:wrap}\n.brand{font-weight:600;letter-spacing:-.02em;font-size:16px;margin-right:auto}\n.navlinks{display:flex;gap:20px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}\n.navlinks a{transition:color 150ms ease-out}\n.navlinks a:hover{color:var(--foreground)}\n\n.hero{padding:60px 0 48px}\nh1{font-size:clamp(32px,5.2vw,52px);line-height:1.08;letter-spacing:-.035em;font-weight:600}\n.dek{margin-top:16px;color:var(--muted);font-size:17px;max-width:56ch}\n\n.searchrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px;align-items:center;\n           border:1px solid var(--border-strong);border-radius:var(--r);padding:8px;background:var(--card)}\n.searchrow input{flex:1 1 260px;min-width:0;border:0;background:transparent;color:var(--foreground);\n                 font:inherit;font-size:16px;padding:10px 10px}\n.searchrow input::placeholder{color:var(--faint)}\n.btn{border:1px solid var(--border-strong);background:var(--background);color:var(--foreground);\n     border-radius:8px;padding:9px 15px;font:inherit;font-size:13.5px;cursor:pointer;white-space:nowrap}\n.btn{transition:border-color 150ms ease-out,color 150ms ease-out,background-color 150ms ease-out}\n.btn:hover{border-color:var(--border-strong)}\n.btn.pri{background:var(--foreground);color:var(--background);border-color:transparent}\n\n.facetbox{margin-top:18px;border-top:1px solid var(--border);padding-top:6px}\n.facetbox>summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:7px;\n  padding:9px 0;font-size:13.5px;color:var(--muted);transition:color 150ms ease-out}\n.facetbox>summary::-webkit-details-marker{display:none}\n.facetbox>summary::before{content:\"+\";font-family:var(--font-mono);font-size:13px;color:var(--faint)}\n.facetbox[open]>summary::before{content:\"\\2212\"}\n.facetbox>summary:hover{color:var(--foreground)}\n.facets{margin-top:4px;margin-bottom:10px;display:grid;gap:2px}\n.frow{display:flex;gap:10px;align-items:baseline;padding:5px 0;flex-wrap:wrap}\n.frow>b{font-size:12px;color:var(--faint);font-weight:600;flex:0 0 64px}\n.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 240px}\n.chip{border:1px solid var(--border);border-radius:999px;padding:4px 11px;font-size:12.5px;\n      color:var(--muted);background:var(--background);white-space:nowrap;font:inherit;font-size:12.5px;cursor:pointer}\n.chip{transition:border-color 150ms ease-out,color 150ms ease-out}\n.chip:hover{border-color:var(--border-strong);color:var(--foreground)}\n.chip[aria-pressed=\"true\"]{background:var(--foreground);color:var(--background);border-color:transparent}\n.chip small{font-size:11px;opacity:.6;margin-left:4px}\n.cardchips .chip{cursor:default;padding:3px 9px;font-size:11.5px}\n\n/* The top-ranked card leads the row: same card, one modifier. Merging\n   `This week's pick` into `Most copied` removed the editorial pick, so the\n   large slot is now held by whatever actually ranks first — the section makes\n   one claim instead of two. */\n.grid .card.lead{grid-column:1/-1;flex-direction:row;gap:26px;align-items:flex-start}\n/* Two columns, each its own flow. A grid with the media spanning every row\n   distributes the text column across those rows instead of stacking it, which\n   is what pushed the chips and the prompt to the bottom of the card. */\n.grid .card.lead>.ph{flex:0 0 52%;aspect-ratio:16/10;margin:0}\n.grid .card.lead>.lead-body{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:12px}\n.grid .card.lead h3{font-size:19px;line-height:1.35;letter-spacing:-.015em}\n.grid .card.lead .ptext{max-height:190px}\n@media (max-width:760px){\n  .grid .card.lead{flex-direction:column;gap:12px}\n  .grid .card.lead>.ph{flex:none;width:100%}\n}\n\n\n/* A browse tile leads with a real frame from the set it opens, not with a\n   count and a bar. The picture is the only part that tells you what is behind\n   the label; the count stays because it changes whether you click. Every\n   thumbnail is a genuine prompt result from that axis — nothing is a stock\n   placeholder, and a term with no unused result of its own is not shown here\n   at all (it stays reachable from the footer). */\n.feature{padding:0;overflow:hidden;display:flex;flex-direction:column}\n/* The thumb must not stretch: as a flex child it would take the height of the\n   tallest tile in the row and each picture would crop differently. `flex:none`\n   pins it to its own aspect ratio, and the body takes the slack, so every tile\n   in a row is the same height with the same frame. */\n.feature .thumb{flex:none;display:block;width:100%;aspect-ratio:16/10;\n  background:var(--surface);overflow:hidden}\n.feature .thumb img{width:100%;height:100%;object-fit:cover;display:block}\n.feature .body{flex:1 1 auto;padding:13px 15px 15px;\n  display:flex;flex-direction:column;gap:4px;align-items:flex-start}\n.feature h3{font-size:15.5px}\n/* Image / video is the first fork a visitor takes, so its two tiles get half a\n   row each instead of a quarter — the frame is the answer to \"what is in here\",\n   and at quarter width it is too small to be one. */\n.feature-grid.two{grid-template-columns:repeat(2,1fr)}\n\n.sec{padding:56px 0;border-top:1px solid var(--border)}\n.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:8px;flex-wrap:wrap}\n.sec-h h2{font-size:23px;letter-spacing:-.025em;font-weight:600}\n.sec-h a{margin-left:auto;font-size:13px;color:var(--muted)}\n.sec-h a:hover{color:var(--foreground)}\n.sec-p{color:var(--muted);font-size:14.5px;max-width:70ch;margin-bottom:24px}\n\n.ph{border:1px solid var(--border);border-radius:9px;overflow:hidden;\n    background:repeating-linear-gradient(-45deg,transparent 0 9px,\n      light-dark(rgb(24 26 29/3.5%),rgb(255 255 255/4%)) 9px 18px),var(--surface);\n    display:flex;align-items:center;justify-content:center;text-align:center;padding:14px}\n.ph span{font-size:12px;color:var(--faint);line-height:1.6}\n.ph.p169{aspect-ratio:16/9}\n.ph.has{position:relative;padding:0}\n.ph.has img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}\n.ph.has .mb{position:absolute;left:8px;bottom:8px;background:rgb(0 0 0/.55);color:#fff;\n  font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;padding:4px 7px;border-radius:5px;z-index:1}\n\n/* cards */\n.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}\n.tab{border:1px solid var(--border-strong);background:transparent;color:var(--muted);\n     border-radius:8px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}\n.tab[aria-selected=\"true\"]{background:var(--foreground);color:var(--background);border-color:transparent}\n.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}\n.card{border:1px solid var(--border);border-radius:var(--r);background:var(--card);padding:15px;\n      display:flex;flex-direction:column;gap:10px}\n.card h3{font-size:15px;font-weight:600;line-height:1.35;letter-spacing:-.01em}\n.card h3 a{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;\n  transition:color 150ms ease-out}\n.card h3 a:hover{color:var(--accent)}\n.cardchips{display:flex;gap:5px;flex-wrap:wrap}\n.ptext{margin:0;font-family:var(--font-mono);font-size:11.5px;line-height:1.7;white-space:pre-wrap;\n       word-break:break-word;background:var(--surface);border:1px solid var(--border);\n       border-radius:9px;padding:11px 12px;color:var(--muted);\n       display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}\n.cardmeta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--faint);align-items:center}\n.cardmeta a{color:var(--accent)}\n.cardact{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;align-items:center}\n.copy{border:1px solid var(--border-strong);background:var(--background);color:var(--foreground);\n      border-radius:7px;padding:6px 14px;font:inherit;font-size:12.5px;cursor:pointer;\n      min-width:104px;text-align:center;transition:border-color 150ms ease-out,color 150ms ease-out}\n.copy:hover{border-color:var(--foreground)}\n.copy.done{border-color:var(--ok);color:var(--ok)}\n\n/* browse tiles */\n.feature-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}\n.feature{border:1px solid var(--border);border-radius:var(--r);background:var(--card);\n         padding:16px 17px;display:flex;flex-direction:column;gap:6px}\n.feature{transition:border-color 150ms ease-out}\n.feature:hover{border-color:var(--border-strong)}\n.feature h3{font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3}\n.feature p{color:var(--muted);font-size:12.5px}\n\n/* creators */\n.creators{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}\n.creator{border:1px solid var(--border);border-radius:var(--r);background:var(--card);\n         padding:16px;display:grid;gap:6px;justify-items:start}\n.creator:hover{border-color:var(--foreground)}\n.creator .av{width:34px;height:34px;border-radius:50%;background:var(--border-strong);\n  flex:none;display:block;overflow:hidden}\n.creator .av img{width:100%;height:100%;object-fit:cover;display:block}\n.creator b{font-size:14.5px;font-weight:600}\n.creator span{font-size:12px;color:var(--muted)}\n\nfooter{border-top:1px solid var(--border);background:var(--surface);padding:48px 0 40px}\n.footrow{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:13px}\n.footrow a{color:var(--muted);transition:color 150ms ease-out}\n.footrow a:hover{color:var(--foreground)}\n.footlegal{display:flex;gap:16px;flex-wrap:wrap;margin-top:30px;padding-top:20px;\n           border-top:1px solid var(--border);font-size:12px;color:var(--faint)}\n\n#results{display:none} #results.on{display:block}\n.empty{border:1px dashed var(--border-strong);border-radius:var(--r);padding:30px;\n       text-align:center;color:var(--faint);font-size:13.5px;grid-column:1/-1}\n\n@media (max-width:900px){\n  .feature-grid{grid-template-columns:repeat(2,1fr)}\n}\n@media (max-width:560px){\n  .wrap{padding:0 18px}\n  .feature-grid,.grid{grid-template-columns:1fr}\n  .frow>b{flex:1 1 100%}\n}\n/* --- headings: the negative Latin tracking is wrong for these Chinese headings --- */\nh1,h2,.sec-h h2,.sec-head h2,.cta h2{letter-spacing:0}\n\n/* --- reduced motion --- */\n@media (prefers-reduced-motion: reduce){\n  *,*::before,*::after{\n    transition-duration:1ms !important;\n    animation-duration:1ms !important;\n    animation-iteration-count:1 !important;\n    scroll-behavior:auto !important;\n  }\n}\n\n/* the site's fixture extractor parses this file; these nodes stay in the DOM */\n/* flow-proto-full: the hiding rule is neutralised here so the bands the\n   decluttered prototype keeps for the extractor are visible again. The\n   class stays on the elements, so this file and flow-proto.html differ\n   by exactly one declaration. */\n/* restored: rules the declutter removed with their markup */\n.featured{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:start;\n          border:1px solid var(--border);border-radius:var(--r);background:var(--card);padding:22px}\n.featured .ph{aspect-ratio:16/10}\n.featured h3{font-size:19px;font-weight:600;letter-spacing:-.015em;line-height:1.3;margin-bottom:10px}\n.featured .ptext{max-height:260px}\n.featured .meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--faint);margin:12px 0}\n.featured .meta a{color:var(--accent)}\n.fb{font-size:11px;color:var(--ok)}\n.creators{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}\n.creator{border:1px solid var(--border);border-radius:var(--r);background:var(--card);\n         padding:16px;display:grid;gap:6px;justify-items:start}\n.creator .av{width:34px;height:34px;border-radius:50%;background:var(--border-strong);\n  flex:none;display:block;overflow:hidden}\n.creator .av img{width:100%;height:100%;object-fit:cover;display:block}\n.creator b{font-size:14.5px;font-weight:600}\n.creator span{font-size:12px;color:var(--muted)}\n.cta{text-align:center;padding:70px 0}\n.cta h2{font-size:clamp(26px,4vw,40px);letter-spacing:-.03em;font-weight:600;line-height:1.12}\n.cta p{margin:14px auto 22px;color:var(--muted);max-width:48ch}\n.footcols{display:grid;gap:26px 20px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}\n.footcols h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;\n             color:var(--faint);margin:0 0 11px;font-weight:600}\n.footcols ul{list-style:none;margin:0;padding:0}\n.footcols li{margin:7px 0;font-size:13px;line-height:1.5}\n.footcols a{color:var(--muted)}\n.footcols a:hover{color:var(--foreground);text-decoration:underline}\n\n\n</style>\n</head>\n<body>\n<a class=\"skip\" href=\"#main\">Skip to content</a>\n\n<nav class=\"nav\" aria-label=\"Primary\">\n  <div class=\"wrap\">\n    <div class=\"brand\">Prompt Library</div>\n    <div class=\"navlinks\">\n      <a href=\"#tasks\">Tasks</a><a href=\"#models\">Models</a>\n      <a href=\"#styles\">Styles</a><a href=\"#creators\">Creators</a>\n    </div>\n  </div>\n</nav>\n\n<main id=\"main\">\n\n<section class=\"hero\" id=\"m1\">\n  <div class=\"wrap\">\n    <h1>AI prompts, word for word</h1>\n    <p class=\"dek\">982 prompts from X creators, stored exactly as published and credited to whoever wrote them.</p>\n\n    <form class=\"searchrow\" role=\"search\" onsubmit=\"return false\">\n      <label for=\"q\" class=\"hide\">Search prompts</label>\n      <input id=\"q\" type=\"search\" autocomplete=\"off\" placeholder=\"Search prompts, models, styles, camera moves, creators…\">\n      <button class=\"btn pri\" id=\"go\">Search</button>\n      <button class=\"btn\" id=\"reset\" type=\"button\">Reset</button>\n    </form>\n\n    <div class=\"facets\" aria-label=\"Filters\">\n      <div class=\"frow\"><b>Model</b><div class=\"chips\" data-axis=\"models\"></div></div>\n      <div class=\"frow\"><b>Task</b><div class=\"chips\" data-axis=\"use_cases\"></div></div>\n      <div class=\"frow\"><b>Technique</b><div class=\"chips\" data-axis=\"techniques\"></div></di all arrangement is revealed as an enormous handcrafted paper city stretching across a large table.\nRoads connect different districts.\nBridges cross miniature rivers.\nPaper trees move gently from an unseen breeze.\n00:17–00:23 — MORNING\nTransition into a slow overhead crane shot.\nWarm sunlight gradually spreads across the paper city.\nShadows from the buildings become longer and more defined.\nTiny paper windows begin reflecting the sunlight.\nThe camera continues rising, revealing the geometric relationship between the streets and buildings.\n00:23–00:27 — THE DETAIL\nCut to an 85mm close-up.\nFocus on a tiny paper clock mounted on one building.\nThe clock moves forward by one minute.\nRack focus from the clock to the miniature skyline behind it.\n00:27–00:30 — FINAL IMAGE\nReturn to an extreme wide shot.\nThe entire paper city sits beneath a large studio window.\nThe morning light completely fills the miniature world.\nCamera slowly pulls backward until the city becomes a small object within the larger room.\nFade to black.\nCINEMATOGRAPHY\nLarge-format feature-film aesthetic.\n100mm macro for texture.\n85mm for detail.\n50mm for natural perspective.\n35mm for environmental shots.\nControlled dolly and crane movements.\nRealistic depth of field.\nNatural focus transitions.\nSoft motion blur.\nSubtle lens imperfections.\nNo artificial camera shake.\nMATERIAL DIRECTION\nEvery surface must visibly behave like physical paper.\nVisible paper fibers.\nNatural folds.\nTiny imperfections.\nSoft cardboard edges.\nRealistic contact shadows.\nBelievable paper thickness.\nNatural material deformation.\nLIGHTING\nSoft morning daylight.\nLarge window as the primary source.\nNatural bounce light.\nGentle shadows.\nSubtle warm highlights.\nNo artificial neon effects.\nNo excessive visual effects.\nCONTINUITY\nThe same paper city throughout the entire sequence.\nBuildings maintain identical shapes and positions.\nRoads remain connected.\nPaper materials remain consistent.\nNo tle reflections, and authentic hand interaction. She says:\n“And the earbuds are the perfect everyday companion—small, sleek, and ridiculously easy to carry.”\n\n24–30 seconds:\nShe places the sunglasses and earbuds together beside their orange packaging and carrying cases. She then picks both products up, holds them naturally toward the camera, and gives a confident warm smile. She says:\n“If you love accessories that actually look as good as they perform, these are definitely worth checking out.”\n\nEnding shot:\nEnd with a slow, smooth cinematic push-in toward the sunglasses, earbuds, orange packaging, and carrying cases arranged beautifully on the softly textured bed. Keep the woman subtly visible in the background with natural depth-of-field separation. Allow the golden-hour light to create premium highlights across the products.\n\nVisual direction: Ultra-realistic UGC, authentic influencer energy, natural facial expressions, perfect lip synchronization, realistic hand anatomy and movements, physically accurate product interaction, premium fashion/lifestyle aesthetic, detailed macro product shots, accurate lens reflections, realistic materials and textures, warm golden-hour lighting, handheld smartphone cinematography, subtle focus breathing, natural exposure changes, 4K HDR, cinematic depth of field.</pre>\n  <div class=\"cardmeta\">\n    <span><a href=\"https://x.com/AIwithSynthia\" rel=\"noopener nofollow\">@AIwithSynthia</a></span>\n    <span class=\"wf-data\">124 likes</span><span class=\"wf-data\">60 saves</span>\n  </div>\n  <div class=\"cardact\"><button class=\"copy\" data-copy=\"2089932434351734933\" type=\"button\">Copy prompt</button><a class=\"src wf-data\" href=\"https://x.com/AIwithSynthia/status/2089932434351734933\" rel=\"noopener nofollow\">View on X ↗</a><span class=\"fb\" data-fb=\"2089932434351734933\" role=\"status\"></span></div>\n</article>\n</template>\n\n<script>\n(function(){\n\"use strict\";\nvar CUT={\"7\":\"2026-08-13\",\"30\":\"2 l) ? '' : (shown + ' of ' + total);\n}\nvar qq = document.getElementById('q');\nif (qq) qq.addEventListener('input', applyFilters);\n<\/script>\n\n<script>\n(function(){\n  var PAGE='l2';\n  var MODELS=['Nano Banana Pro','Nano Banana 2','Nano Banana','GPT Image 2','GPT Image',\n              'Higgsfield Soul','Seedance','Kling','Veo','Sora','Wan'];\n  function go(r){ parent.postMessage({wfnav:r},'*'); }\n  function routeFor(a){\n    var href=a.getAttribute('href')||'';\n    var text=(a.textContent||'').replace(/\\s+/g,' ').trim();\n    if(/^https?:/.test(href)){ a.target='_blank'; a.rel='noopener'; return null; }\n    if(href.indexOf('/prompts')===0){\n      if(href==='/prompts'||href==='/prompts/') return 'l1';\n      if(href.indexOf('/prompts/models')===0) return 'l3';\n      if(/^\\/prompts\\/video\\/?$/.test(href)) return 'l2v';\n      if(/^\\/prompts\\/(image|use-cases|styles|creators)\\/?$/.test(href)) return 'l2';\n      return 'l4';\n    }\n    if(href.length>1&&href.charAt(0)==='#') return null;\n    var f=a.closest('.feature');\n    if(f) return f.getAttribute('data-axis')==='models'?'l3':'l2';\n    if(text.indexOf('\\u8be6\\u60c5')>-1) return 'l4';                    /* detail */\n    if(text==='\\u9996\\u9875'||text==='\\u63d0\\u793a\\u8bcd\\u5e93'||text==='Prompt Library') return 'l1';\n    for(var i=0;i<MODELS.length;i++) if(text.indexOf(MODELS[i])>-1) return 'l3';\n    if(text==='\\u6a21\\u578b') return 'l3';                              /* model */\n    if(/\\u4efb\\u52a1|\\u7528\\u4f8b|\\u98ce\\u683c|\\u56fe\\u7247|\\u89c6\\u9891|\\u521b\\u4f5c\\u8005|\\u5408\\u96c6|\\u63d0\\u793a\\u8bcd/.test(text)) return 'l2';\n    return null;\n  }\n  document.addEventListener('click',function(e){\n    var a=e.target.closest('a'); if(!a) return;\n    var r=routeFor(a);\n    if(r){ e.preventDefault(); go(r); }\n  },true);\n  var cta=document.getElementById('cta');\n  if(cta) cta.addEventListener('click',function(){ go('l2'); });\n  window.addEventListener('messag e story. 3–5s, high-res.&quot; polish pass: &quot;bake in film grain, particles, vignette, glass cards, color tints, scroll pacing. no config.&quot; QA: &quot;check load speed, mobile breakpoints, and whether the scroll actually lands. rewrite whatever doesn&#x27;t.&quot; WHAT THIS REPLACES: → web studio build: $6,000-$35,000+ → motion artist: $800-2,000/project → front-end dev: $2,000-10,000/project → weeks of handoffs: gone Fable 5 + Higgsfield: a subscription + a few dollars of credits. one session. SETUP IN 10 MINUTES: - install Claude Code - add the Higgsfield MCP + authenticate - drop your brief + references - let it scaffold, generate, and animate in one pass - preview, send fixes in plain English, ship the pipeline was the moat. it just became a prompt. Follow me, comment &quot;WEB&quot; and I&#x27;ll send you the full step-by-step Playbook. full breakdown in the article 👇</pre>\n  <div class=\"tags\"><span class=\"tag wf-data\">Cinematic</span></div>\n  <div class=\"meta\">\n    <span>@zeuuss_01</span><span class=\"wf-data\"><b>2,512</b> likes</span>\n    <span class=\"wf-data\"><b>6,127</b> saves</span><span class=\"hv wf-data\">Popular</span>\n    <a class=\"wf-data\" href=\"https://x.com/zeuuss_01/status/2073529429838696592\" rel=\"nofollow noopener\" target=\"_blank\">View on X ↗</a>\n  </div>\n  <div class=\"acts\"><button class=\"btn primary sm\" data-copy=\"v1\" type=\"button\">Copy prompt</button><a class=\"btn ghost sm wf-data\" href=\"/prompts/concept-scroll-read-this-brief-script-the-sc-2073529429838696592\">Full prompt →</a></div>\n</article><article class=\"card\" data-tags=\"|model:Seedance|use_case:Food &amp; beverage|style:Cinematic|style:Photorealistic|technique:Camera movement / shot language|technique:Transition / morph / match cut|\">\n  <div class=\"media has\"><img src=\"https://pbs.twimg.com/amplify_video_thumb/2071173989758828544/img/XrApo3brHZspKnV-.jpg?name=small\" alt=\"video frame from the source post\" loading=\"lazy\" referrerpolicy=\"no-referrer\"><span class=\"mb\">VIDEO · 15s</span></div>\n  <h3><a href=\"/prompts/scene-a-seamless-ultra-cinematic-one-take-sh-2071174186978951379\">One take from deep space to a cafe table</a></h3>\n  <pre class=\"prompt\" id=\"v2\">Scene: A seamless ultra-cinematic one-take shot starting from deep space and ending in an intimate café moment. The sequence emphasizes speed, scale, and immersive transition from cosmic to human scale. Subject / Character: Final subject is @img1 — a young woman sitting in an open-air café named “LUMOS”, wearing denim shorts and a white shirt, casually eating a hamburger with a drink beside her. Action Timeline (TOTAL: 15s): 0–4s (Space → Earth Approach): Wide cinematic shot of Earth in deep space. Camera accelerates forward smoothly. Earth rapidly grows in frame. Subtle light streaks, atmospheric glow becomes visible. Motion builds gradually but feels grand. 4–8s (Atmospheric Entry → Fast Descent): Camera pierces atmosphere with intense glow and motion blur. Clouds rush past. Continents and terrain sweep underneath at high speed. Strong sense of acceleration. 8–11s (City Dive → Street Flow): Camera locks onto a city and dives sharply. Skyscrapers rise fast. Transition into street-level movement — fluid glide through streets, passing buildings, corners, and urban elements with dynamic motion. 11–12s (Café Target Lock): Camera spots outdoor café with large “LUMOS” sign. Rapid but smooth deceleration begins. Focus tightens. 12–15s (Final Scene – Character): Camera settles into a medium shot of @img1. She sits casually, eating a hamburger, drink on table. Natural motion (taking a bite, relaxed posture). Warm, calm contrast to previous high-speed sequence. Camera: One continuous shot, no cuts. Extreme speed ramping: slow → ultra-fast → controlled slowdown. Wide lens in space → natural cinematic lens at final shot. Smooth stabilization with slight handheld realism at the end. Audio: Cinematic rise from deep space ambience → intense whooshing during descent → city ambience → soft café sounds (light chatter, ambient noise). Style: Cinematic color grading: cool tones in space/descent → gradually warmer tones at street/café. High contrast, subtle film grain, volumetric lighting, atmospheric particles, ultra-detailed, 8K, photorealistic.</pre>\n  <div class=\"tags\"><span class=\"tag\">Seedance</span><span class=\"tag wf-data\">Cinematic</span></div>\n  <div class=\"meta\">\n    <span>@Naiknelofar788</span><span class=\"wf-data\"><b>1,024</b> likes</span>\n    <span class=\"wf-data\"><b>1,263</b> saves</span><span class=\"hv wf-data\">Popular</span>\n    <a class=\"wf-data\" href=\"https://x.com/Naiknelofar788/status/2071174186978951379\" rel=\"nofollow noopener\" target=\"_blank\">View on X ↗</a>\n  </div>\n  <div class=\"acts\"><button class=\"btn primary sm\" data-copy=\"v2\" type=\"button\">Copy prompt</button><a class=\"btn ghost sm wf-data\" href=\"/prompts/scene-a-seamless-ultra-cinematic-one-take-sh-2071174186978951379\">Full prompt →</a></div>\n</article><article class=\"card\" data-tags=\"|model:Seedance|use_case:Fashion|style:Cinematic|technique:Camera movement / shot language|technique:Lip sync / dialogue|\">\n  <div class=\"media has\"><img src=\"https://pbs.twimg.com/amplify_video_thumb/2078813993645273089/img/4nQRj3B5LpuYV0XW.jpg?name=small\" alt=\"video frame from the source post\" loading=\"lazy\" referrerpolicy=\"no-referrer\"><span class=\"mb\">VIDEO · 15s</span></div>\n  <h3><a href=\"/prompts/a-cinematic-15-second-music-video-shot-in-a--2078814921756754352\">Neon dance-studio music video, 15 seconds</a></h3>\n  <pre class=\"prompt\" id=\"v3\">A cinematic 15-second music video shot in a dark modern dance studio with smooth grey reflective floor, black walls and horizontal neon light tubes. Continuous dynamic camera movement, mostly medium shots and close-ups, never too wide. The woman is constantly moving, no freezes or static poses. Main subject: young woman with messy medium-length wavy brown hair with bangs partially covering her face, freckles on nose and cheeks, blue-grey eyes, full glossy lips. She wears a tight black fishnet bodysuit. She is singing the entire time with clear, precise lip-sync, mouth actively moving, intense emotional expression. Lyrics: &quot;Ye! Ye! You keep a box of names / In the drawer by your bed / Polaroids and ticket stubs / Stuffed under the red / You never take one thing / You take the whole last spark / Leave a little thumbprint / On every private heart&quot;. 0-2s: Tight medium close-up. She leans her upper body back, head tilting, singing passionately with strong lip-sync, hair falling over her face, body arching, one hand sliding across her chest. 2-4s: Camera slowly pushes in and circles. She comes out of the deep arch, torso still bent forward, hands on her thighs, lifting her head and looking straight into camera while singing with aggressive lip-sync. Three male dancers of different appearances (different ethnicities, hair styles and builds) wearing black tank tops and black wide pants are already close around her, moving with her in low tense postures. The other two men are visible at the edges of the frame, approaching. 4-7s: Medium close-up. She drops lower, body still in constant motion, hair swinging, singing intensely with clear mouth movements, sharp head turns, eyes locked on camera. Male dancers stay close, their hands lightly touching her as they move together. 8-12s: Medium shot with slow camera drift. Exactly five male dancers of completely different appearances, all wearing black tank tops and black wide pants, surround her tightly on the floor in a dense, intertwined formation. She is in the center, body still moving, upper body rising and shifting, singing with strong lip-sync. All five men move subtly with her, never static. The men never fully obscure her body. 13-15s: Dynamic medium shot. The five diverse male dancers lift her into the air in a powerful deep backbend. Her body is fully extended and arched, head thrown back, still singing with clear lip-sync. While holding her they gently rock her up and down in time with the beat. The camera starts from a clear side view of her arched body and smoothly transitions to a frontal view of her face. At the end they lower her smoothly onto her feet; she lands and immediately continues singing as the five men stay low on the floor around her. The men never fully obscure her. High fashion dance energy, sweaty skin, sharp timing, continuous fluid motion of the woman, priority on accurate lip-sync in every frame. Rules: no hand morphing, no body distortions, clean stable anatomy, fingers and hands remain consistent and natural throughout the entire video. #AIvideo #AIMusicVideo #AIFilmmaking</pre>\n  <div class=\"tags\"><span class=\"tag\">Seedance</span><span class=\"tag wf-data\">Cinematic</span></div>\n  <div class=\"meta\">\n    <span>@Kiber_Alla</span><span class=\"wf-data\"><b>562</b> likes</span>\n    <span class=\"wf-data\"><b>671</b> saves</span><span class=\"hv wf-data\">Popular</span>\n    <a class=\"wf-data\" href=\"https://x.com/Kiber_Alla/status/2078814921756754352\" rel=\"nofollow noopener\" target=\"_blank\">View on X ↗</a>\n  </div>\n  <div class=\"acts\"><button class=\"btn primary sm\" data-copy=\"v3\" type=\"button\">Copy prompt</button><a class=\"btn ghost sm wf-data\" href=\"/prompts/a-cinematic-15-second-music-video-shot-in-a--2078814921756754352\">Full prompt →</a></div>\n</article><article class=\"card\" data-tags=\"|model:Higgsfield Soul|model:Seedance|use_case:Food &amp; beverage|style:Photorealistic|technique:Camera movement / shot language|technique:Lip sync / dialogue|technique:Multi-shot / storyboard|\">\n  <div class=\"media has\"><img src=\"https://pbs.twimg.com/amplify_video_thumb/2083165874983424000/img/L7v_JTJr0f72f2Z_.jpg?name=small\" alt=\"video frame from the source post\" loading=\"lazy\" referrerpolicy=\"no-referrer\"><span class=\"mb\">VIDEO · 29s</span></div position, autofocus hunting, rushed reframing, uneven zooms, exposure breathing, brief accidental face cropping, and imperfect framing throughout. The camera itself is never visible. LOOK: Warm analog tape texture with gentle film grain, softened sharpness, subtle halation where sunlight cuts between buildings, faint salt-air haze, realistic skin tones, low contrast, tiny exposure shifts, natural motion blur. Authentic everyday footage, not a polished commercial. STYLE: A quiet Mediterranean morning coffee-run vlog. Unhurried, warm, spontaneous. She talks to the camera in short sentences with comfortable pauses, reacts to the street around her, laughs easily. CHARACTER: ELENA — a Mediterranean woman in her mid-20s. Dark wavy hair in a loose bun, olive skin, minimal makeup, small gold hoops, oversized white linen shirt, denim shorts, leather sandals, canvas tote on one shoulder. SETTING: A sun-washed coastal old town just after sunrise. Narrow limestone alleys, pastel shutters, bougainvillea spilling over walls, glimpses of the sea between buildings, distant church bells and scooters, almost no people. A sleepy stray cat on a warm step. SCENES: The vlog opens in selfie mode as Elena steps out of the doorway into the bright alley, squinting. &quot;Morning.&quot; She walks, sunlight strobing between buildings across her face. &quot;Okay it&#x27;s already hot. Of course it is.&quot; She reaches a tiny corner kiosk and orders an iced coffee, camera still handheld, framing half-wrong. She sets the camera on the counter ledge for a wide shot while she waits, drumming her fingers. A stray cat appears at her feet and stares up. She crouches down to it. &quot;Hi. You again.&quot; The cat rubs against her leg. She laughs. &quot;I have a bodyguard now.&quot; She picks the camera back up, coffee in the other hand, and walks toward the water, the cat trotting behind for a few steps. She sits on the low seawall, sea behind her, and takes the first sip. &quot;Worth it. Every time.&quot; She looks off at the water for a moment, hair moving in the breeze, then back to the lens. &quot;Okay. Work now.&quot; A small wave. &quot;See you later.&quot;</pre>\n  <div class=\"tags\"><span class=\"tag\">Seedance</span><span class=\"tag wf-data\">Photorealistic</span></div>\n  <div class=\"meta\">\n    <span>@PhedEU</span><span class=\"wf-data\"><b>133</b> likes</span>\n    <span class=\"wf-data\"><b>160</b> saves</span>\n    <a class=\"wf-data\" href=\"https://x.com/PhedEU/status/2087155737784918460\" rel=\"nofollow noopener\" target=\"_blank\">View on X ↗</a>\n  </div>\n  <div class=\"acts\"><button class=\"btn primary sm\" data-copy=\"v10\" type=\"button\">Copy prompt</button><a class=\"btn ghost sm wf-data\" href=\"/prompts/camera-handheld-dv-16mm-daily-vlog-footage-2087155737784918460\">Full prompt →</a></div>\n</article><article class=\"card\" data-tags=\"|model:Seedance|use_case:Advertising|use_case:Beauty|use_case:Fashion|use_case:UGC|style:Cinematic|style:Luxury|style:Photorealistic|technique:Camera movement / shot language|technique:Transition / morph / match cut|\">\n  <div class=\"media has\"><img src=\"https://pbs.twimg.com/amplify_video_thumb/2089932382531133440/img/k05-QTjlyxToORTd.jpg?name=small\" alt=\"video frame from the source post\" loading=\"lazy\" referrerpolicy=\"no-referrer\"><span class=\"mb\">VIDEO · 30s</span></div>\n  <h3><a href=\"/prompts/use-the-uploaded-reference-image-as-the-exac-2089932434351734933\">Locked product and identity, outfit swapped</a></h3>\n  <pre class=\"prompt\" id=\"v11\">Use the uploaded reference image as the exact character and product reference. Preserve the woman’s facial identity, hairstyle, eye color, makeup, skin tone, body proportions, jewelry, and overall appearance consistently throughout the entire video. Change her outfit to a fitted sleeveless PINK top with clean WHITE shorts and keep the outfit identical in every shot. Use the uploaded sunglasses, earbuds, orange retail packaging, and carrying cases as LOCKED product references. Preserve their exact shapes, colors, materials, proportions, buttons, lenses, hinges, charging case, textures, and every visible product detail. Do not redesign, replace, or invent any product elements. Create an ultra-realistic UGC luxury lifestyle review filmed inside a modern luxury bedroom during warm golden hour. The woman is the clear visual focus, with authentic creator energy and natural expressions. Use warm sunlight coming through the bedroom windows, soft realistic shadows, natural skin texture, shallow depth of field, subtle handheld smartphone movement, realistic autofocus behavior, natural motion blur, and premium commercial-quality cinematography. Include a realistic cat naturally interacting with her only where specified, without distracting from the products. 0–5 seconds: The woman sits comfortably on the edge of the bed with the cat resting naturally in her lap. The orange product packaging is clearly visible beside her. She looks directly into the camera, smiles warmly, and says: “Okay, these two have seriously upgraded my everyday routine.” 5–11 seconds: She gently moves the cat beside her, picks up the sunglasses, opens the orange packaging, and slowly reveals the sunglasses. She brings them closer to the camera and rotates them naturally so the frame, lenses, hinges, and finish are clearly visible. She says: “The sunglasses immediately caught my attention—the finish, the shape, everything feels so premium.” 11–18 seconds: She puts on the sunglasses naturally, adjusts them lightly at the temple, and looks toward the bright bedroom window. Capture a flattering side-profile moment with realistic reflections in the lenses. She then turns back toward the camera and says: “They’re lightweight, comfortable, and honestly look even better in natural light.” 18–24 seconds: She picks up the earbuds and opens their black charging case. Transition into a detailed macro close-up of the case opening and the earbuds inside. Show the actual product design with accurate proportions, realistic materials, subtle reflections, and authentic hand interaction. She says: “And the earbuds are the perfect everyday companion—small, sleek, and ridiculously easy to carry.” 24–30 seconds: She places the sunglasses and earbuds together beside their orange packaging and carrying cases. She then picks both products up, holds them naturally toward the camera, and gives a confident warm smile. She says: “If you love accessories that actually look as good as they perform, these are definitely worth checking out.” Ending shot: End with a slow, smooth cinematic push-in toward the sunglasses, earbuds, orange packaging, and carrying cases arranged beautifully on the softly textured bed. Keep the woman subtly visible in the background with natural depth-of-field separation. Allow the golden-hour light to create premium highlights across the products. Visual direction: Ultra-realistic UGC, authentic influencer energy, natural facial expressions, perfect lip synchronization, realistic hand anatomy and movements, physically accurate product interaction, premium fashion/lifestyle aesthetic, detailed macro product shots, accurate lens reflections, realistic materials and textures, warm golden-hour lighting, handheld smartphone cinematography, subtle focus breathing, natural exposure changes, 4K HDR, cinematic depth of field.</pre>\n  <div class=\"tags\"><span class=\"tag\">Seedance</span><span class=\"tag wf-data\">Cinematic</span></div>\n  <div class=\"meta\">\n    <span>@AIwithSynthia</span><span class=\"wf-data\"><b>124</b> likes</span>\n    <span class=\"wf-data\"><b>60</b> saves</span>\n    <a class=\"wf-data\" href=\"https://x.com/AIwithSynthia/status/2089932434351734933\" rel=\"nofollow noopener\" target=\"_blank\">View on X ↗</a>\n  </div>\n  <div class=\"acts\"><button class=\"btn primary sm\" data-copy=\"v11\" type=\"button\">Copy prompt</button><a class=\"btn ghost sm wf-data\" href=\"/prompts/use-the-uploaded-reference-image-as-the-exac-2089932434351734933\">Full prompt →</a></div>\n</article></div>\n  </section>\n\n  <section class=\"sec seam\">\n    <div class=\"sec-head\"><h2>Lip sync / dialogue</h2>\n      <span class=\"pill\">4</span></div>\n    <div class=\"rail\"><article class=\"card wf-data\" data-tags=\"|model:Seedance|use_case:Fashion|style:Cinematic|technique:Camera movement / shot language|technique:Lip sync / dialogue|\">\n  <div class=\"media has\"><img src=\"https://pbs.twimg.com/amplify_video_thumb/2078813993645273089/img/4nQRj3B5LpuYV0XW.jpg?name=small\" alt=\"video frame from the source post\" loading=\"lazy\" referrerpolicy=\"no-referrer\"><span class=\"mb\">VIDEO · 15s</span></div>\n  <h3><a href=\"/prompts/a-cinematic-15-second-music-video-shot-in-a--2078814921756754352\">Neon dance-studio music video, 15 seconds</a></h3>\n  <pre class=\"prompt\" id=\"v100\">A cinematic 15-second music video shot in a dark modern dance studio with smooth grey reflective floor, black walls and horizontal neon light tubes. Continuous dynamic camera movement, mostly medium shots and close-ups, never too wide. The woman is constantly moving, no freezes or static poses. Main subject: young woman with messy medium-length wavy brown hair with bangs partially covering her face, freckles on nose and cheeks, blue-grey eyes, full glossy lips. She wears a tight black fishnet bodysuit. She is singing the entire time with clear, precise lip-sync, mouth actively moving, intense emotional expression. Lyrics: &quot;Ye! Ye! You keep a box of names / In the drawer by your bed / Polaroids and ticket stubs / Stuffed under the red / You never take one thing / You take the whole last spark / Leave a little thumbprint / On every private heart&quot;. 0-2s: Tight medium close-up. She leans her upper body back, head tilting, singing passionately with strong lip-sync, hair falling over her face, body arching, one hand sliding across her chest. 2-4s: Camera slowly pushes in and circles. She comes out of the deep arch, torso still bent forward, hands on her thighs, lifting her head and looking straight into camera while singing with aggressive lip-sync. Three male dancers of different appearances (different ethnicities, hair styles and builds) wearing black tank tops and black wide pants are already close around her, moving with her in low tense postures. The other two men are visible at the edges of the frame, approaching. 4-7s: Medium close-up. She drops lower, body still in constant motion, hair swinging, singing intensely with clear mouth movements, sharp head turns, eyes locked on camera. Male dancers stay close, their hands lightly touching her as they move together. 8-12s: Medium shot with slow camera drift. Exactly five male dancers of completely different appearances, all wearing black tank tops and black wide pants, surround her tightly on the floor in a dense, intertwined formation. She is in the center, body still moving, upper body rising and shifting, singing with strong lip-sync. All five men move subtly with her, never static. The men never fully obscure her body. 13-15s: Dynamic medium shot. The five diverse male dancers lift her into the air in a powerful deep backbend. Her body is fully extended and arched, head thrown back, still singing with clear lip-sync. While holding her they gently rock her up and down in time with the beat. The camera starts from a clear side view of her arched body and smoothly transitions to a frontal view of her face. At the end they lower her smoothly onto her feet; she lands and immediately continues singing as the five men stay low on the floor around her. The men never fully obscure her. High fashion dance energy, sweaty skin, sharp timing, continuous fluid motion of the woman, priority on accurate lip-sync in every frame. Rules: no hand morphing, no body distortions, clean stable anatomy, fingers and hands remain consistent and natural throughout the entire video. #AIvideo #AIMusicVideo #AIFilmmaking</pre>\n  <div class=\"tags\"><span class=\"tag\">Seedance</span><span class=\"tag wf-data\">Cinematic</span></div>\n  <div class=\"meta\">\n    <span>@Kiber_Alla</span><span class=\"wf-data\"><b>562</b> likes</span>\n    <span class=\"wf-data\"><b>671</b> saves</span><span class=\"hv wf-data\">Popular</span>\n    <a class=\"wf-data\" href=\"https://x.com/Kiber_Alla/status/2078814921756754352\" rel=\"nofollow noopener\" target=\"_blank\">View on X ↗</a>\n  </div>\n  <div class=\"acts\"><button class=\"btn primary sm\" data-copy=\"v100\" type=\"button\">Copy prompt</button><a class=\"btn ghost sm wf-data\" href=\"/prompts/a-cinematic-15-second-music-video-shot-in-a--2078814921756754352\">Full prompt →</a></div>\n</article><article class=\"card wf-data\" data-tags=\"|model:Higgsfield Soul|model:Seedance|use_case:Food &amp; beverage|style:Photorealistic|technique:Camera movement / shot language|technique:Lip sync / dialogue|technique:Multi-shot / storyboard|\">\n  <div class=\"media has\"><img src=\"https://pbs.twimg.com/amplify_video_thumb/2083165874983424000/img/L7v_JTJr0f72f2Z_.jpg?name=small\" alt=\"video frame from the source post\" loading=\"lazy\" referrerpolicy=\"no-referrer\"><span class=\"mb\">VIDEO · 29s</span></div>\n  <h3><a href=\"/prompts/scene-a-day-in-new-york-shot-entirely-by-the-2083168602363150527\">A day in New York, filmed by the subject</a></h3>\n  <pre class=\"prompt\" id=\"v101\">SCENE A day in New York shot entirely by the subject herself: waking in her hotel suite, coffee, getting ready, out into the city, back to the room at night. ACTIVE REFERENCES @ image1 — the hotel suite. Curved cove ceiling with warm LED coving, deep red carpet, cream walls, two black organic sculptures above a light wood headboard, white bedding with red pillows, twin bedside lamps, pale sofa, oval coffee table, sheer curtains, dark door. @ image2 — the subject. Young woman, shoulder-length wavy blonde hair with curtain bangs and highlights, light freckles, thin gold necklace, silver ring, dark brown off-the-shoulder knit with white diamond-stripe pattern. 100% matches the reference. CAMERA OWNERSHIP LOCK Only two positions exist. HELD: arm extended, camera 0.4-0.7m from her face, visible arm tension, tilt and step-bounce. PROPPED: camera on a surface she placed it on, crooked and fixed, with her moving in and out of frame. No operator shots, no tracking, nothing she could not have filmed alone. FORMAT Eight shots, 30s, seven HARD CUTS, no fades. Real-time. 0-4s SHOT 1 — PROPPED, morning room. 84° diagonal field of view, camera on the sideboard 3m from the bed at 1.1m, static and tilted. The suite matches @ image1: cove light on, curtains half open, cool daylight across the red carpet. @ image2 visible at 0.0s, sitting up on the bed edge x66 y58. No empty frame. She rubs her face and croaks at the running camera: &quot;It&#x27;s seven. In New York. Why am I awake.&quot; Stands, walks out screen-right. HARD CUT. 4-7s SHOT 2 — HELD, window light. 84°, arm&#x27;s length 0.5m, above eye line. She is x50 y42 at the sheer curtain screen-left, cool daylight on the near side of her face, cove warmth behind. She pulls the curtain, squints at the street below, then into the lens: &quot;Okay. It&#x27;s actually happening.&quot; Arm wobble throughout. HARD CUT. 7-11s SHOT 3 — PROPPED, coffee. 47°, camera on the oval coffee table 0.8m away, low, looking up past a cup. She sits into frame at x55 y45, pours, tastes, pulls a face at the running camera: &quot;Hotel coffee. We&#x27;ll fix that outside.&quot; Steam bends in the light. HARD CUT. 11-15s SHOT 4 — HELD, mirror. 47°, camera at chest height reflected in the suite mirror. She is x45 y50 in the reflection, camera visible in her hand, working through her hair with the other. Bed and sculptures behind. At 13s: &quot;This is as good as it gets. Let&#x27;s go.&quot; HARD CUT. 15-18s SHOT 5 — HELD, leaving. 107° wide rectilinear, camera held low at waist height, turned forward. She crosses the red carpet to the door at x55, lens swinging with her stride. She opens it and corridor light floods the frame. Off-frame, breathy: &quot;Downtown first.&quot; HARD CUT. 18-22s SHOT 6 — PROPPED, street. 47°, camera on a stoop rail 3m away, static, crooked. A New York block behind her — brownstone steps, fire escapes, yellow cabs, steam from a vent. She walks in from screen-left at 18.5s, stands at x60 y50, spreads her arms: &quot;Look at this street.&quot; Then walks to the lens and takes it at 21.5s. Passers-by cross the foreground. HARD CUT. 22-26s SHOT 7 — PROPPED, diner. 84° wide, camera on the counter behind a plate, 0.7m from her, looking up. She is x55 y38, sits into frame, takes a bite, eyes widen, mouth full: &quot;Okay, that&#x27;s the one.&quot; Laughs, keeps eating. HARD CUT. 26-30s SHOT 8 — HELD, night, back in the room. 84°, arm&#x27;s length 0.5m, held above her. She lies back across the white bedding at x50 y55, hair spread, in the brown knit again. Bedside lamps and cove light are the only sources, windows black with city glow. Into the lens: &quot;Twenty thousand steps. Everything hurts.&quot; Softer: &quot;Same time tomorrow.&quot; Wave, the frame tilts as she lowers the camera. 30.0s black. SPEECH Only the quoted lines are spoken, at the timings given, all in her voice. Lips still at all other times. No voiceover, no second speaker, no offscreen voices. Delivery is casual, unrehearsed, mid-breath, sometimes trailing off. Volume rises over street noise in Shot 6, near-whisper in Shot 8. CONTINUITY The suite matches @ image1 in both interior sequences — same carpet, sculptures, headboard, sofa, lamps. Hair, necklace and ring identical throughout. PHYSICS Loose knit slides on the shoulder with every arm movement. Wavy hair lags a frame behind head turns. Bedding creases under her weight. Step energy visible in every HELD frame. LIGHTING Shots 1-4: cool daylight from the curtains screen-left as key, warm cove LED as fill, red carpet bouncing warmth into the shadows. Shot 5: corridor light through the doorway. Shots 6-7: hard street daylight, warm diner practicals. Shot 8: lamps and cove light only. AUDIO Diegetic only, from the same camera — room tone, footsteps, door, traffic, sirens, steam vents, diner clatter, wind. Ambience ducks under her lines. No music. LOCKS Photoreal live action, 4K detail, fine grain, warm consumer-camera colour, mild rolling shutter and auto-exposure hunting. She is the only person who speaks; background figures anonymous and unfocused. No subtitles.</pre>\n  <div class=\"tags\"><span class=\"tag\">Higgsfield Soul</span><span class=\"tag\">Seedance</span><span class=\"tag wf-data\">Photorealistic</span></div>\n  <div class=\"meta\">\n    <span>@higgsfield_ai</span><span class=\"wf-data\"><b>589</b> likes</span>\n    <span class=\"wf-data\"><b>457</b> saves</span><span class=\"hv wf-data\">Popular</span>\n    <a class=\"wf-data\" href=\"https://x.com/higgsfield_ai/status/2083168602363150527\" rel=\"nofollow noopener\" target=\"_blank\">View on X ↗</a>\n  </div>\n  <div class=\"acts\"><button class=\"btn primary sm\" data-copy=\"v101\" type=\"button\">Copy prompt</button><a class=\"btn ghost sm wf-data\" href=\"/prompts/scene-a-day-in-new-york-shot-entirely-by-the-2083168602363150527\">Full prompt →</a></div>\n</article><article class=\"card wf-data\" data-tags=\"|technique:Camera movement / shot language|technique:Lip sync / dialogue|\">\n  <div class=\"media has\"><img src=\"https://pbs.twimg.com/amplify_video_thumb/2084387230844346368/img/3q3PrcBYVZsGJ3lW.jpg?name=small\" alt=\"video frame from the source post\" loading=\"lazy\" referrerpolicy=\"no-referrer\"><span class=\"mb\">VIDEO · 15s</span></div>\n  <h3><a href=\"/prompts/the-office-us-mockumentary-style-2084387316286595436\">The Office mockumentary, conference room</a></h3>\n  <pre class=\"prompt\" id=\"v102\">The Office (US) mockumentary style. Dunder Mifflin conference room, mid-afternoon, harsh fluorescent lighting, cheap office chairs, whiteboard at the front. Handheld documentary camera, slightly unsteady, with sudden reframes and quick zooms toward whoever is reacting. Michael Scott stands at the whiteboard, overly excited, marker in hand, badly drawn diagram behind him. The staff sit around the table looking exhausted. Stanley Hudson sits at the far end, glasses on, head down over a folded crossword puzzle, completely disengaged. DIALOGUE: MICHAEL (loud, proud): &quot;Okay everybody, listen up. Large language models. L-L-Ms. This is the future of the paper industry.&quot; Beat. Nobody reacts. Camera pushes in slowly on Stanley — he does not look up, does not blink, keeps filling in his crossword. MICHAEL: &quot;Which is why corporate is giving a bonus to whoever—&quot; Instant snap zoom to Stanley. His head lifts. He takes off his glasses. Dead serious. STANLEY: &quot;I&#x27;m listening.&quot; MICHAEL (waving him off): &quot;—anyway. Moving on. Next topic. Prompt engineering.&quot; Snap zoom back to Stanley. He immediately puts his glasses back on, lowers his head, and returns to the crossword as if nothing happened. Cut to Jim, who slowly turns his head and looks directly into the camera lens with a flat, knowing expression. Hold for two seconds. STYLE: single-camera sitcom shot like a documentary crew is present, natural performances, no laugh track, muted office color palette, slightly soft consumer-camera look, characters occasionally glancing at the lens.</pre>\n  <div class=\"tags\"></div>\n  <div class=\"meta\">\n    <span>@Arminn_Ai</span><span class=\"wf-data\"><b>446</b> likes</span>\n    <span class=\"wf-data\"><b>383</b> saves</span><span class=\"hv wf-data\">Popular</span>\n    <a class=\"wf-data\" href=\"https://x.com/Arminn_Ai/status/2084387316286595436\" rel=\"nofollow noopener\" target=\"_blank\">View on X ↗</a>\n  </div>\n  <div class=\"acts\"><button class=\"btn primary sm\" data-copy=\"v102\" type=\"button\">Copy prompt</button><a class=\"btn ghost sm wf n: &quot;아, 뭐 살랬더라…&quot; (&quot;Ah... what was I going to buy again?&quot;). Lips synchronize naturally. Her bare feet gently sway behind her. A low handheld camera glides along the edge of the mattress, with soft bedding partially obscuring the foreground. Shot 2 (2–4s): The house cat jumps onto the bed, compressing the blanket as it walks toward her forearm and lets out a single meow. The camera gives a slight jolt from the impact, then quickly reframes from the phone to an over-the-shoulder view that includes her face, hands, phone, and cat. Shot 3 (4–6s): She turns warmly toward the cat, stroking it once from its forehead to its shoulders. In a gentle, affectionate tone she says: &quot;우리 애기 왔어?&quot; (&quot;Did my baby come?&quot;). Lip sync is clear and natural. The camera pushes in briefly through the cat&#x27;s softly blurred foreground toward her face and hand. Shot 4 (6–8s): A friend&#x27;s ringtone sounds. She glances down, confirms the caller, swipes to answer, and brings the phone to her ear. The camera moves in a loose semicircle from a slightly tilted overhead angle, capturing the entire answering motion. Shot 5 (8–11s): Her friend begins talking. She responds first with confusion, then disbelief: &quot;어, 왜? 진짜 거짓말.&quot; (&quot;Huh? Why? No way, you&#x27;re kidding.&quot;). Immediately afterward she naturally bursts into laughter. The cat kneads the blanket beside her. A close handheld side angle keeps both her phone and profile within the same focal plane. Shot 6 (11–13s): A clear doorbell interrupts the laughter. Both she and the cat turn toward the bedroom door. She braces one hand on the mattress to get up. The camera reacts a fraction too late, briefly turning toward the door before naturally correcting back to her rising movement. Shot 7 (13–15s): Still on the phone, she hurriedly says: &quot;어, 나 밥 왔다. 끊어.&quot; (&quot;My food&#x27;s here. I&#x27;ll hang up.&quot;). She ends the call with her thumb, gets off the bed, and walks toward the door while the cat follows across the blankets. The camera slides low beneath her elbow and tilts upward as she stands in one continuous motion. Sound: No music. Only raw production sound: bedding rustling, quiet breathing, finger taps on the phone, the soft impact of the cat jumping onto the bed, one natural meow, faint purring, a single short incoming ringtone, call connection tone, the friend&#x27;s voice through the phone, the woman&#x27;s four Korean lines with accurate lip sync, a genuine brief laugh, one clear doorbell, the tap ending the call, and soft cat footsteps. No subtitles, no on-screen text, no logo, no watermark. Never render a reference sheet or duplicate the subject.</pre>\n  <div class=\"tags\"><span class=\"tag\">Seedance</span><span class=\"tag wf-data\">Photorealistic</span></div>\n  <div class=\"meta\">\n    <span>@oggii_0</span><span class=\"wf-data\"><b>297</b> likes</span>\n    <span class=\"wf-data\"><b>232</b> saves</span><span class=\"hv wf-data\">Popular</span>\n    <a class=\"wf-data\" href=\"https://x.com/oggii_0/status/2085640281941307648\" rel=\"nofollow noopener\" target=\"_blank\">View on X ↗</a>\n  </div>\n  <div class=\"acts\"><button class=\"btn primary sm\" data-copy=\"v103\" type=\"button\">Copy prompt</button><a class=\"btn ghost sm wf-data\" href=\"/prompts/montage-multi-shot-candid-observational-foot-2085640281941307648\">Full prompt →</a></div>\n</article></div>\n  </section>\n\n</main>\n\n<section class=\"cta\">\n  <h2>Change one line, get a new shot</h2>\n  <p>Free to copy, every one credited to the person who wrote it.</p>\n  <button class=\"btn primary\" type=\"button\">Generate in bo</button>\n</section>\n<footer class=\"foot\">\n  <div class=\"footnav\"><div><h3>By model</h3><ul><li><a href=\"/prompts/models/nano-banana-pro\">Nano Banana Pro prompts</a></li><li><a href=\"/prompts/models/higgsfield-soul\">Higgsfield Soul prompts</a></li><li><a href=\"/prompts/models/gpt-image-2\">GPT Image 2 prompts</a></li><li><a href class=\"var\">[COUNTRY]</span> standing upright against a seamless, soft, color-coordinated pastel studio background. The stamp features an intricately detailed 3D diorama of the most iconic and recognizable landmark from <span class=\"var\">[COUNTRY]</span> that pops out and actively breaks the perforated borders, extending outward into the physical space. Lush flora and fauna native to <span class=\"var\">[COUNTRY]</span> grows and spills out from the bottom right corner of the stamp&#x27;s frame. A tiny, miniature figurine of a person wearing recognizable traditional cultural attire from <span class=\"var\">[COUNTRY]</span> stands on the ground at the bottom left, looking up in awe at the massive stamp, establishing a striking miniature world scale. The stamp&#x27;s design includes the word &quot;<span class=\"var\">[COUNTRY]</span>&quot; in classic serif typography, subtext in the local language, a realistic local currency denomination, and a stamped black ink cancellation postmark in the top right corner featuring the capital city of <span class=\"var\">[COUNTRY]</span> and a realistic date. Soft, diffused, magical studio lighting with a tilt-shift lens effect and shallow depth of field. Gently floating botanical elements native to <span class=\"var\">[COUNTRY]</span> drift through the air around the scene. 8k resolution, octane render, highly detailed miniature art.</div>\n  </div>\n  <p class=\"varnote\">\n      <code>[COUNTRY]</code> drives the landmark, the plants, the traditional dress, the type on the stamp, the currency and the postmark city at once — one word, a whole new scene that still agrees with itself.\n  </p>\n  <a class=\"go\" href=\"#\">Generate in bo →</a>\n</section></div>\n\n<div class=\"wrap\"><section class=\"sec\">\n  <h2>Source</h2>\n  <div class=\"panel\">\n    <div class=\"kv\"><span>Creator</span><b>@Naiknelofar788</b></div>\n    <div class=\"kv wf-data\"><span>Followers</span><b>34,683</b></div>\n    <div class=\"kv wf-data\"><span>P
