e-up reflection in the car's rearview mirror showing the man's eyes behind his sunglasses as he looks ahead with a calm expression.\n\nShot 3: A low-angle interior shot focusing on the driver's profile as he looks out the window, followed by a close-up of his hand shifting the wooden gear stick into drive.\n\nShot 4: A wide front-facing shot of the car pulling away from the curb. The camera zooms in smoothly on the front grille and then cuts to a close-up of the rear license plate which reads \"\"HIGGS\"\" on a weathered, yellowed plate.","media":"","mediaAlt":"","mediaBadge":"","author":"higgsfield_ai","date":"2026-02-04","likes":178,"bookmarks":42,"hot":false,"models":[],"useCases":["Automotive"],"techniques":["Camera movement","Multi-shot / storyboard"],"styles":["Retro / vintage"],"subjects":[],"srcUrl":"https://x.com/higgsfield_ai/status/2019109812341207229","mediaType":"none"},{"id":"2087155737784918460","slug":"2087155737784918460","title":"CAMERA: Handheld DV 16mm daily vlog footage","text":"CAMERA: Handheld DV 16mm daily vlog footage. The video MUST begin with her holding the camera at arm's length in selfie mode while stepping out of an old stone doorway into a narrow street. The first 20–30 seconds are entirely handheld. Later she occasionally sets the camera on a windowsill, café ledge, or low seawall for wider shots. Keep subtle handheld shake, drifting composition, autofocus hunting, rushed reframing, uneven zooms, exposure breathing, brief accidental face cropping, and imperfect framing throughout. The camera itself is never visible.\n\nLOOK: Warm analog tape texture with gentle film grain, softened sharpness, subtle halation where sunlight cuts between buildings, faint salt-air haze, realistic skin tones, low contrast, tiny exposure shifts, natural motion blur. Authentic everyday footage, not a polished commercial.\n\nSTYLE: A quiet Mediterranean morning coffee-run vlog. Unhurried, warm, spontaneous. She talks to the camera in short sentences with co   if (scope.kind === "model" && scope.model) pool = pool.filter(r => r.models.includes(scope.model));
  const facets = facetCounts(pool);
  let rows = pool.filter(r => {
    for (const a of AXES) {
      const want = p.getAll(a.key);
      if (want.length && !want.every(v => r[a.field].includes(v))) return false;
    }
    if (p.get("vars") === "1" && !r.vars.length) return false;
    if (q && !r._hay.includes(q)) return false;

  const page = Math.max(1, parseInt(p.get("page") || "1", 10) || 1);
  const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  return { pool, facets, rows, page: Math.min(page, pages), pages, total: rows.length,

/* Prompt text with variable slots marked up. Text itself is never altered. */
function promptHTML(r, fills) {
  const text = r.text || "";
  if (!r.vars.length) return esc(text);
  let out = "", last = 0;
  VAR_RE.lastIndex = 0;
  let m;
  while ((m = VAR_RE.exec(text))) {
    out += esc(text.slice(last, m.index));
    const filled = fills && fills[m[0]];
    out += `<span class="v" data-slot="${esc(m[0])}"${filled ? ' data-filled' : ""}>${esc(filled || m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}
function resolvedText(r, fills) {
  if (!r.vars.length || !fills) return r.text || "";
  return (r.text || "").replace(VAR_RE, t => fills[t] || t);
}
function copyBtn(id, label, cls) {
  return `<button class="btn ${cls || "btn--ghost"} btn--sm" type="button" data-copy="${esc(id)}">
    ${ICON.copy}<span>${esc(label || "复制")}</span></button>`;
}
function pagerHTML(res) {
  if (res.pages < 2) return "";
  /* not withParam(): that one strips `page` on purpose, for filter changes */
  const link = n => {
    const p = new URLSearchParams(S.params.toString());
    p.set("page", n);
    return href(S.path, p);
  };
  let out = `<nav class="pager" aria-label="分页">`;
  if (res.page > 1) out += `<a href="${link(res.page - 1)}" rel="prev">← 上一页</a>`;
  for (let i = 1; i <= res.pages; i++) {
    out += i === res.page ? `<span aria-current="page" class="num">${i}</span>`
                          : `<a href="${link(i)}" class="num">${i}</a>`;

  if (res.page < res.pages) out += `<a href="${link(res.page + 1)}" rel="next">下一页 →</a>`;
  return out + `</nav>`;
}

  if (r.kind === "text") {
    return `<article class="tile tile--text rise" ${delay}>
      <a class="t" href="${to}">${esc(r.title)}</a>
      <pre class="ptxt" lang="en" aria-hidden="true">${esc((r.text || "").slice(0, 420))}</pre>
      <div class="shade"><div class="m">${bits.map(esc).join(" · ")}</div></div>

/* =====================================================================
   SKIN C — EDITORIAL
   One column, real headings, real links, real prose. This is the shape
   Google actually ranks, and the shape that survives JS being off.
   ===================================================================== */
function edFacetLinks(res) {
  return AXES.map(a => {
    const items = res.facets[a.key].slice(0, 8);
    if (!items.length) return "";
    return `<div class="facetlinks">
      <span class="lbl">${esc(a.label)}</span>
      ${items.map(f => {
        const on = S.params.getAll(a.key).includes(f.value);
        return `<button class="chip" data-facet="${a.key}" data-value="${esc(f.value)}" aria-pressed="${on}">${esc(f.value)}<span class="n">${f.count}</span></button>`;
      }).join("")}
    </div>`;
  }).join("");
}
function edEntry(r, i, offset) {
  const n = String(offset + i + 1).padStart(2, "0");
  return `<article class="entry rise" id="p-${esc(r.id)}" style="animation-delay:${Math.min(i, 8) * 30}ms">
    <div class="no">${n}</div>
    <h3><a href="${href("/p/" + r.slug)}">${esc(r.title)}</a></h3>
    <div class="byline">
      ${r.author ? `<span>由 <a href="https://x.com/${esc(r.author)}" rel="noopener nofollow" target="_blank">@${esc(r.author)}</a> 分享</span>` : ""}
      ${r.date ? `<span>${esc(r.date)}</span>` : ""}
      ${r.likes != null ? `<span class="num">${nf(r.likes)} 赞</span>` : ""}
      ${r.models.length ? `<span>${r.models.map(m => `<a href="${href("/models/" + MODEL_SLUG(m))}">${esc(m)}</a>`).join("、")}</span>` : ""}
    </div>
    ${r.media ? `<figure>${mediaHTML(r, { ratio: "16/9" })}
      <figcaption>${esc(r.mediaAlt || "原帖配图")}${r.mediaBadge ? " · " + esc(r.mediaBadge) : ""}</figcaption></figure>` : ""}
    <div class="block" data-block>
      <div class="block-bar">
        <span>提示词原文 · ${nf(r.chars)} 字符${r.isJson ? " · JSON" : ""}${r.vars.length ? " · " + r.vars.length + " 个变量" : ""}</span>
        <span class="sp"></span>
        ${r.chars > 700 ? `<button class="btn btn--ghost btn--sm" type="button" data-expand>展开全文</button>` : ""}
        ${copyBtn(r.id, "复制")}
      </div>
      <pre class="ptxt" lang="en" tabindex="0">${promptHTML(r)}</pre>
      ${r.chars > 700 ? `<div class="fade" aria-hidden="true"></div>` : ""}
    </div>
    <div class="tags">${tagsHTML(r, 8)}</div>
  </article>`;
}

/* =====================================================================
   SKIN D — WORKBENCH
   A prompt is a template with slots. Browsing means picking a template;
   using one means filling it in and copying the assembled result.
   ===================================================================== */
function fillsOf(r) { return S.fills[r.id] || (S.fills[r.id] = {}); }
function filledCount(r) { const f = S.fills[r.id]; return f ? Object.values(f).filter(Boolean).length : 0; }

function wbCard(r, i) {
  const f = fillsOf(r);
  const bits = [];
  if (r.models.length) bits.push(r.models[0]);
  if (r.author) bits.push("@" + r.author);
  bits.push(nf(r.chars) + " 字符");
  const slots = r.vars.length
    ? `<div class="cap">${r.vars.length} 个可替换变量${r.vars.some(v => PRESETS[v]) ? " · 点一下换值" : " · 打开详情填写"}</div>` +
      r.vars.map(v => {
        const has = PRESETS[v];
        return `<button class="slot" type="button" ${has ? `data-cycle="${esc(r.id)}" data-slot="${esc(v)}"` : `data-open="${esc(r.slug)}"`}
          ${f[v] ? "data-filled" : ""} aria-label="${esc(has ? "换一个 " + v + " 的值" : "打开详情填写 " + v)}">
          ${esc(f[v] || v)}${has ? '<span class="cyc" aria-hidden="true">⇄</span>' : ""}</button>`;
      }).join("")
    : `<div class="cap">没有占位变量 · 整段直接可用</div>`;
  return `<article class="tcard rise${r.vars.length ? "" : " tcard--plain"}" style="animation-delay:${Math.min(i, 10) * 35}ms">
    <div class="top">
      <a href="${href("/p/" + r.slug)}" aria-label="${esc(r.title)}">${mediaHTML(r, { ratio: "1", cls: "" })}</a>
      <div style="min-width:0">
        <a class="t" href="${href("/p/" + r.slug)}">${esc(r.title)}</a>
        <div class="sub">${bits.map(esc).join(" · ")}</div>
      </div>
    </div>
    <div class="slots">${slots}</div>
    <div class="tfoot">
      ${copyBtn(r.id, r.vars.length ? (filledCount(r) ? "复制已填版本" : "复制原文") : "复制", "btn--ghost")}
      <span class="sp"></span>
      <a class="n" href="${href("/p/" + r.slug)}">打开工作台 →</a>
    </div>
  </article>`;
}
function wbGrid(rows) { return `<div class="tgrid">${rows.map(wbCard).join("")}</div>`; }
function wbSlotbar(res) {
  const on = S.params.get("vars") === "1";
  const n = res.pool.filter(r => r.vars.length).length;
  return `<div class="slotbar">
    <span class="lbl">这批里有 <b class="num">${n}</b> 条带占位变量的模板</span>
    <button class="chip" type="button" data-vars aria-pressed="${on}">只看带变量的<span class="n">${n}</span></button>
    <span class="sp"></span>
    <span class="lbl">卡片上点变量即可换值，复制出来的是替换后的版本</span>
  </div>`;
}

    <main id="main"><div class="wrap">
      <div style="display:flex;flex-wrap:wrap;gap:6px;padding:16px 0 0">${chips}</div>
      ${toolbarHTML(res)}
      ${res.total ? wbGrid(res.slice) : emptyHTML(res)}
      ${pagerHTML(res)}
    </div></main>${footHTML()}`;
  },

  detail(r) {
    const f = fillsOf(r);
    const model = r.models[0];
    const occ = v => (r.text.match(new RegExp(v.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g")) || []).length;
    const nFilled = filledCount(r);
    const presetVar = r.vars.find(v => PRESETS[v]);
    return `${navHTML()}<div class="wrap">
      ${crumbsHTML([{ label: "提示词库", to: href("/") }, { label: "图片", to: href("/image") },
        ...(model ? [{ label: model, to: href("/models/" + MODEL_SLUG(model)) }] : []), { label: clip(r.title, 20) }])}
      <header class="pagehead">
        <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px">${tagsHTML(r, 6)}</div>
        <h1 style="font-size:clamp(24px,3.4vw,32px);max-width:26ch">${esc(r.title)}</h1>
        <div class="stats">
          ${r.author ? `<span>由 <b>@${esc(r.author)}</b> 分享</span>` : ""}
          ${r.date ? `<span>${esc(r.date)}</span>` : ""}
          <span><b>${nf(r.chars)}</b> 字符</span>
          <span><b>${r.vars.length}</b> 个变量</span>
        </div>
      </header>
      <div class="bench">
        <form class="form" id="bench" onsubmit="return false">
          <div>
            <h2>${r.vars.length ? "填写变量" : "这条没有变量"}</h2>
            <p class="fh">${r.vars.length
              ? `右侧正文会实时替换。已填 <b class="num" data-filledcount>${nFilled}</b> / ${r.vars.length}。`
              : "整段复制即可使用，不需要替换任何内容。"}</p>
          </div>
          ${r.vars.map(v => `<div class="fgroup">
            <label for="v-${esc(v.replace(/\W/g, ""))}">${esc(v)}<span class="hits num">正文出现 ${occ(v)} 次</span></label>
            <input id="v-${esc(v.replace(/\W/g, ""))}" type="text" data-slotinput="${esc(v)}"
                   value="${esc(f[v] || "")}" placeholder="${esc(v.replace(/[[\]{}]/g, "").toLowerCase())}"
                   autocomplete="off" spellcheck="false">
            ${PRESETS[v] ? `<div class="presets">${PRESETS[v].map(p =>
              `<button class="chip" type="button" data-fill="${esc(v)}" data-fillvalue="${esc(p)}" data-id="${esc(r.id)}"
                       aria-pressed="${f[v] === p}">${esc(p)}</button>`).join("")}</div>` : ""}
          </div>`).join("")}
          ${r.vars.length ? `<div style="display:flex;gap:8px">
            <button class="btn btn--ghost btn--sm" type="button" data-resetfills="${esc(r.id)}">恢复原文</button>
          </div>` : ""}
          ${mediaHTML(r, { ratio: "16/10", cls: "" })}
          <p class="fh">原帖配图。实际输出会因模型版本与随机种子而不同。</p>
        </form>
        <div>
          <div class="out">
            <div class="out-bar">
              <span data-outstat>${nFilled ? `已替换 ${nFilled} 个变量` : "原文未改动"} · ${nf(resolvedText(r, f).length)} 字符</span>
              <span class="sp"></span>
              ${copyBtn(r.id, "复制提示词", "btn--primary")}
            </div>
            <pre class="ptxt" lang="en" tabindex="0" data-out="${esc(r.id)}">${promptHTML(r, f)}</pre>
          </div>
          ${presetVar ? `<section class="sec" style="padding-top:26px">
            <div class="sec-head"><h2>同一条提示词的其他版本</h2></div>
            <p class="sec-p">同一个模板，不同的 <code class="ptxt" style="display:inline;font-size:12px">${esc(presetVar)}</code> 值。点一下就切换。</p>
            <div class="series">${PRESETS[presetVar].map(p =>
              `<button type="button" data-fill="${esc(presetVar)}" data-fillvalue="${esc(p)}" data-id="${esc(r.id)}">
                <b>${esc(p)}</b><span>${esc(presetVar)} = ${esc(p)}</span></button>`).join("")}</div>
          </section>` : ""}
          <section class="sec">
            <div class="sec-head"><h2>来源</h2></div>
            <dl style="display:grid;grid-template-columns:88px 1fr;gap:8px 14px;font-size:13.5px;margin:0">
              <dt style="color:var(--fg2)">创作者</dt><dd>${r.author ? `<a style="color:var(--link)" href="https://x.com/${esc(r.author)}" rel="noopener nofollow" target="_blank">@${esc(r.author)}</a>` : "未记录"}</dd>
              <dt style="color:var(--fg2)">发布</dt><dd class="num">${esc(r.date || "未记录")}</dd>
              <dt style="color:var(--fg2)">互动</dt><dd class="num">${nf(r.likes)} 赞 · ${nf(r.bookmarks)} 藏</dd>
              <dt style="color:var(--fg2)">原帖</dt><dd>${r.srcUrl ? `<a style="color:var(--link)" href="${esc(r.srcUrl)}" rel="noopener nofollow" target="_blank">查看原帖 ↗</a>` : "未记录"}</dd>
              <dt style="color:var(--fg2)">权利</dt><dd>作者公开分享，本页逐字引用并署名</dd>
            </dl>
          </section>
        </div>
      </div>
    </div>${footHTML()}`;
  }
};

/* =====================================================================
   RUNTIME — render loop, event delegation, keyboard, copy
   ===================================================================== */
const stage = $("#stage");
const toastEl = $("#toast");
let toastTimer;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.setAttribute("data-on", "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.removeAttribute("data-on"), 1600);
}

let lastPath = null, restoreSearch = false;
function render() {
  readRoute();
  const skin = SKINS[S.skin];
  let html;
  if (S.path.startsWith("/p/")) {
    const slug = S.path.slice(3);
    const r = DATA.prompts.find(x => x.slug === slug) || BY_ID[slug];
    html = r ? skin.detail(r) : `${navHTML()}<main id="main"><div class="wrap"><div class="empty" style="margin:60px 0">
      <h3>找不到这条提示词</h3><p>原型只载入了 ${SAMPLE} 条真实记录。</p>
      <a class="btn" href="${href("/image")}">回到全部提示词</a></div></div></main>${footHTML()}`;
  } else if (S.path === "/") {
    html = skin.home();
  } else {
    html = skin.list(query(scopeOf()));
  }
  stage.innerHTML = `<div class="app" data-skin="${S.skin}">${html}</div>`;

  if (lastPath !== S.path) { window.scrollTo(0, 0); lastPath = S.path; }
  if (restoreSearch) {
    const q = $("#q", stage);
    if (q) { q.focus(); const v = q.value; q.setSelectionRange(v.length, v.length); }
    restoreSearch = false;
  }
}

/* ------------------------------------------------------------ copying */
async function writeClipboard(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall through */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}
async function doCopy(id, btn) {
  const r = BY_ID[id];
  if (!r) return;
  const ok = await writeClipboard(resolvedText(r, S.fills[id]));
  if (btn) {
    const span = $("span", btn);
    const prev = span ? span.textContent : "";
    if (span) span.textContent = ok ? "已复制" : "按 ⌘C 复制";
    btn.innerHTML = (ok ? ICON.check : ICON.copy) + `<span>${ok ? "已复制" : "按 ⌘C 复制"}</span>`;
    btn.setAttribute("data-state", ok ? "done" : "fail");
    setTimeout(() => {
      btn.innerHTML = ICON.copy + `<span>${prev || "复制"}</span>`;
      btn.removeAttribute("data-state");
    }, 1600);
  }
  toast(ok ? "提示词已复制到剪贴板" : "复制失败，请手动选中后按 ⌘C");
}

/* --------------------------------------------------- selection (console) */
function updateSelection(next) {
  const rows = $$(".row", stage);
  if (!rows.length) return;
  S.sel = Math.max(0, Math.min(next, rows.length - 1));
  rows.forEach((el, i) => el.setAttribute("aria-selected", String(i === S.sel)));
  rows[S.sel].scrollIntoView({ block: "nearest", behavior: "smooth" });
  const box = $(".rows", stage); if (box) box.setAttribute("aria-activedescendant", "row-" + S.sel);
  const res = S.path === "/" ? query({ kind: "all" }) : query(scopeOf());
  const pv = $(".preview", stage);
  if (pv) pv.outerHTML = conPreview(res.slice[S.sel]);
}
function selectedRecord() {
  const res = S.path === "/" ? query({ kind: "all" }) : query(scopeOf());
  return res.slice[Math.min(S.sel, res.slice.length - 1)];
}

/* ------------------------------------------------- workbench live fill */
function repaintFills(id) {
  const r = BY_ID[id]; if (!r) return;
  const f = fillsOf(r);
  const out = $(`[data-out="${CSS.escape(id)}"]`, stage);
  if (out) {
    const before = {};
    $$(".v", out).forEach(el => { before[el.dataset.slot + "|" + el.textContent] = 1; });
    out.innerHTML = promptHTML(r, f);
    $$(".v", out).forEach(el => {
      if (!before[el.dataset.slot + "|" + el.textContent]) {
        el.setAttribute("data-flash", "");
        setTimeout(() => el.removeAttribute("data-flash"), 420);
      }
    });
  }
  const n = filledCount(r);
  const fc = $("[data-filledcount]", stage); if (fc) fc.textContent = n;
  const st = $("[data-outstat]", stage);
  if (st) st.textContent = (n ? `已替换 ${n} 个变量` : "原文未改动") + " · " + nf(resolvedText(r, f).length) + " 字符";
  $$(`[data-fill][data-id="${CSS.escape(id)}"]`, stage).forEach(b =>
    b.setAttribute("aria-pressed", String(f[b.dataset.fill] === b.dataset.fillvalue)));
  $$(`[data-cycle="${CSS.escape(id)}"]`, stage).forEach(b => {
    const v = b.dataset.slot;
    b.firstChild.nodeValue = f[v] || v;
    f[v] ? b.setAttribute("data-filled", "") : b.removeAttribute("data-filled");
  });
}

/* ------------------------------------------------------------- events */
stage.addEventListener("click", e => {
  const t = e.target;
  const hit = sel => t.closest(sel);

  const facet = hit("[data-facet]");
  if (facet) { e.preventDefault(); S.sel = 0; go(S.path, toggleFacet(facet.dataset.facet, facet.dataset.value)); return; }

  if (hit("[data-clear]")) {
    e.preventDefault(); S.sel = 0;
    const p = new URLSearchParams();
    if (S.params.get("q")) p.set("q", S.params.get("q"));
    go(S.path, p); return;
  }
  const vb = hit("[data-vars]");
  if (vb) {
    e.preventDefault(); S.sel = 0;
    go(S.path, withParam(p => (p.get("vars") === "1" ? p.delete("vars") : p.set("vars", "1")))); return;
  }
  const cp = hit("[data-copy]");
  if (cp) { e.preventDefault(); doCopy(cp.dataset.copy, cp); return; }

  const ex = hit("[data-expand]");
  if (ex) {
    e.preventDefault();
    const block = ex.closest("[data-block]");
    const open = block.hasAttribute("data-open");
    open ? block.removeAttribute("data-open") : block.setAttribute("data-open", "");
    ex.textContent = open ? "展开全文" : "收起";
    return;
  }
  const row = hit("[data-row]");
  if (row) {
    const pv = $(".preview", stage);
    const previewVisible = pv && getComputedStyle(pv).display !== "none";
    if (previewVisible) { updateSelection(+row.dataset.row); return; }
    // narrow viewports hide the preview pane — a row must go somewhere, not nowhere
    const res = S.path === "/" ? query({ kind: "all" }) : query(scopeOf());
    const r = res.slice[+row.dataset.row];
    if (r) go("/p/" + r.slug);
    return;
  }

  const cyc = hit("[data-cycle]");
  if (cyc) {
    e.preventDefault();
    const id = cyc.dataset.cycle, slot = cyc.dataset.slot, list = PRESETS[slot] || [];
    const f = fillsOf(BY_ID[id]);
    const i = list.indexOf(f[slot]);
    f[slot] = i + 1 >= list.length ? "" : list[i + 1];
    if (!f[slot]) delete f[slot];
    const card = cyc.closest(".tcard");
    const btn = card && $("[data-copy]", card);
    if (btn) $("span", btn).textContent = filledCount(BY_ID[id]) ? "复制已填版本" : "复制原文";
    repaintFills(id);
    return;
  }
  const op = hit("[data-open]");
  if (op) { e.preventDefault(); go("/p/" + op.dataset.open); return; }

  const fill = hit("[data-fill]");
  if (fill) {
    e.preventDefault();
    const id = fill.dataset.id || (S.path.startsWith("/p/") ? (DATA.prompts.find(x => x.slug === S.path.slice(3)) || {}).id : null);
    if (!id) return;
    const f = fillsOf(BY_ID[id]), slot = fill.dataset.fill, val = fill.dataset.fillvalue;
    if (val) f[slot] = val; else delete f[slot];
    const inp = $(`[data-slotinput="${CSS.escape(slot)}"]`, stage);
    if (inp) inp.value = val || "";
    repaintFills(id);
    return;
  }
  const rf = hit("[data-resetfills]");
  if (rf) {
    e.preventDefault();
    const id = rf.dataset.resetfills;
    S.fills[id] = {};
    $$("[data-slotinput]", stage).forEach(i => (i.value = ""));
    repaintFills(id);
    return;
  }
}, false);

/* image failures degrade to the designed no-media state instead of a broken icon */
stage.addEventListener("error", e => {
  const img = e.target;
  if (img.tagName !== "IMG") return;
  const box = img.closest(".media, .thumb");
  if (!box) { img.remove(); return; }
  box.classList.add("media--none");
  img.remove();
  if (!box.textContent.trim()) box.textContent = "图片未加载";
}, true);

let qTimer;
stage.addEventListener("input", e => {
  if (e.target.id === "q") {
    clearTimeout(qTimer);
    const v = e.target.value;
    qTimer = setTimeout(() => {
      S.sel = 0; restoreSearch = true;
      go(S.path, withParam(p => (v ? p.set("q", v) : p.delete("q"))), { replace: true });
    }, 280);
    return;
  }
  const si = e.target.closest("[data-slotinput]");
  if (si) {
    const id = (DATA.prompts.find(x => x.slug === S.path.slice(3)) || {}).id;
    if (!id) return;
    const f = fillsOf(BY_ID[id]), v = si.value.trim();
    if (v) f[si.dataset.slotinput] = v; else delete f[si.dataset.slotinput];
    repaintFills(id);
  }
});
stage.addEventListener("change", e => {
  const s = e.target.closest("[data-sort]");
  if (s) { S.sel = 0; go(S.path, withParam(p => p.set("sort", s.value))); }
});
stage.addEventListener("submit", e => e.preventDefault());

/* --------------------------------------------------------- keyboard */
const typing = el => /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable;
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const el = document.activeElement;
  if (typing(el)) {
    if (e.key === "Escape") { el.blur(); if (el.id === "q" && el.value) { el.value = ""; S.sel = 0; go(S.path, withParam(p => p.delete("q")), { replace: true }); } }
    return;
  }
  if (e.key === "/") { e.preventDefault(); const q = $("#q", stage); if (q) { q.focus(); q.select(); } return; }
  if (S.skin === "console" && $(".row", stage)) {
    if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); updateSelection(S.sel + 1); return; }
    if (e.key === "ArrowUp"   || e.key === "k") { e.preventDefault(); updateSelection(S.sel - 1); return; }
    if (e.key === "c" || e.key === "C") { const r = selectedRecord(); if (r) { e.preventDefault(); doCopy(r.id, null); } return; }
    if (e.key === "Enter") { const r = selectedRecord(); if (r) { e.preventDefault(); go("/p/" + r.slug); } return; }
  }
  if (e.key === "Escape" && activeFilters().length) { S.sel = 0; go(S.path, new URLSearchParams()); }
});
window.addEventListener("hashchange", render);

/* ===================== picker (harness chrome, verbatim) ===================== */
const SKIN_ORDER = ["gallery", "console", "editorial", "workbench"];
const variants = SKIN_ORDER.map(name => () => { S.skin = name; render(); });
const picker = $(".proto-picker");
const highlight = $(".proto-picker-highlight", picker);
const items = $$(".proto-picker-item:not(.proto-picker-replay)", picker);
const replay = $(".proto-picker-replay", picker);
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + "px";
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function mount(i) {
  stage.innerHTML = "";
  // Clear first, render next frame, so entrance animations re-run.
  // rAF is paused while the document is hidden — render straight away there,
  // since there is no entrance animation to re-trigger anyway.
  if (document.hidden) variants[i]();
  else requestAnimationFrame(() => { variants[i](); });
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute("data-active", j === i);
    if (j === i) el.setAttribute("aria-current", "true"); else el.removeAttribute("aria-current");
  });
  moveHighlight();
  try {
    const url = new URL(location);
    url.searchParams.set("v", i + 1);
    history.replaceState(null, "", url);
  } catch (e) { /* opaque origin: selection simply doesn't persist across reload */ }
  mount(i);
}
items.forEach((el, i) => el.addEventListener("click", () => setActive(i)));
replay.addEventListener("click", () => mount(current));
window.addEventListener("resize", moveHighlight);
document.addEventListener("keydown", e => {
  const el = e.target;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === "ArrowRight") setActive((current + 1) % variants.length);
  else if (e.key === "ArrowLeft") setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === "r" || e.key === "R") mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get("v"), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")));

</script>
</body>
</html>
