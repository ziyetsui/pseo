<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>提示词库 · 四页原型（4 个方向）</title>
<meta name="description" content="Higgsfield 提示词库 L1–L4 四个页面的交互原型，四种设计方向可实时切换。">
<style>

/* ============================================================
   SHARED MATERIALS — frontend/AGENTS.md §7 (Linear-derived)
   Every skin below is built from these. Divergence lives in
   layout, density, interaction model and motion — not tokens.
   ============================================================ */
:root{
  color-scheme: light dark;

  /* surfaces — the raised one is always lighter, both schemes */
  --canvas:  light-dark(#f9f8f9, #08090a);
  --surface: light-dark(#ffffff, #0f1011);
  --muted:   light-dark(#f4f2f4, #141516);
  --raised:  light-dark(#eeedef, #191a1b);

  /* ink — measured, §7.1 */
  --fg:    light-dark(#282a30, #f7f8f8);
  --fg2:   light-dark(#6f6e77, #8a8f98);   /* weakest ink allowed for text */
  --faint: light-dark(#86848d, #62666d);   /* NON-TEXT only: inert icons, rules */
  --link:  light-dark(#5252f5, #828fff);
  --brand: light-dark(#5252f5, #5e6ad2);
  --on-brand: #ffffff;
  --focus: #5e6ad2;

  /* status — semantics only, never taxonomy */
  --danger:  light-dark(#c33a3a, #eb5757);
  --success: light-dark(#1f7a35, #27a644);
  --warning: light-dark(#8a6a00, #f0bf00);

  /* lines — hairline is decorative; --control is the ≥3:1 form-control outline */
  --hairline: light-dark(rgb(0 0 0 / 6%),  rgb(255 255 255 / 6%));
  --line:     light-dark(rgb(0 0 0 / 11%), rgb(255 255 255 / 12%));
  --control:  light-dark(rgb(0 0 0 / 45%), rgb(255 255 255 / 36%));

  /* type */
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
          "PingFang SC", "Microsoft YaHei", monospace;

  /* geometry */
  --r4:4px; --r6:6px; --r8:8px; --r12:12px; --r16:16px; --r24:24px; --r32:32px;
  --wide:1024px; --prose:624px;

  /* elevation */
  --sh-low:  light-dark(0 1px 4px -1px #00000017, 0 2px 4px #0000001a);
  --sh-med:  light-dark(0 3px 12px #00000017,     0 4px 24px #0003);
  --sh-high: light-dark(0 7px 24px #0000000f,     0 7px 32px #00000059);

  /* motion — all UI < 300ms, ease-in banned */
  --t-quick:100ms; --t-reg:250ms; --t-fade:150ms;
  --e-out: cubic-bezier(.25,.46,.45,.94);
  --e-emph: cubic-bezier(.23,1,.32,1);
  --e-inout: cubic-bezier(.455,.03,.515,.955);

  --z-sticky:100; --z-sheet:200; --z-toast:400;
}
@media (min-resolution:192dpi){ :root{ --hair-w:.5px } }

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--canvas); color:var(--fg);
  font-family:var(--sans); font-size:15px; line-height:1.6; font-weight:400;
  font-synthesis:none; -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility; overflow-x:hidden;
}
h1,h2,h3,h4,p,figure,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
button,a,input,select,summary{touch-action:manipulation}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r4)}
::selection{background:color-mix(in oklch, var(--brand) 28%, transparent)}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:0;z-index:999;background:var(--brand);
      color:var(--on-brand);padding:10px 16px;border-radius:0 0 var(--r8) 0}
.skip:focus{left:0}
.num{font-variant-numeric:tabular-nums}

/* --- prompt text: verbatim, always. §7.0.1 --- */
.ptxt{
  font-family:var(--mono); font-size:13px; line-height:1.65;
  white-space:pre-wrap; overflow-wrap:anywhere; word-break:normal;
  text-transform:none; hyphens:none; font-variant-ligatures:none;
  -webkit-font-smoothing:auto;
}
.ptxt::-webkit-scrollbar{width:8px;height:8px}
.ptxt::-webkit-scrollbar-thumb{background:light-dark(rgb(0 0 0/20%),rgb(255 255 255/20%));border-radius:var(--r4)}
.ptxt .v{
  color:var(--brand); background:color-mix(in oklch, var(--brand) 14%, transparent);
  border-radius:var(--r4); padding:0 3px; font-weight:600;
}

/* ============================ shared atoms ============================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:36px;padding:0 14px;border-radius:var(--r8);
  border:1px solid var(--control); background:var(--surface); color:var(--fg);
  font-size:13.5px;font-weight:400;cursor:pointer;white-space:nowrap;
  transition:box-shadow var(--t-quick) var(--e-out),
             background-color var(--t-quick) var(--e-out),
             border-color var(--t-quick) var(--e-out),
             color var(--t-quick) var(--e-out);
}
@media (hover:hover){ .btn:hover{box-shadow:var(--sh-low)} }
.btn:active{transform:scale(.97)}
.btn--primary{background:var(--brand);color:var(--on-brand);border-color:transparent;font-weight:600}
.btn--ghost{background:transparent;border-color:var(--line);color:var(--fg2)}
@media (hover:hover){ .btn--ghost:hover{color:var(--fg);border-color:var(--control)} }
.btn--sm{min-height:32px;padding:0 10px;font-size:12.5px}
.btn[data-state="done"]{color:var(--success);border-color:var(--success)}
.btn--primary[data-state="done"]{background:var(--success);color:#fff;border-color:transparent}
.btn:disabled{color:var(--fg2);background:var(--muted);border-color:var(--line);cursor:not-allowed}

.icon{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;
      stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

.chip{
  display:inline-flex;align-items:center;gap:5px;position:relative;
  min-height:30px;padding:0 11px;border-radius:999px;
  border:1px solid var(--line);background:transparent;color:var(--fg2);
  font-size:12.5px;cursor:pointer;white-space:nowrap;
  transition:box-shadow var(--t-quick) var(--e-out),color var(--t-quick) var(--e-out),
             border-color var(--t-quick) var(--e-out),background-color var(--t-quick) var(--e-out);
}
.chip::before{content:"";position:absolute;inset:-7px}       /* 44px hit area */
@media (hover:hover){ .chip:hover{color:var(--fg);border-color:var(--control)} }
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{
  background:var(--fg);color:var(--canvas);border-color:transparent;font-weight:600;
}
.chip[aria-pressed="true"]::after{content:"✓";font-size:11px;margin-left:1px}
.chip .n{font-variant-numeric:tabular-nums;color:inherit;opacity:.6;font-size:11.5px}
.chip--static{cursor:default;border-color:var(--hairline);background:var(--muted);
              min-height:24px;padding:0 8px;font-size:11.5px}
.chip--static::before{content:none}

.field{
  display:flex;align-items:center;gap:8px;
  border:1px solid var(--control);border-radius:var(--r12);
  background:var(--surface);padding:5px 5px 5px 12px;
  transition:box-shadow var(--t-quick) var(--e-out),border-color var(--t-quick) var(--e-out);
}
.field:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in oklch,var(--focus) 22%,transparent)}
.field input{
  flex:1;min-width:0;border:0;background:transparent;color:var(--fg);
  font:inherit;font-size:16px;padding:8px 0;   /* 16px: no iOS zoom */
}
.field input::placeholder{color:var(--fg2)}
.field input:focus{outline:none}
.field .kbd{display:none}
@media (hover:hover) and (pointer:fine){
  .field .kbd{display:inline-flex;align-items:center;height:22px;padding:0 6px;
    border:1px solid var(--line);border-radius:var(--r6);color:var(--fg2);
    font-size:11px;font-family:var(--mono)}
}

.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:var(--r4);
     background:var(--muted);color:var(--fg2);font-size:11.5px;line-height:1.5}
.tag b{font-weight:600;color:var(--fg)}
.kicker{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);font-weight:600}

.media{position:relative;background:var(--muted);overflow:hidden;isolation:isolate}
.media img{width:100%;height:100%;object-fit:cover}
.media .badge{
  position:absolute;left:8px;bottom:8px;display:inline-flex;align-items:center;gap:4px;
  padding:3px 7px;border-radius:var(--r6);font-size:11px;font-variant-numeric:tabular-nums;
  background:rgb(0 0 0/62%);color:#fff;pointer-events:none;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.media--none{display:grid;place-items:center;color:var(--faint);font-size:12px}

.empty{
  border:1px dashed var(--line);border-radius:var(--r12);background:var(--surface);
  padding:40px 24px;text-align:center;display:grid;gap:10px;justify-items:center;min-height:220px;
  align-content:center;
}
.empty h3{font-size:16px;font-weight:600}
.empty p{color:var(--fg2);font-size:13.5px;max-width:42ch}

/* toast — copy confirmation for keyboard-driven copies */
.toast{
  position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(8px);
  z-index:var(--z-toast);padding:9px 15px;border-radius:999px;
  background:var(--fg);color:var(--canvas);font-size:13px;font-weight:600;
  box-shadow:var(--sh-high);opacity:0;pointer-events:none;
  transition:opacity var(--t-fade) var(--e-out), transform var(--t-fade) var(--e-emph);
}
.toast[data-on]{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============================ footer (all skins) ============================
   Kept deliberately: this is the pSEO internal-link surface. Real <a href>,
   real counts, crawlable with JS off. */
.foot{border-top:1px solid var(--line);background:var(--surface);margin-top:auto;
      padding-bottom:env(safe-area-inset-bottom)}
.foot-in{max-width:var(--wide);margin:0 auto;padding:44px 24px 28px}
.foot-cols{display:grid;gap:28px 24px;grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.foot h2{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
         color:var(--fg2);margin-bottom:10px}
.foot li{margin-bottom:2px}
.foot li a{
  display:inline-flex;align-items:baseline;gap:6px;min-height:28px;padding:3px 0;
  font-size:13px;color:var(--fg2);
  transition:color var(--t-quick) var(--e-out);
}
@media (hover:hover){ .foot li a:hover{color:var(--fg);text-decoration:underline;text-underline-offset:3px} }
.foot li a .n{font-variant-numeric:tabular-nums;color:var(--faint);font-size:11.5px}
.foot-legal{
  margin-top:34px;padding-top:18px;border-top:1px solid var(--hairline);
  display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;
  font-size:12.5px;color:var(--fg2);
}
.foot-legal b{font-weight:600;color:var(--fg)}
.foot-legal .sp{margin-left:auto}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important;
  }
  .btn:active,.chip:active{transform:none}
}

/* ======================= shared page chrome ======================= */
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.wrap{max-width:var(--wide);margin:0 auto;padding:0 24px;width:100%}

.nav{
  position:sticky;top:0;z-index:var(--z-sticky);
  background:color-mix(in srgb, var(--canvas) 88%, transparent);
  -webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);
  border-bottom:1px solid var(--hairline);
}
.nav-in{max-width:var(--wide);margin:0 auto;padding:0 24px;
        display:flex;align-items:center;gap:8px;min-height:56px}
.brand{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:15px;
       letter-spacing:-.01em;margin-right:14px;min-height:44px}
.brand .mark{width:20px;height:20px;border-radius:var(--r6);background:var(--fg);
             display:grid;place-items:center;color:var(--canvas);font-size:11px;font-weight:600}
.nav-links{display:flex;gap:2px;font-size:13.5px}
.nav-links a{
  display:inline-flex;align-items:center;min-height:36px;padding:0 10px;border-radius:var(--r6);
  color:var(--fg2);transition:color var(--t-quick) var(--e-out),background-color var(--t-quick) var(--e-out);
}
@media (hover:hover){ .nav-links a:hover{color:var(--fg);background:var(--muted)} }
.nav-links a[aria-current="page"]{color:var(--fg);font-weight:600}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.nav-count{font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums;display:none}
@media (min-width:720px){ .nav-count{display:inline} }

.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;
        font-size:12.5px;color:var(--fg2);padding:14px 0 0}
.crumbs a{transition:color var(--t-quick) var(--e-out)}
@media (hover:hover){ .crumbs a:hover{color:var(--fg);text-decoration:underline;text-underline-offset:3px} }
.crumbs .sep{color:var(--faint)}
.crumbs [aria-current]{color:var(--fg)}

.pagehead{padding:22px 0 4px}
.pagehead h1{font-size:clamp(28px,4.4vw,40px);line-height:1.12;letter-spacing:-.03em;
             font-weight:600;text-wrap:balance;max-width:20ch}
.pagehead .lede{margin-top:12px;color:var(--fg2);font-size:16px;max-width:58ch;text-wrap:pretty}
.pagehead .stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;
                 font-size:13px;color:var(--fg2);font-variant-numeric:tabular-nums}
.pagehead .stats b{color:var(--fg);font-weight:600}

.sec{padding:38px 0}
.sec + .sec{border-top:1px solid var(--hairline)}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.sec-head h2{font-size:19px;font-weight:600;letter-spacing:-.02em}
.sec-head .more{margin-left:auto;font-size:13px;color:var(--link);min-height:36px;
                display:inline-flex;align-items:center}
@media (hover:hover){ .sec-head .more:hover{text-decoration:underline;text-underline-offset:3px} }
.sec-p{color:var(--fg2);font-size:13.5px;margin-bottom:18px;max-width:62ch;text-wrap:pretty}

/* taxonomy link grid — the crawlable inner-link surface, present in every skin */
.taxgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(196px,1fr))}
.taxgrid a{
  display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 12px;
  border:1px solid var(--hairline);border-radius:var(--r8);background:var(--surface);
  transition:box-shadow var(--t-quick) var(--e-out),border-color var(--t-quick) var(--e-out);
}
@media (hover:hover){ .taxgrid a:hover{box-shadow:var(--sh-low);border-color:var(--line)} }
.taxgrid a:active{transform:scale(.99)}
.taxgrid .t{font-size:13.5px;font-weight:600;flex:1;min-width:0;
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.taxgrid .c{font-size:12px;color:var(--fg2);font-variant-numeric:tabular-nums;flex:none}
.taxgrid .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--faint)}

.creators{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(228px,1fr))}
.creators a{display:flex;align-items:center;gap:10px;min-height:56px;padding:9px 12px;
            border:1px solid var(--hairline);border-radius:var(--r8);background:var(--surface);
            transition:box-shadow var(--t-quick) var(--e-out)}
@media (hover:hover){ .creators a:hover{box-shadow:var(--sh-low)} }
.creators .av{width:32px;height:32px;border-radius:50%;background:var(--raised);flex:none;
              display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--fg2)}
.creators .who{min-width:0}
.creators b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;
            text-overflow:ellipsis;white-space:nowrap}
.creators span{display:block;font-size:11.5px;color:var(--fg2);font-variant-numeric:tabular-nums}

/* result toolbar — filters + count + sort, shared shell, skins restyle */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0}
.toolbar .count{font-size:13px;color:var(--fg2);font-variant-numeric:tabular-nums}
.toolbar .count b{color:var(--fg);font-weight:600}
.toolbar .sp{margin-left:auto}
.sortsel{
  min-height:36px;padding:0 30px 0 10px;border-radius:var(--r8);
  border:1px solid var(--control);background:var(--surface);color:var(--fg);
  font-size:13px;appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
                   linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 16px) 15px, calc(100% - 11px) 15px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.activefilters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.activefilters .clear{font-size:12.5px;color:var(--link);background:none;border:0;
                      cursor:pointer;min-height:32px;padding:0 4px}
@media (hover:hover){ .activefilters .clear:hover{text-decoration:underline;text-underline-offset:3px} }

/* card entrance — one shared motion, tuned per skin */
@keyframes rise{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
.rise{animation:rise var(--t-reg) var(--e-emph) both}
@media (prefers-reduced-motion:reduce){ .rise{animation:none} }

/* pagination — real crawlable links */
.pager{display:flex;gap:6px;align-items:center;justify-content:center;padding:26px 0 6px;flex-wrap:wrap}
.pager a,.pager span{min-width:40px;min-height:40px;display:inline-flex;align-items:center;
  justify-content:center;padding:0 10px;border-radius:var(--r8);font-size:13.5px;
  font-variant-numeric:tabular-nums;border:1px solid var(--hairline);color:var(--fg2)}
.pager a{transition:border-color var(--t-quick) var(--e-out),color var(--t-quick) var(--e-out)}
@media (hover:hover){ .pager a:hover{color:var(--fg);border-color:var(--control)} }
.pager [aria-current="page"]{background:var(--fg);color:var(--canvas);border-color:transparent;font-weight:600}

/* ================================================================
   SKIN A — GALLERY   axis: result-first, visual density
   The output image is the unit. Prompt text is one tap away.
   ================================================================ */
[data-skin="gallery"] .hero-mosaic{
  display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:26px;
  border-radius:var(--r16);overflow:hidden;
}
[data-skin="gallery"] .hero-mosaic .media{aspect-ratio:1;border-radius:0}
[data-skin="gallery"] .hero-mosaic .media:first-child{grid-column:span 2;grid-row:span 2;aspect-ratio:1}
@media (max-width:640px){
  [data-skin="gallery"] .hero-mosaic{grid-template-columns:repeat(4,1fr)}
  [data-skin="gallery"] .hero-mosaic .media:nth-child(n+7){display:none}
}

[data-skin="gallery"] .filterbar{
  position:sticky;top:56px;z-index:calc(var(--z-sticky) - 1);
  background:color-mix(in srgb,var(--canvas) 92%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--hairline);margin:0 -24px;padding:8px 24px;
}
[data-skin="gallery"] .filterbar .scroller{
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0;
  scroll-snap-type:x proximity;
  /* the rail scrolls past the edge — fade it so that reads as intentional */
  -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 40px),transparent);
  mask-image:linear-gradient(to right,#000 calc(100% - 40px),transparent);
}
[data-skin="gallery"] .filterbar .scroller::-webkit-scrollbar{display:none}
[data-skin="gallery"] .filterbar .chip{scroll-snap-align:start;flex:none}

/* A real grid, not CSS columns. We do not have the source images' true
   aspect ratios, so a "masonry" here would be a forced 4:5 pretending to be
   organic — and `columns` orders items column-major, which reads wrong for a
   list sorted by popularity. Uniform ratio, row-major order, no layout shift. */
[data-skin="gallery"] .tilegrid{
  display:grid;gap:12px;align-items:start;margin-top:16px;
  grid-template-columns:repeat(auto-fill,minmax(226px,1fr));
}
@media (max-width:560px){
  [data-skin="gallery"] .tilegrid{gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
[data-skin="gallery"] .tilegrid--tight{grid-template-columns:repeat(auto-fill,minmax(186px,1fr))}
[data-skin="gallery"] .tile{
  border-radius:var(--r12);overflow:hidden;
  background:var(--surface);border:1px solid var(--hairline);position:relative;isolation:isolate;
  transition:box-shadow var(--t-reg) var(--e-out),border-color var(--t-reg) var(--e-out);
}
@media (hover:hover){
  [data-skin="gallery"] .tile:hover{box-shadow:var(--sh-med);border-color:var(--line)}
}
[data-skin="gallery"] .tile .media{border-radius:0;width:100%}
[data-skin="gallery"] .tile .shade{
  position:absolute;left:0;right:0;bottom:0;padding:34px 10px 10px;
  background:linear-gradient(to top,rgb(0 0 0/78%),rgb(0 0 0/38%) 46%,transparent);
  color:#fff;pointer-events:none;
  opacity:0;transition:opacity var(--t-reg) var(--e-out);
}
[data-skin="gallery"] .tile .shade .t{
  font-size:12.5px;line-height:1.45;font-weight:600;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
[data-skin="gallery"] .tile .shade .m{
  margin-top:5px;font-size:11px;opacity:.82;font-variant-numeric:tabular-nums;
  display:flex;gap:8px;flex-wrap:wrap;
}
@media (hover:hover) and (pointer:fine){
  [data-skin="gallery"] .tile:hover .shade,
  [data-skin="gallery"] .tile:focus-within .shade{opacity:1}
}
@media (hover:none),(pointer:coarse){
  /* touch: no hover to reveal — the caption is always on */
  [data-skin="gallery"] .tile .shade{opacity:1;position:static;background:none;color:inherit;padding:9px 10px 10px}
  [data-skin="gallery"] .tile .shade .m{color:var(--fg2);opacity:1}
}
[data-skin="gallery"] .tile .acts{
  position:absolute;right:8px;top:8px;display:flex;gap:8px;
  opacity:0;transition:opacity var(--t-reg) var(--e-out);
}
@media (hover:hover) and (pointer:fine){
  [data-skin="gallery"] .tile:hover .acts,
  [data-skin="gallery"] .tile:focus-within .acts{opacity:1}
}
@media (hover:none),(pointer:coarse){
  [data-skin="gallery"] .tile .acts{position:static;opacity:1;padding:0 10px 10px;justify-content:flex-start}
}
[data-skin="gallery"] .tile .acts .btn{
  min-height:32px;padding:0 10px;font-size:12px;
  background:rgb(255 255 255/94%);color:#111;border-color:transparent;
  box-shadow:0 1px 3px rgb(0 0 0/28%);
}
@media (hover:none),(pointer:coarse){
  [data-skin="gallery"] .tile .acts .btn{background:var(--surface);color:var(--fg);
    border-color:var(--control);box-shadow:none}
}
[data-skin="gallery"] .tile .acts .btn[data-state="done"]{background:var(--success);color:#fff}
/* a text-only prompt gets the same footprint as an image tile, so a row of
   mixed content still reads as one grid instead of a ragged shelf */
[data-skin="gallery"] .tile--text{
  aspect-ratio:4/5;display:flex;flex-direction:column;padding:12px;
}
[data-skin="gallery"] .tile--text .ptxt{
  flex:1;min-height:0;font-size:11.5px;line-height:1.6;overflow:hidden;color:var(--fg2);
  -webkit-mask-image:linear-gradient(to bottom,#000 58%,transparent);
  mask-image:linear-gradient(to bottom,#000 58%,transparent);
}
[data-skin="gallery"] .tile--text .t{font-size:13px;font-weight:600;margin-bottom:8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (hover:none),(pointer:coarse){
  [data-skin="gallery"] .tile--text{aspect-ratio:auto}
  [data-skin="gallery"] .tile--text .ptxt{max-height:180px}
}

/* L4 gallery: media column + sticky prompt rail */
[data-skin="gallery"] .detail{display:grid;gap:28px;grid-template-columns:minmax(0,1fr) 400px;
  align-items:start;padding:26px 0 8px}
@media (max-width:900px){ [data-skin="gallery"] .detail{grid-template-columns:minmax(0,1fr)} }
[data-skin="gallery"] .shots{display:grid;gap:8px}
[data-skin="gallery"] .shots .media{border-radius:var(--r12)}
[data-skin="gallery"] .shots .strip{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}
[data-skin="gallery"] .rail{position:sticky;top:76px;display:grid;gap:14px}
@media (max-width:900px){ [data-skin="gallery"] .rail{position:static} }

/* ================================================================
   SKIN B — CONSOLE   axis: density + keyboard, app-like
   Filter rail · result list · live preview. No page loads to compare.
   ================================================================ */
[data-skin="console"]{font-size:14px}
[data-skin="console"] .wrap{max-width:1360px}
[data-skin="console"] .nav-in{max-width:1360px}
[data-skin="console"] .panes{
  display:grid;grid-template-columns:212px minmax(0,1fr) minmax(0,460px);
  gap:0;align-items:start;border-top:1px solid var(--hairline);
  min-height:calc(100dvh - 56px);
}
@media (max-width:1180px){ [data-skin="console"] .panes{grid-template-columns:196px minmax(0,1fr)} }
@media (max-width:820px){ [data-skin="console"] .panes{grid-template-columns:minmax(0,1fr)} }

[data-skin="console"] .rail{
  position:sticky;top:56px;max-height:calc(100dvh - 56px);overflow:auto;overscroll-behavior:contain;
  border-right:1px solid var(--hairline);padding:14px 12px 40px;
}
@media (max-width:820px){ [data-skin="console"] .rail{display:none} }
[data-skin="console"] .rail h2{
  font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg2);
  font-weight:600;margin:16px 0 5px;padding:0 6px;
}
[data-skin="console"] .rail h2:first-child{margin-top:0}
[data-skin="console"] .rail button{
  display:flex;align-items:center;gap:8px;width:100%;min-height:30px;padding:4px 6px;
  border:0;background:none;border-radius:var(--r6);color:var(--fg2);
  font-size:13px;text-align:left;cursor:pointer;
  transition:background-color var(--t-quick) var(--e-out),color var(--t-quick) var(--e-out);
}
@media (hover:hover){ [data-skin="console"] .rail button:hover{background:var(--muted);color:var(--fg)} }
[data-skin="console"] .rail button .l{flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
[data-skin="console"] .rail button .n{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--faint)}
[data-skin="console"] .rail button[aria-pressed="true"]{background:var(--muted);color:var(--fg);font-weight:600}
[data-skin="console"] .rail button[aria-pressed="true"] .l::before{content:"● ";color:var(--brand);font-size:9px;vertical-align:2px}

[data-skin="console"] .listcol{border-right:1px solid var(--hairline);min-width:0}
[data-skin="console"] .listhead{
  position:sticky;top:56px;z-index:2;display:flex;align-items:center;gap:8px;
  padding:9px 14px;border-bottom:1px solid var(--hairline);
  background:color-mix(in srgb,var(--canvas) 92%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
[data-skin="console"] .rows{padding:4px 0 60px}
[data-skin="console"] .row{
  display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:11px;align-items:center;
  width:100%;padding:7px 14px;border:0;background:none;text-align:left;cursor:pointer;
  border-bottom:1px solid var(--hairline);
  transition:background-color var(--t-quick) var(--e-out);
}
@media (hover:hover){ [data-skin="console"] .row:hover{background:var(--muted)} }
[data-skin="console"] .row[aria-selected="true"]{background:var(--muted)}
[data-skin="console"] .row[aria-selected="true"]::before{
  content:"";position:absolute;left:0;width:2px;height:100%;background:var(--brand)}
[data-skin="console"] .row{position:relative}
[data-skin="console"] .row .thumb{width:44px;height:44px;border-radius:var(--r6);overflow:hidden;
  background:var(--muted);flex:none;display:grid;place-items:center;color:var(--faint);font-size:10px}
[data-skin="console"] .row .thumb img{width:100%;height:100%;object-fit:cover}
[data-skin="console"] .row > span:nth-child(2){min-width:0;overflow:hidden}
[data-skin="console"] .row .t{display:block;font-size:13px;line-height:1.4;color:var(--fg);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[data-skin="console"] .row[aria-selected="true"] .t{font-weight:600}
[data-skin="console"] .row .sub{
  display:flex;gap:8px;margin-top:2px;font-size:11.5px;color:var(--fg2);
  font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap;min-width:0;
}
[data-skin="console"] .row .sub .dot{color:var(--faint)}
[data-skin="console"] .row .right{display:flex;align-items:center;gap:8px;
  font-size:11.5px;color:var(--fg2);font-variant-numeric:tabular-nums}
[data-skin="console"] .row .flag{width:6px;height:6px;border-radius:50%;background:var(--warning);flex:none}

[data-skin="console"] .preview{
  position:sticky;top:56px;max-height:calc(100dvh - 56px);overflow:auto;
  overscroll-behavior:contain;padding:16px 18px 40px;display:grid;gap:14px;align-content:start;
}
@media (max-width:1180px){ [data-skin="console"] .preview{display:none} }
[data-skin="console"] .preview .media{border-radius:var(--r8);aspect-ratio:16/10}
[data-skin="console"] .preview .ptxt{
  background:var(--muted);border:1px solid var(--hairline);border-radius:var(--r8);
  padding:11px 12px;max-height:38vh;overflow:auto;
}
[data-skin="console"] .kv{display:grid;grid-template-columns:70px 1fr;gap:4px 10px;font-size:12.5px}
[data-skin="console"] .kv dt{color:var(--fg2)}
[data-skin="console"] .kv dd{font-variant-numeric:tabular-nums}
[data-skin="console"] .hint{
  display:flex;flex-wrap:wrap;gap:5px 12px;font-size:11.5px;color:var(--fg2);
  border-top:1px solid var(--hairline);padding-top:10px;
}
[data-skin="console"] .hint kbd{
  font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-radius:var(--r4);
  padding:1px 5px;color:var(--fg);background:var(--surface);
}
/* console footer sits below the panes, still crawlable */
[data-skin="console"] .foot-in{max-width:1360px}

/* detail split collapses before the prompt block gets unreadable */
[data-skin="console"] .dsplit{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) 300px;align-items:start}
@media (max-width:900px){ [data-skin="console"] .dsplit{grid-template-columns:minmax(0,1fr)} }
[data-skin="console"] .dsplit > div:last-child{max-width:340px}

@media (max-width:820px){
  [data-skin="console"] .listcol{border-right:0}
}

/* ================================================================
   SKIN C — EDITORIAL   axis: document-like, SEO-native
   One column. Real <a> per facet. Reads with JS off.
   ================================================================ */
[data-skin="editorial"] .wrap{max-width:760px}
[data-skin="editorial"] .wrap--wide{max-width:var(--wide)}
[data-skin="editorial"] .nav-in{max-width:760px}
[data-skin="editorial"] .foot-in{max-width:760px}
[data-skin="editorial"] .pagehead{padding:34px 0 0}
[data-skin="editorial"] .pagehead h1{font-size:clamp(32px,5.6vw,46px);letter-spacing:-.035em;max-width:17ch}
[data-skin="editorial"] .pagehead .lede{font-size:18px;line-height:1.62;max-width:var(--prose);color:var(--fg)}
[data-skin="editorial"] .prose{max-width:var(--prose);font-size:16px;line-height:1.72;color:var(--fg2)}
[data-skin="editorial"] .prose p + p{margin-top:1.72em}
[data-skin="editorial"] .prose strong{color:var(--fg);font-weight:600}
[data-skin="editorial"] .prose a{color:var(--link);text-decoration:underline;
  text-underline-offset:3px;text-decoration-thickness:1px}

[data-skin="editorial"] .facetlinks{
  display:flex;flex-wrap:wrap;gap:6px;padding:14px 0;
  border-top:1px solid var(--hairline);
}
[data-skin="editorial"] .facetlinks + .facetlinks{border-top:1px solid var(--hairline)}
[data-skin="editorial"] .facetlinks:last-of-type{border-bottom:1px solid var(--hairline)}
[data-skin="editorial"] .facetlinks .lbl{
  font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg2);
  font-weight:600;width:100%;margin-bottom:2px;
}
[data-skin="editorial"] .toc{
  border:1px solid var(--hairline);border-radius:var(--r12);background:var(--surface);
  padding:14px 16px;margin:26px 0;
}
[data-skin="editorial"] .toc h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--fg2);font-weight:600;margin-bottom:8px}
[data-skin="editorial"] .toc ol{counter-reset:toc;display:grid;grid-template-columns:minmax(0,1fr);gap:1px}
[data-skin="editorial"] .toc li{counter-increment:toc;min-width:0}
[data-skin="editorial"] .toc a{
  display:flex;gap:10px;align-items:baseline;min-height:34px;padding:4px 0;font-size:13.5px;
  color:var(--fg2);max-width:100%;transition:color var(--t-quick) var(--e-out);
}
[data-skin="editorial"] .toc a::before{
  content:counter(toc,decimal-leading-zero);font-family:var(--mono);font-size:11px;
  color:var(--faint);flex:none;width:20px;
}
@media (hover:hover){ [data-skin="editorial"] .toc a:hover{color:var(--fg)} }
[data-skin="editorial"] .toc a .t{flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}

[data-skin="editorial"] .entry{
  padding:36px 0;border-top:1px solid var(--hairline);scroll-margin-top:76px;
}
[data-skin="editorial"] .entry .no{
  font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.04em;
}
[data-skin="editorial"] .entry h3{
  font-size:22px;line-height:1.28;letter-spacing:-.02em;font-weight:600;
  margin:6px 0 0;text-wrap:pretty;max-width:26ch;
}
[data-skin="editorial"] .entry .byline{
  display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:9px;font-size:13px;color:var(--fg2);
  font-variant-numeric:tabular-nums;align-items:center;
}
[data-skin="editorial"] .entry .byline a{color:var(--link)}
@media (hover:hover){ [data-skin="editorial"] .entry .byline a:hover{text-decoration:underline;text-underline-offset:3px} }
[data-skin="editorial"] .entry figure{margin:18px 0 0}
[data-skin="editorial"] .entry .media{border-radius:var(--r12);aspect-ratio:16/9}
[data-skin="editorial"] .entry figcaption{margin-top:7px;font-size:12px;color:var(--fg2)}
[data-skin="editorial"] .block{
  margin-top:18px;border:1px solid var(--line);border-radius:var(--r12);
  background:var(--surface);overflow:hidden;
}
[data-skin="editorial"] .block-bar{
  display:flex;align-items:center;gap:8px;padding:7px 8px 7px 13px;
  border-bottom:1px solid var(--hairline);background:var(--muted);
  font-size:12px;color:var(--fg2);font-variant-numeric:tabular-nums;
}
[data-skin="editorial"] .block-bar .sp{margin-left:auto}
[data-skin="editorial"] .block .ptxt{padding:13px 15px;max-height:300px;overflow:auto}
[data-skin="editorial"] .block[data-open] .ptxt{max-height:none}
[data-skin="editorial"] .block .fade{
  position:relative;margin-top:-42px;height:42px;
  background:linear-gradient(to top,var(--surface),transparent);pointer-events:none;
}
[data-skin="editorial"] .block[data-open] .fade{display:none}
[data-skin="editorial"] .entry .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
[data-skin="editorial"] .entry .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* L4 editorial: long-form article */
[data-skin="editorial"] .article h2{
  font-size:24px;letter-spacing:-.025em;font-weight:600;margin:44px 0 12px;
  scroll-margin-top:76px;
}
[data-skin="editorial"] .steps{display:grid;gap:2px;counter-reset:st;margin-top:6px}
[data-skin="editorial"] .steps li{
  counter-increment:st;display:grid;grid-template-columns:30px 1fr;gap:12px;
  padding:14px 0;border-top:1px solid var(--hairline);
}
[data-skin="editorial"] .steps li::before{
  content:counter(st,decimal-leading-zero);font-family:var(--mono);font-size:12px;color:var(--faint)}
[data-skin="editorial"] .steps b{display:block;font-weight:600;font-size:15px}
[data-skin="editorial"] .steps p{color:var(--fg2);font-size:13.5px;margin-top:3px}
[data-skin="editorial"] .kvtable{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
[data-skin="editorial"] .kvtable th{
  text-align:left;font-weight:400;color:var(--fg2);width:120px;
  padding:10px 12px 10px 0;border-top:1px solid var(--hairline);vertical-align:top;
}
[data-skin="editorial"] .kvtable td{padding:10px 0;border-top:1px solid var(--hairline);
  font-variant-numeric:tabular-nums}

/* ================================================================
   SKIN D — WORKBENCH   axis: the prompt is an editable template
   Slots are first-class. Browse = pick a template. Detail = fill it.
   ================================================================ */
[data-skin="workbench"] .slotbar{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px;margin-top:18px;
  border:1px solid var(--line);border-radius:var(--r12);background:var(--surface);
}
[data-skin="workbench"] .slotbar .lbl{font-size:12.5px;color:var(--fg2)}
[data-skin="workbench"] .slotbar .sp{margin-left:auto}

[data-skin="workbench"] .tgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(316px,1fr));margin-top:18px}
[data-skin="workbench"] .tcard{
  display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r12);
  background:var(--surface);overflow:hidden;
  transition:box-shadow var(--t-reg) var(--e-out),border-color var(--t-reg) var(--e-out);
}
@media (hover:hover){ [data-skin="workbench"] .tcard:hover{box-shadow:var(--sh-med)} }
[data-skin="workbench"] .tcard .top{display:flex;gap:12px;padding:12px}

[data-skin="workbench"] .tcard .t{
  font-size:14px;line-height:1.4;font-weight:600;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
[data-skin="workbench"] .tcard .sub{margin-top:4px;font-size:12px;color:var(--fg2);
  font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:4px 10px}
[data-skin="workbench"] .slots{
  padding:0 12px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
}
[data-skin="workbench"] .slots .cap{font-size:11.5px;color:var(--fg2);width:100%;
  display:flex;align-items:center;gap:6px;margin-bottom:1px}
[data-skin="workbench"] .slot{
  display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:0 10px;
  border-radius:var(--r6);border:1px dashed var(--brand);
  background:color-mix(in oklch,var(--brand) 10%,transparent);
  color:var(--brand);font-family:var(--mono);font-size:12px;font-weight:600;cursor:pointer;
  transition:background-color var(--t-quick) var(--e-out),box-shadow var(--t-quick) var(--e-out);
}
@media (hover:hover){ [data-skin="workbench"] .slot:hover{background:color-mix(in oklch,var(--brand) 18%,transparent)} }
[data-skin="workbench"] .slot:active{transform:scale(.97)}
[data-skin="workbench"] .slot[data-filled]{
  border-style:solid;background:color-mix(in oklch,var(--brand) 16%,transparent);
}
[data-skin="workbench"] .slot .cyc{font-size:10px;opacity:.65}
[data-skin="workbench"] .tfoot{
  margin-top:auto;display:flex;gap:8px;align-items:center;padding:10px 12px;
  border-top:1px solid var(--hairline);background:var(--muted);
}
[data-skin="workbench"] .tfoot .sp{margin-left:auto}
[data-skin="workbench"] .tfoot .n{font-size:11.5px;color:var(--fg2);font-variant-numeric:tabular-nums}
[data-skin="workbench"] .tcard--plain .slots .cap{color:var(--faint)}

/* the bench itself (L4) */
[data-skin="workbench"] .bench{
  display:grid;gap:20px;grid-template-columns:340px minmax(0,1fr);align-items:start;padding:22px 0 8px;
}
@media (max-width:900px){ [data-skin="workbench"] .bench{grid-template-columns:minmax(0,1fr)} }
[data-skin="workbench"] .form{
  position:sticky;top:76px;border:1px solid var(--line);border-radius:var(--r12);
  background:var(--surface);padding:16px;display:grid;gap:16px;
}
@media (max-width:900px){ [data-skin="workbench"] .form{position:static} }
[data-skin="workbench"] .form h2{font-size:15px;font-weight:600}
[data-skin="workbench"] .form .fh{font-size:12.5px;color:var(--fg2)}
[data-skin="workbench"] .fgroup{display:grid;gap:7px}

  background:var(--canvas);color:var(--fg);font:inherit;font-size:16px;width:100%;
  transition:border-color var(--t-quick) var(--e-out),box-shadow var(--t-quick) var(--e-out);
}

  box-shadow:0 0 0 3px color-mix(in oklch,var(--focus) 22%,transparent)}
[data-skin="workbench"] .presets{display:flex;flex-wrap:wrap;gap:5px}
[data-skin="workbench"] .presets .chip{min-height:28px;padding:0 9px;font-size:12px}
[data-skin="workbench"] .presets .chip::before{inset:-8px}

[data-skin="workbench"] .out{border:1px solid var(--line);border-radius:var(--r12);
  background:var(--surface);overflow:hidden}
[data-skin="workbench"] .out-bar{
  display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;
  border-bottom:1px solid var(--hairline);background:var(--muted);
  font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums;
  position:sticky;top:56px;z-index:2;
}

/* ================================================================
   HIT AREAS — visual size stays, the target grows.
   Every pseudo-element expansion is sized under the container gap so
   two adjacent targets meet but never overlap. Desktop floor ~40,
   coarse-pointer floor 44. (The one deliberate overlap is a tile's
   overlay copy button sitting on the tile link — it is layered above
   and wins the hit test, and it moves out of the way on touch.)
   ================================================================ */
.btn--sm,
.sec-head .more,
.activefilters .clear,
[data-skin="workbench"] .slot,
[data-skin="console"] .rail button { position:relative }

.btn--sm::before,
.sec-head .more::before,
.activefilters .clear::before,
[data-skin="workbench"] .slot::before { content:"";position:absolute;inset:-4px }

.crumbs a,
[data-skin="workbench"] .tfoot .n { display:inline-flex;align-items:center;min-height:36px }
[data-skin="workbench"] .tcard .t { display:inline-flex;align-items:flex-start;min-height:38px }
[data-skin="gallery"] .tile--text .t { display:inline-block;padding:2px 0 }
.foot li a { min-height:36px }
.sortsel { min-height:40px }
[data-skin="console"] .rail button { min-height:36px }
[data-skin="editorial"] .toc a { min-height:36px }

@media (pointer:coarse){
  /* grow the box itself rather than the pseudo-element: 12px of expansion
     would start colliding with 8px-gap neighbours */
  .btn--sm{min-height:40px;padding:0 12px}
  .btn--sm::before{inset:-2px}
  [data-skin="workbench"] .slot{min-height:40px}
  [data-skin="workbench"] .slot::before{inset:-2px}
  .sec-head .more,
  .field input,
  .sortsel,
  .pager a,.pager span,
  [data-skin="editorial"] .toc a{min-height:44px}
  .foot li a,
  .crumbs a,
  [data-skin="console"] .rail button,
  [data-skin="workbench"] .tfoot .n{min-height:40px}
  [data-skin="workbench"] .tcard .t{min-height:44px}
}

rUnreal' in backdrop on wall.”,\n    “atmosphere”: “Relaxed, intimate, contemporary with a strong pop of color.”\n  },\n  “subject”: {\n    “gender”: “female”,\n    “name”: “Anya Taylor-Joy ”,\n    “body”: {\n      “type”: “Realistic, naturally proportioned figure with clean, well-moisturized skin. The forearms are completely clean, with no tattoos on either arm.”,\n“nails”: {\n        “description”: “All fingernails and toenails are meticulously painted with a glossy red nail polish.”\n      }\n    },\n    “face”: {\n      “features”: “Medium blonde hair, natural makeup, confident and approachable smile, gazing directly at the camera.”,\n      “expression”: “Warm and poised.”\n    },\n    “outfit”: {\n      “description”: “Orange crop top and matching neon yellow ribbed cotton leggings.”,\n      “fit”: “Casually fitted, modern.”\n    },\n    “accessories”: {\n      “details”: “The silver beaded bracelet on her left wrist, the single silver ring on her left index finger, and the delicate gold chain necklace are all present.”\n    },\n“pose”: “Seated cross-legged on a red sofa, viewed from a low and close perspective. Her right leg is tucked, with the large bare foot tattoed with a snake tattoo on it in the immediate foreground, followed by the left foot. Both feet have red-painted toenails. Her left hand, with yellow-painted fingernails, is resting on sofa. Her right hand rests near her right knee.”\n  },\n  “composition”: “Close-up, low-angle shot focused sharply on the bare feet and the subject’s face. The white sofa and pink neon lights are prominent visual elements, with the background elements softly blurred, but the text remains visible. The perspective makes the feet very large and detailed, highlighting the red nail polish on both hands and feet.”\n}","media":"https://pbs.twimg.com/media/HDO3Kb_XUAAs9jz.jpg?name=small","mediaAlt":"photo from the source post","mediaBadge":"PHOTO · ×3","author":"KeorUnreal","likes":610,"bookmarks":442,"hot":true,"date":"","srcUrl":"https://x.com/KeorUnreal/status/2032169264963338327","mediaType":"image"},{"id":"2018792341192990900","models":["Nano Banana Pro"],"useCases":["Food & beverage"],"techniques":["Camera / shot language"],"styles":["Photorealistic","Cinematic"],"subjects":["Person / portrait","Architecture / interior"],"slug":"prompt-description-ultra-photorealistic-cand-2018792341192990900","title":"{ \"prompt_description\": \"Ultra Photorealistic Candid Portrait of a…","text":"{\n  \"prompt_description\": \"Ultra Photorealistic Candid Portrait of a Superhero\",\n  \"subject\": {\n    \"appearance\": \"Young woman with shoulder-length red hair pulled back, fair skin, light freckles.\",\n    \"expression\": \"Playful, pursed lips in a 'kissy face' or 'duck face' expression, looking directly at the camera.\",\n    \"likeness\": \"Resembles actress Sadie Sink.\"\n  },\n  \"outfit\": {\n    \"garment\": \"Full-body Spider-Man superhero suit.\",\n    \"colors\": \"Classic vibrant red and deep blue.\",\n    \"texture\": \"High-quality textured spandex/mesh material with visible fabric grain.\",\n    \"details\": \"Black web pattern overlays, spider emblem on the chest, realistic fabric folds around the joints.\"\n  },\n  \"pose\": {\n    \"stance\": \"Standing upright, casual posture.\",\n    \"hands\": \"Right hand holding a white disposable coffee cup with a cardboard sleeve near the chest. Left hand raised making a peace (V) sign.\",\n    \"mood\": \"Candid, 'off-duty', fun, casual, confident.\"\n  },\n  \"environment\": {\n    \"location\": \"New York City street during the day.\",\n    \"background\": \"Red brick apartment buildings with black fire escapes, typical NYC architecture.\",\n    \"surroundings\": \"Concrete sidewalk, blurred pedestrians in winter coats walking in the background.\",\n    \"depth\": \"Background is out of focus (bokeh) to emphasize the subject.\"\n  },\n  \"lighting\": {\n    \"type\": \"Natural daylight.\",\n    \"quality\": \"Soft, diffused, overcast sky lighting.\",\n    \"effect\": \"Even illumination on the face, no harsh shadows, realistic reflections on the suit's texture.\"\n  },\n  \"camera_settings\": {\n    \"style\": \"Cinematic street photography.\",\n    \"lens\": \"85mm portrait lens.\",\n    \"aperture\": \"f/1.8 (shallow depth of field).\",\n    \"resolution\": \"8K, ultra-detailed.\",\n    \"focus\": \"Sharp focus on the subject's face and suit texture.\"\n  },\n  \"tech_specs\": {\n    \"engine_style\": \"Unreal Engine 5 render style, ray tracing.\",\n    \"quality_tags\": \"Ultra photorealistic, hyper-realistic, highly detailed skin texture, raw photo, HDR.\"\n  }\n}","media":"https://pbs.twimg.com/media/HAQw7YJXgAA4GIV.jpg?name=small","mediaAlt":"photo from the source post","mediaBadge":"PHOTO · ×3","author":"KeorUnreal","likes":603,"bookmarks":358,"hot":true,"date":"","srcUrl":"https://x.com/KeorUnreal/status/2018792341192990900","mediaType":"image"},{"id":"2083168602363150527","slug":"2083168602363150527","title":"SCENE A day in New York shot entirely by the subject herself: wa…","text":"SCENE A day in New York shot entirely by the subject herself: waking in her hotel suite, coffee, getting ready, out into the city, back to the room at night. ACTIVE REFERENCES @ image1 — the hotel suite. Curved cove ceiling with warm LED coving, deep red carpet, cream walls, two black organic sculptures above a light wood headboard, white bedding with red pillows, twin bedside lamps, pale sofa, oval coffee table, sheer curtains, dark door. @ image2 — the subject. Young woman, shoulder-length wavy blonde hair with curtain bangs and highlights, light freckles, thin gold necklace, silver ring, dark brown off-the-shoulder knit with white diamond-stripe pattern. 100% matches the reference. CAMERA OWNERSHIP LOCK Only two positions exist. HELD: arm extended, camera 0.4-0.7m from her face, visible arm tension, tilt and step-bounce. PROPPED: camera on a surface she placed it on, crooked and fixed, with her moving in and out of frame. No operator shots, no tracking, nothing she could not have filmed alone. FORMAT Eight shots, 30s, seven HARD CUTS, no fades. Real-time. 0-4s SHOT 1 — PROPPED, morning room. 84° diagonal field of view, camera on the sideboard 3m from the bed at 1.1m, static and tilted. The suite matches @ image1: cove light on, curtains half open, cool daylight across the red carpet. @ image2 visible at 0.0s, sitting up on the bed edge x66 y58. No empty frame. She rubs her face and croaks at the running camera: \"It's seven. In New York. Why am I awake.\" Stands, walks out screen-right. HARD CUT. 4-7s SHOT 2 — HELD, window light. 84°, arm's length 0.5m, above eye line. She is x50 y42 at the sheer curtain screen-left, cool daylight on the near side of her face, cove warmth behind. She pulls the curtain, squints at the street below, then into the lens: \"Okay. It's actually happening.\" Arm wobble throughout. HARD CUT. 7-11s SHOT 3 — PROPPED, coffee. 47°, camera on the oval coffee table 0.8m away, low, looking up past a cup. She sits into frame at x55 y45, pours, tastes, pulls a face at the running camera: \"Hotel coffee. We'll fix that outside.\" Steam bends in the light. HARD CUT. 11-15s SHOT 4 — HELD, mirror. 47°, camera at chest height reflected in the suite mirror. She is x45 y50 in the reflection, camera visible in her hand, working through her hair with the other. Bed and sculptures behind. At 13s: \"This is as good as it gets. Let's go.\" HARD CUT. 15-18s SHOT 5 — HELD, leaving. 107° wide rectilinear, camera held low at waist height, turned forward. She crosses the red carpet to the door at x55, lens swinging with her stride. She opens it and corridor light floods the frame. Off-frame, breathy: \"Downtown first.\" HARD CUT. 18-22s SHOT 6 — PROPPED, street. 47°, camera on a stoop rail 3m away, static, crooked. A New York block behind her — brownstone steps, fire escapes, yellow cabs, steam from a vent. She walks in from screen-left at 18.5s, stands at x60 y50, spreads her arms: \"Look at this street.\" Then walks to the lens and takes it at 21.5s. Passers-by cross the foreground. HARD CUT. 22-26s SHOT 7 — PROPPED, diner. 84° wide, camera on the counter behind a plate, 0.7m from her, looking up. She is x55 y38, sits into frame, takes a bite, eyes widen, mouth full: \"Okay, that's the one.\" Laughs, keeps eating. HARD CUT. 26-30s SHOT 8 — HELD, night, back in the room. 84°, arm's length 0.5m, held above her. She lies back across the white bedding at x50 y55, hair spread, in the brown knit again. Bedside lamps and cove light are the only sources, windows black with city glow. Into the lens: \"Twenty thousand steps. Everything hurts.\" Softer: \"Same time tomorrow.\" Wave, the frame tilts as she lowers the camera. 30.0s black. SPEECH Only the quoted lines are spoken, at the timings given, all in her voice. Lips still at all other times. No voiceover, no second speaker, no offscreen voices. Delivery is casual, unrehearsed, mid-breath, sometimes trailing off. Volume rises over street noise in Shot 6, near-whisper in Shot 8. CONTINUITY The suite matches @ image1 in both interior sequences — same carpet, sculptures, headboard, sofa, lamps. Hair, necklace and ring identical throughout. PHYSICS Loose knit slides on the shoulder with every arm movement. Wavy hair lags a frame behind head turns. Bedding creases under her weight. Step energy visible in every HELD frame. LIGHTING Shots 1-4: cool daylight from the curtains screen-left as key, warm cove LED as fill, red carpet bouncing warmth into the shadows. Shot 5: corridor light through the doorway. Shots 6-7: hard street daylight, warm diner practicals. Shot 8: lamps and cove light only. AUDIO Diegetic only, from the same camera — room tone, footsteps, door, traffic, sirens, steam vents, diner clatter, wind. Ambience ducks under her lines. No music. LOCKS Photoreal live action, 4K detail, fine grain, warm consumer-camera colour, mild rolling shutter and auto-exposure hunting. She is the only person who speaks; background figures anonymous and unfocused. No subtitles.","media":"https://pbs.twimg.com/amplify_video_thumb/2083165874983424000/img/L7v_JTJr0f72f2Z_.jpg?name=small","mediaAlt":"来源帖媒体（video）","mediaBadge":"视频 29s","author":"higgsfield_ai","date":"2026-07-31","likes":589,"bookmarks":457,"hot":true,"models":["Seedance","Higgsfield Soul"],"useCases":["Food & beverage"],"techniques":["Camera movement","Multi-shot / storyboard","Lip sync / dialogue"],"styles":["Photorealistic"],"subjects":[],"srcUrl":"https://x.com/higgsfield_ai/status/2083168602363150527","mediaType":"video"},{"id":"2078814921756754352","slug":"2078814921756754352","title":"A cinematic 15-second music video shot in a dark modern dance st…","text":"A cinematic 15-second music video shot in a dark modern dance studio with smooth grey reflective floor, black walls and horizontal neon light tubes. Continuous dynamic camera movement, mostly medium shots and close-ups, never too wide. The woman is constantly moving, no freezes or static poses.\nMain subject: young woman with messy medium-length wavy brown hair with bangs partially covering her face, freckles on nose and cheeks, blue-grey eyes, full glossy lips. She wears a tight black fishnet bodysuit. She is singing the entire time with clear, precise lip-sync, mouth actively moving, intense emotional expression.\nLyrics: \"Ye! Ye! You keep a box of names / In the drawer by your bed / Polaroids and ticket stubs / Stuffed under the red / You never take one thing / You take the whole last spark / Leave a little thumbprint / On every private heart\".\n0-2s: Tight medium close-up. She leans her upper body back, head tilting, singing passionately with strong lip-sync, hair falling over her face, body arching, one hand sliding across her chest.\n2-4s: Camera slowly pushes in and circles. She comes out of the deep arch, torso still bent forward, hands on her thighs, lifting her head and looking straight into camera while singing with aggressive lip-sync. Three male dancers of different appearances (different ethnicities, hair styles and builds) wearing black tank tops and black wide pants are already close around her, moving with her in low tense postures. The other two men are visible at the edges of the frame, approaching.\n4-7s: Medium close-up. She drops lower, body still in constant motion, hair swinging, singing intensely with clear mouth movements, sharp head turns, eyes locked on camera. Male dancers stay close, their hands lightly touching her as they move together.\n8-12s: Medium shot with slow camera drift. Exactly five male dancers of completely different appearances, all wearing black tank tops and black wide pants, surround her tightly on the floor in a dense, intertwined formation. She is in the center, body still moving, upper body rising and shifting, singing with strong lip-sync. All five men move subtly with her, never static. The men never fully obscure her body.\n13-15s: Dynamic medium shot. The five diverse male dancers lift her into the air in a powerful deep backbend. Her body is fully extended and arched, head thrown back, still singing with clear lip-sync. While holding her they gently rock her up and down in time with the beat. The camera starts from a clear side view of her arched body and smoothly transitions to a frontal view of her face. At the end they lower her smoothly onto her feet; she lands and immediately continues singing as the five men stay low on the floor around her. The men never fully obscure her.\nHigh fashion dance energy, sweaty skin, sharp timing, continuous fluid motion of the woman, priority on accurate lip-sync in every frame.\nRules: no hand morphing, no body distortions, clean stable anatomy, fingers and hands remain consistent and natural throughout the entire video.\n\n#AIvideo #AIMusicVideo #AIFilmmaking","media":"https://pbs.twimg.com/amplify_video_thumb/2078813993645273089/img/4nQRj3B5LpuYV0XW.jpg?name=small","mediaAlt":"来源帖媒体（video）","mediaBadge":"视频 15s","author":"Kiber_Alla","date":"2026-07-19","likes":562,"bookmarks":671,"hot":true,"models":["Seedance"],"useCases":["Fashion"],"techniques":["Camera movement","Lip sync / dialogue"],"styles":["Cinematic"],"subjects":[],"srcUrl":"https://x.com/Kiber_Alla/status/2078814921756754352","mediaType":"video"},{"id":"2027628259467313402","models":["Nano Banana 2"],"useCases":[],"techniques":["Camera / shot language"],"styles":["Photorealistic","Cinematic"],"subjects":["Person / portrait"],"slug":"use-the-uploaded-picture-as-a-reference-stri-2027628259467313402","title":"Use the uploaded picture as a reference (Strict identity lock, the face…","text":"Use the uploaded picture as a reference (Strict identity lock, the face must match the attached reference photo exactly, preserving facial structure, skin tone, expression, and hairstyle (same haircut and hair texture) to create an ultra-realistic cinematic double exposure portrait of me in a clean left-facing side profile, sharp jawline and natural facial structure clearly defined.\nThe outer silhouette is dark and well-contoured against a soft warm beige sunset background. Inside the silhouette, seamlessly blend a dramatic urban street scene at golden hour: a lone me walking forward in the center of an empty destroyed city road, symmetrical perspective lines, damaged buildings on both sides, broken debris scattered along sidewalks, electric poles and cables stretching into the distance.\nThe sun positioned directly at the horizon behind the walking figure, creating strong backlight glow and long stretched shadow toward the camera.\nWarm orange sunlight flooding through the internal city scene, high contrast, cinematic depth, realistic textures, smooth blending edges between portrait and environment.\nMoody yet hopeful atmosphere, 8K resolution, sharp detail, soft vignette. size 4 5 image generate.","media":"https://pbs.twimg.com/media/HCOVJ5QWUAA1DNU.jpg?name=small","mediaAlt":"photo from the source post","mediaBadge":"PHOTO","author":"HaniaAi12","likes":535,"bookmarks":361,"hot":true,"date":"","srcUrl":"https://x.com/HaniaAi12/status/2027628259467313402","mediaType":"image"},{"id":"2084387316286595436","slug":"2084387316286595436","title":"The Office (US) mockumentary style","text":"The Office (US) mockumentary style. Dunder Mifflin conference room,\nmid-afternoon, harsh fluorescent lighting, cheap office chairs,\nwhiteboard at the front. Handheld documentary camera, slightly\nunsteady, with sudden reframes and quick zooms toward whoever is\nreacting.\n\nMichael Scott stands at the whiteboard, overly excited, marker in\nhand, badly drawn diagram behind him. The staff sit around the table\nlooking exhausted. Stanley Hudson sits at the far end, glasses on,\nhead down over a folded crossword puzzle, completely disengaged.\n\nDIALOGUE:\n\nMICHAEL (loud, proud): \"Okay everybody, listen up. Large language\nmodels. L-L-Ms. This is the future of the paper industry.\"\n\nBeat. Nobody reacts. Camera pushes in slowly on Stanley — he does not\nlook up, does not blink, keeps filling in his crossword.\n\nMICHAEL: \"Which is why corporate is giving a bonus to whoever—\"\n\nInstant snap zoom to Stanley. His head lifts. He takes off his\nglasses. Dead serious.\n\nSTANLEY: \"I'm listening.\"\n\nMICHAEL (waving him off): \"—anyway. Moving on. Next topic. Prompt\nengineering.\"\n\nSnap zoom back to Stanley. He immediately puts his glasses back on,\nlowers his head, and returns to the crossword as if nothing happened.\n\nCut to Jim, who slowly turns his head and looks directly into the\ncamera lens with a flat, knowing expression. Hold for two seconds.\n\nSTYLE: single-camera sitcom shot like a documentary crew is present,\nnatural performances, no laugh track, muted office color palette,\nslightly soft consumer-camera look, characters occasionally glancing\nat the lens.","media":"https://pbs.twimg.com/amplify_video_thumb/2084387230844346368/img/3q3PrcBYVZsGJ3lW.jpg?name=small","mediaAlt":"来源帖媒体（video）","mediaBadge":"视频 15s","author":"Arminn_Ai","date":"2026-08-03","likes":446,"bookmarks":383,"hot":true,"models":[],"useCases":[],"techniques":["Camera movement","Lip sync / dialogue"],"styles":[],"subjects":[],"srcUrl":"https://x.com/Arminn_Ai/status/2084387316286595436","mediaType":"video"},{"id":"2088866007918268515","slug":"2088866007918268515","title":"30-SECOND CINEMATIC SHORT Create a 30-second cinematic sequence…","text":"30-SECOND CINEMATIC SHORT\nCreate a 30-second cinematic sequence with the visual discipline of a major feature film. The world is entirely made from paper, cardboard, ink, and delicate handcrafted materials.\n00:00–00:05 — THE FIRST FOLD\nBegin with an extreme macro shot of a blank sheet of textured paper.\nA single fold slowly forms across its surface.\nLens: 100mm macro\nCamera: Completely static\nSoft daylight moves across the paper as the fold continues.\nCut precisely as the paper reaches its final shape.\n00:05–00:11 — THE CITY EMERGES\nTransition into a 50mm shot.\nThe folded paper begins forming miniature streets and architectural structures.\nBuildings rise naturally from the surface through carefully constructed paper folds.\nThe camera slowly tracks sideways.\nTiny windows catch the light.\nNothing feels computer-generated; every surface should have believable paper fibers, folds, shadows, and imperfections.\n00:11–00:17 — THE REVEAL\nMove into a 35mm shot.\nThe camera pulls backward.\nThe small arrangement is revealed as an enormous handcrafted paper city stretching across a large table.\nRoads connect different districts.\nBridges cross miniature rivers.\nPaper trees move gently from an unseen breeze.\n00:17–00:23 — MORNING\nTransition into a slow overhead crane shot.\nWarm sunlight gradually spreads across the paper city.\nShadows from the buildings become longer and more defined.\nTiny paper windows begin reflecting the sunlight.\nThe camera continues rising, revealing the geometric relationship between the streets and buildings.\n00:23–00:27 — THE DETAIL\nCut to an 85mm close-up.\nFocus on a tiny paper clock mounted on one building.\nThe clock moves forward by one minute.\nRack focus from the clock to the miniature skyline behind it.\n00:27–00:30 — FINAL IMAGE\nReturn to an extreme wide shot.\nThe entire paper city sits beneath a large studio window.\nThe morning light completely fills the miniature world.\nCamera slowly pulls backward until the city becomes a small object within the larger room.\nFade to black.\nCINEMATOGRAPHY\nLarge-format feature-film aesthetic.\n100mm macro for texture.\n85mm for detail.\n50mm for natural perspective.\n35mm for environmental shots.\nControlled dolly and crane movements.\nRealistic depth of field.\nNatural focus transitions.\nSoft motion blur.\nSubtle lens imperfections.\nNo artificial camera shake.\nMATERIAL DIRECTION\nEvery surface must visibly behave like physical paper.\nVisible paper fibers.\nNatural folds.\nTiny imperfections.\nSoft cardboard edges.\nRealistic contact shadows.\nBelievable paper thickness.\nNatural material deformation.\nLIGHTING\nSoft morning daylight.\nLarge window as the primary source.\nNatural bounce light.\nGentle shadows.\nSubtle warm highlights.\nNo artificial neon effects.\nNo excessive visual effects.\nCONTINUITY\nThe same paper city throughout the entire sequence.\nBuildings maintain identical shapes and positions.\nRoads remain connected.\nPaper materials remain consistent.\nNo random transformations.\nNo flickering.\nNo duplicated structures.\nNo sudden environmental changes.\nDIRECTOR’S NOTE\nTreat this as a miniature feature film, not a visual-effects demonstration.\nThe camera should discover the world gradually.\nStart intimate.\nReveal scale.\nReturn to detail.\nFinish wide.\nThe audience should feel that they are watching a real handcrafted world photographed with a cinema camera.\nPhotorealistic 4K • tactile materials • feature-film cinematography • sophisticated lighting • realistic miniature photography • cinematic depth • precise camera movement • seamless visual continuity.","media":"https://pbs.twimg.com/amplify_video_thumb/2088865943921528832/img/ACj33PYyBD5RI7qH.jpg?name=small","mediaAlt":"来源帖媒体（video）","mediaBadge":"视频 30s","author":"ChillaiKalan__","date":"2026-08-16","likes":407,"bookmarks":409,"hot":true,"models":["Seedance","GPT Image"],"useCases":[],"techniques":["Camera movement","Transition / morph"],"styles":["Cinematic","Photorealistic"],"subjects":[],"srcUrl":"https://x.com/ChillaiKalan__/status/2088866007918268515","mediaType":"video"},{"id":"2060203818785370400","slug":"design-a-hyper-realistic-fifa-2026-football--2060203818785370400","title":"Design a hyper-realistic FIFA 2026 football poster inspired by p…","text":"Design a hyper-realistic FIFA 2026 football poster inspired by premium sports editorial photography and minimalist World Cup branding.\n\nCreate a centered composition of a football player sitting confidently on a geometric block inside a clean studio-style environment. The player faces forward with elbows resting on knees and hands clasped naturally, giving a calm, focused, determined expression toward the camera.\n\nTEAM CUSTOMIZATION:\nAutomatically adapt the entire design to Portugal colors, flag accents, and national football identity.\nUse official-inspired jersey colors, sock stripes, typography accents, and subtle national design motifs throughout the poster.\n\nPLAYER DETAILS:\n- Jersey Number: 7\n- Team Name: Portugal\n- Player Name: Sarah\n- Official-inspired modern football kit with realistic fabric texture\n- Matching socks, boots, captain armband if needed\n- Natural athletic body proportions\n- Ultra-realistic skin texture and facial detail\n\nLAYOUT & COMPOSITION:\n- Large oversized transparent player number placed behind the player vertically\n- Matching number integrated beneath the seat/platform\n- Minimal geometric graphic lines and thin UI-inspired football design elements around composition\n- Small national flag accents on sides\n- FIFA World Cup 2026 badge/logo placement in upper corner\n- Balanced negative space with ultra-clean layout\n\nCOLOR DIRECTION:\nUse the exact national team palette throughout:\n- Brazil → yellow, green, blue\n- Argentina → sky blue, white, silver\n- Portugal → deep red, green\n- France → navy blue, white, red\n- Japan → blue, white\n- Morocco → red, green\netc.\n\nLIGHTING:\nSoft cinematic studio lighting, subtle rim light, realistic shadows, premium sports-poster contrast, slightly desaturated editorial tones.\n\nSTYLE:\nmodern FIFA World Cup campaign aesthetic, Nike/Adidas football editorial, cinematic athlete portrait, ultra-clean sports branding, realistic football photography.\n\nTEXTURES:\nrealistic jersey fabric, soft paper grain, stadium-inspired haze, glossy lighting reflections, subtle vintage print texture.\n\nOUTPUT:\n4:5 vertical composition, ultra-realistic sports campaign poster, minimalist luxury football aesthetic, clean beige/off-white background, no clutter.","media":"https://pbs.twimg.com/media/HJdQdAobUAA0Naq.jpg?name=small","mediaAlt":"来源帖媒体（photo）","mediaBadge":"图片","author":"AIwithSarah_","date":"2026-05-29","likes":385,"bookmarks":314,"hot":true,"models":["GPT Image","GPT Image 2"],"useCases":["Fashion","Advertising","Web & motion"],"techniques":["Camera movement","Camera / shot language"],"styles":["Cinematic","Photorealistic","Retro / vintage","Luxury"],"subjects":["Person / portrait"],"srcUrl":"https://x.com/AIwithSarah_/status/2060203818785370400","mediaType":"image"},{"id":"2047862141894681076","slug":"2047862141894681076","title":"A realistic young woman sitting casually in a softly lit bedroom…","text":"A realistic young woman sitting casually in a softly lit bedroom during late afternoon.\n\nShe is holding her phone very close to her face as if recording a private video or voice note.\n\nFraming is tight and slightly imperfect.\n\nExpression: thoughtful, slightly shy, natural.\n\nMinimal makeup, natural skin texture, relaxed clothing.\n\nLighting: warm natural light fading from a window, soft shadows.\n\nEnvironment: simple bedroom, calm and lived-in.\n\nStyle: ultra-realistic, looks like a real phone recording, slightly grainy, not cinematic.","media":"https://pbs.twimg.com/media/HGt3trjbwAA7Bkt.jpg?name=small","mediaAlt":"来源帖媒体（photo）","mediaBadge":"图片 ×2","author":"ChillaiKalan__","date":"2026-04-25","likes":316,"bookmarks":293,"hot":true,"models":["Seedance","GPT Image"],"useCases":["Beauty"],"techniques":[],"styles":["Cinematic","Photorealistic"],"subjects":[],"srcUrl":"https://x.com/ChillaiKalan__/status/2047862141894681076","mediaType":"image"},{"id":"2051559171452215583","models":["Nano Banana Pro"],"useCases":["Beauty"],"techniques":["Camera / shot language"],"styles":["Photorealistic","Anime / illustrated"],"subjects":["Architecture / interior"],"slug":"photorealistic-3-4-image-2051559171452215583","title":"Photorealistic 3:4 image","text":"Photorealistic 3:4 image.\nSHOOTING: natural smartphone photo, slight imperfection in framing, feeling of a candid captured moment. Soft focus with emphasis on the eyes, but without excessive sharpness. Noise/grain like an iPhone 5.\n\nSCENE: classic close-range selfie pose; head slightly tilted toward the right shoulder, torso slightly turned; right arm extended toward the camera, creating a diagonal composition; gaze directed straight into the lens, creating a direct and alluring connection. Neck slightly extended forward toward the camera.\n\nAPPEARANCE: fair skin, neat eyebrows, dark brown eyes. Expressive eye and lip makeup: long winged eyeliner extended toward the temples. Cluster false lashes creating a “spiky” anime (manga lashes) effect. Bright highlighter in the inner corners of the eyes. Full lips with dusty pink matte lipstick topped with gloss. Lip contour slightly blurred and slightly overlined (kissed lips effect). Subtle natural highlighter on cheekbones and nose bridge. Hair below the waist, thick, flowing forward framing the face, healthy shine with natural texture and visible fine strands.\n\nOUTFIT: fitted basic black top made of ribbed knit fabric with thin vertical texture; deep U-shaped neckline emphasizing a fuller bust; thin straps. On the neck, a delicate gold chain with a refined pendant featuring a transparent pink stone in a setting. Hair slightly messy and natural, with fine strands falling casually over the forehead and face.\n\nANGLE: top-down angle (from the perspective of the extended arm).\n\nBACKGROUND: minimalist interior filled with sunset light; on the left — a plain wall appearing bright yellow or orange due to lighting, with sharp graphic shadows from blinds or window frames; on the right — a dark doorway creating strong contrast with the lit side.\n\nLIGHTING: golden hour lighting, very warm, directional, and contrasty; bright sunlight illuminating the left side of the face and shoulder, creating long soft shadows and enhancing facial features and body contours.\n\nATMOSPHERE: warm, aesthetic, and captivating; conveys a carefree summer evening mood, confidence, and modern social media visual culture.\n\nQUALITY: high quality, high texture detail, 8K resolution.","media":"https://pbs.twimg.com/media/HHiaL2FbsAAImQ3.jpg?name=small","mediaAlt":"photo from the source post","mediaBadge":"PHOTO","author":"AIWithRay","likes":305,"bookmarks":241,"hot":true,"date":"","srcUrl":"https://x.com/AIWithRay/status/2051559171452215583","mediaType":"image"},{"id":"2008952931484098637","slug":"concept-2008952931484098637","title":"Concept: A hyper-realistic 3D isometric view of a [INSERT LOCATI…","text":"Concept: A hyper-realistic 3D isometric view of a [INSERT LOCATION] scene on a circular base.\nSubject (Visuals): A full-body, realistic human [INSERT DESCRIPTION].\n* Texture Rule: The subject must have \"Living Human Skin\" texture (subsurface scattering, pores, natural imperfections).\n* Important: He is NOT a toy/doll. He looks like a real person inserted into the scene.\n* Pose: [INSERT POSE, e.g., Sitting naturally].\n\nComposition & Scale (Crucial):\n* Camera: Isometric wide shot (Full view). ensure the entire circular base, the subject, and all props are visible within the frame.\n* Proportions: PERFECT RELATIVE SCALE. The props (e.g., scooter, table etc.) must be the correct size relative to the human. Do not make the human giant or the props tiny.\n\nEnvironment: A realistic section of a [INSERT WALL/BUILDING] behind the subject.\n* Material: Real weathered textures (brick, cement, wood), not painted model textures.\n\nProps:\n* [INSERT PROP 1, e.g., Vintage Vespa] (Real metal and chrome texture).\n* [INSERT PROP 2, e.g., Pizza and Wine] (Real food texture).\n* *Note:* Ensure all props are present and grounded on the base.\n\nTechnical Specs: Unreal Engine 5 render style, 8k resolution, global illumination, raytracing, sharp focus on the entire scene (deep depth of field), solid neutral grey background.\n\nNegative Prompt: Toy, plastic, doll, action figure, clay, resin, shallow depth of field (blur), close-up, cropped, distorted proportions, giant head, cartoonish, missing limbs, unfinished.","media":"https://pbs.twimg.com/media/G-E77p2WIAAbR1j.jpg?name=small","mediaAlt":"Nano Banana Pro","mediaBadge":"图片","author":"Arminn_Ai","date":"2026-01-07","likes":299,"bookmarks":564,"hot":true,"models":["Nano Banana","Nano Banana Pro"],"useCases":["Food & beverage"],"techniques":["Camera movement","Camera / shot language"],"styles":["Photorealistic","Retro / vintage"],"subjects":["Person / portrait","Food / drink"],"srcUrl":"https://x.com/Arminn_Ai/status/2008952931484098637","mediaType":"image"},{"id":"2085640281941307648","slug":"2085640281941307648","title":"Montage, multi-shot candid observational footage","text":"Montage, multi-shot candid observational footage. Do not use a single camera angle or continuous take. Handheld documentary style with the feeling of accidental real-life capture. Slightly imperfect framing, subtle handheld shake, tiny reframing adjustments, gentle exposure breathing, and autofocus that settles half a beat late. Realistic skin texture, soft indoor natural light, film grain, shallow depth of field. Relaxed breathing, natural blinking, restrained and authentic performance. Total of 7 shots.\nThe woman from @ Image 1 is wearing a matching cotton pajama set consisting of a scoop-neck sleeveless top and loose shorts made from the same fabric and design. Barefoot, she lies on her stomach across a lived-in, slightly messy bed in her bedroom, browsing a mobile shopping page on a black smartphone. A house cat jumps onto the bed seeking attention, and she affectionately plays with it. Moments later, a friend calls. She answers, chats, and eventually bursts into laughter. The doorbell rings, so she ends the call and gets up to collect her dinner.\nShot 1 (0–2s):\nShe is already moving. One thumb scrolls through a shopping page while she frowns slightly, thinking. She quietly mutters in Korean: \"아, 뭐 살랬더라…\" (\"Ah... what was I going to buy again?\"). Lips synchronize naturally. Her bare feet gently sway behind her. A low handheld camera glides along the edge of the mattress, with soft bedding partially obscuring the foreground.\nShot 2 (2–4s):\nThe house cat jumps onto the bed, compressing the blanket as it walks toward her forearm and lets out a single meow. The camera gives a slight jolt from the impact, then quickly reframes from the phone to an over-the-shoulder view that includes her face, hands, phone, and cat.\nShot 3 (4–6s):\nShe turns warmly toward the cat, stroking it once from its forehead to its shoulders. In a gentle, affectionate tone she says: \"우리 애기 왔어?\" (\"Did my baby come?\"). Lip sync is clear and natural. The camera pushes in briefly through the cat's softly blurred foreground toward her face and hand.\nShot 4 (6–8s):\nA friend's ringtone sounds. She glances down, confirms the caller, swipes to answer, and brings the phone to her ear. The camera moves in a loose semicircle from a slightly tilted overhead angle, capturing the entire answering motion.\nShot 5 (8–11s):\nHer friend begins talking. She responds first with confusion, then disbelief: \"어, 왜? 진짜 거짓말.\" (\"Huh? Why? No way, you're kidding.\"). Immediately afterward she naturally bursts into laughter. The cat kneads the blanket beside her. A close handheld side angle keeps both her phone and profile within the same focal plane.\nShot 6 (11–13s):\nA clear doorbell interrupts the laughter. Both she and the cat turn toward the bedroom door. She braces one hand on the mattress to get up. The camera reacts a fraction too late, briefly turning toward the door before naturally correcting back to her rising movement.\nShot 7 (13–15s):\nStill on the phone, she hurriedly says: \"어, 나 밥 왔다. 끊어.\" (\"My food's here. I'll hang up.\"). She ends the call with her thumb, gets off the bed, and walks toward the door while the cat follows across the blankets. The camera slides low beneath her elbow and tilts upward as she stands in one continuous motion.\nSound:\nNo music. Only raw production sound: bedding rustling, quiet breathing, finger taps on the phone, the soft impact of the cat jumping onto the bed, one natural meow, faint purring, a single short incoming ringtone, call connection tone, the friend's voice through the phone, the woman's four Korean lines with accurate lip sync, a genuine brief laugh, one clear doorbell, the tap ending the call, and soft cat footsteps. No subtitles, no on-screen text, no logo, no watermark. Never render a reference sheet or duplicate the subject.","media":"https://pbs.twimg.com/amplify_video_thumb/2085640247682224128/img/Wj08brZzXojtfWtv.jpg?name=small","mediaAlt":"来源帖媒体（video）","mediaBadge":"视频 15s","author":"oggii_0","date":"2026-08-07","likes":297,"bookmarks":232,"hot":true,"models":["Seedance"],"useCases":["Food & beverage"],"techniques":["Camera movement","Multi-shot / storyboard","Lip sync / dialogue"],"style
