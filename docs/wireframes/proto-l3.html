<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model page (L3) — four directions</title>

<style>
/* ─── Real materials: L3's own :root, copied verbatim ────────────────────── */
:root{
  color-scheme:light dark;
  --bg:light-dark(rgb(255 255 255), rgb(24 24 24));
  --fg:light-dark(rgb(26 28 31), rgb(255 255 255));
  --muted-fg:light-dark(rgb(26 28 31 / 50%), rgb(255 255 255 / 50%));
  --faint-fg:light-dark(rgb(26 28 31 / 34%), rgb(255 255 255 / 34%));
  --border:light-dark(rgb(26 28 31 / 9%), rgb(255 255 255 / 9%));
  --card:color-mix(in oklab, var(--fg) 4%, transparent);
  --muted:color-mix(in srgb, var(--fg) 8%, transparent);
  --border-strong:light-dark(rgb(26 28 31 / 20%), rgb(255 255 255 / 20%));
  --primary:var(--fg); --primary-fg:light-dark(rgb(255 255 255), rgb(13 13 13));
  --ok:light-dark(rgb(0 138 76), rgb(96 204 146));
  --cand:light-dark(rgb(158 106 12), rgb(224 176 96));
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
/* Additions the real page has no token for: one hairline, one z scale, one radius,
   and a system serif — the only display pairing the craft bar allows. */
:root{
  --r:14px; --hairline:1px;
  --serif:ui-serif, Georgia, "Times New Roman", serif;
  --z-base:0; --z-sticky:40; --z-bar:60; --z-skip:99;
}
@media only screen and (min-resolution:192dpi){ :root{ --hairline:.5px } }

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-synthesis:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
button,a,input,select,textarea{touch-action:manipulation}
input,textarea,select{font-size:16px}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:4px}
img{outline:1px solid rgb(0 0 0 / .1);outline-offset:-1px}
@media (prefers-color-scheme:dark){ img{outline-color:rgb(255 255 255 / .1)} }
[id]{scroll-margin-top:78px}
h1,h2,h3,h4{margin:0;font-weight:500;text-wrap:balance}
h1{font-size:clamp(34px,6.4vw,62px);line-height:1.04;letter-spacing:-.045em}
h2{font-size:clamp(26px,4.2vw,40px);line-height:1.1;letter-spacing:-.03em}
h3{font-size:15px;line-height:1.3}
h4{font-size:15.5px;line-height:1.35;font-weight:600}
p{margin:0;line-height:1.55}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.skip{position:absolute;left:-9999px;background:var(--fg);color:var(--primary-fg);
  padding:10px 14px;z-index:var(--z-skip);border-radius:8px}
.skip:focus{left:12px;top:12px}
.page{max-width:1160px;margin:0 auto}

/* ─── Shared chrome ─────────────────────────────────────────────────────── */
.nav{min-height:64px;padding:14px 28px;border-bottom:var(--hairline) solid var(--border);
  display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{font-weight:500;letter-spacing:-.02em;margin-right:auto;display:flex;gap:9px;align-items:center}
.brand i{width:8px;height:8px;border-radius:2px;background:var(--fg);font-style:normal}
.navlinks{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted-fg);font-size:14px}
.navlinks a{display:inline-flex;align-items:center;min-height:44px;
  transition-property:color;transition-duration:150ms;transition-timing-function:ease-out}
.navlinks a[aria-current="page"]{color:var(--fg);font-weight:500}
.crumbs{padding:14px 28px 0;font:12px/1.5 var(--mono);color:var(--faint-fg);
  display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.crumbs a{display:inline-flex;align-items:center;min-height:34px;position:relative;
  transition-property:color;transition-duration:150ms;transition-timing-function:ease-out}
/* The crumb row is 34px of text; the halo takes the target to 44px vertically only,
   so neighbouring crumbs never overlap horizontally. */
.crumbs a::after{content:"";position:absolute;inset:-5px 0}
@media (hover:hover) and (pointer:fine){
  .navlinks a:hover,.crumbs a:hover{color:var(--fg)} }

.eyebrow{font:500 11px/1.5 var(--mono);letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted-fg);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lede{margin-top:16px;color:var(--muted-fg);max-width:60ch;text-wrap:pretty}
.count{font-variant-numeric:tabular-nums}

section.sec{padding:52px 28px;border-top:var(--hairline) solid var(--border)}
.sec-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.sec-head .end{margin-left:auto;font:11.5px/1.5 var(--mono);color:var(--faint-fg);
  font-variant-numeric:tabular-nums}
.subline{color:var(--muted-fg);font-size:13.5px;margin:-14px 0 22px;max-width:70ch;text-wrap:pretty}

.btn{border:1px solid var(--border);background:transparent;border-radius:9px;padding:9px 14px;
  font-size:13.5px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;
  gap:6px;min-height:38px;position:relative;
  transition-property:background-color,border-color,color,opacity;
  transition-duration:150ms;transition-timing-function:ease-out}
.btn::after{content:"";position:absolute;inset:-3px}
.btn:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){
  .btn:hover{background:var(--card);border-color:var(--border-strong)} }
.btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
@media (hover:hover) and (pointer:fine){ .btn.primary:hover{opacity:.86} }
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:8px;min-height:34px}
.btn.sm::after{inset:-5px}
.btn.ghost{border-color:transparent;color:var(--muted-fg)}
.btn[data-copied]{background:var(--ok);border-color:var(--ok);color:#fff}

.pill{display:inline-flex;align-items:center;gap:5px;font:500 10.5px/1 var(--mono);
  letter-spacing:.05em;padding:5px 9px;border-radius:999px;border:1px solid var(--border);
  color:var(--muted-fg);white-space:nowrap}
.pill.cand{color:var(--cand);border-color:color-mix(in srgb,var(--cand) 35%,transparent)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}

/* Facets. Chips sit 32px tall; ::after lifts the hit area to 44px and the 12px
   gap is exactly the halo width on each side, so no two targets overlap. */
.axes{display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(232px,1fr))}
.axes .ax .axh{display:flex;gap:10px;align-items:baseline;margin-bottom:12px}
.axes .ax .axh .n{font:500 11px/1 var(--mono);color:var(--faint-fg);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:12px;flex-wrap:wrap}
.chip{border:1px solid var(--border);border-radius:999px;padding:7px 12px;background:transparent;
  color:var(--muted-fg);font-size:12.5px;display:inline-flex;gap:6px;align-items:center;
  position:relative;
  transition-property:background-color,border-color,color;
  transition-duration:150ms;transition-timing-function:ease-out}
.chip::after{content:"";position:absolute;inset:-6px}
.chip:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){
  .chip:hover{color:var(--fg);border-color:var(--border-strong)} }
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.chip small{font:10.5px var(--mono);opacity:.7;font-variant-numeric:tabular-nums}

.empty{border:1px dashed var(--border-strong);border-radius:var(--r);padding:40px 26px;
  min-height:300px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
  gap:12px;background:repeating-linear-gradient(-45deg,transparent 0 10px,
    color-mix(in srgb,var(--fg) 3%,transparent) 10px 20px)}
.empty h3{font-size:19px;letter-spacing:-.01em}
.empty p{color:var(--muted-fg);font-size:13.5px;max-width:56ch;text-wrap:pretty}

.shot{aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--muted);position:relative;
  display:grid;place-items:center}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .mb{position:absolute;left:7px;bottom:7px;background:rgb(0 0 0 / .55);color:#fff;
  font:500 9.5px/1 var(--mono);letter-spacing:.05em;padding:4px 7px;border-radius:5px}

.mono{font:12px/1.7 var(--mono);white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word}
.varmark{background:color-mix(in srgb,var(--cand) 22%,transparent);color:var(--cand);
  border-radius:4px;padding:0 3px}

.creators{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.creator{border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;
  flex-direction:column;gap:8px;align-items:flex-start;
  transition-property:border-color,background-color;transition-duration:150ms;transition-timing-function:ease-out}
@media (hover:hover) and (pointer:fine){ .creator:hover{border-color:var(--border-strong)} }
.creator .av{width:34px;height:34px;border-radius:50%;background:var(--muted);flex:none;
  display:block;overflow:hidden}
.creator .av img{width:100%;height:100%;object-fit:cover;display:block;outline:none}
.creator b{font-size:14.5px;font-weight:600}
.creator span{font:11px/1.5 var(--mono);color:var(--faint-fg);font-variant-numeric:tabular-nums}

.about{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.mock{border:1px solid var(--border);border-radius:var(--r);background:var(--card);overflow:hidden}
.mock .bar{height:34px;border-bottom:var(--hairline) solid var(--border);display:flex;gap:6px;
  align-items:center;padding:0 13px}
.mock .bar i{width:7px;height:7px;border-radius:50%;background:var(--muted-fg);opacity:.5;font-style:normal}
.mock .bd{padding:16px;display:grid;gap:10px}
.mock .bd p{font-size:13.5px;color:var(--muted-fg);text-wrap:pretty}
.mock .bd h3{font:500 10.5px/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint-fg)}

/* The composer. Same parts as the shipped box; each variant places it differently. */
.genbox{border:1px solid var(--border);border-radius:18px;background:var(--card);padding:14px}
.genbox textarea{width:100%;border:1px solid var(--border);border-radius:12px;background:var(--bg);
  color:var(--fg);font:16px/1.55 var(--sans);padding:10px 12px;outline:none;resize:vertical;min-height:76px}
@media (min-width:768px){ .genbox textarea{font-size:13.5px} }
.genbox textarea:focus-visible{border-color:var(--border-strong)}
.genbox textarea::placeholder{color:var(--faint-fg)}
.genrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.genrow .sp{flex:1}
.genmodel{font:11px/1 var(--mono);color:var(--muted-fg);border:1px solid var(--border);
  border-radius:999px;padding:7px 10px}
.genhint{font:11px/1.5 var(--mono);color:var(--faint-fg);font-variant-numeric:tabular-nums}

footer.foot{padding:30px 28px 22px;border-top:var(--hairline) solid var(--border);
  color:var(--faint-fg);font:11.5px/1.6 var(--mono)}
.footnav{display:grid;gap:26px 20px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));margin-bottom:28px}
.footnav h3{font:500 10.5px/1.5 var(--mono);letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint-fg);margin:0 0 9px}
.footnav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
/* Sitemap rows sit at 40px, the concession the craft bar allows for a footer of
   this size; anything taller pushes the fifth column off a phone screen. */
.footnav a{color:var(--muted-fg);font:13px/1.5 var(--sans);display:flex;align-items:center;min-height:40px;
  transition-property:color;transition-duration:150ms;transition-timing-function:ease-out}
@media (hover:hover) and (pointer:fine){
  .footnav a:hover{color:var(--fg);text-decoration:underline;text-underline-offset:2px} }
.footlegal{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;
  padding-top:16px;border-top:var(--hairline) solid var(--border)}

@media (max-width:640px){
  .v2 .hero,.v3 .hero,.v4 .hero{padding-left:18px;padding-right:18px}
  section.sec{padding-left:18px;padding-right:18px}
  .navlinks{display:none}
}

/* Variant 1 is the shipped page, in its own document. */
.baseline{display:block;width:100%;height:100dvh;border:0}

/* ══ V2 · Contact sheet — the results are the argument ════════════════════ */
.v2 .hero{padding:56px 28px 40px;display:grid;gap:26px;
  grid-template-columns:minmax(0,1fr) minmax(300px,420px);align-items:end}
.v2 .hero .stage-note{margin-top:10px}
.sheet{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(196px,1fr))}
.tile{border:1px solid var(--border);border-radius:var(--r);padding:9px;display:flex;
  flex-direction:column;gap:9px;background:var(--bg);min-width:0;
  transition-property:border-color;transition-duration:150ms;transition-timing-function:ease-out}
@media (hover:hover) and (pointer:fine){ .tile:hover{border-color:var(--border-strong)} }
.tile .shot{border-radius:calc(var(--r) - 9px)}
.tile .info{display:flex;flex-direction:column;gap:7px;min-width:0}
.tile h3{font-size:13.5px;line-height:1.32;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.tile .micro{font:10.5px/1.5 var(--mono);color:var(--faint-fg);font-variant-numeric:tabular-nums;
  display:flex;gap:8px;flex-wrap:wrap}
.tile .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
.tile .full{display:none}
.tile[data-open]{grid-column:1 / -1;display:grid;grid-template-columns:280px minmax(0,1fr);
  gap:18px;padding:14px;border-color:var(--border-strong)}
.tile[data-open] .shot{aspect-ratio:4/5}
.tile[data-open] h3{-webkit-line-clamp:unset;font-size:17px;letter-spacing:-.01em}
.tile[data-open] .full{display:block;border:1px solid var(--border);border-radius:10px;
  background:var(--card);padding:12px 13px;max-height:340px;overflow:auto}
@media (max-width:700px){
  .tile[data-open]{grid-template-columns:minmax(0,1fr)}
  .v2 .hero{grid-template-columns:minmax(0,1fr);align-items:stretch;padding-top:40px}
}

/* ══ V3 · Spec sheet — the model as a data set ════════════════════════════ */
.v3 .hero{padding:56px 28px 40px;display:grid;gap:30px;
  grid-template-columns:minmax(0,1fr) minmax(300px,460px);align-items:end}
/* The display size is set against the full measure; in a half-width column it
   would break the model name across two lines. */
.v3 .hero h1{font-size:clamp(32px,4.4vw,50px)}
.profile{border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.profile .prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:9px 14px;
  border-bottom:var(--hairline) solid var(--border);font:12.5px/1.55 var(--mono);
  font-variant-numeric:tabular-nums}
.profile .prow:last-child{border-bottom:0}
@media (max-width:560px){
  .profile .prow{grid-template-columns:minmax(0,1fr);gap:2px}
  .profile .prow dd{text-align:left}
}
.profile .prow dt{color:var(--faint-fg);min-width:0;overflow-wrap:break-word}
.profile .prow dd{margin:0;text-align:right;color:var(--fg)}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r)}
table.spec{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
table.spec th,table.spec td{text-align:left;padding:10px 12px;vertical-align:top;
  border-bottom:var(--hairline) solid var(--border)}
table.spec thead th{position:sticky;top:0;background:var(--bg);z-index:var(--z-sticky);
  padding:0;border-bottom:1px solid var(--border-strong)}
table.spec thead th .sortbtn{width:100%;display:flex;align-items:center;gap:6px;min-height:44px;
  padding:0 12px;background:transparent;border:0;font:500 10.5px/1 var(--mono);letter-spacing:.07em;
  text-transform:uppercase;color:var(--faint-fg);cursor:pointer;
  transition-property:color;transition-duration:150ms;transition-timing-function:ease-out}
@media (hover:hover) and (pointer:fine){ table.spec .sortbtn:hover{color:var(--fg)} }
table.spec .sortbtn:active{transform:scale(.96)}
table.spec th[aria-sort] .sortbtn{color:var(--fg)}
table.spec th.plain{padding:0 12px;font:500 10.5px/44px var(--mono);letter-spacing:.07em;
  text-transform:uppercase;color:var(--faint-fg)}
table.spec .ttl{font-weight:500;display:block;max-width:38ch}
table.spec .num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px;white-space:nowrap}
table.spec td.act{white-space:nowrap}
table.spec td.act .btn{margin-right:10px}
table.spec tr.detail td{background:var(--card);padding:14px 12px}
table.spec tr.detail .mono{max-height:360px;overflow:auto;display:block}
.v3 .genstrip{margin-top:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  border:1px dashed var(--border-strong);border-radius:var(--r);padding:14px 16px;
  font:12px/1.6 var(--mono);color:var(--muted-fg)}
.v3 .genstrip .sp{flex:1}
@media (max-width:860px){ .v3 .hero{grid-template-columns:minmax(0,1fr);padding-top:40px} }
/* On a phone the table keeps only the four columns you act on: what it is, how
   long it is, and the two buttons. Everything else is a sort key, not a
   decision, and the row number is decoration. */
@media (max-width:760px){
  table.spec .c-use,table.spec .c-style,table.spec .c-likes,
  table.spec .c-idx,table.spec .c-shape,table.spec .c-who{display:none}
  table.spec{min-width:0}
  table.spec .ttl{max-width:20ch}
  table.spec th,table.spec td{padding:10px 8px}
  table.spec td.act{white-space:normal;display:flex;flex-direction:column;gap:8px;align-items:stretch}
  table.spec td.act .btn{margin-right:0}
}

/* ══ V4 · Anthology — nothing truncated ══════════════════════════════════ */
.v4 .hero{padding:56px 28px 40px}
.v4 .hero h1{font-family:var(--serif);font-weight:400;letter-spacing:-.02em}
.toc{margin-top:26px;border-top:1px solid var(--border-strong);border-bottom:1px solid var(--border-strong)}
.toc ol{list-style:none;margin:0;padding:0;columns:2;column-gap:34px}
.toc li{break-inside:avoid}
.toc a{display:flex;gap:10px;align-items:baseline;min-height:40px;padding:2px 0;
  border-bottom:var(--hairline) solid var(--border);font-size:13.5px;
  transition-property:color;transition-duration:150ms;transition-timing-function:ease-out}
.toc a .i{font:11px/1 var(--mono);color:var(--faint-fg);font-variant-numeric:tabular-nums;flex:none;width:20px}
.toc a .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted-fg)}
.toc a .l{font:11px/1 var(--mono);color:var(--faint-fg);font-variant-numeric:tabular-nums;flex:none}
@media (hover:hover) and (pointer:fine){ .toc a:hover .t{color:var(--fg)} }
@media (max-width:700px){ .toc ol{columns:1} }
.anth{max-width:74ch}
.grp{margin-top:44px}
.grp > h3{font:500 11px/1.5 var(--mono);letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint-fg);padding-bottom:10px;border-bottom:1px solid var(--border-strong)}
.entry{padding:34px 0;border-bottom:var(--hairline) solid var(--border);
  display:grid;grid-template-columns:34px minmax(0,1fr);gap:20px}
.entry .idx{font:400 22px/1 var(--serif);color:var(--faint-fg);font-variant-numeric:tabular-nums;padding-top:2px}
.entry h4{margin-bottom:8px;font-family:var(--serif);font-weight:600;font-size:19px;
  letter-spacing:-.01em;line-height:1.25}
.entry .who{display:flex;gap:9px;align-items:center;font:11.5px/1.5 var(--mono);color:var(--faint-fg);
  flex-wrap:wrap;font-variant-numeric:tabular-nums}
.entry .who .av{width:22px;height:22px;border-radius:50%;background:var(--muted);overflow:hidden;
  flex:none;display:block}
.entry .who .av img{width:100%;height:100%;object-fit:cover;display:block;outline:none}
.entry .plate{margin:16px 0;border-radius:10px;overflow:hidden;background:var(--muted);
  width:190px;aspect-ratio:4/5;float:right;margin-left:22px;margin-top:4px}
.entry .plate img{width:100%;height:100%;object-fit:cover;display:block}
.entry .body{border-left:2px solid var(--border-strong);padding:2px 0 2px 16px;margin-top:16px;
  color:var(--muted-fg)}
.entry .acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;clear:both}
.entry .tagline{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
@media (max-width:640px){
  .entry{grid-template-columns:minmax(0,1fr);gap:8px}
  .entry .idx{font-size:16px}
  .entry .plate{float:none;margin:16px 0 0;width:100%;max-width:220px}
}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition-duration:1ms !important;animation-duration:1ms !important;
    animation-iteration-count:1 !important;scroll-behavior:auto !important}
}
</style>

<style id="linear-dark-theme">
/* ─────────────────────────────────────────────────────────────────────────
   Linear-derived dark theme for the prototype pickers.

   Values come from the token snapshot at
   `specs/images/linear-design-tokens.css` (Linear public-site CSS, snapshot
   2026-09-03), not from memory. This is a COLOUR re-theme only: type and
   geometry stay on the project's own system, because `frontend/AGENTS.md` §7.6
   has not ruled on a web font and Linear's faces (Inter Variable, Berkeley
   Mono, Tiempos Headline) are not licensed here. Weights stay 400/600.

   The four pickers were written at different times and use three different
   token vocabularies (`--background`/`--bg`, `--foreground`/`--fg`,
   `--muted`/`--muted-fg`, `--faint`/`--faint-fg`, `--font-sans`/`--sans`).
   Every unambiguous alias is set, so one block themes all four — see the
   note on `--muted` below for the one token deliberately skipped.

   Contrast, measured against the canvas ladder (WCAG 2, sRGB):

     token                 #08090a  #0f1011  #141516  #191a1b
     --foreground #f7f8f8    18.73    17.90    17.18    16.38
     --muted-fg   #d0d6e0    13.64    13.04    12.52    11.93
     --faint      #8a8f98     6.13     5.86     5.63     5.36
     --accent     #7170ff     5.18     4.96     4.76     4.53
     --ok         #4cc38a     9.00     8.60     8.25     7.87
     white on brand fill #5e6ad2 …………………………………………………… 4.70

   Three deliberate departures from Linear's own dark tokens, each because a
   token Linear uses decoratively is used here as text:

   1. `--faint` takes Linear's TERTIARY ink `#8a8f98`, not its quaternary
      `#62666d`. Quaternary measures 3.45:1 — below the 4.5:1 floor — and this
      project spends `--faint` on 11px mono captions, which is text.
   2. `--accent` takes `#7170ff`, NOT the `#5252f5` that `frontend/CLAUDE.md`
      mandates. That mandate is a LIGHT-mode repair: `#7070ff` fails AA on all
      four light surfaces (3.30–3.85) and `#5252f5` fixes it. Inverted, the
      rule inverts too — `#5252f5` measures 3.69:1 on `#08090a` and would be
      the unreadable one. Same intent, opposite value.
   3. `--ok` lifts Linear's `#27a644` to `#4cc38a`. Per the `color` skill,
      brand colours carried into dark at full saturation vibrate; lightness
      goes up and chroma comes down. It also buys 6.29:1 → 9.00:1 at 11px.
   ───────────────────────────────────────────────────────────────────────── */

:root[data-theme="linear-dark"] {
  color-scheme: dark;

  /* Canvas ladder — level-0 is the page, level-1 insets, level-2 cards.
     Dark mode keeps the layering hierarchy; it is not inverted light mode. */
  --background: #08090a;  --bg: #08090a;
  --surface:    #0f1011;
  --card:       #141516;

  /* Ink */
  --foreground: #f7f8f8;  --fg: #f7f8f8;
  /* --muted is deliberately NOT set. It is ink in L1/L4 but a translucent
     SURFACE wash in L2/L3 (`color-mix(in srgb, var(--fg) 8%, transparent)`,
     used only for avatar and media placeholders). Forcing one ink value here
     painted light-grey boxes onto a near-black canvas in L3. Every file's own
     definition self-corrects once --fg/--foreground flip and color-scheme is
     dark, so the token is left alone on purpose. --muted-fg is unambiguous
     ink and is set. */
  --muted-fg: #d0d6e0;
  --faint:      #8a8f98;  --faint-fg: #8a8f98;

  /* Lines. Linear's dark borders are solid, not alpha-white — a translucent
     white hairline glows on near-black instead of receding. */
  --border:        #23252a;
  --border-strong: #34343a;

  /* Interaction. Indigo carries interaction semantics only: focus, links,
     ::selection, and the single primary action per view. */
  --accent:    #7170ff;
  --accent-bg: #1b1c33;

  /* The inverted button: Linear's own --color-button-invert-bg. */
  --primary:    #e5e5e6;
  --primary-fg: #08090a;

  /* Status */
  --ok:   #4cc38a;
  --cand: #f0bf00;

  /* L4's placeholder highlight, on Linear's orange */
  --var-bg: #2a1a12;
  --var-fg: #fc9a6e;

  /* L1's Spotlight band sits below the page ladder on Linear's marketing black */
  --bbd:    #010102;
  --bmu:    rgb(247 248 248 / .68);
  --bfaint: rgb(247 248 248 / .46);
}

/* The prototypes gate their dark-mode image outline on `prefers-color-scheme`,
   which does not fire when the theme is forced by attribute. A tinted outline
   picks up the surface behind it and reads as grime, so it must be pure white. */
:root[data-theme="linear-dark"] img { outline-color: rgb(255 255 255 / .1); }

/* Selection carries the brand quietly and stays legible. */
:root[data-theme="linear-dark"] ::selection {
  background: color-mix(in oklab, #5e6ad2, black 10%);
  color: #fff;
}

/* Depth: on dark, a stacked shadow is invisible, so every elevation collapses
   to a single low-opacity white ring. */
:root[data-theme="linear-dark"] [data-elevated] {
  box-shadow: 0 0 0 1px rgb(255 255 255 / .09);
}

/* This page's own `.btn[data-copied]` hardcodes white text on `var(--ok)`
   fill instead of routing through a foreground token. In light mode --ok is
   a dark green (white text is correct, ~5.6:1) but in this dark theme --ok
   is lifted to a light, legible-as-text green (#4cc38a) — white-on-white-ish
   would read at ~2.2:1. Route it through --primary-fg instead of adding a
   second override: --primary-fg already flips white→near-black across this
   exact light/dark boundary, in step with --ok's own fill flipping
   dark→light, so it lands correct in both themes without a new token. */
:root[data-theme="linear-dark"] .btn[data-copied] { color: var(--primary-fg); }
</style>

d. Her body is fully extended and arched, head thrown back, still singing with clear lip-sync. While holding her they gently rock her up and down in time with the beat. The camera starts from a clear side view of her arched body and smoothly transitions to a frontal view of her face. At the end they lower her smoothly onto her feet; she lands and immediately continues singing as the five men stay low on the floor around her. The men never fully obscure her. High fashion dance energy, sweaty skin, sharp timing, continuous fluid motion of the woman, priority on accurate lip-sync in every frame. Rules: no hand morphing, no body distortions, clean stable anatomy, fingers and hands remain consistent and natural throughout the entire video. #AIvideo #AIMusicVideo #AIFilmmaking", "models": ["Seedance"], "uses": ["Fashion"], "styles": ["Cinematic"], "techs": ["Camera movement / shot language", "Lip sync / dialogue"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2078813993645273089/img/4nQRj3B5LpuYV0XW.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2078813993645273089/img/4nQRj3B5LpuYV0XW.jpg?name=small"], "n": 1, "dur": 15, "handle": "@Kiber_Alla", "likes": 562, "saves": 671, "hv": true, "score": 96.3}, {"id": "2083168602363150527", "slug": "scene-a-day-in-new-york-shot-entirely-by-the-2083168602363150527", "title": "A day in New York, filmed by the subject", "prompt": "SCENE A day in New York shot entirely by the subject herself: waking in her hotel suite, coffee, getting ready, out into the city, back to the room at night. ACTIVE REFERENCES @ image1 — the hotel suite. Curved cove ceiling with warm LED coving, deep red carpet, cream walls, two black organic sculptures above a light wood headboard, white bedding with red pillows, twin bedside lamps, pale sofa, oval coffee table, sheer curtains, dark door. @ image2 — the subject. Young woman, shoulder-length wavy blonde hair with curtain bangs and highlights, light ylight, warm diner practicals. Shot 8: lamps and cove light only. AUDIO Diegetic only, from the same camera — room tone, footsteps, door, traffic, sirens, steam vents, diner clatter, wind. Ambience ducks under her lines. No music. LOCKS Photoreal live action, 4K detail, fine grain, warm consumer-camera colour, mild rolling shutter and auto-exposure hunting. She is the only person who speaks; background figures anonymous and unfocused. No subtitles.", "models": ["Higgsfield Soul", "Seedance"], "uses": ["Food & beverage"], "styles": ["Photorealistic"], "techs": ["Camera movement / shot language", "Lip sync / dialogue", "Multi-shot / storyboard"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2083165874983424000/img/L7v_JTJr0f72f2Z_.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2083165874983424000/img/L7v_JTJr0f72f2Z_.jpg?name=small"], "n": 1, "dur": 29, "handle": "@higgsfield_ai", "likes": 589, "saves": 457, "hv": true, "score": 96.1}, {"id": "2029632175482507599", "slug": "subject-identity-biometric-reference-sydney--2029632175482507599", "title": "Forensic-detail beauty portrait, hooded eyes", "prompt": "{ \"subject\": { \"identity\": { \"biometric_reference\": \"Sydney Sweeney\", \"facial_forensics\": { \"structure\": \"Soft-edged heart-shaped facial morphology, high malar bones with specific 120-degree zygomatic arch projection, refined orthognathic profile.\", \"eyes\": \"Large, almond-shaped hooded eyes, deep set; iris pattern features complex radial fibers in cerulean blue (#96B9D0) with a distinct dark grey limbal ring; natural eyelashes with varied lengths.\", \"dentition\": \"Natural dental alignment, slight prominence of the maxillary central incisors, translucent incisal edges, anatomical gum contouring without artificial whitening.\", \"skin_physics\": \"Fitzpatrick Scale Type II (#F7E2D3); visible dermal pores, subtle telangiectasia, natural freckle distribution across the nasal bridge and malar \"Scattered billiard balls including the black 8-ball, red 15-ball, and yellow 9-ball; a polished wooden cue stick lying horizontally across the foreground; a triangular rack mounted on the dark wood wall in the background.\" } ], \"reflection_integrity_rules\": \"All reflective surfaces (billiard balls, wooden rails, polished cue) must accurately reflect the surrounding environment and the subject's silhouette without distortion. Surface physics must account for the absorption coefficient of the green felt.\" }, \"lighting\": { \"setup\": \"Single-point high-intensity key light mimicking a camera flash from the front-left; hard shadows with minimal fill; high specular highlights on skin oils and billiard balls.\", \"color_temperature\": \"5500K (Daylight Balanced).\" }, \"camera\": { \"technical_specs\": \"9:16 aspect ratio, 50mm prime lens, f/2.8 aperture for shallow depth of field, ISO 100, 8K resolution, photorealistic rendering engine.\", \"perspective\": \"Low-angle medium shot focusing on the subject's entire form.\" }, \"negative_constraints\": [ \"no logos\", \"no text\", \"no symbols\", \"no beautify smoothing\", \"no airbrushed skin\", \"no extra limbs\", \"no distorted fingers\", \"no overlapping textures\", \"no smile\", \"no artificial teeth whitening\", \"no makeup artifacts\" ] }", "models": ["Nano Banana", "Nano Banana Pro"], "uses": ["Beauty"], "styles": ["Photorealistic"], "techs": ["Camera movement / shot language"], "subjects": [], "kind": "image", "img": "https://pbs.twimg.com/media/HCqzkiOXEAE3uDT.jpg?name=small", "imgs": ["https://pbs.twimg.com/media/HCqzkiOXEAE3uDT.jpg?name=small"], "n": 1, "dur": null, "handle": "@PinodiArt", "likes": 2434, "saves": 1151, "hv": true, "score": 95.6}, {"id": "2088866007918268515", "slug": "30-second-cinematic-short-create-a-30-second-2088866007918268515", "title": "Paper world, 30-second cinematic short", "prompt": "30-SECOND CINEMATIC SHORT Create a 30-second cinematic sequence with the visual discipline of a major feature film. The world is entirely made from paper, cardboard, ink, and delicate handcrafted materials. 00:00–00:05 — THE FIRST FOLD Begin with an extreme macro shot of a blank sheet of textured paper. A single fold slowly forms across its surface. Lens: 100mm macro Camera: Completely static Soft daylight moves across the paper as the fold continues. Cut precisely as the paper reaches its final shape. 00:05–00:11 — THE CITY EMERGES Transition into a 50mm shot. The folded paper begins forming miniature streets and architectural structures. Buildings rise naturally from the surface through carefully constructed paper folds. The camera slowly tracks sideways. Tiny windows catch the light. Nothing feels computer-generated; every surface should have believable paper fibers, folds, shadows, and imperfections. 00:11–00:17 — THE REVEAL Move into a 35mm shot. The camera pulls backward. The small arrangement is revealed as an enormous handcrafted paper city stretching across a large table. Roads connect different districts. Bridges cross miniature rivers. Paper trees move gently from an unseen breeze. 00:17–00:23 — MORNING Transition into a slow overhead crane shot. Warm sunlight gradually spreads across the paper city. Shadows from the buildings become longer and more defined. Tiny paper windows begin reflecting the sunlight. The camera continues rising, revealing the geometric relationship between the streets and buildings. 00:23–00:27 — THE DETAIL Cut to an 85mm close-up. Focus on a tiny paper clock mounted on one building. The clock moves forward by one minute. Rack focus from the clock to the miniature skyline behind it. 00:27–00:30 — FINAL IMAGE Return to an extreme wide shot. The entire paper city sits beneath a large studio window. The morning light completely fills the miniature world. Camera slowly pulls backward until the city becomes a small object within the larger room. Fade to black. CINEMATOGRAPHY Large-format feature-film aesthetic. 100mm macro for texture. 85mm for detail. 50mm for natural perspective. 35mm for environmental shots. Controlled dolly and crane movements. Realistic depth of field. Natural focus transitions. Soft motion blur. Subtle lens imperfections. No artificial camera shake. MATERIAL DIRECTION Every surface must visibly behave like physical paper. Visible paper fibers. Natural folds. Tiny imperfections. Soft cardboard edges. Realistic contact shadows. Believable paper thickness. Natural material deformation. LIGHTING Soft morning daylight. Large window as the primary source. Natural bounce light. Gentle shadows. Subtle warm highlights. No artificial neon effects. No excessive visual effects. CONTINUITY The same paper city throughout the entire sequence. Buildings maintain identical shapes and positions. Roads remain connected. Paper materials remain consistent. No random transformations. No flickering. No duplicated structures. No sudden environmental changes. DIRECTOR’S NOTE Treat this as a miniature feature film, not a visual-effects demonstration. The camera should discover the world gradually. Start intimate. Reveal scale. Return to detail. Finish wide. The audience should feel that they are watching a real handcrafted world photographed with a cinema camera. Photorealistic 4K • tactile materials • feature-film cinematography • sophisticated lighting • realistic miniature photography • cinematic depth • precise camera movement • seamless visual continuity.", "models": ["GPT Image", "Seedance"], "uses": [], "styles": ["Cinematic", "Photorealistic"], "techs": ["Camera movement / shot language", "Transition / morph / match cut"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2088865943921528832/img/ACj33PYyBD5RI7qH.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2088865943921528832/img/ACj33PYyBD5RI7qH.jpg?name=small"], "n": 1, "dur": 30, "handle": "@ChillaiKalan__", "likes": 407, "saves": 409, "hv": true, "score": 95.3}, {"id": "2008952931484098637", "slug": "concept-2008952931484098637", "title": "Isometric diorama of [LOCATION] on a round base", "prompt": "Concept: A hyper-realistic 3D isometric view of a [INSERT LOCATION] scene on a circular base. Subject (Visuals): A full-body, realistic human [INSERT DESCRIPTION]. * Texture Rule: The subject must have \"Living Human Skin\" texture (subsurface scattering, pores, natural imperfections). * Important: He is NOT a toy/doll. He looks like a real person inserted into the scene. * Pose: [INSERT POSE, e.g., Sitting naturally]. Composition & Scale (Crucial): * Camera: Isometric wide shot (Full view). ensure the entire circular base, the subject, and all props are visible within the frame. * Proportions: PERFECT RELATIVE SCALE. The props (e.g., scooter, table etc.) must be the correct size relative to the human. Do not make the human giant or the props tiny. Environment: A realistic section of a [INSERT WALL/BUILDING] behind the subject. * Material: Real weathered textures (brick, cement, wood), not painted model textures. Props: * [INSERT PROP 1, e.g., Vintage Vespa] (Real metal and chrome texture). * [INSERT PROP 2, e.g., Pizza and Wine] (Real food texture). * *Note:* Ensure all props are present and grounded on the base. Technical Specs: Unreal Engine 5 render style, 8k resolution, global illumination, raytracing, sharp focus on the entire scene (deep depth of field), solid neutral grey background. Negative Prompt: Toy, plastic, doll, action figure, clay, resin, shallow depth of field (blur), close-up, cropped, distorted proportions, giant head, cartoonish, missing limbs, unfinished.", "models": ["Nano Banana", "Nano Banana Pro"], "uses": ["Food & beverage"], "styles": ["Photorealistic", "Retro / vintage"], "techs": ["Camera movement / shot language"], "subjects": ["Food / drink", "Person / portrait"], "kind": "image", "img": "https://pbs.twimg.com/media/G-E77p2WIAAbR1j.jpg?name=small", "imgs": ["https://pbs.twimg.com/media/G-E77p2WIAAbR1j.jpg?name=small"], "n": 1, "dur": null, "handle": "@Arminn_Ai", "likes": 299, "saves": 564, "hv": true, "score": 93.8}, {"id": "2060203818785370400", "slug": "design-a-hyper-realistic-fifa-2026-football--2060203818785370400", "title": "FIFA 2026 player poster in team colours", "prompt": "Design a hyper-realistic FIFA 2026 football poster inspired by premium sports editorial photography and minimalist World Cup branding. Create a centered composition of a football player sitting confidently on a geometric block inside a clean studio-style environment. The player faces forward with elbows resting on knees and hands clasped naturally, giving a calm, focused, determined expression toward the camera. TEAM CUSTOMIZATION: Automatically adapt the entire design to Portugal colors, flag accents, and national football identity. Use official-inspired jersey colors, sock stripes, typography accents, and subtle national design motifs throughout the poster. PLAYER DETAILS: - Jersey Number: 7 - Team Name: Portugal - Player Name: Sarah - Official-inspired modern football kit with realistic fabric texture - Matching socks, boots, captain armband if needed - Natural athletic body proportions - Ultra-realistic skin texture and facial detail LAYOUT & COMPOSITION: - Large oversized transparent player number placed behind the player vertically - Matching number integrated beneath the seat/platform - Minimal geometric graphic lines and thin UI-inspired football design elements around composition - Small national flag accents on sides - FIFA World Cup 2026 badge/logo placement in upper corner - Balanced negative space with ultra-clean layout COLOR DIRECTION: Use the exact national team palette throughout: - Brazil → yellow, green, blue - Argentina → sky blue, white, silver - Portugal → deep red, green - France → navy blue, white, red - Japan → blue, white - Morocco → red, green etc. LIGHTING: Soft cinematic studio lighting, subtle rim light, realistic shadows, premium sports-poster contrast, slight ate is giving a bonus to whoever—\" Instant snap zoom to Stanley. His head lifts. He takes off his glasses. Dead serious. STANLEY: \"I'm listening.\" MICHAEL (waving him off): \"—anyway. Moving on. Next topic. Prompt engineering.\" Snap zoom back to Stanley. He immediately puts his glasses back on, lowers his head, and returns to the crossword as if nothing happened. Cut to Jim, who slowly turns his head and looks directly into the camera lens with a flat, knowing expression. Hold for two seconds. STYLE: single-camera sitcom shot like a documentary crew is present, natural performances, no laugh track, muted office color palette, slightly soft consumer-camera look, characters occasionally glancing at the lens.", "models": [], "uses": [], "styles": [], "techs": ["Camera movement / shot language", "Lip sync / dialogue"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2084387230844346368/img/3q3PrcBYVZsGJ3lW.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2084387230844346368/img/3q3PrcBYVZsGJ3lW.jpg?name=small"], "n": 1, "dur": 15, "handle": "@Arminn_Ai", "likes": 446, "saves": 383, "hv": true, "score": 93.6}, {"id": "2085640281941307648", "slug": "montage-multi-shot-candid-observational-foot-2085640281941307648", "title": "Seven-shot handheld observational montage", "prompt": "Montage, multi-shot candid observational footage. Do not use a single camera angle or continuous take. Handheld documentary style with the feeling of accidental real-life capture. Slightly imperfect framing, subtle handheld shake, tiny reframing adjustments, gentle exposure breathing, and autofocus that settles half a beat late. Realistic skin texture, soft indoor natural light, film grain, shallow depth of field. Relaxed breathing, natural blinking, restrained and authentic performance. Total of 7 shots. The woman from @ Image 1 is wearing a matching cotton pajama set consisting of a scoop-neck sleeveless top and loose shorts made from the same fabric and design. Barefoot, she lies on her stomach across a lived-in, slightly messy bed in her bedroom, browsing a mobile shopping page on a black smartphone. A house cat jumps onto the bed seeking attention, and she affectionately plays with it. Moments later, a friend calls. She answers, chats, and eventually bursts into laughter. The doorbell rings, so she ends the call and gets up to collect her dinner. Shot 1 (0–2s): She is already moving. One thumb scrolls through a shopping page while she frowns slightly, thinking. She quietly mutters in Korean: \"아, 뭐 살랬더라…\" (\"Ah... what was I going to buy again?\"). Lips synchronize naturally. Her bare feet gently sway behind her. A low handheld camera glides along the edge of the mattress, with soft bedding partially obscuring the foreground. Shot 2 (2–4s): The house cat jumps onto the bed, compressing the blanket as it walks toward her forearm and lets out a single meow. The camera gives a slight jolt from the impact, then quickly reframes from the phone to an over-the-shoulder view that includes her face, hands, phone, and cat. Shot 3 (4–6s): She turns warmly toward the cat, stroking it once from its forehead to its shoulders. In a gentle, affectionate tone she says: \"우리 애기 왔어?\" (\"Did my baby come?\"). Lip sync is clear and natural. The camera pushes in briefly through the cat's softly blurred foreground toward her face and hand. Shot 4 (6–8s): A friend's ringtone sounds. She glances down, confirms the caller, swipes to answer, and brings the phone to her ear. The camera moves in a loose semicircle from a slightly tilted overhead angle, capturing the entire answering motion. Shot 5 (8–11s): Her friend begins talking. She responds first with confusion, then disbelief: \"어, 왜? 진짜 거짓말.\" (\"Huh? Why? No way, you're kidding.\"). Immediately afterward she naturally bursts into laughter. The cat kneads the blanket beside her. A close handheld side angle keeps both her phone and profile within the same focal plan ve. \"See you later.\"", "models": ["Seedance"], "uses": ["Advertising", "Beauty", "Food & beverage", "UGC"], "styles": ["Photorealistic", "Retro / vintage"], "techs": ["Camera movement / shot language"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2087155707795607552/img/GvPt7yiUAlXPgSXk.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2087155707795607552/img/GvPt7yiUAlXPgSXk.jpg?name=small"], "n": 1, "dur": 15, "handle": "@PhedEU", "likes": 133, "saves": 160, "hv": false, "score": 83.9}, {"id": "2089932434351734933", "slug": "use-the-uploaded-reference-image-as-the-exac-2089932434351734933", "title": "Locked product and identity, outfit swapped", "prompt": "Use the uploaded reference image as the exact character and product reference. Preserve the woman’s facial identity, hairstyle, eye color, makeup, skin tone, body proportions, jewelry, and overall appearance consistently throughout the entire video. Change her outfit to a fitted sleeveless PINK top with clean WHITE shorts and keep the outfit identical in every shot. Use the uploaded sunglasses, earbuds, orange retail packaging, and carrying cases as LOCKED product references. Preserve their exact shapes, colors, materials, proportions, buttons, lenses, hinges, charging case, textures, and every visible product detail. Do not redesign, replace, or invent any product elements. Create an ultra-realistic UGC luxury lifestyle review filmed inside a modern luxury bedroom during warm golden hour. The woman is the clear visual focus, with authentic creator energy and natural expressions. Use warm sunlight coming through the bedroom windows, soft realistic shadows, natural skin texture, shallow depth of field, subtle handheld smartphone movement, realistic autofocus behavior, natural motion blur, and premium commercial-quality cinematography. Include a realistic cat naturally interacting with her only where specified, without distracting from the products. 0–5 s const MODEL = "Nano Banana Pro";
/* Every prompt in the sample that names this model. No slicing, no curation —
   the owner asked for as many as possible and there are 14. */
const RECS = DATA.filter(r => (r.models || []).includes(MODEL))
                 .sort((a, b) => (b.score || 0) - (a.score || 0));

const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const n = v => v == null ? "—" : Number(v).toLocaleString("en-US");
const VAR_RE = /\[[A-Z][A-Z \-_/]{2,}\]/g;
const varsOf = r => [...new Set(r.prompt.match(VAR_RE) || [])];
const isJson = r => r.prompt.trimStart().startsWith("{");
const shapeOf = r => isJson(r) ? "JSON" : "Prose";
const byId = id => RECS.find(r => r.id === id);

/* The prompt with its [BRACKET] placeholders marked, so the thing that has to
   be edited before use is visible in the text rather than described. */
function promptHtml(r){
  const vars = varsOf(r);
  const html = esc(r.prompt);
  if (!vars.length) return html;
  const re = new RegExp("(" + vars.map(v => esc(v).replace(/[.*+?^${}()|[\]\\/]/g, "\\$&")).join("|") + ")", "g");
  return html.split(re).map(part => vars.map(esc).includes(part)
    ? `<mark class="varmark">${part}</mark>` : part).join("");
}

/* ─── Facets · four axes, counted off the 14 records themselves ─────────── */
const AXES = [
  ["use_case", "Use case", r => r.uses || []],
  ["style",    "Style",    r => r.styles || []],
  ["flag",     "Variables", null],
  ["subject",  "Subject",  r => r.subjects || []],
];
function axisValues(key){
  if (key === "flag"){
    const c = RECS.filter(r => varsOf(r).length).length;
    return c ? [["variables", "Has variables", c]] : [];
  }
  const get = AXES.find(a => a[0] === key)[2];
  const counts = new Map();
  RECS.forEach(r => get(r).forEach(v => counts.set(v, (counts.get(v) || 0) + 1)));
  return [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .map(([v, c]) => [v, v, c]);
}
const sel = { use_case:new Set(), style:new Set(), flag:new Set(), subject:new Set() };
const anySel = () => AXES.some(a => sel[a[0]].size);
function match(r){
  for (const [key, , get] of AXES){
    const s = sel[key];
    if (!s.size) continue;
    if (key === "flag"){ if (!varsOf(r).length) return false; continue; }
    if (![...s].some(v => get(r).includes(v))) return false;
  }
  return true;
}
const filtered = () => RECS.filter(match);
function activeLabel(){
  const out = [];
  AXES.forEach(([key, label]) => { if (sel[key].size)
    out.push(label + ": " + [...sel[key]].map(v => v === "variables" ? "has variables" : v).join(", ")); });
  return out.join(" · ");
}

function facetBlock(){

  return `<div class="empty"><h3>No ${esc(MODEL)} prompt matches those filters.</h3>

  const m = new Map();

}

/* ══ V3 · Spec sheet ══════════════════════════════════════════════════════
   Axis: the model as a data set. No pictures above the fold, a profile built
   from the records themselves, and one sortable table you can compare down.
   The composer box is gone — this page is for judging, not for writing. */
let sortKey = "likes", sortDir = -1;
const SORTS = {
  title: r => r.title.toLowerCase(),
  shape: r => shapeOf(r),
  len:   r => r.prompt.length,
  use:   r => (r.uses || []).join(", ").toLowerCase(),
  style: r => (r.styles || []).join(", ").toLowerCase(),
  who:   r => (r.handle || "~").toLowerCase(),
  likes: r => r.likes || 0,
};
function sorted(rows){
  const get = SORTS[sortKey] || SORTS.likes;
  return [...rows].sort((a, b) => {
    const x = get(a), y = get(b);
    if (x < y) return -1 * sortDir;
    if (x > y) return 1 * sortDir;
    return 0;
  });
}
function profile(){
  const lens = RECS.map(r => r.prompt.length).sort((a, b) => a - b);
  const mid = lens.length % 2 ? lens[(lens.length - 1) / 2]
    : Math.round((lens[lens.length / 2 - 1] + lens[lens.length / 2]) / 2);
  const j = RECS.filter(isJson).length;
  const v = RECS.filter(r => varsOf(r).length).length;
  const withImg = RECS.filter(r => r.img).length;
  const noUse = RECS.filter(r => !(r.uses || []).length).length;
  const topStyle = axisValues("style")[0];
  const rows = [
    ["Prompts naming this model", "14 of 35"],
    ["Written as raw JSON", `${j} of 14`],
    ["Shortest / median / longest", `${n(lens[0])} / ${n(mid)} / ${n(lens[lens.length - 1])} chars`],
    ["Carrying [BRACKET] placeholders", `${v} of 14`],
    ["Published with a picture", `${withImg} of 14`],
    ["No use case tagged", `${noUse} of 14`],
    ["Most common style", topStyle ? `${topStyle[0]} (${topStyle[2]})` : "—"],
    ["Distinct creators", String(creatorsOf().length)],
  ];
  return `<dl class="profile">${rows.map(([k, v2]) =>
    `<div class="prow"><dt>${esc(k)}</dt><dd>${esc(v2)}</dd></div>`).join("")}</dl>`;
}

    <button class="sortbtn" type="button" data-sort="${esc(key)}">${esc(label)}

/* ─── Behaviour · delegated on #stage so the picker wiring stays verbatim ── */
const variants = [v1, v2, v3, v4];
const stage = document.getElementById('stage');
let refocus = null;          /* css selector to restore focus to after a redraw */

/* mount() paints inside a rAF, so the focus restore has to be queued behind it.
   Without this, every chip toggle drops a keyboard user back to the top of the
   document — the redraw is the whole page. */
function redraw(){
  mount(current);
  const key = refocus; refocus = null;
  if (!key) return;
  const apply = () => { const el = stage.querySelector(key); if (el) el.focus(); };
  if (document.hidden) setTimeout(apply, 0); else requestAnimationFrame(apply);
}

stage.addEventListener('click', e => {
  const chip = e.target.closest('.chip[data-facet]');
  if (chip){
    const key = chip.getAttribute('data-facet'), val = chip.getAttribute('data-value');
    sel[key].has(val) ? sel[key].delete(val) : sel[key].add(val);
    refocus = `.chip[data-fk="${CSS.escape(key + "|" + val)}"]`;
    redraw();
    return;
  }
  const clear = e.target.closest('[data-clear]');
  if (clear){ AXES.forEach(a => sel[a[0]].clear()); redraw(); return; }

  const copy = e.target.closest('[data-copy]');
  if (copy){
    const r = byId(copy.getAttribute('data-copy'));
    confirmCopy(copy, r ? r.prompt : "");
    return;
  }
  const copyc = e.target.closest('[data-copycomposer]');
  if (copyc){ confirmCopy(copyc, composer); return; }

  const tog = e.target.closest('[data-toggle]');
  if (tog){
    const id = tog.getAttribute('data-toggle');
    open.has(id) ? open.delete(id) : open.add(id);
    refocus = `[data-toggle="${CSS.escape(id)}"]`;
    redraw();
    return;
  }
  const st = e.target.closest('[data-stage]');
  if (st){
    const r = byId(st.getAttribute('data-stage'));
    if (r){ staged = r.id; composer = r.prompt; }
    refocus = '[data-composer]';
    redraw();
    return;
  }
  const sort = e.target.closest('[data-sort]');
  if (sort){
    const key = sort.getAttribute('data-sort');
    if (sortKey === key) sortDir = -sortDir;
    else { sortKey = key; sortDir = (key === "likes" || key === "len") ? -1 : 1; }
    refocus = `[data-sort="${CSS.escape(key)}"]`;
    redraw();
  }
});

stage.addEventListener('input', e => {
  if (!e.target.matches('[data-composer]')) return;
  composer = e.target.value; staged = null;
  /* Update the hint in place. A redraw here would eat the caret on every keypress. */
  const hint = e.target.closest('.genbox')?.querySelector('.genhint');
  if (hint) hint.textContent = composer.length
    ? n(composer.length) + ' characters in the box'
    : 'Empty. Generation happens in bo; this page hands you the words.';
});

function confirmCopy(btn, text){
  const label = btn.getAttribute('data-label') || btn.textContent.trim();
  btn.setAttribute('data-label', label);
  const done = () => {
    btn.textContent = 'Copied';
    btn.setAttribute('data-copied', '');
    setTimeout(() => { btn.textContent = label; btn.removeAttribute('data-copied'); }, 1500);
  };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, done); else done();
}
</script>

<script>
/* ─── Picker wiring · from PICKER.md. One addition: rAF never fires while the
   document is hidden, so a page opened in a background tab would stay blank
   until it got focus; the timeout keeps that case rendering. ───────────── */
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  const paint = () => { stage.innerHTML = variants[i](); };
  if (document.hidden) setTimeout(paint, 0);
  else requestAnimationFrame(paint);
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>

<script>
/* ─── Theme toggle wiring · harness-only, does not touch the picker's own
   script. The baseline (variant 1) is a same-origin `srcdoc` iframe; a
   parent stylesheet cannot reach into it, so this reaches in directly on
   every #stage mutation (the picker's mount() does `stage.innerHTML = ''`
   then repaints, which is itself a mutation this observer catches).

   A `srcdoc` iframe briefly exposes an interim `about:blank` document whose
   `readyState` already reads "complete" before the real srcdoc navigation
   lands — checking readyState alone catches that placeholder and themes a
   document that's about to be discarded, silently losing the change. Also
   requiring `doc.URL !== 'about:blank'` before treating the frame as loaded,
   and always arming a `load` listener regardless, avoids that trap. ────── */
(() => {
  const html = document.documentElement;
  const toggleEl = document.getElementById('theme-toggle');
  const stageEl = document.getElementById('stage');
  const themeStyleText = document.getElementById('linear-dark-theme').textContent;

  function isDark() { return html.dataset.theme === 'linear-dark'; }

  function reflectToggle() {
    toggleEl.setAttribute('aria-pressed', String(isDark()));
  }

  function applyToFrame(iframe) {
    try {
      const doc = iframe.contentDocument;
      if (!doc || !doc.documentElement) return;
      if (isDark()) {
        doc.documentElement.dataset.theme = 'linear-dark';
        if (!doc.getElementById('linear-dark-theme')) {
          const style = doc.createElement('style');
          style.id = 'linear-dark-theme';
          style.textContent = themeStyleText;
          if (doc.head) doc.head.appendChild(style);
        }
      } else {
        delete doc.documentElement.dataset.theme;
      }
    } catch (err) { /* cross-origin or detached frame; nothing to do */ }
  }

  function themeFrame(iframe) {
    try {
      const doc = iframe.contentDocument;
      const isLoaded = doc && doc.readyState === 'complete' && doc.URL !== 'about:blank';
      if (isLoaded) applyToFrame(iframe);
      iframe.addEventListener('load', () => applyToFrame(iframe), { once: true });
    } catch (err) { /* cross-origin; nothing to do */ }
  }

  function themeAllFrames() {
    stageEl.querySelectorAll('iframe').forEach(themeFrame);
  }

  function setTheme(dark) {
    if (dark) html.dataset.theme = 'linear-dark';
    else delete html.dataset.theme;
    reflectToggle();
    const url = new URL(location);
    if (dark) url.searchParams.set('theme', 'linear-dark');
    else url.searchParams.delete('theme');
    history.replaceState(null, '', url);
    themeAllFrames();
  }

  toggleEl.addEventListener('click', () => setTheme(!isDark()));

  new MutationObserver(themeAllFrames).observe(stageEl, { childList: true, subtree: true });

  setTheme(new URLSearchParams(location.search).get('theme') === 'linear-dark');
})();
</script>
