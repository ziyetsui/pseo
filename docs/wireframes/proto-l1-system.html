<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt library L1 — the page as a designed system</title>

<style>
/* ─── Real materials: tokens lifted from the wireframe ──────────────────
   Two alphas are deliberately NOT verbatim — see the contrast note on
   --muted / --faint below. Everything else is the shipped token block. */
:root{
  color-scheme: light dark;
  --background: light-dark(rgb(255 255 255), rgb(22 22 24));
  --surface: light-dark(rgb(250 250 251), rgb(28 28 31));
  --foreground: light-dark(rgb(24 26 29), rgb(250 250 252));
  /* DIVERGENCE from the shared token block, and the only one.
     The shipped alphas are --muted 56% and --faint 38%. Composited on white
     those measure 4.02:1 and 2.38:1 — both are spent on real text here
     (16.5px deks, 13px footer links, 11px mono captions), so both are below
     the 4.5:1 floor this round is verified against, and --faint is badly
     below it. Lifted to 70% / 62% => 6.55:1 and 4.88:1, measured. Lightness
     only: same hue, same ink, no saturation added, dark branch lifted to
     match. The dark THEME sets --faint outright (#8a8f98, 6.13:1) and
     deliberately leaves --muted alone, so this only governs light mode and
     un-themed dark. Cost, stated: the light ink ladder tightens from
     18.7 / 4.0 / 2.4 to 18.7 / 6.6 / 4.9 — three steps that used to be far
     apart now sit closer together, and the faintest caption reads heavier
     than the shipped page's. That is the price of the floor. */
  --muted: light-dark(rgb(24 26 29 / 70%), rgb(250 250 252 / 70%));
  --faint: light-dark(rgb(24 26 29 / 62%), rgb(250 250 252 / 62%));
  --card: light-dark(rgb(255 255 255), rgb(32 32 36));
  --border: light-dark(rgb(24 26 29 / 11%), rgb(255 255 255 / 13%));
  --border-strong: light-dark(rgb(24 26 29 / 20%), rgb(255 255 255 / 24%));
  --accent: light-dark(rgb(51 126 255), rgb(131 180 255));
  --ok: light-dark(rgb(0 133 61), rgb(74 200 124));
  /* One token for the inset image hairline, picked up by light-dark() itself,
     so the no-image placeholder gets the same treatment as a real <img>. */
  --img-outline: light-dark(rgb(0 0 0 / .1), rgb(255 255 255 / .1));
  /* --ok is lifted bright enough in dark to work as 11px caption text, which
     makes it too light to carry white text on top of it. Near-black on the
     fill in dark (9.0:1), white in light (4.75:1). */
  --ok-fg: light-dark(#fff, #08090a);
  /* Inter Variable, because the tone this round is chasing is not reachable
     without it: the Linear survey measures weights 510 and 590, and a system
     stack snaps those to 500/600 — its own note says that "changes the tone".
     Loaded from a CDN with the platform stack behind it and font-synthesis
     off, so a failed load shows up as an obvious regression rather than a
     faked bold. This is a PROTOTYPE dependency: frontend/AGENTS.md §7.6 has
     not ruled on a web font for production. */
  --font-sans: "InterVariable", -apple-system, system-ui, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  /* The one addition: a system serif, no web font, for the display register. */
  --font-serif: ui-serif, Georgia, "Times New Roman", serif;
  --r: 12px; --wrap: 1160px;
  /* Retina hairline for the lines that separate rather than elevate. */
  --hairline: 1px;
  /* One z scale; nothing invents its own number. */
  --z-cell: 1; --z-sticky: 40; --z-skip: 99;
}
@media only screen and (min-resolution: 192dpi){ :root{ --hairline: .5px } }

/* ─── Measured from the Linear survey (specs/images/linear-design-token-
   reference.md, 29 routes). Not invented, and not a full design system. ─── */
@font-face{
  font-family:"InterVariable";
  font-style:normal;
  font-weight:100 900;
  font-display:swap;
  src:url("https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/files/inter-latin-wght-normal.woff2") format("woff2");
}
:root{
  /* Variable weights. 510 and 590 are the point; 400 stays the text weight. */
  --w-text:400; --w-medium:510; --w-semi:590;
  /* Container ladder: 1436 = 1344 homepage frame + 46px gutters either side. */
  --w-wide:1436px; --w-page:1024px; --w-prose:624px;
  /* Motion. Four durations, three easings — nothing else. */
  --t-quick:100ms; --t-regular:250ms; --t-out:150ms;
  --e-out:cubic-bezier(.25,.46,.45,.94);
  --e-emphatic:cubic-bezier(.23,1,.32,1);
  --e-structural:cubic-bezier(.455,.03,.515,.955);
  /* Light-mode elevation ladder. Dark collapses to a ring (theme block). */
  --sh-tiny:0 1px 1px #00000017;
  --sh-low:0 1px 4px -1px #00000017;
  --sh-med:0 3px 12px #00000017;
  --sh-high:0 7px 24px #0000000f;
}
/* cv01 opens the digits, ss03 the alternate letterforms — both are what
   aiforui.dev enables on its own Inter. */
body{font-feature-settings:"cv01","ss03";font-synthesis:none}

/* The H1 tier ladder: size is a function of the page's rank in the site, not
   of its content. Chapters and Frame present as flagship pages (64); Stream
   and Matrix present as index pages (48), which is the tier Linear's own
   /changelog and /customers sit on. Tracking is a uniform −0.022em. */
.tier-flagship{font-size:clamp(38px,5vw,64px);font-weight:var(--w-medium);
  line-height:1;letter-spacing:-.022em;text-wrap:balance}
.tier-index{font-size:clamp(32px,3.6vw,48px);font-weight:var(--w-medium);
  line-height:1;letter-spacing:-.022em;text-wrap:balance}
.tier-ref{font-size:clamp(28px,2.8vw,40px);font-weight:var(--w-medium);
  line-height:1.1;letter-spacing:-.022em;text-wrap:balance}

/* The header is 72px + a 1px hairline and its background is fully
   transparent — the translucency is entirely backdrop-filter. */
.taste .nav{background:transparent;backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.taste .nav .wrap{min-height:72px;max-width:var(--w-wide)}
.taste .wrap{max-width:var(--w-wide)}
.taste .prose{max-width:var(--w-prose)}
.taste .eyebrow{font:var(--w-semi) 11px/1.5 var(--font-mono);letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint)}


*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
body{margin:0;background:var(--background);color:var(--foreground);
     font-family:var(--font-sans);font-size:15px;line-height:1.6;
     -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
     font-synthesis:none;overflow-x:hidden}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p,figure{margin:0}
button,a,input,select,textarea{touch-action:manipulation}
:focus-visible{outline:2px solid var(--foreground);outline-offset:2px;border-radius:5px}
[id]{scroll-margin-top:88px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 28px}
.skip{position:absolute;left:-9999px;background:var(--foreground);color:var(--background);
      padding:10px 14px;z-index:var(--z-skip);border-radius:8px}
.skip:focus{left:12px;top:12px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* Every image carries the same inset hairline; never a tinted neutral. */
img{outline:1px solid var(--img-outline);outline-offset:-1px}

/* ─── Shared chrome ─────────────────────────────────────────────────────── */
.nav{border-bottom:var(--hairline) solid var(--border);background:var(--background);
     position:sticky;top:0;z-index:var(--z-sticky)}
.nav .wrap{display:flex;align-items:center;gap:22px;min-height:58px;flex-wrap:wrap}
.brand{font-weight:var(--w-semi);letter-spacing:-.02em;font-size:16px;margin-right:auto}
.navlinks{display:flex;gap:20px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.navlinks a{transition-property:color;transition-duration:var(--t-out);transition-timing-function:var(--e-out);
            display:inline-flex;align-items:center;min-height:44px}
@media (hover:hover) and (pointer:fine){ .navlinks a:hover{color:var(--foreground)} }

h1{font-size:clamp(30px,4.6vw,46px);line-height:1.08;letter-spacing:-.035em;
   font-weight:var(--w-semi);text-wrap:balance}
h2{font-size:23px;line-height:1.25;letter-spacing:-.025em;font-weight:var(--w-semi);text-wrap:balance}
.dek{color:var(--muted);font-size:16.5px;max-width:62ch;margin-top:14px;text-wrap:pretty}
.sec{padding-block:52px;border-top:var(--hairline) solid var(--border)}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.eyebrow{font:var(--w-semi) 11px/1.5 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;
         color:var(--faint);margin-bottom:10px}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
     min-height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--border);
     background:var(--card);color:var(--foreground);font:inherit;font-size:13.5px;
     cursor:pointer;position:relative;
     transition-property:background-color,border-color,color;
     transition-duration:var(--t-out);transition-timing-function:var(--e-out)}
/* Small controls keep a 44px hit area without growing visually. */
.btn::after{content:"";position:absolute;inset:-4px}
.btn:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){ .btn:hover{border-color:var(--border-strong)} }
.btn.pri{background:var(--foreground);color:var(--background);border-color:var(--foreground)}
.btn[data-copied]{color:var(--ok)}
.btn.pri[data-copied]{background:var(--ok);border-color:var(--ok);color:var(--ok-fg)}

.search{display:flex;gap:8px;align-items:center;border:1px solid var(--border);
        border-radius:14px;padding:7px;background:var(--card);max-width:620px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--foreground);
              font:16px var(--font-sans);padding:9px 11px;outline:none}
@media (min-width:768px){ .search input{font-size:15px} }
.search input::placeholder{color:var(--faint)}

.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 11px;
      border-radius:999px;border:1px solid var(--border);background:var(--card);
      color:var(--muted);font:inherit;font-size:13px;cursor:pointer;position:relative;
      transition-property:background-color,border-color,color;
      transition-duration:var(--t-out);transition-timing-function:var(--e-out)}
.chip::after{content:"";position:absolute;inset:-5px}
.chip:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){ .chip:hover{color:var(--foreground);border-color:var(--border-strong)} }
.chip[aria-pressed="true"]{background:var(--foreground);color:var(--background);border-color:var(--foreground)}
.chip small{font:11px/1 var(--font-mono);font-variant-numeric:tabular-nums;opacity:.75}

.meta{font:11.5px/1.6 var(--font-mono);color:var(--faint);
      font-variant-numeric:tabular-nums;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.meta b{font-weight:var(--w-medium);color:var(--muted)}
.kbd{font:10px/1 var(--font-mono);border:1px solid var(--border);border-radius:4px;
     padding:3px 4px;color:var(--faint)}

/* Empty state — sized like the filled state so nothing jumps. */
.empty{border:1px dashed var(--border-strong);border-radius:var(--r);padding:44px 28px;
       text-align:center;min-height:220px;display:flex;flex-direction:column;
       align-items:center;justify-content:center;gap:10px}
.empty b{font-size:16px;font-weight:var(--w-semi)}
.empty p{color:var(--muted);font-size:14px;max-width:44ch;text-wrap:pretty}

/* Images / Videos — the first fork, two tiles at half a row each. Flex, not a
   fixed 2-col grid: with exactly two items this never shows a hole, but it
   uses the same mechanism as .tiles below so the technique is one thing, not
   two, across the page. */
.cat{display:flex;flex-wrap:wrap;gap:16px}
.cat .tile{flex:1 1 320px}
.cta{padding-block:60px 66px;border-top:var(--hairline) solid var(--border);text-align:center}
.cta h2{font-size:clamp(26px,3.4vw,34px);letter-spacing:-.03em}
.cta p{color:var(--muted);margin:10px auto 20px;max-width:46ch;text-wrap:pretty}

/* Shared browse bands + creators (the crawl surface, identical in all five).
   A fixed 4-col grid leaves a hole whenever a band's item count isn't a
   multiple of the column count (7 tasks, 6 styles → a lone short row) — real
   categories, not filler, so the count can't be padded away. Flex-wrap with
   flex-grow instead: each tile has the same basis, so rows still read as a
   grid at any width, but flex-grow distributes the leftover space among
   whatever tiles land in the final row — including a row of one — so the row
   always fills edge to edge. No column count is fixed anywhere, so this holds
   at every breakpoint without extra media queries. */
.tiles{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.tiles .tile{flex:1 1 250px}
.tile{border:1px solid var(--border);border-radius:var(--r);background:var(--card);
      overflow:hidden;display:flex;flex-direction:column;
      transition-property:border-color;transition-duration:var(--t-out);transition-timing-function:var(--e-out)}
@media (hover:hover) and (pointer:fine){ .tile:hover{border-color:var(--border-strong)} }
.tile .th{flex:none;display:block;width:100%;aspect-ratio:16/10;background:var(--surface);overflow:hidden}
.tile .th img{width:100%;height:100%;object-fit:cover;display:block}
/* Inner radius = outer − padding, so the corner gap stays even. */
.tile .tb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px}
.tile h3{font-size:15px;font-weight:var(--w-semi);letter-spacing:-.01em;line-height:1.3}
.tile p{font:11.5px/1.5 var(--font-mono);color:var(--faint);font-variant-numeric:tabular-nums}
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.person{border:1px solid var(--border);border-radius:var(--r);background:var(--card);
        padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;
        transition-property:border-color;transition-duration:var(--t-out);transition-timing-function:var(--e-out)}
@media (hover:hover) and (pointer:fine){ .person:hover{border-color:var(--border-strong)} }
.person .av{width:34px;height:34px;border-radius:50%;background:var(--surface);overflow:hidden;flex:none}
.person .av img{width:100%;height:100%;object-fit:cover;display:block;outline:none}
.person b{font-size:14.5px;font-weight:var(--w-semi)}
.person span{font:11px/1.5 var(--font-mono);color:var(--faint);font-variant-numeric:tabular-nums}

footer.foot{border-top:var(--hairline) solid var(--border);padding-block:34px 26px;margin-top:8px}
.footnav{display:grid;gap:26px 20px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
         margin-bottom:28px}
.footnav h3{font:var(--w-semi) 10.5px/1.5 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;
            color:var(--faint);margin:0 0 9px}
.footnav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.footnav a{color:var(--muted);font-size:13px;display:flex;align-items:center;min-height:40px;
           transition-property:color;transition-duration:var(--t-out);transition-timing-function:var(--e-out)}
@media (hover:hover) and (pointer:fine){ .footnav a:hover{color:var(--foreground);text-decoration:underline;
  text-decoration-thickness:from-font;text-underline-offset:2px} }
.footlegal{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;
           padding-top:16px;border-top:var(--hairline) solid var(--border);
           font:11.5px/1.6 var(--font-mono);color:var(--faint)}

/* The nav wraps to two rows on a phone, so a bar pinned at 58px would sit on
   top of it. Below the wrap point nothing is sticky but the bars themselves. */
@media (max-width:700px){ .nav{position:static} }
/* .tiles and .cat reflow on their own via flex-basis; only .people (which
   stayed a fixed grid — every band it renders is a multiple of 4) still
   needs explicit column steps. */
@media (max-width:900px){ .people{grid-template-columns:repeat(2,1fr)} }
@media (max-width:560px){ .people{grid-template-columns:1fr} }

/* ══ V1 · Chapters — the page as a sequenced argument ═══════════════════
   Linear's product-chapter rhythm: index numeral → concise headline → one
   line of copy → a visualisation built for THAT chapter. Continuous canvas,
   full-width hairline dividers, no bento cards. */
.vch .chapter{border-top:1px solid var(--border);padding-block:76px}
.vch .chapter:first-of-type{border-top:0}
.vch .chead{display:grid;grid-template-columns:64px minmax(0,1fr);gap:0 24px;
  align-items:start;margin-bottom:38px}
.vch .idx{font:var(--w-medium) 12px/1.6 var(--font-mono);color:var(--faint);
  letter-spacing:.09em;padding-top:.7em}
.vch .chead h2{font-size:clamp(30px,3.4vw,44px);font-weight:var(--w-medium);
  line-height:1.02;letter-spacing:-.022em}
.vch .chead p{color:var(--muted);font-size:16px;margin-top:14px;max-width:52ch;
  text-wrap:pretty}
/* Each axis gets a visualisation built for it, not a third tile grid. */
.vch .rank{display:grid;gap:1px;background:var(--border);border-block:1px solid var(--border)}
.vch .rankrow{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:18px;
  align-items:center;background:var(--background);padding-block:13px;min-height:56px}
.vch .rankrow .lab{display:flex;align-items:baseline;gap:11px;min-width:0}
.vch .rankrow .lab b{font-weight:var(--w-medium);font-size:15.5px;letter-spacing:-.011em}
.vch .rankrow .lab span{font:11.5px/1 var(--font-mono);color:var(--faint);
  font-variant-numeric:tabular-nums}
.vch .bar{height:3px;border-radius:999px;background:var(--border-strong);
  transform-origin:left;transition-property:transform;
  transition-duration:var(--t-regular);transition-timing-function:var(--e-emphatic)}
@media (prefers-reduced-motion: reduce){ .vch .bar{transition-duration:0ms} }
.vch .rankrow .fig{width:96px;height:64px;border-radius:5px;overflow:hidden;
  background:var(--surface);justify-self:end}
.vch .rankrow .fig img{width:100%;height:100%;object-fit:cover;display:block}
.vch .plate{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
  gap:1px;background:var(--border);border:1px solid var(--border);border-radius:8px;
  overflow:hidden}
.vch .plate a{background:var(--background);padding:14px 15px 16px;display:flex;
  flex-direction:column;gap:7px;min-height:132px;
  transition-property:background-color;transition-duration:var(--t-quick);
  transition-timing-function:var(--e-out)}
@media (hover:hover) and (pointer:fine){ .vch .plate a:hover{background:var(--surface)} }
.vch .plate .sw{height:44px;border-radius:4px;overflow:hidden;background:var(--surface)}
.vch .plate .sw img{width:100%;height:100%;object-fit:cover;display:block}
.vch .plate b{font-weight:var(--w-medium);font-size:14px;letter-spacing:-.008em}
.vch .plate span{font:11px/1 var(--font-mono);color:var(--faint);
  font-variant-numeric:tabular-nums}
.vch .results{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}
.vch .card{display:flex;flex-direction:column;gap:9px;min-width:0}
.vch .card .sh{aspect-ratio:4/3;border-radius:5px;overflow:hidden;background:var(--surface)}
.vch .card .sh img{width:100%;height:100%;object-fit:cover;display:block}
.vch .card h3{font-size:14.5px;font-weight:var(--w-medium);line-height:1.3;
  letter-spacing:-.008em}
@media (max-width:700px){ .vch .chead{grid-template-columns:1fr;gap:6px}
  .vch .idx{padding-top:0} .vch .chapter{padding-block:52px} }

/* ══ V2 · Method — the editorial exception ══════════════════════════════
   Linear's /method is the one page that leaves the system: serif, 128px,
   weight 400, line-height 1.0, tracking NORMAL (the only page that opts out
   of negative tracking), centred, on a 410px measure. The lesson the survey
   draws is not "add a serif" — it is that the system reserves one face and
   one page for the argument about beliefs rather than features, and spends
   nothing else on it. So: this variant argues why the library exists, and
   the library itself arrives underneath the argument, in the plain system. */
.vme .argument{padding-block:112px 96px;text-align:center}
.vme .argument h1{font-family:var(--font-serif);font-size:clamp(46px,9vw,128px);
  font-weight:400;line-height:1;letter-spacing:normal;text-wrap:balance;
  max-width:14ch;margin:0 auto}
.vme .argument .body{max-width:410px;margin:38px auto 0;text-align:left}
.vme .argument .body p{font-size:17px;line-height:1.6;letter-spacing:normal;
  color:var(--muted);text-wrap:pretty}
.vme .argument .body p + p{margin-top:1.6em}
.vme .argument .body em{font-family:var(--font-serif);font-style:italic;
  color:var(--foreground)}
.vme .argument .sig{margin:38px auto 0;max-width:410px;text-align:left;
  font:11.5px/1.6 var(--font-mono);color:var(--faint)}
.vme .after{border-top:1px solid var(--border)}
.vme .lede{padding-block:56px 26px}
.vme .rows{border-top:1px solid var(--border)}
.vme .row{display:grid;grid-template-columns:52px minmax(0,1fr) 132px;gap:20px;
  align-items:center;padding-block:14px;min-height:74px;
  border-bottom:1px solid var(--border)}
.vme .row .th{width:52px;height:52px;border-radius:4px;overflow:hidden;background:var(--surface)}
.vme .row .th img{width:100%;height:100%;object-fit:cover;display:block}
.vme .row h3{font-size:15.5px;font-weight:var(--w-medium);line-height:1.3;
  letter-spacing:-.011em}
.vme .row .meta{margin-top:3px}
.vme .row .act{justify-self:end}
@media (max-width:700px){
  .vme .argument{padding-block:64px 56px}
  .vme .row{grid-template-columns:44px minmax(0,1fr);gap:14px}
  .vme .row .act{grid-column:2;justify-self:start}
}

/* ══ V3 · Frame — the product inside a simulated application frame ══════
   Linear shows the product in a wide app frame rather than an abstract
   illustration: measured ~1320×720, 8px frame padding, 232px sidebar, 12px
   outer radius, 6px inner, frame #101112, app #090a0b, border #ffffff14.
   Those exact darks are Linear's canvas; here the frame follows the page's
   own ladder so it works in both themes, and keeps the measured geometry. */
.vfr .stage{padding-block:56px 72px}
.vfr .frame{border-radius:12px;padding:8px;background:var(--surface);
  border:1px solid var(--border);box-shadow:var(--sh-high)}

  border:1px solid var(--border);display:grid;grid-template-columns:232px minmax(0,1fr);

.vfr .side .opt[aria-pressed="true"]{background:var(--card);color:var(--foreground)}

.vfr .apphead .ff{flex:1 1 200px;min-width:0;display:flex;align-items:center;

/* ══ V4 · Stream — the changelog treatment ══════════════════════════════
   Linear's /changelog turns product velocity into proof: a reverse-ordered
   run of compact entries, each with a metadata rail in mono beside the body,
   hairline-separated, no cards. The analogue here is exact except for the
   key — this library has no release dates and inventing them is forbidden,
   so the stream is keyed on likes on the source post, which is real data.
   The consequence is the point: an entry is big enough to hold the PROMPT
   TEXT, so this is the only direction where the index shows the product
   itself rather than a picture of its output. */
/* The stream is "generic content" in the survey's container ladder, so it sits
   at --w-page (1024) rather than the 1436 wide frame — the same step Linear's
   own /changelog takes. Only max-width, never a padding shorthand: .wrap
   carries the 28px gutter and a shorthand here would flush it to the edge.
   The crawl surface below stays wide; the width change is the register change. */
.vst .head,.vst .ctrl,.vst #results{max-width:calc(var(--w-page) + 56px)}
.vst .head{padding-block:76px 34px}
.vst .ctrl{padding-block:0 30px}
.vst .stream{border-top:1px solid var(--border)}
.vst .entry{display:grid;grid-template-columns:190px minmax(0,1fr);gap:0 36px;
  padding-block:36px;border-bottom:1px solid var(--border)}
.vst .rail{position:sticky;top:96px;align-self:start;display:flex;
  flex-direction:column;gap:14px}
.vst .rail .no{font:var(--w-medium) 12px/1 var(--font-mono);letter-spacing:.09em;
  color:var(--faint);font-variant-numeric:tabular-nums}
.vst .kv{margin:0;display:flex;flex-direction:column;gap:7px}
.vst .kv > div{display:flex;gap:10px;justify-content:space-between;align-items:baseline}
.vst .kv dt{font:11px/1.4 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);flex:none}
.vst .kv dd{margin:0;font:11.5px/1.4 var(--font-mono);color:var(--muted);
  font-variant-numeric:tabular-nums;text-align:right;min-width:0;overflow-wrap:break-word}
/* One measure for the whole entry body. Left unbounded the prompt ran ~1070px
   of 12.5px mono — about 140 characters a line, twice any sane code measure —
   and the headline, the frames and the actions each found a different edge.
   660px is ~88ch of this mono and ~72ch of the sans, and it gives the entry
   one left rag and one right rag instead of four. */
.vst .body{min-width:0;max-width:660px}
.vst .body h3{font-size:clamp(20px,2.1vw,26px);font-weight:var(--w-medium);
  line-height:1.14;letter-spacing:-.022em;text-wrap:balance}
.vst .body .chars{margin-top:8px;font:11.5px/1.5 var(--font-mono);color:var(--faint);
  font-variant-numeric:tabular-nums}
.vst .frames{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.vst .frames img{width:148px;height:111px;object-fit:cover;border-radius:5px;display:block}
/* The prompt itself, clamped to seven lines until it is asked to open. A
   4,989-character prompt is not a layout accident to hide; it is the record. */
.vst .txt{margin-top:18px;font:12.5px/1.75 var(--font-mono);color:var(--muted);
  white-space:pre-wrap;overflow-wrap:break-word;
  display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.vst .entry[data-open] .txt{display:block;-webkit-line-clamp:none}
/* [BRACKET] placeholders are marked structurally, never with a colour: the
   only saturated colour on this page belongs to the results. */
.vst mark{background:color-mix(in oklab, var(--foreground) 9%, transparent);
  color:var(--foreground);border-radius:4px;padding:1px 4px;
  box-shadow:inset 0 0 0 1px var(--border)}
.vst .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px}
@media (max-width:820px){
  .vst .entry{grid-template-columns:1fr;gap:16px}
  .vst .rail{position:static;flex-direction:row;flex-wrap:wrap;gap:8px 18px;align-items:baseline}
  .vst .kv{flex-direction:row;flex-wrap:wrap;gap:8px 18px}
  .vst .kv dd{text-align:left}
  .vst .frames img{width:118px;height:89px}
}

/* ══ V5 · Matrix — the diagram treatment ════════════════════════════════
   Linear's chapters lean on precise, purpose-built diagrams rather than
   stock illustration, and the survey's core note is that hierarchy comes
   from small luminance shifts, not outlines or fills. So the taxonomy is
   drawn once, as a two-dimensional plate: models down, tasks across, cell
   shade = how many prompts sit at that intersection. Navigation is the
   diagram — a cell sets both facets at once, a header sets one. It is also
   the only direction that shows what the library does NOT have. */
.vmx .head{padding-block:76px 30px}

.vmx thead th.corner{width:190px;min-width:190px;position:sticky;left:0;

  padding:10px 12px;
  transition-property:background-color,color;transition-duration:var(--t-quick);
  transition-timing-function:var(--e-out)}
.vmx tbody .hbtn{font-size:14px;font-weight:var(--w-medium);letter-spacing:-.009em;
  min-height:54px}
.vmx .hbtn em{font-style:normal;font:11px/1 var(--font-mono);color:var(--faint);
  font-variant-numeric:tabular-nums;margin-left:auto}
@media (hover:hover) and (pointer:fine){ .vmx .hbtn:hover{background:var(--surface)} }
.vmx .hbtn[aria-pressed="true"]{background:var(--foreground);color:var(--background)}
.vmx .hbtn[aria-pressed="true"] em{color:var(--background);opacity:.75}

  transition-timing-function:var(--e-out)}
@media (hover:hover) and (pointer:fine){

.vmx .cel[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--foreground)}
.vmx .nil{display:flex;min-height:54px;align-items:center;justify-content:center;
  color:var(--faint);font:12px/1 var(--font-mono)}
.vmx .legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding-block:14px 0;font:11.5px/1.6 var(--font-mono);color:var(--faint)}
.vmx .legend .ramp{display:flex;gap:2px}
.vmx .legend .ramp i{width:22px;height:12px;border-radius:2px;
  background:color-mix(in oklab, var(--foreground) var(--d,0%), transparent);
  box-shadow:inset 0 0 0 1px var(--border)}
.vmx .sel{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;
  padding-block:34px 16px}
.vmx .sel h2{font-size:20px;font-weight:var(--w-medium);letter-spacing:-.015em}
.vmx .out{display:grid;grid-template-columns:repeat(auto-fill,minmax(182px,1fr));gap:18px}

  position:relative}

<style id="linear-dark-theme">
/* ─────────────────────────────────────────────────────────────────────────
   Linear-derived dark theme for the prototype pickers.

   Values come from the token snapshot at
   `specs/images/linear-design-tokens.css` (Linear public-site CSS, snapshot
   2026-09-03), not from memory. This is a COLOUR re-theme only: type and
   geometry stay on the project's own system, because `frontend/AGENTS.md` §7.6
   has not ruled on a web font and Linear's faces (Inter Variable, Berkeley
   Mono, Tiempos Headline) are not licensed here. Weights stay 400/600.

   The four pickers were written at different times and use three different
   token vocabularies (`--background`/`--bg`, `--foreground`/`--fg`,
   `--muted`/`--muted-fg`, `--faint`/`--faint-fg`, `--font-sans`/`--sans`).
   Every unambiguous alias is set, so one block themes all four — see the
   note on `--muted` below for the one token deliberately skipped.

   Contrast, measured against the canvas ladder (WCAG 2, sRGB):

     token                 #08090a  #0f1011  #141516  #191a1b
     --foreground #f7f8f8    18.73    17.90    17.18    16.38
     --muted-fg   #d0d6e0    13.64    13.04    12.52    11.93
     --faint      #8a8f98     6.13     5.86     5.63     5.36
     --accent     #7170ff     5.18     4.96     4.76     4.53
     --ok         #4cc38a     9.00     8.60     8.25     7.87
     white on brand fill #5e6ad2 …………………………………………………… 4.70

   Three deliberate departures from Linear's own dark tokens, each because a
   token Linear uses decoratively is used here as text:

   1. `--faint` takes Linear's TERTIARY ink `#8a8f98`, not its quaternary
      `#62666d`. Quaternary measures 3.45:1 — below the 4.5:1 floor — and this
      project spends `--faint` on 11px mono captions, which is text.
   2. `--accent` takes `#7170ff`, NOT the `#5252f5` that `frontend/CLAUDE.md`
      mandates. That mandate is a LIGHT-mode repair: `#7070ff` fails AA on all
      four light surfaces (3.30–3.85) and `#5252f5` fixes it. Inverted, the
      rule inverts too — `#5252f5` measures 3.69:1 on `#08090a` and would be
      the unreadable one. Same intent, opposite value.
   3. `--ok` lifts Linear's `#27a644` to `#4cc38a`. Per the `color` skill,
      brand colours carried into dark at full saturation vibrate; lightness
      goes up and chroma comes down. It also buys 6.29:1 → 9.00:1 at 11px.
   ───────────────────────────────────────────────────────────────────────── */

:root[data-theme="linear-dark"] {
  color-scheme: dark;

  /* Canvas ladder — level-0 is the page, level-1 insets, level-2 cards.
     Dark mode keeps the layering hierarchy; it is not inverted light mode. */
  --background: #08090a;  --bg: #08090a;
  --surface:    #0f1011;
  --card:       #141516;

  /* Ink */
  --foreground: #f7f8f8;  --fg: #f7f8f8;
  /* --muted is deliberately NOT set. It is ink in L1/L4 but a translucent
     SURFACE wash in L2/L3 (`color-mix(in srgb, var(--fg) 8%, transparent)`,
     used only for avatar and media placeholders). Forcing one ink value here
     painted light-grey boxes onto a near-black canvas in L3. Every file's own
     definition self-corrects once --fg/--foreground flip and color-scheme is
     dark, so the token is left alone on purpose. --muted-fg is unambiguous
     ink and is set. */
  --muted-fg: #d0d6e0;
  --faint:      #8a8f98;  --faint-fg: #8a8f98;

  /* Lines. Linear's dark borders are solid, not alpha-white — a translucent
     white hairline glows on near-black instead of receding. */
  --border:        #23252a;
  --border-strong: #34343a;

  /* Interaction. Indigo carries interaction semantics only: focus, links,
     ::selection, and the single primary action per view. */
  --accent:    #7170ff;
  --accent-bg: #1b1c33;

  /* The inverted button: Linear's own --color-button-invert-bg. */
  --primary:    #e5e5e6;
  --primary-fg: #08090a;

  /* Status */
  --ok:   #4cc38a;
  --cand: #f0bf00;

  /* L4's placeholder highlight, on Linear's orange */
  --var-bg: #2a1a12;
  --var-fg: #fc9a6e;
}

/* The prototypes gate their dark-mode image outline on `prefers-color-scheme`,
   which does not fire when the theme is forced by attribute. A tinted outline
   picks up the surface behind it and reads as grime, so it must be pure white. */
:root[data-theme="linear-dark"] img { outline-color: rgb(255 255 255 / .1); }

/* Selection carries the brand quietly and stays legible. */
:root[data-theme="linear-dark"] ::selection {
  background: color-mix(in oklab, #5e6ad2, black 10%);
  color: #fff;
}

/* Depth: on dark, a stacked shadow is invisible, so every elevation collapses
   to a single low-opacity white ring. */
:root[data-theme="linear-dark"] [data-elevated] {
  box-shadow: 0 0 0 1px rgb(255 255 255 / .09);
}
</style>

exture. 85mm for detail. 50mm for natural perspective. 35mm for environmental shots. Controlled dolly and crane movements. Realistic depth of field. Natural focus transitions. Soft motion blur. Subtle lens imperfections. No artificial camera shake. MATERIAL DIRECTION Every surface must visibly behave like physical paper. Visible paper fibers. Natural folds. Tiny imperfections. Soft cardboard edges. Realistic contact shadows. Believable paper thickness. Natural material deformation. LIGHTING Soft morning daylight. Large window as the primary source. Natural bounce light. Gentle shadows. Subtle warm highlights. No artificial neon effects. No excessive visual effects. CONTINUITY The same paper city throughout the entire sequence. Buildings maintain identical shapes and positions. Roads remain connected. Paper materials remain consistent. No random transformations. No flickering. No duplicated structures. No sudden environmental changes. DIRECTOR’S NOTE Treat this as a miniature feature film, not a visual-effects demonstration. The camera should discover the world gradually. Start intimate. Reveal scale. Return to detail. Finish wide. The audience should feel that they are watching a real handcrafted world photographed with a cinema camera. Photorealistic 4K • tactile materials • feature-film cinematography • sophisticated lighting • realistic miniature photography • cinematic depth • precise camera movement • seamless visual continuity.", "models": ["GPT Image", "Seedance"], "uses": [], "styles": ["Cinematic", "Photorealistic"], "techs": ["Camera movement / shot language", "Transition / morph / match cut"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2088865943921528832/img/ACj33PYyBD5RI7qH.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2088865943921528832/img/ACj33PYyBD5RI7qH.jpg?name=small"], "n": 1, "dur": 30, "handle": "@ChillaiKalan__", "likes": 407, "saves": 409, "hv": true, "score": 95.3}, {"id": "2008 ate is giving a bonus to whoever—\" Instant snap zoom to Stanley. His head lifts. He takes off his glasses. Dead serious. STANLEY: \"I'm listening.\" MICHAEL (waving him off): \"—anyway. Moving on. Next topic. Prompt engineering.\" Snap zoom back to Stanley. He immediately puts his glasses back on, lowers his head, and returns to the crossword as if nothing happened. Cut to Jim, who slowly turns his head and looks directly into the camera lens with a flat, knowing expression. Hold for two seconds. STYLE: single-camera sitcom shot like a documentary crew is present, natural performances, no laugh track, muted office color palette, slightly soft consumer-camera look, characters occasionally glancing at the lens.", "models": [], "uses": [], "styles": [], "techs": ["Camera movement / shot language", "Lip sync / dialogue"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2084387230844346368/img/3q3PrcBYVZsGJ3lW.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2084387230844346368/img/3q3PrcBYVZsGJ3lW.jpg?name=small"], "n": 1, "dur": 15, "handle": "@Arminn_Ai", "likes": 446, "saves": 383, "hv": true, "score": 93.6}, {"id": "2085640281941307648", "slug": "montage-multi-shot-candid-observational-foot-2085640281941307648", "title": "Seven-shot handheld observational montage", "prompt": "Montage, multi-shot candid observational footage. Do not use a single camera angle or continuous take. Handheld documentary style with the feeling of accidental real-life capture. Slightly imperfect framing, subtle handheld shake, tiny reframing adjustments, gentle exposure breathing, and autofocus that settles half a beat late. Realistic skin texture, soft indoor natural light, film grain, shallow depth of field. Relaxed breathing, natural blinking, restrained and authentic performance. Total of 7 shots. The woman from @ Image 1 is wearing a matching cotton pajama set consisting of a scoop-neck sleeveless top and loose shorts made from the same fabric and design. Barefoot, she lies on her stomach across a lived-in, slightly messy bed in her bedroom, browsing a mobile shopping page on a black smartphone. A house cat jumps onto the bed seeking attention, and she affectionately plays with it. Moments later, a friend calls. She answers, chats, and eventually bursts into laughter. The doorbell rings, so she ends the call and gets up to collect her dinner. Shot 1 (0–2s): She is already moving. One thumb scrolls through a shopping page while she frowns slightly, thinking. She quietly mutters in Korean: \"아, 뭐 살랬더라…\" (\"Ah... what was I going to buy again?\"). Lips synchronize naturally. Her bare feet gently sway behind her. A low handheld camera glides along the edge of the mattress, with soft bedding partially obscuring the foreground. Shot 2 (2–4s): The house cat jumps onto the bed, compressing the blanket as it walks toward her forearm and lets out a single meow. The camera gives a slight jolt from the impact, then quickly reframes from the phone to an over-the-shoulder view that includes her face, hands, phone, and cat. Shot 3 (4–6s): She turns warmly toward the cat, stroking it once from its forehead to its shoulders. In a gentle, affectionate tone she says: \"우리 애기 왔어?\" (\"Did my baby come?\"). Lip sync is clear and natural. The camera pushes in briefly through the cat's softly blurred foreground toward her face and hand. Shot 4 (6–8s): A friend's ringtone sounds. She glances down, confirms the caller, swipes to answer, and brings the phone to her ear. The camera moves in a loose semicircle from a slightly tilted overhead angle, capturing the entire answering motion. Shot 5 (8–11s): Her friend begins talking. She responds first with confusion, then disbelief: \"어, 왜? 진짜 거짓말.\" (\"Huh? Why? No way, you're kidding.\"). Immediately afterward she naturally bursts into laughter. The cat kneads the blanket beside her. A close handheld side angle keeps both her phone and profile within the same focal plane. Shot 6 (11–13s): A clear doorbell interrupts the laughter. Both she and the cat turn toward the bedroom door. She braces one hand on the mattress to get up. The camera reacts a fraction too late, briefly turning toward the door before naturally correcting back to her rising movement. Shot 7 (13–15s): Still on the phone, she hurriedly says: \"어, 나 밥 왔다. 끊어.\" (\"My food's here. I'll hang up.\"). She ends the call with her thumb, gets off the bed, and walks toward the door while the cat follows across the blankets. The camera slides low beneath her elbow and tilts upward as she stands in one continuous motion. Sound: No music. Only raw production sound: bedding rustling, quiet breathing, finger taps on the phone, the soft impact of the cat jumping onto the bed, one natural meow, faint purring, a single short incoming ringtone, call connection tone, the friend's voice through the phone, the woman's four Korean lines with accurate lip sync, a genuine brief laugh, one clear doorbell, the tap ending the call, and soft cat footsteps. No subtitles, no on-screen text, no logo, no watermark. Never render a reference sheet or duplicate the subject.", "models": ["Seedance"], "uses": ["Food & beverage"], "styles": ["Photorealistic"], "techs": ["Camera movement / shot language", "Lip sync / dialogue", "Multi-shot / storyboard"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2085640247682224128/img/Wj08brZzXojtfWtv.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2085640247682224128/img/Wj08brZzXojtfWtv.jpg?name=small"], "n": 1, "dur": 15, "handle": "@oggii_0", "likes": 297, "saves": 232, "hv": true, "score": 93.6}, {"id": "2047862141894681076", "slug": "a-realistic-young-woman-sitting-casually-in--2047862141894681076", "title": "Bedroom phone recording, late afternoon light", "prompt": "A realistic young woman sitting casually in a softly lit bedroom during late afternoon. She is holding her phone very close to her face rief accidental face cropping, and imperfect framing throughout. The camera itself is never visible. LOOK: Warm analog tape texture with gentle film grain, softened sharpness, subtle halation where sunlight cuts between buildings, faint salt-air haze, realistic skin tones, low contrast, tiny exposure shifts, natural motion blur. Authentic everyday footage, not a polished commercial. STYLE: A quiet Mediterranean morning coffee-run vlog. Unhurried, warm, spontaneous. She talks to the camera in short sentences with comfortable pauses, reacts to the street around her, laughs easily. CHARACTER: ELENA — a Mediterranean woman in her mid-20s. Dark wavy hair in a loose bun, olive skin, minimal makeup, small gold hoops, oversized white linen shirt, denim shorts, leather sandals, canvas tote on one shoulder. SETTING: A sun-washed coastal old town just after sunrise. Narrow limestone alleys, pastel shutters, bougainvillea spilling over walls, glimpses of the sea between buildings, distant church bells and scooters, almost no people. A sleepy stray cat on a warm step. SCENES: The vlog opens in selfie mode as Elena steps out of the doorway into the bright alley, squinting. \"Morning.\" She walks, sunlight strobing between buildings across her face. \"Okay it's already hot. Of course it is.\" She reaches a tiny corner kiosk and orders an iced coffee, camera still handheld, framing half-wrong. She sets the camera on the counter ledge for a wide shot while she waits, drumming her fingers. A stray cat appears at her feet and stares up. She crouches down to it. \"Hi. You again.\" The cat rubs against her leg. She laughs. \"I have a bodyguard now.\" She picks the camera back up, coffee in the other hand, and walks toward the water, the cat trotting behind for a few steps. She sits on the low seawall, sea behind her, and takes the first sip. \"Worth it. Every time.\" She looks off at the water for a moment, hair moving in the breeze, then back to the lens. \"Okay. Work now.\" A small wave. \"See you later.\"", "models": ["Seedance"], "uses": ["Advertising", "Beauty", "Food & beverage", "UGC"], "styles": ["Photorealistic", "Retro / vintage"], "techs": ["Camera movement / shot language"], "subjects": [], "kind": "video", "img": "https://pbs.twimg.com/amplify_video_thumb/2087155707795607552/img/GvPt7yiUAlXPgSXk.jpg?name=small", "imgs": ["https://pbs.twimg.com/amplify_video_thumb/2087155707795607552/img/GvPt7yiUAlXPgSXk.jpg?name=small"], "n": 1, "dur": 15, "handle": "@PhedEU", "likes": 133, "saves": 160, "hv": false, "score": 83.9}, {"id": "2089932434351734933", "slug": "use-the-uploaded-reference-image-as-the-exac-2089932434351734933", "title": "Locked product and identity, outfit swapped", "prompt": "Use the uploaded reference image as the exact character and product reference. Preserve the woman’s facial identity, hairstyle, eye color, makeup, skin tone, body proportions, jewelry, and overall appearance consistently throughout the entire video. Change her outfit to a fitted sleeveless PINK top with clean WHITE shorts and keep the outfit identical in every shot. Use the uploaded sunglasses, earbuds, orange retail packaging, and carrying cases as LOCKED product references. Preserve their exact shapes, colors, materials, proportions, buttons, lenses, hinges, charging case, textures, and every visible product detail. Do not redesign, replace, or invent any product elements. Create an ultra-realistic UGC luxury lifestyle review filmed inside a modern luxury bedroom during warm golden hour. The woman is the clear visual focus, with authentic creator energy and natural expressions. Use warm sunlight coming through the bedroom windows, soft realistic shadows, natural skin texture, shallow depth of field, subtle handheld smartphone movement, realistic autofocus behavior, natural motion blur, and premium commercial-quality cinematography. Include a realistic cat naturally interacting with her only where specified, without distracting from the products. 0–5 s /* ── helpers ─────────────────────────────────────────────────────────── */
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const n = v => v == null ? "—" : v.toLocaleString("en-US");
const AXES = { models:"Model", uses:"Task", styles:"Style", techs:"Technique" };

/* The matrix has to be able to select "the records this axis does not
   describe" — 3 records name no model, 9 name no task. That is a real cell
   on the plate and the most interesting one, so it needs a filter value.
   A sentinel string keeps matches() one function instead of two. Asserted
   against the data at load: no model, task, style or technique is __none__. */
const NONE = "__none__";

const asList = (r, key) => Array.isArray(r[key]) ? r[key] : (r[key] == null ? [] : [r[key]]);
console.assert(!DATA.some(r => ["models","uses","styles","techs"].some(k => asList(r,k).includes(NONE))),
  "sentinel collides with a real taxonomy value");
function counts(key){
  const m = new Map();
  DATA.forEach(r => asList(r, key).forEach(v => m.set(v, (m.get(v)||0)+1)));
  return [...m].sort((a,b) => b[1]-a[1]);
}
const noneCount = key => DATA.filter(r => !asList(r, key).length).length;
/* One excerpt rule for every direction: the prompt's own first words, never a
   written summary. Raw-JSON prompts get excerpted the same way as prose. */
function excerpt(r, len){
  const s = r.prompt.replace(/\s+/g," ").trim();
  return s.length > len ? s.slice(0, len).replace(/\s\S*$/,"") + "…" : s;
}
/* Placeholders are marked structurally, on the ALREADY-ESCAPED string —
   neither brackets nor capitals are touched by escaping, so the offsets hold. */
const markPlaceholders = html => html.replace(/\[[A-Z][A-Z \-_\/]{2,}\]/g, m => `<mark>${m}</mark>`);

/* Filter state is shared across variants on purpose: flipping between
   directions keeps your query, so you compare the same result set. */
const state = { q:"", active:{models:[],uses:[],styles:[],techs:[],kind:[]}, sel:0 };

function matches(r){
  for (const k in state.active){
    const on = state.active[k];
    if (!on.length) continue;
    const has = on.some(v => v === NONE ? asList(r, k).length === 0 : asList(r, k).includes(v));
    if (!has) return false;
  }
  if (state.q){
    const q = state.q.toLowerCase();
    const hay = (r.title+" "+r.prompt+" "+r.models.join(" ")+" "+r.uses.join(" ")+" "+
                 r.styles.join(" ")+" "+r.techs.join(" ")+" "+(r.handle||"")).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
const results = () => DATA.filter(matches);
const activeRec = () => { const r = results(); return r.length ? r[Math.min(state.sel, r.length-1)] : null; };

function emptyState(){

}

/* The facet row, identical wherever it appears; only the container changes. */
function chipRow(perAxis){
  return Object.keys(AXES).flatMap(key =>
    counts(key).slice(0, perAxis).map(([v,c]) =>
      `<button class="chip" type="button" data-facet="${key}" data-value="${esc(v)}"
        aria-pressed="${state.active[key].includes(v)}">${esc(v)} <small>${c}</small></button>`)).join("");
}

/* One representative frame per tile, no picture used twice — a repeat would
   imply two different sets share a result. */
function repFrames(key){
  const used = new Set(), out = new Map();
  const tiles = counts(key).map(([v,c]) => ({
    v, c, srcs: DATA.filter(r => asList(r, key).includes(v) && r.img).map(r => r.img)
  })).sort((a,b) => a.srcs.length - b.srcs.length);
  tiles.forEach(t => {
    const pick = t.srcs.find(s => !used.has(s));
    if (pick){ used.add(pick); out.set(t.v, pick); }
  });
  return out;
}

function band(id, heading, key){
  const frames = repFrames(key);
  const items = counts(key).filter(([v]) => frames.has(v));
  return `<section class="sec" id="${id}"><div class="wrap">
    <div class="sec-h"><h2>${heading}</h2></div>
    <div class="tiles">${items.map(([v,c]) => `
      <a class="tile" href="#" data-facet="${key}" data-value="${esc(v)}">
        <span class="th"><img src="${esc(frames.get(v))}" alt="A prompt result from ${esc(v)}"
          loading="lazy" referrerpolicy="no-referrer" width="320" height="200"></span>
        <span class="tb"><h3>${esc(v)}</h3><p>${c} prompts</p></span>
      </a>`).join("")}</div>
  </div></section>`;
}

/* ══ V5 · Matrix — the diagram treatment ══════════════════════════════ */
/* The taxonomy drawn once, as a plate: models down, tasks across, cell shade
   = count. Clicking a cell sets both facets; a header sets one. Shade is a
   neutral mix of the page's own ink, never a hue. */
const MX_ROWS = () => [...counts("models").map(([v,c]) => [v,c]),
                       [NONE, noneCount("models")]].filter(([,c]) => c > 0);
const MX_COLS = () => [...counts("uses").map(([v,c]) => [v,c]),
                       [NONE, noneCount("uses")]].filter(([,c]) => c > 0);
const mxLabel = (v, axis) => v === NONE ? (axis === "models" ? "No model named" : "Unfiled") : v;
function mxCount(model, use){
  return DATA.filter(r => {
    const m = model === NONE ? !r.models.length : r.models.includes(model);
    const u = use === NONE ? !r.uses.length : r.uses.includes(use);
    return m && u;
  }).length;
}
function mxOn(axis, v){ return state.active[axis].length === 1 && state.active[axis][0] === v; }
function vmxTable(){
  const rows = MX_ROWS(), cols = MX_COLS();
  let peak = 1;
  rows.forEach(([m]) => cols.forEach(([u]) => { peak = Math.max(peak, mxCount(m,u)); }));
  const head = cols.map(([u,c]) => `<th scope="col">
      <button class="hbtn" type="button" data-mx-u="${esc(u)}"
        aria-pressed="${mxOn("uses",u) && !state.active.models.length}">${esc(mxLabel(u,"uses"))}
        <em>${c}</em></button></th>`).join("");
  const body = rows.map(([m,mc]) => `<tr>
      <th scope="row"><button class="hbtn" type="button" data-mx-m="${esc(m)}"
        aria-pressed="${mxOn("models",m) && !state.active.uses.length}">${esc(mxLabel(m,"models"))}
        <em>${mc}</em></button></th>
      ${cols.map(([u]) => {
        const c = mxCount(m,u);
        if (!c) return `<td><span class="nil"><span aria-hidden="true">·</span>
          <span class="vh">no prompts: ${esc(mxLabel(m,"models"))} and ${esc(mxLabel(u,"uses"))}</span></span></td>`;
        const d = (4 + (c / peak) * 11).toFixed(1);
        return `<td><button class="cel" type="button" style="--d:${d}%"
          data-mx-m="${esc(m)}" data-mx-u="${esc(u)}"
          aria-pressed="${mxOn("models",m) && mxOn("uses",u)}"
          aria-label="${c} prompt${c===1?"":"s"}: ${esc(mxLabel(m,"models"))} and ${esc(mxLabel(u,"uses"))}"
          >${c}</button></td>`;
      }).join("")}
    </tr>`).join("");
  return `<p class="mapnote" id="mx-note">Prompts per model and task. Shade is count; a dot is an
      intersection the library has nothing for. On a narrow screen the plate scrolls sideways.</p>
    <div class="map"><table aria-describedby="mx-note">
      <thead><tr><th scope="col" class="corner">Model ↓ &nbsp;/&nbsp; Task →</th>${head}</tr></thead>
      <tbody>${body}</tbody>
    </table></div>
    <p class="legend"><span>Fewer</span><span class="ramp" aria-hidden="true"><i style="--d:4%"></i><i style="--d:7.7%"></i><i style="--d:11.3%"></i><i style="--d:15%"></i></span><span>More</span>
      <span>Peak ${peak} prompts in one cell</span></p>`;
}
function vmxOut(){
  const rows = results();
  const label = (() => {
    const m = state.active.models, u = state.active.uses;
    const parts = [];
    if (m.length === 1) parts.push(mxLabel(m[0], "models"));
    if (u.length === 1) parts.push(mxLabel(u[0], "uses"));
    return parts.length ? parts.join(" × ") : "The whole library";
  })();
  if (!rows.length) return `<div class="sel"><h2>${esc(label)}</h2></div>${emptyState()}`;
  return `<div class="sel"><h2>${esc(label)}</h2>
      <p class="meta"><span>${rows.length} of ${DATA.length} prompts</span></p></div>
    <div class="out">${rows.map(r => `
      <article>
        <span class="sq">${r.img
          ? `<img src="${esc(r.img)}" alt="A result from ${esc(r.title)}" loading="lazy"
               referrerpolicy="no-referrer" width="260" height="260">`
          : `<span class="txt">${esc(excerpt(r, 220))}</span>`}</span>
        <h3>${esc(r.title)}</h3>
        <p class="meta"><span>${esc(r.handle||"unattributed")}</span><span><b>${n(r.likes)}</b> likes</span></p>
        <div><button class="btn" type="button" data-copy="${r.id}">Copy prompt</button></div>
      </article>`).join("")}</div>`;
}
function vmx(){
  return `<div class="vmx taste">${nav()}<main id="main">
    <section class="wrap head">
      <p class="eyebrow" style="margin-bottom:18px">The map</p>
      <h1 class="tier-index">The shape of the library</h1>
      <p class="dek prose">${DATA.length} prompts across ${counts("models").length} models and
        ${counts("uses").length} tasks, drawn once. The plate is the navigation: a cell filters
        both axes at the same time, a heading filters one.</p>
      <div class="search" style="margin-top:26px">
        <input id="q" type="search" placeholder="Search prompts, models, styles, creators…"
          aria-label="Search prompts" value="${esc(state.q)}">
      </div>
    </section>
    <section class="wrap mapwrap"><h2 class="vh">Model by task</h2>
      <div data-map>${vmxTable()}</div></section>
    <section class="wrap" id="results"><div data-results>${vmxOut()}</div></section>
    <div class="after">${tail()}</div>
  </main>${foot()}</div>`;
}

/* ── behaviour, delegated once so the picker wiring stays verbatim ───── */
const variants = [vch, vme, vfr, vst, vmx];
const stage = document.getElementById('stage');

/* classList.item(0), NOT className: every variant root carries a second class
   (`class="vch taste"`), so a className equality test misses every time and
   redraw() becomes a silent no-op — filtering that looks wired and is dead.
   That bug shipped once in the file this picker was ported from. */
const kind = () => (stage.firstElementChild ? stage.firstElementChild.classList.item(0) : "");
function put(sel, html){ const el = stage.querySelector(sel); if (el) el.innerHTML = html; }

function redraw(){
  const c = kind();
  if (c === "vch") put('[data-results]', vchChapters());
  else if (c === "vme") put('[data-results]', vmeIndex());
  else if (c === "vfr"){
    put('[data-side]', vfrSide()); put('[data-grid]', vfrGrid());
    const path = stage.querySelector('[data-path]'); if (path) path.textContent = vfrPath();
    put('[data-results]', vfrList());
  }
  else if (c === "vst") put('[data-results]', vstEntries());
  else if (c === "vmx"){ put('[data-map]', vmxTable()); put('[data-results]', vmxOut()); }
}
/* Selecting a frame in the app must not rebuild 35 images under the pointer,
   so the grid is patched in place and only the caption re-renders. */
function reselect(){
  const rows = results(), sel = Math.min(state.sel, Math.max(rows.length-1, 0));
  stage.querySelectorAll('.vfr .cell').forEach((c,i) => c.setAttribute('aria-pressed', String(i === sel)));
  put('[data-results]', vfrList());
}

stage.addEventListener('click', e => {
  const copy = e.target.closest('[data-copy]');
  if (copy){
    const r = DATA.find(x => x.id === copy.getAttribute('data-copy'));
    const label = copy.getAttribute('data-label') || copy.textContent.trim();
    copy.setAttribute('data-label', label);
    const done = () => {
      copy.textContent = 'Copied';
      copy.setAttribute('data-copied','');
      setTimeout(() => { copy.textContent = label; copy.removeAttribute('data-copied'); }, 1500);
    };
    if (navigator.clipboard) navigator.clipboard.writeText(r.prompt).then(done, done); else done();
    return;
  }
  /* The matrix sets two axes at once, exclusively — that is the whole point of
     an intersection. A header sets one axis and clears the other. */
  const mx = e.target.closest('[data-mx-m],[data-mx-u]');
  if (mx){
    const m = mx.getAttribute('data-mx-m'), u = mx.getAttribute('data-mx-u');
    const already = mx.getAttribute('aria-pressed') === 'true';
    state.active.models = (already || m == null) ? [] : [m];
    state.active.uses   = (already || u == null) ? [] : [u];
    state.sel = 0;
    redraw();
    return;
  }
  const expand = e.target.closest('[data-expand]');
  if (expand){
    const entry = expand.closest('.entry');
    const open = !entry.hasAttribute('data-open');
    entry.toggleAttribute('data-open', open);
    expand.setAttribute('aria-expanded', String(open));
    const closed = expand.getAttribute('data-label-closed') || expand.textContent.trim();
    expand.setAttribute('data-label-closed', closed);
    expand.textContent = open ? expand.getAttribute('data-label-open') : closed;
    return;
  }
  const facet = e.target.closest('[data-facet]');
  if (facet){
    e.preventDefault();
    const k = facet.getAttribute('data-facet'), v = facet.getAttribute('data-value');
    const on = state.active[k];
    const i = on.indexOf(v);
    if (i < 0) on.push(v); else on.splice(i,1);
    state.sel = 0;
    stage.querySelectorAll(`.chip[data-facet="${k}"][data-value="${CSS.escape(v)}"]`)
      .forEach(c => c.setAttribute('aria-pressed', String(i < 0)));
    redraw();
    return;
  }
  if (e.target.closest('[data-clear]')){
    state.q = ""; state.sel = 0;
    Object.keys(state.active).forEach(k => state.active[k] = []);
    stage.querySelectorAll('.chip[data-facet]').forEach(c => c.setAttribute('aria-pressed','false'));
    const q = stage.querySelector('#q'); if (q) q.value = "";
    redraw();
    return;
  }
  const sel = e.target.closest('[data-sel]');
  if (sel){ state.sel = +sel.getAttribute('data-sel'); reselect(); }
});

/* Tabbing the app grid walks the caption with you; it is never hover-only. */
stage.addEventListener('focusin', e => {
  const cell = e.target.closest('.vfr .cell[data-sel]');
  if (!cell) return;
  const i = +cell.getAttribute('data-sel');
  if (i === state.sel) return;
  state.sel = i;
  reselect();
});

let tm;
stage.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  clearTimeout(tm);
  tm = setTimeout(() => { state.q = e.target.value.trim(); state.sel = 0; redraw(); }, 300);
});

/* j/k step the app frame's grid; left/right belong to the picker. */
document.addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (kind() !== 'vfr') return;
  if (e.key !== 'j' && e.key !== 'k') return;
  const cells = stage.querySelectorAll('.vfr .cell');
  if (!cells.length) return;
  const i = e.key === 'j' ? Math.min(state.sel + 1, cells.length - 1) : Math.max(state.sel - 1, 0);
  state.sel = i;
  cells[i].focus();
  reselect();
});
</script>

<script>
/* ─── Picker wiring · verbatim from PICKER.md ──────────────────────────── */
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  const paint = () => { stage.innerHTML = variants[i](); };
  if (document.hidden) setTimeout(paint, 0);
  else requestAnimationFrame(paint);
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>

<script>
/* ─── Linear dark theme · toggle ────────────────────────────────────────
   The sibling pickers also carry an iframe reach-in, because their variant 1
   is the shipped page inside <iframe srcdoc> and a parent stylesheet does not
   cross that boundary. This picker has NO shipped baseline — all five
   directions are designed pages in this document — so there is no iframe to
   reach into and that code is not carried here. If a baseline is ever added,
   the reach-in has to come with it. */
const themeBtn = document.getElementById('theme-toggle');
const root = document.documentElement;

function setTheme(on, { persist = true } = {}){
  if (on) root.setAttribute('data-theme', 'linear-dark');
  else root.removeAttribute('data-theme');
  themeBtn.setAttribute('aria-pressed', String(on));
  if (persist){
    const url = new URL(location);
    if (on) url.searchParams.set('theme', 'linear-dark');
    else url.searchParams.delete('theme');
    history.replaceState(null, '', url);
  }
}

themeBtn.addEventListener('click', () => setTheme(!root.hasAttribute('data-theme')));
setTheme(new URLSearchParams(location.search).get('theme') === 'linear-dark', { persist: false });
</script>
