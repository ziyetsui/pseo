[project]
name = "pseo-backend"
version = "0.1.0"
description = "Typed read-only API for the pSEO internal-beta catalog"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115.0,<1",
  "pydantic>=2.10.0,<3",
  "pydantic-settings>=2.7.0,<3",
  "uvicorn>=0.30.0,<1",
]

[project.scripts]
pseo-openapi = "pseo.openapi:main"
pseo-worker-bundle = "pseo.cloudflare_bundle:main"

[dependency-groups]
dev = [
  "httpx>=0.27.0,<1",
  "mypy>=1.14.0,<2",
  "pytest>=8.3.0,<10",
  "pytest-cov>=6.0.0,<8",
  "ruff>=0.9.0,<1",
  "workers-py>=1.17.1,<2",
  "workers-runtime-sdk>=1.6.8,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pseo"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S", "SIM"]
ignore = ["S101"]
allowed-confusables = ["，"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pseo"]

[tool.coverage.report]
fail_under = 90
show_missing = true
