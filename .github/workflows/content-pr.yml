name: Content PR gates

on:
  pull_request:
    branches:
      - main
    paths:
      - "content/**"
      - "schemas/**"
      - "infra/**"
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  content-schema-locale-links:
    name: content-schema / locale-slug / links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Strict schema, locale, slug, and link validation
        run: node infra/bin/content.mjs validate
      - name: Golden, conflict, stale-locale, and Preview tests
        run: node --test infra/tests/*.test.mjs
      - name: Generate static indexes, RSS, and Sitemap
        run: node infra/bin/content.mjs build
      - name: Upload deterministic static-content artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-content-${{ github.sha }}
          path: infra/generated/static
          if-no-files-found: error
          retention-days: 3

  frontend-build-a11y-smoke:
    name: frontend build / a11y smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Lint
        run: pnpm --dir frontend lint
      - name: Typecheck
        run: pnpm --dir frontend typecheck
      - name: Unit and accessibility-contract tests
        run: pnpm --dir frontend test
      - name: Static export
        run: pnpm --dir frontend build

  backend-contract:
    name: backend contract / tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependency groups
        run: uv sync --project backend --all-groups
      - name: Lint and typecheck
        run: |
          uv run --project backend ruff check backend
          uv run --project backend mypy --config-file backend/pyproject.toml backend/src
      - name: API and OpenAPI contract tests
        run: uv run --project backend pytest backend/tests
